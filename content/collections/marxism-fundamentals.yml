      - document:marx:1865:value-price-profit:ch02
      - document:marx:1865:value-price-profit:ch03
  - title: "Stage 3: Historical Materialism & Methodological Ascent to Capital"
    description: "Systematic consolidation of scientific socialism, the guiding thread of historical materialism, and Marx's dialectical method of ascending from the abstract to the concrete."
