      - document:marx:1845:theses-on-feuerbach:theses
  - title: "Stage 2: Core Political Economy Mechanics"
    description: "Essential concepts of wage labour, capital accumulation, value, and surplus value explained in accessible terms for workers."
    items:
      - document:marx:1849:wage-labour-and-capital:ch01
      - document:marx:1849:wage-labour-and-capital:ch02
      - document:marx:1849:wage-labour-and-capital:ch03
