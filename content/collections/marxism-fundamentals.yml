rationale: "Suggested pedagogical path for readers who want to understand Das Kapital through Marx and Engels's own writings rather than third-party textbooks. Chapters I, II, and IV of the Manifesto establish the core concepts of class struggle, historical materialism, and the working-class program. Value, Price and Profit provides the essential bridge to political economy by explaining the source of value, wages, and surplus value in plain terms."
