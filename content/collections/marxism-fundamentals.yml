rationale: "A primary-source pedagogical progression designed to prepare readers for Das Kapital without reliance on third-party textbooks. Explore the questions below for why each stage and text was selected."
faq:
  - q: "Why start with Principles of Communism instead of diving straight into The Communist Manifesto?"
    a: "The Principles of Communism was written by Engels as a straightforward catechism of 25 direct questions and answers for working-class militants. It defines fundamental terms—what the proletariat is, how it arose, and how machinery affects wages—without the dense historical rhetoric and literary polemics of the Manifesto. Reading it first equips newcomers with immediate clarity on core definitions before engaging the Manifesto's sweeping prose."
  - q: "Why place Theses on Feuerbach in Stage 1 right after the Manifesto rather than at the end?"
    a: "The Theses on Feuerbach (1845) form the philosophical turning point of historical materialism. Marx breaks definitively with contemplative materialism (Feuerbach) and idealism (Hegel) by identifying human sensuous activity—revolutionary praxis—as the ultimate criterion of truth. Placing it here makes clear that the class struggle analyzed in the Manifesto is not an automatic mechanical law of physics, but collective human practice transforming material conditions."
  - q: "Why are Wage Labour and Capital and Value, Price and Profit essential before Das Kapital?"
    a: "Das Kapital assumes the reader already understands the core dynamics of exploitation. Marx delivered these two shorter works directly to working-class audiences in 1847 and 1865. They establish the crucial economic foundations: why wages represent the price of labour-power rather than labour itself, how prices fluctuate around values determined by socially necessary labour time, and why capitalist profits inherently derive from unpaid surplus labour."
  - q: "Why is Socialism: Utopian and Scientific positioned in Stage 3?"
    a: "Written by Engels in 1880, this work provides the macroscopic historical overview of scientific socialism. It explains why earlier socialist thinkers (Saint-Simon, Fourier, Owen) remained utopian: they viewed socialism as an abstract moral ideal discovered by a genius, rather than the necessary historical outcome of the conflict between socialized production and private capitalist appropriation. This perspective grounds the systemic production relations analyzed in Capital."
  - q: "What is the methodological role of the 1859 Preface and the 1857 Introduction?"
    a: "The 1859 Preface famously articulates the 'guiding thread' of historical materialism: how the economic structure conditions legal and political superstructures, and how social revolutions erupt when productive forces outgrow existing property relations. The 1857 Introduction (Einleitung) is Marx's masterpiece on dialectical method: it explains why scientific critique must ascend from simple abstract categories (value, money) to the concrete reproduction of society as a rich totality. Grasping this method is indispensable for navigating the dialectical architecture of Capital."
  - q: "Can I skip straight to Das Kapital without reading this preparatory path?"
    a: "Many readers begin directly with Chapter 1 of Capital (The Commodity) and quickly get discouraged by its dense dialectical analysis of the value-form. Reading this preparatory sequence establishes historical, philosophical, and economic intuition in Marx and Engels's own accessible words. By the time you open Capital, its opening concepts feel like the rigorous culmination of ideas you already understand, rather than an impenetrable barrier."
