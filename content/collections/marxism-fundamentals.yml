rationale: "Suggested pedagogical path for readers who want to understand Das Kapital through Marx and Engels's own writings rather than third-party textbooks. The sequence begins with Engels's accessible catechism in Principles of Communism and the Manifesto's historical sweep (Chapters I, II, IV). It then walks through the core economic mechanics in Wage Labour and Capital and Value, Price and Profit, before consolidating the dialectical method in Socialism: Utopian and Scientific, the foundational 1859 Preface, and the Theses on Feuerbach."
