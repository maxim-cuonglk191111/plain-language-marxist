rationale: "Suggested pedagogical path for readers who want to understand Das Kapital through Marx and Engels's own writings rather than third-party textbooks. The sequence is organized into three progressive stages: Stage 1 introduces the class struggle and materialist praxis through Principles of Communism, the Manifesto, and the Theses on Feuerbach. Stage 2 develops the economic mechanics of commodities, wages, and surplus value in Wage Labour and Capital and Value, Price and Profit. Stage 3 consolidates historical materialism in Socialism: Utopian and Scientific, the foundational 1859 Preface, and the 1857 Introduction, which outlines the ascent from the abstract to the concrete indispensable for reading Capital."
