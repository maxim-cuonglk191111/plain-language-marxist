id: marxism-fundamentals
title: "Marxism Fundamentals: Road to Capital"
description: "A three-stage primary-source reading path establishing revolutionary praxis, core political economy, and dialectical method before Capital."
stages:
  - title: "Stage 1: History & Revolutionary Praxis"
    description: "Foundational texts establishing the historical emergence of the proletariat, class struggle, and the materialist conception of practice."
    items:
      - document:engels:1847:principles-of-communism:prin-com
      - document:marx:1848:communist-manifesto:ch01
