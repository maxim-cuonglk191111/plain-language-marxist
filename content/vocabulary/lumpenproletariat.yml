schema_version: 3
term: lumpenproletariat
original:
  sg: lumpenproletariat
definition:
  short: The poorest people outside regular work, such as beggars and petty criminals. Marx and Engels saw them as politically unreliable.
  long: |-
    Pronounced LOOM-pen-proh-luh-TAIR-ee-uht (/ˌlʊmpənproʊlɪˈtɛəriət/).

    “Lumpen” is German for rags. The lumpenproletariat are people who have fallen out of any stable place in production. They have no regular work and live from day to day.

    The Manifesto says a revolution may sometimes sweep them along. But it warns that their conditions make them far more likely to be bribed by reactionaries.

    The word in square brackets was added by the transcribers next to Moore’s “dangerous class”. It is the word used in the German text.
example:
  document: document:marx:1848:communist-manifesto:ch01
  passage: p00054
  text: that passively rotting mass thrown off by the lowest layers of the old society
not_to_confuse: It is not the proletariat. Workers live by selling their labour for wages. The lumpenproletariat lives outside regular wage work.
related: [proletariat]
renderings:
  keep:
    forms:
      sg: lumpenproletariat
    reason: Historical term with no exact modern equivalent. Kept as written; the term card explains it.
default: keep
