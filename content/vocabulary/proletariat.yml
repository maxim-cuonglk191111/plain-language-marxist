schema_version: 1
term: proletariat
original:
  sg: proletariat
  pl: proletarians
  adj: proletarian
definition:
  short: The class of modern wage labourers who, having no means of production of their own, are reduced to selling their labour power in order to live.
  long: Engels's own definition, added to the 1888 English edition.
  sources:
    - title: Manifesto of the Communist Party, English edition, note by Engels
      author: Frederick Engels
      year: 1888
renderings:
  working-class:
    forms:
      sg: working class
      pl: workers
      adj: working-class
    reason: The everyday English name for the same class.
    limitation: "\"Working class\" is often used loosely today; the Manifesto's sense is specifically those who must sell their labour power to live."
  proletariat:
    forms:
      sg: proletariat
      pl: proletarians
      adj: proletarian
    reason: Keeps the original term.
default: working-class
