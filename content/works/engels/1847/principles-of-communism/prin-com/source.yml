passages:
  - id: p00001
    type: heading
    level: 1
    text: The Principles of Communism
    hash: sha256:bc33ada92b3d5820aa4263c088fab7854e1df4d5b8c94916ca57d4742458d087
    state: active
  - id: p00002
    type: heading
    level: 4
    text: — 1 —<br/>What is Communism?
    hash: sha256:d379b0fa63241db057705f75f234e4501ecd3027292df433076130cb6f1f1a12
    state: active
  - id: p00003
    type: paragraph
    text: Communism is the doctrine of the conditions of the liberation of the proletariat.
    hash: sha256:4108976452aa22e6a55355232bfdea7af7f310f7ccbff6ab99ee15a767200537
    state: active
  - id: p00004
    type: heading
    level: 4
    text: — 2 —<br/>What is the proletariat?
    hash: sha256:54b552a1c2a87cc2d81acd2e79d4a750c699379a8973f0f8f95d984d5d5b96fa
    state: active
  - id: p00005
    type: paragraph
    text: The proletariat is that class in society which lives entirely from the sale of its labor and does not draw profit from any kind of capital; whose weal and woe, whose life and death, whose sole existence depends on the demand for labor – hence, on the changing state of business, on the vagaries of unbridled competition. The proletariat, or the class of proletarians, is, in a word, the working class of the 19th century.<fn ref="1"/>
    hash: sha256:bba895a25e0bb56f0a52bb9a8df7f1d8dafc4378f3fa92f83bf6eda724c10507
    state: active
  - id: p00006
    type: heading
    level: 4
    text: — 3 —<br/>Proletarians, then, have not always existed?
    hash: sha256:d6b6436f1cf78ad81b49959612b4588a2b4691f392d355e5db913be889058117
    state: active
  - id: p00007
    type: paragraph
    text: No. There have always been poor and working classes; and the working class have mostly been poor. But there have not always been workers and poor people living under conditions as they are today; in other words, there have not always been proletarians, any more than there has always been free unbridled competitions.
    hash: sha256:43ad7225659255752cbfa209f0aa041228891bfd569403a461fbc8f3311abec0
    state: active
  - id: p00008
    type: heading
    level: 4
    text: — 4 —<br/>How did the proletariat originate?
    hash: sha256:094cce96673f0c61148255510eb42dbdb2cd1998941c5e5375655001a261a07c
    state: active
  - id: p00009
    type: paragraph
    text: The Proletariat originated in the industrial revolution, which took place in England in the last half of the last (18th) century, and which has since then been repeated in all the civilized countries of the world.
    hash: sha256:d022be937fcc1515f22d0b565ab73c371210bc58a53ca7f179be554805cb165f
    state: active
  - id: p00010
    type: paragraph
    text: This industrial revolution was precipitated by the discovery of the steam engine, various spinning machines, the mechanical loom, and a whole series of other mechanical devices. These machines, which were very expensive and hence could be bought only by big capitalists, altered the whole mode of production and displaced the former workers, because the machines turned out cheaper and better commodities than the workers could produce with their inefficient spinning wheels and handlooms. The machines delivered industry wholly into the hands of the big capitalists and rendered entirely worthless the meagre property of the workers (tools, looms, etc.). The result was that the capitalists soon had everything in their hands and nothing remained to the workers. This marked the introduction of the factory system into the textile industry.
    hash: sha256:9b406b99783f8fe84a15239af32f3cec84b823dd1e81dafaa45c058787f553c9
    state: active
  - id: p00011
    type: paragraph
    text: Once the impulse to the introduction of machinery and the factory system had been given, this system spread quickly to all other branches of industry, especially cloth- and book-printing, pottery, and the metal industries.
    hash: sha256:ef3e4ae5a1e7d7262c02046763c5a995cff68e889b99a7c62988aab2d1ea84a3
    state: active
  - id: p00012
    type: paragraph
    text: Labor was more and more divided among the individual workers so that the worker who previously had done a complete piece of work now did only a part of that piece. This division of labor made it possible to produce things faster and cheaper. It reduced the activity of the individual worker to simple, endlessly repeated mechanical motions which could be performed not only as well but much better by a machine. In this way, all these industries fell, one after another, under the dominance of steam, machinery, and the factory system, just as spinning and weaving had already done.
    hash: sha256:f56d358a1eb58cd401abacaa30640a6bfc6cfea6e48d66b56c2d037b3e6341aa
    state: active
  - id: p00013
    type: paragraph
    text: But at the same time, they also fell into the hands of big capitalists, and their workers were deprived of whatever independence remained to them. Gradually, not only genuine manufacture but also handicrafts came within the province of the factory system as big capitalists increasingly displaced the small master craftsmen by setting up huge workshops, which saved many expenses and permitted an elaborate division of labor.
    hash: sha256:6084d4f123d41bf17db2e948694db1b3061caec48696d725acb1acba0b8ae1b3
    state: active
  - id: p00014
    type: paragraph
    text: "This is how it has come about that in civilized countries at the present time nearly all kinds of labor are performed in factories – and, in nearly all branches of work, handicrafts and manufacture have been superseded. This process has, to an ever greater degree, ruined the old middle class, especially the small handicraftsmen; it has entirely transformed the condition of the workers; and two new classes have been created which are gradually swallowing up all the others. These are:"
    hash: sha256:6b20afdb5cbf1d8ef2414d41a859e3acbd7a321b931ef490c71a1a0a0de9f3a7
    state: active
  - id: p00015
    type: paragraph
    text: <indent level="1"/>(i) The class of big capitalists, who, in all civilized countries, are already in almost exclusive possession of all the means of subsistance and of the instruments (machines, factories) and materials necessary for the production of the means of subsistence. This is the bourgeois class, or the bourgeoisie.
    hash: sha256:d2d587ef21615f7642e422997d1fd767e9ffb2671e6ec6bcbfcda2ef63335bb5
    state: active
  - id: p00016
    type: paragraph
    text: <indent level="1"/>(ii) The class of the wholly propertyless, who are obliged to sell their labor to the bourgeoisie in order to get, in exchange, the means of subsistence for their support. This is called the class of proletarians, or the proletariat.
    hash: sha256:ff6ff79338ebe2a8c74cc7b7cb604eff88f14db251b1a30b68e26e15419acc0c
    state: active
  - id: p00017
    type: heading
    level: 4
    text: — 5 —<br/>Under what conditions does this sale of the<br/>labor of the proletarians to the bourgeoisie take place?
    hash: sha256:d3fea2d896fce0c64233fe4986c81f964df088df16ab25d8ef45efbf795d977a
    state: active
  - id: p00018
    type: paragraph
    text: Labor is a commodity, like any other, and its price is therefore determined by exactly the same laws that apply to other commodities. In a regime of big industry or of free competition – as we shall see, the two come to the same thing – the price of a commodity is, on the average, always equal to its cost of production. Hence, the price of labor is also equal to the cost of production of labor.
    hash: sha256:076bb91a16950e43a8b53a02b2ea7f299d9ff3c54edb897cf63ad1de13855e8a
    state: active
  - id: p00019
    type: paragraph
    text: But, the costs of production of labor consist of precisely the quantity of means of subsistence necessary to enable the worker to continue working, and to prevent the working class from dying out. The worker will therefore get no more for his labor than is necessary for this purpose; the price of labor, or the wage, will, in other words, be the lowest, the minimum, required for the maintenance of life.
    hash: sha256:f54ff3e7989826bf19bdd1f5b5862c746639ec7b233dab12553eeeb28c8c1766
    state: active
  - id: p00020
    type: paragraph
    text: However, since business is sometimes better and sometimes worse, it follows that the worker sometimes gets more and sometimes gets less for his commodities. But, again, just as the industrialist, on the average of good times and bad, gets no more and no less for his commodities than what they cost, similarly on the average the worker gets no more and no less than his minimum.
    hash: sha256:f927ff0f6d97e6327c8321d0763293eb71a1f77f438a9549651128fe4f7a7d29
    state: active
  - id: p00021
    type: paragraph
    text: This economic law of wages operates the more strictly the greater the degree to which big industry has taken possession of all branches of production.
    hash: sha256:6e13fca764cffe42d7da67b04a20f8e514a0dbb0992a65ac93c56bf7f87870f5
    state: active
  - id: p00022
    type: heading
    level: 4
    text: — 6 —<br/>What working classes were there before the industrial revolution?
    hash: sha256:d33e7d9041f3ea564d8bd9de6d9ad34502af46351b0ecc961b157ed580b476b0
    state: active
  - id: p00023
    type: paragraph
    text: The working classes have always, according to the different stages of development of society, lived in different circumstances and had different relations to the owning and ruling classes.
    hash: sha256:dd315fcb7a7a591758f2014166cb57f179f380975056976ff0781afc6d5bf5c5
    state: active
  - id: p00024
    type: paragraph
    text: In antiquity, the workers were the slaves of the owners, just as they still are in many backward countries and even in the southern part of the United States.
    hash: sha256:d277103b47e997810c65d71c5ca22afa61bf53c1beee63f7f10e06d56d37189e
    state: active
  - id: p00025
    type: paragraph
    text: In the Middle Ages, they were the serfs of the land-owning nobility, as they still are in Hungary, Poland, and Russia. In the Middle Ages, and indeed right up to the industrial revolution, there were also journeymen in the cities who worked in the service of petty bourgeois masters. Gradually, as manufacture developed, these journeymen became manufacturing workers who were even then employed by larger capitalists.
    hash: sha256:5c4149c07cdbc2cd315747c9eb2d9b1448784d7e0155b981373e244c6b1d3521
    state: active
  - id: p00026
    type: heading
    level: 4
    text: — 7 —<br/>In what way do proletarians differ from slaves?
    hash: sha256:ab43bdb502049a40c7ada919bfe577b55bae96b994e89f34bcdbb090dca719c6
    state: active
  - id: p00027
    type: paragraph
    text: The slave is sold once and for all; the proletarian must sell himself daily and hourly.
    hash: sha256:87c9a490c1254b8bbaf25d5c1141f6c8fa91b48d75465d178bd4193fc8d624b5
    state: active
  - id: p00028
    type: paragraph
    text: The individual slave, property of one master, is assured an existence, however miserable it may be, because of the master’s interest. The individual proletarian, property as it were of the entire bourgeois class which buys his labor only when someone has need of it, has no secure existence. This existence is assured only to the class as a whole.
    hash: sha256:bad720dc4a2c2e98930cafc03a3b6c268445febe72bc6a0a782f33a318fbdbcd
    state: active
  - id: p00029
    type: paragraph
    text: The slave is outside competition; the proletarian is in it and experiences all its vagaries.
    hash: sha256:7fda270d68fd3d44ddea3488cf7e449f5a2571a8ee69e9546de7d354a8589277
    state: active
  - id: p00030
    type: paragraph
    text: The slave counts as a thing, not as a member of society. Thus, the slave can have a better existence than the proletarian, while the proletarian belongs to a higher stage of social development and, himself, stands on a higher social level than the slave.
    hash: sha256:08fd5267a421e5685de26adfd059f100d093cedfcbbfab7f25956060b16edf61
    state: active
  - id: p00031
    type: paragraph
    text: The slave frees himself when, of all the relations of private property, he abolishes only the relation of slavery and thereby becomes a proletarian; the proletarian can free himself only by abolishing private property in general.
    hash: sha256:dd28d75aa396b544ac0f2e18b824f3531b681e2af0aa3244004913fd7e8e612a
    state: active
  - id: p00032
    type: heading
    level: 4
    text: — 8 —<br/>In what way do proletarians differ from serfs?
    hash: sha256:8c1cc5f29513727d6ceef807c47091a89b8161b740a68bf4cc6fa5fde2904da3
    state: active
  - id: p00033
    type: paragraph
    text: The serf possesses and uses an instrument of production, a piece of land, in exchange for which he gives up a part of his product or part of the services of his labor.
    hash: sha256:829cf5f722d1a7442501eeab2ea8f8b050128d787eb6985dca5854700ca878f6
    state: active
  - id: p00034
    type: paragraph
    text: The proletarian works with the instruments of production of another, for the account of this other, in exchange for a part of the product.
    hash: sha256:6ffc491016fe2a920f0c18443646bd8611d6af98ece8376aacad2cebd1509410
    state: active
  - id: p00035
    type: paragraph
    text: The serf gives up, the proletarian receives. The serf has an assured existence, the proletarian has not. The serf is outside competition, the proletarian is in it.
    hash: sha256:2ceff4081d5101e619a46ea6cde2b5369ca9f49289014fd66f9c3b69e066841c
    state: active
  - id: p00036
    type: paragraph
    text: "The serf liberates himself in one of three ways: either he runs away to the city and there becomes a handicraftsman; or, instead of products and services, he gives money to his lord and thereby becomes a free tenant; or he overthrows his feudal lord and himself becomes a property owner. In short, by one route or another, he gets into the owning class and enters into competition. The proletarian liberates himself by abolishing competition, private property, and all class differences."
    hash: sha256:469ca2ce51c196bfacca28592728d9029825b754ffd3aa0b301be6324d6d5669
    state: active
  - id: p00037
    type: heading
    level: 4
    text: — 9 —<br/>In what way do proletarians differ from handicraftsmen?
    hash: sha256:9e282c31ad91491056390626b890a53a882977819931836b01f10b5d058c564e
    state: active
  - id: p00038
    type: paragraph
    text: In contrast to the proletarian, the so-called handicraftsman, as he still existed almost everywhere in the past (eighteenth) century and still exists here and there at present, is a proletarian at most temporarily. His goal is to acquire capital himself wherewith to exploit other workers. He can often achieve this goal where guilds still exist or where freedom from guild restrictions has not yet led to the introduction of factory-style methods into the crafts nor yet to fierce competition. But as soon as the factory system has been introduced into the crafts and competition flourishes fully, this perspective dwindles away and the handicraftsman becomes more and more a proletarian. The handicraftsman therefore frees himself by becoming either bourgeois or entering the middle class in general, or becoming a proletarian because of competition (as is now more often the case). In which case he can free himself by joining the proletarian movement, i.e., the more or less communist movement. [2]
    hash: sha256:1f213b7367ef7b3e5ee56048ad5d73dd59c67c13fb9856b6cec3a5ddd5b3b86b
    state: active
  - id: p00039
    type: heading
    level: 4
    text: — 10 —<br/>In what way do proletarians differ from manufacturing workers?
    hash: sha256:414d95d667aea0f45e76e1ac94bea0f3f1ce7e534f7d60df10aade36ab768ade
    state: active
  - id: p00040
    type: paragraph
    text: The manufacturing worker of the 16th to the 18th centuries still had, with but few exception, an instrument of production in his own possession – his loom, the family spinning wheel, a little plot of land which he cultivated in his spare time. The proletarian has none of these things.
    hash: sha256:c1012f806d835baa67fbaa12ad3d2a6d2d7f44e3c7e2b5fcd0c337980619dab6
    state: active
  - id: p00041
    type: paragraph
    text: The manufacturing worker almost always lives in the countryside and in a more or less patriarchal relation to his landlord or employer; the proletarian lives, for the most part, in the city and his relation to his employer is purely a cash relation.
    hash: sha256:f0344413f481c882953487394f1485487cde9468f137ea9c3030152311301c91
    state: active
  - id: p00042
    type: paragraph
    text: The manufacturing worker is torn out of his patriarchal relation by big industry, loses whatever property he still has, and in this way becomes a proletarian.
    hash: sha256:b2fde090940e68e4adcc1df2244ff27534c10ba735a483079bab70e14e0a0ab7
    state: active
  - id: p00043
    type: heading
    level: 4
    text: — 11 —<br/>What were the immediate consequences of the industrial revolution and of the division of society into bourgeoisie and proletariat?
    hash: sha256:b4e422d000048ae548315d7cd3c84dca136ecc3dcee5fcd8c8ecaed01775b333
    state: active
  - id: p00044
    type: paragraph
    text: First, the lower and lower prices of industrial products brought about by machine labor totally destroyed, in all countries of the world, the old system of manufacture or industry based upon hand labor.
    hash: sha256:bf4ec1cb222942ef1ca5699172000f882f5b48429f87e1867678ed929ee81dac
    state: active
  - id: p00045
    type: paragraph
    text: In this way, all semi-barbarian countries, which had hitherto been more or less strangers to historical development, and whose industry had been based on manufacture, were violently forced out of their isolation. They bought the cheaper commodities of the English and allowed their own manufacturing workers to be ruined. Countries which had known no progress for thousands of years – for example, India – were thoroughly revolutionized, and even China is now on the way to a revolution.
    hash: sha256:afa912cc06deb317ac7dfe4c29dc37d317ed4a19aa648a1b5573e1d3d379d9aa
    state: active
  - id: p00046
    type: paragraph
    text: We have come to the point where a new machine invented in England deprives millions of Chinese workers of their livelihood within a year’s time.
    hash: sha256:208fa71a90a7d29cf5e183f0974a23c46cf330101ae47c3441ae0035807051db
    state: active
  - id: p00047
    type: paragraph
    text: In this way, big industry has brought all the people of the Earth into contact with each other, has merged all local markets into one world market, has spread civilization and progress everywhere and has thus ensured that whatever happens in civilized countries will have repercussions in all other countries.
    hash: sha256:9cec8addb63bca65e4360d070fd2ce6e4b3fe7b7419057924cc67bc192a95c39
    state: active
  - id: p00048
    type: paragraph
    text: It follows that if the workers in England or France now liberate themselves, this must set off revolution in all other countries – revolutions which, sooner or later, must accomplish the liberation of their respective working class.
    hash: sha256:2464364053eed1d95476ca004c6f3e88aead1632c6aa88ce81ed0682a17ba662
    state: active
  - id: p00049
    type: paragraph
    text: Second, wherever big industries displaced manufacture, the bourgeoisie developed in wealth and power to the utmost and made itself the first class of the country. The result was that wherever this happened, the bourgeoisie took political power into its own hands and displaced the hitherto ruling classes, the aristocracy, the guildmasters, and their representative, the absolute monarchy.
    hash: sha256:b9f227dac1b1e6af4def0dac89f6964425c38d10d4171085c4a97dd62178e93e
    state: active
  - id: p00050
    type: paragraph
    text: The bourgeoisie annihilated the power of the aristocracy, the nobility, by abolishing the entailment of estates – in other words, by making landed property subject to purchase and sale, and by doing away with the special privileges of the nobility. It destroyed the power of the guildmasters by abolishing guilds and handicraft privileges. In their place, it put competition – that is, a state of society in which everyone has the right to enter into any branch of industry, the only obstacle being a lack of the necessary capital.
    hash: sha256:c3ff67b3347ad8f96227b25dc47a939757bdeaac88a9c7e0a4302398f399f9ba
    state: active
  - id: p00051
    type: paragraph
    text: The introduction of free competition is thus public declaration that from now on the members of society are unequal only to the extent that their capitals are unequal, that capital is the decisive power, and that therefore the capitalists, the bourgeoisie, have become the first class in society.
    hash: sha256:164708caa7a4501f72056be400df718c71a1db506d6ae9d8aec0bb6783934b6a
    state: active
  - id: p00052
    type: paragraph
    text: Free competition is necessary for the establishment of big industry, because it is the only condition of society in which big industry can make its way.
    hash: sha256:210b7a073c5dd3ad7b243bdcbe2a7a95d97f53e8d6a32045bc50729c1be64164
    state: active
  - id: p00053
    type: paragraph
    text: Having destroyed the social power of the nobility and the guildmasters, the bourgeois also destroyed their political power. Having raised itself to the actual position of first class in society, it proclaims itself to be also the dominant political class. This it does through the introduction of the representative system which rests on bourgeois equality before the law and the recognition of free competition, and in European countries takes the form of constitutional monarchy. In these constitutional monarchies, only those who possess a certain capital are voters – that is to say, only members of the bourgeoisie. These bourgeois voters choose the deputies, and these bourgeois deputies, by using their right to refuse to vote taxes, choose a bourgeois government.
    hash: sha256:74de9d7400aeb3ec64fd45a1bf5aff21bc3ae7323216900a949b65a7ef29370b
    state: active
  - id: p00054
    type: paragraph
    text: Third, everywhere the proletariat develops in step with the bourgeoisie. In proportion, as the bourgeoisie grows in wealth, the proletariat grows in numbers. For, since the proletarians can be employed only by capital, and since capital extends only through employing labor, it follows that the growth of the proletariat proceeds at precisely the same pace as the growth of capital.
    hash: sha256:a349becae011ea0f95f2562ea5c38ef9e0f713dd16aaf6ae0246e69eb6fd2cf2
    state: active
  - id: p00055
    type: paragraph
    text: Simultaneously, this process draws members of the bourgeoisie and proletarians together into the great cities where industry can be carried on most profitably, and by thus throwing great masses in one spot it gives to the proletarians a consciousness of their own strength.
    hash: sha256:8be9df4c29ca8cdbc05366f83c39a3dc41c4cbf4fc8f064f119acdd4b2b778b2
    state: active
  - id: p00056
    type: paragraph
    text: Moreover, the further this process advances, the more new labor-saving machines are invented, the greater is the pressure exercised by big industry on wages, which, as we have seen, sink to their minimum and therewith render the condition of the proletariat increasingly unbearable. The growing dissatisfaction of the proletariat thus joins with its rising power to prepare a proletarian social revolution.
    hash: sha256:38612af84d49a75020e95cf320e9103761150cc56b22b01a2cf8828852554d84
    state: active
  - id: p00057
    type: heading
    level: 4
    text: — 12 —<br/>What were the further consequences of the industrial revolution?
    hash: sha256:14f6f13adcf503208b0f2cb455386f0f64a0eed5f0daa05afd485df512212470
    state: active
  - id: p00058
    type: paragraph
    text: Big industry created in the steam engine, and other machines, the means of endlessly expanding industrial production, speeding it up, and cutting its costs. With production thus facilitated, the free competition, which is necessarily bound up with big industry, assumed the most extreme forms; a multitude of capitalists invaded industry, and, in a short while, more was produced than was needed.
    hash: sha256:8b129bbf302356d93e6bc433f62863fe2103a8f9815f55895553647516e4cf14
    state: active
  - id: p00059
    type: paragraph
    text: As a consequence, finished commodities could not be sold, and a so-called commercial crisis broke out. Factories had to be closed, their owners went bankrupt, and the workers were without bread. Deepest misery reigned everywhere.
    hash: sha256:dc09883477a98829a6ca21a2fff79155fb781166369e8981b5afff710cffe806
    state: active
  - id: p00060
    type: paragraph
    text: After a time, the superfluous products were sold, the factories began to operate again, wages rose, and gradually business got better than ever.
    hash: sha256:5b58870cae8a799d57eb095d180c79e8ca346d18ced51fc54a88807e14fa9d74
    state: active
  - id: p00061
    type: paragraph
    text: But it was not long before too many commodities were again produced and a new crisis broke out, only to follow the same course as its predecessor.
    hash: sha256:aaba45878d339838dd3a779056a810f54e3c92ae8b55b52e25cb331fde72854e
    state: active
  - id: p00062
    type: paragraph
    text: Ever since the beginning of this (19th) century, the condition of industry has constantly fluctuated between periods of prosperity and periods of crisis; nearly every five to seven years, a fresh crisis has intervened, always with the greatest hardship for workers, and always accompanied by general revolutionary stirrings and the direct peril to the whole existing order of things.
    hash: sha256:be4a1f31dd73d1efbd0fb5c536d71a44c9a5c6459ce84f99774e14206fe59bb1
    state: active
  - id: p00063
    type: heading
    level: 4
    text: — 13 —<br/>What follows from these periodic commercial crises?
    hash: sha256:4d0f4a4a9f07a652c1532210eb5b98867d29cc7f50c7699bd57e77d00b5e9e67
    state: active
  - id: p00064
    type: paragraph
    text: "First:"
    hash: sha256:e7b9cb3d5424f94d3c356b470974ffbcebe3e03dcec7e1ae912f546e8e64bd8f
    state: active
  - id: p00065
    type: paragraph
    text: <indent level="1"/>That, though big industry in its earliest stage created free competition, it has now outgrown free competition;
    hash: sha256:43193079f6610045282bfe14e5419ec97cf341d5cd8d3e015a85d2bcb4400aa5
    state: active
  - id: p00066
    type: paragraph
    text: <indent level="1"/>that, for big industry, competition and generally the individualistic organization of production have become a fetter which it must and will shatter;
    hash: sha256:02545cfdbd7997efc61663c444f1e7564cb63cfe1ab0cdbf9918d407d6d242ef
    state: active
  - id: p00067
    type: paragraph
    text: <indent level="1"/>that, so long as big industry remains on its present footing, it can be maintained only at the cost of general chaos every seven years, each time threatening the whole of civilization and not only plunging the proletarians into misery but also ruining large sections of the bourgeoisie;
    hash: sha256:7ab61e8f8b88340609df4a80161981ecfc9fa4a36462a18759023309c5b04ba7
    state: active
  - id: p00068
    type: paragraph
    text: <indent level="1"/>hence, either that big industry must itself be given up, which is an absolute impossibility, or that it makes unavoidably necessary an entirely new organization of society in which production is no longer directed by mutually competing individual industrialists but rather by the whole society operating according to a definite plan and taking account of the needs of all.
    hash: sha256:37f803cc3a1582d83ceec68c37d3b10cb8095a074417a175474f6d34092aa376
    state: active
  - id: p00069
    type: paragraph
    text: "Second: That big industry, and the limitless expansion of production which it makes possible, bring within the range of feasibility a social order in which so much is produced that every member of society will be in a position to exercise and develop all his powers and faculties in complete freedom."
    hash: sha256:68f08ce0bfb0a2b18c578ae228f47fabaf26a596fda224190f7d74e3a6e5a566
    state: active
  - id: p00070
    type: paragraph
    text: It thus appears that the very qualities of big industry which, in our present-day society, produce misery and crises are those which, in a different form of society, will abolish this misery and these catastrophic depressions.
    hash: sha256:f74459ed78a2ac500c47334121d4b008a058e6bf09c43385298b3b45bcb4622a
    state: active
  - id: p00071
    type: paragraph
    text: "We see with the greatest clarity:"
    hash: sha256:13957776ee107fce5bf465c54893920b00b5fd1a6b12794a0ce2ad8341988e8a
    state: active
  - id: p00072
    type: paragraph
    text: <indent level="1"/>(i) That all these evils are from now on to be ascribed solely to a social order which no longer corresponds to the requirements of the real situation; and
    hash: sha256:14d8d772513c0c134f93142ae10271cf78ec165c4398a644ebfce4b546e457cd
    state: active
  - id: p00073
    type: paragraph
    text: <indent level="1"/>(ii) That it is possible, through a new social order, to do away with these evils altogether.
    hash: sha256:0c144e07d58f9f21cc4507e4499a1d74d8f0c61d1c21a6fd40d37b705a12130c
    state: active
  - id: p00074
    type: heading
    level: 4
    text: — 14 —<br/>What will this new social order have to be like?
    hash: sha256:1b669e94ebec5251e6ea9093061cdb4b32e35dc3554766c63572c8f4ee75f934
    state: active
  - id: p00075
    type: paragraph
    text: Above all, it will have to take the control of industry and of all branches of production out of the hands of mutually competing individuals, and instead institute a system in which all these branches of production are operated by society as a whole – that is, for the common account, according to a common plan, and with the participation of all members of society.
    hash: sha256:0d290cb0d5c4584f2ff97cf6969961b89c921aabe79f77dcf5a81bed3ef67b53
    state: active
  - id: p00076
    type: paragraph
    text: It will, in other words, abolish competition and replace it with association.
    hash: sha256:9c088f8dcf79e9c055f6174806e6c1582a968eef04bf5e3da81b590f516afb05
    state: active
  - id: p00077
    type: paragraph
    text: Moreover, since the management of industry by individuals necessarily implies private property, and since competition is in reality merely the manner and form in which the control of industry by private property owners expresses itself, it follows that private property cannot be separated from competition and the individual management of industry. Private property must, therefore, be abolished and in its place must come the common utilization of all instruments of production and the distribution of all products according to common agreement – in a word, what is called the communal ownership of goods.
    hash: sha256:57cfb5dafd172570a3e6c33f77b98918b0be175aac707e1951a68e4bd983ab2a
    state: active
  - id: p00078
    type: paragraph
    text: In fact, the abolition of private property is, doubtless, the shortest and most significant way to characterize the revolution in the whole social order which has been made necessary by the development of industry – and for this reason it is rightly advanced by communists as their main demand.
    hash: sha256:e9f88ca6eb58eccb0b38cbf62a169bd71761aee4e7cb689a6985cff49ba7b38d
    state: active
  - id: p00079
    type: heading
    level: 4
    text: — 15 —<br/>Was not the abolition of private property possible at an earlier time?
    hash: sha256:939d43974e00ab90f251d335905126e20245d9d0959ea0848b12f2863218ad63
    state: active
  - id: p00080
    type: paragraph
    text: No. Every change in the social order, every revolution in property relations, is the necessary consequence of the creation of new forces of production which no longer fit into the old property relations.
    hash: sha256:9739c9bb5040cf87345a4d7304e3c47749882cfa230bdce37c382d368595ae95
    state: active
  - id: p00081
    type: paragraph
    text: Private property has not always existed.
    hash: sha256:e66d6b9507d556834f03a6314d0521273171f45f7799053af22ec65a3f630d42
    state: active
  - id: p00082
    type: paragraph
    text: When, towards the end of the Middle Ages, there arose a new mode of production which could not be carried on under the then existing feudal and guild forms of property, this manufacture, which had outgrown the old property relations, created a new property form, private property. And for manufacture and the earliest stage of development of big industry, private property was the only possible property form; the social order based on it was the only possible social order.
    hash: sha256:c632bb164c121d5ff5b60e39a952ab64b56df27d7d768f57e57fafa519404437
    state: active
  - id: p00083
    type: paragraph
    text: So long as it is not possible to produce so much that there is enough for all, with more left over for expanding the social capital and extending the forces of production – so long as this is not possible, there must always be a ruling class directing the use of society’s productive forces, and a poor, oppressed class. How these classes are constituted depends on the stage of development.
    hash: sha256:12003d85ffb3c97999881ad213689d57c8eca15d53a965a93461d895ea85074a
    state: active
  - id: p00084
    type: paragraph
    text: The agrarian Middle Ages give us the baron and the serf; the cities of the later Middle Ages show us the guildmaster and the journeyman and the day laborer; the 17th century has its manufacturing workers; the 19th has big factory owners and proletarians.
    hash: sha256:09314cb43ea94b205ccd549947d45062224fd10d4700117d2ab1ce4355a929a5
    state: active
  - id: p00085
    type: paragraph
    text: It is clear that, up to now, the forces of production have never been developed to the point where enough could be developed for all, and that private property has become a fetter and a barrier in relation to the further development of the forces of production.
    hash: sha256:f76c34db65fe7efd76f0f2875422a9d79efd6a376d47b16f273eeb30facc65ef
    state: active
  - id: p00086
    type: paragraph
    text: Now, however, the development of big industry has ushered in a new period. Capital and the forces of production have been expanded to an unprecedented extent, and the means are at hand to multiply them without limit in the near future. Moreover, the forces of production have been concentrated in the hands of a few bourgeois, while the great mass of the people are more and more falling into the proletariat, their situation becoming more wretched and intolerable in proportion to the increase of wealth of the bourgeoisie. And finally, these mighty and easily extended forces of production have so far outgrown private property and the bourgeoisie, that they threaten at any moment to unleash the most violent disturbances of the social order. Now, under these conditions, the abolition of private property has become not only possible but absolutely necessary.
    hash: sha256:187eaa8b894da7717aa156f46e3c5683ee1ebd413f60ffa9a11cf837a2fe1313
    state: active
  - id: p00087
    type: heading
    level: 4
    text: — 16 —<br/>Will the peaceful abolition of private property be possible?
    hash: sha256:7ab7a22505996c2a0ca79828d60e96a1cfd29bff71e177d808897a99a25defb6
    state: active
  - id: p00088
    type: paragraph
    text: It would be desirable if this could happen, and the communists would certainly be the last to oppose it. Communists know only too well that all conspiracies are not only useless, but even harmful. They know all too well that revolutions are not made intentionally and arbitrarily, but that, everywhere and always, they have been the necessary consequence of conditions which were wholly independent of the will and direction of individual parties and entire classes.
    hash: sha256:8e4235f336eeeb239a7c098fd40d53dadd50eb4b3c06b548c93877f94651f806
    state: active
  - id: p00089
    type: paragraph
    text: But they also see that the development of the proletariat in nearly all civilized countries has been violently suppressed, and that in this way the opponents of communism have been working toward a revolution with all their strength. If the oppressed proletariat is finally driven to revolution, then we communists will defend the interests of the proletarians with deeds as we now defend them with words.
    hash: sha256:c535b4c7e2ec79960addf9e0733ad87c89a8c727adcd1c7740855ea114e394e0
    state: active
  - id: p00090
    type: heading
    level: 4
    text: — 17 —<br/>Will it be possible for private property to be abolished at one stroke?
    hash: sha256:29c4ed429e1fb503921d3198e58fa6df42b791bfca261f88cb7a542bd74f1064
    state: active
  - id: p00091
    type: paragraph
    text: No, no more than existing forces of production can at one stroke be multiplied to the extent necessary for the creation of a communal society.
    hash: sha256:aca681ddfcbf6c435602d6a7402ad91d59d38cf68697d6bab63d978633fca52e
    state: active
  - id: p00092
    type: paragraph
    text: In all probability, the proletarian revolution will transform existing society gradually and will be able to abolish private property only when the means of production are available in sufficient quantity.
    hash: sha256:2e3de775309ba1a093b7af259092b1ee701b8833b3e2125723171d42c8cd62ea
    state: active
  - id: p00093
    type: heading
    level: 4
    text: — 18 —<br/>What will be the course of this revolution?
    hash: sha256:bad2f5985f2de748c7832ec9d0c593aceff38fb61bbac4238a62e0d5df38e0c6
    state: active
  - id: p00094
    type: paragraph
    text: Above all, it will establish a democratic constitution, and through this, the direct or indirect dominance of the proletariat. Direct in England, where the proletarians are already a majority of the people. Indirect in France and Germany, where the majority of the people consists not only of proletarians, but also of small peasants and petty bourgeois who are in the process of falling into the proletariat, who are more and more dependent in all their political interests on the proletariat, and who must, therefore, soon adapt to the demands of the proletariat. Perhaps this will cost a second struggle, but the outcome can only be the victory of the proletariat.
    hash: sha256:7ae8cbe485a8b92d45ac882ac7814bb71ff977e7de16d103348c2b5f60707075
    state: active
  - id: p00095
    type: paragraph
    text: "Democracy would be wholly valueless to the proletariat if it were not immediately used as a means for putting through measures directed against private property and ensuring the livelihood of the proletariat. The main measures, emerging as the necessary result of existing relations, are the following:"
    hash: sha256:0d948ffdcc0ee7dbc70f7ec83754e34550157dd956d2231adc14d02e6cced13e
    state: active
  - id: p00096
    type: paragraph
    text: <indent level="1"/>(i) Limitation of private property through progressive taxation, heavy inheritance taxes, abolition of inheritance through collateral lines (brothers, nephews, etc.) forced loans, etc.
    hash: sha256:17b11b46771c3d01870cf54df2fa18fd632a8280f8a65c34ec32cea065f5e782
    state: active
  - id: p00097
    type: paragraph
    text: <indent level="1"/>(ii) Gradual expropriation of landowners, industrialists, railroad magnates and shipowners, partly through competition by state industry, partly directly through compensation in the form of bonds.
    hash: sha256:52222d731e8dc2bd4852c76cd634f64290f49abacb8a1e0abc1ba2b95b84add8
    state: active
  - id: p00098
    type: paragraph
    text: <indent level="1"/>(iii) Confiscation of the possessions of all emigrants and rebels against the majority of the people.
    hash: sha256:489c54fdc5cd390cb60a5b57c0556c65e3040bb9c4880837da34840ee6b306db
    state: active
  - id: p00099
    type: paragraph
    text: <indent level="1"/>(iv) Organization of labor or employment of proletarians on publicly owned land, in factories and workshops, with competition among the workers being abolished and with the factory owners, in so far as they still exist, being obliged to pay the same high wages as those paid by the state.
    hash: sha256:1af6c8a18fbba46482ecd66b5fb8cc0ddbb0d79d5cc665874e1dd54409d34cef
    state: active
  - id: p00100
    type: paragraph
    text: <indent level="1"/>(v) An equal obligation on all members of society to work until such time as private property has been completely abolished. Formation of industrial armies, especially for agriculture.
    hash: sha256:a3f89e68865b5e6ce81a40657809b83b289008eb34fdb7c18becd28d2fd0dbd2
    state: active
  - id: p00101
    type: paragraph
    text: <indent level="1"/>(vi) Centralization of money and credit in the hands of the state through a national bank with state capital, and the suppression of all private banks and bankers.
    hash: sha256:f07672bf42796bfcd9eceff5d6f6d77b41f432fe8338289045349b9bc474e82e
    state: active
  - id: p00102
    type: paragraph
    text: <indent level="1"/>(vii) Increase in the number of national factories, workshops, railroads, ships; bringing new lands into cultivation and improvement of land already under cultivation – all in proportion to the growth of the capital and labor force at the disposal of the nation.
    hash: sha256:1dbcc04553f46a6cf4728292dd3d66697c5fbd4b50bfcc22da98698d962e4b2f
    state: active
  - id: p00103
    type: paragraph
    text: <indent level="1"/>(viii) Education of all children, from the moment they can leave their mother’s care, in national establishments at national cost. Education and production together.
    hash: sha256:395d1f7233c74953f612258f2209124967fb9ccfb6b8ebc3621b80b4f1c5cdc1
    state: active
  - id: p00104
    type: paragraph
    text: <indent level="1"/>(ix) Construction, on public lands, of great palaces as communal dwellings for associated groups of citizens engaged in both industry and agriculture and combining in their way of life the advantages of urban and rural conditions while avoiding the one-sidedness and drawbacks of each.
    hash: sha256:3c6c4969e313cb0859bfb570963743cc7cb0bd6076cca46961bce66ff808bbd0
    state: active
  - id: p00105
    type: paragraph
    text: <indent level="1"/>(x) Destruction of all unhealthy and jerry-built dwellings in urban districts.
    hash: sha256:36f2de0f9973da9118ea2dd38d008bfa5123ffd150c64fc6b135ebd243e237a4
    state: active
  - id: p00106
    type: paragraph
    text: <indent level="1"/>(xi) Equal inheritance rights for children born in and out of wedlock.
    hash: sha256:deda949d58ec5f100b945ee4791d9ab65c9d5842b6aeff56cd514c072f320606
    state: active
  - id: p00107
    type: paragraph
    text: <indent level="1"/>(xii) Concentration of all means of transportation in the hands of the nation.
    hash: sha256:2b6d76ad5534a97adb721678a1ff268e4bdcab52c2b9f9ba2f270a28d2cf90ac
    state: active
  - id: p00108
    type: paragraph
    text: It is impossible, of course, to carry out all these measures at once. But one will always bring others in its wake. Once the first radical attack on private property has been launched, the proletariat will find itself forced to go ever further, to concentrate increasingly in the hands of the state all capital, all agriculture, all transport, all trade. All the foregoing measures are directed to this end; and they will become practicable and feasible, capable of producing their centralizing effects to precisely the degree that the proletariat, through its labor, multiplies the country’s productive forces.
    hash: sha256:56bcf4c058d67e5d0371c98fbaa4e7b15c480e23c796b3fb349cff35ce55f17a
    state: active
  - id: p00109
    type: paragraph
    text: Finally, when all capital, all production, all exchange have been brought together in the hands of the nation, private property will disappear of its own accord, money will become superfluous, and production will so expand and man so change that society will be able to slough off whatever of its old economic habits may remain.
    hash: sha256:450f2865acb00a6ede3604ebfb4c0d88cc2a1c2ac06091d63c045b100f6c27a7
    state: active
  - id: p00110
    type: heading
    level: 4
    text: — 19 —<br/>Will it be possible for this revolution to take place in one country alone?
    hash: sha256:87daeccc90f6004c38fce68f704300725de927fda39b0a6fe9a019ac3883e051
    state: active
  - id: p00111
    type: paragraph
    text: No. By creating the world market, big industry has already brought all the peoples of the Earth, and especially the civilized peoples, into such close relation with one another that none is independent of what happens to the others.
    hash: sha256:8ac75cf220e63e4d16bb02f80126d8f84091d6c391033b1d25d3573c2ec94acb
    state: active
  - id: p00112
    type: paragraph
    text: Further, it has co-ordinated the social development of the civilized countries to such an extent that, in all of them, bourgeoisie and proletariat have become the decisive classes, and the struggle between them the great struggle of the day. It follows that the communist revolution will not merely be a national phenomenon but must take place simultaneously in all civilized countries – that is to say, at least in England, America, France, and Germany.
    hash: sha256:2debc0dd1334450049c44476abff8256684c588d0f3e13a1c5f3b6b9c662d26f
    state: active
  - id: p00113
    type: paragraph
    text: It will develop in each of these countries more or less rapidly, according as one country or the other has a more developed industry, greater wealth, a more significant mass of productive forces. Hence, it will go slowest and will meet most obstacles in Germany, most rapidly and with the fewest difficulties in England. It will have a powerful impact on the other countries of the world, and will radically alter the course of development which they have followed up to now, while greatly stepping up its pace.
    hash: sha256:d51e9fc8dd69ece382066f2bbf3e01e080aec24e3a90600904dd207375ed3a79
    state: active
  - id: p00114
    type: paragraph
    text: It is a universal revolution and will, accordingly, have a universal range.
    hash: sha256:66c9871b9232d6ff97369ce3f4606a7ac9a1901d220fbdd414f4cc39f121afd0
    state: active
  - id: p00115
    type: heading
    level: 4
    text: — 20 —<br/>What will be the consequences of the<br/>ultimate disappearance of private property?
    hash: sha256:0b14fc22b3a335b675578fa5fd276f34574d6424b43a21aeac8d77ae58bab21d
    state: active
  - id: p00116
    type: paragraph
    text: Society will take all forces of production and means of commerce, as well as the exchange and distribution of products, out of the hands of private capitalists and will manage them in accordance with a plan based on the availability of resources and the needs of the whole society. In this way, most important of all, the evil consequences which are now associated with the conduct of big industry will be abolished.
    hash: sha256:89000691c0d748c811f9d0fc6662eec62808877e0dece6f5f0067de6790a3d98
    state: active
  - id: p00117
    type: paragraph
    text: There will be no more crises; the expanded production, which for the present order of society is overproduction and hence a prevailing cause of misery, will then be insufficient and in need of being expanded much further. Instead of generating misery, overproduction will reach beyond the elementary requirements of society to assure the satisfaction of the needs of all; it will create new needs and, at the same time, the means of satisfying them. It will become the condition of, and the stimulus to, new progress, which will no longer throw the whole social order into confusion, as progress has always done in the past. Big industry, freed from the pressure of private property, will undergo such an expansion that what we now see will seem as petty in comparison as manufacture seems when put beside the big industry of our own day. This development of industry will make available to society a sufficient mass of products to satisfy the needs of everyone.
    hash: sha256:6c677b2c15c001b9c0962fa7b9c1c99695bb54861e93927e5a16a90c399f7518
    state: active
  - id: p00118
    type: paragraph
    text: The same will be true of agriculture, which also suffers from the pressure of private property and is held back by the division of privately owned land into small parcels. Here, existing improvements and scientific procedures will be put into practice, with a resulting leap forward which will assure to society all the products it needs.
    hash: sha256:bcaaaaa34230ec6a3b5e2cd80f7aba4ae269004da79b32e219f18b5eebd0dd37
    state: active
  - id: p00119
    type: paragraph
    text: In this way, such an abundance of goods will be able to satisfy the needs of all its members.
    hash: sha256:dabba93065be94c8efd32329fa8b1a43680cad96369e64354b9007f976c3d918
    state: active
  - id: p00120
    type: paragraph
    text: The division of society into different, mutually hostile classes will then become unnecessary. Indeed, it will be not only unnecessary but intolerable in the new social order. The existence of classes originated in the division of labor, and the division of labor, as it has been known up to the present, will completely disappear. For mechanical and chemical processes are not enough to bring industrial and agricultural production up to the level we have described; the capacities of the men who make use of these processes must undergo a corresponding development.
    hash: sha256:fb3787fcddca94a689987415f8c1cdfcd911522f03f0f850926b4f04ca79f6ab
    state: active
  - id: p00121
    type: paragraph
    text: Just as the peasants and manufacturing workers of the last century changed their whole way of life and became quite different people when they were drawn into big industry, in the same way, communal control over production by society as a whole, and the resulting new development, will both require an entirely different kind of human material.
    hash: sha256:175a28de5b8606b4e4c2a4365fb52569659b0744c836662378a704fe2420fd17
    state: active
  - id: p00122
    type: paragraph
    text: People will no longer be, as they are today, subordinated to a single branch of production, bound to it, exploited by it; they will no longer develop <i>one</i> of their faculties at the expense of all others; they will no longer know only <i>one</i> branch, or one branch of a single branch, of production as a whole. Even industry as it is today is finding such people less and less useful.
    hash: sha256:b1ff533d357c11630d00e31b5bce4a4555e24aa3ccac179f939ff2e21f961ef9
    state: active
  - id: p00123
    type: paragraph
    text: Industry controlled by society as a whole, and operated according to a plan, presupposes well-rounded human beings, their faculties developed in balanced fashion, able to see the system of production in its entirety.
    hash: sha256:bd79d697e972f85c6227daaea1ce7a30b688fc4f8bdc3c4f3369c828f2aacff0
    state: active
  - id: p00124
    type: paragraph
    text: The form of the division of labor which makes one a peasant, another a cobbler, a third a factory worker, a fourth a stock-market operator, has already been undermined by machinery and will completely disappear. Education will enable young people quickly to familiarize themselves with the whole system of production and to pass from one branch of production to another in response to the needs of society or their own inclinations. It will, therefore, free them from the one-sided character which the present-day division of labor impresses upon every individual. Communist society will, in this way, make it possible for its members to put their comprehensively developed faculties to full use. But, when this happens, classes will necessarily disappear. It follows that society organized on a communist basis is incompatible with the existence of classes on the one hand, and that the very building of such a society provides the means of abolishing class differences on the other.
    hash: sha256:67e296bcc7c1d0dd11d76baa0f5ba1bac338ba9b5234306c966a4fe23d164b67
    state: active
  - id: p00125
    type: paragraph
    text: A corollary of this is that the difference between city and country is destined to disappear. The management of agriculture and industry by the same people rather than by two different classes of people is, if only for purely material reasons, a necessary condition of communist association. The dispersal of the agricultural population on the land, alongside the crowding of the industrial population into the great cities, is a condition which corresponds to an undeveloped state of both agriculture and industry and can already be felt as an obstacle to further development.
    hash: sha256:9fd0826791804ada66ef069d86986eef7f3717c6eab6e82bd39ea3c8692c863b
    state: active
  - id: p00126
    type: paragraph
    text: The general co-operation of all members of society for the purpose of planned exploitation of the forces of production, the expansion of production to the point where it will satisfy the needs of all, the abolition of a situation in which the needs of some are satisfied at the expense of the needs of others, the complete liquidation of classes and their conflicts, the rounded development of the capacities of all members of society through the elimination of the present division of labor, through industrial education, through engaging in varying activities, through the participation by all in the enjoyments produced by all, through the combination of city and country – these are the main consequences of the abolition of private property.
    hash: sha256:bccb1d692970d5cb661646e07e59b5f7c819318018d8b292ffb0e58b70ab2536
    state: active
  - id: p00127
    type: heading
    level: 4
    text: — 21 —<br/>What will be the influence of communist society on the family?
    hash: sha256:2aec6d52c3f4e30bab238c8abfbd24c86b384bdf67ebdc641572504a2506a246
    state: active
  - id: p00128
    type: paragraph
    text: It will transform the relations between the sexes into a purely private matter which concerns only the persons involved and into which society has no occasion to intervene. It can do this since it does away with private property and educates children on a communal basis, and in this way removes the two bases of traditional marriage – the dependence rooted in private property, of the women on the man, and of the children on the parents.
    hash: sha256:9911f46617a7a1c6894684ce2be6988f090c3a0ff7435ed1a5a8858d13c3be10
    state: active
  - id: p00129
    type: paragraph
    text: And here is the answer to the outcry of the highly moral philistines against the “community of women”. Community of women is a condition which belongs entirely to bourgeois society and which today finds its complete expression in prostitution. But prostitution is based on private property and falls with it. Thus, communist society, instead of introducing community of women, in fact abolishes it.
    hash: sha256:408204d4f965bbe134b5286bc8939224d8dc8942196d5ac1c512ce9d9de62a79
    state: active
  - id: p00130
    type: heading
    level: 4
    text: — 22 —<br/>What will be the attitude of communism to existing nationalities?
    hash: sha256:372cd546eaf84144e114270e211ade8a7636f5315b5d17a681c0b2cb0ce9dfea
    state: active
  - id: p00131
    type: paragraph
    text: The nationalities of the peoples associating themselves in accordance with the principle of community will be compelled to mingle with each other as a result of this association and thereby to dissolve themselves, just as the various estate and class distinctions must disappear through the abolition of their basis, private property.<fn ref="3"/>
    hash: sha256:be05c107d16897430779726e3d67d9fc452793b028b11d2bd70722c51e874300
    state: active
  - id: p00132
    type: heading
    level: 4
    text: — 23 —<br/>What will be its attitude to existing religions?
    hash: sha256:6d66ca4650ce7cddef60d3fea0e3d503c8a606311deb3149d3e97bc989c9e1a5
    state: active
  - id: p00133
    type: paragraph
    text: All religions so far have been the expression of historical stages of development of individual peoples or groups of peoples. But communism is the stage of historical development which makes all existing religions superfluous and brings about their disappearance<fn ref="4"/>
    hash: sha256:72458f62cfa328058efe279dbc50fd0e53b3d98bef1b9111ee1ee07661eba09e
    state: active
  - id: p00134
    type: heading
    level: 4
    text: — 24 —<br/>How do communists differ from socialists?
    hash: sha256:30f4e1b1181629a539ec853291f8820cf4a3a28f519219c9052adb5681661a1a
    state: active
  - id: p00135
    type: paragraph
    text: The so-called socialists are divided into three categories.
    hash: sha256:3dbbb3c298aeb3563f4238a2b04b1dbc23897911a2b3590fcd98d308464a082f
    state: active
  - id: p00136
    type: heading
    level: 4
    text: "[ Reactionary Socialists: ]"
    hash: sha256:85512787cd75d168231706fd5e7953c459aa630fa573ad380fcc8a9e270c7d99
    state: active
  - id: p00137
    type: paragraph
    text: The first category consists of adherents of a feudal and patriarchal society which has already been destroyed, and is still daily being destroyed, by big industry and world trade and their creation, bourgeois society. This category concludes, from the evils of existing society, that feudal and patriarchal society must be restored because it was free of such evils. In one way or another, all their proposals are directed to this end.
    hash: sha256:f91a4f5e33a8569e993ffd883b3bb2c453c898580937ebac9058dbc4cbdf935f
    state: active
  - id: p00138
    type: paragraph
    text: "This category of reactionary socialists, for all their seeming partisanship and their scalding tears for the misery of the proletariat, is nevertheless energetically opposed by the communists for the following reasons:"
    hash: sha256:0b67d73f0c26f9d8305ac3a763c9d89930eacc3a97da8f1beee5925ff0b6cb5e
    state: active
  - id: p00139
    type: paragraph
    text: <indent level="1"/>(i) It strives for something which is entirely impossible.
    hash: sha256:fb132c18ff275fbf43a0ff721d8a9cd96c1daadff8ed1bc43bf62c6750b4ffd9
    state: active
  - id: p00140
    type: paragraph
    text: <indent level="1"/>(ii) It seeks to establish the rule of the aristocracy, the guildmasters, the small producers, and their retinue of absolute or feudal monarchs, officials, soldiers, and priests – a society which was, to be sure, free of the evils of present-day society but which brought it at least as many evils without even offering to the oppressed workers the prospect of liberation through a communist revolution.
    hash: sha256:7ffd13797aa44f5ca3454c614b737a074b98e9e0da1a1d482878a7b011b13c3f
    state: active
  - id: p00141
    type: paragraph
    text: <indent level="1"/>(iii) As soon as the proletariat becomes revolutionary and communist, these reactionary socialists show their true colors by immediately making common cause with the bourgeoisie against the proletarians.
    hash: sha256:5c6755a92de0f1d7170e083dda1f8a63d253a8f25b27ea24e16acc52dc844d19
    state: active
  - id: p00142
    type: heading
    level: 4
    text: "[ Bourgeois Socialists: ]"
    hash: sha256:d028ee4f5e3aad95050d74f58528764e696871bdc74b2daa6e2d4dc91d9e512a
    state: active
  - id: p00143
    type: paragraph
    text: The second category consists of adherents of present-day society who have been frightened for its future by the evils to which it necessarily gives rise. What they want, therefore, is to maintain this society while getting rid of the evils which are an inherent part of it.
    hash: sha256:70a80b55daf361ec1c71f5e523fec9d2bb382846f8a96ad377d4a9bafdb613cb
    state: active
  - id: p00144
    type: paragraph
    text: To this end, some propose mere welfare measures – while others come forward with grandiose systems of reform which, under the pretense of re-organizing society, are in fact intended to preserve the foundations, and hence the life, of existing society.
    hash: sha256:67a464581924f48f2c779f5406b5ddcb9986f184c255f0f8feac0798285eb4d2
    state: active
  - id: p00145
    type: paragraph
    text: Communists must unremittingly struggle against these bourgeois socialists because they work for the enemies of communists and protect the society which communists aim to overthrow.
    hash: sha256:b2b1589e1b1c11648139ac5ebd555c0bf1933917364648235c9490d57a413cbf
    state: active
  - id: p00146
    type: heading
    level: 4
    text: "[ Democratic Socialists: ]"
    hash: sha256:ac55bd4b0e0ad2a804c504066c8174de42f07d2203745de49783d0b239203e27
    state: active
  - id: p00147
    type: paragraph
    text: Finally, the third category consists of democratic socialists who favor some of the same measures the communists advocate, as described in Question 18, not as part of the transition to communism, however, but as measures which they believe will be sufficient to abolish the misery and evils of present-day society.
    hash: sha256:6b4cbbdfb612aa1037e59534b6ee70afd24a0c018240c4ba870a7d8f7e6fd243
    state: active
  - id: p00148
    type: paragraph
    text: These democratic socialists are either proletarians who are not yet sufficiently clear about the conditions of the liberation of their class, or they are representatives of the petty bourgeoisie, a class which, prior to the achievement of democracy and the socialist measures to which it gives rise, has many interests in common with the proletariat.
    hash: sha256:0b44db3a5a639f1c3a8400e7d4daa99aa176ff8a8d7c4f3671aaf399611c9452
    state: active
  - id: p00149
    type: paragraph
    text: It follows that, in moments of action, the communists will have to come to an understanding with these democratic socialists, and in general to follow as far as possible a common policy with them – provided that these socialists do not enter into the service of the ruling bourgeoisie and attack the communists.
    hash: sha256:6a64ac0a9d939aa10f93e964b8c240ed6b78db48f4dc13be80ac17901309c86c
    state: active
  - id: p00150
    type: paragraph
    text: It is clear that this form of co-operation in action does not exclude the discussion of differences.
    hash: sha256:f9c06060c7bd74c3dbda6686ce654cd5160454ee7ec495f8c109871e856d8782
    state: active
  - id: p00151
    type: heading
    level: 4
    text: — 25 —<br/>What is the attitude of the communists to the<br/>other political parties of our time?
    hash: sha256:b71c787397226079d2be019b28502ee653c8530734f1c15620c328e8dd402dc9
    state: active
  - id: p00152
    type: paragraph
    text: This attitude is different in the different countries.
    hash: sha256:d66cdc25d80896606fc25db4fbac8884e7bff8ea3e1f08b6dad0899187c6dab0
    state: active
  - id: p00153
    type: paragraph
    text: In England, France, and Belgium, where the bourgeoisie rules, the communists still have a common interest with the various democratic parties, an interest which is all the greater the more closely the socialistic measures they champion approach the aims of the communists – that is, the more clearly and definitely they represent the interests of the proletariat and the more they depend on the proletariat for support. In England, for example, the working-class Chartists are infinitely closer to the communists than the democratic petty bourgeoisie or the so-called Radicals.
    hash: sha256:71049d5f264f03157800f62ee4ac298fd6106b278075e86be440e90493e157ca
    state: active
  - id: p00154
    type: paragraph
    text: In America, where a democratic constitution has already been established, the communists must make the common cause with the party which will turn this constitution against the bourgeoisie and use it in the interests of the proletariat – that is, with the agrarian National Reformers.
    hash: sha256:b1c89a4e494f56bfc6e35cc573044710913b9a03510b528903d0a20c242c80dc
    state: active
  - id: p00155
    type: paragraph
    text: In Switzerland, the Radicals, though a very mixed party, are the only group with which the communists can co-operate, and, among these Radicals, the Vaudois and Genevese are the most advanced.
    hash: sha256:3c1a97cc8cce917174b66a2263c249e30d1ea59cfca98871e3b9152f584c1878
    state: active
  - id: p00156
    type: paragraph
    text: In Germany, finally, the decisive struggle now on the order of the day is that between the bourgeoisie and the absolute monarchy. Since the communists cannot enter upon the decisive struggle between themselves and the bourgeoisie until the bourgeoisie is in power, it follows that it is in the interest of the communists to help the bourgeoisie to power as soon as possible in order the sooner to be able to overthrow it. Against the governments, therefore, the communists must continually support the radical liberal party, taking care to avoid the self-deceptions of the bourgeoisie and not fall for the enticing promises of benefits which a victory for the bourgeoisie would allegedly bring to the proletariat. The sole advantages which the proletariat would derive from a bourgeois victory would consist
    hash: sha256:6507b5afbde20399e1401b830b29e1e21c3abc14d3408342f9400bb91bb5e600
    state: active
  - id: p00157
    type: paragraph
    text: <indent level="1"/>(i) in various concessions which would facilitate the unification of the proletariat into a closely knit, battle-worthy, and organized class; and
    hash: sha256:8106d33cbc4f0c67840c965fe00c238f2804490a1cefe2bd4cf9ea90c2be02a6
    state: active
  - id: p00158
    type: paragraph
    text: <indent level="1"/>(ii) in the certainly that, on the very day the absolute monarchies fall, the struggle between bourgeoisie and proletariat will start. From that day on, the policy of the communists will be the same as it now is in the countries where the bourgeoisie is already in power.
    hash: sha256:50b8459cc4a53137bed7ba462d4ed6c2e33f49d49aa7b4c13fbbc12e0239d562
    state: active
  - id: p00159
    type: paragraph
    text: In the name and on the mandate of the Congress.
    hash: sha256:2a4a5e52d221e0b9bec4cddb61840df8db7041badb491e98978e81f5aebdc085
    state: active
  - id: p00160
    type: footnote
    label: "1"
    text: In their works written in later periods, Marx and Engels substituted the more accurate concepts of “sale of labour power”, “value of labour power” and “price of labour power” (first introduced by Marx) for “sale of labour”, “value of labour” and “price of labour”, as used here.<br/><br/>2. Engels left half a page blank here in the manuscript. The <i>Draft of the Communist Confession of Faith</i>, has the answer shown for the same question (Number 12).
    hash: sha256:aed74ec3bbe8c1999d99ffb65b444db28c6710eebf38b61a1bf91f344cb17894
    state: active
  - id: p00161
    type: footnote
    label: "3"
    text: Engels’ put “unchanged” here, referring to the answer in the June draft under No. 21 which is shown.
    hash: sha256:9500c6002179764ccbe2c80ecccd56612c4239116ad5fe1a7dc292754222b52d
    state: active
  - id: p00162
    type: footnote
    label: "4"
    text: "Similarly, this refers to the answer to Question 23 in the June draft: “All religions which have existed hitherto were expressions of historical stages of development of individual peoples or groups of peoples. But communism is that stage of historical development which makes all existing religions superfluous and supersedes them.”<br/><br/>5. The Chartists were the participants in the political movement of the British workers which lasted from the 1830s to the middle 1850s and had as its slogan the adoption of a People’s Charter, demanding universal franchise and a series of conditions guaranteeing voting rights for all workers. Lenin defined Chartism as the world’s “first broad, truly mass and politically organized proletarian revolutionary movement” (Collected Works, Eng. ed., Progress Publishers, Moscow, 1965, Vol. 29, p. 309.) The decline of the Chartist movement was due to the strengthening of Britain’s industrial and commercial monopoly and the bribing of the upper stratum of the working class (“the labour aristocracy”) by the British bourgeoisie out of its super-profits. Both factors led to the strengthening of opportunist tendencies in this stratum as expressed, in particular, by the refusal of the trade union leaders to support Chartism.<br/><br/>6. Probably a references to the National Reform Association, founded during the 1840s by George H. Evans, with headquarters in New York City, which had for its motto, “Vote Yourself a Farm”."
    hash: sha256:3621210663c3867665eaf514933091e86f79ddab2c3224ab1a49ef6d139c8280
    state: active
