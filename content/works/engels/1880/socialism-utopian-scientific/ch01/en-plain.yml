  p00039:
    covers:
      - p00039
    based_on: sha256:b09dfa1f6b4b67b0b65a7fbe5453e6698f1bc3bb38520b1fdf4baa4872b7f457
    revision: 2
    ai_assisted: true
    text: "This is the passage on the French Revolution:<br/><br/>“Thought, the
      concept of law, all at once made itself felt, and the old scaffolding of
      wrong could make no stand. A constitution has now been established on this
      concept of law, and everything must be based upon this. Since the Sun had
      been in the firmament, the sight had never been seen of man standing upon
      his head: that is, on the Idea, building reality after this image.
      Anaxagoras said Reason rules the world. Now for the first time men
      recognized that the Idea must rule mental reality. This was a magnificent
      sunrise. All thinking Beings participated in celebrating this day. An
      enthusiasm of reason pervaded the world, as if reconciliation with the
      Divine Principle had come.”<br/><br/>Is it not high time to set the
      Anti-Socialist Law in action against such subversive teachings by
      Professor Hegel?"
