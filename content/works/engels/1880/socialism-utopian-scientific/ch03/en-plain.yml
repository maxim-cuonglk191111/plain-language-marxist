    ai_assisted: true
    text: I say "have to" because State takeover is progress only when
      {means-of-production:sg} have outgrown corporate management and state
      control is economically inevitable. Recently, since Bismarck started
      nationalizing firms, a fake Socialism appeared that praises all
      State-ownership as socialist. If state tobacco monopolies were socialist,
      Napoleon and Metternich would count as socialist founders.<br/><br/>If the
      Belgian State built railways for revenue, or if Bismarck took over
      Prussian lines for military transport and government votes, these were not
      socialist acts. Otherwise, the Royal Maritime Company, the Royal porcelain
      manufacture, and the army tailors would also count as socialist. Under
      Frederick William III, an official even proposed state takeover of
      brothels!
  p00059:
