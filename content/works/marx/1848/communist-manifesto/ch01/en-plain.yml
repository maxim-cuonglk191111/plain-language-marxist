    text: |
      This was the name the townspeople of Italy and France gave to their urban communities, after they had bought or conquered their first rights of self-government from their feudal lords. [Engels, 1890 German edition]

      “Commune” was the name taken in France by the newly emerging towns. They took it even before they had won local self-government and political rights as the “Third Estate” from their feudal lords and masters. Generally speaking, England is taken here as the typical country for the economic development of the {bourgeoisie}, and France for its political development. [Engels, 1888 English Edition]
