    text: That is, all <i>written</i> history. In 1847, the prehistory of society, the social organisation that existed before recorded history, was almost unknown. Since then, August von Haxthausen (1792-1866) discovered common ownership of land in Russia. Georg Ludwig von Maurer proved it to be the social foundation from which all Teutonic peoples started in history. And gradually village communities were found to be, or to have been, the original form of society everywhere from India to Ireland. The inner organisation of this primitive communist society was revealed, in its typical form, by Lewis Henry Morgan's (1818-1881) crowning discovery of the true nature of the gens and its relation to the tribe. With the breaking up of these primeval communities, society begins to divide into separate and finally antagonistic classes. I have tried to trace this breakup in The Origin of the Family, Private Property, and the State, second edition, Stuttgart, 1886. [Engels, 1888 English Edition and 1890 German Edition (with the last sentence omitted)]
