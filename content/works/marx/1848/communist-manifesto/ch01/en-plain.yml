    revision: 1
    ai_assisted: true
    text: "A spectre is haunting Europe — the spectre of communism. All the powers of old Europe have joined in a holy alliance to cast out this spectre: Pope and Tsar, Metternich and Guizot, French Radicals and German police spies."
  p00003:
    covers: [p00003]
    based_on: sha256:9e7adb74c8c4f0e4d9ceff2ec9cfdba01a73065d500234e6b426639f1107273b
    revision: 1
    ai_assisted: true
    text: Where is the opposition party that has not been denounced as communist by its opponents in power? Where is the opposition that has not thrown the damning label of communism back at the more advanced opposition parties, as well as at its reactionary enemies?
  p00004:
    covers: [p00004]
    based_on: sha256:43d35db71ed7819ee45158cb26a85dc8979551f57006f6461f5da72ef3247541
    revision: 1
    ai_assisted: true
    text: "Two things follow from this fact:"
  p00005:
    covers: [p00005]
    based_on: sha256:909a1fe2c1d82bceefcddade1fd9e9dcd1dff9ab8923d6885db236c6571ba1db
    revision: 1
    ai_assisted: true
    text: <indent level="1"/>I. Communism is already recognised by all European powers as a power in its own right.
  p00006:
    covers: [p00006]
    based_on: sha256:54907fb6f5566f902dcff84e953b9afca1143c5aa3f0db701d04e376b8a519a3
    revision: 1
    ai_assisted: true
    text: <indent level="1"/>II. It is high time that Communists openly, in front of the whole world, published their views, their aims, their tendencies, and answered this fairy tale of the Spectre of Communism with a manifesto of the party itself.
  p00007:
    covers: [p00007]
    based_on: sha256:fa9c749b10981c8775c374345b1672c75d74fe68a4bbcbe67975c27da0f6cdf8
    revision: 1
    ai_assisted: true
    text: For this purpose, Communists of various nationalities have met in London and drafted the following manifesto, to be published in the English, French, German, Italian, Flemish and Danish languages.
  p00008:
    covers: [p00008]
    based_on: sha256:02c9fdf027d3a8fbf0bdad98591c9700aacf420cf0423a05377ffaaabf116f58
    revision: 1
    ai_assisted: true
    text: Chapter I. {Bourgeoisie} and {Proletariat}<fn ref="1"/>
  p00009:
    covers: [p00009]
    based_on: sha256:d63e2e18431592545f3addcaa1a9163d50673c6080f1cfcb1cf2355e1a2221c8
    revision: 1
    ai_assisted: true
    text: The history of all society up to now<fn ref="2"/> is the history of class struggles.
  p00010:
    covers: [p00010]
    based_on: sha256:0780e416e6272b36b3267bf2f3ef91561f6669092d8959cd89f3a7995d4c3a4d
    revision: 1
    ai_assisted: true
    text: Free man and slave, patrician and plebeian, lord and serf, guild-master<fn ref="3"/> and journeyman — in a word, oppressor and oppressed — stood in constant opposition to one another. They carried on an unbroken fight, now hidden, now open, a fight that each time ended either in a revolutionary reshaping of society as a whole, or in the common ruin of the classes in conflict.
  p00011:
    covers: [p00011]
    based_on: sha256:29e723e0a66814d5156f45e7dbc5ca75e8f6f7cf886ddbdc41b236ac52dece6f
    revision: 1
    ai_assisted: true
    text: In the earlier periods of history, we find almost everywhere a complicated arrangement of society into different orders, a many-layered ranking of social positions. In ancient Rome we have patricians, knights, plebeians, slaves; in the Middle Ages, feudal lords, vassals, guild-masters, journeymen, apprentices, serfs; and within almost all of these classes, again, lower sub-ranks.
  p00012:
    covers: [p00012]
    based_on: sha256:3be3fd7e6ad13a65c52f4a70afc71bf3aefc936db03dc4d5ad629ab73adb2ea1
    revision: 1
    ai_assisted: true
    text: The modern {bourgeoisie:adj} society that has grown out of the ruins of feudal society has not done away with {class-antagonism:pl}. It has only set up new classes, new conditions of oppression, new forms of struggle in place of the old ones.
  p00013:
    covers: [p00013]
    based_on: sha256:958182076c58a3161f7e40995b3cf2136f7a1437bcfbfd8610cd9381b51d740c
    revision: 1
    ai_assisted: true
    text: "Our period, the period of the {bourgeoisie}, has, however, this distinctive feature: it has simplified {class-antagonism:pl}. Society as a whole is splitting more and more into two great hostile camps, into two great classes directly facing each other — {Bourgeoisie} and {Proletariat}."
  p00014:
    covers: [p00014]
    based_on: sha256:02b2700b7a464c3034f5c0b2c07c813c1f9b95b8bd9ae8c708b439accd3153b8
    revision: 1
    ai_assisted: true
    text: From the serfs of the Middle Ages came the chartered burghers of the earliest towns. From these burghers the first elements of the {bourgeoisie} developed.
  p00015:
    covers: [p00015]
    based_on: sha256:6303470435d50b126ae09baa0a04b5526e89659837346cb78ea52beba6ea9cf2
    revision: 1
    ai_assisted: true
    text: The discovery of America and the sailing around the Cape opened up new ground for the rising {bourgeoisie}. The East-Indian and Chinese markets, the colonisation of America, trade with the colonies, the increase in the means of exchange and in commodities generally, gave commerce, shipping and industry a push never known before, and with it gave the revolutionary element in the crumbling feudal society a rapid development.
  p00016:
    covers: [p00016]
    based_on: sha256:7eb06f63bb058a2dd89bf0f643602a4ac382f5cc33bdf6e28d9c9b44e8be3624
    revision: 1
    ai_assisted: true
    text: The feudal system of industry, in which closed guilds held a monopoly of industrial production, was no longer enough for the growing needs of the new markets. The manufacturing system took its place. The guild-masters were pushed aside by the manufacturing middle class; the division of labour between the different corporate guilds disappeared in the face of the division of labour within each single workshop.
  p00017:
    covers: [p00017]
    based_on: sha256:ec1fe89fe54a980e5be195287376bbe6e39d855d1922cda7cf19f153a12a8f49
    revision: 1
    ai_assisted: true
    text: Meanwhile the markets kept growing and demand kept rising. Even manufacture was no longer enough. Then steam and machinery revolutionised industrial production. The place of manufacture was taken by the giant, Modern Industry; the place of the industrial middle class was taken by industrial millionaires, the leaders of whole industrial armies, the modern {bourgeoisie}.
  p00018:
    covers: [p00018]
    based_on: sha256:d0023e9889dd36faa143462d02ce133de8d645a4699646425dc54d36c3c47e1b
    revision: 1
    ai_assisted: true
    text: Modern industry has established the world market, for which the discovery of America prepared the way. This market has given an immense development to commerce, to shipping, to communication by land. This development has in turn pushed industry to expand; and in proportion as industry, commerce, shipping and railways expanded, in the same proportion the {bourgeoisie} developed, increased its capital, and pushed into the background every class handed down from the Middle Ages.
  p00019:
    covers: [p00019]
    based_on: sha256:77018034ed4bafce7d64829926abb152a10ec22d84c149d2c5cb07c02ebad67c
    revision: 1
    ai_assisted: true
    text: We see, therefore, how the modern {bourgeoisie} is itself the product of a long course of development, of a series of revolutions in the modes of production and of exchange.
  p00020:
    covers: [p00020]
    based_on: sha256:1cb2139ca69d78b99d67d7497a2336d6ecdba9c3156f514c8801c84fdeb3c4ef
    revision: 1
    ai_assisted: true
    text: 'Each step in the development of the {bourgeoisie} was accompanied by a matching political advance of that class. It was an oppressed class under the rule of the feudal nobility; an armed and self-governing association in the medieval commune<fn ref="4"/>: here an independent urban republic (as in Italy and Germany), there the taxable “third estate” of the monarchy (as in France); afterwards, in the period of manufacture proper, it served either the semi-feudal or the absolute monarchy as a counterweight against the nobility, and was in fact the cornerstone of the great monarchies in general. Since the establishment of Modern Industry and of the world market, the {bourgeoisie} has at last conquered for itself exclusive political rule in the modern representative State. The executive of the modern state is only a committee for managing the common affairs of the whole {bourgeoisie}.'
  p00021:
    covers: [p00021]
    based_on: sha256:fd8bc9c7bccf8fc48942fdf0e0a56fa31f5870c15f0ded8756459abff94cd897
    revision: 1
    ai_assisted: true
    text: Historically, the {bourgeoisie} has played a most revolutionary role.
  p00022:
    covers: [p00022]
    based_on: sha256:98b29afe4e68e44400f0e84285c084a691c85278413d196dc2695a5b43ecc585
    revision: 1
    ai_assisted: true
    text: Wherever the {bourgeoisie} has gained the upper hand, it has put an end to all feudal, patriarchal, idyllic relations. It has mercilessly torn apart the varied feudal ties that bound man to his “natural superiors”, and has left no other bond between man and man than naked self-interest, than unfeeling “cash payment”. It has drowned the most heavenly ecstasies of religious passion, of chivalrous enthusiasm, of narrow-minded sentimentality, in the icy water of selfish calculation. It has reduced personal worth to exchange value, and in place of the countless chartered freedoms that could not be taken away, it has set up that single, unscrupulous freedom — Free Trade. In one word, for exploitation veiled by religious and political illusions, it has substituted naked, shameless, direct, brutal exploitation.
  p00023:
    covers: [p00023]
    based_on: sha256:a35a6ddb130205ec4f99fc5b2c92aff1921ef813547b20aa5c00625502af2c88
    revision: 1
    ai_assisted: true
    text: The {bourgeoisie} has stripped the halo from every occupation that was until now honoured and looked up to with reverent awe. It has turned the doctor, the lawyer, the priest, the poet, the scientist into its paid wage labourers.
  p00024:
    covers: [p00024]
    based_on: sha256:fd14ca99ef87c8c7ce8aed58a2a0b23a5bf2af011aae9dc0477c640e79ec4c9c
    revision: 1
    ai_assisted: true
    text: The {bourgeoisie} has torn away the sentimental veil from the family, and has reduced the family relationship to a mere money relationship.
  p00025:
    covers: [p00025]
    based_on: sha256:4a8d0c0a21a55426ec3419e7fe45fdffca7ab1d2191a861d79ae0656cfac1549
    revision: 1
    ai_assisted: true
    text: The {bourgeoisie} has revealed how it came about that the brutal show of vigour in the Middle Ages, which reactionaries admire so much, found its fitting counterpart in the laziest idleness. It has been the first to show what human activity can achieve. It has accomplished wonders far greater than Egyptian pyramids, Roman aqueducts and Gothic cathedrals; it has carried out expeditions that put in the shade all earlier Exoduses of nations and crusades.
  p00026:
    covers: [p00026]
    based_on: sha256:a2f8c5dc3257aa13d645785abfe9098413bf20d2f929269242af36f6a64cc2a0
    revision: 1
    ai_assisted: true
    text: The {bourgeoisie} cannot exist without constantly revolutionising the instruments of production, and so the relations of production, and with them all the relations of society. Keeping the old modes of production unchanged was, on the contrary, the first condition of existence for all earlier industrial classes. Constant revolutionising of production, unbroken disturbance of all social conditions, endless uncertainty and unrest distinguish the {bourgeoisie:adj} era from all earlier ones. All fixed, fast-frozen relations, with their train of ancient and revered prejudices and opinions, are swept away; all newly formed ones become outdated before they can harden. All that is solid melts into air, all that is holy is profaned, and man is at last forced to face with sober senses his real conditions of life, and his relations with his kind.
  p00027:
    covers: [p00027]
    based_on: sha256:20c3f8f8b144da6e5a4361f3606e1c2e9519240e4e117b7867cb88de8adab344
    revision: 1
    ai_assisted: true
    text: The need for a constantly expanding market for its products chases the {bourgeoisie} over the whole surface of the globe. It must nestle everywhere, settle everywhere, make connections everywhere.
  p00028:
    covers: [p00028]
    based_on: sha256:43de34b5103d56cc9963058b02aef5f5bc2acee7510edeb40703e120c1d56292
    revision: 1
    ai_assisted: true
    text: Through its exploitation of the world market, the {bourgeoisie} has given a cosmopolitan character to production and consumption in every country. To the great annoyance of reactionaries, it has pulled out from under the feet of industry the national ground on which it stood. All old-established national industries have been destroyed or are being destroyed every day. They are pushed out by new industries, whose introduction becomes a life-and-death question for all civilised nations — by industries that no longer process local raw material, but raw material brought from the remotest regions; industries whose products are consumed not only at home, but in every part of the globe. In place of the old needs, satisfied by the country's own production, we find new needs, which require the products of distant lands and climates to satisfy them. In place of the old local and national isolation and self-sufficiency, we have exchange in every direction, the universal interdependence of nations. And as in material production, so also in intellectual production. The intellectual creations of individual nations become common property. National one-sidedness and narrow-mindedness become more and more impossible, and from the many national and local literatures there arises a world literature.
  p00029:
    covers: [p00029]
    based_on: sha256:20e697bf141b81c8404bee434d809875f7e1c12cccea95ebe9e0185b2bb23cba
    revision: 1
    ai_assisted: true
    text: Through the rapid improvement of all instruments of production, through the immensely easier means of communication, the {bourgeoisie} draws all nations, even the most barbarian, into civilisation. The cheap prices of commodities are the heavy artillery with which it batters down all Chinese walls, with which it forces the barbarians' intensely stubborn hatred of foreigners to surrender. It compels all nations, on pain of extinction, to adopt the {bourgeoisie:adj} mode of production; it compels them to introduce what it calls civilisation into their midst, that is, to become {bourgeoisie:adj} themselves. In one word, it creates a world after its own image.
  p00030:
    covers: [p00030]
    based_on: sha256:bf7912623f70a5ba71e5f60abc6693dac6e5911e90937dee9753578fe0bc7f76
    revision: 1
    ai_assisted: true
    text: The {bourgeoisie} has subjected the countryside to the rule of the towns. It has created enormous cities, has greatly increased the urban population compared with the rural, and has thus rescued a considerable part of the population from the idiocy of rural life. Just as it has made the countryside dependent on the towns, so it has made barbarian and semi-barbarian countries dependent on the civilised ones, peasant nations on {bourgeoisie:adj} nations, the East on the West.
  p00031:
    covers: [p00031]
    based_on: sha256:606b4d6810218f5ed26c524e86250f89d1a1a7abcb32260d4cad1850403eaa49
    revision: 1
    ai_assisted: true
    text: The {bourgeoisie} keeps doing away more and more with the scattered state of the population, of the means of production, and of property. It has packed the population together, centralised the means of production, and concentrated property in a few hands. The necessary consequence of this was political centralisation. Independent provinces, or only loosely connected ones, with separate interests, laws, governments and systems of taxation, were lumped together into one nation, with one government, one code of laws, one national class interest, one frontier and one customs tariff.
  p00032:
    covers: [p00032]
    based_on: sha256:bc1429c6de01cb1da34446735b69881e46fec2f2daa786613e4defff76cc965a
    revision: 1
    ai_assisted: true
    text: During its rule of barely one hundred years, the {bourgeoisie} has created more massive and more colossal productive forces than all preceding generations together. Subjection of Nature's forces to man, machinery, application of chemistry to industry and agriculture, steam navigation, railways, electric telegraphs, clearing of whole continents for farming, canalisation of rivers, whole populations conjured out of the ground — what earlier century had even an inkling that such productive forces slept in the lap of social labour?
  p00033:
    covers: [p00033]
    based_on: sha256:4efcb6b4fb797c07758e0e9fd717e9fafc7835a9bc21f17a923d83b6162458ec
    revision: 1
    ai_assisted: true
    text: "We see then: the means of production and of exchange, on whose foundation the {bourgeoisie} built itself up, were created in feudal society. At a certain stage in the development of these means of production and of exchange, the conditions under which feudal society produced and exchanged — the feudal organisation of agriculture and manufacturing industry, in one word, the feudal relations of property — were no longer compatible with the productive forces that had already developed; they became so many shackles. They had to be burst apart; they were burst apart."
  p00034:
    covers: [p00034]
    based_on: sha256:795b9f6584d84c479be7035a09352eda96d13cadc3725d3cb92e19d904a350f0
    revision: 1
    ai_assisted: true
    text: Into their place stepped free competition, together with a social and political constitution adapted to it, and the economic and political rule of the {bourgeoisie:adj} class.
  p00035:
    covers: [p00035]
    based_on: sha256:647270beea7061c95e8277ab4e055de740a4c1eefffa31d7f3963cc8a67b33f1
    revision: 1
    ai_assisted: true
    text: |
      A similar movement is going on before our own eyes. Modern {bourgeoisie:adj} society, with its relations of production, of exchange and of property, a society that has conjured up such gigantic means of production and of exchange, is like the sorcerer who is no longer able to control the powers of the underworld that he has called up by his spells. For many decades now, the history of industry and commerce has been nothing but the history of the revolt of modern productive forces against modern conditions of production, against the property relations that are the conditions for the existence of the {bourgeoisie} and of its rule. It is enough to mention the commercial crises that, by returning again and again, put the existence of the entire {bourgeoisie:adj} society on trial, each time more threateningly.

      In these crises, a great part not only of the existing products, but also of the productive forces created earlier, is destroyed again and again. In these crises there breaks out an epidemic that in all earlier epochs would have seemed absurd — the epidemic of over-production. Society suddenly finds itself thrown back into a state of temporary barbarism; it looks as if a famine, a universal war of destruction, had cut off the supply of every means of subsistence; industry and commerce seem to be destroyed; and why? Because there is too much civilisation, too much means of subsistence, too much industry, too much commerce. The productive forces at the disposal of society no longer serve to further the development of the conditions of {bourgeoisie:adj} property; on the contrary, they have become too powerful for these conditions, which shackle them, and as soon as they overcome these shackles, they bring disorder into the whole of {bourgeoisie:adj} society and endanger the existence of {bourgeoisie:adj} property. The conditions of {bourgeoisie:adj} society are too narrow to hold the wealth created by them. And how does the {bourgeoisie} get over these crises? On the one hand, by the forced destruction of a mass of productive forces; on the other, by the conquest of new markets, and by the more thorough exploitation of the old ones. That is to say, by paving the way for more extensive and more destructive crises, and by reducing the means by which crises are prevented.
  p00036:
    covers: [p00036]
    based_on: sha256:769d05d5e81dac68a094838e5e996d23f893d2955ab3b547be4a2b0907ae8534
    revision: 1
    ai_assisted: true
    text: The weapons with which the {bourgeoisie} cut feudalism down to the ground are now turned against the {bourgeoisie} itself.
  p00037:
    covers: [p00037]
    based_on: sha256:d18c724599997354e68ea87ee03596d409fb046f02a76650c215a2f78d076012
    revision: 1
    ai_assisted: true
    text: But the {bourgeoisie} has not only forged the weapons that bring death to itself; it has also called into existence the men who are to use those weapons — the modern working class — the {proletariat:pl}.
  p00038:
    covers: [p00038]
    based_on: sha256:2615d92187b0ab394ce522919561220c132067dc1c50d025c72d5dd624e7aeed
    revision: 1
    ai_assisted: true
    text: In proportion as the {bourgeoisie}, that is, capital, develops, in the same proportion the {proletariat}, the modern working class, develops — a class of labourers who live only as long as they find work, and who find work only as long as their labour increases capital. These labourers, who must sell themselves piece by piece, are a commodity, like every other article of commerce, and are therefore exposed to all the ups and downs of competition, to all the fluctuations of the market.
  p00039:
    covers: [p00039]
    based_on: sha256:23c001e71bac6f8badf8c99ec7b84bef8c0bacfdc19abf601ed05abe9ec97756
    revision: 1
    ai_assisted: true
    text: Because of the extensive use of machinery and the division of labour, the work of the {proletariat:pl} has lost all individual character, and therefore all charm for the worker. He becomes an appendage of the machine, and only the most simple, most monotonous and most easily learned knack is required of him. Hence the cost of producing a worker is limited almost entirely to the means of subsistence he needs to keep himself alive and to have offspring. But the price of a commodity, and therefore also of labour, is equal to its cost of production. Therefore, in proportion as the work becomes more repulsive, the wage decreases. What is more, in proportion as the use of machinery and the division of labour increases, in the same proportion the burden of toil also increases, whether by lengthening the working hours, by increasing the work demanded in a given time, or by speeding up the machinery, etc.
  p00040:
    covers: [p00040]
    based_on: sha256:3d1b747a3c8bf5c958029347f77e3cfb44a07dbf0c77f085bf79505a8773b9f5
    revision: 1
    ai_assisted: true
    text: Modern Industry has turned the little workshop of the patriarchal master into the great factory of the industrial capitalist. Masses of labourers, crowded into the factory, are organised like soldiers. As privates of the industrial army they are placed under the command of a complete hierarchy of officers and sergeants. They are not only slaves of the {bourgeoisie:adj} class and of the {bourgeoisie:adj} State; they are enslaved every day and every hour by the machine, by the supervisor, and above all by the individual {bourgeoisie:adj} manufacturer himself. The more openly this despotism proclaims gain to be its end and aim, the more petty, the more hateful and the more embittering it is.
  p00041:
    covers: [p00041]
    based_on: sha256:89358997778b0926c37c3f2932b4e5a14d1029d4e1c82cd747f8eab4b6c542b9
    revision: 1
    ai_assisted: true
    text: The less skill and physical strength manual labour requires — in other words, the more modern industry develops — the more the labour of men is replaced by that of women. Differences of age and sex no longer have any distinct social validity for the working class. All are instruments of labour, more or less expensive to use, according to their age and sex.
  p00042:
    covers: [p00042]
    based_on: sha256:af6720bbdb6bc6d9c927f2b9ebd07c14185df811f03abd8b27fe114243f55456
    revision: 1
    ai_assisted: true
    text: "No sooner is the exploitation of the labourer by the manufacturer over, to the extent that he receives his wages in cash, than he is set upon by the other parts of the {bourgeoisie}: the landlord, the shopkeeper, the pawnbroker, etc."
  p00043:
    covers: [p00043]
    based_on: sha256:a79fb05311620068befc9f70d6897dac3e7779c07411f8a6cb99c78f00d98d63
    revision: 1
    ai_assisted: true
    text: The lower layers of the middle class — the small tradespeople, shopkeepers and retired tradesmen generally, the craftsmen and peasants — all these sink gradually into the {proletariat}. This is partly because their tiny capital is not enough for the scale on which Modern Industry is carried on, and is swamped in competition with the large capitalists; partly because their specialised skill is made worthless by new methods of production. Thus the {proletariat} is recruited from all classes of the population.
  p00044:
    covers: [p00044]
    based_on: sha256:024924dfd5791ca62514a336cf172d59e8166dd5eef459ed71d5317968ef6c48
    revision: 1
    ai_assisted: true
    text: The {proletariat} goes through various stages of development. Its struggle with the {bourgeoisie} begins with its birth. At first the contest is carried on by individual labourers, then by the workers of a factory, then by the workers of one trade in one place, against the individual {bourgeoisie:adj} who directly exploits them. They direct their attacks not against the {bourgeoisie:adj} conditions of production, but against the instruments of production themselves; they destroy imported goods that compete with their labour, they smash machinery to pieces, they set factories on fire, they try to restore by force the vanished status of the worker of the Middle Ages.
  p00045:
    covers: [p00045]
    based_on: sha256:918a88eba88a60fcf93a1c7c7b025833795c04ea7cbb6eedf6ebc16be5f50c9f
    revision: 1
    ai_assisted: true
    text: "At this stage the labourers still form a disconnected mass scattered over the whole country and broken up by their competition with one another. If they unite anywhere to form more compact bodies, this is not yet the result of their own active union, but of the union of the {bourgeoisie}, which, in order to reach its own political ends, is compelled to set the whole {proletariat} in motion, and is moreover still able to do so for a time. At this stage, therefore, the {proletariat:pl} do not fight their enemies, but the enemies of their enemies: the remnants of absolute monarchy, the landowners, the non-industrial {bourgeoisie}, the petty bourgeois. Thus the whole historical movement is concentrated in the hands of the {bourgeoisie}; every victory won in this way is a victory for the {bourgeoisie}."
