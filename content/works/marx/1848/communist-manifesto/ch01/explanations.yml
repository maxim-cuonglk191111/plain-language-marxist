schema_version: 2
document: document:marx:1848:communist-manifesto:ch01
explanations:
  e001:
    kind: translation_note
    targets: [p00017]
    text: The source here reads "Even manufacturer no longer sufficed". Moore's 1888 translation has "manufacture", the system of hand production in workshops, which is what the sentence is about. The Plain English follows "manufacture".
    ai_assisted: true
  e002:
    kind: translation_note
    targets: [p00034]
    text: The source here reads "a social and political constitution adapted in it". Moore's 1888 translation has "adapted to it". The Plain English follows "adapted to it".
    ai_assisted: true
  e003:
    kind: translation_note
    targets: [p00035]
    text: The source here reads "the conditions for the existence of the bourgeois and of its rule". Moore's 1888 translation has "the bourgeoisie". The Plain English follows "the bourgeoisie", as "its rule" requires.
    ai_assisted: true
  e004:
    kind: translation_note
    targets: [p00055]
    text: The source here reads "modern industry labour". Moore's 1888 translation has "modern industrial labour". The Plain English follows "industrial labour".
    ai_assisted: true
  e005:
    kind: translation_note
    targets: [p00060]
    text: The source here reads "instead of rising with the process of industry". Moore's 1888 translation has "the progress of industry". The Plain English follows "progress".
    ai_assisted: true
  e006:
    kind: explanation
    targets: [p00002, p00003, p00004, p00005, p00006, p00007]
    text: |-
      This short opening says why the Manifesto was written. In 1848 governments across Europe, and many of their opponents, used “communist” as an insult.

      Marx and Engels turn this around. If everyone fears communism, it is already a real power. So it is time for communists to say openly what they want. The Manifesto was written for the Communist League, a small international group, and first printed in London in February 1848.
    ai_assisted: true
  e007:
    kind: explanation
    targets: [p00009, p00010, p00011, p00012, p00013]
    text: |-
      This section makes the chapter’s first big claim: written history is a history of struggles between classes. The examples run from ancient Rome to the Middle Ages. In each, one class lived from the work of another.

      The new point is about the present. Modern society is splitting into just two great classes, the bourgeoisie and the proletariat. The rest of the chapter tells the story of each.
    ai_assisted: true
  e008:
    kind: explanation
    targets: [p00014, p00015, p00016, p00017, p00018, p00019, p00020]
    text: |-
      Here the Manifesto tells how the bourgeoisie grew. It began with the townspeople of the Middle Ages. Trade with America and Asia made them rich. Production moved from guild workshops to manufacture, and then to factories with machines.

      Economic power came first, and political power followed it. The section ends with a famous claim: the modern state manages the common business of the whole bourgeoisie.
    ai_assisted: true
  e009:
    kind: explanation
    targets: [p00021, p00022, p00023, p00024, p00025, p00026, p00027, p00028, p00029, p00030, p00031, p00032]
    text: |-
      This section looks at what the bourgeoisie has done, and it mixes accusation with something close to admiration.

      On one side, the bourgeoisie has swept away old ties of loyalty, honour and religion and put cash payment in their place. On the other, it has built a world market, great cities and more productive power than all earlier ages together. “Revolutionary” here means that it overturns every old way of life it meets.
    ai_assisted: true
  e010:
    kind: explanation
    targets: [p00033, p00034, p00035, p00036]
    text: |-
      This section turns the story around. Feudal society once held back the new means of production, and so it was burst apart.

      Now, the Manifesto argues, modern productive forces are outgrowing bourgeois property in the same way. The sign is the commercial crisis: goods and factories lie idle because there is too much, not too little. The weapons that brought the bourgeoisie to power are now turned against it.
    ai_assisted: true
  e011:
    kind: explanation
    targets: [p00037, p00038, p00039, p00040, p00041, p00042, p00043]
    text: |-
      Now the chapter turns to the proletariat. Workers own nothing but their ability to work, so they must sell it like any other commodity.

      Machines and the division of labour make work simpler, duller and worse paid. Small shopkeepers, craftsmen and peasants cannot compete with big industry, and many of them sink into the working class.
    ai_assisted: true
  e012:
    kind: explanation
    targets: [p00044, p00045, p00046, p00047, p00048, p00049, p00050, p00051]
    text: |-
      This section traces how the workers’ struggle grows. At first workers fight alone or in small groups, and often attack the machines themselves. Then factories bring them together, and they form trade unions.

      Railways and other new means of communication join local fights into one national struggle. Because every class struggle is a political struggle, the workers’ movement becomes a political party.
    ai_assisted: true
  e013:
    kind: explanation
    targets: [p00052, p00053, p00054, p00055, p00056, p00057, p00058, p00059, p00060, p00061]
    text: |-
      The last section brings the argument together. Other classes fight to keep their place in the old society. Only the proletariat, which owns nothing, can win without putting another class below it. Its movement is the movement of the great majority.

      The chapter ends with its strongest claim. By creating the modern working class, the bourgeoisie produces “its own grave-diggers”.
    ai_assisted: true
  e014:
    kind: historical_context
    targets: [p00002]
    text: |-
      “Pope and Tsar” are the head of the Catholic Church and the emperor of Russia. Metternich was the chief minister of Austria and the main defender of the old order in Europe. Guizot was the leading minister of the French king.

      The “German police spies” were agents who watched communist exiles living abroad.
    ai_assisted: true
  e015:
    kind: historical_context
    targets: [p00015]
    text: The Cape is the Cape of Good Hope, at the southern tip of Africa. Portuguese sailors first sailed around it in 1488. This opened a sea route from Europe to India and China.
    ai_assisted: true
  e016:
    kind: historical_context
    targets: [p00025]
    text: The Exodus is the Bible story of the people of Israel leaving Egypt. The crusades were wars fought by European armies in the Middle East between 1096 and 1291.
    ai_assisted: true
  e017:
    kind: historical_context
    targets: [p00029]
    text: The image recalls the Great Wall of China and China’s limits on foreign trade. In the Opium War of 1839–1842, Britain forced China to open its ports.
    ai_assisted: true
  e018:
    kind: historical_context
    targets: [p00046]
    text: In Britain, workers’ “combinations” were against the law until 1824. After that, trade unions grew quickly, although strikes were still often punished.
    ai_assisted: true
  e019:
    kind: historical_context
    targets: [p00048]
    text: The Ten Hours Act was passed by the British Parliament in 1847. It limited the working day of women and young people in textile mills to ten hours. Many landowners in Parliament supported it, partly in a quarrel with the factory owners.
    ai_assisted: true
  e020:
    kind: translation_note
    targets: [p00030]
    text: Moore translates the German word “Idiotismus” as “idiocy”. In German at the time, the word could also mean the isolation of private life, from the Greek idiōtēs, a private person. Some scholars read it that way here. The Plain English follows Moore.
    ai_assisted: true
