passages:
  - id: p00001
    type: heading
    level: 1
    text: Manifesto of the Communist Party
    hash: sha256:474efb48401a7910116ed78002aac798a37f586478b02fc8ee8d7a19a881d99a
    state: active
  - id: p00002
    type: paragraph
    text: "A spectre is haunting Europe — the spectre of communism. All the powers of old Europe have entered into a holy alliance to exorcise this spectre: Pope and Tsar, Metternich and Guizot, French Radicals and German police-spies."
    hash: sha256:e0acf0c5ba682c35ec7d75e7972731021dc8f5cfa7076efe05a65a830b7ed874
    state: active
  - id: p00003
    type: paragraph
    text: Where is the party in opposition that has not been decried as communistic by its opponents in power? Where is the opposition that has not hurled back the branding reproach of communism, against the more advanced opposition parties, as well as against its reactionary adversaries?
    hash: sha256:ac89cf35d857514e23c39376a5985166a88006d0c2d6166d17061518ccd3b4e6
    state: active
  - id: p00004
    type: paragraph
    text: "Two things result from this fact:"
    hash: sha256:91bec124e4e832a52f117ada660fb6a7e98596700fd63057ddd65e3c390a4022
    state: active
  - id: p00005
    type: paragraph
    text: <indent level="1"/>I. Communism is already acknowledged by all European powers to be itself a power.
    hash: sha256:2f9652d45fd6d734e7a4e41df222fa2dca54b4dcdf093785ee85b1a20486ed45
    state: active
  - id: p00006
    type: paragraph
    text: <indent level="1"/>II. It is high time that Communists should openly, in the face of the whole world, publish their views, their aims, their tendencies, and meet this nursery tale of the Spectre of Communism with a manifesto of the party itself.
    hash: sha256:1e330a3aed0384f5be568e3fc5e32c7668d184a3a243f497cc08d34dba9b4243
    state: active
  - id: p00007
    type: paragraph
    text: To this end, Communists of various nationalities have assembled in London and sketched the following manifesto, to be published in the English, French, German, Italian, Flemish and Danish languages.
    hash: sha256:42dd14ffa1c7964c6ccf4ce8fe78b312b0bd4b403e4f8f5f6da72f65c8bbdb7b
    state: active
  - id: p00008
    type: heading
    level: 3
    text: Chapter I. Bourgeois and Proletarians<fn ref="1"/>
    hash: sha256:7ec58ee64bd8898c19553d3d823ed49a0b1fccd284a2c4e66e68a662b74ed9f3
    state: active
  - id: p00009
    type: paragraph
    text: The history of all hitherto existing society<fn ref="2"/> is the history of class struggles.
    hash: sha256:3b856d7acbf45226c168324bcaf29fe9e2b1c56ee3ccbb9e78c25b62502b70c7
    state: active
  - id: p00010
    type: paragraph
    text: Freeman and slave, patrician and plebeian, lord and serf, guild-master<fn ref="3"/> and journeyman, in a word, oppressor and oppressed, stood in constant opposition to one another, carried on an uninterrupted, now hidden, now open fight, a fight that each time ended, either in a revolutionary reconstitution of society at large, or in the common ruin of the contending classes.
    hash: sha256:31fd0d3c511520f677b0a873ce2a18813e721388a77e873c040cfb7c79f9145d
    state: active
  - id: p00011
    type: paragraph
    text: In the earlier epochs of history, we find almost everywhere a complicated arrangement of society into various orders, a manifold gradation of social rank. In ancient Rome we have patricians, knights, plebeians, slaves; in the Middle Ages, feudal lords, vassals, guild-masters, journeymen, apprentices, serfs; in almost all of these classes, again, subordinate gradations.
    hash: sha256:8f20c6ba1a4a1b0b92f4b37ea3e37db7afa3b90f3688c252ce5ea7c307af9ee2
    state: active
  - id: p00012
    type: paragraph
    text: The modern bourgeois society that has sprouted from the ruins of feudal society has not done away with class antagonisms. It has but established new classes, new conditions of oppression, new forms of struggle in place of the old ones.
    hash: sha256:bb21a1ecc33d8b027b9b27409d4647d338781d96a094fe204efa468eeaf79c7e
    state: active
  - id: p00013
    type: paragraph
    text: "Our epoch, the epoch of the bourgeoisie, possesses, however, this distinct feature: it has simplified class antagonisms. Society as a whole is more and more splitting up into two great hostile camps, into two great classes directly facing each other — Bourgeoisie and Proletariat."
    hash: sha256:840b5b54a747b9f13d48eb2585a1a83d2f5bbede784f25050218b524bd1f3d56
    state: active
  - id: p00014
    type: paragraph
    text: From the serfs of the Middle Ages sprang the chartered burghers of the earliest towns. From these burgesses the first elements of the bourgeoisie were developed.
    hash: sha256:903a2c09bf66b66d97c876b7f687b88e4fa832f3856dee57e84576bbb14e43de
    state: active
  - id: p00015
    type: paragraph
    text: The discovery of America, the rounding of the Cape, opened up fresh ground for the rising bourgeoisie. The East-Indian and Chinese markets, the colonisation of America, trade with the colonies, the increase in the means of exchange and in commodities generally, gave to commerce, to navigation, to industry, an impulse never before known, and thereby, to the revolutionary element in the tottering feudal society, a rapid development.
    hash: sha256:0dda3efac63f57b85aa9760cfed2b130acd0b1dcc23fb5d1654f2f3579c3e9f1
    state: active
  - id: p00016
    type: paragraph
    text: The feudal system of industry, in which industrial production was monopolised by closed guilds, now no longer sufficed for the growing wants of the new markets. The manufacturing system took its place. The guild-masters were pushed on one side by the manufacturing middle class; division of labour between the different corporate guilds vanished in the face of division of labour in each single workshop.
    hash: sha256:c740c3110a56caad3260a40f1a4c38cc1900e3a3234e9e4deac1d6479d9fb524
    state: active
  - id: p00017
    type: paragraph
    text: Meantime the markets kept ever growing, the demand ever rising. Even manufacturer no longer sufficed. Thereupon, steam and machinery revolutionised industrial production. The place of manufacture was taken by the giant, Modern Industry; the place of the industrial middle class by industrial millionaires, the leaders of the whole industrial armies, the modern bourgeois.
    hash: sha256:1c1c42a5a433d2d92839f86f97dd2c754f575afcaaa4fd73228b4c74130c85a6
    state: active
  - id: p00018
    type: paragraph
    text: Modern industry has established the world market, for which the discovery of America paved the way. This market has given an immense development to commerce, to navigation, to communication by land. This development has, in its turn, reacted on the extension of industry; and in proportion as industry, commerce, navigation, railways extended, in the same proportion the bourgeoisie developed, increased its capital, and pushed into the background every class handed down from the Middle Ages.
    hash: sha256:3838a5852c27c13a86afec52cf685cec6be1ebd1fa673220fdc59018343e00e8
    state: active
  - id: p00019
    type: paragraph
    text: We see, therefore, how the modern bourgeoisie is itself the product of a long course of development, of a series of revolutions in the modes of production and of exchange.
    hash: sha256:5299050a8bf8278616ef6777d49972ead773a86134045b3a0bead136910a464e
    state: active
  - id: p00020
    type: paragraph
    text: 'Each step in the development of the bourgeoisie was accompanied by a corresponding political advance of that class. An oppressed class under the sway of the feudal nobility, an armed and self-governing association in the medieval commune<fn ref="4"/>: here independent urban republic (as in Italy and Germany); there taxable “third estate” of the monarchy (as in France); afterwards, in the period of manufacturing proper, serving either the semi-feudal or the absolute monarchy as a counterpoise against the nobility, and, in fact, cornerstone of the great monarchies in general, the bourgeoisie has at last, since the establishment of Modern Industry and of the world market, conquered for itself, in the modern representative State, exclusive political sway. The executive of the modern state is but a committee for managing the common affairs of the whole bourgeoisie.'
    hash: sha256:39c3ee4a42ef160bb0c6499966f1df043e9569b1fc905d99aaefe85172b85eeb
    state: active
  - id: p00021
    type: paragraph
    text: The bourgeoisie, historically, has played a most revolutionary part.
    hash: sha256:78184190b0279627ca1759fc24fd02d27218f9d97dbafa3323df79aab0718c8a
    state: active
  - id: p00022
    type: paragraph
    text: The bourgeoisie, wherever it has got the upper hand, has put an end to all feudal, patriarchal, idyllic relations. It has pitilessly torn asunder the motley feudal ties that bound man to his “natural superiors”, and has left remaining no other nexus between man and man than naked self-interest, than callous “cash payment”. It has drowned the most heavenly ecstasies of religious fervour, of chivalrous enthusiasm, of philistine sentimentalism, in the icy water of egotistical calculation. It has resolved personal worth into exchange value, and in place of the numberless indefeasible chartered freedoms, has set up that single, unconscionable freedom — Free Trade. In one word, for exploitation, veiled by religious and political illusions, it has substituted naked, shameless, direct, brutal exploitation.
    hash: sha256:e9129124f02c0babb6bac8d888046cbb30e40b2b95105d149f4050a79959cc8a
    state: active
  - id: p00023
    type: paragraph
    text: The bourgeoisie has stripped of its halo every occupation hitherto honoured and looked up to with reverent awe. It has converted the physician, the lawyer, the priest, the poet, the man of science, into its paid wage labourers.
    hash: sha256:1e75b7a1acc2f72c5a386b71e7d5e83714a1f3bb7f3f49a81d58cf8cb77299d0
    state: active
  - id: p00024
    type: paragraph
    text: The bourgeoisie has torn away from the family its sentimental veil, and has reduced the family relation to a mere money relation.
    hash: sha256:ee2df7c99b4fc5802a5e2fc8d4fd10901e9bf0f4654039ab3cc67d294d1ea6ef
    state: active
  - id: p00025
    type: paragraph
    text: The bourgeoisie has disclosed how it came to pass that the brutal display of vigour in the Middle Ages, which reactionaries so much admire, found its fitting complement in the most slothful indolence. It has been the first to show what man’s activity can bring about. It has accomplished wonders far surpassing Egyptian pyramids, Roman aqueducts, and Gothic cathedrals; it has conducted expeditions that put in the shade all former Exoduses of nations and crusades.
    hash: sha256:e578b17d87a8873e0da226ebb2a735bb83efa111136c1883ea68a60d1b65dc81
    state: active
  - id: p00026
    type: paragraph
    text: The bourgeoisie cannot exist without constantly revolutionising the instruments of production, and thereby the relations of production, and with them the whole relations of society. Conservation of the old modes of production in unaltered form, was, on the contrary, the first condition of existence for all earlier industrial classes. Constant revolutionising of production, uninterrupted disturbance of all social conditions, everlasting uncertainty and agitation distinguish the bourgeois epoch from all earlier ones. All fixed, fast-frozen relations, with their train of ancient and venerable prejudices and opinions, are swept away, all new-formed ones become antiquated before they can ossify. All that is solid melts into air, all that is holy is profaned, and man is at last compelled to face with sober senses his real conditions of life, and his relations with his kind.
    hash: sha256:26003d1a95dd1cf42f2be325a2dea56f58c0fea83571e412fd751d8ddcd1dd15
    state: active
  - id: p00027
    type: paragraph
    text: The need of a constantly expanding market for its products chases the bourgeoisie over the entire surface of the globe. It must nestle everywhere, settle everywhere, establish connexions everywhere.
    hash: sha256:20141f098e1fa20f61cc341a71b350436b1bba1e2f118d37ee370cf090dd16b7
    state: active
  - id: p00028
    type: paragraph
    text: The bourgeoisie has through its exploitation of the world market given a cosmopolitan character to production and consumption in every country. To the great chagrin of Reactionists, it has drawn from under the feet of industry the national ground on which it stood. All old-established national industries have been destroyed or are daily being destroyed. They are dislodged by new industries, whose introduction becomes a life and death question for all civilised nations, by industries that no longer work up indigenous raw material, but raw material drawn from the remotest zones; industries whose products are consumed, not only at home, but in every quarter of the globe. In place of the old wants, satisfied by the production of the country, we find new wants, requiring for their satisfaction the products of distant lands and climes. In place of the old local and national seclusion and self-sufficiency, we have intercourse in every direction, universal inter-dependence of nations. And as in material, so also in intellectual production. The intellectual creations of individual nations become common property. National one-sidedness and narrow-mindedness become more and more impossible, and from the numerous national and local literatures, there arises a world literature.
    hash: sha256:b3e898af2feb62b529174dd5ba370a5f9a98ee358c6003626a90e70f74d90dce
    state: active
  - id: p00029
    type: paragraph
    text: The bourgeoisie, by the rapid improvement of all instruments of production, by the immensely facilitated means of communication, draws all, even the most barbarian, nations into civilisation. The cheap prices of commodities are the heavy artillery with which it batters down all Chinese walls, with which it forces the barbarians’ intensely obstinate hatred of foreigners to capitulate. It compels all nations, on pain of extinction, to adopt the bourgeois mode of production; it compels them to introduce what it calls civilisation into their midst, i.e., to become bourgeois themselves. In one word, it creates a world after its own image.
    hash: sha256:a742ee45dfca5d66357188c3383fbc5fa0ea48240be5e4bc2b14f413edb4aafd
    state: active
  - id: p00030
    type: paragraph
    text: The bourgeoisie has subjected the country to the rule of the towns. It has created enormous cities, has greatly increased the urban population as compared with the rural, and has thus rescued a considerable part of the population from the idiocy of rural life. Just as it has made the country dependent on the towns, so it has made barbarian and semi-barbarian countries dependent on the civilised ones, nations of peasants on nations of bourgeois, the East on the West.
    hash: sha256:99f557a1666796ef9d0e79327f0fb3a8208a28cd7046edafdcd8f4293b813a0d
    state: active
  - id: p00031
    type: paragraph
    text: The bourgeoisie keeps more and more doing away with the scattered state of the population, of the means of production, and of property. It has agglomerated population, centralised the means of production, and has concentrated property in a few hands. The necessary consequence of this was political centralisation. Independent, or but loosely connected provinces, with separate interests, laws, governments, and systems of taxation, became lumped together into one nation, with one government, one code of laws, one national class-interest, one frontier, and one customs-tariff.
    hash: sha256:19392e764c54a3c7da7c0a8583821f994422777218b74e0977163272dd4ba2f1
    state: active
  - id: p00032
    type: paragraph
    text: The bourgeoisie, during its rule of scarce one hundred years, has created more massive and more colossal productive forces than have all preceding generations together. Subjection of Nature’s forces to man, machinery, application of chemistry to industry and agriculture, steam-navigation, railways, electric telegraphs, clearing of whole continents for cultivation, canalisation of rivers, whole populations conjured out of the ground — what earlier century had even a presentiment that such productive forces slumbered in the lap of social labour?
    hash: sha256:c2bc3df7db999402f007a9acb70d18742e2041be88d6729d9b073cf9ae1c560a
    state: active
  - id: p00033
    type: paragraph
    text: "We see then: the means of production and of exchange, on whose foundation the bourgeoisie built itself up, were generated in feudal society. At a certain stage in the development of these means of production and of exchange, the conditions under which feudal society produced and exchanged, the feudal organisation of agriculture and manufacturing industry, in one word, the feudal relations of property became no longer compatible with the already developed productive forces; they became so many fetters. They had to be burst asunder; they were burst asunder."
    hash: sha256:6a8b6266456eb413747ed6e056b38f18512da1b38c20ec09d2b083f0e1bd2b47
    state: active
  - id: p00034
    type: paragraph
    text: Into their place stepped free competition, accompanied by a social and political constitution adapted in it, and the economic and political sway of the bourgeois class.
    hash: sha256:13865fa424e8117734f53f94bd21d3801f104cac665881dd7e1356f4be61ddca
    state: active
  - id: p00035
    type: paragraph
    text: A similar movement is going on before our own eyes. Modern bourgeois society, with its relations of production, of exchange and of property, a society that has conjured up such gigantic means of production and of exchange, is like the sorcerer who is no longer able to control the powers of the nether world whom he has called up by his spells. For many a decade past the history of industry and commerce is but the history of the revolt of modern productive forces against modern conditions of production, against the property relations that are the conditions for the existence of the bourgeois and of its rule. It is enough to mention the commercial crises that by their periodical return put the existence of the entire bourgeois society on its trial, each time more threateningly. In these crises, a great part not only of the existing products, but also of the previously created productive forces, are periodically destroyed. In these crises, there breaks out an epidemic that, in all earlier epochs, would have seemed an absurdity — the epidemic of over-production. Society suddenly finds itself put back into a state of momentary barbarism; it appears as if a famine, a universal war of devastation, had cut off the supply of every means of subsistence; industry and commerce seem to be destroyed; and why? Because there is too much civilisation, too much means of subsistence, too much industry, too much commerce. The productive forces at the disposal of society no longer tend to further the development of the conditions of bourgeois property; on the contrary, they have become too powerful for these conditions, by which they are fettered, and so soon as they overcome these fetters, they bring disorder into the whole of bourgeois society, endanger the existence of bourgeois property. The conditions of bourgeois society are too narrow to comprise the wealth created by them. And how does the bourgeoisie get over these crises? On the one hand by enforced destruction of a mass of productive forces; on the other, by the conquest of new markets, and by the more thorough exploitation of the old ones. That is to say, by paving the way for more extensive and more destructive crises, and by diminishing the means whereby crises are prevented.
    hash: sha256:badae5b66b9581545bdc4033f7b5a943296ac69345b3bc53afd14eb4d1cae58a
    state: active
  - id: p00036
    type: paragraph
    text: The weapons with which the bourgeoisie felled feudalism to the ground are now turned against the bourgeoisie itself.
    hash: sha256:dd7fa39d8ee2088c249a1a85208b9922b827fe01f149945b5caee46502f36b66
    state: active
  - id: p00037
    type: paragraph
    text: But not only has the bourgeoisie forged the weapons that bring death to itself; it has also called into existence the men who are to wield those weapons — the modern working class — the proletarians.
    hash: sha256:fccf7d130d8b4ecf10611a4e7a6f7ac862d92733641cf3e048ae77071c665378
    state: active
  - id: p00038
    type: paragraph
    text: In proportion as the bourgeoisie, i.e., capital, is developed, in the same proportion is the proletariat, the modern working class, developed — a class of labourers, who live only so long as they find work, and who find work only so long as their labour increases capital. These labourers, who must sell themselves piecemeal, are a commodity, like every other article of commerce, and are consequently exposed to all the vicissitudes of competition, to all the fluctuations of the market.
    hash: sha256:bf2169d9c2265d217eb78139324135c7b0ce18d25ce4d5a1a1709202ddeb3337
    state: active
  - id: p00039
    type: paragraph
    text: Owing to the extensive use of machinery, and to the division of labour, the work of the proletarians has lost all individual character, and, consequently, all charm for the workman. He becomes an appendage of the machine, and it is only the most simple, most monotonous, and most easily acquired knack, that is required of him. Hence, the cost of production of a workman is restricted, almost entirely, to the means of subsistence that he requires for maintenance, and for the propagation of his race. But the price of a commodity, and therefore also of labour, is equal to its cost of production. In proportion, therefore, as the repulsiveness of the work increases, the wage decreases. Nay more, in proportion as the use of machinery and division of labour increases, in the same proportion the burden of toil also increases, whether by prolongation of the working hours, by the increase of the work exacted in a given time or by increased speed of machinery, etc.
    hash: sha256:08cee0f96ef64587222828aa61814a9a62fe3d2a06d22363da5b95cd27946d4b
    state: active
  - id: p00040
    type: paragraph
    text: Modern Industry has converted the little workshop of the patriarchal master into the great factory of the industrial capitalist. Masses of labourers, crowded into the factory, are organised like soldiers. As privates of the industrial army they are placed under the command of a perfect hierarchy of officers and sergeants. Not only are they slaves of the bourgeois class, and of the bourgeois State; they are daily and hourly enslaved by the machine, by the overlooker, and, above all, by the individual bourgeois manufacturer himself. The more openly this despotism proclaims gain to be its end and aim, the more petty, the more hateful and the more embittering it is.
    hash: sha256:8e86ff595744ab36e283c2a3361aa045a650fc404e9841388e15fb3fcb6426ba
    state: active
  - id: p00041
    type: paragraph
    text: The less the skill and exertion of strength implied in manual labour, in other words, the more modern industry becomes developed, the more is the labour of men superseded by that of women. Differences of age and sex have no longer any distinctive social validity for the working class. All are instruments of labour, more or less expensive to use, according to their age and sex.
    hash: sha256:466fcf36930ea311f5e1970931d9f9d7bc782ac997e8b203eaefe2fc66852bf2
    state: active
  - id: p00042
    type: paragraph
    text: No sooner is the exploitation of the labourer by the manufacturer, so far, at an end, that he receives his wages in cash, than he is set upon by the other portions of the bourgeoisie, the landlord, the shopkeeper, the pawnbroker, etc.
    hash: sha256:11745ebdb094ab8198f0555876fbb055ecaa790db24b735af8245ffc8c706c50
    state: active
  - id: p00043
    type: paragraph
    text: The lower strata of the middle class — the small tradespeople, shopkeepers, and retired tradesmen generally, the handicraftsmen and peasants — all these sink gradually into the proletariat, partly because their diminutive capital does not suffice for the scale on which Modern Industry is carried on, and is swamped in the competition with the large capitalists, partly because their specialised skill is rendered worthless by new methods of production. Thus the proletariat is recruited from all classes of the population.
    hash: sha256:289ed2442a48b256ea60ff491f40b388aa81043e7d5f76a76457262e9f51cf7c
    state: active
  - id: p00044
    type: paragraph
    text: The proletariat goes through various stages of development. With its birth begins its struggle with the bourgeoisie. At first the contest is carried on by individual labourers, then by the workpeople of a factory, then by the operative of one trade, in one locality, against the individual bourgeois who directly exploits them. They direct their attacks not against the bourgeois conditions of production, but against the instruments of production themselves; they destroy imported wares that compete with their labour, they smash to pieces machinery, they set factories ablaze, they seek to restore by force the vanished status of the workman of the Middle Ages.
    hash: sha256:aa635e5414e867100e5223cfffd17a5acd4f280e11c3c7647fdebcbed076f665
    state: active
  - id: p00045
    type: paragraph
    text: At this stage, the labourers still form an incoherent mass scattered over the whole country, and broken up by their mutual competition. If anywhere they unite to form more compact bodies, this is not yet the consequence of their own active union, but of the union of the bourgeoisie, which class, in order to attain its own political ends, is compelled to set the whole proletariat in motion, and is moreover yet, for a time, able to do so. At this stage, therefore, the proletarians do not fight their enemies, but the enemies of their enemies, the remnants of absolute monarchy, the landowners, the non-industrial bourgeois, the petty bourgeois. Thus, the whole historical movement is concentrated in the hands of the bourgeoisie; every victory so obtained is a victory for the bourgeoisie.
    hash: sha256:e1ee512c326954d9feb7c6fdece52b6e4fc379454fe875759ff0edc575b2832c
    state: active
  - id: p00046
    type: paragraph
    text: But with the development of industry, the proletariat not only increases in number; it becomes concentrated in greater masses, its strength grows, and it feels that strength more. The various interests and conditions of life within the ranks of the proletariat are more and more equalised, in proportion as machinery obliterates all distinctions of labour, and nearly everywhere reduces wages to the same low level. The growing competition among the bourgeois, and the resulting commercial crises, make the wages of the workers ever more fluctuating. The increasing improvement of machinery, ever more rapidly developing, makes their livelihood more and more precarious; the collisions between individual workmen and individual bourgeois take more and more the character of collisions between two classes. Thereupon, the workers begin to form combinations (Trades’ Unions) against the bourgeois; they club together in order to keep up the rate of wages; they found permanent associations in order to make provision beforehand for these occasional revolts. Here and there, the contest breaks out into riots.
    hash: sha256:58db6a84951d26c58d8600eee2ee29da2c885a71913472a03301e4f5536bf7f8
    state: active
  - id: p00047
    type: paragraph
    text: Now and then the workers are victorious, but only for a time. The real fruit of their battles lies, not in the immediate result, but in the ever expanding union of the workers. This union is helped on by the improved means of communication that are created by modern industry, and that place the workers of different localities in contact with one another. It was just this contact that was needed to centralise the numerous local struggles, all of the same character, into one national struggle between classes. But every class struggle is a political struggle. And that union, to attain which the burghers of the Middle Ages, with their miserable highways, required centuries, the modern proletarian, thanks to railways, achieve in a few years.
    hash: sha256:60663051b2dd6a53c4e7eb9752c2b161567c6664a760d1fce67f3e32ebd8fb12
    state: active
  - id: p00048
    type: paragraph
    text: This organisation of the proletarians into a class, and, consequently into a political party, is continually being upset again by the competition between the workers themselves. But it ever rises up again, stronger, firmer, mightier. It compels legislative recognition of particular interests of the workers, by taking advantage of the divisions among the bourgeoisie itself. Thus, the ten-hours’ bill in England was carried.
    hash: sha256:05e2b73b460a40e99ee49cec4788d5be425b9e0bb7a3c9da037540016cafe001
    state: active
  - id: p00049
    type: paragraph
    text: Altogether collisions between the classes of the old society further, in many ways, the course of development of the proletariat. The bourgeoisie finds itself involved in a constant battle. At first with the aristocracy; later on, with those portions of the bourgeoisie itself, whose interests have become antagonistic to the progress of industry; at all time with the bourgeoisie of foreign countries. In all these battles, it sees itself compelled to appeal to the proletariat, to ask for help, and thus, to drag it into the political arena. The bourgeoisie itself, therefore, supplies the proletariat with its own elements of political and general education, in other words, it furnishes the proletariat with weapons for fighting the bourgeoisie.
    hash: sha256:ff0c197c055980cbce1428955dd07c7d1f9c82f9452b7ac13439943d5b82bd14
    state: active
  - id: p00050
    type: paragraph
    text: Further, as we have already seen, entire sections of the ruling class are, by the advance of industry, precipitated into the proletariat, or are at least threatened in their conditions of existence. These also supply the proletariat with fresh elements of enlightenment and progress.
    hash: sha256:22eb521aebed8197550c7ff6e6a7e9db93c40f05aafaab319e2cd85815dd1a8c
    state: active
  - id: p00051
    type: paragraph
    text: Finally, in times when the class struggle nears the decisive hour, the progress of dissolution going on within the ruling class, in fact within the whole range of old society, assumes such a violent, glaring character, that a small section of the ruling class cuts itself adrift, and joins the revolutionary class, the class that holds the future in its hands. Just as, therefore, at an earlier period, a section of the nobility went over to the bourgeoisie, so now a portion of the bourgeoisie goes over to the proletariat, and in particular, a portion of the bourgeois ideologists, who have raised themselves to the level of comprehending theoretically the historical movement as a whole.
    hash: sha256:d7fc3f5d07094176476a8ebbeb8f15c21914bddbb6c574e953552ae91fa66ea6
    state: active
  - id: p00052
    type: paragraph
    text: Of all the classes that stand face to face with the bourgeoisie today, the proletariat alone is a really revolutionary class. The other classes decay and finally disappear in the face of Modern Industry; the proletariat is its special and essential product.
    hash: sha256:6be613079d252ab36b46f9e62b42d148cdbecd3611b9291c1f6cea7060cd0ab4
    state: active
  - id: p00053
    type: paragraph
    text: The lower middle class, the small manufacturer, the shopkeeper, the artisan, the peasant, all these fight against the bourgeoisie, to save from extinction their existence as fractions of the middle class. They are therefore not revolutionary, but conservative. Nay more, they are reactionary, for they try to roll back the wheel of history. If by chance, they are revolutionary, they are only so in view of their impending transfer into the proletariat; they thus defend not their present, but their future interests, they desert their own standpoint to place themselves at that of the proletariat.
    hash: sha256:77252248810f4bc592c7a39c8d95e33a4e37f67684449b028981e07a03d19440
    state: active
  - id: p00054
    type: paragraph
    text: The “dangerous class”, [<i>lumpenproletariat</i>] the social scum, that passively rotting mass thrown off by the lowest layers of the old society, may, here and there, be swept into the movement by a proletarian revolution; its conditions of life, however, prepare it far more for the part of a bribed tool of reactionary intrigue.
    hash: sha256:072bea38d322cb0b0840b5a987191fc4af1b3fcacbca6b3e1edc28caf36d600c
    state: active
  - id: p00055
    type: paragraph
    text: In the condition of the proletariat, those of old society at large are already virtually swamped. The proletarian is without property; his relation to his wife and children has no longer anything in common with the bourgeois family relations; modern industry labour, modern subjection to capital, the same in England as in France, in America as in Germany, has stripped him of every trace of national character. Law, morality, religion, are to him so many bourgeois prejudices, behind which lurk in ambush just as many bourgeois interests.
    hash: sha256:cbe86be3c0e0cb062ad84a8785cacb6f25f35e1fb55558031180cfbb50b0e6eb
    state: active
  - id: p00056
    type: paragraph
    text: All the preceding classes that got the upper hand sought to fortify their already acquired status by subjecting society at large to their conditions of appropriation. The proletarians cannot become masters of the productive forces of society, except by abolishing their own previous mode of appropriation, and thereby also every other previous mode of appropriation. They have nothing of their own to secure and to fortify; their mission is to destroy all previous securities for, and insurances of, individual property.
    hash: sha256:0e61e03f2c2b6fb8b2f19b3dc0b13d027196ba7d219deeadac6c89fa0f074784
    state: active
  - id: p00057
    type: paragraph
    text: All previous historical movements were movements of minorities, or in the interest of minorities. The proletarian movement is the self-conscious, independent movement of the immense majority, in the interest of the immense majority. The proletariat, the lowest stratum of our present society, cannot stir, cannot raise itself up, without the whole superincumbent strata of official society being sprung into the air.
    hash: sha256:3ec7fee09733a1d2f38647bcd8c313bcf0defa79a11580102cb10643613d06ac
    state: active
  - id: p00058
    type: paragraph
    text: Though not in substance, yet in form, the struggle of the proletariat with the bourgeoisie is at first a national struggle. The proletariat of each country must, of course, first of all settle matters with its own bourgeoisie.
    hash: sha256:448eecff4bcb1c1ccfddca48ae2783e239082e862131c94da109780ded1664dc
    state: active
  - id: p00059
    type: paragraph
    text: In depicting the most general phases of the development of the proletariat, we traced the more or less veiled civil war, raging within existing society, up to the point where that war breaks out into open revolution, and where the violent overthrow of the bourgeoisie lays the foundation for the sway of the proletariat.
    hash: sha256:9d85199a0441909727b04c78d30229cc945473c083295f4f13179da42dacc7f1
    state: active
  - id: p00060
    type: paragraph
    text: Hitherto, every form of society has been based, as we have already seen, on the antagonism of oppressing and oppressed classes. But in order to oppress a class, certain conditions must be assured to it under which it can, at least, continue its slavish existence. The serf, in the period of serfdom, raised himself to membership in the commune, just as the petty bourgeois, under the yoke of the feudal absolutism, managed to develop into a bourgeois. The modern labourer, on the contrary, instead of rising with the process of industry, sinks deeper and deeper below the conditions of existence of his own class. He becomes a pauper, and pauperism develops more rapidly than population and wealth. And here it becomes evident, that the bourgeoisie is unfit any longer to be the ruling class in society, and to impose its conditions of existence upon society as an over-riding law. It is unfit to rule because it is incompetent to assure an existence to its slave within his slavery, because it cannot help letting him sink into such a state, that it has to feed him, instead of being fed by him. Society can no longer live under this bourgeoisie, in other words, its existence is no longer compatible with society.
    hash: sha256:7a15a7bd5f0373dde450b4bf5c8ca0be436dd1c7a7c2bf76d4c3fd40888a9654
    state: active
  - id: p00061
    type: paragraph
    text: The essential conditions for the existence and for the sway of the bourgeois class is the formation and augmentation of capital; the condition for capital is wage-labour. Wage-labour rests exclusively on competition between the labourers. The advance of industry, whose involuntary promoter is the bourgeoisie, replaces the isolation of the labourers, due to competition, by the revolutionary combination, due to association. The development of Modern Industry, therefore, cuts from under its feet the very foundation on which the bourgeoisie produces and appropriates products. What the bourgeoisie therefore produces, above all, are its own grave-diggers. Its fall and the victory of the proletariat are equally inevitable.
    hash: sha256:723a47ed4b582363d184327ae768d4538d4dfb3b83523db87f014bb29f399357
    state: active
  - id: p00062
    type: footnote
    label: "1"
    text: By bourgeoisie is meant the class of modern capitalists, owners of the means of social production and employers of wage labour.<br/><br/>By proletariat, the class of modern wage labourers who, having no means of production of their own, are reduced to selling their labour power in order to live. [Engels, 1888 English edition]
    hash: sha256:046cd9b8fbedebb234b05d45577fbdc4f157b48c90d33667ee2d3c20eb0421e8
    state: active
  - id: p00063
    type: footnote
    label: "2"
    text: That is, all <i>written</i> history. In 1847, the pre-history of society, the social organisation existing previous to recorded history, all but unknown. Since then, August von Haxthausen (1792-1866) discovered common ownership of land in Russia, Georg Ludwig von Maurer proved it to be the social foundation from which all Teutonic races started in history, and, by and by, village communities were found to be, or to have been, the primitive form of society everywhere from India to Ireland. The inner organisation of this primitive communistic society was laid bare, in its typical form, by Lewis Henry Morgan's (1818-1881) crowning discovery of the true nature of the gens and its relation to the tribe. With the dissolution of the primeval communities, society begins to be differentiated into separate and finally antagonistic classes. I have attempted to retrace this dissolution in The Origin of the Family, Private Property, and the State, second edition, Stuttgart, 1886. [Engels, 1888 English Edition and 1890 German Edition (with the last sentence omitted)]
    hash: sha256:0d5f9d5e8a6a7652b924c5a6e99caae8777cfe80ca216fab1e3674a4406d7dfe
    state: active
  - id: p00064
    type: footnote
    label: "3"
    text: Guild-master, that is, a full member of a guild, a master within, not a head of a guild. [Engels, 1888 English Edition]
    hash: sha256:7d90b7d6e86f3be3e62beaea4af8979d954223a1eb0237300d970bf2d2e25e2c
    state: active
  - id: p00065
    type: footnote
    label: "4"
    text: This was the name given their urban communities by the townsmen of Italy and France, after they had purchased or conquered their initial rights of self-government from their feudal lords. [Engels, 1890 German edition]<br/><br/>“Commune” was the name taken in France by the nascent towns even before they had conquered from their feudal lords and masters local self-government and political rights as the “Third Estate.” Generally speaking, for the economical development of the bourgeoisie, England is here taken as the typical country, for its political development, France. [Engels, 1888 English Edition]
    hash: sha256:fdf57d99bd48db2f71b5f9585b2eff2d80a3c0e3b7a37858c831670a44b2a719
    state: active
