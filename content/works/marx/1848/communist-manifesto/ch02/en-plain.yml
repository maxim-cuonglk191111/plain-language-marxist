    ai_assisted: true
    text: Chapter II. {Proletariat:pl} and Communists
  p00002:
    covers: [p00002]
    based_on: sha256:e2af9cdddff1785fddc5a898f607f46fa42511fbb0ba698cde0324aa839e27c2
    revision: 3
    ai_assisted: true
    text: How do the Communists relate to the {proletariat:pl} as a whole?
  p00003:
    covers: [p00003]
    based_on: sha256:712de28512e4dda73d73154aa939929a158e834d33fc212e98e0c4c482f4098b
    revision: 3
    ai_assisted: true
    text: The Communists do not form a separate {party} opposed to the other working-class {party:pl}.
  p00004:
    covers: [p00004]
    based_on: sha256:ab2af9490576a8eed6120bff50dc53f34c584fb76c1e32f20c220bc4ed3fbc3d
    revision: 3
    ai_assisted: true
    text: They have no interests separate from the interests of the {proletariat} as a whole.
  p00005:
    covers: [p00005]
    based_on: sha256:4796a83196bf591760e3c4a650109c288706bf216f6d34c42eca82899e15a5f7
    revision: 3
    ai_assisted: true
    text: They do not set up any narrow sectarian principles of their own to shape and direct the {proletariat:adj} movement.
  p00006:
    covers: [p00006]
    based_on: sha256:2a3743d944006c8a7c7d52155974cdce383f56b2d67b41846ab0e9a24db05570
    revision: 3
    ai_assisted: true
    text: |
      The Communists differ from other working-class {party:pl} in only two ways:

      1. In the national struggles of {proletariat:pl} across different countries, they point out and champion the common interests of the whole {proletariat}, regardless of nationality.

      2. In the various stages of the struggle between the {proletariat} and the {bourgeoisie}, they always and everywhere represent the interests of the movement as a whole.
  p00007:
    covers: [p00007]
    based_on: sha256:72d4a1d64b25959a28aaa906b6f4e2860a3cec57393a2ef661fa1ee3df473097
    revision: 3
    ai_assisted: true
    text: |
      In practice, therefore, the Communists are the most advanced and determined section of the working-class {party:pl} in every country, driving all the others forward.

      In theory, they have an advantage over the broad mass of the {proletariat}: they clearly understand the line of march, the conditions, and the ultimate outcomes of the {proletariat:adj} movement.
  p00008:
    covers: [p00008]
    based_on: sha256:4d5d902c0e95b7bfff5c45cefbb4b1d25dea4cc1e2247b5cab5e663d39d87d5f
    revision: 3
    ai_assisted: true
    text: "The immediate goal of the Communists is the same as that of all other {proletariat:adj} {party:pl}: to organize the {proletariat} into a class, overthrow {bourgeoisie:adj} rule, and win political power for the {proletariat}."
  p00009:
    covers: [p00009]
    based_on: sha256:e4ea4c79fb77d8eead98edc74967146b58647e791e38870918d3ea600152d9fa
    revision: 3
    ai_assisted: true
    text: The theoretical conclusions of the Communists do not rest on ideas or principles invented by this or that would-be world reformer.
  p00010:
    covers: [p00010]
    based_on: sha256:4c8e189add95832fa9ccd9b9525c7d7bab95ee5ab2d1f83600b1e22a510fe02f
    revision: 3
    ai_assisted: true
    text: |
      They merely express, in general terms, real relations arising from an ongoing {class-struggle} — from a historical movement unfolding right before our eyes.

      Abolishing existing property relations is not at all unique to {communism}.
  p00011:
    covers: [p00011]
    based_on: sha256:d46c19a37063b8204c02a0dbfbd4ec41fc973f8840766f6d70191100154655da
    revision: 3
    ai_assisted: true
    text: All property relations throughout history have constantly changed as historical conditions changed.
  p00012:
    covers: [p00012]
    based_on: sha256:6fcf57ec296d7fbd98a534ac7fc5ce24ccd4531cbea592a5e7e9f86e47b5b9f0
    revision: 3
    ai_assisted: true
    text: The French {Revolution}, for example, abolished feudal property to replace it with {bourgeoisie:adj} property.
  p00013:
    covers: [p00013]
    based_on: sha256:0bc59b88c03693b4f6cee38468f4cfd53782f262abfeae2d4f17cd634d72c308
    revision: 3
    ai_assisted: true
    text: |
      What distinguishes {Communism} is not the abolition of property in general, but the abolition of {bourgeoisie:adj} property.

      Modern {bourgeoisie:adj} {private-property} is the final and most complete expression of a system based on {class-antagonism:pl} and on the {exploitation} of the majority by the few.
  p00014:
    covers: [p00014]
    based_on: sha256:71fe5b4abaaeb0e15cfc917fdc42121359e95cc4bed2b508621701955a703a87
    revision: 3
    ai_assisted: true
    text: "In this sense, Communists may sum up their theory in a single sentence: Abolition of {private-property}."
  p00015:
    covers: [p00015]
    based_on: sha256:da938b3c47668884bc0a3c51c3f3dfdc7b29b7d55b8fbb933e5b348c619ae80c
    revision: 3
    ai_assisted: true
    text: People accuse us Communists of wanting to abolish the right of personally acquiring property through one's own labour — property that is claimed to be the foundation of all personal freedom, activity, and independence.
  p00016:
    covers: [p00016]
    based_on: sha256:5dea4453230a95c56646fb7bc8f973fdd4687c6aa05ac7a29798a90c130de817
    revision: 3
    ai_assisted: true
    text: |
      Hard-won, self-acquired, self-earned property! Do you mean the property of the small artisan and the small peasant, which came before {bourgeoisie:adj} property?

      There is no need to abolish that. The development of industry has already largely destroyed it, and continues to destroy it every day.
  p00017:
    covers: [p00017]
    based_on: sha256:369ba0368334404abb72b149e83434fd812ca47bb181b9dc9d66d95010e2860e
    revision: 3
    ai_assisted: true
    text: Or do you mean modern {bourgeoisie:adj} {private-property}?
  p00018:
    covers: [p00018]
    based_on: sha256:078c7148bd5b704607c282c8de43023fead617f736413b4e88c8efb5644f0c21
    revision: 3
    ai_assisted: true
    text: |
      Does {wage-labour} create any property for the worker? Not at all. It creates {capital}: property that exploits {wage-labour}.

      And that property cannot increase except on the condition that it produces a new supply of {wage-labour} for fresh exploitation. Property today rests on the conflict between {capital} and {wage-labour}. Let us examine both sides of this conflict.
  p00019:
    covers: [p00019]
    based_on: sha256:58b690575599f48ad201944755a07881b82e669ac71b02cc122812f1dd062d58
    revision: 3
    ai_assisted: true
    text: |
      To be a capitalist means holding not only a personal position, but a social position in production.

      {Capital} is a collective product. Only by the united action of many members of society — in fact, in the end, only by the united action of all members of society — can it be set in motion.
  p00020:
    covers: [p00020]
    based_on: sha256:d6df527b008830e9b8f9b5e230f8f0412500d582ff862a4c399e7434a259a1cc
    revision: 3
    ai_assisted: true
    text: "{Capital} is therefore not only a personal power; it is a social power."
  p00021:
    covers: [p00021]
    based_on: sha256:0ee0ec89543743704cee7e2c2577275203a14e3799581c6b0cda6a6496ddec82
    revision: 3
    ai_assisted: true
    text: |
      Therefore, when {capital} is turned into common property belonging to all members of society, personal property is not transformed into social property.

      Only the social character of the property changes. It loses its class character.
  p00022:
    covers: [p00022]
    based_on: sha256:0e4bd0768d5e84c588ce2e803bcdbbb311f1d0232b0f8b16105b38e664b919c6
    revision: 3
    ai_assisted: true
    text: Now let us look at {wage-labour}.
  p00023:
    covers: [p00023]
    based_on: sha256:4830afebfb6bbd24157f46e16289ff0a26c844b732c2a3ffc856db3f7b6ca250
    revision: 3
    ai_assisted: true
    text: |
      The average price of {wage-labour} is the minimum wage. That is the amount of {means-of-subsistence} strictly needed to keep the worker alive as a worker.

      Therefore, what wage workers gain through their labour barely keeps them alive. We do not intend at all to abolish this personal {appropriation} of the products of labour to maintain and renew human life, which leaves no surplus to command the labour of others.

      We only want to end the miserable nature of this {appropriation}, where the worker lives only to increase {capital}, and is allowed to live only as long as the ruling class requires it.
  p00024:
    covers: [p00024]
    based_on: sha256:fa9f7ed02b57388f5a9a778827ae156b47d5102f40a3cdcd9c094510be3803bb
    revision: 3
    ai_assisted: true
    text: In {bourgeoisie:adj} society, living labour is only a means to increase accumulated labour. In {Communism:adj} society, accumulated labour is only a means to widen, enrich, and improve the life of the worker.
  p00025:
    covers: [p00025]
    based_on: sha256:1f679e5348f4a1fbd795ca8754c749358f6fa4b4c421977af3635ea7478ab61b
    revision: 3
    ai_assisted: true
    text: |
      In {bourgeoisie:adj} society, therefore, the past dominates the present; in {Communism:adj} society, the present dominates the past.

      In {bourgeoisie:adj} society, {capital} is independent and has individuality, while the living person is dependent and has no individuality.
  p00026:
    covers: [p00026]
    based_on: sha256:e3545c2caefbd4e3fde0506af75c7e27ce4130d9c150167d238ca1b6a9d3c7b8
    revision: 3
    ai_assisted: true
    text: And the {bourgeoisie:person} calls ending this state of affairs the abolition of individuality and freedom! And rightly so. We certainly aim to abolish {bourgeoisie:adj} individuality, {bourgeoisie:adj} independence, and {bourgeoisie:adj} freedom.
  p00027:
    covers: [p00027]
    based_on: sha256:68c9ad3ccf841126352a705adfeb07c11288aac070a1c8cffa7d400c83aecf70
    revision: 3
    ai_assisted: true
    text: Under present {bourgeoisie:adj} conditions of production, freedom simply means free trade, free buying and selling.
  p00028:
    covers: [p00028]
    based_on: sha256:eeab0d3f0293044a145d2583df2669b239717604826bfebe1eaf9b7eb6c550b4
    revision: 3
    ai_assisted: true
    text: |
      If buying and selling disappear, free buying and selling disappear too.

      All this talk about free selling and buying has meaning only when compared with the chained merchants of the Middle Ages. The same is true of all the other “brave words” of our {bourgeoisie} about freedom in general.

      They have no meaning when opposed to the {Communism:adj} abolition of buying and selling, of {bourgeoisie:adj} conditions of production, and of the {bourgeoisie} itself.
  p00029:
    covers: [p00029]
    based_on: sha256:e8b926c9ff1293941642b372a1a35e6b54d623122ba53324b8e968afce9fa142
    revision: 3
    ai_assisted: true
    text: |
      You are horrified that we want to abolish {private-property}.

      Yet in your existing society, {private-property} is already abolished for nine-tenths of the population. It exists for the few only because those nine-tenths have none.

      You accuse us, therefore, of wanting to abolish a form of property that can only exist by denying all property to the vast majority of society.
  p00030:
    covers: [p00030]
    based_on: sha256:aedd5171bd765dcf7f38849eaba48f53276d1e3ac600443b4a4c0dc5a2d6cee7
    revision: 3
    ai_assisted: true
    text: In short, you accuse us of wanting to do away with your property. Exactly so; that is just what we intend.
  p00031:
    covers: [p00031]
    based_on: sha256:fec1bdbbc76976b6fe5cab8df6c1aa755110a210b51f01ee02987cb16e246e50
    revision: 3
    ai_assisted: true
    text: |
      You say that individuality vanishes from the moment labour can no longer be turned into {capital}, money, or rent — into a social power that can be monopolised.

      That is, from the moment personal property can no longer be turned into {bourgeoisie:adj} property, into {capital}.
  p00032:
    covers: [p00032]
    based_on: sha256:8965f5506f676e7e01781438240d6646bd981d6ce319e26bbd78cf881e47c6d3
    revision: 3
    ai_assisted: true
    text: |
      You must therefore confess that by “individual” you mean nobody other than the {bourgeoisie:person}, the middle-class owner of property.

      And that person must indeed be swept out of the way and made impossible.
  p00033:
    covers: [p00033]
    based_on: sha256:157880da2192456130d1cc4ae2e98d3d9f6dfa454afa2b29c9bd231ffc3f8175
    revision: 3
    ai_assisted: true
    text: |
      {Communism} deprives no one of the power to take home their share of society's products.

      It only takes away the power to use that ownership to subjugate the labour of others.
  p00034:
    covers: [p00034]
    based_on: sha256:eaf896a8d5970a8b46fdc481ee9d92b7eac79070fe8f44e2936d84366b8ddb4d
    revision: 3
    ai_assisted: true
    text: People object that if {private-property} is abolished, all work will stop, and total laziness will overtake us.
  p00035:
    covers: [p00035]
    based_on: sha256:c7d870ee8e72ff98b9b6e2c53dec986b2977b8be18257490ae93a6f08a13fa49
    revision: 3
    ai_assisted: true
    text: |
      If that were true, {bourgeoisie:adj} society should have collapsed long ago from pure laziness. Those who work acquire nothing, and those who acquire wealth do not work.

      This whole objection simply repeats the same thing in different words: when there is no more {capital}, there can no longer be any {wage-labour}.
  p00036:
    covers: [p00036]
    based_on: sha256:41ea651455b6b54d987a5bb933663dc56946c15dd6fdb3f2ee7f9fd642caf8ea
    revision: 3
    ai_assisted: true
    text: |
      Every objection raised against {Communism:adj} ways of producing and sharing material goods is also raised against {Communism:adj} ways of producing and sharing intellectual goods.

      To the {bourgeoisie:person}, the disappearance of class property means the end of production itself. In the same way, the disappearance of class culture means the end of all culture.
  p00037:
    covers: [p00037]
    based_on: sha256:298f82c90799affca2227f36aaab92a29659dffbf492e66609569218f41e7047
    revision: 3
    ai_assisted: true
    text: The culture whose loss he mourns is, for the vast majority of people, mere training to act as a machine.
  p00038:
    covers: [p00038]
    based_on: sha256:9f9a28688781755256a13c369b668ce2ea83bcf23c951d38c2ff3ca183cc699c
    revision: 3
    ai_assisted: true
    text: |
      Do not argue with us as long as you judge our plan to abolish {bourgeoisie:adj} property by your {bourgeoisie:adj} ideas of freedom, culture, and law.

      Your ideas are merely the product of your {bourgeoisie:adj} production and property. In the same way, your laws are only the will of your class made into law for everyone — a will shaped by the material conditions of your class.
  p00039:
    covers: [p00039]
    based_on: sha256:d5faea87a2ce7401c7a5da1faa9de2a889eca10e46fe2ce1ecb3433bc37b9491
    revision: 3
    ai_assisted: true
    text: |
      You turn the social forms of your present {mode-of-production} and property into eternal laws of nature and reason.

      This selfish mistake is one you share with every past ruling class. What you see clearly in ancient property, and admit in feudal property, you cannot admit for your own {bourgeoisie:adj} property.
  p00040:
    covers: [p00040]
    based_on: sha256:eb018c36e547c97020b9346f1d0ffe40c60775a24d91161c25fe2727505d0f71
    revision: 3
    ai_assisted: true
    text: Abolition [<i>Aufhebung</i>] of the family! Even the most radical people flare up at this outrageous proposal of the Communists.
  p00041:
    covers: [p00041]
    based_on: sha256:27f0bd5df877b5c43dbb79c11b8d80f03e25d7714ed64ae08b90c287bbbaba0d
    revision: 3
    ai_assisted: true
    text: |
      On what foundation does the present family, the {bourgeoisie:adj} family, rest? On {capital}, on private gain.

      In its fully developed form, this family exists only among the {bourgeoisie}.

      Its counterpart is the practical absence of family life among {proletariat:pl}, and public prostitution.
  p00042:
    covers: [p00042]
    based_on: sha256:112f89f67cb60d91f463106802bbd72b528ac74f03853a01ada152fdc935a4e9
    revision: 3
    ai_assisted: true
    text: The {bourgeoisie:adj} family will naturally disappear when its counterpart disappears. Both will vanish when {capital} vanishes.
  p00043:
    covers: [p00043]
    based_on: sha256:cd226538adfccad6fe6cda152bc1e1f298acbe5640536d2d2c9ffcd4b7c4d876
    revision: 3
    ai_assisted: true
    text: Do you accuse us of wanting to stop parents from exploiting their children? We plead guilty to that charge.
  p00044:
    covers: [p00044]
    based_on: sha256:c8bf23b7699ab96275db7d1f4db4631826d0359e7720b7d27b7987f5fc6014a7
    revision: 3
    ai_assisted: true
    text: You say that we destroy the most sacred relationships when we replace home education with social education.
  p00045:
    covers: [p00045]
    based_on: sha256:38fdf7961087c85363a847c262f7a37fe1e2473bd4bf85f28b76d8e8d3c04a78
    revision: 3
    ai_assisted: true
    text: |
      And your education! Is it not also social, shaped by the social conditions under which you teach, and by society's intervention through schools?

      Communists did not invent society's intervention in education. They merely seek to change its character, and rescue education from the influence of the ruling class.
  p00046:
    covers: [p00046]
    based_on: sha256:59602223e7a91ca69164bc75b77014d0974aaa08dbebd5efe152e196989ce51a
    revision: 3
    ai_assisted: true
    text: |
      {Bourgeoisie:adj} chatter about family and education, and the sacred bond between parent and child, is sickening.

      As {modern-industry} advances, all family ties among {proletariat:pl} are torn apart, and their children are turned into simple commercial goods and tools of labour.
  p00047:
    covers: [p00047]
    based_on: sha256:e3faeaea3002a5375f48f9cd9e56dba3dfe0cddf55868b59e053b09607a13c68
    revision: 3
    ai_assisted: true
    text: You Communists would introduce community of women, screams the {bourgeoisie} in chorus.
  p00048:
    covers: [p00048]
    based_on: sha256:072eb8d3361b6824779051a5b0d2b173d0134175fd52c0d782db0d7a5f0d4140
    revision: 3
    ai_assisted: true
    text: |
      The {bourgeoisie:person} sees his wife as a mere instrument of production.

      He hears that {instruments-of-production} will be used in common, and naturally concludes that women will also be shared in common.
  p00049:
    covers: [p00049]
    based_on: sha256:bc1257cc8c63d43c87e2d36187d74aa601c174be3e1cce2375645551eaeda99b
    revision: 3
    ai_assisted: true
    text: He does not even suspect that the real goal is to end the status of women as mere instruments of production.
  p00050:
    covers: [p00050]
    based_on: sha256:11027c49662c0e3996e90a81ce68fefe653427c0dfc52b9cc4becf63d3bdcc0e
    revision: 3
    ai_assisted: true
    text: |
      Besides, nothing is more ridiculous than the moral outrage of the {bourgeoisie} at the idea that Communists will officially introduce the sharing of women.

      Communists do not need to introduce it; it has existed almost since the beginning of history.
  p00051:
    covers: [p00051]
    based_on: sha256:89d368914fcd6c7549562c3b5c4d33fa44e0c60dc9e119d34f041311c886d74a
    revision: 3
    ai_assisted: true
    text: The {bourgeoisie:persons} are not satisfied with having the wives and daughters of their workers at their disposal, not to mention prostitutes. They take great pleasure in seducing each other’s wives.
  p00052:
    covers: [p00052]
    based_on: sha256:bf92bb32873299b6cebc94724817b7f261e6ff43ff68da1fc0d883b8adefa0f2
    revision: 3
    ai_assisted: true
    text: |
      {Bourgeoisie:adj} marriage is in reality a system of shared wives.

      At most, what Communists might be accused of is wanting to introduce an open, legal community of women instead of a hypocritically concealed one.

      Furthermore, abolishing the present system of production must bring with it the abolition of the community of women springing from that system — both public and private prostitution.
  p00053:
    covers: [p00053]
    based_on: sha256:bb6b5627f501a4c553d5baececf33408aa60bf3e81a0c305bfe6ac99420e6c78
    revision: 3
    ai_assisted: true
    text: Communists are also accused of wanting to abolish countries and nationalities.
  p00054:
    covers: [p00054]
    based_on: sha256:18735a6145626e0aff4f415c0f8c8b8f5cbf74e54f2036c4e44e8c81c67c73a7
    revision: 3
    ai_assisted: true
    text: |
      The workers have no country. We cannot take from them what they do not have.

      The {proletariat} must first of all win political power. It must rise to be the leading class of the nation, and must establish itself as <i>the</i> nation.

      To that extent, it is itself national, though not in the {bourgeoisie:adj} sense of the word.
  p00055:
    covers: [p00055]
    based_on: sha256:f254035fbf2a7ab6a5b602d42bddcd523349ca5e63de52aaf40d941087887c7f
    revision: 3
    ai_assisted: true
    text: |
      National differences and antagonisms between peoples are disappearing more and more every day.

      This happens through the rise of the {bourgeoisie}, free trade, the {world-market}, and uniform conditions of production and life.
  p00056:
    covers: [p00056]
    based_on: sha256:403c7100a019b1c08599b0826fc47bc5de7a960caccba74c6c0fb50c52c1a2b4
    revision: 3
    ai_assisted: true
    text: |
      Rule by the {proletariat} will make them disappear even faster.

      United action by at least the leading civilized countries is one of the primary conditions for the liberation of the {proletariat}.
  p00057:
    covers: [p00057]
    based_on: sha256:bd71a6c63c27b134d552d9591aaafc80fecbb552722a62b286fdc8662ece89b5
    revision: 3
    ai_assisted: true
    text: |
      As the {exploitation} of one individual by another ends, the {exploitation} of one nation by another will end too.

      As {class-antagonism:pl} within nations disappear, hostility between nations will come to an end.
  p00058:
    covers: [p00058]
    based_on: sha256:c347c1dbbc917fab1b49b34923d441c7ab1510c4b9b78779109abbe01768ab5f
    revision: 3
    ai_assisted: true
    text: The charges against {Communism} made from religious, philosophical, and ideological standpoints do not deserve serious discussion.
  p00059:
    covers: [p00059]
    based_on: sha256:0e4e5321866aef15178c71f9a8e672c71b069bbbdeabf7b0924ecf9285494761
    revision: 3
    ai_assisted: true
    text: Does it take deep insight to understand that human ideas, views, and concepts — in short, human consciousness — change with every change in material life, social relations, and social existence?
  p00060:
    covers: [p00060]
    based_on: sha256:db99ebeaa5ecbd4486e304e2ff32df9b2b09c9f27941baf2cd117d2d2fcdb95b
    revision: 3
    ai_assisted: true
    text: |
      What else does the history of ideas prove, except that intellectual production changes its character as material production changes?

      The ruling ideas of each era have always been the ideas of its ruling class.
  p00061:
    covers: [p00061]
    based_on: sha256:7d82bd8a40ac96e39938a9f91c7583f6649109288eaa63a5c77146328aaf1bd3
    revision: 3
    ai_assisted: true
    text: |
      When people speak of ideas that revolutionize society, they merely express the fact that elements of a new society have formed inside the old one.

      The breaking up of old ideas keeps pace with the breaking up of old conditions of life.
  p00062:
    covers: [p00062]
    based_on: sha256:2e0c2da82e2038512635345b27f5be63240985f909db61ec3a708ccfee822772
    revision: 3
    ai_assisted: true
    text: |
      When the ancient world was dying, ancient religions were conquered by Christianity.

      When Christian ideas yielded to rationalist ideas in the 18th century, feudal society fought its final battle against the revolutionary {bourgeoisie}.

      Ideas of religious freedom and freedom of conscience merely expressed the rule of free competition in the field of ideas.
  p00063:
    covers: [p00063]
    based_on: sha256:82acf03ad514b6bc344e5644263db0d8ba556260c605892084c2dd2f941b3c35
    revision: 3
    ai_assisted: true
    text: “Undoubtedly,” critics will say, “religious, moral, philosophical, and legal ideas have changed through history. But religion, morality, philosophy, political science, and law always survived this change.”
  p00064:
    covers: [p00064]
    based_on: sha256:7014bb22aed02be9c7c15f4a734e71276eff3d26e37df634415021f6b7c35dbe
    revision: 3
    ai_assisted: true
    text: “Besides, there are eternal truths, such as Freedom and Justice, common to all societies. But {Communism} abolishes eternal truths, all religion, and all morality, instead of putting them on a new foundation. It therefore contradicts all past historical experience.”
  p00065:
    covers: [p00065]
    based_on: sha256:3f1efe333a29dfc41eb57d2f21deeafcb02b672fd49693a3c52fc4dda3927fc2
    revision: 3
    ai_assisted: true
    text: What does this accusation amount to? The history of all past society has consisted of {class-antagonism:pl} that took different forms in different eras.
  p00066:
    covers: [p00066]
    based_on: sha256:9cd632e506f949004a513f6d02d68bc25012e7e87d2f28c3d859eb86898f6e39
    revision: 3
    ai_assisted: true
    text: |
      Whatever form they may have taken, one fact is common to all past ages: the {exploitation} of one part of society by another.

      No wonder, then, that the social consciousness of past ages, despite all its variety, moves within certain common forms. These ideas cannot completely vanish except with the total disappearance of {class-antagonism:pl}.
  p00067:
    covers: [p00067]
    based_on: sha256:0deede5275203e63c95cac658aca458e38d6913a3bfaadf07cd48fccf5ec6a0c
    revision: 3
    ai_assisted: true
    text: The {Communism:adj} {revolution} is the most radical break with traditional property relations. No wonder its development brings the most radical break with traditional ideas.
  p00068:
    covers: [p00068]
    based_on: sha256:b3025003f75e54b4bf4e359210c8fdf6599bb0bf4091fbe69584e17fd4ca455d
    revision: 3
    ai_assisted: true
    text: Now let us leave behind {bourgeoisie:adj} objections to {Communism}.
  p00069:
    covers: [p00069]
    based_on: sha256:060c4011681f5c1f67bebe0806139db08667ed9be32c56593779d16c062d3dbf
    revision: 3
    ai_assisted: true
    text: As we have seen, the first step in the {revolution} by the working class is to raise the {proletariat} to become the ruling class — to win the battle of democracy.
  p00070:
    covers: [p00070]
    based_on: sha256:ff831a8c8942489be3909c1e80461c0fba1561d5282d288406fe039d726eb173
    revision: 3
    ai_assisted: true
    text: |
      The {proletariat} will use its political supremacy to take away all {capital} from the {bourgeoisie} step by step.

      It will centralize all {instruments-of-production} in the hands of the State — meaning the {proletariat} organized as the ruling class — and increase total {productive-forces} as fast as possible.
  p00071:
    covers: [p00071]
    based_on: sha256:f0cec040a2729e77ddddb7a995eacbb41c3fd7736c7e73944bef70b14bda396b
    revision: 3
    ai_assisted: true
    text: |
      At first, this cannot be carried out except through forceful attacks on property rights and on {bourgeoisie:adj} production.

      These measures, therefore, may seem economically inadequate and unsustainable at the start.

      Yet as the movement develops, they drive beyond themselves, require further steps against the old social order, and are unavoidable for completely revolutionizing the {mode-of-production}.
  p00072:
    covers: [p00072]
    based_on: sha256:ef489b6216523b32e9495a8fe377522f9bc3b14fd37b568cf429475328afec9b
    revision: 3
    ai_assisted: true
    text: These measures will, of course, differ from country to country.
  p00073:
    covers: [p00073]
    based_on: sha256:28e76375d00f545d05406bd5ecb78703af3e430a320e34b2676c20a6676b9fc1
    revision: 3
    ai_assisted: true
    text: Nevertheless, in most advanced countries, the following measures will apply quite generally.
  p00074:
    covers: [p00074]
    based_on: sha256:b1d1e458703a313e042b54f85e66b174d4b4dfe8e314981623a4b6a81fa76a0a
    revision: 3
    ai_assisted: true
    text: <indent level="1"/>1. Abolishing private land ownership and using all land rents for public purposes.<br/>2. A heavy progressive or graduated income tax.<br/>3. Abolishing all rights of inheritance.<br/>4. Confiscating the property of all rebels and emigrants who leave to oppose the revolution.<br/>5. Centralizing credit in the hands of the State through a national bank with State capital and an exclusive monopoly.<br/>6. Centralizing the means of communication and transport in the hands of the State.<br/>7. Expanding State-owned factories and {instruments-of-production}; cultivating unused land and improving the soil according to a common plan.<br/>8. Equal obligation for everyone to work, and creating industrial armies, especially for agriculture.<br/>9. Combining agriculture with manufacturing, and gradually ending the divide between town and country through a more even distribution of the population.<br/>10. {Free-education} for all children in public schools. Ending child factory labour in its present form. Combining education with industrial production, and so on.
  p00075:
    covers: [p00075]
    based_on: sha256:bf34b03f9ebfcfe8d8a3f7868466acc706a93edee48a9ae291e067b793cd0e29
    revision: 3
    ai_assisted: true
    text: |
      When class differences disappear over time and all production is held by a vast association of the whole nation, public power will lose its political character.

      Political power, strictly speaking, is merely the organized power of one class used to oppress another.

      In its struggle against the {bourgeoisie}, the {proletariat} is forced to organize as a class. Through a {revolution}, it makes itself the ruling class and forcefully clears away the old conditions of production.

      By sweeping away those conditions, it also sweeps away the basis for {class-antagonism:pl} and classes in general. In this way, it puts an end to its own rule as a class.
  p00076:
    covers: [p00076]
    based_on: sha256:50360d9ce7fb16950890f13f7e532f947358bd69fb7512604a87d7b9c377c449
    revision: 3
    ai_assisted: true
    text: In place of the old {bourgeoisie:adj} society, with its classes and {class-antagonism:pl}, we will have an association where the free development of each person is the condition for the free development of all.
