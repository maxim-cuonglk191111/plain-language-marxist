    text: |
      This applies mainly to Germany. There, the landed nobility manage large estates through stewards, and run beet sugar factories and potato distilleries.

      The wealthier British aristocracy did not do this openly yet. But they made up for falling rents by lending their names to promoters of shady financial companies. [Note by Engels to the English edition of 1888.]
