    text: <i>Phalanstères</i> were socialist colonies planned by Charles Fourier. <i>Icaria</i> was the name given by Étienne Cabet to his imaginary utopia and later to his American colony. [Note by Engels to the English edition of 1888.]<br/><br/>“Home Colonies” were what Robert Owen called his model societies. <i>Phalanstères</i> were the grand communal buildings planned by Fourier. <i>Icaria</i> was Cabet's imaginary land. [Note by Engels to the German edition of 1890.]
  p00069:
