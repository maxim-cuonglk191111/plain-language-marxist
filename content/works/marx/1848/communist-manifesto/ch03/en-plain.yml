    text: |
      This refers to the movement for electoral reform passed by the British House of Commons in 1831 and endorsed by the House of Lords in June 1832 under pressure from the working class.

      The reform broke the political monopoly of the landed and financial aristocracy, opening Parliament to representatives of the industrial {bourgeoisie}.

      However, despite promises, neither workers nor the {petty-bourgeoisie:adj} small owners were granted voting rights.
