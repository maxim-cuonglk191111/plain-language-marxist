passages:
  - id: p00001
    type: heading
    level: 3
    text: Chapter III. Socialist and Communist Literature
    hash: sha256:25f574bdcf37510639f814133670a017d94fc9b1990e0da5a3f7ca3b6c7338cf
    state: active
  - id: p00002
    type: heading
    level: 2
    text: 1. Reactionary Socialism
    hash: sha256:7574520c735ea96dc8d8558699ffc2d05a594a47910bc1b147d4d4266345ed66
    state: active
  - id: p00003
    type: heading
    level: 6
    text: A. Feudal Socialism
    hash: sha256:188db6504764a753f24bab3c4980f5c53f4312031e555b7ac942f962d6855faa
    state: active
  - id: p00004
    type: paragraph
    text: Owing to their historical position, it became the vocation of the aristocracies of France and England to write pamphlets against modern bourgeois society. In the French Revolution of July 1830, and in the English reform agitation<fn ref="A"/>, these aristocracies again succumbed to the hateful upstart. Thenceforth, a serious political struggle was altogether out of the question. A literary battle alone remained possible. But even in the domain of literature the old cries of the restoration period had become impossible.<fn ref="1"/>
    hash: sha256:d9b3524235115bd88858c82529228a195ac747292863d45c031976c6fba42e05
    state: active
  - id: p00005
    type: paragraph
    text: In order to arouse sympathy, the aristocracy was obliged to lose sight, apparently, of its own interests, and to formulate their indictment against the bourgeoisie in the interest of the exploited working class alone. Thus, the aristocracy took their revenge by singing lampoons on their new masters and whispering in his ears sinister prophesies of coming catastrophe.
    hash: sha256:ad33ce48db1b3d8659d9a83c90df3b89639cf5f4b7899ba2f935471f098aa397
    state: active
  - id: p00006
    type: paragraph
    text: "In this way arose feudal Socialism: half lamentation, half lampoon; half an echo of the past, half menace of the future; at times, by its bitter, witty and incisive criticism, striking the bourgeoisie to the very heart’s core; but always ludicrous in its effect, through total incapacity to comprehend the march of modern history."
    hash: sha256:0e05b6af97ca8e22bb58e12c51bcdd3d474078b80ed8807f0e763ce61e675422
    state: active
  - id: p00007
    type: paragraph
    text: The aristocracy, in order to rally the people to them, waved the proletarian alms-bag in front for a banner. But the people, so often as it joined them, saw on their hindquarters the old feudal coats of arms, and deserted with loud and irreverent laughter.
    hash: sha256:ca09fab5b10e574d487b25d861c1606e22d338c3095dd242e11f0397b1676acc
    state: active
  - id: p00008
    type: paragraph
    text: One section of the French Legitimists and “Young England” exhibited this spectacle.
    hash: sha256:2471684ebb1712ef60b29546338078d14ceb515eb30cc4c909f1f1147501618d
    state: active
  - id: p00009
    type: paragraph
    text: In pointing out that their mode of exploitation was different to that of the bourgeoisie, the feudalists forget that they exploited under circumstances and conditions that were quite different and that are now antiquated. In showing that, under their rule, the modern proletariat never existed, they forget that the modern bourgeoisie is the necessary offspring of their own form of society.
    hash: sha256:e3247bb8d7a4030ee90639a5363407bed3debcb1cbf7550f3f784e7e573f5e6e
    state: active
  - id: p00010
    type: paragraph
    text: For the rest, so little do they conceal the reactionary character of their criticism that their chief accusation against the bourgeois amounts to this, that under the bourgeois <i>ré</i>gime a class is being developed which is destined to cut up root and branch the old order of society.
    hash: sha256:6aee26b1ccb15b3ce43d80823c9e3ba97bbea9fc46a44fdb9e6f758e4ac5b7ab
    state: active
  - id: p00011
    type: paragraph
    text: What they upbraid the bourgeoisie with is not so much that it creates a proletariat as that it creates a <i>revolutionary</i> proletariat.
    hash: sha256:2899914f5fbaffc87610397bd5fb11ebb27db76b4b4d3215277185304593b2af
    state: active
  - id: p00012
    type: paragraph
    text: In political practice, therefore, they join in all coercive measures against the working class; and in ordinary life, despite their high-falutin phrases, they stoop to pick up the golden apples dropped from the tree of industry, and to barter truth, love, and honour, for traffic in wool, beetroot-sugar, and potato spirits.<fn ref="2"/>
    hash: sha256:6e334c6ee6ba58ebac00164316b14e42c191d48b658c506a2b04e62d755e1fad
    state: active
  - id: p00013
    type: paragraph
    text: As the parson has ever gone hand in hand with the landlord, so has Clerical Socialism with Feudal Socialism.
    hash: sha256:e896ddb6e5b8790e19b92fb5fd7a5554f022eb8c60af82d23585281cbad29fe3
    state: active
  - id: p00014
    type: paragraph
    text: Nothing is easier than to give Christian asceticism a Socialist tinge. Has not Christianity declaimed against private property, against marriage, against the State? Has it not preached in the place of these, charity and poverty, celibacy and mortification of the flesh, monastic life and Mother Church? Christian Socialism is but the holy water with which the priest consecrates the heart-burnings of the aristocrat.
    hash: sha256:8dba97a062772fbbe7d846a1bf44bede8433c0d263817bd09185e192e8b7abb1
    state: active
  - id: p00015
    type: heading
    level: 6
    text: B. Petty-Bourgeois Socialism
    hash: sha256:1f3d2e9f9180f34f8408b7052fa3994ba7e235e5dbf38be1472d18a71356075b
    state: active
  - id: p00016
    type: paragraph
    text: The feudal aristocracy was not the only class that was ruined by the bourgeoisie, not the only class whose conditions of existence pined and perished in the atmosphere of modern bourgeois society. The medieval burgesses and the small peasant proprietors were the precursors of the modern bourgeoisie. In those countries which are but little developed, industrially and commercially, these two classes still vegetate side by side with the rising bourgeoisie.
    hash: sha256:598a058a714b66bdbe409e89bd00170f1f5d98859babcbcfe27b8b79204e1754
    state: active
  - id: p00017
    type: paragraph
    text: In countries where modern civilisation has become fully developed, a new class of petty bourgeois has been formed, fluctuating between proletariat and bourgeoisie, and ever renewing itself as a supplementary part of bourgeois society. The individual members of this class, however, are being constantly hurled down into the proletariat by the action of competition, and, as modern industry develops, they even see the moment approaching when they will completely disappear as an independent section of modern society, to be replaced in manufactures, agriculture and commerce, by overlookers, bailiffs and shopmen.
    hash: sha256:3c34ac418dbf0898a7d32adfde13fce7aa92ae2e50ba1a43755f839b33106d72
    state: active
  - id: p00018
    type: paragraph
    text: In countries like France, where the peasants constitute far more than half of the population, it was natural that writers who sided with the proletariat against the bourgeoisie should use, in their criticism of the bourgeois <i>régime</i>, the standard of the peasant and petty bourgeois, and from the standpoint of these intermediate classes, should take up the cudgels for the working class. Thus arose petty-bourgeois Socialism. Sismondi was the head of this school, not only in France but also in England.
    hash: sha256:656253f7939281bf5c43af1a977dc9d3f76cdf7f879eaedba316f5267982a63e
    state: active
  - id: p00019
    type: paragraph
    text: This school of Socialism dissected with great acuteness the contradictions in the conditions of modern production. It laid bare the hypocritical apologies of economists. It proved, incontrovertibly, the disastrous effects of machinery and division of labour; the concentration of capital and land in a few hands; overproduction and crises; it pointed out the inevitable ruin of the petty bourgeois and peasant, the misery of the proletariat, the anarchy in production, the crying inequalities in the distribution of wealth, the industrial war of extermination between nations, the dissolution of old moral bonds, of the old family relations, of the old nationalities.
    hash: sha256:e0e1100b30800171690e8622f71e6411a9e0a640db7e2cd3a0c626343bb952bd
    state: active
  - id: p00020
    type: paragraph
    text: In its positive aims, however, this form of Socialism aspires either to restoring the old means of production and of exchange, and with them the old property relations, and the old society, or to cramping the modern means of production and of exchange within the framework of the old property relations that have been, and were bound to be, exploded by those means. In either case, it is both reactionary and Utopian.
    hash: sha256:10e128054867ba27861ed57b3640159aa4fa254e18cace4e85ef22b8185812a9
    state: active
  - id: p00021
    type: paragraph
    text: "Its last words are: corporate guilds for manufacture; patriarchal relations in agriculture."
    hash: sha256:dd54599981ebc0d4cfe62807f75bb1ab82b79f45c3624a0a1afed04153653271
    state: active
  - id: p00022
    type: paragraph
    text: Ultimately, when stubborn historical facts had dispersed all intoxicating effects of self-deception, this form of Socialism ended in a miserable fit of the blues.
    hash: sha256:58694f4854c80f4650234b549f1918ebcaee1dbf91b4bd88c159d91fc65a92e4
    state: active
  - id: p00023
    type: heading
    level: 6
    text: C. German or “True” Socialism
    hash: sha256:2867e77f1602df300249ec09cd59d65ba7ed9e79fac78fc41002a1a6aa63e279
    state: active
  - id: p00024
    type: paragraph
    text: The Socialist and Communist literature of France, a literature that originated under the pressure of a bourgeoisie in power, and that was the expressions of the struggle against this power, was introduced into Germany at a time when the bourgeoisie, in that country, had just begun its contest with feudal absolutism.
    hash: sha256:2fdbd3474dd42eef3179fc836153afa6e003536d4ee4f6f72afd0f784bceb93f
    state: active
  - id: p00025
    type: paragraph
    text: German philosophers, would-be philosophers, and <i>beaux esprits</i> (men of letters), eagerly seized on this literature, only forgetting, that when these writings immigrated from France into Germany, French social conditions had not immigrated along with them. In contact with German social conditions, this French literature lost all its immediate practical significance and assumed a purely literary aspect. Thus, to the German philosophers of the Eighteenth Century, the demands of the first French Revolution were nothing more than the demands of “Practical Reason” in general, and the utterance of the will of the revolutionary French bourgeoisie signified, in their eyes, the laws of pure Will, of Will as it was bound to be, of true human Will generally.
    hash: sha256:989f068b239d306e4c4613ef9cbccc91bef410ce59eb8f90fbcd7ee8c05bee07
    state: active
  - id: p00026
    type: paragraph
    text: The work of the German <i>literati</i> consisted solely in bringing the new French ideas into harmony with their ancient philosophical conscience, or rather, in annexing the French ideas without deserting their own philosophic point of view.
    hash: sha256:5988636afeb177f26d973d7bb9dfd91d8cbf2b57949dc87105b9b7fe1cb7eacb
    state: active
  - id: p00027
    type: paragraph
    text: This annexation took place in the same way in which a foreign language is appropriated, namely, by translation.
    hash: sha256:3ac7e5461ffec76f4b201d517caa64f43c645e83d482eef20362d57bbfdf57d5
    state: active
  - id: p00028
    type: paragraph
    text: It is well known how the monks wrote silly lives of Catholic Saints <i>over</i> the manuscripts on which the classical works of ancient heathendom had been written. The German <i>literati</i> reversed this process with the profane French literature. They wrote their philosophical nonsense beneath the French original. For instance, beneath the French criticism of the economic functions of money, they wrote “Alienation of Humanity”, and beneath the French criticism of the bourgeois state they wrote “Dethronement of the Category of the General”, and so forth.
    hash: sha256:8cb211b2f5e1a094428e627343d1b5c9b7e5c79b3bc74f44885c881c8e8aa555
    state: active
  - id: p00029
    type: paragraph
    text: The introduction of these philosophical phrases at the back of the French historical criticisms, they dubbed “Philosophy of Action”, “True Socialism”, “German Science of Socialism”, “Philosophical Foundation of Socialism”, and so on.
    hash: sha256:c6ee96ffbe8af0be416faa89152bc1178915fb9f8184da8517bad78a3f8378f3
    state: active
  - id: p00030
    type: paragraph
    text: The French Socialist and Communist literature was thus completely emasculated. And, since it ceased in the hands of the German to express the struggle of one class with the other, he felt conscious of having overcome “French one-sidedness” and of representing, not true requirements, but the requirements of Truth; not the interests of the proletariat, but the interests of Human Nature, of Man in general, who belongs to no class, has no reality, who exists only in the misty realm of philosophical fantasy.
    hash: sha256:962fe89e2c923ceba6faf2279ec774ce02f7947151b00c66a2c6cc95d99efc7a
    state: active
  - id: p00031
    type: paragraph
    text: This German socialism, which took its schoolboy task so seriously and solemnly, and extolled its poor stock-in-trade in such a mountebank fashion, meanwhile gradually lost its pedantic innocence.
    hash: sha256:48aaf3f3b89709b6eb8d5768cb931814ea7e52bbd646105f3fa4a9743e97a7f4
    state: active
  - id: p00032
    type: paragraph
    text: The fight of the Germans, and especially of the Prussian bourgeoisie, against feudal aristocracy and absolute monarchy, in other words, the liberal movement, became more earnest.
    hash: sha256:212fbdfe8c586ad245b59d968a1cc3800be08c14f841cbbffd0450a446573972
    state: active
  - id: p00033
    type: paragraph
    text: By this, the long-wished for opportunity was offered to “True” Socialism of confronting the political movement with the Socialist demands, of hurling the traditional anathemas against liberalism, against representative government, against bourgeois competition, bourgeois freedom of the press, bourgeois legislation, bourgeois liberty and equality, and of preaching to the masses that they had nothing to gain, and everything to lose, by this bourgeois movement. German Socialism forgot, in the nick of time, that the French criticism, whose silly echo it was, presupposed the existence of modern bourgeois society, with its corresponding economic conditions of existence, and the political constitution adapted thereto, the very things whose attainment was the object of the pending struggle in Germany.
    hash: sha256:4645f7fbefd91d656f795e6f9abe5a1621cc8700273b36ab108e16f086befc70
    state: active
  - id: p00034
    type: paragraph
    text: To the absolute governments, with their following of parsons, professors, country squires, and officials, it served as a welcome scarecrow against the threatening bourgeoisie.
    hash: sha256:8ee026e828a2a421d33bf88b962d7065f77d65f54516f11c9234ab6bee6475a1
    state: active
  - id: p00035
    type: paragraph
    text: It was a sweet finish, after the bitter pills of flogging and bullets, with which these same governments, just at that time, dosed the German working-class risings.
    hash: sha256:0867ba47a02b483279c66c960768c826e379b01c150dc802749ef1f8ede278e2
    state: active
  - id: p00036
    type: paragraph
    text: While this “True” Socialism thus served the government as a weapon for fighting the German bourgeoisie, it, at the same time, directly represented a reactionary interest, the interest of German Philistines. In Germany, the <i>petty-bourgeois</i> class, a relic of the sixteenth century, and since then constantly cropping up again under the various forms, is the real social basis of the existing state of things.
    hash: sha256:89b0e0656aa3130cdc491e51fc0b321331764c62c29abc4319d8e61ff0a836c2
    state: active
  - id: p00037
    type: paragraph
    text: To preserve this class is to preserve the existing state of things in Germany. The industrial and political supremacy of the bourgeoisie threatens it with certain destruction — on the one hand, from the concentration of capital; on the other, from the rise of a revolutionary proletariat. “True” Socialism appeared to kill these two birds with one stone. It spread like an epidemic.
    hash: sha256:a3b136a15c8da89da27b54e55ae4d0f752c48d64f7ba6eed477f4f3c55c9677c
    state: active
  - id: p00038
    type: paragraph
    text: The robe of speculative cobwebs, embroidered with flowers of rhetoric, steeped in the dew of sickly sentiment, this transcendental robe in which the German Socialists wrapped their sorry “eternal truths”, all skin and bone, served to wonderfully increase the sale of their goods amongst such a public.
    hash: sha256:b8820132b1ce8a57519891b9d048d14ab077c7477a35c8c4614ff4d665689fe2
    state: active
  - id: p00039
    type: paragraph
    text: And on its part German Socialism recognised, more and more, its own calling as the bombastic representative of the petty-bourgeois Philistine.
    hash: sha256:e2cdc412417b36959716bffd6f0c6e2f85329c822b469a541310894f9dc41717
    state: active
  - id: p00040
    type: paragraph
    text: It proclaimed the German nation to be the model nation, and the German petty Philistine to be the typical man. To every villainous meanness of this model man, it gave a hidden, higher, Socialistic interpretation, the exact contrary of its real character. It went to the extreme length of directly opposing the “brutally destructive” tendency of Communism, and of proclaiming its supreme and impartial contempt of all class struggles. With very few exceptions, all the so-called Socialist and Communist publications that now (1847) circulate in Germany belong to the domain of this foul and enervating literature.<fn ref="3"/>
    hash: sha256:b8033ffb941fbd7fcecb228c480402673b7833769d1ca17ed52ffb07375cba64
    state: active
  - id: p00041
    type: heading
    level: 2
    text: 2. Conservative or Bourgeois Socialism
    hash: sha256:3f7f02621b21720ef9c5ea81145dc5f017797fcf24f3056b05c97c4d90cb363e
    state: active
  - id: p00042
    type: paragraph
    text: A part of the bourgeoisie is desirous of redressing social grievances in order to secure the continued existence of bourgeois society.
    hash: sha256:0ed886efa15572ed43217b729d4856fcfe2feedee212aec62c4635d128c48e0e
    state: active
  - id: p00043
    type: paragraph
    text: To this section belong economists, philanthropists, humanitarians, improvers of the condition of the working class, organisers of charity, members of societies for the prevention of cruelty to animals, temperance fanatics, hole-and-corner reformers of every imaginable kind. This form of socialism has, moreover, been worked out into complete systems.
    hash: sha256:ca3b98143bd814c1956d14084785dd119f60661b2d0d9fbd0ab8925858f97ee9
    state: active
  - id: p00044
    type: paragraph
    text: We may cite Proudhon’s <i>Philosophie de la Misère</i> as an example of this form.
    hash: sha256:0934537c0a2d19456d581bf63882fee5e4a7bce957490e3409e779dcfa176ed1
    state: active
  - id: p00045
    type: paragraph
    text: The Socialistic bourgeois want all the advantages of modern social conditions without the struggles and dangers necessarily resulting therefrom. They desire the existing state of society, minus its revolutionary and disintegrating elements. They wish for a bourgeoisie without a proletariat. The bourgeoisie naturally conceives the world in which it is supreme to be the best; and bourgeois Socialism develops this comfortable conception into various more or less complete systems. In requiring the proletariat to carry out such a system, and thereby to march straightway into the social New Jerusalem, it but requires in reality, that the proletariat should remain within the bounds of existing society, but should cast away all its hateful ideas concerning the bourgeoisie.
    hash: sha256:976237bf9930df34590a811a9ab2b6423ab21444d850f75ef0b19c758bceef57
    state: active
  - id: p00046
    type: paragraph
    text: A second, and more practical, but less systematic, form of this Socialism sought to depreciate every revolutionary movement in the eyes of the working class by showing that no mere political reform, but only a change in the material conditions of existence, in economical relations, could be of any advantage to them. By changes in the material conditions of existence, this form of Socialism, however, by no means understands abolition of the bourgeois relations of production, an abolition that can be affected only by a revolution, but administrative reforms, based on the continued existence of these relations; reforms, therefore, that in no respect affect the relations between capital and labour, but, at the best, lessen the cost, and simplify the administrative work, of bourgeois government.
    hash: sha256:df5108d58538e11b155629d83b606caf8d837d7a4beecaf670ae38e42dfd1a90
    state: active
  - id: p00047
    type: paragraph
    text: Bourgeois Socialism attains adequate expression when, and only when, it becomes a mere figure of speech.
    hash: sha256:7709e1be8edc0588d743d129add73ceb34e494d27affbe67d5eb8b0152a402aa
    state: active
  - id: p00048
    type: paragraph
    text: "Free trade: for the benefit of the working class. Protective duties: for the benefit of the working class. Prison Reform: for the benefit of the working class. This is the last word and the only seriously meant word of bourgeois socialism."
    hash: sha256:a4ac3f724f593b0c566a1e385e5c26c5b7a230e9edb0b00e8d8b7d4e9025bac6
    state: active
  - id: p00049
    type: paragraph
    text: "It is summed up in the phrase: the bourgeois is a bourgeois — for the benefit of the working class."
    hash: sha256:b02ce23215c0802c89dcacf5506629ccdf91e9284a14b89809cf4a0747dfd954
    state: active
  - id: p00050
    type: heading
    level: 2
    text: 3. Critical-Utopian Socialism and Communism
    hash: sha256:71a72e7638796a76b968549c218d5168e734d321e54d726a53e23abf40571f4d
    state: active
  - id: p00051
    type: paragraph
    text: We do not here refer to that literature which, in every great modern revolution, has always given voice to the demands of the proletariat, such as the writings of Babeuf and others.
    hash: sha256:da21ef633dde58afe889d120bc562aa8679d08828ae4a873062c18a2190e2bbe
    state: active
  - id: p00052
    type: paragraph
    text: The first direct attempts of the proletariat to attain its own ends, made in times of universal excitement, when feudal society was being overthrown, necessarily failed, owing to the then undeveloped state of the proletariat, as well as to the absence of the economic conditions for its emancipation, conditions that had yet to be produced, and could be produced by the impending bourgeois epoch alone. The revolutionary literature that accompanied these first movements of the proletariat had necessarily a reactionary character. It inculcated universal asceticism and social levelling in its crudest form.
    hash: sha256:d78467cc6157ddaa12b25b0f9285d3de171466434fc315263f9e709292941ad6
    state: active
  - id: p00053
    type: paragraph
    text: The Socialist and Communist systems, properly so called, those of Saint-Simon, Fourier, Owen, and others, spring into existence in the early undeveloped period, described above, of the struggle between proletariat and bourgeoisie (see Section 1. Bourgeois and Proletarians).
    hash: sha256:e480cd2853b2db6cfd78e2edf1aa765c005cdd5fd7f895903fb68dc8f854ec33
    state: active
  - id: p00054
    type: paragraph
    text: The founders of these systems see, indeed, the class antagonisms, as well as the action of the decomposing elements in the prevailing form of society. But the proletariat, as yet in its infancy, offers to them the spectacle of a class without any historical initiative or any independent political movement.
    hash: sha256:d4d41f20766da96aabf7996de3efce05916b5e8f855397f6972e15099901dec1
    state: active
  - id: p00055
    type: paragraph
    text: Since the development of class antagonism keeps even pace with the development of industry, the economic situation, as they find it, does not as yet offer to them the material conditions for the emancipation of the proletariat. They therefore search after a new social science, after new social laws, that are to create these conditions.
    hash: sha256:282886ee5d8e97cc7b9497d937e84d5da04b1126b3ca18d44df67ca4ef360c0b
    state: active
  - id: p00056
    type: paragraph
    text: Historical action is to yield to their personal inventive action; historically created conditions of emancipation to fantastic ones; and the gradual, spontaneous class organisation of the proletariat to an organisation of society especially contrived by these inventors. Future history resolves itself, in their eyes, into the propaganda and the practical carrying out of their social plans.
    hash: sha256:e876ebd237d9b21b6fe4337c48ab797ef0fb89bb9699337fd178e9bcc07c20bc
    state: active
  - id: p00057
    type: paragraph
    text: In the formation of their plans, they are conscious of caring chiefly for the interests of the working class, as being the most suffering class. Only from the point of view of being the most suffering class does the proletariat exist for them.
    hash: sha256:9f4d7a473658887a5d74efca22c90089d657c3ea9a59321e83df17c07fad0981
    state: active
  - id: p00058
    type: paragraph
    text: The undeveloped state of the class struggle, as well as their own surroundings, causes Socialists of this kind to consider themselves far superior to all class antagonisms. They want to improve the condition of every member of society, even that of the most favoured. Hence, they habitually appeal to society at large, without the distinction of class; nay, by preference, to the ruling class. For how can people, when once they understand their system, fail to see in it the best possible plan of the best possible state of society?
    hash: sha256:f9c0ab3db447cf21fdd2bb27c315b325b5235ed710daf671f3eaee41ef49c3f1
    state: active
  - id: p00059
    type: paragraph
    text: Hence, they reject all political, and especially all revolutionary action; they wish to attain their ends by peaceful means, necessarily doomed to failure, and by the force of example, to pave the way for the new social Gospel.
    hash: sha256:8fc4ea6bd6de61463bd094512dd837644e4ad28d4c16a1837270ecd0611b9396
    state: active
  - id: p00060
    type: paragraph
    text: Such fantastic pictures of future society, painted at a time when the proletariat is still in a very undeveloped state and has but a fantastic conception of its own position, correspond with the first instinctive yearnings of that class for a general reconstruction of society.
    hash: sha256:de880dee4227ade9b4c03eeb6edd7752a0819400105bd556c8c759408ef30e2a
    state: active
  - id: p00061
    type: paragraph
    text: But these Socialist and Communist publications contain also a critical element. They attack every principle of existing society. Hence, they are full of the most valuable materials for the enlightenment of the working class. The practical measures proposed in them — such as the abolition of the distinction between town and country, of the family, of the carrying on of industries for the account of private individuals, and of the wage system, the proclamation of social harmony, the conversion of the function of the state into a mere superintendence of production — all these proposals point solely to the disappearance of class antagonisms which were, at that time, only just cropping up, and which, in these publications, are recognised in their earliest indistinct and undefined forms only. These proposals, therefore, are of a purely Utopian character.
    hash: sha256:a38b63f854aa894f864f336641345f860d791370b41cb0a1928d610104a6f6ec
    state: active
  - id: p00062
    type: paragraph
    text: The significance of Critical-Utopian Socialism and Communism bears an inverse relation to historical development. In proportion as the modern class struggle develops and takes definite shape, this fantastic standing apart from the contest, these fantastic attacks on it, lose all practical value and all theoretical justification. Therefore, although the originators of these systems were, in many respects, revolutionary, their disciples have, in every case, formed mere reactionary sects. They hold fast by the original views of their masters, in opposition to the progressive historical development of the proletariat. They, therefore, endeavour, and that consistently, to deaden the class struggle and to reconcile the class antagonisms. They still dream of experimental realisation of their social Utopias, of founding isolated “phalansteres”, of establishing “Home Colonies”, or setting up a “Little Icaria”<fn ref="4"/> — duodecimo editions of the New Jerusalem — and to realise all these castles in the air, they are compelled to appeal to the feelings and purses of the bourgeois. By degrees, they sink into the category of the reactionary [or] conservative Socialists depicted above, differing from these only by more systematic pedantry, and by their fanatical and superstitious belief in the miraculous effects of their social science.
    hash: sha256:92ee537b2fe4c05290502a2819a3e63cfa6fb5ceea30ac3635913734fc84ded4
    state: active
  - id: p00063
    type: paragraph
    text: They, therefore, violently oppose all political action on the part of the working class; such action, according to them, can only result from blind unbelief in the new Gospel.
    hash: sha256:20f32a05e5f0414ec71bcd5ab99102e99bd3e8376352a012d3d55bf4280f472e
    state: active
  - id: p00064
    type: paragraph
    text: The Owenites in England, and the Fourierists in France, respectively, oppose the Chartists and the <i>Réformistes</i>.
    hash: sha256:96d56857d1d7b053f23df8b60fdab46f68e95f1e6ef4c6ad760e630157745156
    state: active
  - id: p00065
    type: footnote
    label: "1"
    text: Not the English Restoration (1660-1689), but the French Restoration (1814-1830). [Note by Engels to the English edition of 1888.]
    hash: sha256:8ea12dc7a7c1d4a7ba72e5e60b60d5c6ae0c57c5188cff8859966d31aa3e141c
    state: active
  - id: p00066
    type: footnote
    label: "2"
    text: This applies chiefly to Germany, where the landed aristocracy and squirearchy have large portions of their estates cultivated for their own account by stewards, and are, moreover, extensive beetroot-sugar manufacturers and distillers of potato spirits. The wealthier British aristocracy are, as yet, rather above that; but they, too, know how to make up for declining rents by lending their names to floaters or more or less shady joint-stock companies. [Note by Engels to the English edition of 1888.]
    hash: sha256:388802ebc9052dea7242ef1d51151c127b314c435125499b1b523b679bb93feb
    state: active
  - id: p00067
    type: footnote
    label: "3"
    text: The revolutionary storm of 1848 swept away this whole shabby tendency and cured its protagonists of the desire to dabble in socialism. The chief representative and classical type of this tendency is Mr Karl Gruen. [Note by Engels to the German edition of 1890.]
    hash: sha256:6338309c2c251749553019e516b513d9f6502535b5aeefdba5bc85a83712ea46
    state: active
  - id: p00068
    type: footnote
    label: "4"
    text: <i>Phalanstéres</i> were Socialist colonies on the plan of Charles Fourier; <i>Icaria</i> was the name given by Cabet to his Utopia and, later on, to his American Communist colony. [Note by Engels to the English edition of 1888.]<br/><br/>“Home Colonies” were what Owen called his Communist model societies. <i>Phalanstéres</i> was the name of the public palaces planned by Fourier. <i>Icaria</i> was the name given to the Utopian land of fancy, whose Communist institutions Cabet portrayed. [Note by Engels to the German edition of 1890.]
    hash: sha256:d45f475e733dbbc4bb496f4456f4f0594c108ddc2cf53bbdeddc6e268fb8dd83
    state: active
  - id: p00069
    type: footnote
    label: A
    text: A reference to the movement for a reform of the electoral law which, under the pressure of the working class, was passed by the British House of Commons in 1831 and finally endorsed by the House of Lords in June, 1832. The reform was directed against monopoly rule of the landed and finance aristocracy and opened the way to Parliament for the representatives of the industrial bourgeoisie. Neither workers nor the petty-bourgeois were allowed electoral rights, despite assurances they would.
    hash: sha256:272e1f790b4db4fc2f0464050d8e27520fa773235de94d5ba47a553d9354268c
    state: active
