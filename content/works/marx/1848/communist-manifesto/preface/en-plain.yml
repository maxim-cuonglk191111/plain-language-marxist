    text: After inaccurate American translations were repeatedly reprinted in England, an authentic version appeared in 1888. My friend Samuel Moore produced it, and we reviewed it together before printing. It is titled <i>Manifesto of the Communist Party</i>. I added some of its notes to this edition.
  p00044:
    covers: [p00044]
    based_on: sha256:1f1e597ddd3accdb4c8c88e8f2a22604b1ed05892d611e20dd849821c2bf0b04
    revision: 1
