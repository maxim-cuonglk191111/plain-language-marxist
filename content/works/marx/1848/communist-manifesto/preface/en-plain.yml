    text: I must sign the preface to this edition alone, alas. Marx—the man to whom the whole working class of Europe and America owes more than to anyone else—rests in Highgate Cemetery. The first grass is already growing over his grave. Since his death, revising or supplementing the Manifesto is even more out of the question. But I consider it all the more necessary to state the following explicitly once again.
  p00017:
    covers: [p00017]
    based_on: sha256:0a9fffb1aaac63b3ad586c4b2cfbbdae5a157d0c58f14d72e60b03b726accfe9
    revision: 1
    ai_assisted: true
    text: |
      The basic thought running through the Manifesto belongs solely and exclusively to Marx. That thought is this: in every historical epoch, economic production and the social structure arising from it form the foundation for political and intellectual history. Ever since the breaking up of primeval common land ownership, all history has been a history of class struggles. It has been a history of struggles between exploited and exploiting, dominated and dominating classes across social evolution.

      Now, this struggle has reached a stage where the exploited and oppressed class, the {proletariat:sg}, cannot free itself from the ruling class, the {bourgeoisie:sg}, without forever freeing society as a whole from all exploitation, oppression, and class struggles.
  p00018:
    covers: [p00018]
    based_on: sha256:3f11a377ed7136ba9e19938667f9ec9ef0c5b3afb5441dc854491347a0fab54d
    revision: 1
    ai_assisted: true
    text: I have often said this before. But right now it is necessary that it also stand at the head of the Manifesto itself.
  p00019:
    covers: [p00019]
