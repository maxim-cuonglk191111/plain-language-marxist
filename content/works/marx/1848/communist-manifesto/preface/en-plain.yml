    text: The Manifesto was published as the platform of the {communism:adj} League. This was an association of workers, first purely German, and later international. Under Continental political conditions before 1848, it was unavoidably a secret society. At a Congress of the League in November 1847, Marx and Engels were commissioned to draft a complete theoretical and practical {party:sg} program. Written in German in January 1848, the manuscript went to the printer in London a few weeks before the French Revolution of February 24. A French translation appeared in Paris shortly before the June insurrection of 1848. Helen Macfarlane made the first English translation for George Julian Harney's <i>Red Republican</i> in London in 1850. Danish and Polish editions had also been published.
  p00022:
    covers: [p00022]
    based_on: sha256:b0da659f87e9b7af058b210508c478d0b8de633158a37c6edcf5833ed6bbca46
    revision: 1
    ai_assisted: true
    text: |
      The defeat of the Parisian workers in June 1848—the first great battle between {proletariat:sg} and {bourgeoisie:sg}—pushed the social and political goals of European workers into the background. The struggle for power again took place solely between different sections of the propertied class. The working class was reduced to a fight for political breathing room, acting as the extreme wing of middle-class Radicals. Wherever independent {proletariat:adj} movements showed life, authorities hunted them down without mercy.

      Prussian police hunted down the Central Board of the {communism:adj} League in Cologne. Members were arrested and tried in October 1852 after eighteen months in prison. This celebrated Cologne Communist Trial lasted from October 4 to November 12. Seven prisoners were sentenced to prison terms in a fortress, lasting from three to six years. Immediately after sentencing, the remaining members formally dissolved the League. The Manifesto seemed doomed to be forgotten.
  p00023:
    covers: [p00023]
    based_on: sha256:dd1ddb22523602b2f137990964f30e877200e77e8f61ee0717c17f6391ce5913
    revision: 1
    ai_assisted: true
    text: When European workers regained enough strength for another attack on the ruling classes, the International Working Men’s Association arose. But this association aimed to unite all militant workers of Europe and America into one body. Therefore, it could not immediately proclaim the principles in the Manifesto. The International needed a program broad enough for English trade unions, French, Belgian, Italian, and Spanish Proudhonists, and German Lassalleans. <fn ref="2"/>
  p00024:
    covers: [p00024]
    based_on: sha256:7d10b86836addb8c743b21c4b676cb703da9d223200f753445b50789f249055a
    revision: 1
    ai_assisted: true
    text: |
      Marx drafted this program to the satisfaction of all parties. He trusted completely in the intellectual development of the working class through combined action and discussion. The events and vicissitudes of the struggle against {capital:sg}, defeats even more than victories, showed people that their favorite remedies were not enough. They prepared the way for deeper insight into the real conditions for working-class emancipation.

      Marx was right. When the International broke up in 1874, it left the workers very different from how it found them in 1864. Proudhonism in France and Lassalleanism in Germany were dying out. Even conservative English trade unions were advancing toward the point where their president could say in Swansea: “Continental socialism has lost its terror for us.” In fact, the principles of the Manifesto had made considerable headway among workers in all countries.
  p00025:
    covers: [p00025]
    based_on: sha256:68e8521f094d793e943f0f66ae0ede0f846e835d7889e044850d3756589d61e9
    revision: 1
    ai_assisted: true
    text: Thus the Manifesto came to the front again. Since 1850, the German text had been reprinted several times in Switzerland, England, and America. In 1872, it was translated into English in New York and published in <i>Woodhull and Claflin’s Weekly</i>. A French version in <i>Le Socialiste</i> came from this English text. Since then, at least two more English translations appeared in America, and one was reprinted in England. Bakunin's Russian translation was published at Herzen's <i>Kolokol</i> office in Geneva around 1863. A second Russian translation by Vera Zasulich appeared in Geneva in 1882. A new Danish edition came out in Copenhagen in 1885, and a fresh French translation in Paris in 1886. A Spanish version was published in Madrid in 1886. German reprints are too numerous to count, with at least twelve in all. An Armenian translation in Constantinople was stopped because the publisher feared using Marx's name. The history of the Manifesto reflects the history of the modern working-class movement. Today it is the most widespread, international product of socialist literature, a common platform recognized by millions of workers from Siberia to California.
  p00026:
    covers: [p00026]
    based_on: sha256:29c9155d3718d1876ed674d5ab533154b0cda740565d6e3ecc716e6f33f177ef
    revision: 1
    ai_assisted: true
    text: |
      Yet, when it was written, we could not have called it a <i>socialist</i> manifesto. In 1847, two kinds of people were called Socialists. On the one hand were followers of utopian systems: Owenites in England and Fourierists in France, both reduced to small dying sects. On the other hand were social quacks who claimed to heal social grievances without endangering {capital:sg} and profit. Both groups stood outside the labor movement and looked to educated classes for support.

      Any section of the working class that demanded total social change called itself Communist. It was a rough, instinctive {communism:sg}, but it touched the core point. It produced the utopian {communism:sg} of Cabet in France and Weitling in Germany. Thus, in 1847, socialism was a middle-class movement, while {communism:sg} was a working-class movement. Socialism was respectable on the Continent; {communism:sg} was the opposite. Since our view from the beginning was that “the emancipation of the workers must be the act of the working class itself,” there was no doubt which name we had to take. We have never thought of renouncing it since.
  p00027:
    covers: [p00027]
    based_on: sha256:d78aa34393f0c83bc0223cfadc31399799b6cfd6fa1879bb7dc63adfa6a09d86
    revision: 1
    ai_assisted: true
    text: |
      Since the Manifesto was our joint work, I must state that its fundamental proposition belongs to Marx. That proposition is: in every historical epoch, the prevailing mode of economic production and exchange forms the basis of that epoch's political and intellectual history. Ever since primitive tribal society holding land in common broke up, all history has been a history of class struggles between exploiting and exploited, ruling and oppressed classes.

      The history of these struggles forms a series of developments. Today, a stage is reached where the exploited and oppressed class, the {proletariat:sg}, cannot win freedom from the ruling class, the {bourgeoisie:sg}, without at the same time freeing society as a whole from all exploitation, oppression, and class struggles forever.
  p00028:
    covers: [p00028]
    based_on: sha256:abcaf4f42e919b978992d001c3f44008e6a8335ee96b8a087dd44d36fc87eb42
    revision: 1
    ai_assisted: true
    text: This proposition is destined to do for history what Darwin's theory did for biology. We had both been approaching it for some years before 1845. My <i>Condition of the Working Class in England</i> shows how far I had progressed toward it independently. But when I met Marx in Brussels in spring 1845, he had already worked it out and explained it to me clearly.
  p00029:
    covers: [p00029]
    based_on: sha256:31ed604158f86cf934dddea83c99d79fc1867ffac03e238fc74f44628ff62843
    revision: 1
    ai_assisted: true
    text: "From our joint preface to the German edition of 1872, I quote the following:"
  p00030:
    covers: [p00030]
    based_on: sha256:2bbf865129ee47fdebfac7c09afa2d8e2a2fe5120ab58fa481205cc1e1756c93
    revision: 1
    ai_assisted: true
    text: "“However much that state of things may have altered during the last twenty-five years, the general principles laid down in the Manifesto are, on the whole, as correct today as ever. Here and there, some detail might be improved. The practical application of the principles will depend, as the Manifesto itself states, everywhere and at all times, on the historical conditions for the time being existing, and, for that reason, no special stress is laid on the revolutionary measures proposed at the end of Section II. That passage would, in many respects, be very differently worded today. In view of the gigantic strides of Modern Industry since 1848, and of the accompanying improved and extended organization of the working class, in view of the practical experience gained, first in the February Revolution, and then, still more, in the Paris Commune, where the proletariat for the first time held political power for two whole months, this programme has in some details been antiquated. One thing especially was proved by the Commune, viz., that 'the working class cannot simply lay hold of ready-made state machinery, and wield it for its own purposes.' (See <i>The Civil War in France: Address of the General Council of the International Working Men’s Association</i>, 1871, where this point is further developed.) Further, it is self-evident that the criticism of socialist literature is deficient in relation to the present time, because it comes down only to 1847; also that the remarks on the relation of the Communists to the various opposition parties (Section IV), although, in principle still correct, yet in practice are antiquated, because the political situation has been entirely changed, and the progress of history has swept from off the Earth the greater portion of the political parties there enumerated.”"
  p00031:
    covers: [p00031]
    based_on: sha256:772458bc50fe3b756cb03ae5a80fb75fc8894bce82bb78be5838bf3d8e0d8a55
    revision: 1
    ai_assisted: true
    text: “But then, the Manifesto has become a historical document which we have no longer any right to alter.”
  p00032:
