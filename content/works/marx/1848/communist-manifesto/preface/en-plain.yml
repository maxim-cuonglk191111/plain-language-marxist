    text: The Manifesto does full justice to the {revolution:adj} role played by capitalism in the past. Italy was the first capitalist nation. The close of the feudal Middle Ages and the opening of modern capitalism are marked by Dante, the last poet of the Middle Ages and the first of modern times. Today, a new era approaches. Will Italy give us a new Dante to mark the birth of this {proletariat:adj} era?
