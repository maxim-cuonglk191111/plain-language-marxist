    text: “Working men of all countries, unite!” Few voices answered when we proclaimed these words forty-two years ago before the Paris Revolution. But on September 28, 1864, workers of Western Europe joined hands in the International Working Men’s Association. That union lives stronger than ever today. As I write these lines, European and American workers are reviewing their fighting forces, mobilized as one army under one flag for the legal eight-hour working day. Today's spectacle will open the eyes of capitalists and landlords everywhere to the fact that workers of all countries are united indeed.
