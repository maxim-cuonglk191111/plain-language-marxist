    text: “This proposition,” I wrote in the preface to the English translation, “which is destined to do for history what Darwin's theory did for biology, we both approached before 1845. My <i>Condition of the Working Class in England</i> shows how far I progressed toward it independently. When I met Marx in Brussels in spring 1845, he had it worked out and explained it clearly.” [Note by Engels to the German edition of 1890]
