    text: Furthermore, a new Danish translation appeared in Copenhagen in 1885. Unfortunately, it is not complete. Essential passages seem to have caused difficulties for the translator and were omitted. There are also signs of carelessness. With more care, the translator could have produced an excellent piece of work.
  p00040:
