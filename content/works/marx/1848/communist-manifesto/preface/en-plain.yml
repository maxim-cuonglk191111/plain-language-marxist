    text: The Manifesto has had a history of its own. When it first appeared, the small vanguard of scientific socialism greeted it with enthusiasm. But it was soon forced into the background after the defeat of Parisian workers in June 1848. It was finally outlawed when Cologne Communists were convicted in November 1852. With the retreat of the workers' movement after the February Revolution, the Manifesto also receded into the background.
  p00045:
    covers: [p00045]
    based_on: sha256:6ed343f506788ef82c625920678c617afbc9e29dc942bc9eb6ddc92b0427928f
    revision: 1
    ai_assisted: true
    text: When European workers regained strength for a new attack on the ruling classes, the International Working Men’s Association arose. It aimed to unite all militant workers of Europe and America into one army. Therefore, it could not start from the principles of the Manifesto. It needed a program open to English trade unions, Proudhonists in France, Belgium, Italy, and Spain, and Lassalleans in Germany. Marx drafted this program with mastery admitted by all parties, including anarchists. For the final victory of the Manifesto's ideas, Marx relied entirely on the intellectual development of workers through joint action and discussion. Defeats even more than victories showed fighters that their old panaceas failed. They prepared the way for understanding the real conditions of working-class emancipation. Marx was right. The working class of 1874 was very different from that of 1864. Proudhonism and Lassalleanism were dying out. Even conservative English trade unions were advancing toward socialism. The history of the Manifesto reflects the modern labor movement since 1848. Today it is the most widely circulated socialist work in the world.
  p00046:
    covers: [p00046]
    based_on: sha256:775c911509a55c06fd0e5b3d62a17ccc45c5e2ffd1a028a7d082e66eebd1d8d9
    revision: 1
    ai_assisted: true
    text: Nevertheless, when it appeared, we could not have called it a <i>socialist</i> manifesto. In 1847, socialists meant followers of utopian sects or social quacks seeking patchwork reform without hurting {capital:sg}. Both stood outside the labor movement and looked to educated classes. The section of workers demanding radical reconstruction called itself {communism:adj}. It was a rough, instinctive movement, but strong enough to build utopian systems like Cabet's in France and Weitling's in Germany. In 1847, socialism meant a middle-class movement, while {communism:sg} was a working-class movement. Socialism was respectable; {communism:sg} was not. Since our conviction was that “the emancipation of the workers must be the task of the working class itself,” we had no doubt which name to choose.
  p00047:
