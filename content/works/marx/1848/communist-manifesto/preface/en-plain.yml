    ai_assisted: true
    text: The battles of 1848 were not fought in vain. Nor were the forty-five years since then wasted. The fruits are ripening. I hope this Italian translation will mark the victory of the Italian {proletariat:sg}, just as the original marked international revolution.
  p00061:
