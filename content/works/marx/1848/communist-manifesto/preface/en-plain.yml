    text: The last section shows most clearly how narrow a field the {proletariat:adj} movement then occupied in December 1847. That section covers the position of Communists toward the various opposition parties in various countries. Precisely Russia and the United States are missing here. At that time, Russia was the last great reserve of all European reaction. The United States absorbed the surplus {proletariat:adj} forces of Europe through immigration. Both countries provided Europe with raw materials, and both were markets for selling its industrial goods. Both were, therefore, pillars of the existing European system in one way or another.
  p00010:
    covers: [p00010]
    based_on: sha256:01e77ed08e2ac4a1f7684c9ec97ceab6daf5af740dcd8b0d9ecfcc0aed14637d
    revision: 2
    ai_assisted: true
    text: How very different today! Precisely European immigration fitted North American production for gigantic agriculture. Its competition is shaking the very foundations of European landed property, both large and small. At the same time, it enabled the United States to exploit its huge industrial resources. It did so with an energy and scale that must soon break the industrial monopoly of Western Europe, especially England. Both circumstances react in a {revolution:adj} manner upon America itself. Step by step, small and middle-sized farms succumb to the competition of giant farms. At the same time, a mass industrial {proletariat:sg} and a fabulous concentration of capital funds are developing for the first time.
  p00011:
    covers: [p00011]
    based_on: sha256:f5de1599c175c3fe37314a3900e53fd6d5a9fc31f822865c36233ca592ec3af2
    revision: 2
    ai_assisted: true
    text: And now Russia! During the Revolution of 1848-9, European princes and the European {bourgeoisie:persons} found their only salvation from the awakening {proletariat:sg} in Russian intervention. The Tsar was proclaimed the chief of European reaction. Today, he is a prisoner of war of the revolution in Gatchina. <fn ref="B"/> Russia now forms the vanguard of {revolution:adj} action in Europe.
  p00012:
    covers: [p00012]
    based_on: sha256:2454c5d32811cf9c6b4173aa18b8d9ae36caed23f877ca03cf13f04bc4efdcfc
    revision: 2
    ai_assisted: true
    text: "The {communism:adj} Manifesto aimed to proclaim the inevitable breaking up of modern {bourgeoisie:adj} property. But in Russia, things are different. Face-to-face with rapid capitalist swindles and newly developing {bourgeoisie:adj} property, peasants still own more than half the land in common. Now the question is: can the Russian <i>obshchina</i> pass directly to the higher form of Communist common ownership? Or, on the contrary, must it first pass through the same breaking up that marked the historical evolution of the West?"
  p00013:
    covers: [p00013]
    based_on: sha256:d9989a45bede1b971c35a98fbbdcc25035f83544c205c7d4fd5326a790b31315
    revision: 2
    ai_assisted: true
    text: "The only answer possible today is this: If the Russian Revolution becomes the signal for a {proletariat:adj} revolution in the West, so that each complements the other, the present Russian common ownership of land may serve as the starting point for a communist development."
  p00014:
    covers: [p00014]
