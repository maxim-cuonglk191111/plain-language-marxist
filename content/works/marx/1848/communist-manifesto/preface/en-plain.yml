    text: The first Russian translation of the Manifesto was made by Bakunin. Although he was an opponent of Marx and Engels in the labor movement, he saw the great {revolution:adj} importance of the Manifesto. Published in Geneva in 1869, Bakunin's translation was not completely accurate. Plekhanov's translation replaced it in 1882, with a preface written by Marx and Engels.
