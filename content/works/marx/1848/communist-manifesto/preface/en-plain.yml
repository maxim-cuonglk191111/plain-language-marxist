    text: Bakunin translated the first Russian edition of the Manifesto of the {communism:adj} Party. <fn ref="A"/> It was published early in the sixties by the printing office of the <i>Kolokol</i> [Free Russian Printing House]. At that time, the West could see in it only a literary curiosity. Such a view would be impossible today.
  p00009:
    covers: [p00009]
