    revision: 1
    ai_assisted: true
    text: First of all, the Manifesto has become an index of large-scale industry across Europe. As large-scale industry grows in a country, workers demand clarity about their position in relation to the owning classes. The socialist movement spreads among them, and demand for the Manifesto rises. Thus, the number of copies circulated in a language measures both the labor movement and the development of large-scale industry in that country.
  p00053:
    covers: [p00053]
    based_on: sha256:4c47b8589c6da48729d5a8ce6c2dbe938fb779f3289263c3998ccd983b1f12c3
    revision: 1
    ai_assisted: true
    text: The new Polish edition indicates real progress in Polish industry. Over the past ten years, Polish industry has concentrated into a compact area. It enjoys the advantages and disadvantages of such concentration. Competing Russian manufacturers acknowledged those advantages by demanding protective tariffs against Poland. The disadvantages for manufacturers and the Russian government appear in the rapid spread of socialist ideas among Polish workers and growing demand for the Manifesto.
  p00054:
    covers: [p00054]
    based_on: sha256:1677ba13ba685eba8641a2713c45feafd88d86eabc7e62dc32bb5f93a114510d
    revision: 1
    ai_assisted: true
    text: The rapid growth of Polish industry proves the vitality of the Polish people and guarantees their national restoration. Restoring an independent and strong Poland concerns all of us. Honest international cooperation in Europe is possible only if each nation is master in its own house. The Revolution of 1848 secured independence for Italy, Germany, and Hungary through Bonaparte and Bismarck. But Poland, which had done more for the revolution since 1792 than all three combined, was abandoned to Russian forces in 1863. The nobility could not regain Polish independence, and the {bourgeoisie:sg} is indifferent to it. Yet independence is necessary for European cooperation. Only the young Polish {proletariat:sg} can win it, and in their hands it is secure. Workers across Europe need Polish independence as much as Polish workers do.
