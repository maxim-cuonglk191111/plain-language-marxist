    text: Preface
    hash: sha256:7a931891ebbb61a7201470a43a8d9ce76bba4d3e147b44af701917422ef5e81f
    state: active
  - id: p00002
    type: heading
    level: 2
    text: The 1872 German Edition
    hash: sha256:bbfb8dc5d19c5de6a309a618babe6a674093a69bba710dceabc351ea2a7973e2
    state: active
  - id: p00003
    type: paragraph
    text: The Communist League, an international association of workers, which could of course be only a secret one, under conditions obtaining at the time, commissioned us, the undersigned, at the Congress held in London in November 1847, to write for publication a detailed theoretical and practical programme for the Party. Such was the origin of the following Manifesto, the manuscript of which travelled to London to be printed a few weeks before the February [French] Revolution [in 1848]. First published in German, it has been republished in that language in at least twelve different editions in Germany, England, and America. It was published in English for the first time in 1850 in the Red Republican, London, translated by Miss Helen Macfarlane, and in 1871 in at least three different translations in America. The French version first appeared in Paris shortly before the June insurrection of 1848, and recently in Le Socialiste of New York. A new translation is in the course of preparation. A Polish version appeared in London shortly after it was first published in Germany. A Russian translation was published in Geneva in the sixties <fn ref="A"/>. Into Danish, too, it was translated shortly after its appearance.
    hash: sha256:db446ef632862800a88df9da51d3f1c98e6d747aeacd0604ea0c3382193f1549
    state: active
  - id: p00004
    type: paragraph
    text: "However much that state of things may have altered during the last twenty-five years, the general principles laid down in the Manifesto are, on the whole, as correct today as ever. Here and there, some detail might be improved. The practical application of the principles will depend, as the Manifesto itself states, everywhere and at all times, on the historical conditions for the time being existing, and, for that reason, no special stress is laid on the revolutionary measures proposed at the end of Section II. That passage would, in many respects, be very differently worded today. In view of the gigantic strides of Modern Industry since 1848, and of the accompanying improved and extended organization of the working class, in view of the practical experience gained, first in the February Revolution, and then, still more, in the Paris Commune, where the proletariat for the first time held political power for two whole months, this programme has in some details been antiquated. One thing especially was proved by the Commune, viz., that “the working class cannot simply lay hold of the ready-made state machinery, and wield it for its own purposes.” (See The Civil War in France: Address of the General Council of the International Working Men’ s Association, 1871, where this point is further developed.) Further, it is self-evident that the criticism of socialist literature is deficient in relation to the present time, because it comes down only to 1847; also that the remarks on the relation of the Communists to the various opposition parties (Section IV), although, in principle still correct, yet in practice are antiquated, because the political situation has been entirely changed, and the progress of history has swept from off the earth the greater portion of the political parties there enumerated."
    hash: sha256:c39d32f085dfbb5794025d43d147e815e346a4851c14e968e3e5c30a6bea0295
    state: active
  - id: p00005
    type: paragraph
    text: But then, the Manifesto has become a historical document which we have no longer any right to alter. A subsequent edition may perhaps appear with an introduction bridging the gap from 1847 to the present day; but this reprint was too unexpected to leave us time for that.
    hash: sha256:bd8f7e5f0f4784cb3954f5b65f51aee2b24a01fdfdb0ab78b461322d14c9d49b
    state: active
  - id: p00006
    type: paragraph
    text: Karl Marx &amp; Frederick Engels<br/>June 24, 1872, London
    hash: sha256:a5ddda3ab54ab12a5fc8ea51333be6f021a97924e9ce0c3307e923b211ff9a92
    state: active
  - id: p00007
    type: heading
    level: 2
    text: The 1882 Russian Edition
    hash: sha256:4e29354b86532bc4b0beac1dcbaa4bbfe9f6b390f86b6b39a5e809a6da0a05fd
    state: active
  - id: p00008
    type: paragraph
    text: The first Russian edition of the Manifesto of the Communist Party, translated by Bakunin <fn ref="A"/>, was published early in the ’sixties by the printing office of the Kolokol [reference to the Free Russian Printing House]. Then the West could see in it (the Russian edition of the Manifesto) only a literary curiosity. Such a view would be impossible today.
    hash: sha256:eaba2c78c1bd6a62fd663ff72c4176f0690dd079f2a40e1e1036b93e182d876b
    state: active
  - id: p00009
    type: paragraph
    text: "What a limited field the proletarian movement occupied at that time (December 1847) is most clearly shown by the last section: the position of the Communists in relation to the various opposition parties in various countries. Precisely Russia and the United States are missing here. It was the time when Russia constituted the last great reserve of all European reaction, when the United States absorbed the surplus proletarian forces of Europe through immigration. Both countries provided Europe with raw materials and were at the same time markets for the sale of its industrial products. Both were, therefore, in one way of another, pillars of the existing European system."
    hash: sha256:91edfcafaf3ab0dbed6e1f99c3f205925337e49fbc1f9fb679ec741c44a4f3f7
    state: active
  - id: p00010
    type: paragraph
    text: How very different today. Precisely European immigration fitted North American for a gigantic agricultural production, whose competition is shaking the very foundations of European landed property — large and small. At the same time, it enabled the United States to exploit its tremendous industrial resources with an energy and on a scale that must shortly break the industrial monopoly of Western Europe, and especially of England, existing up to now. Both circumstances react in a revolutionary manner upon America itself. Step by step, the small and middle land ownership of the farmers, the basis of the whole political constitution, is succumbing to the competition of giant farms; at the same time, a mass industrial proletariat and a fabulous concentration of capital funds are developing for the first time in the industrial regions.
    hash: sha256:687971cb3908020791ae11a011aaec1f42048f6d5c32e4c0b2fab9885698167f
    state: active
  - id: p00011
    type: paragraph
    text: And now Russia! During the Revolution of 1848-9, not only the European princes, but the European bourgeois as well, found their only salvation from the proletariat just beginning to awaken in Russian intervention. The Tsar was proclaimed the chief of European reaction. Today, he is a prisoner of war of the revolution in Gatchina <fn ref="B"/>, and Russia forms the vanguard of revolutionary action in Europe.
    hash: sha256:5b9f2f19af239ff485b1a355b9b057d5a888b2af1444462328b4e0ab87a1bc6a
    state: active
  - id: p00012
    type: paragraph
    text: "The Communist Manifesto had, as its object, the proclamation of the inevitable impending dissolution of modern bourgeois property. But in Russia we find, face-to-face with the rapidly flowering capitalist swindle and bourgeois property, just beginning to develop, more than half the land owned in common by the peasants. Now the question is: can the Russian obshchina, though greatly undermined, yet a form of primeval common ownership of land, pass directly to the higher form of Communist common ownership? Or, on the contrary, must it first pass through the same process of dissolution such as constitutes the historical evolution of the West?"
    hash: sha256:07117340119683b2e15341cee03ac63d6a3ea55083b55f5c8c5de5c60d4a8e2b
    state: active
  - id: p00013
    type: paragraph
    text: "The only answer to that possible today is this: If the Russian Revolution becomes the signal for a proletarian revolution in the West, so that both complement each other, the present Russian common ownership of land may serve as the starting point for a communist development."
    hash: sha256:cc4ba08d913a9ced9fbcdc1057d39225fc3536e905168326842f63f747a89ca5
    state: active
  - id: p00014
    type: paragraph
    text: Karl Marx &amp; Frederick Engels<br/>January 21, 1882, London
    hash: sha256:214338333ac1f08431feeb26553f965fc5ba3c974c3675453fbbb49ee3af0c3c
    state: active
  - id: p00015
    type: heading
    level: 2
    text: The 1883 German Edition
    hash: sha256:cefe0a9944868fcc3013aaacad2c9e5ac1c532100f87d8ab5577275bf1f02a5e
    state: active
  - id: p00016
    type: paragraph
    text: "The preface to the present edition I must, alas, sign alone. Marx, the man to whom the whole working class of Europe and America owes more than to any one else — rests at Highgate Cemetery and over his grave the first grass is already growing. Since his death [March 14, 1883], there can be even less thought of revising or supplementing the Manifesto. But I consider it all the more necessary again to state the following expressly:"
    hash: sha256:21dd2f16a00497eed96112b1fbaad13ad81c7da532e86f8af1cda571b208b1fe
    state: active
  - id: p00017
    type: paragraph
    text: The basic thought running through the Manifesto — that economic production, and the structure of society of every historical epoch necessarily arising therefrom, constitute the foundation for the political and intellectual history of that epoch; that consequently (ever since the dissolution of the primaeval communal ownership of land) all history has been a history of class struggles, of struggles between exploited and exploiting, between dominated and dominating classes at various stages of social evolution; that this struggle, however, has now reached a stage where the exploited and oppressed class (the proletariat) can no longer emancipate itself from the class which exploits and oppresses it (the bourgeoisie), without at the same time forever freeing the whole of society from exploitation, oppression, class struggles — this basic thought belongs solely and exclusively to Marx. <fn ref="1"/>
    hash: sha256:de6d8f4fa33dfa1b5824d99315d2f1503995b7e1e60f93ce321d01d83b8637be
    state: active
  - id: p00018
    type: paragraph
    text: I have already stated this many times; but precisely now is it necessary that it also stand in front of the Manifesto itself.
    hash: sha256:d65932ebb419107b945b70a613342bf37a30b3e62d06af4c54614fdf63664693
    state: active
  - id: p00019
    type: paragraph
    text: Frederick Engels<br/>June 28, 1883, London
    hash: sha256:6e3efeb0ccd046328bfde2f14505b42e35f7470e2cb60d6e9ccc2eddca2f5fe8
    state: active
  - id: p00020
    type: heading
    level: 2
    text: The 1888 English Edition
    hash: sha256:ed7034c983797fd7f205cdef0242d51518ab5707fdf14a0054164891fc618a41
    state: active
  - id: p00021
    type: paragraph
    text: The Manifesto was published as the platform of the Communist League, a working men’ s association, first exclusively German, later on international, and under the political conditions of the Continent before 1848, unavoidably a secret society. At a Congress of the League, held in November 1847, Marx and Engels were commissioned to prepare a complete theoretical and practical party programme. Drawn up in German, in January 1848, the manuscript was sent to the printer in London a few weeks before the French Revolution of February 24. A French translation was brought out in Paris shortly before the insurrection of June 1848. The first English translation, by Miss Helen Macfarlane, appeared in George Julian Harney’ s <i>Red Republican</i>, London, 1850. A Danish and a Polish edition had also been published.
    hash: sha256:e74cc75d91dd36df1c0ec91d29db14b46cb3e19e2c6ae4e65cee6a5448b82d5d
    state: active
  - id: p00022
    type: paragraph
    text: The defeat of the Parisian insurrection of June 1848 — the first great battle between proletariat and bourgeoisie — drove again into the background, for a time, the social and political aspirations of the European working class. Thenceforth, the struggle for supremacy was, again, as it had been before the Revolution of February, solely between different sections of the propertied class; the working class was reduced to a fight for political elbow-room, and to the position of extreme wing of the middle-class Radicals. Wherever independent proletarian movements continued to show signs of life, they were ruthlessly hunted down. Thus the Prussian police hunted out the Central Board of the Communist League, then located in Cologne. The members were arrested and, after eighteen months’ imprisonment, they were tried in October 1852. This celebrated “Cologne Communist Trial” lasted from October 4 till November 12; seven of the prisoners were sentenced to terms of imprisonment in a fortress, varying from three to six years. Immediately after the sentence, the League was formally dissolved by the remaining members. As to the Manifesto, it seemed henceforth doomed to oblivion.
    hash: sha256:013937f567307a038676b79ad19e89aec21b4c2c1f3d7864c442a33ac0b395e5
    state: active
  - id: p00023
    type: paragraph
    text: When the European workers had recovered sufficient strength for another attack on the ruling classes, the International Working Men’ s Association sprang up. But this association, formed with the express aim of welding into one body the whole militant proletariat of Europe and America, could not at once proclaim the principles laid down in the Manifesto. The International was bound to have a programme broad enough to be acceptable to the English trade unions, to the followers of Proudhon in France, Belgium, Italy, and Spain, and to the Lassalleans in Germany. <fn ref="2"/>
    hash: sha256:5414f2b02f9b19f98a3a4cdd51cebd54f6151172a45a33859a19405621796ada
    state: active
  - id: p00024
    type: paragraph
    text: "Marx, who drew up this programme to the satisfaction of all parties, entirely trusted to the intellectual development of the working class, which was sure to result from combined action and mutual discussion. The very events and vicissitudes in the struggle against capital, the defeats even more than the victories, could not help bringing home to men’ s minds the insufficiency of their various favorite nostrums, and preparing the way for a more complete insight into the true conditions for working-class emancipation. And Marx was right. The International, on its breaking in 1874, left the workers quite different men from what it found them in 1864. Proudhonism in France, Lassalleanism in Germany, were dying out, and even the conservative English trade unions, though most of them had long since severed their connection with the International, were gradually advancing towards that point at which, last year at Swansea, their president [W. Bevan] could say in their name: “Continental socialism has lost its terror for us.” In fact, the principles of the Manifesto had made considerable headway among the working men of all countries."
    hash: sha256:20ca441fac8c3422655de6a7c59eec49ee612d2c9da9daf39dcc1a56ac8045a8
    state: active
  - id: p00025
    type: paragraph
    text: The Manifesto itself came thus to the front again. Since 1850, the German text had been reprinted several times in Switzerland, England, and America. In 1872, it was translated into English in New York, where the translation was published in <i>Woodhull and Claflin’ s Weekly</i>. From this English version, a French one was made in <i>Le Socialiste</i> of New York. Since then, at least two more English translations, more or less mutilated, have been brought out in America, and one of them has been reprinted in England. The first Russian translation, made by Bakunin, was published at Herzen’ s Kolokol office in Geneva, about 1863; a second one, by the heroic Vera Zasulich, also in Geneva, in 1882. A new Danish edition is to be found in <i>Socialdemokratisk Bibliothek</i>, Copenhagen, 1885; a fresh French translation in <i>Le Socialiste</i>, Paris, 1886. From this latter, a Spanish version was prepared and published in Madrid, 1886. The German reprints are not to be counted; there have been twelve altogether at the least. An Armenian translation, which was to be published in Constantinople some months ago, did not see the light, I am told, because the publisher was afraid of bringing out a book with the name of Marx on it, while the translator declined to call it his own production. Of further translations into other languages I have heard but had not seen. Thus the history of the Manifesto reflects the history of the modern working-class movement; at present, it is doubtless the most wide spread, the most international production of all socialist literature, the common platform acknowledged by millions of working men from Siberia to California.
    hash: sha256:60cf0427168e4ea4a5f240d4fffd48ec05ced8ccfc6d022ade9f4117553663e4
    state: active
  - id: p00026
    type: paragraph
    text: 'Yet, when it was written, we could not have called it a <i>socialist</i> manifesto. By Socialists, in 1847, were understood, on the one hand the adherents of the various Utopian systems: Owenites in England, Fourierists in France, [See Robert Owen and François Fourier] both of them already reduced to the position of mere sects, and gradually dying out; on the other hand, the most multifarious social quacks who, by all manner of tinkering, professed to redress, without any danger to capital and profit, all sorts of social grievances, in both cases men outside the working-class movement, and looking rather to the “educated" classes for support. Whatever portion of the working class had become convinced of the insufficiency of mere political revolutions, and had proclaimed the necessity of total social change, called itself Communist. It was a crude, rough-hewn, purely instinctive sort of communism; still, it touched the cardinal point and was powerful enough amongst the working class to produce the Utopian communism of Cabet in France, and of Weitling in Germany. Thus, in 1847, socialism was a middle-class movement, communism a working-class movement. Socialism was, on the Continent at least, “respectable”; communism was the very opposite. And as our notion, from the very beginning, was that “the emancipation of the workers must be the act of the working class itself,” there could be no doubt as to which of the two names we must take. Moreover, we have, ever since, been far from repudiating it.'
    hash: sha256:7753aac5757d6b86895881d9a1bda190205cebb76a69d271cf67fbae1a977db7
    state: active
  - id: p00027
    type: paragraph
    text: "The Manifesto being our joint production, I consider myself bound to state that the fundamental proposition which forms the nucleus belongs to Marx. That proposition is: That in every historical epoch, the prevailing mode of economic production and exchange, and the social organization necessarily following from it, form the basis upon which is built up, and from which alone can be explained the political and intellectual history of that epoch; that consequently the whole history of mankind (since the dissolution of primitive tribal society, holding land in common ownership) has been a history of class struggles, contests between exploiting and exploited, ruling and oppressed classes; That the history of these class struggles forms a series of evolutions in which, nowadays, a stage has been reached where the exploited and oppressed class — the proletariat — cannot attain its emancipation from the sway of the exploiting and ruling class — the bourgeoisie — without, at the same time, and once and for all, emancipating society at large from all exploitation, oppression, class distinction, and class struggles."
    hash: sha256:1e91cae029aba94750ba1eade0c4b4d04bba82bd129e2f1096d419c5dbcda954
    state: active
  - id: p00028
    type: paragraph
    text: This proposition, which, in my opinion, is destined to do for history what Darwin’ s theory has done for biology, we both of us, had been gradually approaching for some years before 1845. How far I had independently progressed towards it is best shown by my Conditions of the Working Class in England. But when I again met Marx at Brussels, in spring 1845, he had it already worked out and put it before me in terms almost as clear as those in which I have stated it here.
    hash: sha256:4cdf8d82e7b8484e5d312de553db6ad6d08faa4d7389b5efb6ac94a487894925
    state: active
  - id: p00029
    type: paragraph
    text: "From our joint preface to the German edition of 1872, I quote the following:"
    hash: sha256:efab5950a6d7919d7cd156238825fabbe3c6e31170d19182a3c0f6c86f916ed5
    state: active
  - id: p00030
    type: blockquote
    text: "“However much that state of things may have altered during the last twenty-five years, the general principles laid down in the Manifesto are, on the whole, as correct today as ever. Here and there, some detail might be improved. The practical application of the principles will depend, as the Manifesto itself states, everywhere and at all times, on the historical conditions for the time being existing, and, for that reason, no special stress is laid on the revolutionary measures proposed at the end of Section II. That passage would, in many respects, be very differently worded today. In view of the gigantic strides of Modern Industry since 1848, and of the accompanying improved and extended organization of the working class, in view of the practical experience gained, first in the February Revolution, and then, still more, in the Paris Commune, where the proletariat for the first time held political power for two whole months, this programme has in some details been antiquated. One thing especially was proved by the Commune, viz., that “the working class cannot simply lay hold of ready-made state machinery, and wield it for its own purposes.” (See The Civil War in France: Address of the General Council of the International Working Men’ s Assocation 1871, where this point is further developed.) Further, it is self-evident that the criticism of socialist literature is deficient in relation to the present time, because it comes down only to 1847; also that the remarks on the relation of the Communists to the various opposition parties (Section IV), although, in principle still correct, yet in practice are antiquated, because the political situation has been entirely changed, and the progress of history has swept from off the Earth the greater portion of the political parties there enumerated."
    hash: sha256:5f5a40f3b1edb341097513ac5d557660389b7fef5cc2a82c951580f9f4f62578
    state: active
  - id: p00031
    type: blockquote
    text: '"But then, the Manifesto has become a historical document which we have no longer any right to alter."'
    hash: sha256:3b69a29a3b24fc03f30b2d8bfeb3544326d6b035e1dcdacd74ef19e7c936b3f4
    state: active
  - id: p00032
    type: paragraph
    text: The present translation is by Mr Samuel Moore, the translator of the greater portion of Marx’ s Capital. We have revised it in common, and I have added a few notes explanatory of historical allusions.
    hash: sha256:0e511945f02c268f76ad51618c1da8708eabf880c2ee52f1815e97957733d207
    state: active
  - id: p00033
    type: paragraph
    text: Frederick Engels<br/>January 30, 1888, London
    hash: sha256:796af3155ae3eac27f23354bf65abb934d4f296956064fc14eafd8d324a5f940
    state: active
  - id: p00034
    type: heading
    level: 2
    text: The 1890 German Edition
    hash: sha256:8156579dc19957d3c0353690c710e44ff497a5af92fa37237c9746d06f07d674
    state: active
  - id: p00035
    type: paragraph
    text: Since [the first German preface (1883)] was written, a new German edition of the Manifesto has again become necessary, and much has also happened to the Manifesto which should be recorded here.
    hash: sha256:8ccd9465a9e34ad8755e284874a3e3e21165f2a52e077727e6ad8ac9436c3ee2
    state: active
  - id: p00036
    type: paragraph
    text: "A second Russian translation — by Vera Zasulich — appeared in Geneva in 1882; the preface to that edition was written by Marx and myself. Unfortunately, the original German manuscript has gone astray; I must therefore retranslate from the Russian which will in no way improve the text. It reads:"
    hash: sha256:1a26056e28bb209a9080cdc26e9bb9df8bd0aaf68f3652dc3584157a8eba2ecb
    state: active
  - id: p00037
    type: blockquote
    text: "[ Reprint of the 1882 Russian Edition ]"
    hash: sha256:71fec34652c24303c344639e59b238ee61fd251c8c3e06e0b6e03f3ed71009a1
    state: active
  - id: p00038
    type: paragraph
    text: "At about the same date, a new Polish version appeared in Geneva: <i>Manifest Kommunistyczny</i>."
    hash: sha256:9d359acd65ccf52ff68db04848925e5dbe8a513bbbccc614b38fde87e818fc38
    state: active
  - id: p00039
    type: paragraph
    text: Furthermore, a new Danish translation has appeared in the <i>Socialdemokratisk Bibliothek</i>, Copenhagen, 1885. Unfortunately, it is not quite complete; certain essential passages, which seem to have presented difficulties to the translator, have been omitted, and, in addition, there are signs of carelessness here and there, which are all the more unpleasantly conspicuous since the translation indicates that had the translator taken a little more pains, he would have done an excellent piece of work.
    hash: sha256:ba9181170e661c819f8030701b1c8729f60a20850e07082f464e94a3d607b075
    state: active
  - id: p00040
    type: paragraph
    text: A new French version appeared in 1886, in <i>Le Socialiste</i> of Paris; it is the best published to date.
    hash: sha256:3e06c3c508cb6c9b1c241f4b5e72d9df6bbdf44b1cf6885c975d4c3972a1296e
    state: active
  - id: p00041
    type: paragraph
    text: "From this latter, a Spanish version was published the same year in <i>El Socialista</i> of Madrid, and then reissued in pamphlet form: <i>Manifesto del Partido Communista</i> por Carlos Marx y F. Engels, Madrid, Administracion de El Socialista, Hernan Cortes 8."
    hash: sha256:392224d2b91f10c4a9c684070010961dce796248740e604a4e7ac7fd9a0ea045
    state: active
  - id: p00042
    type: paragraph
    text: As a matter of curiosity, I may mention that in 1887 the manuscript of an Armenian translation was offered to a publisher in Constantinople. But the good man did not have the courage to publish something bearing the name of Marx and suggested that the translator set down his own name as author, which the latter however declined.
    hash: sha256:c84b97f98de76d63089ae97cb37a0924f5ddb5ef242f668626b2b893b1ff1855
    state: active
  - id: p00043
    type: paragraph
    text: "After one, and then another, of the more or less inaccurate American translations had been repeatedly reprinted in England, an authentic version at last appeared in 1888. This was my friend Samuel Moore, and we went through it together once more before it went to press. It is entitled: <i>Manifesto of the Communist Party</i>, by Karl Marx and Frederick Engels. Authorized English translation, edited and annotated by Frederick Engels, 1888, London, William Reeves, 185 Fleet Street, E.C. I have added some of the notes of that edition to the present one."
    hash: sha256:854bb7f64d8f1baff28465d4907c6ddeaf4dda809a8d8c3b8fe9f3bc4e6e1cbc
    state: active
  - id: p00044
    type: paragraph
    text: The Manifesto has had a history of its own. Greeted with enthusiasm, at the time of its appearance, by the not at all numerous vanguard of scientific socialism (as is proved by the translations mentioned in the first place), it was soon forced into the background by the reaction that began with the defeat of the Paris workers in June 1848, and was finally excommunicated “by law” in the conviction of the Cologne Communists in November 1852. With the disappearance from the public scene of the workers’ movement that had begun with the February Revolution, the Manifesto too passed into the background.
    hash: sha256:b18fe97661c6620b6deae1df5aadaaf6caa8c69f0fba7426f934dc3488075cf1
    state: active
  - id: p00045
    type: paragraph
    text: "When the European workers had again gathered sufficient strength for a new onslaught upon the power of the ruling classes, the International Working Men’ s Association came into being. Its aim was to weld together into <i>one</i> huge army the whole militant working class of Europe and America. Therefore it could not <i>set out</i> from the principles laid down in the Manifesto. It was bound to have a programme which would not shut the door on the English trade unions, the French, Belgian, Italian, and Spanish Proudhonists, and the German Lassalleans. This programme — the considerations underlying the Statutes of the International — was drawn up by Marx with a master hand acknowledged even by the Bakunin and the anarchists. For the ultimate final triumph of the ideas set forth in the Manifesto, Marx relied solely upon the intellectual development of the working class, as it necessarily has to ensue from united action and discussion. The events and vicissitudes in the struggle against capital, the defeats even more than the successes, could not but demonstrate to the fighters the inadequacy of their former universal panaceas, and make their minds more receptive to a thorough understanding of the true conditions for working-class emancipation. And Marx was right. The working class of 1874, at the dissolution of the International, was altogether different from that of 1864, at its foundation. Proudhonism in the Latin countries, and the specific Lassalleanism in Germany, were dying out; and even the ten arch-conservative English trade unions were gradually approaching the point where, in 1887, the chairman of their Swansea Congress could say in their name: “Continental socialism has lost its terror for us.” Yet by 1887 continental socialism was almost exclusively the theory heralded in the Manifesto. Thus, to a certain extent, the history of the Manifesto reflects the history of the modern working-class movement since 1848. At present, it is doubtless the most widely circulated, the most international product of all socialist literature, the common programme of many millions of workers of all countries from Siberia to California."
    hash: sha256:569c45eb9649d521c7c8c63addf4d15196c6cb23949f6d1a3419fc124d9dce92
    state: active
  - id: p00046
    type: paragraph
    text: Nevertheless, when it appeared, we could not have called it a <i>socialist</i> manifesto. In 1847, two kinds of people were considered socialists. On the one hand were the adherents of the various utopian systems, notably the Owenites in England and the Fourierists in France, both of whom, at that date, had already dwindled to mere sects gradually dying out. On the other, the manifold types of social quacks who wanted to eliminate social abuses through their various universal panaceas and all kinds of patch-work, without hurting capital and profit in the least. In both cases, people who stood outside the labor movement and who looked for support rather to the “educated” classes. The section of the working class, however, which demanded a radical reconstruction of society, convinced that mere political revolutions were not enough, then called itself <i>Communist</i>. It was still a rough-hewn, only instinctive and frequently somewhat crude communism. Yet, it was powerful enough to bring into being two systems of utopian communism — in France, the “Icarian” communists of Cabet, and in Germany that of Weitling. Socialism in 1847 signified a bourgeois movement, communism a working-class movement. Socialism was, on the Continent at least, quite respectable, whereas communism was the very opposite. And since we were very decidedly of the opinion as early as then that “the emancipation of the workers must be the task of the working class itself,” [from the General Rules of the International] we could have no hesitation as to which of the two names we should choose. Nor has it ever occurred to us to repudiate it.
    hash: sha256:7a2cf7e0bfb2dc06d8f7641432114719349adf5e4fb4260564d28e98cf74f4c0
    state: active
  - id: p00047
    type: paragraph
    text: "“Working men of all countries, unite!” But few voices responded when we proclaimed these words to the world 42 years ago, on the eve of the first Paris Revolution in which the proletariat came out with the demands of its own. On September 28, 1864, however, the proletarians of most of the Western European countries joined hands in the International Working Men’ s Association of glorious memory. True, the International itself lived only nine years. But that the eternal union of the proletarians of all countries created by it is still alive and lives stronger than ever, there is no better witness than this day. Because today, as I write these lines, the European and American proletariat is reviewing its fighting forces, mobilized for the first time, mobilized as <i>one</i> army, under <i>one</i> flag, for <i>one</i> immediate aim: the standard eight-hour working day to be established by legal enactment, as proclaimed by the Geneva Congress of the International in 1866, and again by the Paris Workers’ Congress of 1889. And today’ s spectacle will open the eyes of the capitalists and landlords of all countries to the fact that today the proletarians of all countries are united indeed."
    hash: sha256:4ff1a12491e553041bbe2584ecb8ae753233117bf1cf796f29bab4eb2517fb3b
    state: active
  - id: p00048
    type: paragraph
    text: If only Marx were still by my side to see this with his own eyes!
    hash: sha256:a680998a632ab228ff5be589d5c201e107d558d371f9685e51a69fff04cc1001
    state: active
  - id: p00049
    type: paragraph
    text: Frederick Engels<br/>May 1, 1890, London
    hash: sha256:330aae3a95a6799a842e7790ba80530030e98225d52b7cb1f4231778fefa8ecd
    state: active
  - id: p00050
    type: heading
    level: 2
    text: The 1892 Polish Edition
    hash: sha256:7ffccbf579489f41d7ff5f40ef0d3014e5da6db09c5163743f12bbd4bf5aedfd
    state: active
  - id: p00051
    type: paragraph
    text: The fact that a new Polish edition of the Communist Manifesto has become necessary gives rise to various thoughts.
    hash: sha256:aa20516d41af41ce6b6c5fc226531ccafd2a39a12b72409fb63c5dad81a77769
    state: active
  - id: p00052
    type: paragraph
    text: First of all, it is noteworthy that of late the Manifesto has become an index, as it were, of the development of large-scale industry on the European continent. In proportion as large-scale industry expands in a given country, the demand grows among the workers of that country for enlightenment regarding their position as the working class in relation to the possessing classes, the socialist movement spreads among them and the demand for the Manifesto increases. Thus, not only the state of the labour movement but also the degree of development of large-scale industry can be measured with fair accuracy in every country by the number of copies of the Manifesto circulated in the language of that country.
    hash: sha256:6a577e3e15a32c030f6f90938d0d0064f2572b005b97dbd028cf2e1724493579
    state: active
  - id: p00053
    type: paragraph
    text: Accordingly, the new Polish edition indicates a decided progress of Polish industry. And there can be no doubt whatever that this progress since the previous edition published ten years ago has actually taken place. Russian Poland, Congress Poland, has become the big industrial region of the Russian Empire. Whereas Russian large-scale industry is scattered sporadically — a part round the Gulf of Finland, another in the centre (Moscow and Vladimir), a third along the coasts of the Black and Azov seas, and still others elsewhere — Polish industry has been packed into a relatively small area and enjoys both the advantages and disadvantages arising from such concentration. The competing Russian manufacturers acknowledged the advantages when they demanded protective tariffs against Poland, in spit of their ardent desire to transform the Poles into Russians. The disadvantages — for the Polish manufacturers and the Russian government — are manifest in the rapid spread of socialist ideas among the Polish workers and in the growing demand for the Manifesto.
    hash: sha256:66fc562c786c2953d2af118452faf2eecc3e15632658ad77f0d7f327189b28d5
    state: active
  - id: p00054
    type: paragraph
    text: But the rapid development of Polish industry, outstripping that of Russia, is in its turn a new proof of the inexhaustible vitality of the Polish people and a new guarantee of its impending national restoration. And the restoration of an independent and strong Poland is a matter which concerns not only the Poles but all of us. A sincere international collaboration of the European nations is possible only if each of these nations is fully autonomous in its own house. The Revolution of 1848, which under the banner of the proletariat, after all, merely let the proletarian fighters do the work of the bourgeoisie, also secured the independence of Italy, Germany and Hungary through its testamentary executors, Louis Bonaparte and Bismarck; but Poland, which since 1792 had done more for the Revolution than all these three together, was left to its own resources when it succumbed in 1863 to a tenfold greater Russian force. The nobility could neither maintain nor regain Polish independence; today, to the bourgeoisie, this independence is, to say the last, immaterial. Nevertheless, it is a necessity for the harmonious collaboration of the European nations. It can be gained only by the young Polish proletariat, and in its hands it is secure. For the workers of all the rest of Europe need the independence of Poland just as much as the Polish workers themselves.
    hash: sha256:a4260bc15f3dc95eab03b98a610cba604ad99a99634c13340c291e466f208426
    state: active
  - id: p00055
    type: paragraph
    text: F. Engels<br/>London, February 10, 1892
    hash: sha256:aff8634268260e8357ab5c40465c42705216390dede9742566560c0205324460
    state: active
  - id: p00056
    type: heading
    level: 2
    text: The 1893 Italian Edition
    hash: sha256:ecd125765c587cfa70d7564f7746143fde06ec18cd7ef87198ec582b37672525
    state: active
  - id: p00057
    type: paragraph
    text: Publication of the Manifesto of the Communist Party coincided, one may say, with March 18, 1848, the day of the revolution in Milan and Berlin, which were armed uprisings of the two nations situated in the centre, the one, of the continent of Europe, the other, of the Mediterranean; two nations until then enfeebled by division and internal strife, and thus fallen under foreign domination. While Italy was subject to the Emperor of Austria, Germany underwent the yoke, not less effective though more indirect, of the Tsar of all the Russias. The consequences of March 18, 1848, freed both Italy and Germany from this disgrace; if from 1848 to 1871 these two great nations were reconstituted and somehow again put on their own, it was as Karl Marx used to say, because the men who suppressed the Revolution of 1848 were, nevertheless, its testamentary executors in spite of themselves.
    hash: sha256:75a4e21a5363d2ad47b8e6c8de82de9d95d8468ff2f555477caa0ab4fbdfe955
    state: active
  - id: p00058
    type: paragraph
    text: "Everywhere that revolution was the work of the working class; it was the latter that built the barricades and paid with its lifeblood. Only the Paris workers, in overthrowing the government, had the very definite intention of overthrowing the bourgeois regime. But conscious though they were of the fatal antagonism existing between their own class and the bourgeoisie, still, neither the economic progress of the country nor the intellectual development of the mass of French workers had as yet reached the stage which would have made a social reconstruction possible. In the final analysis, therefore, the fruits of the revolution were reaped by the capitalist class. In the other countries, in Italy, in Germany, in Austria, the workers, from the very outset, did nothing but raise the bourgeoisie to power. But in any country the rule of the bourgeoisie is impossible without national independence Therefore, the Revolution of 1848 had to bring in its train the unity and autonomy of the nations that had lacked them up to then: Italy, Germany, Hungary. Poland will follow in turn."
    hash: sha256:c0abebb545fd218fada6c7bdc078368be81f8503f2ff877f3460fb2bbff68afa
    state: active
  - id: p00059
    type: paragraph
    text: Thus, if the Revolution of 1848 was not a socialist revolution, it paved the way, prepared the ground for the latter. Through the impetus given to large-scaled industry in all countries, the bourgeois regime during the last forty-five years has everywhere created a numerous, concentrated and powerful proletariat. It has thus raised, to use the language of the Manifesto, its own grave-diggers. Without restoring autonomy and unity to each nation, it will be impossible to achieve the international union of the proletariat, or the peaceful and intelligent co-operation of these nations toward common aims. Just imagine joint international action by the Italian, Hungarian, German, Polish and Russian workers under the political conditions preceding 1848!
    hash: sha256:813a696d9357ab3d684fdf20a1e073710f062bd2665cb4e1214141f91ab0e8bd
    state: active
  - id: p00060
    type: paragraph
    text: The battles fought in 1848 were thus not fought in vain. Nor have the forty-five years separating us from that revolutionary epoch passed to no purpose. The fruits are ripening, and all I wish is that the publication of this Italian translation may augur as well for the victory of the Italian proletariat as the publication of the original did for the international revolution.
    hash: sha256:f2007287afded28b298ffd1ebc3c7fecbc8633427df23bafdbce6bd531ba9805
    state: active
  - id: p00061
    type: paragraph
    text: "The Manifesto does full justice to the revolutionary part played by capitalism in the past. The first capitalist nation was Italy. The close of the feudal Middle Ages, and the opening of the modern capitalist era are marked by a colossal figure: an Italian, Dante, both the last poet of the Middle Ages and the first poet of modern times. Today, as in 1300, a new historical era is approaching. Will Italy give us the new Dante, who will mark the hour of birth of this new, proletarian era?"
    hash: sha256:a09b22da2e767a2e2a2c67a7031a2fdbdea8126a858eeefaf1b4f46febeb1bec
    state: active
  - id: p00062
    type: paragraph
    text: Frederick Engels<br/>London, February 1, 1893
    hash: sha256:aac0f977d5ebd80657e29cf69d18932a2ae87d61cc80b828c16538aa90b4cbdc
    state: active
  - id: p00063
    type: footnote
    label: "1"
    text: “This proposition,” I wrote in the preface to the English translation, “which, in my opinion, is destined to do for history what Darwin’ s theory has done for biology, we both of us, had been gradually approaching for some years before 1845. How far I had independently progressed towards it is best shown by my Conditions of the Working Class in England. But when I again met Marx at Brussels, in spring 1845, he had it already worked out and put it before me in terms almost as clear as those in which I have stated it here.” [Note by Engels to the German edition of 1890]
    hash: sha256:3361768d3c396c8124affbd031b4faec4fc9dc82dad32200b3e0f8ce0cf56689
    state: active
  - id: p00064
    type: footnote
    label: "2"
    text: Lassalle personally, to us, always acknowledged himself to be a disciple of Marx, and, as such, stood on the ground of the Manifesto. But in his first public agitation, 1862-1864, he did not go beyond demanding co-operative workshops supported by state credit.
    hash: sha256:2844b2336c71c70106eff205cc155dfd4257880304353e2c03a77bdbf3530514
    state: active
  - id: p00065
    type: footnote
    label: A
    text: The first Russian translation of the Manifesto of the Communist Party was made by Bakunin, who despite being one of Marx and Engels’ most pronounced opponents in the working class movement, saw the great revolutionary importance contained within the Manifesto. Published in Geneva in 1869 (printing it in Russia was impossible due to state censorship), Bakunin’s translation was not completely accurate, and was replaced a decade later by Plekhanov’s translation in 1882, for which both Marx and Engels wrote a preface.
    hash: sha256:fc5d7f85f3ce3230cfb9b305165ad7c75dcfe86b2b5208d1bedf427e3a791c0e
    state: active
  - id: p00066
    type: footnote
    label: B
    text: A reference to the events that occurred in Russia after the assassination, on March, 1, 1881, of Emperor Alexander II by Narodnaya Volya members. Alexander III, his successor, was staying in Gatchina for fear of further terrorism.
    hash: sha256:76fd2ef6fe759ebce4c3b0fdb0d4878889109e0d024992617e2c46a7147bd055
    state: active
