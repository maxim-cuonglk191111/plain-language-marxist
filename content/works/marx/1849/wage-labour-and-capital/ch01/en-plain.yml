    text: |
      We shall try to present this as simply and clearly as possible. We do not assume any knowledge of political economy. We want workers to understand us.

      In Germany, people are remarkably confused about the simplest economic relations. This confusion exists among official defenders of the system, socialist miracle-workers, and unrecognised geniuses. We therefore turn to the consideration of the first problem.
