    text: |
      Above all else, we had to follow the development of the {class-struggle:sg} in our own time. We had to prove from fresh daily facts that defeating the working class in February and March 1848 also defeated its opponents.

      Those opponents included {bourgeoisie:adj} republicans in France, and {bourgeoisie:adj} and peasant classes fighting {feudalism:adj} rule across Europe.

      The victory of the "moderate republic" in France brought down the nations that had responded to the February {revolution:sg} with wars of independence.

      By defeating the {revolution:adj} workers, Europe fell back into its old double slavery, the English-Russian slavery.

      The June fighting in Paris, the fall of Vienna, and the events in Berlin in November 1848 summed up the European {class-struggle:sg} between the {bourgeoisie:sg} and the working class.

      So did the desperate efforts of Poland, Italy, and Hungary, and the starvation of Ireland into submission.

      These events proved that every {revolution:adj} uprising must fail until the {revolution:adj} working class wins, however remote from the {class-struggle:sg} its goal may seem.

      They proved that every social reform must remain a Utopia until {proletariat:adj} {revolution:sg} and {feudalism:adj} counter-{revolution:sg} clash in a world war.

      Belgium and Switzerland were comic pictures in this history. One was the model State of {bourgeoisie:adj} monarchy. The other was the model State of the {bourgeoisie:adj} republic.

      Both are States that flatter themselves that they are free from the {class-struggle:sg} and from European {revolution:sg}.
