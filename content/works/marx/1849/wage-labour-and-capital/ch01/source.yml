  - id: p00002
    type: paragraph
    text: From various quarters we have been reproached for neglecting to portray the economic conditions which form the material basis of the present struggles between classes and nations. With set purpose we have hitherto touched upon these conditions only when they forced themselves upon the surface of the political conflicts.
    hash: sha256:3295d4d9399e492dc1340d741399471e74d477d889c658b44a01a76b1d0a3a47
    state: active
  - id: p00003
    type: paragraph
    text: It was necessary, beyond everything else, to follow the development of the class struggle in the history of our own day, and to prove empirically, by the actual and daily newly created historical material, that with the subjugation of the working class, accomplished in the days of February and March, 1848, the opponents of that class – the bourgeois republicans in France, and the bourgeois and peasant classes who were fighting feudal absolutism throughout the whole continent of Europe – were simultaneously conquered; that the victory of the "moderate republic" in France sounded at the same time the fall of the nations which had responded to the February revolution with heroic wars of independence; and finally that, by the victory over the revolutionary workingmen, Europe fell back into its old double slavery, into the English-Russian slavery. The June conflict in Paris, the fall of Vienna, the tragi-comedy in Berlin in November 1848, the desperate efforts of Poland, Italy, and Hungary, the starvation of Ireland into submission – these were the chief events in which the European class struggle between the bourgeoisie and the working class was summed up, and from which we proved that every revolutionary uprising, however remote from the class struggle its object might appear, must of necessity fail until the revolutionary working class shall have conquered; – that every social reform must remain a Utopia until the proletarian revolution and the feudalistic counter-revolution have been pitted against each other in a world-wide war. In our presentation, as in reality, Belgium and Switzerland were tragicomic caricaturish genre pictures in the great historic tableau; the one the model State of the bourgeois monarchy, the other the model State of the bourgeois republic; both of them, States that flatter themselves to be just as free from the class struggle as from the European revolution.
    hash: sha256:f04f5f24d4fd37adc29589df924859334f1994d44f92b365fcc7614d70f97166
    state: active
  - id: p00004
    type: paragraph
    text: But now, after our readers have seen the class struggle of the year 1848 develop into colossal political proportions, it is time to examine more closely the economic conditions themselves upon which is founded the existence of the capitalist class and its class rule, as well as the slavery of the workers.
    hash: sha256:07a473d6e31de088a9b0513e4b8edcf56c731234f3abd1624e1da7e24e25ad17
    state: active
  - id: p00005
    type: paragraph
    text: "We shall present the subject in three great divisions:"
    hash: sha256:8717235998ba11544237731a52a3cde8a5ec75e24b4b8cd138f74ffe528a9d9c
    state: active
  - id: p00006
    type: paragraph
    text: <indent level="1"/>The Relation of Wage-labour to Capital, the Slavery of the Worker, the Rule of the Capitalist.
    hash: sha256:747602e4effc299bc867fda9ca361500fdb2b8a37f9e504f194dbda7a8ae7ed7
    state: active
  - id: p00007
    type: paragraph
    text: <indent level="1"/>The Inevitable Ruin of the Middle Classes [petty-bourgeois] and the so-called Commons [peasants] under the present system.
    hash: sha256:52972ba53af87493d7e35709af817aea9fb13c44f025f2c4163a10b068e9624a
    state: active
  - id: p00008
    type: paragraph
    text: <indent level="1"/>The Commercial Subjugation and Exploitation of the Bourgeois classes of the various European nations by the Despot of the World Market – England.
    hash: sha256:614e4094394c325319e8d35eaeec8e9a8987092186ee596fd3816e5cb3ec5470
    state: active
  - id: p00009
    type: paragraph
    text: We shall seek to portray this as simply and popularly as possible, and shall not presuppose a knowledge of even the most elementary notions of political economy. We wish to be understood by the workers. And, moreover, there prevails in Germany the most remarkable ignorance and confusion of ideas in regard to the simplest economic relations, from the patented defenders of existing conditions, down to the socialist wonder-workers and the unrecognized political geniuses, in which divided Germany is even richer than in duodecimo princelings. We therefore proceed to the consideration of the first problem.
    hash: sha256:f340cd7cf3f88838b55525913249446362d41d140f15899335867a85534d8c94
    state: active
