passages:
  - id: p00001
    type: heading
    level: 3
    text: Relation of Wage-Labour to Capital
    hash: sha256:d473f308e0f3215361920f2a6c49649028057a85393f8bba67654a42d9ec036b
    state: active
  - id: p00002
    type: paragraph
    text: What is it that takes place in the exchange between the capitalist and the wage-labourer?
    hash: sha256:674c87b9bba9b99c5474ea6b0167e7976e57c0c3af52289ce5c9b695684310ff
    state: active
  - id: p00003
    type: paragraph
    text: The labourer receives means of subsistence in exchange for his labour-power; the capitalist receives, in exchange for his means of subsistence, labour, the productive activity of the labourer, the creative force by which the worker not only replaces what he consumes, but also gives to the accumulated labour a greater value than it previously possessed. The labourer gets from the capitalist a portion of the existing means of subsistence. For what purpose do these means of subsistence serve him? For immediate consumption. But as soon as I consume means of subsistence, they are irrevocably lost to me, unless I employ the time during which these means sustain my life in producing new means of subsistence, in creating by my labour new values in place of the values lost in consumption. But it is just this noble reproductive power that the labourer surrenders to the capitalist in exchange for means of subsistence received. Consequently, he has lost it for himself.
    hash: sha256:72bbd3349e86dc24e9d2cbd92a88e387bf2991095f3dacc4a8eb427a209aedca
    state: active
  - id: p00004
    type: paragraph
    text: Let us take an example. For one shilling a labourer works all day long in the fields of a farmer, to whom he thus secures a return of two shillings. The farmer not only receives the replaced value which he has given to the day labourer, he has doubled it. Therefore, he has consumed the one shilling that he gave to the day labourer in a fruitful, productive manner. For the one shilling he has bought the labour-power of the day-labourer, which creates products of the soil of twice the value, and out of one shilling makes two. The day-labourer, on the contrary, receives in the place of his productive force, whose results he has just surrendered to the farmer, one shilling, which he exchanges for means of subsistence, which he consumes more or less quickly. The one shilling has therefore been consumed in a double manner – reproductively for the capitalist, for it has been exchanged for labour-power, which brought forth two shillings; unproductively for the worker, for it has been exchanged for means of subsistence which are lost for ever, and whose value he can obtain again only by repeating the same exchange with the farmer. Capital therefore presupposes wage-labour; wage-labour presupposes capital. They condition each other; each brings the other into existence.
    hash: sha256:9658bcfa0578313002b794e1458b60ebc4584836bae20ab6767fd61c161453bc
    state: active
  - id: p00005
    type: paragraph
    text: Does a worker in a cotton factory produce only cotton? No. He produces capital. He produces values which serve anew to command his work and to create by means of it new values.
    hash: sha256:99f2808c2b93309743df207ec5fa4735a6de0871d10b4e5ff323f424a39ba007
    state: active
  - id: p00006
    type: paragraph
    text: Capital can multiply itself only by exchanging itself for labour-power, by calling wage-labour into life. The labour-power of the wage-labourer can exchange itself for capital only by increasing capital, by strengthening that very power whose slave it is. Increase of capital, therefore, is increase of the proletariat, i.e., of the working class.
    hash: sha256:cdce8d901230aafb3606bb91d86069fb1febe04b557b66764cdd19245d8acb4a
    state: active
  - id: p00007
    type: paragraph
    text: And so, the bourgeoisie and its economists maintain that the interest of the capitalist and of the labourer is the same. And in fact, so they are! The worker perishes if capital does not keep him busy. Capital perishes if it does not exploit labour-power, which, in order to exploit, it must buy. The more quickly the capital destined for production – the productive capital – increases, the more prosperous industry is, the more the bourgeoisie enriches itself, the better business gets, so many more workers does the capitalist need, so much the dearer does the worker sell himself. The fastest possible growth of productive capital is, therefore, the indispensable condition for a tolerable life to the labourer.
    hash: sha256:0a224b828a9faa8bd0c74859c12de269416979b9aeb0ffd3bb3c458e6ce6f9a7
    state: active
  - id: p00008
    type: paragraph
    text: But what is growth of productive capital? Growth of the power of accumulated labour over living labour; growth of the rule of the bourgeoisie over the working class. When wage-labour produces the alien wealth dominating it, the power hostile to it, capital, there flow back to it its means of employment – i.e., its means of subsistence, under the condition that it again become a part of capital, that is become again the lever whereby capital is to be forced into an accelerated expansive movement.
    hash: sha256:5ac3618a1addd856566aec74af17b748fdaf4d18c4ebbd4954de5fc2fa2cd362
    state: active
  - id: p00009
    type: paragraph
    text: "To say that the interests of capital and the interests of the workers are identical, signifies only this: that capital and wage-labour are two sides of one and the same relation. The one conditions the other in the same way that the usurer and the borrower condition each other."
    hash: sha256:faf59713c78d5a9a79c82c93500d05a7e2fc77c8c0a1a8778975b6095ff0020e
    state: active
  - id: p00010
    type: paragraph
    text: As long as the wage-labourer remains a wage-labourer, his lot is dependent upon capital. That is what the boasted community of interests between worker and capitalists amounts to.
    hash: sha256:e39c04ac66a06a2dce3510f94999660af2812c85171a9e2b40d2e20e84522840
    state: active
  - id: p00011
    type: paragraph
    text: If capital grows, the mass of wage-labour grows, the number of wage-workers increases; in a word, the sway of capital extends over a greater mass of individuals.
    hash: sha256:e9e03ef3734437d028e8dfe5996101175437f5611f154ba36d1edf697c2496ec
    state: active
  - id: p00012
    type: paragraph
    text: "Let us suppose the most favorable case: if productive capital grows, the demand for labour grows. It therefore increases the price of labour-power, wages."
    hash: sha256:adc7788341f3a187184d201dd34fe409ef79e723b75a7ec2247dbb17bcf791aa
    state: active
  - id: p00013
    type: paragraph
    text: A house may be large or small; as long as the neighboring houses are likewise small, it satisfies all social requirement for a residence. But let there arise next to the little house a palace, and the little house shrinks to a hut. The little house now makes it clear that its inmate has no social position at all to maintain, or but a very insignificant one; and however high it may shoot up in the course of civilization, if the neighboring palace rises in equal or even in greater measure, the occupant of the relatively little house will always find himself more uncomfortable, more dissatisfied, more cramped within his four walls.
    hash: sha256:d3a477d689dd9d6255abc95c821a7f4d5e86f20b394e7b102563e7931f2fb58e
    state: active
  - id: p00014
    type: paragraph
    text: An appreciable rise in wages presupposes a rapid growth of productive capital. Rapid growth of productive capital calls forth just as rapid a growth of wealth, of luxury, of social needs and social pleasures. Therefore, although the pleasures of the labourer have increased, the social gratification which they afford has fallen in comparison with the increased pleasures of the capitalist, which are inaccessible to the worker, in comparison with the stage of development of society in general. Our wants and pleasures have their origin in society; we therefore measure them in relation to society; we do not measure them in relation to the objects which serve for their gratification. Since they are of a social nature, they are of a relative nature.
    hash: sha256:639c5144165fdc860632e5bd16a66db728236998f73de155480f4df5ae5f0490
    state: active
  - id: p00015
    type: paragraph
    text: But wages are not at all determined merely by the sum of commodities for which they may be exchanged. Other factors enter into the problem. What the workers directly receive for their labour-power is a certain sum of money. Are wages determined merely by this money price?
    hash: sha256:356412c08b2b64b9e65b6584d922a27bd9d9c812650369379b1d58228b4da28c
    state: active
  - id: p00016
    type: paragraph
    text: In the 16th century, the gold and silver circulation in Europe increased in consequence of the discovery of richer and more easily worked mines in America. The value of gold and silver, therefore, fell in relation to other commodities. The workers received the same amount of coined silver for their labour-power as before. The money price of their work remained the same, and yet their wages had fallen, for in exchange for the same amount of silver they obtained a smaller amount of other commodities. This was one of the circumstances which furthered the growth of capital, the rise of the bourgeoisie, in the 18th century.
    hash: sha256:375ae72e970d8e692ae5fd7bebcb673cb41b389a88ab7b2af0273fc1acce37ed
    state: active
  - id: p00017
    type: paragraph
    text: Let us take another case. In the winter of 1847, in consequence of bad harvest, the most indispensable means of subsistence – grains, meat, butter, cheese, etc. – rose greatly in price. Let us suppose that the workers still received the same sum of money for their labour-power as before. Did not their wages fall? To be sure. For the same money they received in exchange less bread, meat, etc. Their wages fell, not because the value of silver was less, but because the value of the means of subsistence had increased.
    hash: sha256:b44d9d164e65ca9a9a254bb524430a0156bb6ad19da0329475d077e810020f71
    state: active
  - id: p00018
    type: paragraph
    text: Finally, let us suppose that the money price of labour-power remained the same, while all agricultural and manufactured commodities had fallen in price because of the employment of new machines, of favorable seasons, etc. For the same money the workers could now buy more commodities of all kinds. Their wages have therefore risen, just because their money value has not changed.
    hash: sha256:dced386cd163e39e1d5565d593d7a744c8820e5b7e3f3e6d66a02df9382cfcac
    state: active
  - id: p00019
    type: paragraph
    text: The money price of labour-power, the nominal wages, do not therefore coincide with the actual or real wages – i.e., with the amount of commodities which are actually given in exchange for the wages. If then we speak of a rise or fall of wages, we have to keep in mind not only the money price of labour-power, the nominal wages, but also the real wages.
    hash: sha256:ac90860c570009cc69f7429b38223da0f6d94035f983013d9d38ffdf7afd52b3
    state: active
  - id: p00020
    type: paragraph
    text: But neither the nominal wages – i.e., the amount of money for which the labourer sells himself to the capitalist – nor the real wages – i.e., the amount of commodities which he can buy for this money – exhausts the relations which are comprehended in the term wages.
    hash: sha256:ec005b3455e7fcb03d116017e95b4f43ceda48d431a5073ec2151095ace2803b
    state: active
  - id: p00021
    type: paragraph
    text: Wages are determined above all by their relations to the gain, the profit, of the capitalist. In other words, wages are a proportionate, relative quantity.
    hash: sha256:8d58ff1c521765223e2f4e53c399f1a491030ab65004cb178b94ccf7c9fc64eb
    state: active
  - id: p00022
    type: paragraph
    text: Real wages express the price of labour-power in relation to the price of commodities; relative wages, on the other hand, express the share of immediate labour in the value newly created by it, in relation to the share of it which falls to accumulated labour, to capital.
    hash: sha256:d2b3030444d96072d97a3069aed44f547c6773d2cc1428e39dce15f0fc5da47e
    state: active
