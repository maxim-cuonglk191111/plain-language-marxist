passages:
  - id: p00001
    type: heading
    level: 3
    text: The General Law that Determines the Rise and Fall of Wages and Profits
    hash: sha256:0bd88f076d60cc545e6a4fad9f0d6051dfe89e01fce1c46a53b552c58a4c6b67
    state: active
  - id: p00002
    type: paragraph
    text: 'We have said: "Wages are not a share of the worker in the commodities produced by him. Wages are that part of already existing commodities with which the capitalist buys a certain amount of productive labor-power." But the capitalist must replace these wages out of the price for which he sells the product made by the worker; he must so replace it that, as a rule, there remains to him a surplus above the cost of production expended by him, that is, he must get a profit.'
    hash: sha256:ee82153dfd32ab079ffaf6b3f5b2d4fd0a61bf0f0aa06684c8b9fbb634a0cb00
    state: active
  - id: p00003
    type: paragraph
    text: "The selling price of the commodities produced by the worker is divided, from the point of view of the capitalist, into three parts:"
    hash: sha256:adf35d7769f4631fb0e3406008f5f344920c5a54e6ba8593c89074f36f12e019
    state: active
  - id: p00004
    type: paragraph
    text: <indent level="1"/>First, the replacement of the price of the raw materials advanced by him, in addition to the replacement of the wear and tear of the tools, machines, and other instruments of labor likewise advanced by him;
    hash: sha256:709dc2f8696d3804a10cdbb95ded4adfdd666f00076885a619317203dda7fcb7
    state: active
  - id: p00005
    type: paragraph
    text: <indent level="1"/>Second, the replacement of the wages advanced; and
    hash: sha256:4b5f7178c56095eb8009bbe0b83d66afe49fbd1965a4a2a942751ec34620f86c
    state: active
  - id: p00006
    type: paragraph
    text: <indent level="1"/>Third, the surplus leftover – i.e., the profit of the capitalist.
    hash: sha256:308e01d30ec98b748f63e3ae66c831f931e5e1d79be3d1d85c1e182da5811af3
    state: active
  - id: p00007
    type: paragraph
    text: While the first part merely replaces previously existing values, it is evident that the replacement of the wages and the surplus (the profit of capital) are as a whole taken out of the new value, which is produced by the labor of the worker and added to the raw materials. And in this sense we can view wages as well as profit, for the purpose of comparing them with each other, as shares in the product of the worker.
    hash: sha256:85a6a65b4c9d57d05983d2e8dcf94c8856c0576e19bcc434f01c807f12fedf05
    state: active
  - id: p00008
    type: paragraph
    text: Real wages may remain the same, they may even rise, nevertheless the relative wages may fall. Let us suppose, for instance, that all means of subsistence have fallen 2/3rds in price, while the day's wages have fallen but 1/3rd – for example, from three to two shillings. Although the worker can now get a greater amount of commodities with these two shillings than he formerly did with three shillings, yet his wages have decreased in proportion to the gain of the capitalist. The profit of the capitalist – the manufacturer's for instance – has increased one shilling, which means that for a smaller amount of exchange values, which he pays to the worker, the latter must produce a greater amount of exchange values than before. The share of capitals in proportion to the share of labour has risen. The distribution of social wealth between capital and labour has become still more unequal. The capitalist commands a greater amount of labour with the same capital. The power of the capitalist class over the working class has grown, the social position of the worker has become worse, has been forced down still another degree below that of the capitalist.
    hash: sha256:aabcb107c241dec1ee6505f40eb1e3030ae4eed8ffaeae0a399061ede083a4de
    state: active
  - id: p00009
    type: paragraph
    text: What, then, is the general law that determines the rise and fall of wages and profit in their reciprocal relation?
    hash: sha256:973bd32f6002b4742cf38137d0c98d2d5480fd175832182ed0e8f7af7be7abad
    state: active
  - id: p00010
    type: paragraph
    text: They stand in inverse proportion to each other. The share of (profit) increases in the same proportion in which the share of labour (wages) falls, and vice versa. Profit rises in the same degree in which wages fall; it falls in the same degree in which wages rise.
    hash: sha256:6b0153685307aec8b09df38d0a7b018b612fb3da463c8bb54500f2944c76cebc
    state: active
  - id: p00011
    type: paragraph
    text: It might perhaps be argued that the capitalist class can gain by an advantageous exchange of his products with other capitalists, by a rise in the demand for his commodities, whether in consequence of the opening up of new markets, or in consequence of temporarily increased demands in the old market, and so on; that the profit of the capitalist, therefore, may be multiplied by taking advantage of other capitalists, independently of the rise and fall of wages, of the exchange value of labour-power; or that the profit of the capitalist may also rise through improvements in the instruments of labour, new applications of the forces of nature, and so on.
    hash: sha256:ac184d25b8dc7465ecfb04691d0f1ab27bdc0243842fb69470aa09016672aa9f
    state: active
  - id: p00012
    type: paragraph
    text: But in the first place it must be admitted that the result remains the same, although brought about in an opposite manner. Profit, indeed, has not risen because wages have fallen, but wages have fallen because profit has risen. With the same amount of another man's labour the capitalist has bought a larger amount of exchange values without having paid more for the labour on that account – i.e., the work is paid for less in proportion to the net gain which it yields to the capitalist.
    hash: sha256:5d01e15ad5b023fccab4d7cabc0afcbafd4d2b08c7ed87ced98caf794d1201c7
    state: active
  - id: p00013
    type: paragraph
    text: In the second place, it must be borne in mind that, despite the fluctuations in the prices of commodities, the average price of every commodity, the proportion in which it exchanges for other commodities, is determined by its cost of production. The acts of overreaching and taking advantage of one another within the capitalist ranks necessarily equalize themselves. The improvements of machinery, the new applications of the forces of nature in the service of production, make it possible to produce in a given period of time, with the same amount of labour and capital, a larger amount of products, but in no wise a larger amount of exchange values. If by the use of the spinning-machine I can furnish twice as much yarn in an hour as before its invention – for instance, 100 pounds instead of 50 pounds – in the long run I receive back, in exchange for this 100 pounds no more commodities than I did before for 50; because the cost of production has fallen by 1/2, or because I can furnish double the product at the same cost.
    hash: sha256:a0b363023a953020b27ca79c3b2ac680255574c13e588ccf3d33e20eaeed0d9e
    state: active
  - id: p00014
    type: paragraph
    text: Finally, in whatsoever proportion the capitalist class, whether of one country or of the entire world-market, distribute the net revenue of production among themselves, the total amount of this net revenue always consists exclusively of the amount by which accumulated labour has been increased from the proceeds of direct labour. This whole amount, therefore, grows in the same proportion in which labour augments capital – i.e., in the same proportion in which profit rises as compared with wages.
    hash: sha256:a7cd38560205ab66193ef5d1ce80284d5c0deb7071e30a92c6334e31a6c49755
    state: active
