    text: 3. THE METHOD OF POLITICAL ECONOMY
  p00065:
    covers: [p00065]
    based_on: sha256:0766fb451690005e320080964ec8b2831d9753ebe7ef45d73d67e8e588624477
    revision: 1
    ai_assisted: true
    text: When examining a country in political economy, we begin with its population and its division into classes. We also examine town and country, the sea, branches of production, exports and imports, annual production and consumption, and prices.
  p00066:
    covers: [p00066]
    based_on: sha256:38bdcf5508e17e70d3421300e1114223e287ca86090e180e8f3796ef3755389b
    revision: 1
    ai_assisted: true
    text: |
      It seems right to begin with real and concrete elements, with actual conditions, such as starting with population, the foundation and subject of all social production.

      Yet closer study shows this is wrong. Population is an empty abstraction if we leave out the classes that make it up. These classes are empty words if we do not understand their elements, such as {wage-labour} and {capital}.

      These terms in turn require exchange, the {division-of-labour}, and prices. For instance, {capital} is nothing without {wage-labour}, value, money, and price.

      Starting with population gives only a vague picture of a complex whole. Through analysis, one moves from imaginary concrete concepts to simpler and thinner abstractions, until reaching the simplest definitions.

      From there, one must travel back in the opposite direction until arriving at population again. This time, population is not a vague impression, but a rich totality with many definitions and relations.

      The first path is the historical route taken by early political economy. Seventeenth-century economists began with living reality—population, nations, states—but ended with a few general abstract concepts, like the {division-of-labour}, money, and value.

      Later economic systems began with simple concepts like labour, the {division-of-labour}, need, and {exchange-value}, and advanced to the state, international trade, and the {world-market}.

      This latter approach is the correct scientific method. The concrete is concrete because it combines many definitions, representing the unity of diverse elements.

      In thought, the concrete appears as a result and synthesis, not as the starting point, even though it is the real point of departure in perception and observation.

      The first method reduces rich images to abstract concepts. The second method uses abstract concepts to reproduce the concrete in thought.

      Hegel fell into the illusion of seeing the real world as the result of thought thinking itself, moving by its own power. In truth, moving from the abstract to the concrete is merely the way thought grasps the concrete and reproduces it as a mental concept. It is not how the real world itself develops.

      The simplest economic category, such as {exchange-value}, assumes a population producing under specific conditions, within a family, community, or state. {Exchange-value} can exist only as a one-sided relation within an already existing concrete whole.

      Yet {exchange-value} as an abstract category existed long before modern society. To a philosophical view that treats the thinking mind as the real person and the understood world as the only real world, the development of categories looks like the creation of the world itself.

      The conceptual whole is indeed a product of thinking and understanding. But it does not arise from an independent Idea operating outside observation. It results from working perceptions and images into concepts.

      The concrete subject remains independent and outside the mind. In the theoretical method, society must always remain the real presupposition in our minds.
  p00067:
    covers: [p00067]
    based_on: sha256:de22910cc2de39f54db1926105984fab1ac10e4ad3dd515101ca77c77429ffa5
    revision: 1
    ai_assisted: true
    text: |
      Do these simple categories also have an independent historical or natural existence before the more concrete ones? That depends.

      Hegel correctly begins his philosophy of law with property, the simplest legal relation. Yet no property exists before the family or master-servant relations, which are far more concrete.

      Families and entire tribes exist that have <i>possession</i> but not <i>property</i>. The simpler category represents a relation of simpler tribal communities. In higher societies, it appears as a relatively simple relation in a more advanced society.

      A concrete foundation is always presupposed. An isolated savage may possess something, but that possession is not a legal relation. Possession did not produce the family historically; possession assumes more concrete social relations.

      Simple categories can express relations in an immature society before more complex categories develop, or subordinate relations in a more advanced society.

      Money existed in history long before {capital}, banks, and {wage-labour}. In this sense, the path of abstract thought, rising from simple to complex concepts, corresponds to actual historical development.
  p00068:
    covers: [p00068]
    based_on: sha256:0164df28004f88dd4ea4d1475c6c6f9d2aa2b244230445dbaf975f684bf80879
    revision: 1
    ai_assisted: true
    text: |
      On the other hand, immature societies can possess advanced economic forms, like cooperation and developed {division-of-labour}, without money, as in ancient Peru.

      In Slavic communities, money and exchange were unimportant inside the community and occurred only on borders in trade with outsiders. Exchange does not begin inside the community, but between different communities.

      Although money appeared early, it was dominant in antiquity only among specialized trading nations. Even in Greece and Rome, money reached full development only in periods of social breakdown.

      This simple category did not penetrate all economic relations. For example, payments in goods remained the basis of the Roman Empire, and a fully developed monetary system existed only in the army.

      While a simpler category may exist historically before a concrete one, its full development often occurs only in a complex society, whereas a concrete category may develop fully in a simpler society.
  p00069:
    covers: [p00069]
    based_on: sha256:445911abc9cd52ec37bc2b79cb1376557cb5c49370aff7f28b3457ba7f1bdf3c
    revision: 1
    ai_assisted: true
    text: |
      Labour seems a very simple category. The idea of labour in general is ancient. Yet economically, "labour" in this simple form is as modern as the social relations that created it.

      The Monetary System viewed wealth as an objective thing: money. The Manufacturing or Mercantile System made a great advance by locating wealth in human activity—trade and manufacturing labour. But it still saw wealth as producing money.

      The Physiocrats argued that a specific form of labour—agriculture—creates wealth. They saw wealth not as money, but as products of the earth.
  p00070:
    covers: [p00070]
    based_on: sha256:7b6b6c80bb220faf2c0b824a85676b1c1f508fa7dc44220939d18dc3214661ce
    revision: 1
    ai_assisted: true
    text: |
      Adam Smith made a huge breakthrough by rejecting all limits on wealth-creating activity. For him, it was labour as such—not just manufacturing, trade, or farming, but all labour.

      The general activity that creates wealth implies general objects of wealth: products as such, or past materialized labour. This step was so difficult that Smith occasionally slipped back into Physiocratic views.

      This might seem to be merely finding an abstract word for human work in all societies. That is true in one sense, but not in another.
  p00071:
    covers: [p00071]
    based_on: sha256:80b352becb0140532830c0fb9c977c4001893ddac123afa7e7270b8044b9c9fe
    revision: 1
    ai_assisted: true
    text: |
      Treating specific kinds of work as irrelevant assumes a developed system of different kinds of labour, where no single kind rules all others.

      The most general abstractions arise where real variety is greatest, when one quality is shared by many things and is no longer tied to one special form.

      This abstraction of labour is not just a mental summary. In a society where people move easily from one job to another, the specific kind of work is accidental to them.

      Labour has become a practical means to produce wealth in general, rather than a fixed personal identity. This condition is most advanced in the United States, the most modern form of {bourgeoisie:adj} society.

      Here, the abstract idea of "labour as such" becomes a practical reality. The simplest abstraction, which exists in all eras, becomes fully true in practice only in the most modern society.

      One might say that what is a historical product in the United States is a natural trait among Russians, who can turn their hands to many tasks. But there is a huge difference between {barbarian:pl} adaptable to various tasks and civilized people choosing different occupations. In practice, Russian indifference to specific work was tied to stubborn attachment to traditional tasks, broken only from outside.
  p00072:
    covers: [p00072]
    based_on: sha256:a7ad0b7405ea0f25f6dc29ee55cf716e077b858942546486f7c829dc737d2c53
    revision: 1
    ai_assisted: true
    text: The example of labour shows how even the most abstract categories, despite applying to all eras, are products of historical conditions. They retain full validity only for and within those conditions.
  p00073:
    covers: [p00073]
    based_on: sha256:84ab4e0d3f8419fbec083755cf1445ddf48a4d6d79af0f0bcb5635687b5d7b0b
    revision: 1
    ai_assisted: true
    text: |
      {Bourgeoisie:adj} society is the most developed and complex historical organization of production. The categories that express its relations allow us to understand the structure and {relations-of-production:sg} of earlier societies whose ruins were used to build it.

      Some remnants survive inside {bourgeoisie:adj} society, while other traits that existed only as seeds have developed their full meaning.

      Human anatomy provides a key to ape anatomy. Clues to higher forms in lower species can be understood only after higher forms are known.

      {Bourgeoisie:adj} economy gives a key to the economies of antiquity. But economists fail when they erase historical differences and see {bourgeoisie:adj} relations everywhere. Understanding rent helps us understand feudal tribute and tithes, without treating them as identical.
  p00074:
    covers: [p00074]
    based_on: sha256:7f1e954a513fd1cb0424660ba2dca6f3ce1e0eeb4207cae58de2c0927a05538c
    revision: 1
    ai_assisted: true
    text: |
      Because {bourgeoisie:adj} society is a contradictory form of development, it contains relations from earlier societies in stunted forms or distortions, like communal property.

      The categories of {bourgeoisie:adj} economics apply to other societies only with caution, because older societies contain them in different forms.

      Historical development generally means that the latest form treats earlier ones as steps toward itself, understanding them one-sidedly. A society rarely criticizes itself, unless it sees itself in decline.

      Christianity understood earlier religions only when its own self-criticism began. Likewise, {bourgeoisie:adj} political economy could understand {feudalism:adj}, ancient, and Eastern economies only when {bourgeoisie:adj} society began to criticize itself.

      Its criticism of earlier systems—especially of {feudalism}, which it fought directly—resembled the criticism Christianity leveled against paganism, or Protestantism against Catholicism.
  p00075:
    covers: [p00075]
    based_on: sha256:5b5e12c3c569a307b2c8eeb2306199ad1381ba1d5b866045fcb2942618979f62
    revision: 1
    ai_assisted: true
    text: |
      When studying economic categories, we must remember that modern {bourgeoisie:adj} society is already given in reality and in thought. Categories express conditions of existence of this specific society.

      This guides how material should be organized. For example, it seems natural to begin with rent and landed property, because land is the source of life and agriculture was the first stable form of production.

      Yet nothing could be more mistaken. In every society, a particular branch of production determines the rank and importance of all others.

      Its light tinges all other colours, changing their special features. It is like an atmosphere that determines the weight of everything inside it.

      Among pastoral tribes, land ownership is shaped by grazing, taking communal forms as among the Slavs.

      In societies where agriculture dominates, as in antiquity and {feudalism}, even {manufacture} takes on agricultural traits. {Manufacture} either depends entirely on agriculture, as in early Rome, or copies rural organization in the towns, as in the Middle Ages. In medieval times, even {capital} consisted of traditional tools and kept an agrarian character.

      The reverse happens in {bourgeoisie:adj} society. Agriculture becomes a branch of industry, dominated by {capital}. The same applies to rent.

      Where landed property rules, natural ties dominate. Where {capital} rules, socially evolved elements dominate. Rent cannot be understood without {capital}, but {capital} can be understood without rent.

      {Capital} is the dominant economic power in {bourgeoisie:adj} society. It must be both the starting point and the conclusion, explained before landed property. After studying both separately, their connection must be examined.
  p00076:
    covers: [p00076]
    based_on: sha256:8a0c9a691e782f15887182dfc9a6b693a6c33d4582068c50ab41fe1b72a3a043
    revision: 1
    ai_assisted: true
    text: |
      It would therefore be wrong to present economic categories in the historical order in which they arose. Their sequence is determined by their relation in modern {bourgeoisie:adj} society, which reverses their historical appearance.

      The issue is not their historical order in past societies, nor their sequence as concepts in thought (as Proudhon believed), but their position within modern {bourgeoisie:adj} society.
