    text: |
      In art, certain high points do not correspond to the general development of society or its material foundation. Consider the Greeks compared with modern nations, or Shakespeare.

      Certain art forms, like the epic, can never be produced in their classic form once artistic production as such begins. Important artistic creations are possible only at an early stage of artistic development.

      If this is true for branches of art within art itself, it is not surprising that art as a whole develops unevenly compared to society. The difficulty lies only in stating these contradictions; once examined closely, they are easily explained.
  p00093:
    covers: [p00093]
    based_on: sha256:f625c2aa42b7629c4e8a0a197b8722c7723676a8a45fcb023c11a452b9ab5463
    revision: 1
    ai_assisted: true
    text: |
      Consider Greek art and Shakespeare in relation to our time. Greek mythology was the material and foundation of Greek art.

      Can the Greek view of nature and society survive in an age of spinning machines, railways, locomotives, and electric telegraphs? What is Vulcan compared with modern factories, Jupiter compared with the lightning rod, or Hermes compared with the Credit Mobilier?

      Mythology masters and shapes nature through the imagination; it disappears when humanity wins real control over nature. What happens to the goddess of fame beside Printing House Square?

      Greek art requires Greek mythology—nature and society shaped by the popular imagination. Egyptian mythology could never have produced Greek art. But it requires a society that allows a mythical view of nature, not one that demands imagination free from myth.
  p00094:
    covers: [p00094]
    based_on: sha256:807a4fa7027c9bea800602000e483b6fb03e2a2c2579f3db67c0f010509f6e7b
    revision: 1
    ai_assisted: true
    text: "From another angle: is Achilles possible with gunpowder and bullets? Is the Iliad possible with printing presses and steam printing? Do not singing, storytelling, and the epic muse vanish before the printing press, destroying the conditions for epic poetry?"
  p00095:
    covers: [p00095]
    based_on: sha256:da1ef3eab2416356bc4dbdaf9d23221139403efeecb75c7fa504c6b5da931ef6
    revision: 1
    ai_assisted: true
    text: The difficulty is not understanding why Greek art and epic poetry belong to an early stage of social development. The difficulty is that they still give us aesthetic pleasure and stand as an unattainable standard.
  p00096:
    covers: [p00096]
    based_on: sha256:4573cab1b358e460af86cf906d498296adf67e210f54f0610eaa125f095c9575
    revision: 1
    ai_assisted: true
    text: |
      An adult cannot become a child again without becoming childish. But does not the innocence of the child give him joy, and does he not strive to reproduce the child's truth on a higher level? Does not the child represent the natural truth of its era?

      Why should not humanity's historical childhood, at its most beautiful moment, exert an eternal charm as an era that will never return?

      There are ill-bred children and precocious children. Many ancient peoples were like that. The Greeks were normal children.

      The charm their art holds for us does not contradict the undeveloped society in which it grew. Rather, that charm is inseparable from the fact that the immature social conditions that produced it can never return.
