    text: The idea of national wealth entered seventeenth-century economics as the notion that wealth exists to strengthen the state. Eighteenth-century writers still kept this idea. It was a hypocritical way to proclaim wealth as the goal of the state, while treating the state as a tool for creating wealth.
  p00080:
    covers: [p00080]
