    text: c. Lastly, Exchange and Circulation
  p00060:
    covers: [p00060]
    based_on: sha256:498b8ed458c899ba79cbaf4138c1dcc30793b7c5f0e7e229c14050f682034e1c
    revision: 1
    ai_assisted: true
    text: Circulation is merely a particular phase of exchange, or exchange viewed in its totality.
  p00061:
    covers: [p00061]
    based_on: sha256:295300cfd9a68196d9437eb943ab0569eb51902eccef8a71144de76e266c8516
    revision: 1
    ai_assisted: true
    text: <i>Exchange</i> is simply an intermediate phase between production and distribution on one hand, and consumption on the other. Because distribution is determined by production, and consumption is itself an aspect of production, production also includes exchange as one of its moments.
  p00062:
    covers: [p00062]
    based_on: sha256:85d094965768aed0a3d4e6920af728d9730bf69f7caf8817b3a312bb8138b32f
    revision: 1
    ai_assisted: true
    text: |
      First, the exchange of activities and abilities inside production is a direct and essential part of production.

      Second, the exchange of products needed to complete a finished product for consumption is also part of production. In this sense, exchange is included within the concept of production.

      Third, what people call exchange between dealers is determined entirely by production, both in its structure and as a productive activity.

      Exchange seems to stand apart from production only at the final stage, when finished products are exchanged for direct consumption. But even here:
      1. No exchange is possible without the {division-of-labour}, whether natural or historical.
      2. Private exchange requires private production.
      3. The intensity, spread, and nature of exchange are determined by the development of production, as seen in trade between town and country.

      Every form of exchange is therefore either directly included in production or determined by it.
  p00063:
    covers: [p00063]
    based_on: sha256:ae9d9f864e5b9d52064c4be0345a34033ebf24935b28c1649e7e4be10ce3439b
    revision: 1
    ai_assisted: true
    text: |
      The conclusion is not that production, distribution, exchange, and consumption are identical. Rather, they are parts of a single whole, different aspects of one unit.

      Production is the decisive phase, over its own opposite aspects and over all the other phases. The process always begins again from production.

      Exchange and consumption cannot be decisive, and the same is true of the distribution of products. The distribution of the factors of production, on the other hand, is a phase of production itself.

      A specific {mode-of-production} determines specific forms of consumption, distribution, and exchange, and <i>the specific relations between these different phases</i>.

      Production in <i>the narrow sense</i> is also affected by the other aspects. When the market widens, production grows and becomes more varied. Production changes when distribution changes, such as when {capital} concentrates or when population shifts between town and country. Production is also shaped by consumption needs.

      These various aspects interact constantly, as in any organic whole.
  p00064:
    covers: [p00064]
