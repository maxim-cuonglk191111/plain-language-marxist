    text: |
      6. <i>The uneven development of material production and areas like art.</i> Progress should not be understood in the usual abstract way. Modern art illustrates this. This unevenness is even more visible in social relations, like education and the relation between the United States and Europe.

      The difficult point is how {relations-of-production:sg} as legal relations share in this uneven development, such as Roman civil law in relation to modern production.
