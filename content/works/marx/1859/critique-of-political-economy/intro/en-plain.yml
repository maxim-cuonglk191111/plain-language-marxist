    text: |
      The material should be arranged as follows:
      1. General abstract categories that apply in some degree to all social forms, as explained earlier.
      2. Categories forming the inner structure of {bourgeoisie:adj} society and its main classes: {capital}, {wage-labour}, landed property, and their relations. Town and country. The three great classes and exchange between them. Circulation. The credit system.
      3. The state as the summary of {bourgeoisie:adj} society: its relation to itself, unproductive classes, taxes, national debt, public credit, population, colonies, and emigration.
