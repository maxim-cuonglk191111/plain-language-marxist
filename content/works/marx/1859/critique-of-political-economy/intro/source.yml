  - id: p00002
    type: heading
    level: 4
    text: I. PRODUCTION, CONSUMPTION, DISTRIBUTION, EXCHANGE (CIRCULATION)
    hash: sha256:f206afe3de636dad48c4c1ef5acdf740df23d50db92407c9a03d9133c024fa55
    state: active
  - id: p00003
    type: heading
    level: 5
    text: 1. PRODUCTION
    hash: sha256:f2ca0aa0d9a3cdc550f336e70cf63936b336433e78179c573544defc206506d8
    state: active
  - id: p00004
    type: paragraph
    text: (a) To begin with, the question under discussion is <i>material production</i>.
    hash: sha256:a7329aa40b0ca1dadd91b08e58cd0c8aa1004d2d4136911b4697ef0766e1f9d9
    state: active
  - id: p00005
    type: paragraph
    text: Individuals producing in a society, and hence the socially determined production of individuals, is of course the point of departure. The solitary and isolated hunter or fisherman, who serves Adam Smith and Ricardo as a starting point, is one of the unimaginative fantasies of eighteenth-century romances a la Robinson Crusoe; and despite the assertions of social historians, these by no means signify simply a reaction against over-refinement and reversion to a misconceived natural life. No more is Rousseau's <i>contrat social</i>, which by means of a contract establishes a relationship and connection between subjects that are by nature independent, based on this kind of naturalism. This is an illusion and nothing but the aesthetic illusion of the small and big Robinsonades. It is, on the contrary, the anticipation of “bourgeois society,” which began to evolve in the sixteenth century and in the eighteenth century made giant strides towards maturity. The individual in this society of free competition seems to be rid of natural ties, etc., which made him an appurtenance of a particular, limited aggregation of human beings in previous historical epochs. The prophets of the eighteenth century, on whose shoulders Adam Smith and Ricardo were still wholly standing, envisaged this 18th-century individual – a product of the dissolution of feudal society on the one hand and of the new productive forces evolved since the sixteenth century on the other – as an ideal whose existence belonged to the past. They saw this individual not as an historical result, but as the starting point of history; not as something evolving in the course of history, but posited by nature, because for them this individual was in conformity with nature, in keeping with their idea of human nature. This delusion has been characteristic of every new epoch hitherto. Steuart, who in some respect was in opposition to the eighteenth century and as an aristocrat tended rather to regard things from an historical standpoint, avoided this naive view.
    hash: sha256:1abb1f76e62ce2972ae9f84bf0e473da98b5d07e48221b38969cbd906d219359
    state: active
  - id: p00006
    type: paragraph
    text: "The further back we trace the course of history, the more does the individual, and accordingly also the producing individual, appear to be dependent and to belong to a larger whole. At first, the individual in a still quite natural manner is part of the family and of the tribe which evolves from the family; later he is part of a community, of one of the different forms of the community which arise from the conflict and the merging of tribes. It is not until the eighteenth century that in bourgeois society the various forms of the social texture confront the individual as merely means towards his private ends, as external necessity. But the epoch which produces this standpoint, namely that of the solitary individual, is precisely the epoch of the (as yet) most highly developed social (according to this standpoint, general) relations. Man is a Zoon politikon [political animal] in the most literal sense: he is not only a social animal, but an animal that can be individualised only within society. Production by a solitary individual outside society – a rare event, which might occur when a civilised person who has already absorbed the dynamic social forces is accidentally cast into the wilderness – is just as preposterous as the development of speech without individuals who live <i>together</i> and talk to one another. It is unnecessary to dwell upon this point further. It need not have been mentioned at all, if this inanity, which had rhyme and reason in the works of eighteenth-century writers, were not expressly introduced once more into modern political economy by Bastiat, Carey, Proudhon, etc. It is of course very pleasant for Proudhon, for instance, to be able to explain the origin of an economic relationship – whose historical evolution he does not know – in an historico-philosophical manner by means of mythology; alleging that Adam or Prometheus hit upon the ready-made idea, which was then put into practice, etc. Nothing is more tedious and dull than the fantasies of <i>locus communis</i>."
    hash: sha256:fa91925eb03d5971bd2226af1a3fe1f940256de2ed85491ce4cdde5c08770b77
    state: active
  - id: p00007
    type: paragraph
    text: "Thus when we speak of production, we always have in mind production at a definite stage of social development, production by individuals in a society. It might therefore seem that, in order to speak of production at all, we must either trace the various phases in the historical process of development, or else declare from the very beginning that we are examining <i>one</i> particular historical period, as for instance modern bourgeois production, which is indeed our real subject-matter. All periods of production, however, have certain features in common: they have certain common categories. <i>Production in general</i> is an abstraction, but a sensible abstraction in so far as it actually emphasises and defines the common aspects and thus avoids repetition. Yet this <i>general</i> concept, or the common aspect which has been brought to light by comparison, is itself a multifarious compound comprising divergent categories. Some elements are found in all epochs, others are common to a few epochs. The most modern period and the most ancient period will have (certain) categories in common. Production without them is inconceivable. But although the most highly developed languages have laws and categories in common with the most primitive languages, it is precisely their divergence from these general and common features which constitutes their development. It is necessary to distinguish those definitions which apply to production in general, in order not to over look the essential differences existing despite the unity that follows from the very fact that the subject, mankind, and the object, nature, are the same. For instance, on failure to perceive this fact depends the entire wisdom of modern economists who prove the eternity and harmony of existing social relations. For example, no production is possible without an instrument of production, even if this instrument is simply the hand. It is not possible without past, accumulated labour, even if this labour is only the skill acquired by repeated practice and concentrated in the hand of a savage. Capital is among other things also an instrument of production, and also past, materialised labour. Consequently capital is a universal and eternal relation given by nature that is, provided one omits precisely those specific factors which turn the “instrument of production” or “accumulated labour” into capital. The whole history of the relations of production thus appears, for instance in Carey's writings, as a falsification malevolently brought about by the government."
    hash: sha256:625a337fc645180bd2d35a6d83ece3d050a66ff2c77ca76c89d2194d7df90283
    state: active
  - id: p00008
    type: paragraph
    text: Just as there is no production in general, so also there is no general production. Production is always a <i>particular</i> branch of production – e.g., agriculture, cattle-breeding, manufacture – or it is the <i>totality</i> of production. Political economy, however, is not technology. The relation of the general categories of production at a given social stage to the particular forms of production is to be set forth elsewhere (later).
    hash: sha256:87f5b129115289abccb4cdf583c5adcdf49b073dab6d5c51516ea5fedafdf858
    state: active
  - id: p00009
    type: paragraph
    text: Finally, not only is production particular production, but it is invariably only a definite social corpus, a social subject, that is engaged in a wider or narrower totality of productive spheres. The relation of the academic presentation to the actual process does not belong here either. Production in general. Particular branches of production. Totality of Production.
    hash: sha256:70cc8d0ebdac2acecc09d1f4fc44ddbb8572e320c8ca81b57321ff1b02591653
    state: active
  - id: p00010
    type: paragraph
    text: "It is fashionable to preface economic works with a general part – and it is just this which appears under the heading “Production,” see for instance John Stuart Mill – which deals with the <i>general conditions</i> of all production This general part comprises or purports to comprise:"
    hash: sha256:786bdebdc85682dbc8ac37aaa0cdd5e1d118f7a1c70173458a447c0ef666d94e
    state: active
  - id: p00011
    type: paragraph
    text: 1. The conditions without which production cannot be carried on. This means in fact only that the essential factors required for any kind of production are indicated. But this amounts actually, as we shall see, to a few very simple definitions, which are further expanded into trivial tautologies.
    hash: sha256:8093419622a358fcbf68ffed74b9dd1c7d82776bf3ecbd264f5f45263a98e6e6
    state: active
  - id: p00012
    type: paragraph
    text: 2. The conditions which promote production to a larger or smaller degree, as in the case of Adam Smith's progressive and stagnant state of society. To give this, which in Smith's work has its value as an <i>aperçu</i>, to give it scientific significance, research into the <i>degree of productivity</i> at various periods in the development of individual nations would have to be conducted; strictly speaking, such an investigation lies outside the framework of the subject, those aspects which are however relevant to it ought to be mentioned in connection with the development of competition, accumulation, etc. The answer in its general form amounts to the general statement that an industrial nation achieves its highest productivity when it is altogether at the height of its historical development. (In fact, a nation is at the height of its industrial development so long as, not the gain, but gaining remains its principal aim. In this respect the Yankees are superior to the English.) Or else that for example certain races, formations, climates, natural circumstances, such as maritime position, fertility of the soil, etc., are more conducive to production than others. This again amounts to the tautological statement that the production of wealth grows easier in the measure that its subjective and objective elements become available.
    hash: sha256:6c6576fd0f80c75e84fdca4c294650c657b92a5bdcb8176f376bc3defe63cf5f
    state: active
  - id: p00013
    type: paragraph
    text: "But all this is not really what the economists are concerned about in the general part. It is rather – see for example Mill – that production, as distinct from distribution, etc., is to be presented as governed by eternal natural laws which are independent of history, and at the same time bourgeois relations are clandestinely passed off as irrefutable natural laws of society <i>in abstracto</i>. This is the more or less conscious purpose of the whole procedure. As regards distribution, however, it is said that men have indeed indulged in a certain amount of free choice. Quite apart from the crude separation of production and distribution and their real interconnection, it should be obvious from the outset that, however dissimilar the mode of distribution at the various stages of society may be, it must be possible, just as in the case of production, to emphasise the common aspects, and it must be likewise possible to confuse and efface all historical differences in laws that are <i>common to all mankind</i>. For example, the slave, the serf, the wage-worker, they all receive an amount of food enabling them to exist as a slave, serf or wage-worker. The conqueror who lives on tribute, or the official who lives on taxes, or the landowner who lives on rent, or the monk who lives on alms, or the clergyman who lives on tithes, all receive a portion of the social product which is determined by laws different from those that determine the portion of the slave, and so on. The two principal factors which all economists include in this section are: 1) property and 2) its protection by the judiciary, police, etc. Only a very brief reply is needed:"
    hash: sha256:7ce61b4581520b4d6c8fd81277d5f7455f8f3770c338e2bba4a6fa9f27b7674e
    state: active
  - id: p00014
    type: paragraph
    text: "Regarding 1: production is always appropriation of nature by an individual within and with the help of a definite social organisation. In this context it is tautological to say that property (appropriation) is a condition of production. But it is quite ridiculous to make a leap from this to a distinct form of property, e.g., private property (this is moreover an antithetical form, which similarly presupposes <i>nonproperty</i> as a condition). History has shown, on the contrary, that common property (e.g., among the Indians, Slavs, ancient Celts, etc.) is the original form, and in the shape of communal property it plays a significant role for a long time. The question whether wealth develops faster under this or under that form of property is not yet under discussion at this point. It is tautological however to state that where no form of property exists there can be no production and hence no society either. Appropriation which appropriates nothing is a contradiction in terms."
    hash: sha256:2320e1f3aca6e62fe4419d89bf6b23425b614386307d4c7b3dfbbd847a370e15
    state: active
  - id: p00015
    type: paragraph
    text: "Regarding 2: safeguarding of what has been acquired, etc. If these trivialities are reduced to their real content, they say more than their authors realise, namely that each mode of production produces its specific legal relations, political forms, etc. It is a sign of crudity and lack of comprehension that organically coherent factors are brought into haphazard relation with one another, i.e., into a simple reflex connection. The bourgeois economists have merely in view that production proceeds more smoothly with modern police than, e.g., under club-law. They forget, however, that club-law too is law, and that the law of the stronger, only in a different form, still survives even in their “constitutional State.”"
    hash: sha256:3715d5056b3ad123d682896603b725e7e38d45eefd16c81b0b7b38d15ae87a05
    state: active
  - id: p00016
    type: paragraph
    text: While the social conditions appropriate to a particular stage of production are either still in the course of evolution or already in a state of dissolution, disturbances naturally occur in the process of production, although these may be of varying degree and extent.
    hash: sha256:ecaba19362c4d3c32135d7a0789317eb8422dc4d5afa8c74833f667a450dac0c
    state: active
  - id: p00017
    type: paragraph
    text: "To recapitulate: there are categories which are common to all stages of production and are established by reasoning as general categories; the so-called <i>general conditions</i> of all and any production, however, are nothing but abstract conceptions which do not define any of the actual historical stages of production."
    hash: sha256:403fb766f4012adee9716078823c17400723f025e0b65ff7e6c47bf6c2987e62
    state: active
  - id: p00018
    type: heading
    level: 5
    text: 2. THE GENERAL RELATIONS OF PRODUCTION OF DISTRIBUTION, EXCHANGE AND CONSUMPTION
    hash: sha256:b71b1822f82bfe5b0f7eaea4cc96220c2466fdf407983cd52333347ae5e9effc
    state: active
  - id: p00019
    type: paragraph
    text: Before starting upon a further analysis of production it is necessary to consider the various sections which economists place alongside it.
    hash: sha256:608e26e23d2d56208db0db6cfa75a6e9bec35ddb8a2ecf34edfcf3eab567a73e
    state: active
  - id: p00020
    type: paragraph
    text: "The quite obvious conception is this: – In the process of production members of society appropriate (produce, fashion) natural products in accordance with human requirements; distribution determines the share the individual receives of these products; exchange supplies him with the particular products into which he wants to convert the portion accorded to him as a result of distribution; finally, in consumption the products become objects of use, i.e. they are appropriated by individuals. Production creates articles corresponding to requirements; distribution allocates them according to social laws; exchange in its turn distributes the goods, which have already been allocated, in conformity with individual needs; finally, in consumption the product leaves this social movement, it becomes the direct object and servant of an individual need, which its use satisfies. Production thus appears as the point of departure, consumption as the goal, distribution and exchange as the middle, which has a dual form since, according to the definition, distribution is actuated by society and exchange is actuated by individuals. In production persons acquire an objective aspect, and in consumption' objects acquire a subjective aspect; in distribution it is society which by means of dominant general rules mediates between production and consumption; in exchange this mediation occurs as a result of random decisions of individuals."
    hash: sha256:3e114718a7bf52423d856e356f8d1c0b346055ec39fe13390eeecc1c58b11a40
    state: active
  - id: p00021
    type: paragraph
    text: Distribution determines the proportion (the quantity) of the products accruing to the individual, exchange determines the products in which the individual claims to make up the share assigned to him by distribution.
    hash: sha256:0fa7c03d9c5ed413f903a94070ae490e787f805cf9ba8d853ade936ab9cb8235
    state: active
  - id: p00022
    type: paragraph
    text: Production, distribution, exchange and consumption thus form a proper syllogism; production represents the general, distribution and exchange the particular, and consumption the individual case which sums up the whole. This is indeed a sequence, but a very superficial one. Production is determined by general laws of nature; distribution by random social factors, it may therefore exert a more or less beneficial influence on production; exchange, a formal social movement, lies between these two; and consumption, as the concluding act, which is regarded not only as the final aim but as the ultimate purpose, falls properly outside the sphere of economy, except in so far as it in turn exerts a reciprocal action on the point of departure thus once again initiating the whole process.
    hash: sha256:de913e3da99cf5d793c0648a352247958c858ea6d6d18e30d8cb3a6de76710bd
    state: active
  - id: p00023
    type: paragraph
    text: The opponents of the economists who accuse the latter of crudely separating interconnected elements, either argue from the same standpoint or even from a lower one, no matter whether these opponents come from within or without
    hash: sha256:46d1151e7fddb3165f20c8c2eb495f2a00519320315076d6d965fcddf8d7a727
    state: active
  - id: p00024
    type: paragraph
    text: the domain of political economy. Nothing is more common than the reproach that the economists regard production too much as a goal in itself, and that distribution is equally important. This argument is based on the concept of the economists that distribution is a separate and independent sphere alongside production. Another argument is that the different factors are not considered as a single whole; as though this separation had forced its way from the textbook into real life and not, on the contrary, from real life into the textbooks, and as though it were a question of the dialectical reconciliation of concepts and not of the resolution of actually existing conditions.
    hash: sha256:3620fca7251523b5c89827911237be8861b1f582f42b72fc1670ff00d840d9bf
    state: active
  - id: p00025
    type: heading
    level: 6
    text: a. [Production and Consumption]
    hash: sha256:6946ec134b3c3afa1a4a4a7d821ec817878f5c70320ae32a1fa732b0073e345d
    state: active
  - id: p00026
    type: paragraph
    text: "Production is simultaneously consumption as well. It is consumption in a dual form – subjective and objective consumption. [Firstly] the individual, who develops his abilities producing expends them as well, using them up in the act of production, just as in natural procreation vital energy is consumed. Secondly, it is consumption of the means of production, which are used and used up and in part (as for instance fuel) are broken down into simpler components. It similarly involves consumption of raw material which is absorbed and does not retain its original shape and quality. The act of production itself is thus in all its phases also an act of consumption. The economists concede this. They call productive consumption both production that is simultaneously identical with consumption, and consumption which is directly concurrent with production. The identity of production and consumption amounts to Spinoza's proposition: <i>Determinatio est negatio</i>."
    hash: sha256:5be979c9827ef0278c0b8766d86f3eb73db3a723e73e97f1b832d0595b7e7c92
    state: active
  - id: p00027
    type: paragraph
    text: But this definition of productive consumption is only advanced in order to separate consumption that is identical with production from consumption in the proper sense, which is regarded by contrast as the destructive antithesis of production. Let us therefore consider consumption proper.
    hash: sha256:d7954ab29f21b72dcf351d2ad6b7cfc26fadcdb4fcc3acda924f2ba3a4232a5d
    state: active
  - id: p00028
    type: paragraph
    text: Consumption is simultaneously also production, just as in nature the production of a plant involves the consumption of elemental forces and chemical materials. It is obvious that man produces his own body, e.g., through feeding, one form of consumption. But the same applies to any other kind of consumption which in one way or another contributes to the production of some aspect of man. Hence this is consumptive production. Nevertheless, says political economy, this type of production that is identical with consumption is a second phase arising from the destruction of the first product. In the first type of production the producer assumes an objective aspect, in the second type the objects created by him assume a personal aspect. Hence this consuming production – although it represents a direct unity of production and consumption – is essentially different from production proper. The direct unity, in which production is concurrent with consumption and consumption with production, does not affect their simultaneous duality.
    hash: sha256:b43018334349d18dba5aea448e17fcc25506a7766a25158d7999fab8bd0a9af6
    state: active
  - id: p00029
    type: paragraph
    text: Production is thus at the same time consumption, and consumption is at the same time production. Each is simultaneously its opposite. But an intermediary movement takes place between the two at the same time. Production leads to consumption, for which it provides the material; consumption without production would have no object. But consumption also leads to production by providing for its products the subject for whom they are products. The product only attains its final consummation in consumption. A railway on which no one travels, which is therefore not used up, not consumed, is potentially but not actually a railway. Without production there is no consumption, but without consumption there is no production either, since in that case production would be useless. Consumption produces production in two ways.
    hash: sha256:11b36ca5cb83f145eb41556aa250e6d2950cbe8b8d68a13c928c486e52ae5b35
    state: active
  - id: p00030
    type: paragraph
    text: 1. Because a product becomes a real product only through consumption. For example, a dress becomes really a dress only by being worn, a house which is uninhabited is indeed not really a house; in other words a product as distinct from a simple natural object manifests itself as a product, becomes a product, only in consumption. It is only consumption which, by destroying the product, gives it the finishing touch, for the product is a product, not because it is materialised activity, but only in so far as it is an object for the active subject.
    hash: sha256:68ab8ac0b51da5385303679d131f7aeca7975b22650eab4c557047008c2c6d56
    state: active
  - id: p00031
    type: paragraph
    text: 2. Because consumption creates the need for new production, and therefore provides the conceptual, intrinsically actuating reason for production, which is the pre-condition for production. Consumption furnishes the impulse to produce, and also provides the object which acts as the determining purpose of production. If it is evident that externally production supplies the object of consumption, it is equally evident that consumption <i>posits</i> the object of production as a <i>concept</i>, an internal image, a need, a motive, a purpose. Consumption furnishes the object of production in a form that is still subjective. There is no production without a need, but consumption re-creates the need.
    hash: sha256:a538583ae4588cf47f4ad5ff65eaf85f195efc1a2416a5ec8a0f06221ccd8602
    state: active
  - id: p00032
    type: paragraph
    text: This is matched on the side of production,
    hash: sha256:dc103f154ff772974f8e0934db12c02f989db3e02bfcc612e70bc97a84b035d5
    state: active
  - id: p00033
    type: paragraph
    text: 1. By the fact that production supplies the material, the object of consumption. Consumption without an object is no consumption, in this respect, therefore, production creates, produces consumption.
    hash: sha256:bb05371350a7bfbc584af246d42a51656d4eee7671a3cbb457d2a41b2bebf93c
    state: active
  - id: p00034
    type: paragraph
    text: 2. But production provides not only the object of consumption, it also gives consumption a distinct form, a character, a finish. Just as consumption puts the finishing touch on the product as a product, so production puts the finishing touch to consumption. <i>For one thing</i>, the object is not simply an object in general, but a particular object which must be consumed in a particular way, a way determined by production. Hunger is hunger; but the hunger that is satisfied by cooked meat eaten with knife and fork differs from hunger that devours raw meat with the help of bands, nails and teeth. Production thus produces not only the object of consumption but also the mode of consumption, not only objectively but also subjectively. Production therefore creates the consumer.
    hash: sha256:276acaba4d4a10f804a3a8450325fe5d6287d783e43deb943505ed2e0c7ed2c1
    state: active
  - id: p00035
    type: paragraph
    text: 3. Production not only provides the material to satisfy a need, but it also provides the need for the material. When consumption emerges from its original primitive crudeness and immediacy – and its remaining in that state would be due to the fact that production was still primitively crude – then it is itself as a desire brought about by the object. The need felt for the object is induced by the perception of the object. An <i>objet d'art</i> creates a public that has artistic taste and is able to enjoy beauty – and the same can be said of any other product. Production accordingly produces not only an object for the subject, but also a subject for the object.
    hash: sha256:934f8bc9c9ab8e43546b20da059ce1d10cfdbf55e82eac61ab58e385853c877b
    state: active
  - id: p00036
    type: paragraph
    text: "Hence production produces consumption: 1) by providing the material of consumption; 2) by determining the mode of consumption; 3) by creating in the consumer a need for the objects which it first presents as products. It therefore produces the object of consumption, the mode of consumption and the urge to consume. Similarly, consumption produces the <i>predisposition</i> of the producer by positing him as a purposive requirement."
    hash: sha256:1160c423e2e1ce59aed5ec1eaca44d78dc7cf4b1a556e7a4276db56aba812895
    state: active
  - id: p00037
    type: paragraph
    text: The identity of consumption and production has three aspects
    hash: sha256:e9e1cf80fdbe05e03e151c52bdebc61bdb57b8178bffbe7e158bb3164c8e10ef
    state: active
  - id: p00038
    type: paragraph
    text: "1. <i>Direct identity</i>: Production is consumption and consumption is production. Consumptive production and productive consumption. Economists call both productive consumption, but they still make a distinction. The former figures in their work as reproduction, the latter as productive consumption. All investigations of the former are concerned with productive and unproductive labour, those of the latter with productive and non-productive consumption."
    hash: sha256:f581794ab7ef996764f03c49e806117ffd1baa7dd0f49976784cb0bacc1923b4
    state: active
  - id: p00039
    type: paragraph
    text: 2. Each appears as a means of the other, as being induced by it; this is called their mutual dependence; they are thus brought into mutual relation and appear to be indispensable to each other, but nevertheless remain extrinsic to each other. Production provides the material which is the external object of consumption, consumption provides the need, i.e., the internal object, the purpose of production. There is no consumption without production, and no production without consumption. This proposition appears in various forms in political economy.
    hash: sha256:bb388cd1987b7dbec6f0bfe7885f5643f83d4ee4b7bfef5257e6dd8dbce6c6aa
    state: active
  - id: p00040
    type: paragraph
    text: 3. Production is not only simultaneously consumption, and consumption simultaneously production; nor is production only a means of consumption and consumption the purpose of production – i.e., each provides the other with its object, production supplying the external object of consumption, and consumption the conceptual object of production-in other words, each of them is not only simultaneously the other, and not merely the cause of the other, but each of them by being carried through creates the other, it creates itself as the other. It is only consumption that consummates the process of production, since consumption completes the product as a product by destroying it, by consuming its independent concrete form. Moreover by its need for repetition consumption leads to the perfection of abilities evolved during the first process of production and converts them into skills. Consumption is therefore the concluding act which turns not only the product into a product, but also the producer into a producer. Production, on the other hand, produces consumption by creating a definite mode of consumption, and by providing an incentive to consumption it thereby creates the capability to consume as a requirement.
    hash: sha256:ce8c8022598916955473e51098472d9af735ada0e7d49e5364380df40af93c52
    state: active
  - id: p00041
    type: paragraph
    text: The last kind of identity, which is defined in point 3, has been variously interpreted by economists when discussing the relation of demand and supply, of objects and needs, of needs created by society and natural needs.
    hash: sha256:b1d3db4e6d7895a9b8ff2c334cc307c3ff8c99db9d0bf45684cc5710cdcd9dee
    state: active
  - id: p00042
    type: paragraph
    text: "After this, nothing is simpler for a Hegelian than to assume that production and consumption are identical. And this has been done not only by socialist <i>belletrists</i> but also by prosaic economists, such as Say, in declaring that if one considers a nation – or mankind <i>in abstracto</i> – then its production is its consumption. Storch has shown that this proposition of Say's is wrong, since a nation, for instance, does not consume its entire product, but must also provide means of production, fixed capital, etc. It is moreover wrong to consider society as a single subject, for this is a speculative approach. With regard to one subject, production and consumption appear as phases of a single operation. Only the most essential point is emphasised here, that production and consumption, if considered as activities of one subject or of single individuals, appear in any case as phases of one process whose actual point of departure is production which is accordingly the decisive factor. Consumption, as a necessity and as a need, is itself an intrinsic aspect of productive activity; the latter however is the point where the realisation begins and thus also the decisive phase, the action epitomising the entire process. An individual produces an object and by consuming it returns again to the point of departure: he returns however as a productive individual and an individual who reproduces himself. Consumption is thus a phase of production."
    hash: sha256:b5811611772589cf61743972dc9c9d4c87ec304c7d6f0c77f36aa66d2d1349cb
    state: active
  - id: p00043
    type: paragraph
    text: But in society, the relation of the producer to the product after its completion is extrinsic, and the return of the product to the subject depends on his relations to other individuals. The product does not immediately come into his possession. Its immediate appropriation, moreover, is not his aim, if he produces within society. <i>Distribution</i>, which on the basis of social laws determines the individual's share in the world of products, intervenes between the producer and the products, i.e., between production and consumption.
    hash: sha256:04d97f0f9bbca319e8eb76301f7f61329e9c751a053ac5a5db6aa8d7edd94fc0
    state: active
  - id: p00044
    type: paragraph
    text: Is distribution, therefore, an independent sector alongside and outside production?
    hash: sha256:20208b222d9a7b5fca302e5e3f972bce0fafd78e785139f8d8350eff830b47bd
    state: active
  - id: p00045
    type: heading
    level: 6
    text: b. [Production and Distribution]
    hash: sha256:83b790bf6baf90564690b180448eaf7da30068888a4d9147fb2a8aafea88dc6f
    state: active
  - id: p00046
    type: paragraph
    text: When looking through the ordinary run of economic works, one's attention is attracted forthwith by the fact that everything is mentioned twice, e.g., rent, wages, interest and profit figure under the heading distribution, while under the heading of production land, labour and capital appear as factors of production. As to capital, it is evident from the outset that this is counted twice, first as a factor of production, and secondly as a source of income; i.e., as a determining and determinate form of distribution. Interest and profit appear therefore in production as well, since they are forms in which capital increases and grows, and are thus phases of its production. As forms of distribution, interest and profit presuppose capital as a factor of production. They are forms of distribution whose pre-condition is the existence of capital as a factor of production. They are likewise modes of reproduction of capital.
    hash: sha256:e32392d84f72f491ff262189c618d481fa1cad1d1b9242d6bbf7f0d75aa1592c
    state: active
  - id: p00047
    type: paragraph
    text: Wages represent also wage-labour, which is examined in a different section; the particular function that labour performs as a factor of production in the one case appears as a function of distribution in the other. If labour did not have the distinct form of wage-labour, then its share in the product would not appear as wages, as for instance in slavery. Finally rent – if we take the most advanced form of distribution by which landed property obtains a share in the product-presupposes large-scale landed property (strictly speaking, large-scale agriculture) as a factor of production, and not land in general; just as wages do not presuppose labour in general. The relations and modes of distribution are thus merely the reverse aspect of the factors of production. An individual whose participation in production takes the form of wage-labour will receive a share in the product, the result of production, in the form of wages. The structure of distribution is entirely determined by the structure of production. Distribution itself is a product of production, not only with regard to the content, for only the results of production can be distributed, but also with regard to the form, since the particular mode of men's participation in production determines the specific form of distribution, the form, in which they share in distribution. It is altogether an illusion to speak of land in the section on production, and of rent in the section on distribution, etc.
    hash: sha256:b7b545502eafbd8498a018cca6c05595edfa70c0690da7c0760de33da5f3125b
    state: active
  - id: p00048
    type: paragraph
    text: Economists like Ricardo who are mainly accused of having paid exclusive attention to production, have accordingly regarded distribution as the exclusive subject of political economy, for they have instinctively treated the forms of distribution as the most precise expression in which factors of production manifest themselves in a given society.
    hash: sha256:abccf6341b5d2751455212d9e5bbae3419627a1c6623450ae38bf67ee5c772c7
    state: active
  - id: p00049
    type: paragraph
    text: To the single individual distribution naturally appears as a social law, which determines his position within the framework of production, within which he produces; distribution thus being antecedent to production. An individual who has neither capital nor landed property of his own is dependent on wage-labour from his birth as a consequence of social distribution. But this dependence is itself the result of the existence of capital and landed property as independent factors of production.
    hash: sha256:4aea96e3c5f29e9c385e96cc0db3b50e45a6f38c4d6821bbe499d449fd1ee3b1
    state: active
  - id: p00050
    type: paragraph
    text: When one considers whole societies, still another aspect of distribution appears to be antecedent to production and to determine it, as though it were an ante-economic factor. A conquering nation may divide the land among the conquerors and in this way imposes a distinct mode of distribution and form of landed property, thus determining production. Or it may turn the population into slaves, thus making slave-labour the basis of production. Or in the course of a revolution, a nation may divide large estates into plots, thus altering the character of production in consequence of the new distribution. Or legislation may perpetuate land ownership in certain families, or allocate labour as a hereditary privilege, thus consolidating it into a caste system. In all these cases, and they have all occurred in history, it seems that distribution is not regulated and determined by production but, on the contrary, production by distribution.
    hash: sha256:beae34f64886c164a52f9ab164206dc029fb81bd3d4e1fbd5fdead416f45af24
    state: active
  - id: p00051
    type: paragraph
    text: Distribution according to the most superficial interpretation is distribution of products; it is thus removed further from production and made quasi-independent of it. But before distribution becomes distribution of products, it is (1) distribution of the means of production, and (2) (which is another aspect of the same situation) distribution of the members of society among the various types of production (the subsuming of the individuals under definite relations Of production). It is evident that the distribution of products is merely a result of this distribution, which is comprised in the production process and determines the structure of production. To examine production divorced from this distribution which is a constituent part of it, is obviously idle abstraction; whereas conversely the distribution of products is automatically determined by that distribution which is initially a factor of production. Ricardo, the economist of production <i>par excellence</i>, whose object was the understanding of the distinct social structure of modern production, for this very reason declares that distribution, not production, is the proper subject of contemporary political economy. This is a witness to the banality of those economists who proclaim production as an eternal truth, and confine history to the domain of distribution.
    hash: sha256:22a888932b2fe702e2dc671815a268ab02f7fb1123f25053d6f0948a2ffa84ae
    state: active
  - id: p00052
    type: paragraph
    text: The question as to the relation between that form of distribution that determines production and production itself, belongs obviously to the sphere of production. If it should be said that in this case at least, since production must proceed from a specific distribution of the means of production, distribution is to this extent antecedent to and a prerequisite of production, then the reply would be as follows. Production has indeed its conditions and prerequisites which are constituent elements of it. At the very outset these may have seemed to be naturally evolved. In the course of production, however, they are transformed from naturally evolved factors into historical ones, and although they may appear as natural pre-conditions for any one period, they are the historical result of another period. They are continuously changed by the process of production itself. For example, the employment of machinery led to changes in the distribution of both the means of production and the product. Modern large-scale landed property has been brought about not only by modern trade and modern industry, but also by the application of the latter to agriculture.
    hash: sha256:69f2c12ba223dd2b67d167136cb49dd0856feac71256d769f6c9d2b34fb9192e
    state: active
  - id: p00053
    type: paragraph
    text: "The above-mentioned questions can be ultimately resolved into this: what role do general historical conditions play in production and how is production related to the historical development as a whole? This question clearly belongs to the analysis and discussion of production."
    hash: sha256:8ba3b407bce62243e4dde09a8cc7a8084568e29960c5fd4dd1c32a283a9771f6
    state: active
  - id: p00054
    type: paragraph
    text: In the trivial form, however, in which these questions have been raised above, they can be dealt with quite briefly. Conquests may lead to either of three results. The conquering nation may impose its own mode of production upon the conquered people (this was done, for example, by the English in Ireland during this century, and to some extent in India); or it may refrain from interfering in the old mode of production and be content with tribute (e.g., the Turks and Romans); or interaction may take place between the two, giving rise to a new system as a synthesis (this occurred partly in the Germanic conquests). In any case it is the mode of production – whether that of the conquering nation or of the conquered or the new system brought about by a merging of the two – that determines the new mode of distribution employed. Although the latter appears to be a pre-condition of the new period of production, it is in its turn a result of production, a result not simply occasioned by the historical evolution of production in general, but by a specific historical form of production.
    hash: sha256:02f90d6daf8c600594f4c1e2decc9cfe03dabac2b844da9d5b2354fc15a7695d
    state: active
  - id: p00055
    type: paragraph
    text: The Mongols, for example, who caused devastation in Russia, acted in accordance with their mode of production, cattle-breeding, for which large uninhabited tracts are a fundamental requirement. The Germanic barbarians, whose traditional mode of production was agriculture with the aid of serfs and who lived scattered over the countryside, could the more easily adapt the Roman provinces to their requirements because the concentration of landed property carried out there had already uprooted the older agricultural relations.
    hash: sha256:3b04533c62c97fdce4e5dfdc9572dd3e338b7026b53ea655059646a3004c6d51
    state: active
  - id: p00056
    type: paragraph
    text: It is a long-established view that over certain epochs people lived by plunder. But in order to be able to plunder, there must be something to be plundered, and this implies production. Moreover, the manner of plunder depends itself on the manner of production, e.g., a stock-jobbing nation cannot be robbed in the same way as a nation of cowherds.
    hash: sha256:4ee92febddb74370d68180066e6456ad462aefaa5234e5dbbef7e33947370234
    state: active
  - id: p00057
    type: paragraph
    text: The means of production may be robbed directly in the form of slaves. But in that case it is necessary that the structure of production in the country to which the slave is abducted admits of slave-labour, or (as in South America, etc.) a mode of production appropriate to slave-labour has to be evolved.
    hash: sha256:80f0219951b23ad586b5cffbb3e05794f2d7a29d71968cf5f6fd0851e1899ed5
    state: active
  - id: p00058
    type: paragraph
    text: Laws may perpetuate a particular means of production, e.g., land, in certain families. These laws acquire economic significance only if large-scale landed property is in keeping with the social mode of production, as for instance in Britain. Agriculture was carried on in France on a small scale, despite the existence of large estates, which were therefore parcelled out by the Revolution. But is it possible, e.g., by law, to perpetuate the division of land into small lots? Landed property tends to become concentrated again despite these laws. The influence exercised by laws on the preservation of existing conditions of distribution, and the effect they thereby exert on production has to be examined separately.
    hash: sha256:e8db555ce9a99bbe62bbe1e18c5d25d4904117b19b4b5b9994a2b476d6a07bf6
    state: active
  - id: p00059
    type: heading
    level: 6
    text: c. Lastly, Exchange and Circulation
    hash: sha256:5f320cd814ee733838426ac615ea93994818cb152fcdcea03f7829768a4b310f
    state: active
  - id: p00060
    type: paragraph
    text: Circulation is merely a particular phase of exchange or of exchange regarded in its totality.
    hash: sha256:f10e52b691c62c0b28446fcd36db38f9383fd5e9f836997667ea1e911e0130c0
    state: active
  - id: p00061
    type: paragraph
    text: Since <i>Exchange</i> is simply an intermediate phase between production and distribution, which is determined by production, and consumption; since consumption is moreover itself an aspect of production, the latter obviously comprises also exchange as one of its aspects.
    hash: sha256:97cac59da22542a2c60dbd7a861cefc322360f9b454c1b61595b3c14345bfd78
    state: active
  - id: p00062
    type: paragraph
    text: "Firstly, it is evident that exchange of activities and skills, which takes place in production itself, is a direct and essential part of production. Secondly, the same applies to the exchange of products in so far as this exchange is a means to manufacture the finished product intended for immediate consumption. The action of exchange in this respect is comprised in the concept of production. Thirdly, what is known as exchange between dealer and dealer, both with respect to its organisation and as a productive activity, is entirely determined by production. Exchange appears to exist independently alongside production and detached from it only in the last stage, when the product is exchanged for immediate consumption. But (1) no exchange is possible without division of labour, whether this is naturally evolved or is already the result of an historical process; (2) private exchange presupposes private production; (3) the intensity of exchange, its extent and nature, are determined by the development and structure of production: e.g., exchange between town and country, exchange in the countryside, in the town, etc. All aspects of exchange to this extent appear either to be directly comprised in production, or else determined by it."
    hash: sha256:7b5a0c722550d89d3e5a08d7c7367768c81e0682af9b4e6119172857b2aa0080
    state: active
  - id: p00063
    type: paragraph
    text: The conclusion which follows from this is, not that production, distribution, exchange and consumption are identical, but that they are links of a single whole, different aspects of one unit. Production is the decisive phase, both with regard to the contradictory aspects of production and with regard to the other phases. The process always starts afresh with production. That exchange and consumption cannot be the decisive elements, is obvious; and the same applies to distribution in the sense of distribution of products. Distribution of the factors of production, on the other hand, is itself a phase of production. A distinct mode of production thus determines the specific mode of consumption, distribution, exchange and the <i>specific relations of these different phases to one another.</i> Production in <i>the narrow sense</i>, however, is in its turn also determined by the other aspects. For example, if the market, or the sphere of exchange, expands, then the volume of production grows and tends to become more differentiated. Production also changes in consequence of changes in distribution, e.g., concentration of capital, different distribution of the population in town and countryside, and the like. Production is, finally, determined by the demands of consumption. There is an interaction between the various aspects. Such interaction takes place in any organic entity.
    hash: sha256:028e1915403b404a05d2f50ec466abe640a57ffa4e591119211cd6696e9f761e
    state: active
  - id: p00064
    type: heading
    level: 5
    text: 3. THE METHOD OF POLITICAL ECONOMY
    hash: sha256:6e84c9402a73cc9818988c660a26ff453f7eef24092a77847df94128a985d16c
    state: active
  - id: p00065
    type: paragraph
    text: When examining a given country from the standpoint of political economy, we begin with its population, the division of the population into classes, town and country, the sea, the different branches of production, export and import, annual production and consumption, prices, etc.
    hash: sha256:1439822473913ac3fdc2c0bdf84249f3f362b0e9fa2d7d89d675649e3dd1d244
    state: active
  - id: p00066
    type: paragraph
    text: It would seem to be the proper thing to start with the real and concrete elements, with the actual preconditions, e.g., to start in the sphere of economy with population, which forms the basis and the subject of the whole social process of production. Closer consideration shows, however, that this is wrong. Population is an abstraction if, for instance, one disregards the classes of which it is composed. These classes in turn remain empty terms if one does not know the factors on which they depend, e.g., wage-labour, capital, and so on. These presuppose exchange, division of labour, prices, etc. For example, capital is nothing without wage-labour, without value, money, price, etc. If one were to take population as the point of departure, it would be a very vague notion of a complex whole and through closer definition one would arrive analytically at increasingly simple concepts; from imaginary concrete terms one would move to more and more tenuous abstractions until one reached the most simple definitions. From there it would be necessary to make the journey again in the opposite direction until one arrived once more at the concept of population, which is this time not a vague notion of a whole, but a totality comprising many determinations and relations. The first course is the historical one taken by political economy at its inception. The seventeenth-century economists, for example, always took as their starting point the living organism, the population, the nation, the State, several States, etc., but analysis led them always in the end to the discovery of a few decisive abstract, general relations, such as division of labour, money, and value. When these separate factors were more or less clearly deduced and established, economic systems were evolved which from simple concepts, such as labour, division of labour, demand, exchange-value, advanced to categories like State, international exchange and world market. The latter is obviously the correct scientific method. The concrete concept is concrete because it is a synthesis of many definitions, thus representing the unity of diverse aspects. It appears therefore in reasoning as a summing-up, a result, and not as the starting point, although it is the real point of origin, and thus also the point of origin of perception and imagination. The first procedure attenuates meaningful images to abstract definitions, the second leads from abstract definitions by way of reasoning to the reproduction of the concrete situation. Hegel accordingly conceived the illusory idea that the real world is the result of thinking which causes its own synthesis, its own deepening and its own movement; whereas the method of advancing from the abstract to the concrete is simply the way in which thinking assimilates the concrete and reproduces it as a concrete mental category. This is, however, by no means the process of evolution of the concrete world itself. For example, the simplest economic category, e.g., exchange-value, presupposes population, a population moreover which produces under definite conditions, as well as a distinct kind of family, or community, or State, etc. Exchange-value cannot exist except as an abstract, unilateral relation of an already existing concrete organic whole. But exchange-value as a category leads an antediluvian existence. Thus to consciousness-and this comprises philosophical consciousness – which regards the comprehending mind as the real man, and hence the comprehended world as such as the only real world; to consciousness, therefore, the evolution of categories appears as the actual process of production – which unfortunately is given an impulse from outside – whose result is the world; and this (which is however again a tautological expression) is true in so far as the concrete totality regarded as a conceptual totality, as a mental fact, is indeed a product of thinking, of comprehension; but it is by no means a product of the idea which evolves spontaneously and whose thinking proceeds outside and above perception and imagination, but is the result of the assimilation and transformation of perceptions and images into concepts. The totality as a conceptual entity seen by the intellect is a product of the thinking intellect which assimilates the world in the only way open to it, a way which differs from the artistic, religious and practically intelligent assimilation of this world. The concrete subject remains outside the intellect and independent of it – that is so long as the intellect adopts a purely speculative, purely theoretical attitude. The subject, society, must always be envisaged therefore as the pre-condition of comprehension even when the theoretical method is employed.
    hash: sha256:7dccb3444757541ad9a8b039841d7b9e24016b0628c16a37fd03c9b31a734081
    state: active
  - id: p00067
    type: paragraph
    text: But have not these simple categories also an independent historical or natural existence preceding that of the more concrete ones? This depends. Hegel, for example, correctly takes ownership, the simplest legal relation of the subject, as the point of departure of the philosophy of law. No ownership exists, however, before the family or the relations of master and servant are evolved, and these are much more concrete relations. It would, on the other hand, be correct to say that families and entire tribes exist which have as yet only <i>possessions</i> and not <i>property</i>. The simpler category appears thus as a relation of simple family or tribal communities to property. In societies which have reached a higher stage the category appears as a comparatively simple relation existing in a more advanced community. The concrete substratum underlying the relation of ownership is however always presupposed. One can conceive an individual savage who has possessions; possession in this case, however, is not a legal relation. It is incorrect that in the course of historical development possession gave rise to the family. On the contrary, possession always presupposes this “more concrete legal category.” One may, nevertheless, conclude that the simple categories represent relations or conditions which may reflect the immature concrete situation without as yet positing the more complex relation or condition which is conceptually expressed in the more concrete category; on the other hand, the same category may be retained as a subordinate relation in more developed concrete circumstances. Money may exist and has existed in historical time before capital, banks, wage-labour, etc. came into being. In this respect it can be said, therefore, that the simpler category expresses relations predominating in an immature entity or subordinate relations in a more advanced entity; relations which already existed historically before the entity had developed the aspects expressed in a more concrete category. The procedure of abstract reasoning which advances from the simplest to more complex concepts to that extent conforms to actual historical development.
    hash: sha256:66aeaacedc008fe3982f2eda5e1716bc597f559dae9de610ba3cc8ee2b9fe23c
    state: active
  - id: p00068
    type: paragraph
    text: It is true, on the other hand, that there are certain highly developed, but nevertheless historically immature, social formations which employ some of the most advanced economic forms, e.g., cooperation, developed division of labour, etc., without having developed any money at all, for instance Peru. In Slavonic communities too, money – and its pre-condition, exchange – is of little or no importance within the individual community, but is used on the borders, where commerce with other communities takes place; and it is altogether wrong to assume that exchange within the community is an original constituent element. On the contrary, in the beginning exchange tends to arise in the intercourse of different communities with one another, rather than among members of the same community. Moreover, although money begins to play a considerable role very early and in diverse ways, it is known to have been a dominant factor in antiquity only among nations developed in a particular direction, i.e., merchant nations. Even among the Greeks and Romans, the most advanced nations of antiquity, money reaches its full development, which is presupposed in modern bourgeois society, only in the period of their disintegration. Thus the full potential of this quite simple category does not emerge historically in the most advanced phases of society, and it certainly does not penetrate into all economic relations. For example, taxes in kind and deliveries in kind remained the basis of the Roman empire even at the height of its development; indeed a completely evolved monetary system existed in Rome only in the army, and it never permeated the whole complex of labour. Although the simpler category, therefore, may have existed historically before the more concrete category, its complete intensive and extensive development can nevertheless occur in a complex social formation, whereas the more concrete category may have been fully evolved in a more primitive social formation.
    hash: sha256:e9ee2b6bbcf2dc5f439367c608a495788e722b39d412b44a6bd34b8b8e08c24c
    state: active
  - id: p00069
    type: paragraph
    text: Labour seems to be a very simple category. The notion of labour in this universal form, as labour in general, is also extremely old. Nevertheless “labour” in this simplicity is economically considered just as modern a category as the relations which give rise to this simple abstraction. The Monetary System, for example, still regards wealth quite objectively as a thing existing independently in the shape of money. Compared with this standpoint, it was a substantial advance when the Manufacturing or Mercantile System transferred the source of wealth from the object to the subjective activity – mercantile or industrial labour – but it still considered that only this circumscribed activity itself produced money. In contrast to this system, the Physiocrats assume that a specific form of labour – agriculture – creates wealth, and they see the object no longer in the guise of money, but as a product in general, as the universal result of labour. In accordance with the still circumscribed activity, the product remains a naturally developed product, an agricultural product, a product of the land <i>par excellence</i>.
    hash: sha256:e5e39feec29d50f12fe27fb23d5ca82996aabcd3d4b0308974321afef1c53d5a
    state: active
  - id: p00070
    type: paragraph
    text: "It was an immense advance when Adam Smith rejected all restrictions with regard to the activity that produces wealth – for him it was labour as such, neither manufacturing, nor commercial, nor agricultural labour, but all types of labour. The abstract universality which creates wealth implies also the universality of the objects defined as wealth: they are products as such, or once more labour as such, but in this case past, materialised labour. How difficult and immense a transition this was is demonstrated by the fact that Adam Smith himself occasionally relapses once more into the Physiocratic system. It might seem that in this way merely an abstract expression was found for the simplest and most ancient relation in which human beings act as producers – irrespective of the type of society they live in. This is true in one respect, but not in another."
    hash: sha256:d97a7acab2e46fa6b54852591ed5ec4076290ce5e70f8300f44ab3dbd5ffc378
    state: active
  - id: p00071
    type: paragraph
    text: The fact that the specific kind of labour is irrelevant presupposes a highly developed complex of actually existing kinds of labour, none of which is any more the all-important one. The most general abstractions arise on the whole only when concrete development is most profuse, so that a specific quality is seen to be common to many phenomena, or common to all. Then it is no longer perceived solely in a particular form. This abstraction of labour is, on the other hand, by no means simply the conceptual resultant of a variety of concrete types of labour. The fact that the particular kind of labour employed is immaterial is appropriate to a form of society in which individuals easily pass from one type of labour to another, the particular type of labour being accidental to them and therefore irrelevant. Labour, not only as a category but in reality, has become a means to create wealth in general, and has ceased to be tied as an attribute to a particular individual. This state of affairs is most pronounced in the United States, the most modern form of bourgeois society. The abstract category “labour,” “labour as such,” labour <i>sans phrase</i>, the point of departure of modern economics, thus becomes a practical fact only there. The simplest abstraction, which plays a decisive role in modern political economy, an abstraction which expresses an ancient relation existing in all social formations, nevertheless appears to be actually true in this abstract form only as a category of the most modern society. It might be said that phenomena which are historical products in the United States – e.g., the irrelevance of the particular type of labour – appear to be among the Russians, for instance, naturally developed predispositions. But in the first place, there is an enormous difference between barbarians having a predisposition which makes it possible to employ them in various tasks, and civilised people who apply themselves to various tasks. As regards the Russians, moreover, their indifference to the particular kind of labour performed is in practice matched by their traditional habit of clinging fast to a very definite kind of labour from which they are extricated only by external influences.
    hash: sha256:82dd582f7aa0b3921cd58f59bb4bd141b988e1be4e5d3d118ceb510a09912661
    state: active
  - id: p00072
    type: paragraph
    text: The example of labour strikingly demonstrates how even the most abstract categories, despite their validity in all epochs – precisely because they are abstractions – are equally a product of historical conditions even in the specific form of abstractions, and they retain their full validity only for and within the framework of these conditions.
    hash: sha256:4d5ff3173e2683a45a7df6e424b4c0ad9c514d746c29d325c7172c2b95e958cb
    state: active
  - id: p00073
    type: paragraph
    text: Bourgeois society is the most advanced and complex historical organisation of production. The categories which express its relations, and an understanding of its structure, therefore, provide an insight into the structure and the relations of production of all formerly existing social formations the ruins and component elements of which were used in the creation of bourgeois society. Some of these unassimilated remains are still carried on within bourgeois society, others, however, which previously existed. only in rudimentary form, have been further developed and have attained their full significance, etc. The anatomy of man is a key to the anatomy of the ape. On the other hand, rudiments of more advanced forms in the lower species of animals can only be understood when the more advanced forms are already known. Bourgeois economy thus provides a key to the economy of antiquity, etc. But it is quite impossible (to gain this insight) in the manner of those economists who obliterate all historical differences and who see in all social phenomena only bourgeois phenomena. If one knows rent, it is possible to understand tribute, tithe, etc., but they do not have to be treated as identical.
    hash: sha256:944795764c02405f0bc57e71fa425de3bad588d30eabde3eb5cf2932ff44c0c1
    state: active
  - id: p00074
    type: paragraph
    text: Since bourgeois society is, moreover, only a contradictory form of development, it contains relations of earlier societies often merely in very stunted form or even in the form of travesties, e.g., communal ownership. Thus, although it is true that the categories of bourgeois economy are valid for all other social formations, this has to be taken <i>cum grano salis</i>, for they may contain them in an advanced, stunted, caricatured, etc., form, that is always with substantial differences. What is called historical evolution depends in general on the fact that the latest form regards earlier ones as stages in the development of itself and conceives them always in a one-sided manner, since only rarely and under quite special conditions is a society able to adopt a critical attitude towards itself; in this context we are not of course discussing historical periods which themselves believe that they are periods of decline. The Christian religion was able to contribute to an objective understanding of earlier mythologies only when its self-criticism was to a certain extent prepared, as it were potentially. Similarly, only when the self-criticism of bourgeois society had begun, was bourgeois political economy able to understand the feudal, ancient and oriental economies. In so far as bourgeois political economy did not simply identify itself with the past in a mythological manner, its criticism of earlier economies-especially of the feudal system against which it still had to wage a direct struggle-resembled the criticism that Christianity directed against heathenism, or which Protestantism directed against Catholicism.
    hash: sha256:3b4d608f892eb0c05367770f03d78b2eb164b4d511df8938f803fa7083986310
    state: active
  - id: p00075
    type: paragraph
    text: Just as in general when examining any historical or social science, so also in the case of the development of economic categories is it always necessary to remember that the subject, in this context contemporary bourgeois society, is presupposed both in reality and in the mind, and that therefore categories express forms of existence and conditions of existence – and sometimes merely separate aspects – of this particular society, the subject; thus the category, <i>even from the scientific standpoint</i>, by no means begins at the moment when it is discussed <i>as such</i>. This has to be remembered because it provides important criteria for the arrangement of the material. For example, nothing seems more natural than to begin with rent, i.e., with landed property, since it is associated with the earth, the source of all production and all life, and with agriculture, the first form of production in all societies that have attained a measure of stability. But nothing would be more erroneous. There is in every social formation a particular branch of production which determines the position and importance of all the others, and the relations obtaining in this branch accordingly determine the relations of all other branches as well. It is as though light of a particular hue were cast upon everything, tingeing all other colours and modifying their specific features; or as if a special ether determined the specific gravity of everything found in it. Let us take as an example pastoral tribes. (Tribes living exclusively on hunting or fishing are beyond the boundary line from which real development begins.) A certain type of agricultural activity occurs among them and this determines land ownership. It is communal ownership and retains this form in a larger or smaller measure, according to the degree to which these people maintain their traditions, e.g., communal ownership among the Slavs. Among settled agricultural people-settled already to a large extent-where agriculture predominates as in the societies of antiquity and the feudal period, even manufacture, its structure and the forms of property corresponding thereto, have, in some measure, specifically agrarian features. Manufacture is either completely dependent on agriculture, as in the earlier Roman period, or as in the Middle Ages, it copies in the town and in its conditions the organisation of the countryside. In the Middle Ages even capital – unless it was solely money capital – consisted of the traditional tools, etc., and retained a specifically agrarian character. The reverse takes place in bourgeois society. Agriculture to an increasing extent becomes just a branch of industry and is completely dominated by capital. The same applies to rent. In all forms in which landed property is the decisive factor, natural relations still predominate; in the forms in which the decisive factor is capital, social, historically evolved elements predominate. Rent cannot be understood without capital, but capital can be understood without rent. Capital is the economic power that dominates everything in bourgeois society. It must form both the point of departure and the conclusion and it has to be expounded before landed property. After analysing capital and landed property separately, their interconnection must be examined.
    hash: sha256:addf349ad08b69681ba64325bfbdcecf570f2a97f6d8261b17acc73d6a08fa54
    state: active
  - id: p00076
    type: paragraph
    text: It would be inexpedient and wrong therefore to present the economic categories successively in the order in which they have played the dominant role in history. On the contrary, their order of succession is determined by their mutual relation in modern bourgeois society and this is quite the reverse of what appears to be natural to them or in accordance with the sequence of historical development The point at issue is not the role that various economic relations have played in the succession of various social formations appearing in the course of history; even less is it their sequence “as concepts” (<i>Proudhon</i>) (a nebulous notion of the historical process), but their position within modern bourgeois society.
    hash: sha256:5d25e3b28392bc4c1b109cf90e6707bf97cdc834086290450a8990876db8186a
    state: active
  - id: p00077
    type: paragraph
    text: It is precisely the predominance of agricultural peoples in the ancient world which caused the merchant nations – Phoenicians, Carthaginians – to develop in such purity (abstract precision). For capital in the shape of merchant or money capital appears in that abstract form where capital has not yet become the dominant factor in society. Lombards and Jews occupied the same position with regard to mediaeval agrarian societies.
    hash: sha256:f70f2c17e0a921cc3eea1b47f721f0d9be86856ad433588ea4b9dc5ff2ec8c69
    state: active
  - id: p00078
    type: paragraph
    text: Another example of the various roles which the same categories have played at different stages of society are joint-stock companies, one of the most recent features of bourgeois society; but they arise also in its early period in the form of large privileged commercial companies with rights of monopoly.
    hash: sha256:d8eabfab6c88329d3ab676d94fc16fe812e005741c29f17f74990cee267f6df8
    state: active
  - id: p00079
    type: paragraph
    text: The concept of national wealth finds its way into the works of the economists of the seventeenth century as the notion that wealth is created for the State, whose power, on the other hand, is proportional to this wealth – a notion which to some extent still survives even among eighteenth-century economists. This is still an unintentionally hypocritical manner in which wealth and the production of wealth are proclaimed to be the goal of the modern State, which is regarded merely as a means for producing wealth.
    hash: sha256:6a0215bff3806a5be4cb0f7bd9f8eb9d83337d18b4f7e43bac8dc8d08149bf37
    state: active
  - id: p00080
    type: paragraph
    text: The disposition of material has evidently to be made in such a way that (section) one comprises general abstract definitions, which therefore appertain in some measure to all social formations, but in the sense set forth earlier. Two, the categories which constitute the internal structure of bourgeois society and on which the principal classes are based. Capital, wage-labour, landed property and their relations to one another. Town and country. The three large social classes; exchange between them. Circulation. The (private) credit system. Three, the State as the epitome of bourgeois society. Analysis of its relations to itself. The 44 unproductive” classes. Taxes. National debt. Public credit. Population. Colonies. Emigration. Four, international conditions of production. International division of labour. International exchange. Export and import. Rate of exchange. Five, world market and crises.
    hash: sha256:5f753b4e8d525cf6b0e69199b2e2a1242871bd9e4dd871d07874b639512314eb
    state: active
  - id: p00081
    type: heading
    level: 5
    text: 4. PRODUCTION
    hash: sha256:d779dfde6aa26a379529197067c8f82af16729e3bb30927e485724ffca19696f
    state: active
  - id: p00082
    type: paragraph
    text: <indent level="1"/>Means of Production and Conditions of Production. Conditions of Production and Communication. Political Forms and Forms of Cognition in Relation to the Conditions of Production and Communication. Legal Relations. Family Relations
    hash: sha256:edc0eb0d3f3fe98c932bad678cc2e547956e06789fa62c9c685027eee8346bd6
    state: active
  - id: p00083
    type: paragraph
    text: Notes regarding points which have to be mentioned in this context and should not be forgotten.
    hash: sha256:83b25b5d087a47e4c61eaa983c748970a2aa54e8dcbd950d4d197cb7f8c484da
    state: active
  - id: p00084
    type: paragraph
    text: 1. <i>War</i> develops [certain features] earlier than peace; the way in which as a result of war, and in the armies, etc., certain economic conditions, e.g., wage-labour, machinery, etc., were evolved earlier than within civil society. The relations between productive power and conditions of communication are likewise particularly obvious in the army.
    hash: sha256:12637c7a19cb0d2ec0ca83ef0451600de1b2b7da3ce7a7b834bd38dae50bfe85
    state: active
  - id: p00085
    type: paragraph
    text: 2. <i>The relation of the hitherto existing idealistic historiography to realistic historiography. In particular what is known as history of civilisation</i>, the old history of religion and states. (The various kinds of historiography hitherto existing could also be discussed in this context; the so-called objective, subjective (moral and others), philosophical [historiography].)
    hash: sha256:b4a42bcd13f645a4936ee0e0ed3a747c13ee58a754452282737b0cdba9fb01aa
    state: active
  - id: p00086
    type: paragraph
    text: 3. <i>Secondary and tertiary phenomena</i>, in general <i>derived</i> and <i>transmitted</i>, i.e., non-primary, conditions of production. The influence of international relations.
    hash: sha256:4229e4045f20ae813d76773f6606fedd4e80d912e99a976b61140e329f64a245
    state: active
  - id: p00087
    type: paragraph
    text: 4. <i>Reproaches about the materialism of this conception; relation to naturalistic materialism.</i>
    hash: sha256:f5adeba5c9fedd0c610d59dbdf7cebf1c8e75b457530f09c826008ef97009b97
    state: active
  - id: p00088
    type: paragraph
    text: 5. <i>Dialectics of the concepts productive power (means of production) and relations of production,</i> the limits of <i>this dialectical</i> connection, which does not abolish the real differences, have to be defined.
    hash: sha256:fc49276f88e923cbda061a20044ef8a6495e5d72893d04fec8d6d5aea7f38277
    state: active
  - id: p00089
    type: paragraph
    text: 6. <i>The unequal development of material production and, e.g., that of art.</i> The concept of progress is on the whole not to be understood in the usual abstract form. Modern art, etc. This disproportion is not as important and difficult to grasp as within concrete social relations, e.g., in education. Relations of the United States to Europe. However, the really difficult point to be discussed here is how the relations of production as legal relations take part in this uneven development. For example the relation of Roman civil law (this applies in smaller measure to criminal and constitutional law) to modern production.
    hash: sha256:2c482f80fa2023a3f29b65c61158a0347af49b449430a918461ebb55fd00c295
    state: active
  - id: p00090
    type: paragraph
    text: 7. <i>This conception appears to be an inevitable development</i>. But vindication of chance. How? (Freedom, etc., as well.) (Influence of the means of communication. World history did not always exist; history as world history is a result.)
    hash: sha256:69d2c4c31ad6269cc2895b4c9aad2574933e5a2761b0aeba6e051f86cc814122
    state: active
  - id: p00091
    type: paragraph
    text: 8. <i>The starting point is of course the naturally determined factors</i>; both subjective and objective. Tribes, races, etc.
    hash: sha256:6b7a6e87b69a1b7cbac0a6b09ea23c1371be01ea5a39f36f2d63e45b6ee33e03
    state: active
  - id: p00092
    type: paragraph
    text: As regards art, it is well known that some of its peaks by no means correspond to the general development of society; nor, do they therefore to the material substructure, the skeleton as it were of its organisation. For example the Greeks compared with modern [nations), or else Shakespeare. It is even acknowledged that certain branches of art, e.g., the <i>epos</i>, can no longer be produced in their epoch-making classic form after artistic production as such has begun; in other words that certain important creations within the compass of art are only possible at an early stage in the development of art. If this is the case with regard to different branches of art within the sphere of art itself, it is not so remarkable that this should also be the case with regard to the entire sphere of art and its relation to the general development of society. The difficulty lies only in the general formulation of these contradictions. As soon as they are reduced to specific questions they are already explained.
    hash: sha256:d8a718cb556468fe38cbdbf83f126764184cd13339b9c007335b0a9fdf73f10a
    state: active
  - id: p00093
    type: paragraph
    text: Let us take, for example, the relation of Greek art, and that of Shakespeare, to the present time. We know that Greek mythology is not only the arsenal of Greek art, but also its basis. Is the conception of nature and of social relations which underlies Greek imagination and therefore Greek (art) possible when there are self-acting mules, railways, locomotives and electric telegraphs? What is a Vulcan compared with Roberts and Co., Jupiter compared with the lightning conductor, and Hermes compared with the <i>Credit Mobilier</i>? All mythology subdues, controls and fashions the forces of nature in the imagination and through imagination; it disappears therefore when real control over these forces is established. What becomes of Fama side by side with Printing House Square? Greek art presupposes Greek mythology, in other words that natural and social phenomena are already assimilated in an unintentionally artistic manner by the imagination of the people. This is the material of Greek art, not just any mythology, i.e., not every unconsciously artistic assimilation of nature (here the term comprises all physical phenomena, including society); Egyptian mythology could never become the basis of or give rise to Greek art. But at any rate (it presupposes) a mythology; on no account however a social development which precludes a mythological attitude towards nature, i.e., any attitude to nature which might give rise to myth; a society therefore demanding from the artist an imagination independent of mythology.
    hash: sha256:d83b32135ed04de3d99d5bf08d69e523c7515f6ebbc46d9a4fe5b1cc7592d47b
    state: active
  - id: p00094
    type: paragraph
    text: "Regarded from another aspect: is Achilles possible when powder and shot have been invented? And is the Iliad possible at all when the printing press and even printing machines exist? Is it not inevitable that with the emergence of the press bar the singing and the telling and the muse cease, that is the conditions necessary for epic poetry disappear?"
    hash: sha256:3916c943488e2a9fb088f273e0f8272ee8740853d6bcdf47a02fdedbe7c1d39b
    state: active
  - id: p00095
    type: paragraph
    text: The difficulty we are confronted with is not, however, that of understanding how Greek art and epic poetry are associated with certain forms of social development. The difficulty is that they still give us aesthetic pleasure and are in certain respects regarded as a standard and unattainable ideal.
    hash: sha256:d4efef910fcb8a66ab67cd24a9f2001a6b60b09b6d1cf9bb1c5fe96a64c35209
    state: active
  - id: p00096
    type: paragraph
    text: An adult cannot become a child again, or he becomes childish. But does the naivete of the child not give him pleasure, and does not he himself endeavour to reproduce the child's veracity on a higher level? Does not the child in every epoch represent the character of the period in its natural veracity? Why should not the historical childhood of humanity, where it attained its most beautiful form, exert an eternal charm because it is a stage that will never recur? There are rude children and precocious children. Many of the ancient peoples belong to this category. The Greeks were normal children. The charm their art has for us does not conflict with the immature stage of the society in which it originated. On the contrary its charm is a consequence of this and is inseparably linked with the fact that the immature social conditions which gave rise, and which alone could give rise, to this art cannot recur.
    hash: sha256:8578edb7473f94d1319b3b87584941ca32e1c469d29f8c720af3286990d8b27b
    state: active
