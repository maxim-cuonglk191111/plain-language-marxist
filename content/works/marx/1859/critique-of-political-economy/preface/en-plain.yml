    ai_assisted: true
    text: "As a second footnote to the {Communism:adj} Manifesto, Engels wrote in 1888:<br/><br/>In 1847, the history of society before written records was almost completely unknown. Since then, August von Haxthausen (1792-1866) discovered common land ownership in Russia. Georg Ludwig von Maurer proved it was the foundation from which all Teutonic peoples began. Step by step, village communities were found to be the earliest form of society from India to Ireland. The inner structure of this early {communism:adj} society was revealed by Lewis Henry Morgan's (1818-1861) discovery of the true nature of the clan. With the breaking up of these earliest communities, society split into separate, hostile classes. I traced this breaking up in The Origin of the Family, Private Property, and the State, second edition, Stuttgart, 1886.<br/><br/>As research on early history advanced, Marx and Engels updated their descriptions. In the passage above, Marx mentions “Asiatic” {mode-of-production:pl}, drawing on Hegel's framework (The Oriental Realm). They later abandoned the idea of a distinct Asiatic {mode-of-production:sg}. Instead, they kept four primary forms: tribal, ancient, {feudalism:adj}, and capitalist."
