    text: "I examine the system of {bourgeoisie:adj} economy in the following order: <i>{capital:sg}, landed property, {wage-labour:sg}; the State, foreign trade, {world-market:sg}.</i>"
  p00003:
    covers: [p00003]
    based_on: sha256:1e18199e471b0d0f2625ca2ad6d955e112a71897f96f0aec53622bd796008729
    revision: 2
    ai_assisted: true
    text: "The economic conditions of existence of the three great classes of modern {bourgeoisie:adj} society are analyzed under the first three headings. The connection between the other three headings is obvious. The first part of the first book, dealing with Capital, contains these chapters: 1. The {commodity:sg}, 2. Money or simple circulation; 3. {Capital:sg} in general. The present volume consists of the first two chapters. All the material lies before me as separate notebooks, written not for publication but for my own self-clarification at different times. Shaping them into a unified work according to this plan will depend on circumstances."
  p00004:
    covers: [p00004]
    based_on: sha256:e5f6a4364dd3356f2b4f6d09d002c1c48188055d51cf5aa6a8fb407b92f774d3
