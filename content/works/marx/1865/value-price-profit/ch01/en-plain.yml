    revision: 4
    ai_assisted: true
    text: Weston claimed that a 100 per cent wage rise would cause soaring prices and require an impossible currency. If so, a general fall in wages must produce the same effect in the opposite direction. Well! The years 1858 to 1860 were the most prosperous for the cotton industry, and in 1860 wages stood higher than ever before. The American crisis came, and aggregate wages were suddenly reduced to about one-fourth of their former amount. This would have been in the opposite direction a rise of 400 per cent, or a fall of 75 per cent, equal to a change of 15 shillings from 20 to 5 shillings. Did the price of wheat fall? It rose from the annual average of 47 shillings 8d per quarter during 1858–1860 to 55 shillings 10d per quarter during 1861–1863. As to currency, there were coined in the mint in 1861 8,673,323 Pounds, against 3,378,792 Pounds in 1860. That is to say, 5,294,440 Pounds more were coined in 1861 than in 1860. Bank-note circulation in 1861 was less by 1,319,000 Pounds than in 1860. Take this off. There remains still a surplus of currency for 1861 of 3,975,440 Pounds, or about 4,000,000 Pounds, while bullion reserves in the Bank of England decreased. This completely refutes Citizen Weston's views.
  p00038:
    covers: [p00038]
    based_on: sha256:f275f5bedf11a29f29fb9cc4ce6d623602e9d8b4b342cffab75a3f20fad3cab4
    revision: 4
    ai_assisted: true
    text: Compare the year 1862 with 1842. Apart from the immense increase in commodities circulated, railway capital alone reached 320,000,000 Pounds in England and Wales in 1862. Still, aggregate currency in 1862 and 1842 was pretty nearly equal. Modern commerce shows a tendency to diminish currency through bills, cheques, and clearing houses. From our friend Weston's standpoint this is an unsolvable riddle. The dogma of a fixed currency is a monstrous error, incompatible with our everyday movement.
  p00039:
    covers: [p00039]
    based_on: sha256:b0340fb6eda4bd813bc872f0efe1d0e3a3a4e763fdd7268823508ffed12da8f5
    revision: 4
