    text: IV. Supply and Demand
  p00040:
    covers: [p00040]
    based_on: sha256:5ffc809a39d0670c966492eab4b9da6b1e4a40bcbd08c1812e93fefb6d70e4e9
    revision: 4
    ai_assisted: true
    text: Our friend Weston repeated his original dogma in a new form, claiming that a contraction of currency resulting from higher wages would produce a diminution of {capital:sg}. He cited the Latin proverb that “<i>repetitio est mater studiorum</i>,” meaning repetition is the mother of study. Having already dealt with his currency crotchet, I consider it useless to enter upon his imaginary mishaps. I shall proceed to at once reduce his dogma to its simplest theoretical form.
  p00041:
    covers: [p00041]
    based_on: sha256:d345d6761a03ed3e11cebf488c00048188dec09a1f4f10068deed32e85a2816a
    revision: 4
    ai_assisted: true
    text: "The uncritical way in which he has treated his subject will become evident from one single remark. He pleads against high wages as the result of a wage rise. Now, I ask him: what are high wages and what are low wages? Why constitute 5 shillings weekly low, and 20 shillings weekly high wages? If 5 is low compared with 20, 20 is still lower compared with 200. A lecturer on the thermometer must explain the freezing-point and boiling-point by natural laws, not personal fancy. Now in regard to wages and profits, Citizen Weston has failed to deduce standard points from economic laws. He satisfies himself with popular terms of low and high as having a fixed meaning, although wages can only be high or low compared with an objective standard."
  p00042:
    covers: [p00042]
    based_on: sha256:c824fae4927850e78b191edc4b4d03c29e9d398141b9116ce1fe7e4afebc1033
    revision: 4
    ai_assisted: true
    text: He will be unable to tell me why a certain amount of money is given for a certain amount of labour. If he should answer me, “This was settled by the law of supply and demand,” I should ask him by what law supply and demand are themselves regulated. If you accept supply and demand as the law regulating wages, it is childish to declaim against a rise of wages. According to the supreme law you appeal to, a periodical rise of wages is quite as necessary and legitimate as a periodical fall of wages. If you do not accept supply and demand, why is a certain amount of money given for a certain amount of labour?
  p00043:
    covers: [p00043]
    based_on: sha256:8ea4e582c52c6b4e9bab467d4e464ce1d32b6bcb8b25a152b13d8c03d21422b0
    revision: 4
    ai_assisted: true
    text: You would be altogether mistaken in fancying that the value of labour or any other {commodity:sg} is ultimately fixed by supply and demand. Supply and demand regulate nothing but temporary fluctuations of market prices. They explain why the market price of a commodity rises above or sinks below its value, but they can never account for value itself. When supply and demand equilibrate each other, they cease to act. At that moment the market price coincides with its real value, the standard price round which market prices oscillate. In inquiring into the nature of VALUE, we have therefore nothing to do with temporary effects of supply and demand.
  p00044:
    covers: [p00044]
    based_on: sha256:d1a575d8cd2ffcc9807a0d85d7326070d7c492fccaf8c430165aac51294ed427
    revision: 4
    ai_assisted: true
    text: V. Wages and Prices
  p00045:
    covers: [p00045]
    based_on: sha256:ef9ffc4fef1cbea5a621bb265f08978211a3003498bec76b3dbe783068f18093
    revision: 4
    ai_assisted: true
    text: "Reduced to their simplest theoretical expression, all our friend's arguments resolve into this one dogma: “<i>The prices of commodities are determined or regulated by wages.</i>”"
  p00046:
    covers: [p00046]
    based_on: sha256:b77dc11a79137da6c912e199f3882ed29998767204a656b3aafed4487fd49a5f
    revision: 4
    ai_assisted: true
    text: Practical observation bears witness against this exploded fallacy. English factory operatives, miners, and shipbuilders, whose labour is relatively high-priced, undersell other nations through the cheapness of their produce. Meanwhile, the English agricultural labourer, whose labour is relatively low-priced, is undersold by almost every nation because of the dearness of his produce. On an average, high-priced labour produces low-priced commodities, and low-priced labour produces high-priced commodities. This proves that prices of {commodity:pl} are not ruled by the prices of labour.
  p00047:
    covers: [p00047]
    based_on: sha256:cf8fb4650491f38b706fc09511fb9945fd27c24f6f565b9e62faed45457a4365
    revision: 4
    ai_assisted: true
    text: "It might be denied that Citizen Weston put forward the dogma: “<i>The prices of commodities are determined or regulated by wages.</i>” In point of fact, he never formulated it directly. He said that profit and rent also form constituent parts of prices, because prices must pay wages, profits, and rents. But how in his idea are prices formed? First by wages. Then an additional percentage is added for the capitalist, and another percentage for the landlord. Suppose wages employed in producing a commodity to be 10. If the rate of profit was 100 per cent, the capitalist adds 10 to wages. If the rate of rent was also 100 per cent upon wages, there would be added 10 more, making an aggregate price of 30. But such a determination of prices would simply be their determination by wages. If wages rose to 20, the price of the commodity would rise to 60. Older economists who propounded that wages regulate prices treated profit and rent as mere additional percentages upon wages. None of them could reduce the limits of those percentages to any economic law. Competition can equalize different rates of profit in different trades to an average level, but it can never determine the level itself."
  p00048:
    covers: [p00048]
    based_on: sha256:43597fbe1e36af7254277c5637b11cbae7035560f7805e130cfc8a68de8b19a5
    revision: 4
    ai_assisted: true
    text: What do we mean by saying that prices of commodities are determined by wages? Wages being the price of labour, we mean that prices of {commodity:pl} are regulated by the price of labour. As “price” is exchangeable value expressed in money, the proposition means that “the value of commodities is determined by the value of labour,” or that “the value of labour is the general measure of value.”
  p00049:
    covers: [p00049]
    based_on: sha256:921188cf76973d96a73ccefc9d63469bba1a7c06e43edc47ed36a3b521c664c7
    revision: 4
    ai_assisted: true
    text: But how, then, is the “value of labour” itself determined? Here we come to a standstill. First Weston told us that wages regulate prices of commodities, and that when wages rise prices must rise. Then he turned round to show that a rise of wages will be no good because prices of commodities had risen, and wages are measured by the commodities upon which they are spent. Thus we begin by saying that the value of labour determines the value of commodities, and we wind up by saying that the value of commodities determines the value of labour. Thus we move to and fro in a vicious circle, and arrive at no conclusion at all.
  p00050:
    covers: [p00050]
    based_on: sha256:1ead19ba384900fb3d4e16a9c3804c0131ee55322c9281d761f46bed705dd581
    revision: 4
    ai_assisted: true
    text: On the whole, making the value of one {commodity:sg} the general measure and regulator of value only shifts the difficulty, since we determine one value by another which itself needs to be determined.
  p00051:
    covers: [p00051]
    based_on: sha256:cb4b38bb4cca535618540df4fef35caaf5e7bc6e359c9dec2d6cb8b6eb51e1f6
    revision: 4
    ai_assisted: true
    text: The dogma that “wages determine the price of commodities” comes to this, that “value is determined by value,” meaning that in fact we know nothing about value. It was the great merit of Ricardo that in his 1817 work on political economy, he fundamentally destroyed the worn-out fallacy that “wages determine prices”. Adam Smith and his French predecessors had spurned this fallacy in their scientific researches, although they reproduced it in their more vulgarizing chapters.
