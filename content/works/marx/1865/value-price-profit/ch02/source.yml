  - id: p00001
    type: heading
    level: 3
    text: VI. Value and Labour
    hash: sha256:df2a58ae2b7e7d3f8e961700f494b9a88640af45cfce3a90e1bec0a9f47d9a27
    state: active
  - id: p00002
    type: paragraph
    text: "Citizens, I have now arrived at a point where I must enter upon the real development of the question. I cannot promise to do this in a very satisfactory way, because to do so I should be obliged to go over the whole field of political economy. I can, as the French would say, but “effleurer la question,” touch upon the main points. The first question we have to put is: What is the <i>value</i> of a commodity? How is it determined?"
    hash: sha256:5271fb488a4541ed45f636c5cf98ce1433af92f78fe29bd61928a4f4b02a86b9
    state: active
  - id: p00003
    type: paragraph
    text: "At first sight it would seem that the value of a commodity is a thing quite <i>relative</i>, and not to be settled without considering one commodity in its relations to all other commodities. In fact, in speaking of the value, the value in exchange of a commodity, we mean the proportional quantities in which it exchanges with all other commodities. But then arises the question: How are the proportions in which commodities exchange with each other regulated? We know from experience that these proportions vary infinitely. Taking one single commodity, wheat, for instance, we shall find that a quarter of wheat exchanges in almost countless variations of proportion with different commodities. Yet, <i>its value remaining always the same</i>, whether expressed in silk, gold, or any other commodity, it must be something distinct from, and independent of, these <i>different rates of exchange</i> with different articles. It must be possible to express, in a very different form, these various equations with various commodities."
    hash: sha256:28561ca0af01596a21b29d74546d39eddaf46798efcdd2fa958ce4f0177ecf38
    state: active
  - id: p00004
    type: paragraph
    text: Besides, if I say a quarter of wheat exchanges with iron in a certain proportion, or the value of a quarter of wheat is expressed in a certain amount of iron, I say that the value of wheat and its equivalent in iron are equal to <i>some third thing</i>, which is neither wheat nor iron, because I suppose them to express the same magnitude in two different shapes. Either of them, the wheat or the iron, must, therefore, independently of the other, be reducible to this third thing which is their common measure.
    hash: sha256:09138c73c44cbfdeddb6964b9b97b47eb16574693e7df1d6e1ccf8ee2c2cc76b
    state: active
  - id: p00005
    type: paragraph
    text: To elucidate this point I shall recur to a very simple geometrical illustration. In comparing the areas of triangles of all possible forms and magnitudes, or comparing triangles with rectangles, or any other rectilinear figure, how do we proceed? We reduce the area of any triangle whatever to an expression quite different from its visible form. Having found from the nature of the triangle that its area is equal to half the product of its base by its height, we can then compare the different values of all sorts of triangles, and of all rectilinear figures whatever, because all of them may be resolved into a certain number of triangles.
    hash: sha256:f2d154fa820ba54cc75cddfa53f8fd62075efbfce7ab9ad642f1d804e67ec7b7
    state: active
  - id: p00006
    type: paragraph
    text: The same mode of procedure must obtain with the values of commodities. We must be able to reduce all of them to an expression common to all, and distinguishing them only by the proportions in which they contain that identical measure.
    hash: sha256:90b81f3d1b4394c8150d52ef739364f5fd552f5104c85d44bda35ba04dbdda0d
    state: active
  - id: p00007
    type: paragraph
    text: "As the <i>exchangeable values</i> of commodities are only <i>social functions</i> of those things, and have nothing at all to do with the <i>natural</i> qualities, we must first ask: What is the common <i>social substance</i> of all commodities? It is <i>labour</i>. To produce a commodity a certain amount of labour must be bestowed upon it, or worked up in it. And I say not only <i>labour</i>, but <i>social labour</i>. A man who produces an article for his own immediate use, to consume it himself, creates a <i>product</i>, but not a <i>commodity</i>. As a self-sustaining producer he has nothing to do with society. But to produce a <i>commodity</i>, a man must not only produce an article satisfying some <i>social</i> want, but his labour itself must form part and parcel of the total sum of labour expended by society. It must be subordinate to the <i>division of labour within society</i>. It is nothing without the other divisions of labour, and on its part is required to <i>integrate</i> them."
    hash: sha256:68919a2fe043fbb1f88bbc9ce3a0413c5d12ef8c3eda70a9aa7fc2100e70007d
    state: active
  - id: p00008
    type: paragraph
    text: If we consider <i>commodities as values</i>, we consider them exclusively under the single aspect of <i>realized, fixed</i>, or, if you like, <i>crystallized social labour</i>. In this respect they can <i>differ</i> only by representing greater or smaller quantities of labour, as, for example, a greater amount of labour may be worked up in a silken handkerchief than in a brick. But how does one measure <i>quantities of labour</i>? By the <i>time the labour lasts</i>, in measuring the labour by the hour, the day, etc. Of course, to apply this measure, all sorts of labour are reduced to average or simple labour as their unit. We arrive, therefore, at this conclusion. A commodity has <i>a value</i>, because it is a <i>crystallization of social labour</i>. The <i>greatness</i> of its value, or its <i>relative</i> value, depends upon the greater or less amount of that social substance contained in it; that is to say, on the relative mass of labour necessary for its production. The <i>relative values of commodities</i> are, therefore, determined by the <i>respective quantities or amounts of labour, worked up, realized, fixed in them</i>. The <i>correlative</i> quantities of commodities which can be produced in the <i>same time of labour</i> are <i>equal</i>. Or the value of one commodity is to the value of another commodity as the quantity of labour fixed in the one is to the quantity of labour fixed in the other.
    hash: sha256:3ab56fe7449b5e26c9b61c69ca291ff0e42eec1fad06be959393a762fe6f3c49
    state: active
  - id: p00009
    type: paragraph
    text: "I suspect that many of you will ask: Does then, indeed, there exist such a vast or any difference whatever, between determining the values of commodities by <i>wages</i>, and determining them by the <i>relative quantities of labour</i> necessary for their production? You must, however, be aware that the <i>reward</i> for labour, and <i>quantity</i> of labour, are quite disparate things. Suppose, for example, <i>equal quantities of labour</i> to be fixed in one quarter of wheat and one ounce of gold. I resort to the example because it was used by Benjamin Franklin in his first Essay published in 1721, and entitled <i>A Modest Enquiry into the Nature and Necessity of a Paper Currency</i>, where he, one of the first, hit upon the true nature of value."
    hash: sha256:d537275b6f3d74053a179795d4ae962aa74a082e89fa90fd7c38cda3bc488777
    state: active
  - id: p00010
    type: paragraph
    text: Well. We suppose, then, that one quarter of wheat and one ounce of gold are <i>equal values</i> or <i>equivalents</i>, because they are <i>crystallizations of equal amounts of average labour</i>, of so many days' or so many weeks' labour respectively fixed in them. In thus determining the relative values of gold and corn, do we refer in any way whatever to the <i>wages</i> of the agricultural labourer and the miner? Not a bit. We leave it quite <i>indeterminate</i> how their day's or their week's labour was paid, or even whether wage labour was employed at all. If it was, wages may have been very unequal. The labourer whose labour is realized in the quarter of wheat may receive two bushels only, and the labourer employed in mining may receive one-half of the ounce of gold. Or, supposing their wages to be equal, they may deviate in all possible proportions from the values of the commodities produced by them. They may amount to one-fourth, one-fifth, or any other proportional part of the one quarter of corn or the one ounce of gold. Their <i>wages</i> can, of course, not <i>exceed</i>, not be <i>more</i> than the values of the commodities they produced, but they can be <i>less</i> in every possible degree. Their <i>wages</i> will be <i>limited</i> by the <i>values</i> of the products, but the <i>values of their products</i> will not be limited by the wages. And above all, the values, the relative values of corn and gold, for example, will have been settled without any regard whatever to the value of the labour employed, that is to say, to <i>wages</i>. To determine the values of commodities by the <i>relative quantities of labour fixed in them</i>, is, therefore, a thing quite different from the tautological method of determining the values of commodities by the value of labour, or by <i>wages</i>. This point, however, will be further elucidated in the progress of our inquiry.
    hash: sha256:eb8be5cb23be2e662312b5a62b4509fcdadcb78d6ec65138394956c3da4fa979
    state: active
  - id: p00011
    type: paragraph
    text: In calculating the exchangeable value of a commodity we must add to the quantity of labour <i>previously</i> worked up in the raw material of the commodity, and the labour bestowed on the implements, tools, machinery, and buildings, with which such labour is assisted. For example, the value of a certain amount of cotton yarn is the crystallization of the quantity of labour added to the cotton during the spinning process, the quantity of labour previously realized in the cotton itself, the quantity of labour realized in the coal, oil, and other auxiliary substances used, the quantity of labour fixed in the steam-engine, the spindles, the factory building, and so forth. Instruments of production properly so-called, such as tools, machinery, buildings, serve again and again for longer or shorter period during repeated processes of production. If they were used up at once, like the raw material, their whole value would at once be transferred to the commodities they assist in producing. But as a spindle, for example, is but gradually used up, an average calculation is made, based upon the average time it lasts, and its average waste or wear and tear during a certain period, say a day. In this way we calculate how much of the value of the spindle is transferred to the yarn daily spin, and how much, therefore, of the total amount of labour realized in a pound of yarn, for example, is due to the quantity of labour previously realized in the spindle. For our present purpose it is not necessary to dwell any longer upon this point.
    hash: sha256:bc9df3778595f517b8618d53c752ddde3afb40fdf67e16c13efb35c76b315f8b
    state: active
  - id: p00012
    type: paragraph
    text: It might seem that if the value of a commodity is determined by the <i>quantity of labour bestowed upon its production</i>, the lazier a man, or the clumsier a man, the more valuable his commodity, because the greater the time of labour required for finishing the commodity. This, however, would be a sad mistake. You will recollect that I used the word “<i>social</i> labour,” and many points are involved in this qualification of “<i>social</i>.” In saying that the value of a commodity is determined by the <i>quantity of labour</i> worked up or crystallized in it, we mean <i>the quantity of labour necessary</i> for its production in a given state of society, under certain social average conditions of production, with a given social average intensity, and average skill of the labour employed. When, in England, the power-loom came to compete with the hand-loom, only half the former time of labour was wanted to convert a given amount of yarn into a yard of cotton or cloth. The poor hand-loom weaver now worked seventeen or eighteen hours daily, instead of the nine or ten hours he had worked before. Still the product of twenty hours of his labour represented now only ten social hours of labour, or ten hours of labour socially necessary for the conversion of a certain amount of yarn into textile stuffs. His product of twenty hours had, therefore, no more value than his former product of ten hours.
    hash: sha256:0ef4a7c1499adef6f7a44e040105c2843b4a850d0a93046f4c93fed3a717c4fc
    state: active
  - id: p00013
    type: paragraph
    text: If then the quantity of socially necessary labour realized in commodities regulates their exchangeable values, every increase in the quantity of labour wanted for the production of a commodity must augment its value, as every diminution must lower it.
    hash: sha256:cccec1671bd272e44717e9c4c7f7b111074840e52354cdb018545d13ec2bd8d9
    state: active
  - id: p00014
    type: paragraph
    text: If the respective quantities of labour necessary for the production of the respective commodities remained constant, their relative values also would be constant. But such is not the case. The quantity of labour necessary for the production of a commodity changes continuously with the changes in the productive powers of labour, the more produce is finished in a given time of labour; and the smaller the productive powers of labour, the less produce is finished in the same time. If, for example, in the progress of population it should become necessary to cultivate less fertile soils, the same amount of produce would be only attainable by a greater amount of labour spent, and the value of agricultural produce would consequently rise. On the other hand, if, with the modern means of production, a single spinner converts into yarn, during one working day, many thousand times the amount of cotton which he could have spun during the same time with the spinning wheel, it is evident that every single pound of cotton will absorb many thousand times less of spinning labour than it did before, and consequently, the value added by spinning to every single pound of cotton will be a thousand times less than before. The value of yarn will sink accordingly.
    hash: sha256:8743b02bb99cd4a8aede1f64a375a3856ddcb30a0f8cb1f689e6b3dc32891462
    state: active
  - id: p00015
    type: paragraph
    text: "Apart from the different natural energies and acquired working abilities of different peoples, the productive powers of labour must principally depend: —"
    hash: sha256:56c2def096061f833bdd941e8c1b6b48e00f95968af74c5031cc46c73fbd8774
    state: active
  - id: p00016
    type: paragraph
    text: Firstly. Upon the <i>natural</i> conditions of labour, such as fertility of soil, mines, and so forth.
    hash: sha256:ad78167ca2f96a640b63af1d6660760b6a2f8deda65569490b7852fd2cbf7f30
    state: active
  - id: p00017
    type: paragraph
    text: "Secondly. Upon the progressive improvement of the <i>social powers of labour</i>, such as are derived from production on a grand scale, concentration of capital and combination of labour, subdivision of labour, machinery, improved methods, appliance of chemical and other natural agencies, shortening of time and space by means of communication and transport, and every other contrivance by which science presses natural agencies into the service of labour, and by which the social or co-operative character of labour is developed. The greater the productive powers of labour, the less labour is bestowed upon a given amount of produce; hence the smaller the value of the produce. The smaller the productive powers of labour, the more labour is bestowed upon the same amount of produce; hence the greater its value. As a general law we may, therefore, set it down that: —"
    hash: sha256:729bd22e4c43ed28fa3ff62cf9bbac8dd309056aeb1ecebfa3a995f610815a13
    state: active
  - id: p00018
    type: paragraph
    text: <i>The values of commodities are directly as the times of labour employed in their production, and are inversely as the productive powers of the labour employed.</i>
    hash: sha256:7a56aa3f943a12229e1279e11b1647a2171a8b1095cebf2bc99b95a9b293aed1
    state: active
  - id: p00019
    type: paragraph
    text: Having till now only spoken of <i>value</i>, I shall add a few words about <i>price</i>, which is a peculiar form assumed by value.
    hash: sha256:433769e2331afc8f4fa0f4a40e219ef22afd6543d03439e7e674744ad45db76b
    state: active
  - id: p00020
    type: paragraph
    text: Price, taken by itself, is nothing but the <i>monetary expression of value</i>. The values of all commodities of the country, for example, are expressed in gold prices, while on the Continent they are mainly expressed in silver prices. The value of gold or silver, like that of all other commodities is regulated by the quantity of labour necessary for getting them. You exchange a certain amount of your national products, in which a certain amount of your national labour is crystallized, for the produce of the gold and silver producing countries, in which a certain quantity of <i>their</i> labour is crystallized. It is in this way, in fact by barter, that you learn to express in gold and silver the values of all commodities, that is the respective quantities of labour bestowed upon them. Looking somewhat closer into the <i>monetary expression of value</i>, or what comes to the same, the conversion of value into price, you will find that it is a process by which you give to the <i>values</i> of all commodities an <i>independent</i> and <i>homogeneous form</i>, or by which you express them as quantities of equal social labour. So far as it is but the monetary expression of value, price has been called <i>natural price</i> by Adam Smith, “<i>prix necessaire</i>” by the French physiocrats.
    hash: sha256:332d4528935df334e00c2e293f21c3f433dbdc6150506792a917d41d267693b4
    state: active
  - id: p00021
    type: paragraph
    text: What then is the relation between <i>value</i> and <i>market prices</i>, or between <i>natural prices</i> and <i>market prices</i>? You all know that the <i>market price</i> is the <i>same</i> for all commodities of the same kind, however the conditions of production may differ for the individual producers. The market price expresses only the <i>average amount of social labour</i> necessary, under the average conditions of production, to supply the market with a certain mass of a certain article. It is calculated upon the whole lot of a commodity of a certain description.
    hash: sha256:5696ce213eb914137dadcf112eac0c344c2e7651939e1c17c23266a5c974414e
    state: active
  - id: p00022
    type: paragraph
    text: "So far the <i>market price</i> of a commodity coincides with its <i>value</i>. On the other hand, the oscillations of market prices, rising now over, sinking now under the value or natural price, depend upon the fluctuations of supply and demand. The deviations of market prices from values are continual, but as Adam Smith says:"
    hash: sha256:6b1d9da24626bf58336a6898dda597f52422281de573a09301cb34e40b82bb26
    state: active
  - id: p00023
    type: blockquote
    text: “The natural price is the central price to which the prices of commodities are continually gravitating. Different accidents may sometimes keep them suspended a good deal above it, and sometimes force them down even somewhat below it. But whatever may be the obstacles which hinder them from settling in this center of repose and continuance, they are constantly tending towards it.”
    hash: sha256:0981db34cf4f20cadfcb53c4d48390984e88f38ce569eb2673e70fc576ea6830
    state: active
  - id: p00024
    type: paragraph
    text: I cannot now sift this matter. It suffices to say the <i>if</i> supply and demand equilibrate each other, the market prices of commodities will correspond with their natural prices, that is to say with their values, as determined by the respective quantities of labour required for their production. But supply and demand <i>must</i> constantly tend to equilibrate each other, although they do so only by compensating one fluctuation by another, a rise by a fall, and <i>vice versa</i>. If instead of considering only the daily fluctuations you analyze the movement of market prices for longer periods, as Mr. Tooke, for example, has done in his <i>History of Prices</i>, you will find that the fluctuations of market prices, their deviations from values, their ups and downs, paralyze and compensate each other; so that apart from the effect of monopolies and some other modifications I must now pass by, all descriptions of commodities are, on average, sold at their respective <i>values</i> or natural prices. The average periods during which the fluctuations of market prices compensate each other are different for different kinds of commodities, because with one kind it is easier to adapt supply to demand than with the other.
    hash: sha256:7f78d57b5d8da7334a518f68b0cf22898739c6d836495d5afaec5b0bc7a90077
    state: active
  - id: p00025
    type: paragraph
    text: If then, speaking broadly, and embracing somewhat longer periods, all descriptions of commodities sell at their respective values, it is nonsense to suppose that profit, not in individual cases; but that the constant and usual profits of different trades spring from the prices of commodities, or selling them at a price over and above their <i>value</i>. The absurdity of this notion becomes evident if it is generalized. What a man would constantly win as a seller he would constantly lose as a purchaser. It would not do to say that there are men who are buyers without being sellers, or consumers without being producers. What these people pay to the producers, they must first get from them for nothing. If a man first takes your money and afterwards returns that money in buying your commodities, you will never enrich yourselves by selling your commodities too dear to that same man. This sort of transaction might diminish a loss, but would never help in realizing a profit. To explain, therefore, the <i>general nature of profits</i>, you must start from the theorem that, on an average, commodities are <i>sold at their real values</i>, and that <i>profits are derived from selling them at their values</i>, that is, in proportion to the quantity of labour realized in them. If you cannot explain profit upon this supposition, you cannot explain it at all. This seems paradox and contrary to every-day observation. It is also paradox that the earth moves round the sun, and that water consists of two highly inflammable gases. Scientific truth is always paradox, if judged by every-day experience, which catches only the delusive appearance of things.
    hash: sha256:40ad3fdfb97a102660af738ee12ca7069148cb6b669d7bf3c4d8625586a03da1
    state: active
  - id: p00026
    type: heading
    level: 3
    text: VII. Labour Power
    hash: sha256:eb837258f0947dcfd87c49f232853dcf0c0d779be3f9d5b7d26bcd1e0da91fbb
    state: active
  - id: p00027
    type: paragraph
    text: Having now, as far as it could be done in such a cursory manner, analyzed the nature of <i>value</i>, of the <i>value of any commodity whatever</i>, we must turn our attention to the specific <i>value of labour</i>. And here, again, I must startle you by a seeming paradox. All of you feel sure that what they daily sell is their Labour; that, therefore, Labour has a price, and that, the price of a commodity being only the monetary expression of its value, there must certainly exist such a thing as the <i>value of labour</i>. However, there exists no such thing as the <i>value of labour</i> in the common acceptance of the word. We have seen that the amount of necessary labour crystallized in a commodity constitutes its value. Now, applying this notion of value, how could we define, say, the value of a ten hours working day? How much labour is contained in that day? Ten hours' labour.
    hash: sha256:8def9b0fc0a5f7dbdc6ccbfa4038a781b3dfb763db26432808a38dcdf72e7788
    state: active
  - id: p00028
    type: paragraph
    text: To say that the value of a ten hours working day is equal to ten hours' labour, or the quantity of labour contained in it, would be a tautological and, moreover, a nonsensical expression. Of course, having once found out the true but hidden sense of the expression “<i>value of labour</i>,” we shall be able to interpret this irrational, and seemingly impossible application of value, in the same way that, having once made sure of the real movement of the celestial bodies, we shall be able to explain their apparent or merely phenomenal movements.
    hash: sha256:d5600c5ba62b377ae4d457897b80243d93ce2bec6f898c60554bc256d0810736
    state: active
  - id: p00029
    type: paragraph
    text: What the working man sells is not directly his <i>labour</i>, but his <i>labouring power</i>, the temporary disposal of which he makes over to the capitalist. This is so much the case that I do not know whether by the English Laws, but certainly by some Continental Laws, the <i>maximum time</i> is fixed for which a man is allowed to sell his labouring power. If allowed to do so for any indefinite period whatever, slavery would be immediately restored. Such a sale, if it comprised his lifetime, for example, would make him at once the lifelong slave of his employer.
    hash: sha256:2238a97d7d6738481ef6e56da9b9bef79b21a3e5cd47fbc9de3a007b05220ae9
    state: active
  - id: p00030
    type: paragraph
    text: "One of the oldest economists and most original philosophers of England — Thomas Hobbes — has already, in his Leviathan, instinctively hit upon this point overlooked by all his successors. He says: “<i>the value or worth of a man</i> is, as in all other things, his <i>price</i>: that is so much as would be given for the <i>use of his power</i>.” Proceeding from this basis, we shall be able to determine the <i>value of labour</i> as that of all other commodities."
    hash: sha256:de0d502a15aacc732f6c037e766a4a5bed8a831e3892729426c6d067410e72d9
    state: active
  - id: p00031
    type: paragraph
    text: But before doing so, we might ask, how does this strange phenomenon arise, that we find on the market a set of buyers, possessed of land, machinery, raw material, and the means of subsistence, all of them, save land in its crude state, the <i>products of labour</i>, and on the other hand, a set of sellers who have nothing to sell except their labouring power, their working arms and brains? That the one set buys continually in order to make a profit and enrich themselves, while the other set continually sells in order to earn their livelihood? The inquiry into this question would be an inquiry into what the economists call “<i>previous or original accumulation</i>,” but which ought to be called <i>original expropriation</i>. We should find that this so-called <i>original accumulation</i> means nothing but a series of historical processes, resulting in a <i>decomposition</i> of the <i>original union</i> existing between the labouring Man and his Instruments of Labour. Such an inquiry, however, lies beyond the pale of my present subject. The <i>separation</i> between the Man of Labour and the Instruments of Labour once established, such a state of things will maintain itself and reproduce itself upon a constantly increasing scale, until a new and fundamental revolution in the mode of production should again overturn it, and restore the original union in a new historical form.
    hash: sha256:0bf2d5ce0fd1b644421fbf4fdd0d9414ec191c856e098a4389d166be68d568bc
    state: active
  - id: p00032
    type: paragraph
    text: What, then, is the <i>value of labouring power</i>?
    hash: sha256:2a2606c5c6015e56cbf4ce0db45f7c096556e3808de0f2dd6749fafa1dbb0c5e
    state: active
  - id: p00033
    type: paragraph
    text: "Like that of every other commodity, its value is determined by the quantity of labour necessary to produce it. The labouring power of a man exists only in his living individuality. A certain mass of necessaries must be consumed by a man to grow up and maintain his life. But the man, like the machine, will wear out, and must be replaced by another man. Beside the mass of necessaries required for <i>his own</i> maintenance, he wants another amount of necessaries to bring up a certain quota of children that are to replace him on the labour market and to perpetuate the race of labourers. Moreover, to develop his labouring power, and acquire a given skill, another amount of values must be spent. For our purpose it suffices to consider only <i>average</i> labour, the costs of whose education and development are vanishing magnitudes. Still I must seize upon this occasion to state that, as the costs of producing labouring powers of different quality differ, so much differ the values of the labouring powers employed in different trades. The cry for an <i>equality of wages</i> rests, therefore, upon a mistake, is an inane wish never to be fulfilled. It is an offspring of that false and superficial radicalism that accepts premises and tries to evade conclusions. Upon the basis of the wages system the value of labouring power is settled like that of every other commodity; and as different kinds of labouring power have different values, or require different quantities of labour for their production, they <i>must</i> fetch different prices in the labour market. To clamour for <i>equal or even equitable retribution</i> on the basis of the wages system is the same as to clamour for <i>freedom</i> on the basis of the slavery system. What you think just or equitable is out of the question. The question is: What is necessary and unavoidable with a given system of production? After what has been said, it will be seen that the <i>value of labouring power</i> is determined by the <i>value of the necessaries</i> required to produce, develop, maintain, and perpetuate the labouring power."
    hash: sha256:ab271255d30b61c342f3ad78aa7177b6d8ad2356148642550557e746a7d73d7c
    state: active
  - id: p00034
    type: heading
    level: 3
    text: VIII. Production of Surplus Value
    hash: sha256:b56c980561b019db1e6d41a56a0f1d4dfbe0aa915724132cc57a5f1d4a42c708
    state: active
  - id: p00035
    type: paragraph
    text: Now suppose that the average amount of the daily necessaries of a labouring man require <i>six hours of average labour</i> for their production. Suppose, moreover, six hours of average labour to be also realized in a quantity of gold equal to 3s. Then 3s. would be the <i>price</i>, or the monetary expression of the <i>daily value</i> of that man's <i>labouring power</i>. If he worked daily six hours he would daily produce a value sufficient to buy the average amount of his daily necessaries, or to maintain himself as a labouring man.
    hash: sha256:5bd4b9720a7f26fc098ebea2c758654f5bcf0fc4dd80064d17ac77d603c88a9e
    state: active
  - id: p00036
    type: paragraph
    text: But our man is a wages labourer. He must, therefore, sell his labouring power to a capitalist. If he sells it at 3s. daily, or 18s. weekly, he sells it at its value. Suppose him to be a spinner. If he works six hours daily he will add to the cotton a value of 3s. daily. This value, daily added by him, would be an exact equivalent for the wages, or the price of his labouring power, received daily. But in that case <i>no surplus value</i> or <i>surplus produce</i> whatever would go to the capitalist. Here, then, we come to the rub.
    hash: sha256:635f517aef295332754e4b9d01c100e87ec99e7862cf50e745877a01c91fb9b5
    state: active
  - id: p00037
    type: paragraph
    text: In buying the labouring power of the workman, and paying its value, the capitalist, like every other purchaser, has acquired the right to consume or use the commodity bought. You consume or use the labouring power of a man by making him work, as you consume or use a machine by making it run. By buying the daily or weekly value of the labouring power of the workman, the capitalist has, therefore, acquired the right to use or make that labouring power during the <i>whole day or week</i>. The working day or the working week has, of course, certain limits, but those we shall afterwards look more closely at.
    hash: sha256:41d09130d4e0dba6b9d2d8b69d212e85e31e06e81d85dce2aff9b5e2c7241f6f
    state: active
  - id: p00038
    type: paragraph
    text: For the present I want to turn your attention to one decisive point. The <i>value</i> of the labouring power is determined by the quantity of labour necessary to maintain or reproduce it, but the <i>use</i> of that labouring power is only limited by the active energies and physical strength of the labourer. The daily or weekly <i>value</i> of the labouring power is quite distinct from the daily or weekly exercise of that power, the same as the food a horse wants and the time it can carry the horseman are quite distinct. The quantity of labour by which the <i>value</i> of the workman's labouring power is limited forms by no means a limit to the quantity of labour which his labouring power is apt to perform. Take the example of our spinner. We have seen that, to daily reproduce his labouring power, he must daily reproduce a value of three shillings, which he will do by working six hours daily. But this does not disable him from working ten or twelve or more hours a day. But by paying the daily or weekly <i>value</i> of the spinner's labouring power the capitalist has acquired the right of using that labouring power during <i>the whole day or week</i>. He will, therefore, make him work say, daily<i>, twelve hours. Over and above</i> the six hours required to replace his wages, or the value of his labouring power, he will, therefore, have to work <i>six other hours</i>, which I shall call hours of <i>surplus labour</i>, which surplus labour will realize itself in a <i>surplus value</i> and a <i>surplus produce</i>. If our spinner, for example, by his daily labour of six hours, added three shillings' value to the cotton, a value forming an exact equivalent to his wages, he will, in twelve hours, add six shillings' worth to the cotton, and produce <i>a proportional surplus of yarn</i>. As he has sold his labouring power to the capitalist, the whole value of produce created by him belongs to the capitalist, the owner <i>pro tem</i>. of his labouring power. By advancing three shillings, the capitalist will, therefore, realize a value of six shillings, because, advancing a value in which six hours of labour are crystallized, he will receive in return a value in which twelve hours of labour are crystallized. By repeating this same process daily, the capitalist will daily advance three shillings and daily pocket six shillings, one half of which will go to pay wages anew, and the other half of which will form <i>surplus value</i>, for which the capitalist pays no equivalent. It is this <i>sort of exchange between capital and labour</i> upon which capitalistic production, or the wages system, is founded, and which must constantly result in reproducing the working man as a working man, and the capitalist as a capitalist.
    hash: sha256:82cdf1eb45f21efad993c8b80cdb5f300e4dcd50248ab6bd8b48f7e2bd6241c0
    state: active
  - id: p00039
    type: paragraph
    text: <i>The rate of surplus value</i>, all other circumstances remaining the same, will depend on the proportion between that part of the working day necessary to reproduce the value of the labouring power and the <i>surplus time</i> or <i>surplus labour</i> performed for the capitalist. It will, therefore, depend on the <i>ratio in which the working day is prolonged over and above that extent</i>, by working which the working man would only reproduce the value of his labouring power, or replace his wages.
    hash: sha256:f1b3b84540f8b5ddffa839bec313a1df21aea55a609b8e3f383eb3d4071f94ed
    state: active
  - id: p00040
    type: heading
    level: 3
    text: IX. Value of Labour
    hash: sha256:fba3729341aa00ad0bfed832f81bd489f2c7d1d82b57ab3b9d323482eecac309
    state: active
  - id: p00041
    type: paragraph
    text: We must now return to the expression, “<i>value, or price of labour</i>.” We have seen that, in fact, it is only the value of the labouring power, measured by the values of commodities necessary for its maintenance. But since the workman receives his wages <i>after</i> his labour is performed, and knows, moreover, that what he actually gives to the capitalist is his labour, the value or price of his labouring power necessarily appears to him as the <i>price</i> or <i>value of his labour itself</i>. If the price of his labouring power is three shillings, in which six hours of labour are realized, and if he works twelve hours, he necessarily considers these three shillings as the value or price of twelve hours of labour, although these twelve hours of labour realize themselves in a value of six shillings. A double consequence flows from this.
    hash: sha256:adb2bfc6401441dcee78ef284f4b68c7bb74df6a05db4ba4b8189ce5972113d4
    state: active
  - id: p00042
    type: paragraph
    text: Firstly. The <i>value or price of the labouring power</i> takes the semblance of the <i>price or value of labour itself</i>, although, strictly speaking, value and price of labour are senseless terms.
    hash: sha256:51c180042178ef017269a7e8a528cfda065aeb52ecacabac243aacf534a86df2
    state: active
  - id: p00043
    type: paragraph
    text: Secondly. Although one part only of the workman's daily labour is <i>paid</i>, while the other part is <i>unpaid</i>, and while that unpaid or surplus labour constitutes exactly the fund out of which <i>surplus value</i> or <i>profit</i> is formed, it seems as if the aggregate labour was paid labour.
    hash: sha256:790f338d744c79c4d9b05b146cf9a2d8f4a9952e2ab6d871671f8ffdeb4d44bf
    state: active
  - id: p00044
    type: paragraph
    text: This false appearance distinguishes <i>wages labour</i> from other <i>historical</i> forms of labour. On the basis of the wages system even the <i>unpaid</i> labour seems to be <i>paid</i> labour. With the <i>slave</i>, on the contrary, even that part of his labour which is paid appears to be unpaid. Of course, in order to work the slave must live, and one part of his working day goes to replace the value of his own maintenance. But since no bargain is struck between him and his master, and no acts of selling and buying are going on between the two parties, all his labour seems to be given away for nothing.
    hash: sha256:0b21a83cc21e12bb6e171026d297ee177e7d44e3059d4cc836c0c8b46acf0da5
    state: active
  - id: p00045
    type: paragraph
    text: Take, on the other hand, the peasant serf, such as he, I might say, until yesterday existed in the whole of East of Europe. This peasant worked, for example, three days for himself on his own field or the field allotted to him, and the three subsequent days he performed compulsory and gratuitous labour on the estate of his lord. Here, then, the paid and unpaid parts of labour were sensibly separated, separated in time and space; and our Liberals overflowed with moral indignation at the preposterous notion of making a man work for nothing.
    hash: sha256:841097e1afc1c7834859844b1b051a708ba0d4186b239336f8f25d789220186a
    state: active
  - id: p00046
    type: paragraph
    text: In point of fact, however, whether a man works three days of the week for himself on his own field and three days for nothing on the estate of his lord, or whether he works in the factory or the workshop six hours daily for himself and six for his employer, comes to the same, although in the latter case the paid and unpaid portions of labour are inseparably mixed up with each other, and the nature of the whole transaction is completely masked by the <i>intervention of a contract</i> and the <i>pay</i> received at the end of the week. The gratuitous labour appears to be voluntarily given in the one instance, and to be compulsory in the other. That makes all the difference.
    hash: sha256:ee2461b8387c06f834ece3c311ecc9740851569cb988419bf3e75fab1b603bba
    state: active
  - id: p00047
    type: paragraph
    text: In using the word “<i>value of labour</i>,” I shall only use it as a popular slang term for “<i>value of labouring power</i>."
    hash: sha256:960a05d23beb8555d5753194a9addbf592afdccd8b5c5f996f93b960a6c90147
    state: active
  - id: p00048
    type: heading
    level: 3
    text: X. Profit is Made by Selling a Commodity at its Value
    hash: sha256:418f0c84c308c3b35f8055f02fec2d653498089df242e9668a07300ac642d76c
    state: active
  - id: p00049
    type: paragraph
    text: Suppose an average hour of labour to be realized in a value equal to sixpence, or twelve average hours of labour to be realized in six shillings. Suppose, further, the value of labour to be three shillings or the produce of six hours' labour. If, then, in the raw material, machinery, and so forth, used up in a commodity, twenty-four hours of average labour were realized, its value would amount to twelve shillings. If, moreover, the workman employed by the capitalist added twelve hours of labour to those means of production, these twelve hours would be realized in an additional value of six shillings. The <i>total value of the product</i> would, therefore, amount to thirty-six hours of realized labour, and be equal to eighteen shillings. But as the value of labour, or the wages paid to the workman, would be three shillings only, no equivalent would have been paid by the capitalist for the six hours of surplus labour worked by the workman, and realized in the value of the commodity. By selling this commodity at its value for eighteen shillings, the capitalist would, therefore, realize a value of three shillings, for which had paid no equivalent. These three shillings would constitute the surplus value or profit pocketed by him. The capitalist would consequently realize the profit of three shillings, not by selling his commodity at a price <i>over and above</i> its value, but by selling it <i>at its real value</i>.
    hash: sha256:bbeda54b0b6fddd48562fa1498408d588e5452315f6f66599070a5d728d30879
    state: active
  - id: p00050
    type: paragraph
    text: The value of a commodity is determined by the <i>total quantity of labour</i> contained in it. But part of that quantity of labour is realized in a value for which and equivalent has been paid in the form of wages; part of it is realized in a value for which NO equivalent has been paid. Part of the labour contained in the commodity is <i>paid</i> labour; part is <i>unpaid</i> labour. By selling, therefore, the commodity <i>at its value</i>, that is, as the crystallization of the <i>total quantity of labour</i> bestowed upon it, the capitalist must necessarily sell it at a profit. He sells not only what has cost him an equivalent, but he sells also what has cost him nothing, although it has cost his workman labour. The cost of the commodity to the capitalist and its real cost are different things.
    hash: sha256:4a6ed8ffd541ad2253f5663719be9c55753e2886c91ea906ece7bece5fa4143d
    state: active
  - id: p00051
    type: paragraph
    text: I repeat, therefore, that normal and average profits are made by selling commodities not <i>above</i>, but <i>at their real values</i>.
    hash: sha256:18204cedaba0b319beae332da894a4c84f843ca96f01fc92816ff3a678c1af2a
    state: active
  - id: p00052
    type: heading
    level: 3
    text: XI. The Different Parts into which Surplus Value is Decomposed
    hash: sha256:1808c6ba80cc793234e0e0ff643349001dc4c559dca8416354cae6d481b6b528
    state: active
  - id: p00053
    type: paragraph
    text: The <i>surplus value</i>, or that part of the total value of the commodity in which the <i>surplus labour</i> or <i>unpaid labour</i> of the working man is realized, I call <i>profit</i>. The whole of that profit is not pocketed by the employing capitalist. The monopoly of land enables the landlord to take one part of that <i>surplus value</i>, under the name of <i>rent</i>, whether the land is used for agricultural buildings or railways, or for any other productive purpose. On the other hand, the very fact that the possession of the <i>instruments of labour</i> enables the employing capitalist to produce a <i>surplus value</i>, or, what comes to the same, to <i>appropriate to himself a certain amount of unpaid labour</i>, enables the owner of the means of labour, which he lends wholly or partly to the employing capitalist — enables, in one word, the money-lending capitalist to claim for himself under the name of <i>interest</i> another part of that surplus value, so that there remains to the employing capitalist <i>as such</i> only what is called <i>industrial</i> or <i>commercial profit</i>.
    hash: sha256:0691438786b92150476f3cc38f3c1c8838743a9864b738112614573dfe7730fc
    state: active
  - id: p00054
    type: paragraph
    text: By what laws this division of the total amount of surplus value amongst the three categories of people is regulated is a question quite foreign to our subject. This much, however, results from what has been stated.
    hash: sha256:9223dd11d25306ba16231ffc062d621e7fbf82590367c1ca29c6c5b9d529d163
    state: active
  - id: p00055
    type: paragraph
    text: <i>Rent, interest, and industrial profit</i> are only different names for different parts of the <i>surplus value</i> of the commodity, or the <i>unpaid labour enclosed in it</i>, and they are <i>equally derived from this source and from this source alone</i>. They are not derived from <i>land</i> as such or from <i>capital</i> as such, but land and capital enable their owners to get their respective shares out of the surplus value extracted by the employing capitalist from the labourer. For the labourer himself it is a matter of subordinate importance whether that surplus value, the result of his surplus labour, or unpaid labour, is altogether pocketed by the employing capitalist, or whether the latter is obliged to pay portions of it, under the name of rent and interest, away to third parties. Suppose the employing capitalist to use only his own capital and to be his own landlord, then the whole surplus value would go into his pocket.
    hash: sha256:f42bbb74951ef6f6ba9e1c79655c9b9df29a66fe6b73e933913fb939424064e8
    state: active
  - id: p00056
    type: paragraph
    text: It is the employing capitalist who immediately extracts from the labourer this surplus value, whatever part of it he may ultimately be able to keep for himself. Upon this relation, therefore between the employing capitalist and the wages labourer the whole wages system and the whole present system of production hinge. Some of the citizens who took part in our debate were, there, wrong in trying to mince matters, and to treat this fundamental relation between the employing capitalist and the working man as a secondary question, although they were right in stating that, under given circumstances, a rise of prices might affect in very unequal degrees the employing capitalist, the landlord, the moneyed capitalist, and, if you please, the tax-gatherer.
    hash: sha256:f05efcffbf0d063bc1193c8a5a9d7f406b7bf3e783d69d3250b3480dd061b99d
    state: active
  - id: p00057
    type: paragraph
    text: Another consequence follows from what has been stated.
    hash: sha256:4e5415c03e5277c2e896b7c4bfe880587afbcb6204081fe92eae9ead23666daf
    state: active
  - id: p00058
    type: paragraph
    text: That part of the value of the commodity which represents only the value of the raw materials, the machinery, in one word, the value of the means of production used up, forms <i>no revenue</i> at all, but replaces <i>only capital</i>. But, apart from this, it is false that the other part of the value of the commodity <i>which forms revenue</i>, or may be spent in the form of wages, profits, rent, interest, is <i>constituted</i> by the value of wages, the value of rent, the value of profits, and so forth. We shall, in the first instance, discard wages, and only treat industrial profits, interest, and rent. We have just seen that the <i>surplus value</i> contained in the <i>commodity</i>, or that part of its value in which <i>unpaid labour</i> is realized, resolves itself into different fractions, bearing three different names.
    hash: sha256:914499243a9a6055e216147186a6ca0cef4cd73426055292806f1c48c0091572
    state: active
  - id: p00059
    type: paragraph
    text: But it would be quite the reverse of the truth to say that its value is <i>composed</i> of, or <i>formed</i> by, the <i>addition</i> of the <i>independent values of these three constituents</i>.
    hash: sha256:dc2e2f43ad90b5e17380df5bd4914ddbb450767e4d5f7cf240400ce02a7fc06c
    state: active
  - id: p00060
    type: paragraph
    text: If one hour of labour realizes itself in a value of sixpence, if the working day of the labourer comprises twelve hours, if half of this time is unpaid labour, that surplus labour will add to the commodity a <i>surplus value</i> of three shillings, that is of value for which no equivalent has been paid. This surplus value of three shillings constitutes the <i>whole fund</i> which the employing capitalist may divide, in whatever proportions, with the landlord and the money-lender. The value of these three shillings constitutes the limit of the value they have to divide amongst them. But it is not the employing capitalist who adds to the value of the commodity an arbitrary value for his profit, to which another value is added for the landlord, and so forth, so that the addition of these arbitrarily fixed values would constitute the total value. You see, therefore, the fallacy of the popular notion, which confounds the <i>decomposition of a given value</i> into three parts, with the <i>formation</i> of that value by the addition of three <i>independent</i> values, thus converting the aggregate value, from which rent, profit, and interest are derived, into an arbitrary magnitude.
    hash: sha256:78f5a942aac748a860226087991aa494329c3128855bdebf5580896d8e695ac1
    state: active
  - id: p00061
    type: paragraph
    text: If the total profit realized by a capitalist is equal to 100 Pounds, we call this sum, considered as <i>absolute</i> magnitude, the <i>amount of profit</i>. But if we calculate the ratio which those 100 Pounds bear to the capital advanced, we call this <i>relative</i> magnitude, the <i>rate of profit</i>. It is evident that this rate of profit may be expressed in a double way.
    hash: sha256:6c8f88cb78cabee0c0a40e7872e1396543aecb47c04595c1a6b499305f985cfc
    state: active
  - id: p00062
    type: paragraph
    text: Suppose 100 Pounds to be the capital <i>advanced in wages</i>. If the surplus value created is also 100 Pounds — and this would show us that half the working day of the labourer consists of <i>unpaid</i> labour — and if we measured this profit by the value of the capital advanced in wages, we should say that the <i>rate of profit</i> amounted to one hundred percent, because the value advanced would be one hundred and the value realized would be two hundred.
    hash: sha256:9edcbb2579defb60057c6cb114f775fd856950befc1dd1e9e916634d50554413
    state: active
  - id: p00063
    type: paragraph
    text: If, on the other hand, we should not only consider the <i>capital advanced in wages</i>, but the <i>total capital</i> advanced, say, for example, 500 Pounds, of which 400 Pounds represented the value of raw materials, machinery, and so forth, we should say that the <i>rate of profit</i> amounted only to twenty percent, because the profit of one hundred would be but the fifth part of the <i>total</i> capital advanced.
    hash: sha256:685ea10dc1761fb0f2bf888a4c4d18a76b55224c5160e5364b17931ad81c9138
    state: active
  - id: p00064
    type: paragraph
    text: The first mode of expressing the rate of profit is the only one which shows you the real ratio between paid and unpaid labour, the real degree of the <i>exploitation</i> (you must allow me this French word) <i>of labour</i>. The other mode of expression is that in common use, and is, indeed, appropriate for certain purposes. At all events, it is very useful for concealing the degree in which the capitalist extracts gratuitous labour from the workman.
    hash: sha256:2795d2c26a2c0aef6bf72a8d7f7b6f8e79deca00410573410a35f19c6c695a37
    state: active
  - id: p00065
    type: paragraph
    text: In the remarks I have still to make I shall use the word <i>profit</i> for the whole amount of the surplus value extracted by the capitalist without any regard to the division of that surplus value between different parties, and in using the words <i>rate of profit</i>, I shall always measure profits by the value of the capital advanced in wages.
    hash: sha256:384d82d5618289ac9ba7c40f82d81c5f27de93f87c77099545a28c8ce60ec9de
    state: active
