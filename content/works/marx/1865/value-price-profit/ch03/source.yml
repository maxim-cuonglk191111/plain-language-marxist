    level: 3
    text: XII. General Relation of Profits, Wages, and Prices
    hash: sha256:673b3a77585988fe93b3bcdebfbc2eb73f92b7f023bba645a49520ef5eb1e688
    state: active
  - id: p00002
    type: paragraph
    text: Deduct from the value of a commodity the value replacing the value of the raw materials and other means of production used upon it, that is to say, deduct the value representing the <i>past</i> labour contained in it, and the remainder of its value will resolve into the quantity of labour added by the working man <i>last</i> employed. If that working man works twelve hours daily, if twelve hours of average labour crystallize themselves in an amount of gold equal to six shillings, this additional value of six shillings is the <i>only</i> value his labour will have created. This given value, determined by the time of his labour, is the only fund from which both he and the capitalist have to draw their respective shares or dividends, the only value to be divided into wages and profits. It is evident that this value itself will not be altered by the variable proportions in which it may be divided amongst the two parties. There will also be nothing changed if in the place of one working man you put the whole working population, twelve million working days, for example, instead of one.
    hash: sha256:b73ca62e7e15c0b25fcfcfd4ade45e878eac6cc48bc89a2f736ace1fe989f501
    state: active
  - id: p00003
    type: paragraph
    text: Since the capitalist and workman have only to divide this limited value, that is, the value measured by the total labour of the working man, the more the one gets the less will the other get, and <i>vice versa</i>. Whenever a quantity is given, one part of it will increase inversely as the other decreases. If the wages change, profits will change in an opposite direction. If wages fall, profits will rise; and if wages rise, profits will fall. If the working man, on our former supposition, gets three shillings, equal to one half of the value he has created, or if his whole working day consists half of paid, half of unpaid labour, the <i>rate of profit</i> will be 100 percent, because the capitalist would also get three shillings. If the working man receives only two shillings, or works only one third of the whole day for himself, the capitalist will get four shillings, and the rate of profit will be 200 per cent. If the working man receives four shillings, the capitalist will only receive two, and the rate of profit would sink to 50 percent, but all these variations will not affect the value of the commodity. A general rise of wages would, therefore, result in a fall of the general rate of profit, but not affect values.
    hash: sha256:6478b58b7e06124a7fc1bc3a8030658665ce57b0d20880d24a8fac820717d7e3
    state: active
  - id: p00004
    type: paragraph
    text: But although the values of commodities, which must ultimately regulate their market prices, are exclusively determined by the total quantities of labour fixed in them, and not by the division of that quantity into paid and unpaid labour, it by no means follows that the values of the single commodities, or lots of commodities, produced during twelve hours, for example, will remain constant. The <i>number</i> or mass of commodities produced in a given time of labour, or by a given quantity of labour, depends upon the <i>productive power</i> of the labour employed, and not upon its <i>extent</i> or length. With one degree of the productive power of spinning labour, for example, a working day of twelve hours may produce twelve pounds of yarn, with a lesser degree of productive power only two pounds. If then twelve hours' average labour were realized in the value of six shillings in the one case, the twelve pounds of yarn would cost six shillings, in the other case the two pounds of yarn would also cost six shillings. One pound of yarn would, therefore, cost sixpence in the one case, and three shillings in the other. The difference of price would result from the difference in the productive powers of labour employed. One hour of labour would be realized in one pound of yarn with the greater productive power, while with the smaller productive power, six hours of labour would be realized in one pound of yarn. The price of a pound of yarn would, in the one instance, be only sixpence, although wages were relatively high and the rate of profit low; it would be three shillings in the other instance, although wages were low and the rate of profit high. This would be so because the price of the pound of yarn is regulated by the <i>total amount of labour worked up in it</i>, and not by the <i>proportional division of that total amount into paid and unpaid labour</i>. The fact I have mentioned before that high-price labour may produce cheap, and low-priced labour may produce dear commodities, loses, therefore, its paradoxical appearance. It is only the expression of the general law that the value of a commodity is regulated by the quantity of labour worked up in it, and the quantity of labour worked up in it depends altogether upon the productive powers of labour employed, and will therefore, vary with every variation in the productivity of labour.
    hash: sha256:1d0362caf7165c8c2614bc5c07324beb0d8acff4fe08872fa54848aba475e7b4
    state: active
  - id: p00005
    type: heading
    level: 3
    text: XIII. Main Cases of Attempts at Raising Wages or Resisting their Fall
    hash: sha256:79bf60230dae9f8d1a75a89ce771eae5da6b3c27942a31d703832d6c21f6b0df
    state: active
  - id: p00006
    type: paragraph
    text: Let us now seriously consider the main cases in which a rise of wages is attempted or a reduction of wages resisted.
    hash: sha256:c633860df0e4ec4d85b6ed20acd426b6fb1b9b53328a0e95d698645a87bdc858
    state: active
  - id: p00007
    type: paragraph
    text: 1. We have seen that the <i>value of the labouring power</i>, or in more popular parlance, the <i>value of labour</i>, is determined by the value of necessaries, or the quantity of labour required to produce them.
    hash: sha256:49218f8bb1fb22bdddff98464b5814136022c23550e13e79326ebf49af04f2d3
    state: active
  - id: p00008
    type: paragraph
    text: If, then, in a given country the value of the daily average necessaries of the labourer represented six hours of labour expressed in three shillings, the labourer would have to work six hours daily to produce an equivalent for this daily maintenance. If the whole working day was twelve hours, the capitalist would pay him the value of his labour by paying him three shillings. Half the working day would be unpaid labour, and the rate of profit would amount to 100 percent. But now suppose that, consequent upon a decrease of productivity, more labour should be wanted to produce, say, the same amount of agricultural produce, so that the price of the average daily necessaries should rise from three to four shillings. In that case the <i>value</i> of labour would rise by one third, or 33 1/3 percent. Eight hours of the working day would be required to produce an equivalent for the daily maintenance of the labourer, according to his old standard of living. The surplus labour would therefore sink from six hours to four, and the rate of profit from 100 to 50 percent. But in insisting upon a rise of wages, the labourer would only insist upon getting the <i>increased value of his labour</i>, like every other seller of a commodity, who, the costs of his commodities having increased, tries to get its increased value paid. If wages did not rise, or not sufficiently rise, to compensate for the increased values of necessaries, the <i>price</i> of labour would sink below the <i>value of labour</i>, and the labourer's standard of life would deteriorate.
    hash: sha256:e1ddffdd266b4466029eedffd816501a1396f5746b7882e74886b5568866b187
    state: active
  - id: p00009
    type: paragraph
    text: But a change might also take place in an opposite direction. By virtue of the increased productivity of labour, the same amount of the average daily necessaries might sink from three to two shillings, or only four hours out of the working day, instead of six, be wanted to reproduce an equivalent for the value of the daily necessaries. The working man would now be able to buy with two shillings as many necessaries as he did before with three shillings. Indeed, the <i>value of labour</i> would have sunk, but diminished value would command the same amount of commodities as before. Then profits would rise from three to four shillings, and the rate of profit from 100 to 200 percent. Although the labourer's absolute standard of life would have remained the same, his <i>relative</i> wages, and therewith his relative social position, as compared with that of the capitalist, would have been lowered. If the working man should resist that reduction of relative wages, he would only try to get some share in the increased productive powers of his own labour, and to maintain his former relative position in the social scale. Thus, after the abolition of the Corn Laws, and in flagrant violation of the most solemn pledges given during the anti-corn law agitation, the English factory lords generally reduced wages ten per cent. The resistance of the workmen was at first baffled, but, consequent upon circumstances I cannot now enter upon, the ten per cent lost were afterwards regained.
    hash: sha256:ce9c71bdc3bcf5935bf46c18a1740b3bfc6e9201bd9e847f5b558fbaa873cb49
    state: active
  - id: p00010
    type: paragraph
    text: 2. The <i>values</i> of necessaries, and consequently the <i>value of labour</i>, might remain the same, but a change might occur in their <i>money prices</i>, consequent upon a previous change in the <i>value of money</i>. By the discovery of more fertile mines and so forth, two ounces of gold might, for example, cost no more labour to produce than one ounce did before. The <i>value</i> of gold would then be depreciated by one half, or fifty per cent. As the <i>values</i> of all other commodities would then be expressed in twice their former <i>money prices</i>, so also the same with the <i>value of labour</i>. Twelve hours of labour, formerly expressed in six shillings, would now be expressed in twelve shillings. If the working man's wages should remain three shillings, instead of rising to six shillings, the <i>money price of his labour</i> would only be equal to <i>half the value of his labour</i>, and his standard of life would fearfully deteriorate. This would also happen in a greater or lesser degree if his wages should rise, but not proportionately to the fall in the value of gold. In such a case nothing would have been changed, either in the productive powers of labour, or in supply and demand, or in values.
    hash: sha256:0c22fe567e6bcf4f3dbd88a92f4bc0bd0b0c768da4d6ce5058690b32b54f3927
    state: active
  - id: p00011
    type: paragraph
    text: Nothing would have changed except the money <i>names</i> of those values. To say that in such a case the workman ought not to insist upon a proportionate rise of wages, is to say that he must be content to be paid with names, instead of with things. All past history proves that whenever such a depreciation of money occurs, the capitalists are on the alert to seize this opportunity for defrauding the workman. A very large school of political economists assert that, consequent upon the new discoveries of gold lands, the better working of silver mines, and the cheaper supply of quicksilver, the value of precious metals has again depreciated. This would explain the general and simultaneous attempts on the Continent at a rise of wages.
    hash: sha256:02bd9853c2bdff1dbd14dbe77f492ab22f2a5964007475e31bf95dd590e78a48
    state: active
  - id: p00012
    type: paragraph
    text: 3. We have till now supposed that the <i>working day</i> has given limits. The working day, however, has, by itself, no constant limits. It is the constant tendency of capital to stretch it to its utmost physically possible length, because in the same degree surplus labour, and consequently the profit resulting therefrom, will be increased. The more capital succeeds in prolonging the working day, the greater the amount of other peoples' labour it will appropriate.
    hash: sha256:7040710cb3043ea76d6f21c783b51403875a78b4735325df99376c17f7e29197
    state: active
  - id: p00013
    type: paragraph
    text: During the seventeenth and even the first two thirds of the eighteenth century a ten hours' working day was the normal working day all over England. During the anti-Jacobin war, which was in fact a war waged by the British barons against the British working masses, capital celebrated its bacchanalia, and prolonged the working day from ten to twelve, fourteen, eighteen hours. Malthus, by no means a man whom you would suspect of a maudlin sentimentalism declared in a pamphlet, published about 1815, that if this sort of thing was to go on the life of the nation would be attacked at its very source. A few years before the general introduction of newly-invented machinery, about 1765, a pamphlet appeared in England under the title, <i>An Essay On Trade</i>. The anonymous author, an avowed enemy of the working classes, declaims on the necessity of expanding the limits of the working day. Amongst other means to this end, he proposes <i>working houses</i>, which, he says, ought to be “Houses of Terror.” And what is the length of the working he prescribes for these “Houses of Terror"? <i>Twelve hours</i>, the very same time which in 1832 was declared by capitalists, political economists, and ministers to be not only the existing but the necessary time of labour for a child under twelve years.
    hash: sha256:40ab822a12797a4aca86fb99e59a24ebd0d3547c0d0ee0cde3605e369dcf8968
    state: active
  - id: p00014
    type: paragraph
    text: By selling his labouring power, and he must do so under the present system, the working man makes over to the capitalist the consumption of that power, but within certain rational limits. He sells his labouring power in order to maintain it, apart from its natural wear and tear, but not to destroy it. In selling his labouring power at its daily or weekly value, it is understood that in one day or one week that labouring power shall not be submitted to two days' or two weeks' waste or wear and tear. Take a machine worth 1000 Pounds. If it is used up in ten years it will add to the value of the commodities in whose production it assists 100 Pounds yearly. If it is used up in five years it will add 200 Pounds yearly, or the value of its annual wear and tear is in inverse ratio to the quickness with which it is consumed. But this distinguishes the working man from the machine. Machinery does not wear out exactly in the same ratio in which it is used. Man, on the contrary, decays in a greater ratio than would be visible from the mere numerical addition of work.
    hash: sha256:3c25558a4a4c670428856388150ad49112361368ac6c257d5fdce03e0e4dafc8
    state: active
  - id: p00015
    type: paragraph
    text: In their attempts at reducing the working day to its former rational dimensions, or, where they cannot enforce a legal fixation of a normal working day, at checking overwork by a rise of wages, a rise not only in proportion to the surplus time exacted, but in a greater proportion, working men fulfill only a duty to themselves and their race. They only set limits to the tyrannical usurpations of capital. Time is the room of human development. A man who has no free time to dispose of, whose whole lifetime, apart from the mere physical interruptions by sleep, meals, and so forth, is absorbed by his labour for the capitalist, is less than a beast of burden. He is a mere machine for producing Foreign Wealth, broken in body and brutalized in mind. Yet the whole history of modern industry shows that capital, if not checked, will recklessly and ruthlessly work to cast down the whole working class to this utmost state of degradation.
    hash: sha256:88b2d0355d100900883355d6c3dcd9c25aa340406316c62ece6dec60fc15d511
    state: active
  - id: p00016
    type: paragraph
    text: In prolonging the working day the capitalist may pay <i>higher wages</i> and still lower the <i>value of labor</i>, if the rise of wages does not correspond to the greater amount of labour extracted, and the quicker decay of the labouring power thus caused. This may be done in another way. Your middle-class statisticians will tell you, for instance, that the average wages of factory families in Lancashire has risen. They forget that instead of the labour of the man, the head of the family, his wife and perhaps three or four children are now thrown under the Juggernaut wheels of capital, and that the rise of the aggregate wages does not correspond to the aggregate surplus labour extracted from the family.
    hash: sha256:7b6cf7e528ba633752664b6c781f2b574961d927512c41b5660347b673b3c7bd
    state: active
  - id: p00017
    type: paragraph
    text: Even with given limits of the working day, such as they now exist in all branches of industry subjected to the factory laws, a rise of wages may become necessary, if only to keep up the old standard <i>value of labour</i>. By increasing the <i>intensity</i> of labour, a man may be made to expend as much vital force in one hour as he formerly did in two. This has, to a certain degree, been effected in the trades, placed under the Factory Acts, by the acceleration of machinery, and the greater number of working machines which a single individual has now to superintend. If the increase in the intensity of labour or the mass of labour spent in an hour keeps some fair proportion to the decrease in the extent of the working day, the working man will still be the winner. If this limit is overshot, he loses in one form what he has gained in another, and ten hours of labour may then become as ruinous as twelve hours were before. In checking this tendency of capital, by struggling for a rise of wages corresponding to the rising intensity of labour, the working man only resists the depreciation of his labour and the deterioration of his race.
    hash: sha256:8cc2a7d57648b746e5513a644364ba9adcba1840bf847721e7982b12faa84a94
    state: active
  - id: p00018
    type: paragraph
    text: 4. All of you know that, from reasons I have not now to explain, capitalistic production moves through certain periodical cycles. It moves through a state of quiescence, growing animation, prosperity, overtrade, crisis, and stagnation. The market prices of commodities, and the market rates of profit, follow these phases, now sinking below their averages, now rising above them.
    hash: sha256:0a0b42573c3377076e34f385c4d9e4b84aefb25e91b4c6101936514fe52de2ee
    state: active
  - id: p00019
    type: paragraph
    text: Considering the whole cycle, you will find that one deviation of the market price is being compensated by the other, and that, taking the average of the cycle, the market prices of commodities are regulated by their values. Well! During the phases of sinking market prices and the phases of crisis and stagnation, the working man, if not thrown out of employment altogether, is sure to have his wages lowered. Not to be defrauded, he must, even with such a fall of market prices, debate with the capitalist in what proportional degree a fall of wages has become necessary. If, during the phases of prosperity, when extra profits are made, he did not battle for a rise of wages, he would, taking the average of one industrial cycle, not even receive his <i>average wages</i>, or the <i>value</i> of his labour. It is the utmost height of folly to demand, that while his wages are necessarily affected by the adverse phases of the cycle, he should exclude himself from compensation during the prosperous phases of the cycle. Generally, the <i>values</i> of all commodities are only realized by the compensation of the continuously changing market prices, springing from the continuous fluctuations of demand and supply. On the basis of the present system labour is only a commodity like others. It must, therefore, pass through the same fluctuations to fetch an average price corresponding to its value.
    hash: sha256:1c5047725290cd7141381e5f9a60d32356254989318a6126745f733aea15e452
    state: active
  - id: p00020
    type: paragraph
    text: It would be absurd to treat it on the one hand as a commodity, and to want on the other hand to exempt it from the laws which regulate the prices of commodities. The slave receives a permanent and fixed amount of maintenance; the wage-labourer does not. He must try to get a rise of wages in the one instance, if only to compensate for a fall of wages in the other. If he resigned himself to accept the will, the dictates of the capitalist as a permanent economical law, he would share in all the miseries of the slave, without the security of the slave.
    hash: sha256:2efad8078bb15d867a1195056b9ad1a52867c46b625bc778bc15048e547c5157
    state: active
  - id: p00021
    type: paragraph
    text: 5. In all the cases I have considered, and they form ninety-nine out of a hundred, you have seen that a struggle for a rise of wages follows only in the track of <i>previous</i> changes, and is the necessary offspring of previous changes in the amount of production, the productive powers of labour, the value of labour, the value of money, the extent or the intensity of labour extracted, the fluctuations of market prices, dependent upon the fluctuations of demand and supply, and consistent with the different phases of the industrial cycle; in one word, as reactions of labour against the previous action of capital. By treating the struggle for a rise of wages independently of all these circumstances, by looking only upon the change of wages, and overlooking all other changes from which they emanate, you proceed from a false premise in order to arrive at false conclusions.
    hash: sha256:8f764ce81e8cbbe17d7b03fd2a51f2ec9daa11cdc3294e10dbe7a35a48a9205a
    state: active
  - id: p00022
    type: heading
    level: 3
    text: XIV. The Struggle Between Capital and Labour and its Results
    hash: sha256:bc64bf40fe07cf79dc8252f031a12786972c94241a7cdea977f59af5d580a21b
    state: active
  - id: p00023
    type: paragraph
    text: 1. Having shown that the periodical resistance on the part of the working men against a reduction of wages, and their periodical attempts at getting a rise of wages, are inseparable from the wages system, and dictated by the very fact of labour being assimilated to commodities, and therefore subject to the laws, regulating the general movement of prices; having furthermore, shown that a general rise of wages would result in a fall in the general rate of profit, but not affect the average prices of commodities, or their values, the question now ultimately arises, how far, in this incessant struggle between capital and labour, the latter is likely to prove successful.
    hash: sha256:ad589c44de9cbcf6eb9edc495fe13fe87b0c2a0653f7aae9c59a7ce0a756c1a2
    state: active
  - id: p00024
    type: paragraph
    text: I might answer by a generalization, and say that, as with all other commodities, so with labour, its <i>market price</i> will, in the long run, adapt itself to its <i>value</i>; that, therefore, despite all the ups and downs, and do what he may, the working man will, on an average, only receive the value of his labour, which resolves into the value of his labouring power, which is determined by the value of the necessaries required for its maintenance and reproduction, which value of necessaries finally is regulated by the quantity of labour wanted to produce them.
    hash: sha256:131b77eef5eacde7e9435c26c57483e3c09b2213abc605da8d1fdb01395ee5cf
    state: active
  - id: p00025
    type: paragraph
    text: But there are some peculiar features which distinguish the <i>value of the labouring power, or the value of labour</i>, from the values of all other commodities. The value of the labouring power is formed by two elements -- the one merely physical, the other historical or social. Its <i>ultimate limit</i> is determined by the <i>physical</i> element, that is to say, to maintain and reproduce itself, to perpetuate its physical existence, the working class must receive the necessaries absolutely indispensable for living and multiplying. The <i>value</i> of those indispensable necessaries forms, therefore, the ultimate limit of the <i>value of labour</i>. On the other hand, the length of the working day is also limited by ultimate, although very elastic boundaries. Its ultimate limit is given by the physical force of the labouring man. If the daily exhaustion of his vital forces exceeds a certain degree, it cannot be exerted anew, day by day.
    hash: sha256:85bf4401d579682eb219d05bc36a6ea85e417a8169baf353f3143763b1dbe00e
    state: active
  - id: p00026
    type: paragraph
    text: However, as I said, this limit is very elastic. A quick succession of unhealthy and short-lived generations will keep the labour market as well supplied as a series of vigorous and long-lived generations. Besides this mere physical element, the value of labour is in every country determined by a <i>traditional standard of life</i>. It is not mere physical life, but it is the satisfaction of certain wants springing from the social conditions in which people are placed and reared up. The English standard of life may be reduced to the Irish standard; the standard of life of a German peasant to that of a Livonian peasant. The important part which historical tradition and social habitude play in this respect, you may learn from Mr. Thornton's work on <i>over-population</i>, where he shows that the average wages in different agricultural districts of England still nowadays differ more or less according to the more or less favourable circumstances under which the districts have emerged from the state of serfdom.
    hash: sha256:d8bde5ced8edc8cb81aaca800ce74b4340e9cf664d7811d45fa62e32fae3020e
    state: active
  - id: p00027
    type: paragraph
    text: This historical or social element, entering into the value of labour, may be expanded, or contracted, or altogether extinguished, so that nothing remains but the <i>physical limit</i>. During the time of the anti-Jacobin war, undertaken, as the incorrigible tax-eater and sinecurist, old George Rose, used to say, to save the comforts of our holy religion from the inroads of the French infidels, the honest English farmers, so tenderly handled in a former chapter of ours, depressed the wages of the agricultural labourers even beneath that <i>mere physical minimum</i>, but made up by Poor Laws the remainder necessary for the physical perpetuation of the race. This was a glorious way to convert the wages labourer into a slave, and Shakespeare's proud yeoman into a pauper.
    hash: sha256:80bd4dff0937a255abc7c187bf5bae00200d4d8fc2f3806f055e45eeb4bce2a9
    state: active
  - id: p00028
    type: paragraph
    text: By comparing the standard wages or values of labour in different countries, and by comparing them in different historical epochs of the same country, you will find that the <i>value of labour</i> itself is not a fixed but a variable magnitude, even supposing the values of all other commodities to remain constant.
    hash: sha256:589e6e96ab4d1f25af240e8e4706b78210d16326937f0ff79ea04926559be3b2
    state: active
  - id: p00029
    type: paragraph
    text: A similar comparison would prove that not only the <i>market rates</i> of profit change, but its <i>average</i> rates.
    hash: sha256:8060352abcb76aa4e4cce7f1596e67f8a22fd81a38088a92195d0055af895834
    state: active
  - id: p00030
    type: paragraph
    text: But as to <i>profits</i>, there exists no law which determines their <i>minimum</i>. We cannot say what is the ultimate limit of their decrease. And why cannot we fix that limit? Because, although we can fix the <i>minimum</i> of wages, we cannot fix their <i>maximum</i>.
    hash: sha256:3784a6f2169d235f38ffa7632e873a8da494ad419386e68412131723a90a027e
    state: active
  - id: p00031
    type: paragraph
    text: We can only say that, the limits of the working day being given, the <i>maximum of profit</i> corresponds to the <i>physical minimum of wages</i>; and that wages being given, the <i>maximum of profit</i> corresponds to such a prolongation of the working day as is compatible with the physical forces of the labourer. The maximum of profit is therefore limited by the physical minimum of wages and the physical maximum of the working day. It is evident that between the two limits of the <i>maximum rate of profit</i> an immense scale of variations is possible. The fixation of its actual degree is only settled by the continuous struggle between capital and labour, the capitalist constantly tending to reduce wages to their physical minimum, and to extend the working day to its physical maximum, while the working man constantly presses in the opposite direction.
    hash: sha256:05b63f7bfbda033c9ddb831f484d30ee6a143ae47ba8384f547df62e4403819a
    state: active
  - id: p00032
    type: paragraph
    text: The matter resolves itself into a question of the respective powers of the combatants.
    hash: sha256:825643e13fb42d0adc72aedf0ddf606cf2708d8e0aad33a4e66cbbb0af15b2fa
    state: active
  - id: p00033
    type: paragraph
    text: 2. As to the <i>limitation of the working day</i> in England, as in all other countries, it has never been settled except by <i>legislative interference</i>. Without the working men's continuous pressure from without that interference would never have taken place. But at all events, the result was not to be attained by private settlement between the working men and the capitalists. This very necessity of <i>general political action</i> affords the proof that in its merely economical action capital is the stronger side.
    hash: sha256:557777c78eeafc6c1823f993ebc4768fc4146e0d4ccc3515b06287518b07480c
    state: active
  - id: p00034
    type: paragraph
    text: As to the <i>limits</i> of the <i>value of labour</i>, its actual settlement always depends upon supply and demand, I mean the demand for labour on the part of capital, and the supply of labour by the working men. In colonial countries the law of supply and demand favours the working man. Hence the relatively high standard of wages in the United States. Capital may there try its utmost. It cannot prevent the labour market from being continuously emptied by the continuous conversion of wages labourers into independent, self-sustaining peasants. The position of a wages labourer is for a very large part of the American people but a probational state, which they are sure to leave within a longer or shorter term. To mend this colonial state of things the paternal British Government accepted for some time what is called the modern colonization theory, which consists in putting an artificial high price upon colonial land, in order to prevent the too quick conversion of the wages labourer into the independent peasant.
    hash: sha256:b328c5e381e6f4cff52c210a4582e5a4a72f45c32c0c287514f9843aee74d57c
    state: active
  - id: p00035
    type: paragraph
    text: But let us now come to old civilized countries, in which capital domineers over the whole process of production. Take, for example, the rise in England of agricultural wages from 1849 to 1859. What was its consequence? The farmers could not, as our friend Weston would have advised them, raise the value of wheat, nor even its market prices. They had, on the contrary, to submit to their fall. But during these eleven years they introduced machinery of all sorts, adopted more scientific methods, converted part of arable land into pasture, increased the size of farms, and with this the scale of production, and by these and other processes diminishing the demand for labour by increasing its productive power, made the agricultural population again relatively redundant. This is the general method in which a reaction, quicker or slower, of capital against a rise of wages takes place in old, settled countries. Ricardo has justly remarked that machinery is in constant competition with labour, and can often be only introduced when the price of labour has reached a certain height, but the appliance of machinery is but one of the many methods for increasing the productive powers of labour. The very same development which makes common labour relatively redundant simplifies, on the other hand, skilled labour, and thus depreciates it.
    hash: sha256:2b49b28949a56c17938c4d127a18a04669a11e7f28662b70b852309a4a480e95
    state: active
  - id: p00036
    type: paragraph
    text: The same law obtains in another form. With the development of the productive powers of labour the accumulation of capital will be accelerated, even despite a relatively high rate of wages. Hence, one might infer, as Adam Smith, in whose days modern industry was still in its infancy, did infer, that the accelerated accumulation of capital must turn the balance in favour of the working man, by securing a growing demand for his labour. From this same standpoint many contemporary writers have wondered that English capital having grown in that last twenty years so much quicker than English population, wages should not have been more enhanced. But simultaneously with the progress of accumulation there takes place a <i>progressive change in the composition of capital</i>. That part of the aggregate capital which consists of fixed capital, machinery, raw materials, means of production in all possible forms, progressively increases as compared with the other part of capital, which is laid out in wages or in the purchase of labour. This law has been stated in a more or less accurate manner by Mr. Barton, Ricardo, Sismondi, Professor Richard Jones, Professor Ramsey, Cherbuilliez, and others.
    hash: sha256:4a847f62c97caa011ec4ae62d29dcc9dd53555cd6a3bef6bd9087eb38ecb7311
    state: active
  - id: p00037
    type: paragraph
    text: If the proportion of these two elements of capital was originally one to one, it will, in the progress of industry, become five to one, and so forth. If of a total capital of 600, 300 is laid out in instruments, raw materials, and so forth, and 300 in wages, the total capital wants only to be doubled to create a demand for 600 working men instead of for 300. But if of a capital of 600, 500 is laid out in machinery, materials, and so forth and 100 only in wages, the same capital must increase from 600 to 3,600 in order to create a demand for 600 workmen instead of 300. In the progress of industry the demand for labour keeps, therefore, no pace with the accumulation of capital. It will still increase, but increase in a constantly diminishing ratio as compared with the increase of capital.
    hash: sha256:13b19292cef6ea2d88fe89e52fb0d1f1c9a40dee48187b5d13aed427343fb06f
    state: active
  - id: p00038
    type: paragraph
    text: These few hints will suffice to show that the very development of modern industry must progressively turn the scale in favour of the capitalist against the working man, and that consequently the general tendency of capitalistic production is not to raise, but to sink the average standard of wages, or to push the <i>value of labour</i> more or less to its <i>minimum limit</i>. Such being the tendency of <i>things</i> in this system, is this saying that the working class ought to renounce their resistance against the encroachments of capital, and abandon their attempts at making the best of the occasional chances for their temporary improvement? If they did, they would be degraded to one level mass of broken wretches past salvation. I think I have shown that their struggles for the standard of wages are incidents inseparable from the whole wages system, that in 99 cases out of 100 their efforts at raising wages are only efforts at maintaining the given value of labour, and that the necessity of debating their price with the capitalist is inherent to their condition of having to sell themselves as commodities. By cowardly giving way in their everyday conflict with capital, they would certainly disqualify themselves for the initiating of any larger movement.
    hash: sha256:d8ef93594844cef36a212ae10254557f8fde9236464b16c99e1f1d71b991f8b4
    state: active
  - id: p00039
    type: paragraph
    text: "At the same time, and quite apart from the general servitude involved in the wages system, the working class ought not to exaggerate to themselves the ultimate working of these everyday struggles. They ought not to forget that they are fighting with effects, but not with the causes of those effects; that they are retarding the downward movement, but not changing its direction; that they are applying palliatives, not curing the malady. They ought, therefore, not to be exclusively absorbed in these unavoidable guerilla fights incessantly springing up from the never ceasing encroachments of capital or changes of the market. They ought to understand that, with all the miseries it imposes upon them, the present system simultaneously engenders the <i>material conditions</i> and the <i>social forms</i> necessary for an economical reconstruction of society. Instead of the <i>conservative</i> motto: “<i>A fair day's wage for a fair day's work!</i>” they ought to inscribe on their banner the <i>revolutionary</i> watchword: “<i>Abolition of the wages system!</i>\""
    hash: sha256:20786ed8d440583bfc526518c428bda6570c6106162dbe9c8d9a58abaa4ef4b6
    state: active
  - id: p00040
    type: paragraph
    text: "After this very long and, I fear, tedious exposition, which I was obliged to enter into to do some justice to the subject matter, I shall conclude by proposing the following resolutions:"
    hash: sha256:1173137b977edd6a7b397c6885cda0c06b4bc9f88dd755b50f4b8af9d83dd768
    state: active
  - id: p00041
    type: paragraph
    text: <i>Firstly.</i> A general rise in the rate of wages would result in a fall of the general rate of profit, but, broadly speaking, not affect the prices of commodities.
    hash: sha256:8b480f0ab8f9eba7575bb61486fdd48aee6f6c07757886fb3f0da11dbd5dadba
    state: active
  - id: p00042
    type: paragraph
    text: <i>Secondly.</i> The general tendency of capitalist production is not to raise, but to sink the average standard of wages.
    hash: sha256:528a313d61224015e95c5e2cf8f0a2180b50e6755d3b43532f0e16f83e802e80
    state: active
  - id: p00043
    type: paragraph
    text: <i>Thirdly.</i> Trades Unions work well as centers of resistance against the encroachments of capital. They fail partially from an injudicious use of their power. They fail generally from limiting themselves to a guerilla war against the effects of the existing system, instead of simultaneously trying to change it, instead of using their organized forces as a lever for the final emancipation of the working class that is to say the ultimate abolition of the wages system.
    hash: sha256:18bc72564b31fac933d870316287813b6591f46402060391461c589564e64c54
    state: active
