  - id: p00190
    type: footnote
    label: A
    text: The following passage occurred only in the first edition.<br/><br/>Now we know the <i>substance</i> of value. It is <i>labour</i>. We know the <i>measure of its magnitude</i>. It is <i>labour time</i>. The <i>form</i>, which stamps <i>value</i> as <i>exchange-value</i>, remains to be analysed. But before this we need to develop the characteristics we have already found somewhat more fully.<br/><br/>Taken from the Penguin edition of <i>Capital</i>, translated by Ben Fowkes.
    hash: sha256:7fdd989ee61e567f1cdf0eaea7e80f1ba306f0065e423ed838e103351d480af1
    state: active
  - id: p00191
    type: footnote
    label: "12"
    text: I am inserting the parenthesis because its omission has often given rise to the misunderstanding that every product that is consumed by some one other than its producer is considered in Marx a commodity. [Engels, 4th German Edition]
    hash: sha256:32fc47082a2ca6cca0ae4df4a1769a1f2c703bc00203266ee83983d1959edc73
    state: active
  - id: p00192
    type: footnote
    label: "13"
    text: "Tutti i fenomeni dell’universo, sieno essi prodotti della mano dell’uomo, ovvero delle universali leggi della fisica, non ci danno idea di attuale creazione, ma unicamente di una modificazione della materia. Accostare e separare sono gli unici elementi che l’ingegno umano ritrova analizzando l’idea della riproduzione: e tanto è riproduzione di valore (value in use, although Verri in this passage of his controversy with the Physiocrats is not himself quite certain of the kind of value he is speaking of) e di ricchezze se la terra, l’aria e l’acqua ne’ campi si trasmutino in grano, come se colla mano dell’uomo il glutine di un insetto si trasmuti in velluto ovvero alcuni pezzetti di metalio si organizzino a formare una ripetizione.” [“All the phenomena of the universe, whether produced by the hand of man or through the universal laws of physics, are not actual new creations, but merely a modification of matter. Joining together and separating are the only elements which the human mind always finds on analysing the concept of reproduction.’ and it is just the same with the reproduction of value” (value in use, although Verri in this passage of his controversy with the Physiocrats is not himself quite certain of the kind of value he is speaking of) “and of wealth, when earth, air and water in the fields are transformed into corn, or when the hand of man transforms the secretions of an insect into silk, or some pieces of metal are arranged to make the mechanism of a watch.”] – Pietro Verri, “Meditazioni sulla Economia Politica” [first printed in 1773] in Custodi’s edition of the Italian Economists, Parte Moderna, t. XV., p. 22."
    hash: sha256:c0d9a9d083fca0da7e06802fc48f4bcb657672a007c74e1a51282aea3064d020
    state: active
  - id: p00193
    type: footnote
    label: "14"
    text: Comp. Hegel, “Philosophie des Rechts.” Berlin, 1840. p. 250.
    hash: sha256:3b802f5a1c848490887590285228df086dd6c4a40a572858b8b5d59cc9a07831
    state: active
  - id: p00194
    type: footnote
    label: "15"
    text: The reader must note that we are not speaking here of the wages or value that the labourer gets for a given labour time, but of the value of the commodity in which that labour time is materialised. Wages is a category that, as yet, has no existence at the present stage of our investigation.
    hash: sha256:4c25add91a42987b9ea37f75579f6470d29f6d5e64c760ffd734e5176d095c9a
    state: active
  - id: p00195
    type: footnote
    label: "16"
    text: In order to prove that labour alone is that all-sufficient and real measure, by which at all times the value of all commodities can be estimated and compared, Adam Smith says, “Equal quantities of labour must at all times and in all places have the same value for the labourer. In his normal state of health, strength, and activity, and with the average degree of skill that he may possess, he must always give up the same portion of his rest, his freedom, and his happiness.” (“Wealth of Nations,” b. I. ch. V.) On the one hand Adam Smith here (but not everywhere) confuses the determination of value by means of the quantity of labour expended in the production of commodities, with the determination of the values of commodities by means of the value of labour, and seeks in consequence to prove that equal quantities of labour have always the same value. On the other hand he has a presentiment, that labour, so far as it manifests itself in the value of commodities, counts only as expenditure of labour power, but he treats this expenditure as the mere sacrifice of rest, freedom, and happiness, not as at the same time the normal activity of living beings. But then, he has the modern wage-labourer in his eye. Much more aptly, the anonymous predecessor of Adam Smith, quoted above in Note 1, p. 39 [note 9 etext]. says “one man has employed himself a week in providing this necessary of life ... and he that gives him some other in exchange cannot make a better estimate of what is a proper equivalent, than by computing what cost him just as much labour and time; which in effect is no more than exchanging one man’s labour in one thing for a time certain, for another man’s labour in another thing for the same time.” (l.c., p. 39.) [The English language has the advantage of possessing different words for the two aspects of labour here considered. The labour which creates use value, and counts qualitatively, is Work, as distinguished from Labour, that which creates Value and counts quantitatively, is Labour as distinguished from Work - Engels]
    hash: sha256:7f67212d1d6b247db09eb3792c43f722e1103bc9c8d2499050917332d160b123
    state: active
  - id: p00196
    type: footnote
    label: "17"
    text: The few economists, amongst whom is S. Bailey, who have occupied themselves with the analysis of the form of value, have been unable to arrive at any result, first, because they confuse the form of value with value itself; and second, because, under the coarse influence of the practical bourgeois, they exclusively give their attention to the quantitative aspect of the question. “The command of quantity ... constitutes value.” (“Money and its Vicissitudes.” London, 1837, p. 11. By S. Bailey.)
    hash: sha256:950c4651e5c9a3c3d205d5b717d1eb165f68c142ec3f0af545bda02f0c7c62bb
    state: active
  - id: p00197
    type: footnote
    label: "18"
    text: "The celebrated Franklin, one of the first economists, after Wm. Petty, who saw through the nature of value, says: “Trade in general being nothing else but the exchange of labour for labour, the value of all things is ... most justly measured by labour.” (“The works of B. Franklin, &amp;c.,” edited by Sparks. Boston, 1836, Vol. II., p. 267.) Franklin is unconscious that by estimating the value of everything in labour, he makes abstraction from any difference in the sorts of labour exchanged, and thus reduces them all to equal human labour. But although ignorant of this, yet he says it. He speaks first of “the one labour,” then of “the other labour,” and finally of “labour,” without further qualification, as the substance of the value of everything."
    hash: sha256:d9e259bddd9639346ebae59bb09474b42eaeb84f348d07c65ed631fddc03ffcb
    state: active
  - id: p00198
    type: footnote
    label: "19"
    text: In a sort of way, it is with man as with commodities. Since he comes into the world neither with a looking glass in his hand, nor as a Fichtian philosopher, to whom “I am I” is sufficient, man first sees and recognises himself in other men. Peter only establishes his own identity as a man by first comparing himself with Paul as being of like kind. And thereby Paul, just as he stands in his Pauline personality, becomes to Peter the type of the <i>genus homo</i>.
    hash: sha256:0609f09c85ae2a416e2935ec2a9985af6477e4b374980e140e8a8999ea028847
    state: active
  - id: p00199
    type: footnote
    label: "20"
    text: Value is here, as occasionally in the preceding pages, used in sense of value determined as to quantity, or of magnitude of value.
    hash: sha256:542d548968b98fcf3cbd00d2fbbf60fc38ee5cd0f1080ef38c4e2f388e4da5b3
    state: active
  - id: p00200
    type: footnote
    label: "21"
    text: "This incongruity between the magnitude of value and its relative expression has, with customary ingenuity, been exploited by vulgar economists. For example – “Once admit that A falls, because B, with which it is exchanged, rises, while no less labour is bestowed in the meantime on A, and your general principle of value falls to the ground... If he [Ricardo] allowed that when A rises in value relatively to B, B falls in value relatively to A, he cut away the ground on which he rested his grand proposition, that the value of a commodity is ever determined by the labour embodied in it, for if a change in the cost of A alters not only its own value in relation to B, for which it is exchanged, but also the value of B relatively to that of A, though no change has taken place in the quantity of labour to produce B, then not only the doctrine falls to the ground which asserts that the quantity of labour bestowed on an article regulates its value, but also that which affirms the cost of an article to regulate its value’ (J. Broadhurst: “Political Economy,” London, 1842, pp. 11 and 14.) Mr. Broadhurst might just as well say: consider the fractions 10/20, 10/50, 10/100, &amp;c., the number 10 remains unchanged, and yet its proportional magnitude, its magnitude relatively to the numbers 20, 50, 100 &amp;c., continually diminishes. Therefore the great principle that the magnitude of a whole number, such as 10, is “regulated” by the number of times unity is contained in it, falls to the ground. [The author explains in section 4 of this chapter, pp. 80–81, note 2 (note 33 etext), what he understands by “Vulgar Economy.” – Engels]"
    hash: sha256:29b0abb28b06b9e787613a3847337ab1f6eb6e4e36e3d8ad20d6cf6d1b53ce77
    state: active
  - id: p00201
    type: footnote
    label: "22"
    text: Such expressions of relations in general, called by Hegel reflex categories, form a very curious class. For instance, one man is king only because other men stand in the relation of subjects to him. They, on the contrary, imagine that they are subjects because he is king.
    hash: sha256:7c37d45475f71f7c3e513ada0c55c46a46aa0a1744d1bf88ad822aa5da4d593e
    state: active
  - id: p00202
    type: footnote
    label: "23"
    text: F. L. A. Ferrier, sous-inspecteur des douanes, “Du gouvernement considéré dans ses rapports avec le commerce,” Paris, 1805; and Charles Ganilh, “Des Systèmes d’Economie Politique,” – 2nd ed., Paris, 1821.
    hash: sha256:77272c6fdbeb401f7eb4c0828259052a108b69166bf87343e0d1d3f41d520093
    state: active
  - id: p00203
    type: footnote
    label: "24"
    text: In Homer, for instance, the value of an article is expressed in a series of different things. <i>Iliad</i>. VII. 472–475.
    hash: sha256:4b014f667c46bc3d222f453b5b01dd4208357da758ecccccaeebc94339a2a013
    state: active
  - id: p00204
    type: footnote
    label: "25"
    text: "For this reason, we can speak of the coat value of the linen when its value is expressed in coats, or of its corn value when expressed in corn, and so on. Every such expression tells us, that what appears in the use values, coat, corn, &amp;c., is the value of the linen. “The value of any commodity denoting its relation in exchange, we may speak of it as ... corn value, cloth value, according to the commodity with which it is compared; and hence there are a thousand different kinds of value, as many kinds of value as there are commodities in existence, and all are equally real and equally nominal.” (“A Critical Dissertation on the Nature, Measures and Causes of Value: chiefly in reference to the writings of Mr. Ricardo and his followers.” By the author of “Essays on the Formation, &amp;c., of Opinions.” London, 1825, p. 39.) S. Bailey, the author of this anonymous work, a work which in its day created much stir in England, fancied that, by thus pointing out the various relative expressions of one and the same value, he had proved the impossibility of any determination of the concept of value. However narrow his own views may have been, yet, that he laid his finger on some serious defects in the Ricardian Theory, is proved by the animosity with which he was attacked by Ricardo’s followers. See the <i>Westminster Review</i> for example."
    hash: sha256:9cc861758899dc394dd037f6f90e5122853e61ef6b2d09a6e15a486ebe3d38ff
    state: active
  - id: p00205
    type: footnote
    label: "26"
    text: It is by no means self-evident that this character of direct and universal exchangeability is, so to speak, a polar one, and as intimately connected with its opposite pole, the absence of direct exchangeability, as the positive pole of the magnet is with its negative counterpart. It may therefore be imagined that all commodities can simultaneously have this character impressed upon them, just as it can be imagined that all Catholics can be popes together. It is, of course, highly desirable in the eyes of the petit bourgeois, for whom the production of commodities is the <i>nec plus ultra</i> of human freedom and individual independence, that the inconveniences resulting from this character of commodities not being directly exchangeable, should be removed. Proudhon’s socialism is a working out of this Philistine Utopia, a form of socialism which, as I have elsewhere shown, does not possess even the merit of originality. Long before his time, the task was attempted with much better success by Gray, Bray, and others. But, for all that, wisdom of this kind flourishes even now in certain circles under the name of “science.” Never has any school played more tricks with the word science, than that of Proudhon, for “wo Begriffe fehlen, Da stellt zur rechten Zeit ein Wort sich ein.” [“Where thoughts are absent, Words are brought in as convenient replacements,” Goethe’s <i>Faust</i>. See Proudhon’s <i>Philosophy of Poverty</i>]
    hash: sha256:18b38e7057ce44af763231c257d6961a6520e716a0003984207b8486ee0439db
    state: active
  - id: p00206
    type: footnote
    label: 26a
    text: "In the German edition, there is the following footnote here: “One may recall that China and the tables began to dance when the rest of the world appeared to be standing still – <i>pour encourager les autres</i> [to encourage the others].” The defeat of the 1848–49 revolutions was followed by a period of dismal political reaction in Europe. At that time, spiritualism, especially table-turning, became the rage among the European aristocracy. In 1850–64, China was swept by an anti-feudal liberation movement in the form of a large-scale peasant war, the Taiping Revolt. – Note by editors of <i>MECW</i>."
    hash: sha256:16b3146412726cf190ea6d22d303ab99cd8b8365f55033e73a37c8ccf906527a
    state: active
  - id: p00207
    type: footnote
    label: "27"
    text: Among the ancient Germans the unit for measuring land was what could be harvested in a day, and was called Tagwerk, Tagwanne (jurnale, or terra jurnalis, or diornalis), Mannsmaad, &amp;c. (See G. L. von Maurer, “Einleitung zur Geschichte der Mark—, &amp;c. Verfassung,” Munchen, 1854, p. 129 sq.)
    hash: sha256:655c40ff9aef0279d0fa0ed17133b460fedfc5cff6b2c379538fa504c143138b
    state: active
  - id: p00208
    type: footnote
    label: "28"
    text: "When, therefore, Galiani says: Value is a relation between persons – “La Ricchezza è una ragione tra due persone,” – he ought to have added: a relation between persons expressed as a relation between things. (Galiani: Della Moneta, p. 221, V. III. of Custodi’s collection of “Scrittori Classici Italiani di Economia Politica.” Parte Moderna, Milano 1803.)"
    hash: sha256:805071b123b4c6007d2fd8f9e8def9fa8d9ea8b81f527b7e57dd44afd8b35ba6
    state: active
  - id: p00209
    type: footnote
    label: "29"
    text: "“What are we to think of a law that asserts itself only by periodical revolutions? It is just nothing but a law of Nature, founded on the want of knowledge of those whose action is the subject of it.” (Friedrich Engels: “Umrisse zu einer Kritik der Nationalökonomie,” in the “Deutsch-Französische Jahrbücher,” edited by Arnold Ruge and Karl Marx. Paris. 1844.)"
    hash: sha256:aee7c3af7daa226d613f120c6c8fd524c0cfd3078ebec2e8718b9ec087e76d4a
    state: active
  - id: p00210
    type: footnote
    label: "30"
    text: "Even Ricardo has his stories <i>à la Robinson</i>. “He makes the primitive hunter and the primitive fisher straightway, as owners of commodities, exchange fish and game in the proportion in which labour time is incorporated in these exchange values. On this occasion he commits the anachronism of making these men apply to the calculation, so far as their implements have to be taken into account, the annuity tables in current use on the London Exchange in the year 1817. The parallelograms of Mr. Owen appear to be the only form of society, besides the bourgeois form, with which he was acquainted.” (Karl Marx: “Zur Kritik, &amp;c..” pp. 38, 39)"
    hash: sha256:1b6cdbb9853b7d1b8faf4d6727982fc2a46e875a06a9c86b65ae0bfc8e12f63a
    state: active
  - id: p00211
    type: footnote
    label: "31"
    text: “A ridiculous presumption has latterly got abroad that common property in its primitive form is specifically a Slavonian, or even exclusively Russian form. It is the primitive form that we can prove to have existed amongst Romans, Teutons, and Celts, and even to this day we find numerous examples, ruins though they be, in India. A more exhaustive study of Asiatic, and especially of Indian forms of common property, would show how from the different forms of primitive common property, different forms of its dissolution have been developed. Thus, for instance, the various original types of Roman and Teutonic private property are deducible from different forms of Indian common property.” (Karl Marx, “Zur Kritik, &amp;c.,” p. 10.)
    hash: sha256:621f106344e501eb07c1c24aedf49a3739df93df3e4791962a2b4444d6b876f6
    state: active
  - id: p00212
    type: footnote
    label: "32"
    text: "The insufficiency of Ricardo’s analysis of the magnitude of value, and his analysis is by far the best, will appear from the 3rd and 4th books of this work. As regards value in general, it is the weak point of the classical school of Political Economy that it nowhere expressly and with full consciousness, distinguishes between labour, as it appears in the value of a product, and the same labour, as it appears in the use value of that product. Of course the distinction is practically made, since this school treats labour, at one time under its quantitative aspect, at another under its qualitative aspect. But it has not the least idea, that when the difference between various kinds of labour is treated as purely quantitative, their qualitative unity or equality, and therefore their reduction to abstract human labour, is implied. For instance, Ricardo declares that he agrees with Destutt de Tracy in this proposition: “As it is certain that our physical and moral faculties are alone our original riches, the employment of those faculties, labour of some kind, is our only original treasure, and it is always from this employment that all those things are created which we call riches... It is certain, too, that all those things only represent the labour which has created them, and if they have a value, or even two distinct values, they can only derive them from that (the value) of the labour from which they emanate.” (Ricardo, “The Principles of Pol. Econ.,” 3 Ed. Lond. 1821, p. 334.) We would here only point out, that Ricardo puts his own more profound interpretation upon the words of Destutt. What the latter really says is, that on the one hand all things which constitute wealth represent the labour that creates them, but that on the other hand, they acquire their “two different values” (use value and exchange value) from “the value of labour.” He thus falls into the commonplace error of the vulgar economists, who assume the value of one commodity (in this case labour) in order to determine the values of the rest. But Ricardo reads him as if he had said, that labour (not the value of labour) is embodied both in use value and exchange value. Nevertheless, Ricardo himself pays so little attention to the two-fold character of the labour which has a two-fold embodiment, that he devotes the whole of his chapter on “Value and Riches, Their Distinctive Properties,” to a laborious examination of the trivialities of a J.B. Say. And at the finish he is quite astonished to find that Destutt on the one hand agrees with him as to labour being the source of value, and on the other hand with J. B. Say as to the notion of value."
    hash: sha256:b8b876ebeb11ad61276b28a0fa60282bcdc272e2a487eb285b98d4574f556901
    state: active
  - id: p00213
    type: footnote
    label: "33"
    text: It is one of the chief failings of classical economy that it has never succeeded, by means of its analysis of commodities, and, in particular, of their value, in discovering that form under which value becomes exchange value. Even Adam Smith and Ricardo, the best representatives of the school, treat the form of value as a thing of no importance, as having no connection with the inherent nature of commodities. The reason for this is not solely because their attention is entirely absorbed in the analysis of the magnitude of value. It lies deeper. The value form of the product of labour is not only the most abstract, but is also the most universal form, taken by the product in bourgeois production, and stamps that production as a particular species of social production, and thereby gives it its special historical character. If then we treat this mode of production as one eternally fixed by Nature for every state of society, we necessarily overlook that which is the <i>differentia specifica</i> of the value form, and consequently of the commodity form, and of its further developments, money form, capital form, &amp;c. We consequently find that economists, who are thoroughly agreed as to labour time being the measure of the magnitude of value, have the most strange and contradictory ideas of money, the perfected form of the general equivalent. This is seen in a striking manner when they treat of banking, where the commonplace definitions of money will no longer hold water. This led to the rise of a restored mercantile system (Ganilh, &amp;c.), which sees in value nothing but a social form, or rather the unsubstantial ghost of that form. Once for all I may here state, that by classical Political Economy, I understand that economy which, since the time of W. Petty, has investigated the real relations of production in bourgeois society in contradistinction to vulgar economy, which deals with appearances only, ruminates without ceasing on the materials long since provided by scientific economy, and there seeks plausible explanations of the most obtrusive phenomena, for bourgeois daily use, but for the rest, confines itself to systematising in a pedantic way, and proclaiming for everlasting truths, the trite ideas held by the self-complacent bourgeoisie with regard to their own world, to them the best of all possible worlds.
    hash: sha256:e890dc2c3ba26235e4c9f65de985312518fbec03cef0df8da57fbd641c7585f8
    state: active
  - id: p00214
    type: footnote
    label: "34"
    text: “Les économistes ont une singulière manière de procéder. Il n’y a pour eux que deux sortes d’institutions, celles de l’art et celles de la nature. Les institutions de la féodalité sont des institutions artificielles celles de la bourgeoisie sont des institutions naturelles. Ils ressemblent en ceci aux théologiens, qui eux aussi établissent deux sortes de religions. Toute religion qui n’est pas la leur, est une invention des hommes tandis que leur propre religion est une émanation de Dieu—Ainsi il y a eu de l’histoire, mais il n’y en a plus.” [“Economists have a singular method of procedure. There are only two kinds of institutions for them, artificial and natural. The institutions of feudalism are artificial institutions, those of the bourgeoisie are natural institutions. In this they resemble the theologians, who likewise establish two kinds of religion. Every religion which is not theirs is an invention of men, while their own is an emanation from God. ... Thus there has been history, but there is no longer any”] (Karl Marx. Misère de la Philosophie. Réponse a la Philosophie de la Misère par M. Proudhon, 1847, p. 113.) Truly comical is M. Bastiat, who imagines that the ancient Greeks and Romans lived by plunder alone. But when people plunder for centuries, there must always be something at hand for them to seize; the objects of plunder must be continually reproduced. It would thus appear that even Greeks and Romans had some process of production, consequently, an economy, which just as much constituted the material basis of their world, as bourgeois economy constitutes that of our modern world. Or perhaps Bastiat means, that a mode of production based on slavery is based on a system of plunder. In that case he treads on dangerous ground. If a giant thinker like Aristotle erred in his appreciation of slave labour, why should a dwarf economist like Bastiat be right in his appreciation of wage labour? I seize this opportunity of shortly answering an objection taken by a German paper in America, to my work, “Zur Kritik der Pol. Oekonomie, 1859.” In the estimation of that paper, my view that each special mode of production and the social relations corresponding to it, in short, that the economic structure of society, is the real basis on which the juridical and political superstructure is raised and to which definite social forms of thought correspond; that the mode of production determines the character of the social, political, and intellectual life generally, all this is very true for our own times, in which material interests preponderate, but not for the middle ages, in which Catholicism, nor for Athens and Rome, where politics, reigned supreme. In the first place it strikes one as an odd thing for any one to suppose that these well-worn phrases about the middle ages and the ancient world are unknown to anyone else. This much, however, is clear, that the middle ages could not live on Catholicism, nor the ancient world on politics. On the contrary, it is the mode in which they gained a livelihood that explains why here politics, and there Catholicism, played the chief part. For the rest, it requires but a slight acquaintance with the history of the Roman republic, for example, to be aware that its secret history is the history of its landed property. On the other hand, Don Quixote long ago paid the penalty for wrongly imagining that knight errantry was compatible with all economic forms of society.
    hash: sha256:f58df21e141f451fef10e2bda4c5f67dcda436b6b62cc6a766bdeb1fbacaaf0d
    state: active
  - id: p00215
    type: footnote
    label: "35"
    text: “Observations on certain verbal disputes in Pol. Econ., particularly relating to value and to demand and supply” Lond., 1821, p. 16.
    hash: sha256:23d381e8d7069e8ddbe5aa41a718fee465429b0f5c19e77ad548b005ff5dee40
    state: active
  - id: p00216
    type: footnote
    label: "36"
    text: S. Bailey, l.c., p. 165.
    hash: sha256:e8fe0ce2b6c8f7807ac5eceef2e98d5e0f410c47f208694c9352c3a5d128bfb6
    state: active
  - id: p00217
    type: footnote
    label: "37"
    text: The author of “Observations” and S. Bailey accuse Ricardo of converting exchange value from something relative into something absolute. The opposite is the fact. He has explained the apparent relation between objects, such as diamonds and pearls, in which relation they appear as exchange values, and disclosed the true relation hidden behind the appearances, namely, their relation to each other as mere expressions of human labour. If the followers of Ricardo answer Bailey somewhat rudely, and by no means convincingly, the reason is to be sought in this, that they were unable to find in Ricardo’s own works any key to the hidden relations existing between value and its form, exchange value.
    hash: sha256:141d5d020aad4363456ac2676705685efc1c074f51b53feb928ea4d83571786f
    state: active
  - id: p00218
    type: footnote
    label: Note
    text: This oft-quoted aphorism was included in the first English translation prepared by Engels and published in 1887. Readers should note that this observation is consistent with Marx's explanation above. There are numerous divergences between this English edition and the first German edition. [MIA]<br/><br/>Transcribed by Bert Schultz (1993)<br/>Html Markup by Brian Baggins &amp; Andy Blunden (1999)<br/>Proofed and Corrected by Andy Blunden (2005)
