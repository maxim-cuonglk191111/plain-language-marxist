  - id: p00132
    type: footnote
    label: "18"
    text: "“Toute vente est achat.” [“Every sale is a purchase.”] (Dr. Quesnay: “Dialogues sur le Commerce et les Travaux des Artisans.” Physiocrates ed. Daire I. Partie, Paris, 1846, p. 170), or as Quesnay in his “Maximes générales” puts it, “Vendre est acheter.” [“To sell is to buy.”]"
