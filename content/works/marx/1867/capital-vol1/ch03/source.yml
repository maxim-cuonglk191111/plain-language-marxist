  - id: p00138
    type: footnote
    label: "24"
    text: Self-evident as this may be, it is nevertheless for the most part unobserved by political economists, and especially by the “Free-trader Vulgaris.”
    hash: sha256:2307c4076cdec65e5624d9cbd8d57ba0c3a611ee6645b69f811f46744f497a80
