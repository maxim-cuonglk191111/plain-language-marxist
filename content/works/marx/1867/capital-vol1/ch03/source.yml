  - id: p00172
    type: footnote
    label: "55"
    text: "“L’argent ... est devenu le bourreau de toutes choses.” Finance is the “alambic, qui a fait évaporer une quantité effroyable de biens et de denrées pour faire ce fatal précis.” “L’argent déclare la guerre à tout le genre humain.” [“Money ... has become the executioner of all things.” Finance is the “alembic that evaporates a frightful quantity of goods and commodities in order to obtain this fatal extract.” “Money [...] declares war [...] on the whole human race”] (Boisguillebert: “Dissertation sur la nature des richesses, de l’argent et des tributs.” Edit. Daire. Economistes financiers. Paris, 1843, t. i., pp. 413, 419, 417.)"
    hash: sha256:7fd430774a10756c69bda0224db0895005a7eff6865a2ccd7e0c22d5bdcb5317
    state: active
  - id: p00173
    type: footnote
    label: "56"
    text: “On Whitsuntide, 1824,” says Mr. Craig before the Commons’ Committee of 1826, “there was such an immense demand for notes upon the banks of Edinburgh, that by 11 o’clock they had not a note left in their custody. They sent round to all the different banks to borrow, but could not get them, and many of the transactions were adjusted by slips of paper only; yet by three o’clock the whole of the notes were returned into the banks from which they had issued! It was a mere transfer from hand to hand. “Although the average effective circulation of bank-notes in Scotland is less than three millions sterling, yet on certain pay days in the year, every single note in the possession of the bankers, amounting in the whole to about £7,000,000, is called into activity. On these occasions the notes have a single and specific function to perform, and so soon as they have performed it, they flow back into the various banks from which they issued. (See John Fullarton, “Regulation of Currencies.” Lond. 1845, p. 86, note.) In explanation it should be stated, that in Scotland, at the date of Fullarton’s work, notes and not cheques were used to withdraw deposits.
    hash: sha256:6dcb5f3c9f87d4944cf058d3f3661c8cd3a3131a797100b1001436a8e4e0c769
    state: active
  - id: p00174
    type: footnote
    label: "57"
    text: <i>Note by the Institute of Marxism-Leninism in the Russian edition:</i> Apparently a slip of the pen. When writing <i>inverse</i> the author evidently meant <i>direct</i>.
    hash: sha256:02a0754d246f5eafb4d50ab82652277a90ec2eb184a7e5bb182bcec69baafadb
    state: active
  - id: p00175
    type: footnote
    label: "58"
    text: "To the question, “If there were occasion to raise 40 millions p. a., whether the same 6 millions (gold) ... would suffice for such revolutions and circulations thereof, as trade requires,” Petty replies in his usual masterly manner, “I answer yes: for the expense being 40 millions, if the revolutions were in such short circles, viz., weekly, as happens among poor artisans and labourers, who receive and pay every Saturday, then 40/52 parts of 1 million of money would answer these ends, but if the circles be quarterly, according to our custom of paying rent, and gathering taxes, then 10 millions were requisite. Wherefore, supposing payments in general to be of a mixed circle between one week and 13, then add 10 millions to 40/52, the half of which will be 5 1/2, so as if we have 5 1/2 millions we have enough.” (William Petty: “Political Anatomy of Ireland.” 1672, Edit.: Lond. 1691, pp. 13, 14.)"
    hash: sha256:2a0310ba0138673143e077907ece3d000d3526b3d04bc3bc532fd26bcd23ea3b
    state: active
  - id: p00176
    type: footnote
    label: "59"
    text: Hence the absurdity of every law prescribing that the banks of a country shall form reserves of that precious metal alone which circulates at home. The “pleasant difficulties” thus self-created by the Bank of England, are well known. On the subject of the great epochs in the history of the changes in the relative value of gold and silver, see Karl Marx, l.c., p. 136 sq. Sir Robert Peel, by his Bank Act of 1844, sought to tide over the difficulty, by allowing the Bank of England to issue notes against silver bullion, on condition that the reserve of silver should never exceed more than one-fourth of the reserve of gold. The value of silver being for that purpose estimated at its price in the London market.<br/><br/>[<i>Added in the 4th German edition. —</i> We find ourselves once more in a period of serious change in the relative values of gold and silver. About 25 years ago the ratio expressing the relative value of gold and silver was 15-1/2:1; now it is approximately 22:1, and silver is still constantly falling as against gold. This is essentially the result of a revolution in the mode of production of both metals. Formerly gold was obtained almost exclusively by washing it out from gold-bearing alluvial deposits, products of the weathering of auriferous rocks. Now this method has become inadequate and has been forced into the background by the processing of the quartz lodes themselves, a way of extraction which formerly was only of secondary importance, although well known to the ancients (Diodorus, III, 12-14) (Diodor’s v. Sicilien “Historische Bibliothek,” book III, 12-14. Stuttgart 1828, pp. 258-261). Moreover, not only were new huge silver deposits discovered in North America, in the Western part of the Rocky Mountains, but these and the Mexican silver mines were really opened up by the laying of railways, which made possible the shipment of modern machinery and fuel and in consequence the mining of silver on a very large scale at a low cost. However there is a great difference in the way the two metals occur in the quartz lodes. The gold is mostly native, but disseminated throughout the quartz in minute quantities. The whole mass of the vein must therefore be crushed and the gold either washed out or extracted by means of mercury. Often 1,000,000 grammes of quartz barely yield 1-3 and very seldom 30-60 grammes of gold. Silver is seldom found native, however it occurs in special quartz that is separated from the lode with comparative ease and contains mostly 40-90% silver; or it is contained, in smaller quantities, in copper, lead and other ores which in themselves are worthwhile working. From this alone it is apparent that the labour expended on the production of gold is rather increasing while that expended on silver production has decidedly decreased, which quite naturally explains the drop in the value of the latter. This fall in value would express itself in a still greater fall in price if the price of silver were not pegged even to-day by artificial means. But America’s rich silver deposits have so far barely been tapped, and thus the prospects are that the value of this metal will keep on dropping for rather a long time to come. A still greater contributing factor here is the relative decrease in the requirement of silver for articles of general use and for luxuries, that is its replacement by plated goods, aluminium, etc. One may thus gauge the utopianism of the bimetallist idea that compulsory international quotation will raise silver again to the old value ratio of 1:15-1/2. It is more likely that silver will forfeit its money function more and more in the markets of the world. — <i>F E.</i>]
    hash: sha256:5063669bf0602494b2c9ddbca7b6e77c800a9103c7efe9e9b153239e8252b934
    state: active
  - id: p00177
    type: footnote
    label: "60"
    text: "The opponents, themselves, of the mercantile system, a system which considered the settlement of surplus trade balances in gold and silver as the aim of international trade, entirely misconceived the functions of money of the world. I have shown by the example of Ricardo in what way their false conception of the laws that regulate the quantity of the circulating medium, is reflected in their equally false conception of the international movement of the precious metals (l.c., pp. 150 sq.). His erroneous dogma: “An unfavourable balance of trade never arises but from a redundant currency.... The exportation of the coin is caused by its cheapness, and is not the effect, but the cause of an unfavourable balance,” already occurs in Barbon: “The Balance of Trade, if there be one, is not the cause of sending away the money out of a nation; but that proceeds from the difference of the value of bullion in every country.” (N. Barbon; l.c., pp. 59, 60.) MacCulloch in “The Literature of Political Economy, a classified catalogue, Lond. 1845,” praises Barbon for this anticipation, but prudently passes over the naive forms, in which Barbon clothes the absurd supposition on which the “currency principle” is based. The absence of real criticism and even of honesty, in that catalogue culminates in the sections devoted to the history of the theory of money; the reason is that MacCulloch in this part of the work is flattering Lord Overstone whom he calls “facile princeps argentanorum.”"
    hash: sha256:b36ca648f3429dd357d63ad7c2211ed17a899abe3f7dda99168c5f83dfc494f8
    state: active
  - id: p00178
    type: footnote
    label: "61"
    text: For instance, in subsidies, money loans for carrying on wars or for enabling banks to resume cash payments, &amp;c., it is the money-form, and no other, of value that may be wanted.
    hash: sha256:531f8fb4f1cb9df5b09feb240ecaf2ab89fc96bfeb5fc5ea37b0891e236189f8
    state: active
  - id: p00179
    type: footnote
    label: "62"
    text: “I would desire, indeed, no more convincing evidence of the competency of the machinery of the hoards in specie-paying countries to perform every necessary office of international adjustment, without any sensible aid from the general circulation, than the facility with which France, when but just recovering from the shock of a destructive foreign invasion, completed within the space of 27 months the payment of her forced contribution of nearly 20 millions to the allied powers, and a considerable proportion of the sum in specie, without any perceptible contraction or derangement of her domestic currency, or even any alarming fluctuation of her exchanges.” (Fullerton, l.c., p. 141.) <i>[Added in the 4th German edition. —</i> We have a still more striking example in the facility with which the same France was able in 1871-73 to pay off within 30 months a forced contribution more than ten times as great, a considerable part of it likewise in specie. <i>— F. E.</i>]
    hash: sha256:c183c3d45ae1c520e2863256924beca89c689fc6e7f46aaedc40602ca162908b
    state: active
  - id: p00180
    type: footnote
    label: "63"
    text: “L’argent se partage entre les nations relativement au besoin qu’elles en ont ... étant toujours attiré par les productions.” [“Money is shared among the nations in accordance with their need for it ... as it is always attracted by the products”] (Le Trosne, l.c., p. 916.) “The mines which are continually giving gold and silver, do give sufficient to supply such a needful balance to every nation.” (J. Vanderlint, l.c., p. 40.)
    hash: sha256:98c4c14b071f736a3a3b2038560ee2d67c3f2c2c41521e2cdc420b6508bd1a32
    state: active
  - id: p00181
    type: footnote
    label: "64"
    text: “Exchanges rise and fall every week, and at some particular times in the year run high against a nation, and at other times run as high on the contrary.” (N. Barbon, l.c., p. 39)
    hash: sha256:67c80b8cae302e30300fb6610bd57a4c560ae31905af844639f5d30a4a79e23f
    state: active
  - id: p00182
    type: footnote
    label: "65"
    text: These various functions are liable to come into dangerous conflict with one another whenever gold and silver have also to serve as a fund for the conversion of bank-notes.
    hash: sha256:801ad9ac30db6ea6c13d481b0cbd836055fabdab65554b2ef6af0d13ea6ae99e
    state: active
  - id: p00183
    type: footnote
    label: "66"
    text: "“What money is more than of absolute necessity for a Home Trade, is dead stock ... and brings no profit to that country it’s kept in, but as it is transported in trade, as well as imported.” (John Bellers, “Essays,” p. 13.) “What if we have too much coin? We may melt down the heaviest and turn it into the splendour of plate, vessels or utensils of gold or silver, or send it out as a commodity, where the same is wanted or desired; or let it out at interest, where interest is high.” (W. Petty: “Quantulumcunque,” p. 39.) “Money is but the fat of the Body Politick, whereof too much doth as often hinder its agility, as too little makes it sick ... as fat lubricates the motion of the muscles, feeds in want of victuals, fills up the uneven cavities, and beautifies the body; so doth money in the state quicken its action, feeds from abroad in time of dearth at home, evens accounts ... and beautifies the whole; altho more especially the particular persons that have it in plenty.” (W. Petty, “Political Anatomy of Ireland,” p. 14.)<br/><br/>Transcribed by Zodiac<br/>Html Markup by Stephen Baird (1999)"
    hash: sha256:84830581ccaec99104ea691a7c80eb6d84d92380432989554b8c6631b728f2df
    state: active
