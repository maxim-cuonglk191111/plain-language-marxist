  - id: p00139
    type: footnote
    label: "25"
    text: See my observations on James Mill in “Zur Kritik, &amp;c.,” pp. 74-76. With regard to this subject, we may notice two methods characteristic of apologetic economy. The first is the identification of the circulation of commodities with the direct barter of products, by simple abstraction from their points of difference; the second is, the attempt to explain away the contradictions of capitalist production, by reducing the relations between the persons engaged in that mode of production, to the simple relations arising out of the circulation of commodities. The production and circulation of commodities are however, phenomena that occur to a greater or less extent in modes of production the most diverse. If we are acquainted with nothing but the abstract categories of circulation, which are common to all these modes of production, we cannot possibly know anything of the specific points of difference of those modes, nor pronounce any judgment upon them. In no science is such a big fuss made with commonplace truisms as in Political Economy. For instance, J. B. Say sets himself up as a judge of crises, because, forsooth, he knows that a commodity is a product.
    hash: sha256:93022a191d9d83929ecf6d31777fd73250ae7aa3999e1a92f75328ff5e039986
    state: active
  - id: p00140
    type: footnote
    label: "26"
    text: <i>Translator’s note</i>. — This word is here used in its original signification of the course or track pursued by money as it changes from hand to hand, a course which essentially differs from circulation.
    hash: sha256:a71b0e0363d658108d4802c5dfc34688ca7f048e754b29665a3b9c1b82c6af7e
    state: active
  - id: p00141
    type: footnote
    label: "27"
    text: Even when the commodity is sold over and over again, a phenomenon that at present has no existence for us, it falls, when definitely sold for the last time, out of the sphere of circulation into that of consumption, where it serves either as means of subsistence or means of production.
    hash: sha256:750bddb99b7c16d09f154a73045cda27b1add42c25f42c2597b874a216a79712
    state: active
  - id: p00142
    type: footnote
    label: "28"
    text: “Il (l’argent) n’a d’autre mouvement que celui qui lui est imprimé par les productions.” [“It” (money) “has no other motion than that imparted to it by the products”] (Le Trosne, l.c., p. 885.)
    hash: sha256:ccd11c23a2e9be88706f778267d8e92d0cc6e10bafc97bee784613c39df5beee
    state: active
  - id: p00143
    type: footnote
    label: "29"
    text: “Ce sont les productions qui le (l’argent) mettent en mouvement et le font circuler ... La célérité de son mouvement (c. de l’argent) supplée à sa quantité. Lorsqu’il en est besoin il ne fait que glisser d’une main dans l’autre sans s’arrêter un instant.” [“It is products which set it” (money) “in motion and make it circulate ... The velocity of its” (money’s) “motion supplements its quantity. When necessary, it does nothing but slide from hand to hand, without stopping for a moment”] (Le Trosne, l.c.. pp. 915, 916.)
    hash: sha256:74fc6611f832e26d56315bb3afe4cfe080b16bae63809fc8c1fa647b24c6e6ce
    state: active
  - id: p00144
    type: footnote
    label: "30"
    text: "“Money being ... the common measure of buying and selling, everybody who hath anything to sell, and cannot procure chapmen for it, is presently apt to think, that want of money in the kingdom, or country, is the cause why his goods do not go off; and so, want of money is the common cry; which is a great mistake... What do these people want, who cry out for money? ... The farmer complains ... he thinks that were more money in the country; he should have a price for his goods. Then it seems money is not his want, but a price for his corn and cattel, which he would sell, but cannot... Why cannot he get a price? ... (1) Either there is too much corn and cattel in the country, so that most who come to market have need of selling, as he hath, and few of buying; or (2) There wants the usual vent abroad by transportation..., or (3) The consumption fails, as when men, by reason of poverty, do not spend so much in their houses as formerly they did; wherefore it is not the increase of specific money, which would at all advance the farmer’s goods, but the removal of any of these three causes, which do truly keep down the market... The merchant and shopkeeper want money in the same manner, that is, they want a vent for the goods they deal in, by reason that the markets fail” ... [A nation] “never thrives better, than when riches are tost from hand to hand.” (Sir Dudley North: “Discourses upon Trade,” Lond. 1691, pp. 11-15, passim.) Herrenschwand’s fanciful notions amount merely to this, that the antagonism, which has its origin in the nature of commodities, and is reproduced in their circulation, can be removed by increasing the circulating medium. But if, on the one hand, it is a popular delusion to ascribe stagnation in production and circulation to insufficiency of the circulating medium, it by no means follows, on the other hand, that an actual paucity of the medium in consequence, <i>e.g</i>., of bungling legislative interference with the regulation of currency, may not give rise to such stagnation."
    hash: sha256:3f2bf3c99dda5f626017a1b034e16bd6793feeb72faa8728305db12802b693db
    state: active
  - id: p00145
    type: footnote
    label: "31"
    text: "“There is a certain measure and proportion of money requisite to drive the trade of a nation, more or less than which would prejudice the same. Just as there is a certain proportion of farthings necessary in a small retail trade, to change silver money, and to even such reckonings as cannot be adjusted with the smallest silver pieces.... Now, as the proportion of the number of farthings requisite in commerce is to be taken from the number of people, the frequency of their exchanges: as also, and principally, from the value of the smallest silver pieces of money; so in like manner, the proportion of money [gold and silver specie] requisite in our trade, is to be likewise taken from the frequency of commutations, and from the bigness of the payments.” (William Petty, “A Treatise of Taxes and Contributions.” Lond. 1667, p. 17.) The Theory of Hume was defended against the attacks of J. Steuart and others, by A. Young, in his “Political Arithmetic,” Lond. 1774, in which work there is a special chapter entitled “Prices depend on quantity of money, at p. 112, sqq. I have stated in “Zur Kritik, &amp;c.,” p. 149: “He (Adam Smith) passes over without remark the question as to the quantity of coin in circulation, and treats money quite wrongly as a mere commodity.” This statement applies only in so far as Adam Smith, ex officio, treats of money. Now and then, however, as in his criticism of the earlier systems of Political Economy, he takes the right view. “The quantity of coin in every country is regulated by the value of the commodities which are to be circulated by It.... The value of the goods annually bought and sold in any country requires a certain quantity of money to circulate and distribute them to their proper consumers, and can give employment to no more. The channel of circulation necessarily draws to itself a sum sufficient to fill it, and never admits any more.” (“Wealth of Nations.” Bk. IV., ch. 1.) In like manner, ex officio, he opens his work with an apotheosis on the division of labour. Afterwards, in the last book which treats of the sources of public revenue, he occasionally repeats the denunciations of the division of labour made by his teacher, A. Ferguson."
    hash: sha256:d0ae5c48fb964536c2d8d97cca8542974adfc5f2eacbe9929e9a7ce9654766d6
    state: active
  - id: p00146
    type: footnote
    label: "32"
    text: "“The prices of things will certainly rise in every nation, as the gold and silver increase amongst the people, and consequently, where the gold and silver decrease in any nation, the prices of all things must fall proportionately to such decrease of money.” (Jacob Vanderlint: “Money Answers all Things.” Lond. 1734, p. 5.) A careful comparison of this book with Hume’s “Essays,” proves to my mind without doubt that Hume was acquainted with and made use of Vanderlint’s work, which is certainly an important one. The opinion that prices are determined by the quantity of the circulating medium, was also held by Barbon and other much earlier writers. “No inconvenience,” says Vanderlint, “can arise by an unrestrained trade, but very great advantage; since, if the cash of the nation be decreased by it, which prohibitions are designed to prevent, those nations that get the cash will certainly find everything advance in price, as the cash increases amongst them. And ... our manufactures, and everything else, will soon become so moderate as to turn the balance of trade in our favour, and thereby fetch the money back again.” (l.c.. pp. 43, 44.)"
    hash: sha256:76bb84b2fef2cdb885c937521cf8a73f158ea0af0f13d81ec4a64b02b99d8e06
    state: active
  - id: p00147
    type: footnote
    label: "33"
    text: 'That the price of each single kind of commodity forms a part of the sum of the prices of all the commodities in circulation, is a self-evident proposition. But how use-values which are incommensurable with regard to each other, are to be exchanged, en masse for the total sum of gold and silver in a country, is quite incomprehensible. If we start from the notion that all commodities together form one single commodity, of which each is but an aliquot part, we get the following beautiful result: The total commodity = x cwt. of gold; commodity A = an aliquot part of the total commodity = the same aliquot part of x cwt. of gold. This is stated in all seriousness by Montesquieu: “Si l’on compare la masse de l’or et de l’argent qui est dans le monde avec la somme des marchandises qui s’y vend il est certain que chaque denrée ou marchandise, en particulier, pourra être comparée à une certaine portion de la masse entière. Supposons qu’il n’y ait qu’une seule denrée ou marchandise dans le monde, ou qu’il n’y ait qu’une seule qui s’achète, et qu’elle se divise comme l’argent: Cette partie de cette marchandise répondra à une partie de la masse de l’argent; la moitié du total de l’une à la moitié du total de l’autre, &amp;c.... L’établissement du prix des choses dépend toujours fondamentalement de la raison du total des choses au total des signes.” [“If one compares the amount of gold and silver in the world with the sum of the commodities available, it is certain that each product or commodity, taken in isolation, could be compared with a certain portion of the total amount of money. Let us suppose that there is only one product, or commodity, in the world, or only one that can be purchased, and that it can be divided in the same way as money: a certain part of this commodity would then correspond to a part of the total amount of money; half the total of the one would correspond to half the total of the other &amp;c. ... the determination of the prices of things always depends, fundamentally, on the relation between the total amount of things and the total amount of their monetary symbols”] (Montesquieu, l.c. t. III, pp. 12, 13.) As to the further development of this theory by Ricardo and his disciples, James Mill, Lord Overstone, and others, see “Zur Kritik, &amp;c.,” pp. 140-146, and p. 150, sqq. John Stuart Mill, with his usual eclectic logic, understands how to hold at the same time the view of his father, James Mill, and the opposite view. On a comparison of the text of his compendium, “Principles of Pol. Econ.,” with his preface to the first edition, in which preface he announces himself as the Adam Smith of his day — we do not know whether to admire more the simplicity of the man, or that of the public, who took him, in good faith, for the Adam Smith he announced himself to be, although he bears about as much resemblance to Adam Smith as say General Williams, of Kars, to the Duke of Wellington. The original researches of Mr. J. S. Mill which are neither extensive nor profound, in the domain of Political Economy, will be found mustered in rank and file in his little work, “Some Unsettled Questions of Political Economy,” which appeared in 1844. Locke asserts point blank the connexion between the absence of value in gold and silver, and the determination of their values by quantity alone. “Mankind having consented to put an imaginary value upon gold and silver ... the intrinsic value, regarded in these metals, is nothing but the quantity." (“Some Considerations,” <i>&amp;c</i>., 1691, Works Ed. 1777, Vol. II., p. 15.)'
    hash: sha256:93b58d6b61438151f152557c53a698a670d1402ebf781fb90047c084012d4dd1
    state: active
  - id: p00148
    type: footnote
    label: "34"
    text: "It lies of course, entirely beyond my purpose to take into consideration such details as the seigniorage on minting. I will, however, cite for the benefit of the romantic sycophant, Adam Muller, who admires the “generous liberality” with which the English Government coins gratuitously, the following opinion of Sir Dudley North: “Silver and gold, like other commodities, have their ebbings and flowings. Upon the arrival of quantities from Spain ... it is carried into the Tower, and coined. Not long after there will come a demand for bullion to be exported again. If there is none, but all happens to be in coin, what then? Melt it down again; there’s no loss in it, for the coining costs the owner nothing. Thus the nation has been abused, and made to pay for the twisting of straw for asses to eat. If the merchant were made to pay the price of the coinage, he would not have sent his silver to the Tower without consideration, and coined money would always keep a value above uncoined silver.” (North, l.c., p. 18.) North was himself one of the foremost merchants in the reign of Charles II."
    hash: sha256:c8f900a22a2d1885ee3f9d4e61ebe8bd771f3a27e30e4c9fb17970a0a6a2a113
    state: active
  - id: p00149
    type: footnote
    label: "35"
    text: "“If silver never exceed what is wanted for the smaller payments it cannot be collected in sufficient quantities for the larger payments ... the use of gold in the main payments necessarily implies also its use in the retail trade: those who have gold coin offering them for small purchases, and receiving with the commodity purchased a balance of silver in return; by which means the surplus of silver that would otherwise encumber the retail dealer, is drawn off and dispersed into general circulation. But if there is as much silver as will transact the small payments independent of gold, the retail trader must then receive silver for small purchases, and it must of necessity accumulate in his hands.” (David Buchanan; “Inquiry into the Taxation and Commercial Policy of Great Britain.” Edinburgh, 1844, pp. 248, 249.)"
    hash: sha256:81aeb8abbeb0363b0e73844444fac601cd03763561d801e64e2023bd508c5e0b
    state: active
  - id: p00150
    type: footnote
    label: "36"
    text: "The mandarin Wan-mao-in, the Chinese Chancellor of the Exchequer, took it into his head one day to lay before the Son of Heaven a proposal that secretly aimed at converting the <i>assignats</i> of the empire into convertible bank-notes. The assignats Committee, in its report of April, 1854, gives him a severe snubbing. Whether he also received the traditional drubbing with bamboos is not stated. The concluding part of the report is as follows: — “The Committee has carefully examined his proposal and finds that it is entirely in favour of the merchants, and that no advantage will result to the crown.” (“Arbeiten der Kaiserlich Russischen Gesandtschaft zu Peking über China.” Aus dem Russischen von Dr. K. Abel und F. A. Mecklenburg. Erster Band. Berlin, 1858, p. 47 sq.) In his evidence before the Committee of the House of Lords on the Bank Acts, a governor of the Bank of England says, with regard to the abrasion of gold coins during currency: “Every year a fresh class of sovereigns becomes too light. The class which one year passes with full weight, loses enough by wear and tear to draw the scales next year against it.” (House of Lords’ Committee, 1848, n. 429.)"
    hash: sha256:717b082552f1f4a6f7d70e259a2b24a9f09ee1e28b4e03a88091f6393df6a117
    state: active
  - id: p00151
    type: footnote
    label: "37"
    text: "The following passage from Fullarton shows the want of clearness on the part of even the best writers on money, in their comprehension of its various functions: “That, as far as concerns our domestic exchanges, all the monetary functions which are usually performed by gold and silver coins, may be performed as effectually by a circulation of inconvertible notes, having no value but that factitious and conventional value they derive from the law, is a fact which admits, I conceive, of no denial. Value of this description may be made to answer all the purposes of intrinsic value, and supersede even the necessity for a standard, provided only the quantity of the issues be kept under due limitation.” (Fullarton: “Regulation of Currencies,” London, 1845, p. 21.) Because the commodity that serves as money is capable of being replaced in circulation by mere symbols of value, therefore its functions as a measure of value and a standard of prices are declared to be superfluous!"
    hash: sha256:293884d5e1b73cd5bad7007f8dc79521c9335e256a6a619bf350179f45ed4da4
    state: active
  - id: p00152
    type: footnote
    label: "38"
    text: From the fact that gold and silver, so far as they are coins, or exclusively serve as the medium of circulation, become mere tokens of themselves, Nicholas Barbon deduces the right of Governments “to raise money,” that is, to give to the weight of silver that is called a shilling the name of a greater weight, such as a crown; and so to pay creditors shillings, instead of crowns. “Money does wear and grow lighter by often telling over... It is the denomination and currency of the money that men regard in bargaining, and not the quantity of silver...’Tis the public authority upon the metal that makes it money.” (N. Barbon, l.c., pp. 29, 30, 25.)
    hash: sha256:cfb2b929ab13da352e107e832dfd8ae8c45fc13c3e786b829561f1ece54381e3
    state: active
  - id: p00153
    type: footnote
    label: "39"
    text: “Une richesse en argent n’est que ... richesse en productions, converties en argent.” [“Monetary wealth is nothing but ... wealth in products, transformed into money”] (Mercier de la Rivière, l.c.) “Une valeur en productions n’a fait que changer de forme.” [“A value in the form of products, which has merely changed its form.”] (Id., p. 486.)
    hash: sha256:a5d088de5ff15b07e6a68ddcb3c0f6e54eb8866f67ac3fb3779fe2c393cb6c42
    state: active
  - id: p00154
    type: footnote
    label: "40"
    text: “’Tis by this practice’ they keep all their goods and manufactures at such low rates.” (Vanderlint, l.c., pp. 95, 96.)
    hash: sha256:509fa3b242a8e4a34810bf33ba57fb501a0d2a138f3844d87063ed0ddae1511e
    state: active
  - id: p00155
    type: footnote
    label: "41"
    text: "“Money ... is a pledge.” (John Bellers: “Essays about the Poor, Manufactures, Trade, Plantations, and Immorality,” Lond., 1699, p. 13.)"
    hash: sha256:f5d7bbfb64512e978906d8f930a4c49f7af331b2d37c44dd64fcb41e174b79d7
    state: active
  - id: p00156
    type: footnote
    label: "42"
    text: A purchase in a “categorical” sense, implies that gold and silver are already the converted form of commodities, or the product of a sale.
    hash: sha256:a54defda8edf03488f286421d663ca2baec4c9069c2f8a6da6f9e79d8917ecd7
    state: active
  - id: p00157
    type: footnote
    label: "43"
    text: Henry III., most Christian king of France, robbed cloisters of their relics, and turned them into money. It is well known what part the despoiling of the Delphic Temple, by the Phocians, played in the history of Greece. Temples with the ancients served as the dwellings of the gods of commodities. They were “sacred banks.” With the Phoenicians, a trading people par excellence, money was the transmuted shape of everything. It was, therefore, quite in order that the virgins, who, at the feast of the Goddess of Love, gave themselves up to strangers, should offer to the goddess the piece of money they received.
    hash: sha256:6733aadd86e1db6845a2da6278a3ac0270819c6f3edbdf2f0285bc4add04b3b2
    state: active
  - id: p00158
    type: footnote
    label: 43a
    text: '<indent level="1"/>“Gold, yellow, glittering, precious gold!<br/>Thus much of this, will make black white; foul, fair;<br/>Wrong, right; base, noble; old, young; coward, valiant.<br/>... What this, you gods? Why, this<br/>Will lug your priests and servants from your sides;<br/>Pluck stout men’s pillows from below their heads;<br/>This yellow slave<br/>Will knit and break religions; bless the accurs’d;<br/>Make the hoar leprosy ador’d; place thieves,<br/>And give them title, knee and approbation,<br/>With senators on the bench; this is it,<br/>That makes the wappen’d widow wed again:<br/>... Come damned earth,<br/>Though common whore of mankind.”<br/>(Shakespeare: Timon of Athens.)'
    hash: sha256:4ea60571dde141d31cef3bacd05f04a152eaee5ad2b59d16c4b6256fe94fb642
    state: active
  - id: p00159
    type: footnote
    label: 43b
    text: <indent level="1"/>Money! Nothing worse<br/>in our lives, so current, rampant, so corrupting.<br/>Money — you demolish cities, root men from their homes,<br/>you train and twist good minds and set them on<br/>to the most atrocious schemes. No limit,<br/>you make them adept at every kind of outrage,<br/>every godless crimes — money!”<br/>(Sophocles, Antigone.)
    hash: sha256:71b89cf15a1b84a2d0c55cb67524cefe977a603272d317d77d6969fd957b9608
    state: active
  - id: p00160
    type: footnote
    label: "44"
    text: “The desire of avarice to draw Pluto himself out of the bowels of the earth.” (The Deipnosophists, VI, 23, Athenaeus)
    hash: sha256:482d4a63c5418f3cf09653209faeaabe7006c38ccf7f2fb343c573da587a39c3
    state: active
  - id: p00161
    type: footnote
    label: "45"
    text: "“Accrescere quanto più si può il numero de’venditori d’ogni merce, diminuere quanto più si puo il numero dei compratori, questi sono i cardini sui quali si raggirano tutte le operazioni di economia politica.” [“These are the pivots around which all the measures of political economy turn: the maximum possible increase in the number of sellers of each commodity, and the maximum possible decrease in the number of buyers”] (Verri, l.c., p. 52.)"
    hash: sha256:e246ed857913cdaf28611b69ed2cc5ddfa43143a4b1c3c674ccfd06b43e89b61
    state: active
  - id: p00162
    type: footnote
    label: "46"
    text: “There is required for carrying on the trade of the nation a determinate sum of specifick money which varies, and is sometimes more, sometimes less, as the circumstances we are in require.... This ebbing and flowing of money supplies and accommodates itself, without any aid of Politicians.... The buckets work alternately; when money is scarce, bullion is coined; when bullion is scarce, money is melted.” (Sir D. North, l.c., Postscript, p. 3.) John Stuart Mill, who for a long time was an official of the East India Company, confirms the fact that in India silver ornaments still continue to perform directly the functions of a hoard. The silver ornaments are brought out and coined when there is a high rate of interest, and go back again when the rate of interest falls. (1. S. Mill’s Evidence “Reports on Bank Acts,” 1857, 2084.) According to a Parliamentary document of 1864 on the gold and silver import and export of India, the import of gold and silver in 1863 exceeded the export by £19,367,764. During the 8 years immediately preceding 1864, the excess of imports over exports of the precious metals amounted to £109,652,917. During this century far more than £200,000,000 has been coined in India.
    hash: sha256:c55c6a99c67d0390aa8dfef5992d7296f87ca0fcd24677504f5a4d20f7449e17
    state: active
  - id: p00163
    type: footnote
    label: "47"
    text: The following shows the debtor and creditor relations existing between English traders at the beginning of the 18th century. “Such a spirit of crudity reigns here in England among the men of trade, that is not to be met with in any other society of men, nor in any other kingdom of the world.” (“An Essay on Credit and the Bankrupt Act,” Lond., 1707, p. 2.)
    hash: sha256:f18ab669c500a6443e0dc506c9617870bad9964668cdf2140cb8e27a95aa9d22
    state: active
  - id: p00164
    type: footnote
    label: "48"
    text: "It will be seen from the following quotation from my book which appeared in 1859, why I take no notice in the text of an opposite form: “Contrariwise, in the process in M—C, the money can be alienated as a real means of purchase, and in that way, the price of the commodity can be realised before the use-value of the money is realised and the commodity actually delivered. This occurs constantly under the every-day form of prepayments. And it is under this form, that the English government purchases opium from the ryots of India.... In these cases, however, the money always acts as a means of purchase.... Of course capital also is advanced in the shape of money.... This point of view, however, does not fall within the horizon of simple circulation.” (“Zur Kritik, <i>&amp;c</i>.,” pp. 119, 120.)"
    hash: sha256:8d6120eb4a1bbe0269d52f78f413e9fa65f9185076d86d46017d6a35a7da98db
    state: active
  - id: p00165
    type: footnote
    label: "49"
    text: The monetary crisis referred to in the text, being a phase of every crisis, must be clearly distinguished from that particular form of crisis, which also is called a monetary crisis, but which may be produced by itself as an independent phenomenon in such a way as to react only indirectly on industry and commerce. The pivot of these crises is to be found in moneyed capital, and their sphere of direct action is therefore the sphere of that capital, viz., banking, the stock exchange, and finance.
    hash: sha256:cd747ad90d8915fb86207919591a58b1307d4522a70ac71adb20069ebb28646c
    state: active
  - id: p00166
    type: footnote
    label: "50"
    text: “The sudden reversion from a system of credit to a system of hard cash heaps theoretical fright on top of the practical panic; and the dealers by whose agency circulation is affected, shudder before the impenetrable mystery in which their own economic relations are involved” (Karl Marx, l.c., p. 126.) “The poor stand still, because the rich have no money to employ them, though they have the same land and hands to provide victuals and clothes, as ever they had; ...which is the true riches of a nation, and not the money.” John Bellers, <i>Proposals for Raising a College of Industry</i>, London, 1696, p3.
    hash: sha256:82a708cb85ca67416cebf4e4bc20d2db2e9433b6df33fb75d8b7276c6403eb81
    state: active
  - id: p00167
    type: footnote
    label: "51"
    text: "The following shows how such times are exploited by the “amis du commerce.” “On one occasion (1839) an old grasping banker (in the city) in his private room raised the lid of the desk he sat over, and displayed to a friend rolls of bank-notes, saying with intense glee there were £600,000 of them, they were held to make money tight, and would all be let out after three o’clock on the same day.” (“The Theory of Exchanges. The Bank Charter Act of 1844.” Lond. 1864, p. 81). The <i>Observer</i>, a semi-official government organ, contained the following paragraph on 24th April, 1864: “Some very curious rumours are current of the means which have been resorted to in order to create a scarcity of banknotes.... Questionable as it would seem, to suppose that any trick of the kind would be adopted, the report has been so universal that it really deserves mention.”"
    hash: sha256:37fbf71200ccce6da4c88cadd4b602a57a24fcbe3a2c938ad48a2fa0839a524c
    state: active
  - id: p00168
    type: footnote
    label: "52"
    text: “The amount of purchases or contracts entered upon during the course of any given day, will not affect the quantity of money afloat on that particular day, but, in the vast majority of cases, will resolve themselves into multifarious drafts upon the quantity of money which may be afloat at subsequent dates more or less distant.... The bills granted or credits opened, to-day, need have no resemblance whatever, either in quantity, amount or duration, to those granted or entered upon to-morrow or next day, nay, many of today’s bills, and credits, when due, fall in with a mass of liabilities whose origins traverse a range of antecedent dates altogether indefinite, bills at 12, 6, 3 months or 1 often aggregating together to swell the common liabilities of one particular day....” (“The Currency Theory Reviewed; in a Letter to the Scottish People.” By a Banker in England. Edinburgh, 1845, pp. 29, 30 passim.)
    hash: sha256:b240aeabcc0a5085b9c57633bfb35ca43461655fcfb73710f0cca16f1f5de87b
    state: active
