  - id: p00130
    type: footnote
    label: "16"
    text: "“ec se tou ... puros t’antameeibesqai panta, jhsin d’Hracleitos, cai pur apantwn, woper crusou crhmata cai crhmatwn crusos.” [“As Heraclitus says, all things are exchanged for fire and fire for all things, as wares are exchanged for gold and gold for wares.”] (F. Lassalle: “Die Philosophie Herakleitos des Dunkeln.” Berlin, 1858, Vol. I, p. 222.) Lassalle in his note on this passage, p. 224, n. 3., erroneously makes gold a mere symbol of value."
    hash: sha256:c0968063841c2bc7133309ed8680dae22d90715b4231c935bac7f219e8ae6616
