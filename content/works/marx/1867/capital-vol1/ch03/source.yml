  - id: p00129
    type: footnote
    label: "15"
    text: Jerome had to wrestle hard, not only in his youth with the bodily flesh, as is shown by his fight in the desert with the handsome women of his imagination, but also in his old age with the spiritual flesh. “I thought,” he says, “I was in the spirit before the Judge of the Universe.” “Who art thou?” asked a voice. “I am a Christian.” “Thou liest,” thundered back the great Judge, “thou art nought but a Ciceronian.”
    hash: sha256:3c3a0067aeba35c806445dd6b056886575447e6cbbfb61f5ef7178363c6c5f0b
