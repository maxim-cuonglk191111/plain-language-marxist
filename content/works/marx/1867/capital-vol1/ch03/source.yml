  - id: p00131
    type: footnote
    label: "17"
    text: "<i>Note by the Institute of Marxism-Leninism in the Russian edition</i>. — In his letter of November 28, 1878, to N. F. Danielson (Nikolai-on) Marx proposed that this sentence be corrected to read as follows: “And, as a matter of fact, the value of each single yard is but the materialised form of a part of the social labour expended on the whole number of yards.” An analogous correction was made in a copy of the second German edition of the first volume of “Capital” belonging to Marx; however, not in his handwriting."
    hash: sha256:c22a674a46b97a51b575d6af7dc705c4f7057b8e7b09488267d81162ed2cb2c7
