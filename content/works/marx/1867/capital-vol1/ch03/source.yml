  - id: p00171
    type: footnote
    label: "54"
    text: “The course of trade being thus turned, from exchanging of goods for goods, or delivering and taking, to selling and paying, all the bargains ... are now stated upon the foot of a Price in money.” (“An Essay upon Publick Credit.” 3rd Ed. Lond., 1710, p. 8.)
    hash: sha256:c394ac5ee7422c4216edf559829a3c2b9e6714828f73b7d686cf55efb0f96fd1
