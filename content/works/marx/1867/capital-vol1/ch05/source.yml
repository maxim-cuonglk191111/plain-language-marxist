  - id: p00035
    type: footnote
    label: "11"
    text: “By the augmentation of the nominal value of the produce... sellers not enriched... since what they gain as sellers, they precisely expend in the quality of buyers.” (“The Essential Principles of the Wealth of Nations.” &amp;c., London, 1797, p. 66.)
    hash: sha256:68dcb5d15377ccacf2a717218d2d7c0b2a2d0e29574eaab704a422eff6cc5d55
    state: active
  - id: p00036
    type: footnote
    label: "12"
    text: “Si l’on est forcé de donner pour 18 livres une quantité de telle production qui en valait 24, lorsqu’on employera ce même argent à acheter, on aura également pour 18 l. ce que l’on payait 24.” [“If one is compelled to sell a quantity of a certain product for 18 livres when it has a value of 24 livres, when one employs the same amount of money in buying, one will receive for 18 livres the same quantity of the product as 24 livres would have bought otherwise.”] (Le Trosne, I. c., p. 897.)
    hash: sha256:bf5e6de5a74ff13c45b9b883ecfae90674eca80b08ee10d2aab1b597916686b0
    state: active
  - id: p00037
    type: footnote
    label: "13"
    text: “Chaque vendeur ne peut donc parvenir à renchérir habituellement ses marchandises, qu’en se soumettant aussi à payer habituellement plus cher les marchandises des autres vendeurs; et par la même raison, chaque consommateur ne peut payer habituellement moins cher ce qu’il achète, qu’en se soumettant aussi à une diminution semblable sur le prix des choses qu’il vend.” [“A seller can normally only succeed in raising the prices of his commodities if he agrees to pay, by and large, more for the commodities of the other sellers; and for the same reason a consumer can normally only pay less for his purchases if he submits to a similar reduction in the prices of the things he sells.”] (Mercier de la Rivière, l.c., p. 555.)
    hash: sha256:4662c00aebdcdbce25da99e9330a6c16daf009e41b66a9dfdb2aa415dc1ca0d5
    state: active
  - id: p00038
    type: footnote
    label: "14"
    text: Torrens. “An Essay on the Production of Wealth.” London, 1821, p. 349.
    hash: sha256:4bf389e231e87968822658f9890ba4e2f58f89d4370deacb49166af1c09f19eb
    state: active
  - id: p00039
    type: footnote
    label: "15"
    text: "“The idea of profits being paid by the consumers, is, assuredly, very absurd. Who are the consumers?” (G. Ramsay: “An Essay on the Distribution of Wealth.” Edinburgh, 1836, p. 183.)"
    hash: sha256:d5a7a552f8c75ea3f819816d90ef044ad20ddcc4a3b5a330ae87f479be5fb229
    state: active
  - id: p00040
    type: footnote
    label: "16"
    text: “When a man is in want of a demand, does Mr. Malthus recommend him to pay some other person to take off his goods?” is a question put by an angry disciple of Ricardo to Malthus, who, like his disciple, Parson Chalmers, economically glorifies this class of simple buyers or consumers. (See “An Inquiry into those Principles Respecting the Nature of Demand and the Necessity of Consumption, lately advocated by Mr. Malthus,” &amp;c. Lond., 1821, p. 55.)
    hash: sha256:fad57d34d92527f792bf4f57d17253e820e197908d3657b799ff03e043b57db2
    state: active
  - id: p00041
    type: footnote
    label: "17"
    text: Destutt de Tracy, although, or perhaps because, he was a member of the Institute, held the opposite view. He says, industrial capitalists make profits because “they all sell for more than it has cost to produce. And to whom do they sell? In the first instance to one another.” (I. c., p. 239.)
    hash: sha256:433e82e5801ac1db8ecfd396993513beceb9ca605752de3be75913cc7b6965c6
    state: active
  - id: p00042
    type: footnote
    label: "18"
    text: "“L’échange qui se fait de deux valeurs égales n’augmente ni ne diminue la masse des valeurs subsistantes dans la société. L’échange de deux valeurs inégales ... ne change rien non plus à la somme des valeurs sociales, bien qu’il ajoute à la fortune de l’un ce qu’il ôte de la fortune de l’autre.” [“The exchange of two equal values neither increases nor diminishes the amount of the values available in society. Nor does the exchange of two unequal values ... change anything in the sum of social values, although it adds to the wealth of one person what it removes from the wealth of another.”] (J. B. Say, l.c., t. II, pp. 443, 444.) Say, not in the least troubled as to the consequences of this statement, borrows it, almost word for word, from the Physiocrats. The following example will show how Monsieur Say turned to account the writings of the Physiocrats, in his day quite forgotten, for the purpose of expanding the “value” of his own. His most celebrated saying, “On n’achète des produits qu’avec des produits” [“Products can only be bought with products.”](l.c., t. II. p. 441.) runs as follows in the original physiocratic work: “Les productions ne se paient qu’avec des productions.” [“Products can only be paid for with products.”] (Le Trosne, l.c., p. 899.)"
    hash: sha256:13c0d3b7aa488504a317724c683a278c2ee5c5ae166cebee3980e7ab573e99fa
    state: active
  - id: p00043
    type: footnote
    label: "19"
    text: "“Exchange confers no value at all upon products.” (F. Wayland: “The Elements of Political Economy.” Boston, 1843, p. 169.)"
    hash: sha256:479039a7379f4b7eaf819f77d5a9231eeeea3161a7470ef9ca78dcb165ab9ad5
    state: active
  - id: p00044
    type: footnote
    label: "20"
    text: "Under the rule of invariable equivalents commerce would be impossible. (G. Opdyke: “A Treatise on Polit. Economy.” New York, 1851, pp. 66-69.) “The difference between real value and exchange-value is based upon this fact, namely, that the value of a thing is different from the so-called equivalent given for it in trade, i.e., that this equivalent is no equivalent.” (F. Engels, l.c., p. 96)."
    hash: sha256:e8c34ef48c0b242b20f9e874d9809d66c1da0f773f962b4f73614e3180aaf92f
    state: active
  - id: p00045
    type: footnote
    label: "21"
    text: "Benjamin Franklin: Works, Vol. II, edit. Sparks in “Positions to be examined concerning National Wealth,” p. 376."
    hash: sha256:3bc4621f624da5569d92198c4c33922b5b40618ae8f14080695bf7cb105cd344
    state: active
  - id: p00046
    type: footnote
    label: "22"
    text: Aristotle, I. c., c. 10.
    hash: sha256:503f8e53e34dbeaa1373cb8bb32f171f200f2845945fc78f4f05bebcdfd7d2a4
