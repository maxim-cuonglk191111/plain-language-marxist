  - id: p00047
    type: footnote
    label: "23"
    text: “Profit, in the usual condition of the market, is not made by exchanging. Had it not existed before, neither could it after that transaction.” (Ramsay, l.c., p. 184.)
    hash: sha256:4dad0a1ad96eb1af9068010424c48ce5ba3972abe4b86b491ac83c05f0e5fa4d
    state: active
  - id: p00048
    type: footnote
    label: "24"
    text: "From the foregoing investigation, the reader will see that this statement only means that the formation of capital must be possible even though the price and value of a commodity be the same; for its formation cannot be attributed to any deviation of the one from the other. If prices actually differ from values, we must, first of all, reduce the former to the latter, in other words, treat the difference as accidental in order that the phenomena may be observed in their purity, and our observations not interfered with by disturbing circumstances that have nothing to do with the process in question. We know, moreover, that this reduction is no mere scientific process. The continual oscillations in prices, their rising and falling, compensate each other, and reduce themselves to an average price, which is their hidden regulator. It forms the guiding star of the merchant or the manufacturer in every undertaking that requires time. He knows that when a long period of time is taken, commodities are sold neither over nor under, but at their average price. If therefore he thought about the matter at all, he would formulate the problem of the formation of capital as follows: How can we account for the origin of capital on the supposition that prices are regulated by the average price, i. e., ultimately by the value of the commodities? I say “ultimately,” because average prices do not directly coincide with the values of commodities, as Adam Smith, Ricardo, and others believe."
    hash: sha256:963e5e85fe8f9465d70510cfb169a18a0234906951d3f6161918bd9effc1ebfd
