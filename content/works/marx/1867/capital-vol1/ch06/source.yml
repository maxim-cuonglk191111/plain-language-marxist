  - id: p00035
    type: footnote
    label: "14"
    text: "One example. In London there are two sorts of bakers, the “full priced,” who sell bread at its full value, and the “undersellers,” who sell it under its value. The latter class comprises more than three-fourths of the total number of bakers. (p. xxxii in the Report of H. S. Tremenheere, commissioner to examine into “the grievances complained of by the journeymen bakers,” &amp;c., Lond. 1862.) The undersellers, almost without exception, sell bread adulterated with alum, soap, pearl ashes, chalk, Derbyshire stone-dust, and such like agreeable nourishing and wholesome ingredients. (See the above cited Blue book, as also the report of “the committee of 1855 on the adulteration of bread,” and Dr. Hassall’s “Adulterations Detected,” 2nd Ed. Lond. 1861.) Sir John Gordon stated before the committee of 1855, that “in consequence of these adulterations, the poor man, who lives on two pounds of bread a day, does not now get one fourth part of nourishing matter, let alone the deleterious effects on his health.” Tremenheere states (l.c., p. xlviii), as the reason, why a very large part of the working-class, although well aware of this adulteration, nevertheless accept the alum, stone-dust, &amp;c., as part of their purchase: that it is for them “a matter of necessity to take from their baker or from the chandler’s shop, such bread as they choose to supply.” As they are not paid their wages before the end of the week, they in their turn are unable “to pay for the bread consumed by their families, during the week, before the end of the week,” and Tremenheere adds on the evidence of witnesses, “it is notorious that bread composed of those mixtures, is made expressly for sale in this manner.” In many English and still more Scotch agricultural districts, wages are paid fortnightly and even monthly; with such long intervals between the payments, the agricultural labourer is obliged to buy on credit.... He must pay higher prices, and is in fact tied to the shop which gives him credit. Thus at Horningham in Wilts, for example, where the wages are monthly, the same flour that he could buy elsewhere at 1s 10d per stone, costs him 2s 4d per stone. (“Sixth Report” on “Public Health” by “The Medical Officer of the Privy Council, &amp;c., 1864,” p.264.) “The block printers of Paisley and Kilmarnock enforced, by a strike, fortnightly, instead of monthly payment of wages.” (“Reports of the Inspectors of Factories for 31st Oct., 1853,” p. 34.) As a further pretty result of the credit given by the workmen to the capitalist, we may refer to the method current in many English coal mines, where the labourer is not paid till the end of the month, and in the meantime, receives sums on account from the capitalist, often in goods for which the miner is obliged to pay more than the market price (Truck-system). “It is a common practice with the coal masters to pay once a month, and advance cash to their workmen at the end of each intermediate week. The cash is given in the shop” (i.e., the Tommy shop which belongs to the master); “the men take it on one side and lay it out on the other.” (“Children’s Employment Commission, III. Report,” Lond. 1864, p. 38, n. 192.)<br/><br/>Transcribed by Hinrich Kuhls<br/>Html Markup by Stephen Baird (1999)"
