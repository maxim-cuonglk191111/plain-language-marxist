    label: "10"
    text: That which follows refers to the situation in the Rumanian provinces before the change effected since the Crimean war.
    hash: sha256:84999b01bb15b3609235026ab083e2210e5962c60760acb1ed471e4871df05a7
    state: active
  - id: p00236
    type: footnote
    label: "11"
    text: This holds likewise for Germany, and especially for Prussia east of the Elbe. In the 15th century the German peasant was nearly everywhere a man, who, whilst subject to certain rents paid in produce and labour was otherwise at least practically free. The German colonists in Brandenburg, Pomerania, Silesia, and Eastern Prussia, were even legally acknowledged as free men. The victory of the nobility in the peasants’ war put an end to that. Not only were the conquered South German peasants again enslaved. From the middle of the 16th century the peasants of Eastern Prussia, Brandenburg, Pomerania, and Silesia, and soon after the free peasants of Schleswig-Holstein were degraded to the condition of serfs. (Maurer, Fronhöfe iv. vol., — Meitzen, “Der Boden des preussischen Staats” — Hanssen, “Leibeigenschaft in Schleswig-Holstein.” — <i>F. E.)</i>
    hash: sha256:3fa50471b7c2fe8a9c3027a9b33c41dfca25021bd3d7d42c097df98c709f2913
    state: active
  - id: p00237
    type: footnote
    label: "12"
    text: Further details are to be found in E. Regnault’s “Histoire politique et sociale des Principautés Danubiennes,” Paris, 1855.
    hash: sha256:e3b3caa51d00f03d45390e7e7318bf07006c24cac09f8c4883f7c1956fc9a5af
