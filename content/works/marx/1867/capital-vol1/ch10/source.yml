    text: It is well known with what reluctance the English “Free-traders” gave up the protective duty on the silk manufacture. Instead of the protection against French importation, the absence of protection to English factory children now serves their turn.
    hash: sha256:892e3c6362e50e9cf1e4759537a3773ad606dcc157d24f7f8f8eda97cb32cb23
    state: active
  - id: p00368
    type: footnote
    label: "142"
    text: During 1859 and 1860, the zenith years of the English cotton industry, some manufacturers tried, by the decoy bait of higher wages for over-time, to reconcile the adult male operatives to an extension of the working-day. The hand-mule spinners and self-actor mincers put an end to the experiment by a petition to their employers in which they say, “Plainly speaking, our lives are to us a burthen; and, while we are confined to the mills <i>nearly two days a week more</i> than the other operatives of the country, we feel like helots in the land, and that we are perpetuating a system injurious to ourselves and future generations.... This, therefore, is to give you most respectful notice that when we commence work again after the Christmas and New Year’s holidays, we shall work 60 hours per week, and no more, or from six to six, with one hour and a half out.” (Reports, &amp;c., for 30th April, 1860, p. 30.)
