  - id: p00280
    type: footnote
    label: "55"
    text: "<i>Reynolds’ Newspaper</i>, January, 1866. — Every week this same paper has, under the sensational headings, “Fearful and fatal accidents,” “Appalling tragedies,” &amp;c., a whole list of fresh railway catastrophes. On these an employee on the North Staffordshire line comments: “Everyone knows the consequences that may occur if the driver and fireman of a locomotive engine are not continually on the look-out. How can that be expected from a man who has been at such work for 29 or 30 hours, exposed to the weather, and without rest. The following is an example which is of very frequent occurrence: — One fireman commenced work on the Monday morning at a very early hour. When he had finished what is called a day’s work, he had been on duty 14 hours 50 minutes. Before he had time to get his tea, he was again called on for duty.... The next time he finished he had been on duty 14 hours 25 minutes, making a total of 29 hours 15 minutes without intermission. The rest of the week’s work was made up as follows: — Wednesday, 15 hours; Thursday, 15 hours 35 minutes; Friday, 14½ hours; Saturday, 14 hours 10 minutes, making a total for the week of 88 hours 30 minutes. Now, sir, fancy his astonishment on being paid 6 1/4 days for the whole. Thinking it was a mistake, he applied to the time-keeper,... and inquired what they considered a day’s work, and was told 13 hours for a goods man (<i>i.e</i>., 78 hours).... He then asked for what he had made over and above the 78 hours per week, but was refused. However, he was at last told they would give him another quarter, <i>i.e</i>., 10d.,” l.c., 4th February. 1866."
    hash: sha256:edbbcb512769dfd07a4ed0565e0a87945aca40559898ee638e7a2c56ecf3817b
