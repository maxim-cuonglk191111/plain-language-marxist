    text: Public meeting of agricultural labourers at Lasswade, near Edinburgh, January 5th, 1866. (See <i>Workman’s Advocate</i>, January 13th, 1866.) The formation since the close of 1865 of a Trades’ Union among the agricultural labourers at first in Scotland is a historic event. In one of the most oppressed agricultural districts of England, Buckinghamshire, the labourers, in March, 1867, made a great strike for the raising of their weekly wage from 9-10 shillings to 12 shillings. (It will be seen from the preceding passage that the movement of the English agricultural proletariat, entirely crushed since the suppression of its violent manifestations after 1830, and especially since the introduction of the new Poor Laws, begins again in the sixties, until it becomes finally epoch-making in 1872. I return to this in the 2nd volume, as well as to the Blue books that have appeared since 1867 on the position of the English land labourers. Addendum to the 3rd ed.)
