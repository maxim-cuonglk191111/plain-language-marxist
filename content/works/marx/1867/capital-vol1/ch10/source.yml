  - id: p00003
    type: heading
    level: 4
    text: THE LIMITS OF THE WORKING-DAY
    hash: sha256:0a1a4f2e637cf7839406bb92fd70dc1cb9a2b6e684aae19636577a761d7ba2d8
    state: active
  - id: p00004
    type: paragraph
    text: We started with the supposition that labour-power is bought and sold at its value. Its value, like that of all other commodities, is determined by the working-time necessary to its production. If the production of the average daily means of subsistence of the labourer takes up 6 hours, he must work, on the average, 6 hours every day, to produce his daily labour-power, or to reproduce the value received as the result of its sale. The necessary part of his working-day amounts to 6 hours, and is, therefore, <i>caeteris paribus</i> [other things being equal], a given quantity. But with this, the extent of the working-day itself is not yet given.
    hash: sha256:4534360523a6d178839d3960fe9112305f051f23fa6ca6b69b77a64a5723a744
    state: active
  - id: p00005
    type: paragraph
    text: "Let us assume that the line A–––B represents the length of the necessary working-time, say 6 hours. If the labour be prolonged 1, 3, or 6 hours beyond A—–B, we have 3 other lines:"
    hash: sha256:f781c433ab1e774f1fd153e00f7cb90c6624d64db714fb0df4ae3ed9fae9df96
    state: active
  - id: p00006
    type: table
    text: <tr><td>Working-day I.</td><td>Working-day II.</td><td>Working-day III.</td></tr><tr><td>A–––B–C.</td><td>A–––B––C.</td><td>A–––B–––C.</td></tr>
    hash: sha256:accc1f5ede248bfc33ef307a9145bc47f19cc03efb6a809f53cdec933b80cf6d
    state: active
  - id: p00007
    type: paragraph
    text: representing 3 different working-days of 7, 9, and 12 hours. The extension B—–C of the line A—–B represents the length of the surplus-labour. As the working-day is A—–B + B—–C or A—–C, it varies with the variable quantity B—–C. Since A—–B is constant, the ratio of B—–C to A—–B can always be calculated. In working-day I, it is 1/6, in working-day II, 3/6, in working day III 6/6 of A—–B. Since further the ratio (surplus working-time)/(necessary working-time), determines the rate of the surplus-value, the latter is given by the ratio of B—-C to A—-B. It amounts in the 3 different working-days respectively to 16 2/3, 50 and 100 per cent. On the other hand, the rate of surplus-value alone would not give us the extent of the working-day. If this rate, <i>e.g</i>., were 100 per cent., the working-day might be of 8, 10, 12, or more hours. It would indicate that the 2 constituent parts of the working-day, necessary-labour and surplus-labour time, were equal in extent, but not how long each of these two constituent parts was.
    hash: sha256:2531d56933f9b32df65f53240623fed017718cf35eef6ebfe12b7d70b0e51c83
    state: active
  - id: p00008
    type: paragraph
    text: The working-day is thus not a constant, but a variable quantity. One of its parts, certainly, is determined by the working-time required for the reproduction of the labour-power of the labourer himself. But its total amount varies with the duration of the surplus-labour. The working-day is, therefore, determinable, but is, <i>per se</i>, indeterminate. <fn ref="1"/>
    hash: sha256:2761105fd71c707523889cb7bd13d119d1c814c1d95a8a76c8d649a7873f112e
    state: active
  - id: p00009
    type: paragraph
    text: Although the working-day is not a fixed, but a fluent quantity, it can, on the other hand, only vary within certain limits. The minimum limit is, however, not determinable; of course, if we make the extension line B—‑C or the surplus-labour = 0, we have a minimum limit, <i>i.e</i>., the part of the day which the labourer must necessarily work for his own maintenance. On the basis of capitalist production, however, this necessary labour can form a part only of the working-day; the working-day itself can never be reduced to this minimum. On the other hand, the working-day has a maximum limit. It cannot be prolonged beyond a certain point. This maximum limit is conditioned by two things. First, by the physical bounds of labour-power. Within the 24 hours of the natural day a man can expend only a definite quantity of his vital force. A horse, in like manner, can only work from day to day, 8 hours. During part of the day this force must rest, sleep; during another part the man has to satisfy other physical needs, to feed, wash, and clothe himself. Besides these purely physical limitations, the extension of the working-day encounters moral ones. The labourer needs time for satisfying his intellectual and social wants, the extent and number of which are conditioned by the general state of social advancement. The variation of the working-day fluctuates, therefore, within physical and social bounds. But both these limiting conditions are of a very elastic nature, and allow the greatest latitude. So we find working-days of 8, 10, 12, 14, 16, 18 hours, i.e., of the most different lengths.
    hash: sha256:1645255ec707116a245329ee31b37e1d23a7ed2b227c09e1e57e34a39a7c36aa
    state: active
  - id: p00010
    type: paragraph
    text: The capitalist has bought the labour-power at its day-rate. To him its use-value belongs during one working-day. He has thus acquired the right to make the labourer work for him during one day. But, what is a working-day? <fn ref="2"/>
    hash: sha256:6c2fec794925ced6c147bbab4992a7b8c7f105dc899a5cf6020bfaffbacc14ac
    state: active
  - id: p00011
    type: paragraph
    text: At all events, less than a natural day. By how much? The capitalist has his own views of this <i>ultima Thule</i> [the outermost limit], the necessary limit of the working-day. As capitalist, he is only capital personified. His soul is the soul of capital. But capital has one single life impulse, the tendency to create value and surplus-value, to make its constant factor, the means of production, absorb the greatest possible amount of surplus-labour. <fn ref="3"/>
    hash: sha256:3adda4e8db09af5e4403b46dfbe3e8e3f3f024830cebbeef4b5c4870ed6e0249
    state: active
  - id: p00012
    type: paragraph
    text: Capital is dead labour, that, vampire-like, only lives by sucking living labour, and lives the more, the more labour it sucks. The time during which the labourer works, is the time during which the capitalist consumes the labour-power he has purchased of him. <fn ref="4"/>
    hash: sha256:fdf5f54ab19c36bbf163ec1efdd033d51552cdde9dc69f8c5c033040b16a12d2
    state: active
  - id: p00013
    type: paragraph
    text: If the labourer consumes his disposable time for himself, he robs the capitalist. <fn ref="5"/>
    hash: sha256:a830fb3f69a10feb74173642ec2b97b032feedde0229e44f5a170de99779cb89
    state: active
  - id: p00014
    type: paragraph
    text: "The capitalist then takes his stand on the law of the exchange of commodities. He, like all other buyers, seeks to get the greatest possible benefit out of the use-value of his commodity. Suddenly the voice of the labourer, which had been stifled in the storm and stress of the process of production, rises:"
    hash: sha256:d40f0356a91ed062140094ef267d09b041857a5b08a84d48736d42c21ffb9743
    state: active
  - id: p00015
    type: paragraph
    text: The commodity that I have sold to you differs from the crowd of other commodities, in that its use creates value, and a value greater than its own. That is why you bought it. That which on your side appears a spontaneous expansion of capital, is on mine extra expenditure of labour-power. You and I know on the market only one law, that of the exchange of commodities. And the consumption of the commodity belongs not to the seller who parts with it, but to the buyer, who acquires it. To you, therefore, belongs the use of my daily labour-power. But by means of the price that you pay for it each day, I must be able to reproduce it daily, and to sell it again. Apart from natural exhaustion through age, &amp;c., I must be able on the morrow to work with the same normal amount of force, health and freshness as to-day. You preach to me constantly the gospel of “saving” and “abstinence.” Good! I will, like a sensible saving owner, husband my sole wealth, labour-power, and abstain from all foolish waste of it. I will each day spend, set in motion, put into action only as much of it as is compatible with its normal duration, and healthy development. By an unlimited extension of the working-day, you may in one day use up a quantity of labour-power greater than I can restore in three. What you gain in labour I lose in substance. The use of my labour-power and the spoliation of it are quite different things. If the average time that (doing a reasonable amount of work) an average labourer can live, is 30 years, the value of my labour-power, which you pay me from day to day is 1/(365×30) or 1/10950 of its total value. But if you consume it in 10 years, you pay me daily 1/10950 instead of 1/3650 of its total value, <i>i.e</i>., only 1/3 of its daily value, and you rob me, therefore, every day of 2/3 of the value of my commodity. You pay me for one day’s labour-power, whilst you use that of 3 days. That is against our contract and the law of exchanges. I demand, therefore, a working-day of normal length, and I demand it without any appeal to your heart, for in money matters sentiment is out of place. You may be a model citizen, perhaps a member of the Society for the Prevention of Cruelty to Animals, and in the odour of sanctity to boot; but the thing that you represent face to face with me has no heart in its breast. That which seems to throb there is my own heart-beating. I demand the normal working-day because I, like every other seller, demand the value of my commodity. <fn ref="6"/>
    hash: sha256:cca1ee74e55f1b082fb081403ea2388b8356220c37d5e960f7a85402000ea243
    state: active
  - id: p00016
    type: paragraph
    text: We see then, that, apart from extremely elastic bounds, the nature of the exchange of commodities itself imposes no limit to the working-day, no limit to surplus-labour. The capitalist maintains his rights as a purchaser when he tries to make the working-day as long as possible, and to make, whenever possible, two working-days out of one. On the other hand, the peculiar nature of the commodity sold implies a limit to its consumption by the purchaser, and the labourer maintains his right as seller when he wishes to reduce the working-day to one of definite normal duration. There is here, therefore, an antinomy, right against right, both equally bearing the seal of the law of exchanges. Between equal rights force decides. Hence is it that in the history of capitalist production, the determination of what is a working-day, presents itself as the result of a struggle, a struggle between collective capital, <i>i.e.,</i> the class of capitalists, and collective labour, <i>i.e.,</i> the working-class.
    hash: sha256:7d476ad1ade6bea6f2470a48a690be66fd2f22bf4964ccaec2046054810ad87e
    state: active
  - id: p00017
    type: heading
    level: 3
    text: SECTION 2
    hash: sha256:1bbe219f72ec4714da6f9e8e0cd81fcd41ddad5e4a6d144fd7e3ac6016a85e99
    state: active
  - id: p00018
    type: heading
    level: 4
    text: THE GREED FOR SURPLUS-LABOUR. MANUFACTURER AND BOYARD
    hash: sha256:17a4deaa08bcbd3e9fa11da121ebb7cba161ccda55a8e15adf7d22f56f01e77d
    state: active
  - id: p00019
    type: paragraph
    text: 'Capital has not invented surplus-labour. Wherever a part of society possesses the monopoly of the means of production, the labourer, free or not free, must add to the working-time necessary for his own maintenance an extra working-time in order to produce the means of subsistence for the owners of the means of production, <fn ref="7"/> whether this proprietor be the Athenian caloς cagaqoς [well-to-do man], Etruscan theocrat, <i>civis Romanus</i> [Roman citizen], Norman baron, American slave-owner, Wallachian Boyard, modern landlord or capitalist. <fn ref="8"/> It is, however, clear that in any given economic formation of society, where not the exchange-value but the use-value of the product predominates, surplus-labour will be limited by a given set of wants which may be greater or less, and that here no boundless thirst for surplus-labour arises from the nature of the production itself. Hence in antiquity over-work becomes horrible only when the object is to obtain exchange-value in its specific independent money-form; in the production of gold and silver. Compulsory working to death is here the recognised form of over-work. Only read Diodorus Siculus. <fn ref="9"/> Still these are exceptions in antiquity. But as soon as people, whose production still moves within the lower forms of slave-labour, corvée-labour, &amp;c., are drawn into the whirlpool of an international market dominated by the capitalistic mode of production, the sale of their products for export becoming their principal interest, the civilised horrors of over-work are grafted on the barbaric horrors of slavery, serfdom, &amp;c. Hence the negro labour in the Southern States of the American Union preserved something of a patriarchal character, so long as production was chiefly directed to immediate local consumption. But in proportion, as the export of cotton became of vital interest to these states, the over-working of the negro and sometimes the using up of his life in 7 years of labour became a factor in a calculated and calculating system. It was no longer a question of obtaining from him a certain quantity of useful products. It was now a question of production of surplus-labour itself: So was it also with the corvée, e.g., in the Danubian Principalities (now Roumania).'
    hash: sha256:9810bd9efa47c5e42a447013b1823d671ead9808425f3fdbe68e15f7406ad03e
    state: active
  - id: p00020
    type: paragraph
    text: The comparison of the greed for surplus-labour in the Danubian Principalities with the same greed in English factories has a special interest, because surplus-labour in the corvée has an independent and palpable form.
    hash: sha256:cb289dfc29b792de4ab2baeb83b245812891de92c94cc07aee2cb26c1e994bfb
    state: active
  - id: p00021
    type: paragraph
    text: Suppose the working-day consists of 6 hours of necessary labour, and 6 hours of surplus-labour. Then the free labourer gives the capitalist every week 6 x 6 or 36 hours of surplus-labour. It is the same as if he worked 3 days in the week for himself, and 3 days in the week gratis for the capitalist. But this is not evident on the surface. Surplus-labour and necessary labour glide one into the other. I can, therefore, express the same relationship by saying, e.g., that the labourer in every minute works 30 seconds for himself, and 30 for the capitalist, etc. It is otherwise with the corvée. The necessary labour which the Wallachian peasant does for his own maintenance is distinctly marked off from his surplus-labour on behalf of the Boyard. The one he does on his own field, the other on the seignorial estate. Both parts of the labour-time exist, therefore, independently, side by side one with the other. In the corvée the surplus-labour is accurately marked off from the necessary labour. This, however, can make no difference with regard to the quantitative relation of surplus-labour to necessary labour. Three days’ surplus-labour in the week remain three days that yield no equivalent to the labourer himself, whether it be called corvée or wage-labour. But in the capitalist the greed for surplus-labour appears in the straining after an unlimited extension of the working-day, in the Boyard more simply in a direct hunting after days of corvée. <fn ref="10"/>
    hash: sha256:eb7c052dc53a760e9a2d028b2ce8c6f1e6a202504f152a833734d0c35514bf82
    state: active
  - id: p00022
    type: paragraph
    text: In the Danubian Principalities the corvée was mixed up with rents in kind and other appurtenances of bondage, but it formed the most important tribute paid to the ruling class. Where this was the case, the corvée rarely arose from serfdom; serfdom much more frequently on the other hand took origin from the corvée. <fn ref="11"/> This is what took place in the Roumanian provinces. Their original mode of production was based on community of the soil, but not in the Slavonic or Indian form. Part of the land was cultivated in severalty as freehold by the members of the community, another part — <i>ager publicus —</i> was cultivated by them in common. The products of this common labour served partly as a reserve fund against bad harvests and other accidents, partly as a public store for providing the costs of war, religion, and other common expenses. In course of time military and clerical dignitaries usurped, along with the common land, the labour spent upon it. The labour of the free peasants on their common land was transformed into corvée for the thieves of the common land. This corvée soon developed into a servile relationship existing in point of fact, not in point of law, until Russia, the liberator of the world, made it legal under presence of abolishing serfdom. The code of the corvée, which the Russian General Kisseleff proclaimed in 1831, was of course dictated by the Boyards themselves. Thus Russia conquered with one blow the magnates of the Danubian provinces, and the applause of liberal cretins throughout Europe.
    hash: sha256:e2afde47322cbcbdc9ddd1a410be7fbcafadda5394d5090691be195e7d017bdb
    state: active
  - id: p00023
    type: paragraph
    text: "According to the “Règlement organique,” as this code of the corvée is called, every Wallachian peasant owes to the so-called landlord, besides a mass of detailed payments in kind: <i>(1)</i>, 12 days of general labour; <i>(2)</i>, one day of field labour; <i>(3)</i>, one day of wood carrying. In all, 14 days in the year. With deep insight into Political Economy, however, the working-day is not taken in its ordinary sense, but as the working-day necessary to the production of an average daily product; and that average daily product is determined in so crafty a way that no Cyclops would be done with it in 24 hours. In dry words, the Réglement itself declares with true Russian irony that by 12 working-days one must understand the product of the manual labour of 36 days, by 1 day of field labour 3 days, and by 1 day of wood carrying in like manner three times as much. In all, 42 corvée days. To this had to be added the so-called jobagie, service due to the lord for extraordinary occasions. In proportion to the size of its population, every village has to furnish annually a definite contingent to the jobagie. This additional corvée is estimated at 14 days for each Wallachian peasant. Thus the prescribed corvée amounts to 56 working-days yearly. But the agricultural year in Wallachia numbers in consequence of the severe climate only 210 days, of which 40 for Sundays and holidays, 30 on an average for bad weather, together 70 days, do not count. 140 working-days remain. The ratio of the corvée to the necessary labour 56/84 or 66 2/3 % gives a much smaller rate of surplus-value than that which regulates the labour of the English agricultural or factory labourer. This is, however, only the legally prescribed corvée. And in a spirit yet more “liberal” than the English Factory Acts, the “Règlement organique” has known how to facilitate its own evasion. After it has made 56 days out of 12, the nominal day’s work of each of the 56 corvée days is again so arranged that a portion of it must fall on the ensuing day. In one day, e.g., must be weeded an extent of land, which, for this work, especially in maize plantations, needs twice as much time. The legal day’s work for some kinds of agricultural labour is interpretable in such a way that the day begins in May and ends in October. In Moldavia conditions are still harder."
    hash: sha256:5ba2491534e6a2aef9c72e2e2da628e8e561d7223b9deca2986f18af63390983
    state: active
  - id: p00024
    type: blockquote
    text: “The 12 corvée days of the ‘Règlement organique’ cried a Boyard drunk with victory, amount to 365 days in the year.” <fn ref="12"/>
    hash: sha256:8fcd314cc0e4a430e68d316584e04ef6f5bbdb1ed1ee9a007188bee0ea1bc189
    state: active
  - id: p00025
    type: paragraph
    text: If the Règlement organique of the Danubian provinces was a positive expression of the greed for surplus-labour which every paragraph legalised, the English Factory Acts are the negative expression of the same greed. These acts curb the passion of capital for a limitless draining of labour-power, by forcibly limiting the working-day by state regulations, made by a state that is ruled by capitalist-and landlord. Apart from the working-class movement that daily grew more threatening, the limiting of factory labour was dictated by the same necessity which spread guano over the English fields. The same blind eagerness for plunder that in the one case exhausted the soil, had, in the other, torn up by the roots the living force of the nation. Periodical epidemics speak on this point as clearly as the diminishing military standard in Germany and France. <fn ref="13"/>
    hash: sha256:458f9b2ef61b9aba69bc447461d3caf03158c0f69062cbfa25f6c8ec13f2b6a4
    state: active
  - id: p00026
    type: paragraph
    text: The Factory Act of 1850 now in force (1867) allows for the average working-day 10 hours, i.e., for the first 5 days 12 hours from 6 a.m. to 6 p.m., including ½ an hour for breakfast, and an hour for dinner, and thus leaving 10½ working-hours, and 8 hours for Saturday, from 6 a.m. to 2 p.m., of which ½ an hour is subtracted for breakfast. 60 working-hours are left, 10½ for each of the first 5 days, 7½ for the last. <fn ref="14"/>
    hash: sha256:cbe23b3fcd6ea925e7c14f8e684247c3063fecb305b09ffa38db864f5033f9ca
    state: active
  - id: p00027
    type: paragraph
    text: Certain guardians of these laws are appointed, Factory Inspectors, directly under the Home Secretary, whose reports are published half-yearly, by order of Parliament. They give regular and official statistics of the capitalistic greed for surplus-labour.
    hash: sha256:8b87396ffa64f45efd8f649dc8c794204d8badf7aa804a1cc3fb8c645ed8b668
    state: active
  - id: p00028
    type: paragraph
    text: Let us listen, for a moment, to the Factory Inspectors. <fn ref="15"/>
    hash: sha256:f65d0e92d5485a725364805d8dbc0cd6f84e23d7094e02618b1f9468cff77e9e
    state: active
  - id: p00029
    type: blockquote
    text: “The fraudulent mill-owner begins work a quarter of an hour (sometimes more, sometimes less) before 6 a.m., and leaves off a quarter of an hour (sometimes more, sometimes less) after 6 p.m. He takes 5 minutes from the beginning and from the end of the half hour nominally allowed for breakfast, and 10 minutes at the beginning and end of the hour nominally allowed for dinner. He works for a quarter of an hour (sometimes more, sometimes less) after 2 p.m. on Saturday. Thus his gain is —
    hash: sha256:6befd3d004ef9fed2074cbfad10a45e2bea7a53552b2e3092b6f7c3d87dccfe1
    state: active
  - id: p00030
    type: table
    text: <tr><td>Before 6 a.m.,</td><td>15 minutes.</td></tr><tr><td>After 6 p.m.,</td><td>15 "</td></tr><tr><td>At breakfast time,</td><td>10 "</td></tr><tr><td>At dinner time,</td><td>20 "</td></tr><tr><td>Five days — 300 minutes,</td><td>60 "</td></tr><tr><td>On Saturday before 6 a.m.,</td><td>15 minutes.</td></tr><tr><td>At breakfast time,</td><td>10 "</td></tr><tr><td>After 2 p.m.,</td><td>15 "</td></tr><tr><td></td><td>40 minutes.</td></tr><tr><td>Total weekly,</td><td>340 minutes.</td></tr>
    hash: sha256:c4d3401579622d0a56b0add54f636621a3c2451c58c0e05715c309efe10407cf
    state: active
  - id: p00031
    type: blockquote
    text: Or 5 hours and 40 minutes weekly, which multiplied by 50 working weeks in the year (allowing two for holidays and occasional stoppages) is equal to 27 working-days.” <fn ref="16"/>
    hash: sha256:febecd5943a0a74a1ffd33504823488a0940c626a891194a7d3f55e942856ba4
    state: active
  - id: p00032
    type: blockquote
    text: “Five minutes a day’s increased work, multiplied by weeks, are equal to two and a half days of produce in the year.” <fn ref="17"/>
    hash: sha256:e751a0215090493d33dfedbe2d5c51969f8bf4d068938bc0bd4063594088ba20
    state: active
  - id: p00033
    type: blockquote
    text: “An additional hour a day gained by small instalments before 6 a.m., after 6 p.m., and at the beginning and end of the times nominally fixed for meals, is nearly equivalent to working 13 months in the year.” <fn ref="18"/>
    hash: sha256:98a327d38953c377865f16d12b79180c6471254dfc72570b7d77a07c3b91cbb1
    state: active
  - id: p00034
    type: paragraph
    text: Crises during which production is interrupted and the factories work “short time,” i.e., for only a part of the week, naturally do not affect the tendency to extend the working-day. The less business there is, the more profit has to be made on the business done. The less time spent in work, the more of that time has to be turned into surplus labour-time.
    hash: sha256:c3d6b8ea11106c64a6f9f4ed6c4e3a611a7f611ba0e95c987ab7193bd1d29225
    state: active
  - id: p00035
    type: paragraph
    text: "Thus the Factory Inspector’s report on the period of the crisis from 1857 to 1858:"
    hash: sha256:94198f292680a995abcdfd580494f1973c4dc34582d29df469c74c6f3b9caa36
    state: active
  - id: p00036
    type: blockquote
    text: “It may seem inconsistent that there should be any overworking at a time when trade is so bad; but that very badness leads to the transgression by unscrupulous men, they get the extra profit of it. ... In the last half year, says Leonard Horner, 122 mills in my district have been given up; 143 were found standing,” yet, over-work is continued beyond the legal hours. <fn ref="19"/>
    hash: sha256:925971cefb3376eb151ef09d765749a9df2038dbca56596f10f5418f99860aea
    state: active
  - id: p00037
    type: blockquote
    text: “For a great part of the time,” says Mr. Howell, “owing to the depression of trade, many factories were altogether closed, and a still greater number were working short time. I continue, however, to receive about the usual number of complaints that half, or three-quarters of an hour in the day, are snatched from the workers by encroaching upon the times professedly allowed for rest and refreshment.” <fn ref="20"/>
    hash: sha256:a9ce0081a31c6515d129a11c809b2cdd9e7fe951572e4e8ad46d062fc87910d0
    state: active
  - id: p00038
    type: paragraph
    text: The same phenomenon was reproduced on a smaller scale during the frightful cotton-crises from 1861 to 1865. <fn ref="21"/>
    hash: sha256:0ac759581d4e4c561dc5699cf619e14075e0ea5373922c64cbe36a9c6a3598a2
    state: active
  - id: p00039
    type: blockquote
    text: “It is sometimes advanced by way of excuse, when persons are found at work in a factory, either at a meal hour, or at some illegal time, that they will not leave the mill at the appointed hour, and that compulsion is necessary to force them to cease work [cleaning their machinery, &amp;c.], especially on Saturday afternoons. But, if the hands remain in a factory after the machinery has ceased to revolve ... they would not have been so employed if sufficient time had been set apart specially for cleaning, &amp;c., either before 6 a.m. <i>[sic.!]</i> or before 2 p.m. on Saturday afternoons.” <fn ref="22"/>
    hash: sha256:e6090129e578defa761c46840abb0ad600e37183ce5b3a2ab66a216cb69d655d
    state: active
  - id: p00040
    type: blockquote
    text: “The profit to be gained by it (over-working in violation of the Act) appears to be, to many, a greater temptation than they can resist; they calculate upon the chance of not being found out; and when they see the small amount of penalty and costs, which those who have been convicted have had to pay, they find that if they should be detected there will still be a considerable balance of gain.... <fn ref="23"/> In cases where the additional time is gained by a multiplication of small thefts in the course of the day, there are insuperable difficulties to the inspectors making out a case.” <fn ref="24"/>
    hash: sha256:33a8bc7f855fa45c5c20abd50923405432b5255c33e394556f99506f8048b74d
    state: active
  - id: p00041
    type: paragraph
    text: These “small thefts” of capital from the labourer’s meal and recreation time, the factory inspectors also designate as “petty pilferings of minutes,” <fn ref="25"/> “snatching a few minutes,” <fn ref="26"/> or, as the labourers technically called them, “nibbling and cribbling at meal-times.” <fn ref="27"/>
    hash: sha256:7951912b35268ed2fe4893a8e78ce9719dcd916fd9afdd2edcdf2d55c64e25a5
    state: active
  - id: p00042
    type: paragraph
    text: It is evident that in this atmosphere the formation of surplus-value by surplus-labour, is no secret.
    hash: sha256:e654513eabf57f24e148bd03f1ddb8d154e4b0eb3b69b9ca08e08bbb1f755ff2
    state: active
  - id: p00043
    type: blockquote
    text: “If you allow me,” said a highly respectable master to me, “to work only ten minutes in the day over-time, you put one thousand a year in my pocket.” <fn ref="28"/> “Moments are the elements of profit.” <fn ref="29"/>
    hash: sha256:addcaca99614480ca8124bc835b09d623c22360a0e49733ee61a01bfc01c2acb
    state: active
  - id: p00044
    type: paragraph
    text: Nothing is from this point of view more characteristic than the designation of the workers who work full time as “full-timers,” and the children under 13 who are only allowed to work 6 hours as “half-timers.” The worker is here nothing more than personified labour-time. All individual distinctions are merged in those of “full-timers” and “half-timers.” <fn ref="30"/>
    hash: sha256:09ad172f782f18058ade3fce0fe138212286761b702f6bf90877532262fdba71
    state: active
  - id: p00045
    type: heading
    level: 3
    text: SECTION 3
    hash: sha256:c42035a9664ccca6f411ebb9e851680dd88d8ef10143685301255c123957a3d8
    state: active
  - id: p00046
    type: heading
    level: 4
    text: BRANCHES OF ENGLISH INDUSTRY WITHOUT LEGAL LIMITS TO EXPLOITATION
    hash: sha256:334dec6031e63ec77fa7be97989e9036feb751fe7a9a271a8ff36dc43bea2607
    state: active
  - id: p00047
    type: paragraph
    text: We have hitherto considered the tendency to the extension of the working-day, the were-wolf’s hunger for surplus-labour in a department where the monstrous exactions, not surpassed, says an English bourgeois economist, by the cruelties of the Spaniards to the American red-skins, <fn ref="31"/> caused capital at last to be bound by the chains of legal regulations. Now, let us cast a glance at certain branches of production in which the exploitation of labour is either free from fetters to this day, or was so yesterday.
    hash: sha256:a97af947a2b80cb1a8b64caaa6584c49bb20de195c0ff21e2fc4a0de62a0837a
    state: active
  - id: p00048
    type: blockquote
    text: Mr. Broughton Charlton, county magistrate, declared, as chairman of a meeting held at the Assembly Rooms, Nottingham, on the 14th January, 1860, “that there was an amount of privation and suffering among that portion of the population connected with the lace trade, unknown in other parts of the kingdom, indeed, in the civilised world .... Children of nine or ten years are dragged from their squalid beds at two, three, or four o’clock in the morning and compelled to work for a bare subsistence until ten, eleven, or twelve at night, their limbs wearing away, their frames dwindling, their faces whitening, and their humanity absolutely sinking into a stone-like torpor, utterly horrible to contemplate.... We are not surprised that Mr. Mallett, or any other manufacturer, should stand forward and protest against discussion.... The system, as the Rev. Montagu Valpy describes it, is one of unmitigated slavery, socially, physically, morally, and spiritually.... What can be thought of a town which holds a public meeting to petition that the period of labour for men shall be diminished to eighteen hours a day? .... We declaim against the Virginian and Carolinian cotton-planters. Is their black-market, their lash, and their barter of human flesh more detestable than this slow sacrifice of humanity which takes place in order that veils and collars may be fabricated for the benefit of capitalists?” <fn ref="32"/>
    hash: sha256:d461996ac80f237eefa87892d00e416f8ba3551a50114acc8cf0473d72039b01
    state: active
  - id: p00049
    type: paragraph
    text: The potteries of Staffordshire have, during the last 22 years, been the subject of three parliamentary inquiries. The result is embodied in Mr. Scriven’s Report of 1841 to the “ Children’s Employment Commissioners,” in the report of Dr. Greenhow of 1860 published by order of the medical officer of the Privy Council (Public Health, 3rd Report, 112-113), lastly, in the report of Mr. Longe of 1862 in the “First Report of the Children’s Employment Commission, of the 13th June, 1863.” For my purpose it is enough to take, from the reports of 1860 and 1863, some depositions of the exploited children themselves. From the children we may form an opinion as to the adults, especially the girls and women, and that in a branch of industry by the side of which cotton-spinning appears an agreeable and healthful occupation. <fn ref="33"/>
    hash: sha256:cbecb509627e5adef21b860176484959e3de818e8edc92b79630e040dc8260ef
    state: active
  - id: p00050
    type: paragraph
    text: William Wood, 9 years old, was 7 years and 10 months when he began to work. He “ran moulds” (carried ready-moulded articles into the drying-room, afterwards bringing back the empty mould) from the beginning. He came to work every day in the week at 6 a.m., and left off about 9 p.m. “I work till 9 o’clock at night six days in the week. I have done so seven or eight weeks.”
    hash: sha256:7b9af46b19747245a9520e72d6619316b936c2abb65031f61fffc8d23ae632c1
    state: active
  - id: p00051
    type: blockquote
    text: "Fifteen hours of labour for a child 7 years old! J. Murray, 12 years of age, says: “I turn jigger, and run moulds. I come at 6. Sometimes I come at 4. I worked all night last night, till 6 o’clock this morning. I have not been in bed since the night before last. There were eight or nine other boys working last night. All but one have come this morning. I get 3 shillings and sixpence. I do not get any more for working at night. I worked two nights last week.”"
    hash: sha256:5cc9c811432a389fa6d792c42db89cfbbb21188fc4ae1b0061a02dd3fa7e448f
    state: active
  - id: p00052
    type: paragraph
    text: "Fernyhough, a boy of ten:"
    hash: sha256:266e69a787c266e2e1b4fd008167521cc6129e68832927a371072ee090ed4d99
    state: active
  - id: p00053
    type: blockquote
    text: “I have not always an hour (for dinner). I have only half an hour sometimes; on Thursday, Friday, and Saturday.” <fn ref="34"/>
    hash: sha256:2d9b4714226ab56c18c0afb5027d7e9d005f19ac50dddc8ebccb1a1a741c3c24
    state: active
  - id: p00054
    type: paragraph
    text: "Dr. Greenhow states that the average duration of life in the pottery districts of Stoke-on-Trent, and Wolstanton is extraordinarily short. Although in the district of Stoke, only 36.6% and in Wolstanton only 30.4% of the adult male population above 20 are employed in the potteries, among the men of that age in the first district more than half, in the second, nearly 2/5 of the whole deaths are the result of pulmonary diseases among the potters. Dr. Boothroyd, a medical practitioner at Hanley, says:"
    hash: sha256:a6244ef7c5fc446f906dcb4b47284082e56f5f47e6a1ebba6afb6ad7c6d0ba64
    state: active
  - id: p00055
    type: blockquote
    text: “Each successive generation of potters is more dwarfed and less robust than the preceding one.”
    hash: sha256:7a44d4e0b2df60dbbe544c022d368239ec950ec7b32011b1e6d9da2417bb44c7
    state: active
  - id: p00056
    type: paragraph
    text: "In like manner another doctor, Mr. M’Bean:"
    hash: sha256:8e004f4efbc6cfdf3da10d82943713627415b237c72438d6936383e872481f77
    state: active
  - id: p00057
    type: blockquote
    text: “Since he began to practice among the potters 25 years ago, he had observed a marked degeneration especially shown in diminution of stature and breadth.”
    hash: sha256:a4e6b10d1d46cc8756e5587fe11e100127403be4ccbf56f1603fa20c0974ec71
    state: active
  - id: p00058
    type: paragraph
    text: These statements are taken from the report of Dr. Greenhow in 1860. <fn ref="35"/>
    hash: sha256:ce61852d43c51366f7ae4c17e8a3c64bf335352430938e95b06de7aca3dc21e1
    state: active
  - id: p00059
    type: paragraph
    text: "From the report of the Commissioners in 1863, the following: Dr. J. T. Arledge, senior physician of the North Staffordshire Infirmary, says:"
    hash: sha256:6fae3f740e8b3ae2d65552fbaaa038ba1d3d6505e33058f2551c825fe0c05dc8
    state: active
  - id: p00060
    type: blockquote
    text: “The potters as a class, both men and women, represent a degenerated population, both physically and morally. They are, as a rule, stunted in growth, ill-shaped, and frequently ill-formed in the chest; they become prematurely old, and are certainly short-lived; they are phlegmatic and bloodless, and exhibit their debility of constitution by obstinate attacks of dyspepsia, and disorders of the liver and kidneys, and by rheumatism. But of all diseases they are especially prone to chest-disease, to pneumonia, phthisis, bronchitis, and asthma. One form would appear peculiar to them, and is known as potter’s asthma, or potter’s consumption. Scrofula attacking the glands, or bones, or other parts of the body, is a disease of two-thirds or more of the potters .... That the ‘degenerescence’ of the population of this district is not even greater than it is, is due to the constant recruiting from the adjacent country, and intermarriages with more healthy races.” <fn ref="36"/>
    hash: sha256:bf7625164c10240fe3af4ea219263aaa953d107691804cfc36a52c5dc265f45b
    state: active
  - id: p00061
    type: paragraph
    text: "Mr. Charles Parsons, late house surgeon of the same institution, writes in a letter to Commissioner Longe, amongst other things:"
    hash: sha256:2619ec3d78527eec551f37aa417a86223e50e7595d23910a2bd06014e3d6e28f
    state: active
  - id: p00062
    type: blockquote
    text: “I can only speak from personal observation and not from statistical data, but I do not hesitate to assert that my indignation has been aroused again and again at the sight of poor children whose health has been sacrificed to gratify the avarice of either parents or employers.” He enumerates the causes of the diseases of the potters, and sums them up in the phrase, “long hours.” The report of the Commission trusts that “a manufacture which has assumed so prominent a place in the whole world, will not long be subject to the remark that its great success is accompanied with the physical deterioration, widespread bodily suffering, and early death of the workpeople ... by whose labour and skill such great results have been achieved.” <fn ref="37"/>
    hash: sha256:9410ba0cb01261d7a20b0da50d898cf798d704b93b5421ef31ca6d76437efcb3
    state: active
  - id: p00063
    type: blockquote
    text: And all that holds of the potteries in England is true of those in Scotland. <fn ref="38"/>
    hash: sha256:b84cf1865fe05e8a48f0d09cc82026cc868be7c5ea7f3a39b6155ba3979dcb1f
    state: active
  - id: p00064
    type: paragraph
    text: The manufacture of lucifer matches dates from 1833, from the discovery of the method of applying phosphorus to the match itself. Since 1845 this manufacture has rapidly developed in England, and has extended especially amongst the thickly populated parts of London as well as in Manchester, Birmingham, Liverpool, Bristol, Norwich, Newcastle and Glasgow. With it has spread the form of lockjaw, which a Vienna physician in 1845 discovered to be a disease peculiar to lucifer-matchmakers. Half the workers are children under thirteen, and young persons under eighteen. The manufacture is on account of its unhealthiness and unpleasantness in such bad odour that only the most miserable part of the labouring class, half-starved widows and so forth, deliver up their children to it, “the ragged, half-starved, untaught children.” <fn ref="39"/>
    hash: sha256:b262a1297a687f0d033fe41671b0dc174735486caf180ecf1191965b29096589
    state: active
  - id: p00065
    type: paragraph
    text: Of the witnesses that Commissioner White examined (1863), 270 were under 18, 50 under 10, 10 only 8, and 5 only 6 years old. A range of the working-day from 12 to 14 or 15 hours, night-labour, irregular meal-times, meals for the most part taken in the very workrooms that are pestilent with phosphorus. Dante would have found the worst horrors of his Inferno surpassed in this manufacture.
    hash: sha256:924e7e85da0f39d94a662d8ba5d0d5eca2572a04356e2d2b2de72c007c2b31ac
    state: active
  - id: p00066
    type: paragraph
    text: In the manufacture of paper-hangings the coarser sorts are printed by machine; the finer by hand (block-printing). The most active business months are from the beginning of October to the end of April. During this time the work goes on fast and furious without intermission from 6 a.m. to 10 p.m. or further into the night.
    hash: sha256:c391491ff108667a8723a7a6aea6b04e7079a955d434a59488ab15ddb41c1691
    state: active
  - id: p00067
    type: paragraph
    text: "J. Leach deposes:"
    hash: sha256:ee1244d5063d5119e752342eb86faad49fe24d48efbcb22cb6b132ddf3d70135
    state: active
  - id: p00068
    type: blockquote
    text: '“Last winter six out of nineteen girls were away from ill-health at one time from over-work. I have to bawl at them to keep them awake.” W. Duffy: “I have seen when the children could none of them keep their eyes open for the work; indeed, none of us could.” J. Lightbourne: “Am 13 ... We worked last winter till 9 (evening), and the winter before till 10. I used to cry with sore feet every night last winter.” G. Apsden: “That boy of mine when he was 7 years old I used to carry him on my back to and fro through the snow, and he used to have 16 hours a day ... I have often knelt down to feed him as he stood by the machine, for he could not leave it or stop.” Smith, the managing partner of a Manchester factory: “We (he means his “hands” who work for “us”) work on with no stoppage for meals, so that day’s work of 10½ hours is finished by 4.30 p.m., and all after that is over-time.” <fn ref="40"/> (Does this Mr. Smith take no meals himself during 10½ hours?) “We (this same Smith) seldom leave off working before 6 p.m. (he means leave off the consumption of “our” labour-power machines), so that we (iterum Crispinus) are really working over-time the whole year round. For all these, children and adults alike (152 children and young persons and 140 adults), the average work for the last 18 months has been at the very least 7 days, 5 hours, or 78 1/2 hours a week. For the six weeks ending May 2nd this year (1862), the average was higher — 8 days or 84 hours a week.”'
    hash: sha256:de23a48fd8cd66f0995117cdb4f8377c60012cf7e2d36598ed6cfa5feb1cfcc6
    state: active
  - id: p00069
    type: paragraph
    text: 'Still this same Mr. Smith, who is so extremely devoted to the <i>pluralis majestatis</i> [the Royal “we,” i.e., speaking on behalf of his subjects], adds with a smile, "Machine-work is not great.” So the employers in the block-printing say: “Hand labour is more healthy than machine work.” On the whole, manufacturers declare with indignation against the proposal “to stop the machines at least during meal-times.”'
    hash: sha256:8b74b99447e5d256e522bb2ecd290373368b469f160fd483358eb12fa316ea53
    state: active
  - id: p00070
    type: blockquote
    text: “A clause,” says Mr. Otley, manager of a wall-paper factory in the Borough, “which allowed work between, say 6 a.m. and 9 p.m. in would suit us (!) very well, but the factory hours, 6 a.m. to 6 p.m., are not suitable. Our machine is always stopped for dinner. (What generosity!) There is no waste of paper and colour to speak of. But,” he adds sympathetically, “I can understand the loss of time not being liked.”
    hash: sha256:e2e02ee97d8de73dfbaba3b2867beb7f7c3a8eb9f1f591fd6e0f2808bfcb506f
    state: active
  - id: p00071
    type: paragraph
    text: The report of the Commission opines with naïveté that the fear of some “leading firms” of losing time, <i>i.e.,</i> the time for appropriating the labour of others, and thence losing profit is not a sufficient reason for allowing children under 13, and young persons under 18, working 12 to 16 hours per day, to lose their dinner, nor for giving it to them as coal and water are supplied to the steam-engine, soap to wool, oil to the wheel — as merely auxiliary material to the instruments of labour, during the process of production itself. <fn ref="41"/>
    hash: sha256:d919e1d26844377dacb4f3a3aa469a6904037c24ca96bf306274987cada89078
    state: active
  - id: p00072
    type: paragraph
    text: No branch of industry in England (we do not take into account the making of bread by machinery recently introduced) has preserved up to the present day a method of production so archaic, so — as we see from the poets of the Roman Empire — pre-christian, as baking. But capital, as was said earlier, is at first indifferent as to the technical character of the labour-process; it begins by taking it just as it finds it.
    hash: sha256:ae91083651c0d9738cee98dc7c33015a3b22341f4c443eae3a304c550a73a745
    state: active
  - id: p00073
    type: paragraph
    text: The incredible adulteration of bread, especially in London, was first revealed by the House of Commons Committee “on the adulteration of articles of food” (1855-56), and Dr. Hassall’s work, “Adulterations detected.” <fn ref="42"/> The consequence of these revelations was the Act of August 6th, 1860, “for preventing the adulteration of articles of food and drink,” an inoperative law, as it naturally shows the tenderest consideration for every Free-trader who determines by the buying or selling of adulterated commodities “to turn an honest penny.” <fn ref="43"/> The Committee itself formulated more or less naïvely its conviction that Free-trade meant essentially trade with adulterated, or as the English ingeniously put it, “sophisticated” goods. In fact this kind of sophistry knows better than Protagoras how to make white black, and black white, and better than the Eleatics how to demonstrate <i>ad oculos</i> [before your own eyes] that everything is only appearance. <fn ref="44"/>
    hash: sha256:7b91c25fb56b2e785613a447c1e78eb18c4577bfa8039794045d81aadb914783
    state: active
  - id: p00074
    type: paragraph
    text: At all events the Committee had directed the attention of the public to its “daily bread,” and therefore to the baking trade. At the same time in public meetings and in petitions to Parliament rose the cry of the London journeymen bakers against their over-work, &amp;c. The cry was so urgent that Mr. H. S. Tremenheere, also a member of the Commission of 1863 several times mentioned, was appointed Royal Commissioner of Inquiry. His report, <fn ref="45"/> together with the evidence given, roused not the heart of the public but its stomach. Englishmen, always well up in the Bible, knew well enough that man, unless by elective grace a capitalist, or landlord, or sinecurist, is commanded to eat his bread in the sweat of his brow, but they did not know that he had to eat daily in his bread a certain quantity of human perspiration mixed with the discharge of abscesses, cobwebs, dead black-beetles, and putrid German yeast, without counting alum, sand, and other agreeable mineral ingredients. Without any regard to his holiness, Free-trade, the free baking-trade was therefore placed under the supervision of the State inspectors (Close of the Parliamentary session of 1863), and by the same Act of Parliament, work from 9 in the evening to 5 in the morning was forbidden for journeymen bakers under 18. The last clause speaks volumes as to the over-work in this old-fashioned, homely line of business.
    hash: sha256:fbc10b071cf5e8efcf352ba880dd3164643d8c4726e147a183efec1e7820b7ad
    state: active
  - id: p00075
    type: blockquote
    text: “The work of a London journeyman baker begins, as a rule, at about eleven at night. At that hour he ‘makes the dough,’ — a laborious process, which lasts from half an hour to three quarters of an hour, according to the size of the batch or the labour bestowed upon it. He then lies down upon the kneading-board, which is also the covering of the trough in which the dough is ‘made’; and with a sack under him, and another rolled up as a pillow, he sleeps for about a couple of hours. He is then engaged in a rapid and continuous labour for about five hours — throwing out the dough, ‘scaling it off,’ moulding it, putting it into the oven, preparing and baking rolls and fancy bread, taking the batch bread out of the oven, and up into the shop, &amp;c., &amp;c. The temperature of a bakehouse ranges from about 75 to upwards of 90 degrees, and in the smaller bakehouses approximates usually to the higher rather than to the lower degree of heat. When the business of making the bread, rolls, &amp;c., is over, that of its distribution begins, and a considerable proportion of the journeymen in the trade, after working hard in the manner described during the night, are upon their legs for many hours during the day, carrying baskets, or wheeling hand-carts, and sometimes again in the bakehouse, leaving off work at various hours between 1 and 6 p.m. according to the season of the year, or the amount and nature of their master’s business; while others are again engaged in the bakehouse in ‘bringing out’ more batches until late in the afternoon. <fn ref="46"/> ... During what is called ‘the London season,’ the operatives belonging to the ‘full-priced’ bakers at the West End of the town, generally begin work at 11 p.m., and are engaged in making the bread, with one or two short (sometimes very short) intervals of rest, up to 8 o’clock the next morning. They are then engaged all day long, up to 4, 5, 6, and as late as 7 o’clock in the evening carrying out bread, or sometimes in the afternoon in the bakehouse again, assisting in the biscuit-baking. They may have, after they have done their work, sometimes five or six, sometimes only four or five hours’ sleep before they begin again. On Fridays they always begin sooner, some about ten o’clock, and continue in some cases, at work, either in making or delivering the bread up to 8 p.m. on Saturday night, but more generally up to 4 or 5 o’clock, Sunday morning. On Sundays the men must attend twice or three times during the day for an hour or two to make preparations for the next day’s bread.... The men employed by the underselling masters (who sell their bread under the ‘full price,’ and who, as already pointed out, comprise three-fourths of the London bakers) have not only to work on the average longer hours, but their work is almost entirely confined to the bakehouse. The underselling masters generally sell their bread... in the shop. If they send it out, which is not common, except as supplying chandlers’ shops, they usually employ other hands for that purpose. It is not their practice to deliver bread from house to house. Towards the end of the week ... the men begin on Thursday night at 10 o’clock, and continue on with only slight intermission until late on Saturday evening.” <fn ref="47"/>
    hash: sha256:cade999c6dc1f253e3c7729934b0bbbabf7d2747cbb6edca1fd9004b8d4aa20c
    state: active
  - id: p00076
    type: paragraph
    text: Even the bourgeois intellect understands the position of the “underselling” masters. “The unpaid labour of the men was made the source whereby the competition was carried on.” <fn ref="48"/> And the “full-priced” baker denounces his underselling competitors to the Commission of Inquiry as thieves of foreign labour and adulterators.
    hash: sha256:c07fbc58f83d8ea7e97d955028c390ab92fdb3d6c21f3e8d5284699b48ae98db
    state: active
  - id: p00077
    type: blockquote
    text: “They only exist now by first defrauding the public, and next getting 18 hours’ work out of their men for 12 hours’ wages.” <fn ref="49"/>
    hash: sha256:46e827323b750f934f5c8c0ebce7a0280af5fa84c88d44178b06318a3ee3e0c1
    state: active
  - id: p00078
    type: paragraph
    text: The adulteration of bread and the formation of a class of bakers that sells the bread below the full price, date from the beginning of the 18th century, from the time when the corporate character of the trade was lost, and the capitalist in the form of the miller or flour-factor, rises behind the nominal master baker.<fn ref="50"/> Thus was laid the foundation of capitalistic production in this trade, of the unlimited extension of the working-day and of night-labour, although the latter only since 1824 gained a serious footing, even in London. <fn ref="51"/>
    hash: sha256:cf8f4a3e5e07cae81782521d131ba24e57d9c8c41f9f09370c7ccb8da29ce914
    state: active
  - id: p00079
    type: paragraph
    text: After what has just been said, it will be understood that the Report of the Commission classes journeymen bakers among the short-lived labourers, who, having by good luck escaped the normal decimation of the children of the working-class, rarely reach the age of 42. Nevertheless, the baking trade is always overwhelmed with applicants. The sources of the supply of these labour-powers to London are Scotland, the western agricultural districts of England, and Germany.
    hash: sha256:40646aca8a998e39479f4174a5b97b2594f69ee0c77f3d2e00d1d28cebdb2185
    state: active
  - id: p00080
    type: paragraph
    text: In the years 1858-60, the journeymen bakers in Ireland organised at their own expense great meetings to agitate against night and Sunday work. The public — e.g., at the Dublin meeting in May, 1860 — took their part with Irish warmth. As a result of this movement, day-labour alone was successfully established in Wexford, Kilkenny, Clonmel, Waterford, &amp;c.
    hash: sha256:d3b266953a816c63e56b5d9e5c11b1ce7ee58c3d0b8b39a12bd1b025a5d69eee
    state: active
  - id: p00081
    type: blockquote
    text: “In Limerick, where the grievances of the journeymen are demonstrated to be excessive, the movement has been defeated by the opposition of the master bakers, the miller bakers being the greatest opponents. The example of Limerick led to a retrogression in Ennis and Tipperary. In Cork, where the strongest possible demonstration of feeling took place, the masters, by exercising their power of turning the men out of employment, have defeated the movement. In Dublin, the master bakers have offered the most determined opposition to the movement, and by discountenancing as much as possible the journeymen promoting it, have succeeded in leading the men into acquiescence in Sunday work and night-work, contrary to the convictions of the men.” <fn ref="52"/>
    hash: sha256:c3de8f0b8abbd0027b35aeb700818f93dbffc7539fdb351b6398eba71176bc9d
    state: active
  - id: p00082
    type: paragraph
    text: "The Committee of the English Government, which Government, in Ireland, is armed to the teeth, and generally knows how to show it, remonstrates in mild, though funereal, tones with the implacable master bakers of Dublin, Limerick, Cork, &amp;c.:"
    hash: sha256:e6e510b0792078da64dd30475c94f52b9c15d02d1637818f2ec05f4a074b485f
    state: active
  - id: p00083
    type: blockquote
    text: “The Committee believe that the hours of labour are limited by natural laws, which cannot be violated with impunity. That for master bakers to induce their workmen, by the fear of losing employment, to violate their religious convictions and their better feelings, to disobey the laws of the land, and to disregard public opinion (this all refers to Sunday labour), is calculated to provoke ill-feeling between workmen and masters, ... and affords an example dangerous to religion, morality, and social order.... The Committee believe that any constant work beyond 12 hours a-day encroaches on the domestic and private life of the working-man, and so leads to disastrous moral results, interfering with each man’s home, and the discharge of his family duties as a son, a brother, a husband, a father. That work beyond 12 hours has a tendency to undermine the health of the workingman, and so leads to premature old age and death, to the great injury of families of working-men, thus deprived of the care and support of the head of the family when most required.” <fn ref="53"/>
    hash: sha256:48f93bcfe08c9a3c2ef13eaf075e25d294355329df91ccb3b1cba14f75573d34
    state: active
  - id: p00084
    type: paragraph
    text: So far, we have dealt with Ireland. On the other side of the channel, in Scotland, the agricultural labourer, the ploughman, protests against his 13-14 hours’ work in the most inclement climate, with 4 hours’ additional work on Sunday (in this land of Sabbatarians!), <fn ref="54"/> whilst, at the same time, three railway men are standing before a London coroner’s jury — a guard, an engine-driver, a signalman. A tremendous railway accident has hurried hundreds of passengers into another world. The negligence of the employee is the cause of the misfortune. They declare with one voice before the jury that ten or twelve years before, their labour only lasted eight hours a-day. During the last five or six years it had been screwed up to 14, 18, and 20 hours, and under a specially severe pressure of holiday-makers, at times of excursion trains, it often lasted for 40 or 50 hours without a break. They were ordinary men, not Cyclops. At a certain point their labour-power failed. Torpor seized them. Their brain ceased to think, their eyes to see. The thoroughly “respectable” British jurymen answered by a verdict that sent them to the next assizes on a charge of manslaughter, and, in a gentle “rider” to their verdict, expressed the pious hope that the capitalistic magnates of the railways would, in future, be more extravagant in the purchase of a sufficient quantity of labour-power, and more “abstemious,” more “self-denying,” more “thrifty,” in the draining of paid labour-power. <fn ref="55"/>
    hash: sha256:588d42358dbc04605a20b8d516cad1ff3bcc1b72dff5012532decfc7fac2d3d5
    state: active
  - id: p00085
    type: paragraph
    text: From the motley crowd of labourers of all callings, ages, sexes, that press on us more busily than the souls of the slain on Ulysses, on whom — without referring to the Blue books under their arms — we see at a glance the mark of over-work, let us take two more figures whose striking contrast proves that before capital all men are alike — a milliner and a blacksmith.
    hash: sha256:959abe979ba5960ceb9754131c5300f46bff385162a8294f55ae1ba13e659305
    state: active
  - id: p00086
    type: paragraph
    text: In the last week of June, 1863, all the London daily papers published a paragraph with the “sensational” heading, “Death from simple over-work.” It dealt with the death of the milliner, Mary Anne Walkley, 20 years of age, employed in a highly-respectable dressmaking establishment, exploited by a lady with the pleasant name of Elise. The old, often-told story, <fn ref="56"/> was once more recounted. This girl worked, on an average, 16½ hours, during the season often 30 hours, without a break, whilst her failing labour-power was revived by occasional supplies of sherry, port, or coffee. It was just now the height of the season. It was necessary to conjure up in the twinkling of an eye the gorgeous dresses for the noble ladies bidden to the ball in honour of the newly-imported Princess of Wales. Mary Anne Walkley had worked without intermission for 26½ hours, with 60 other girls, 30 in one room, that only afforded 1/3 of the cubic feet of air required for them. At night, they slept in pairs in one of the stifling holes into which the bedroom was divided by partitions of board. <fn ref="57"/> And this was one of the best millinery establishments in London. Mary Anne Walkley fell ill on the Friday, died on Sunday, without, to the astonishment of Madame Elise, having previously completed the work in hand. The doctor, Mr. Keys, called too late to the death-bed, duly bore witness before the coroner’s jury that
    hash: sha256:d5abe0b35d062339f85e0aa67eabf6f5cd8b2f0eb86c04041346b38011511741
    state: active
  - id: p00087
    type: blockquote
    text: “Mary Anne Walkley had died from long hours of work in an over-crowded work-room, and a too small and badly ventilated bedroom.”
    hash: sha256:42385e3fd8bfad7afbad8ff442d8e8bc6456d2edea21a6e64a6a65b12f988094
    state: active
  - id: p00088
    type: paragraph
    text: In order to give the doctor a lesson in good manners, the coroner’s jury thereupon brought in a verdict that
    hash: sha256:cb05fe30750e543eee3d5c9f25a744bcb5a4710a0a8b896bb2626fe1afcfa575
    state: active
  - id: p00089
    type: blockquote
    text: “the deceased had died of apoplexy, but there was reason to fear that her death had been accelerated by over-work in an over-crowded workroom, &amp;c.”
    hash: sha256:a690cd24203823cde4900805a70875c1b6caccb4bbfd2eac46fde1e9ad744c16
    state: active
  - id: p00090
    type: paragraph
    text: “Our white slaves,” cried the <i>Morning Star</i>, the organ of the Free-traders, Cobden and Bright, “our white slaves, who are toiled into the grave, for the most part silently pine and die.” <fn ref="58"/>
    hash: sha256:3bf42a9fde31b0a7c98f1b49ebd44454942e454f3510a319a7f069476456c363
    state: active
  - id: p00091
    type: blockquote
    text: “It is not in dressmakers’ rooms that working to death is the order of the day, but in a thousand other places; in every place I had almost said, where ‘a thriving business’ has to be done.... We will take the blacksmith as a type. If the poets were true, there is no man so hearty, so merry, as the blacksmith; he rises early and strikes his sparks before the sun; he eats and drinks and sleeps as no other man. Working in moderation, he is, in fact, in one of the best of human positions, physically speaking. But we follow him into the city or town, and we see the stress of work on that strong man, and what then is his position in the death-rate of his country. In Marylebone, blacksmiths die at the rate of 31 per thousand per annum, or 11 above the mean of the male adults of the country in its entirety. The occupation, instinctive almost as a portion of human art, unobjectionable as a branch of human industry, is made by mere excess of work, the destroyer of the man. He can strike so many blows per day, walk so many steps, breathe so many breaths, produce so much work, and live an average, say of fifty years; he is made to strike so many more blows, to walk so many more steps, to breathe so many more breaths per day, and to increase altogether a fourth of his life. He meets the effort; the result is, that producing for a limited time a fourth more work, he dies at 37 for 50.” <fn ref="59"/>
    hash: sha256:e344d64a05b47f395d823c0e55e7249e80c555a1fa5eaefb29cabb665bd8a24a
    state: active
  - id: p00092
    type: heading
    level: 3
    text: SECTION 4
    hash: sha256:4b14fc79f377969ea3aef0e55157d0e457a5fddbee17c57ea37f1e6c864ce4ed
    state: active
  - id: p00093
    type: heading
    level: 4
    text: DAY AND NIGHT WORK. THE RELAY SYSTEM.
    hash: sha256:f3d966e3539d4f73ee7f5d9c7f27a415d79185bdc4dfcbc0cb1cb058865194de
    state: active
  - id: p00094
    type: paragraph
    text: Constant capital, the means of production, considered from the standpoint of the creation of surplus-value, only exist to absorb labour, and with every drop of labour a proportional quantity of surplus-labour. While they fail to do this, their mere existence causes a relative loss to the capitalist, for they represent during the time they lie fallow, a useless advance of capital. And this loss becomes positive and absolute as soon as the intermission of their employment necessitates additional outlay at the recommencement of work. The prolongation of the working-day beyond the limits of the natural day, into the night, only acts as a palliative. It quenches only in a slight degree the vampire thirst for the living blood of labour. To appropriate labour during all the 24 hours of the day is, therefore, the inherent tendency of capitalist production. But as it is physically impossible to exploit the same individual labour-power constantly during the night as well as the day, to overcome this physical hindrance, an alternation becomes necessary between the workpeople whose powers are exhausted by day, and those who are used up by night. This alternation may be effected in various ways; e.g., it may be so arranged that part of the workers are one week employed on day-work, the next week on night-work. It is well known that this relay system, this alternation of two sets of workers, held full sway in the full-blooded youth-time of the English cotton manufacture, and that at the present time it still flourishes, among others, in the cotton spinning of the Moscow district. This 24 hours’ process of production exists to-day as a system in many of the branches of industry of Great Britain that are still “free,” in the blast-furnaces, forges, plate-rolling mills, and other metallurgical establishments in England, Wales, and Scotland. The working-time here includes, besides the 24 hours of the 6 working-days, a great part also of the 24 hours of Sunday. The workers consist of men and women, adults and children of both sexes. The ages of the children and young persons run through all intermediate grades, from 8 (in some cases from 6) to 18. <fn ref="60"/>
    hash: sha256:a7924ae5916c7558d330e2b497f813d871cefcdd12c1f66140a37d95963f1e8d
    state: active
  - id: p00095
    type: paragraph
    text: In some branches of industry, the girls and women work through the night together with the males. <fn ref="61"/>
    hash: sha256:77529c2b34208acb7894edee8f70d254b5808e61c85b1bad13605af352f52e05
    state: active
  - id: p00096
    type: paragraph
    text: Placing on one side the generally injurious influence of night-labour, <fn ref="62"/> the duration of the process of production, unbroken during the 24 hours, offers very welcome opportunities of exceeding the limits of the normal working-day, e.g., in the branches of industry already mentioned, which are of an exceedingly fatiguing nature; the official working-day means for each worker usually 12 hours by night or day. But the over-work beyond this amount is in many cases, to use the words of the English official report, “truly fearful.” <fn ref="63"/>
    hash: sha256:22ecbcee4f1a475ce317e73731400e4079bf26f14da49c2eeec2a4e9e643584b
    state: active
  - id: p00097
    type: blockquote
    text: “It is impossible,” the report continues, “for any mind to realise the amount of work described in the following passages as being performed by boys of from 9 to 12 years of age ... without coming irresistibly to the conclusion that such abuses of the power of parents and of employers can no longer be allowed to exist.” <fn ref="64"/>
    hash: sha256:8e3c485da5fde88cfa82881fc98ca417d3e45875d7b029aa0688756fa2ef9fff
    state: active
  - id: p00098
    type: blockquote
    text: '"The practice of boys working at all by day and night turns either in the usual course of things, or at pressing times, seems inevitably to open the door to their not unfrequently working unduly long hours. These hours are, indeed, in some cases, not only cruelly but even incredibly long for children. Amongst a number of boys it will, of course, not unfrequently happen that one or more are from some cause absent. When this happens, their place is made up by one or more boys, who work in the other turn. That this is a well understood system is plain ... from the answer of the manager of some large rolling-mills, who, when I asked him how the place of the boys absent from their turn was made up, ‘I daresay, sir, you know that as well as I do,’ and admitted the fact.” <fn ref="65"/>'
    hash: sha256:9230a51923cea14af347400c52eda70473e08ef5afb55b2017c97142a6443c03
    state: active
  - id: p00099
    type: blockquote
    text: “At a rolling-mill where the proper hours were from 6 a.m. to 5½ p.m., a boy worked about four nights every week till 8½ p.m. at least ... and this for six months. Another, at 9 years old, sometimes made three 12-hour shifts running, and, when 10, has made two days and two nights running.” A third, “now 10 ... worked from 6 a.m. till 12 p.m. three nights, and till 9 p.m. the other nights.” “Another, now 13, ... worked from 6 p.m. till 12 noon next day, for a week together, and sometimes for three shifts together, e.g., from Monday morning till Tuesday night.” “Another, now 12, has worked in an iron foundry at Stavely from 6 a.m. till 12 p.m. for a fortnight on end; could not do it any more.” “George Allinsworth, age 9, came here as cellar-boy last Friday; next morning we had to begin at 3, so I stopped here all night. Live five miles off. Slept on the floor of the furnace, over head, with an apron under me, and a bit of a jacket over me. The two other days I have been here at 6 a.m. Aye! it <i>is</i> hot in here. Before I came here I was nearly a year at the same work at some works in the country. Began there, too, at 3 on Saturday morning — always did, but was very gain [near] home, and could sleep at home. Other days I began at 6 in the morning, and gi’en over at 6 or 7 in the evening,” &amp;c. <fn ref="66"/>
    hash: sha256:ff1b3770b2c1addcd2e48924460e1ba34a2364cc769206d07f2fe5ba8f6a4095
    state: active
  - id: p00100
    type: paragraph
    text: Let us now hear how capital itself regards this 24 hours’ system. The extreme forms of the system, its abuse in the “cruel and incredible” extension of the working-day are naturally passed over in silence. Capital only speaks of the system in its “normal” form.
    hash: sha256:47ec5e04f4bbfa5adcdb551abd79aaed114634b03149685cea2c766da3db56fb
    state: active
  - id: p00101
    type: paragraph
    text: "Messrs. Naylor &amp; Vickers, steel manufacturers, who employ between 600 and 700 persons, among whom only 10 per cent are under 18, and of those, only 20 boys under 18 work in night sets, thus express themselves:"
    hash: sha256:24ec2bd5b0c18020fa800ae606b22e13b81f9af278a269e0e4455f3adcc06b9d
    state: active
  - id: p00102
    type: blockquote
    text: “The boys do not suffer from the heat. The temperature is probably from 86° to 90°.... At the forges and in the rolling mills the hands work night and day, in relays, but all the other parts of the work are day-work, <i>i.e.,</i> from 6 a.m. to 6 p.m. In the forge the hours are from 12 to 12. Some of the hands always work in the night, without any alternation of day and night work.... We do not find any difference in the health of those who work regularly by night and those who work by day, and probably people can sleep better if they have the same period of rest than if it is changed.... About 20 of the boys under the age of 18 work in the night sets.... We could not well do without lads under 18 working by night. The objection would be the increase in the cost of production.... Skilled hands and the heads in every department are difficult to get, but of lads we could get any number.... But from the small proportion of boys that we employ, the subject <i>(i.e</i>., of restrictions on night-work) is of little importance or interest to us.” <fn ref="67"/>
    hash: sha256:1401e4da9d7986d45e7f5c12be7e2a2e103643410aa0fcbc91d853fc913dd859
    state: active
  - id: p00103
    type: paragraph
    text: "Mr. J. Ellis, one of the firm of Messrs. John Brown &amp; Co., steel and iron works, employing about 3,000 men and boys, part of whose operations, namely, iron and heavier steel work, goes on night and day by relays, states “that in the heavier steel work one or two boys are employed to a score or two men.” Their concern employs upwards of 500 boys under 18, of whom about 1/3 or 170 are under the age of 13. With reference to the proposed alteration of the law, Mr. Ellis says:"
    hash: sha256:ce60d252099b04c4fa6283b62305b7a65066d9eee00500c3c393a82dd78e99e1
    state: active
  - id: p00104
    type: blockquote
    text: “I do not think it would be very objectionable to require that no person under the age of 18 should work more than 12 hours in the 24. But we do not think that any line could be drawn over the age of 12, at which boys could be dispensed with for night-work. But we would sooner be prevented from employing boys under the age of 13, or even so high as 14, at all, than not be allowed to employ boys that we do have at night. Those boys who work in the day sets must take their turn in the night sets also, because the men could not work in the night sets only; it would ruin their health.... We think, however, that night-work in alternate weeks is no harm.”
    hash: sha256:9374f91f45272ab7039e758cf9a768fda799453f9a28fedfa615e8e9744c25dd
    state: active
  - id: p00105
    type: paragraph
    text: (Messrs. Naylor &amp; Vickers, on the other hand, in conformity with the interest of their business, considered that periodically changed night-labour might possibly do more harm than continual night-labour.)
    hash: sha256:79529de1dc68e95f16ff57347b032fe0b704ba406290d2b83f2a7d127b4cb2e8
    state: active
  - id: p00106
    type: blockquote
    text: “We find the men who do it, as well as the others who do other work only by day.... Our objections to not allowing boys under 18 to work at night, would be on account of the increase of expense, but this is the only reason.”
    hash: sha256:e3315cde93f818eb09b436c0925f52dfe63314031c3428761857a9e85856dac0
    state: active
  - id: p00107
    type: blockquote
    text: (What cynical naïveté!) “We think that the increase would be more than the trade, with due regard to its being successfully carried out, could fairly bear. (What mealy-mouthed phraseology!) Labour is scarce here, and might fall short if there were such a regulation.” <i>(i.e.,</i> Ellis Brown &amp; Co. might fall into the fatal perplexity of being obliged to pay labour-power its full value.) <fn ref="68"/>
    hash: sha256:b04e795a343c49c9b2248a9410afe8d2b87a0e3e6bb257808ea012503ed97d87
    state: active
  - id: p00108
    type: paragraph
    text: The “Cyclops Steel and Iron Works,” of Messrs. Cammell &amp; Co., are concocted on the same large scale as those of the above-mentioned John Brown &amp; Co. The managing director had handed in his evidence to the Government Commissioner, Mr. White, in writing. Later he found it convenient to suppress the MS. when it had been returned to him for revision. Mr. White, however, has a good memory. He remembered quite clearly that for the Messrs. Cyclops the forbidding of the night-labour of children and young persons “would be impossible, it would be tantamount to stopping their works,” and yet their business employs little more than 6% of boys under 18, and less than 1% under 13. <fn ref="69"/>
    hash: sha256:06d81d5d19b499e39737722d8680107098d7f9416d608943eaced00f63292097
    state: active
  - id: p00109
    type: paragraph
    text: "On the same subject Mr. E. F. Sanderson, of the firm of Sanderson, Bros., &amp; Co., steel rolling-mills and forges, Attercliffe, says:"
    hash: sha256:998000741254a3dda69a53d7c30c58741340d3d6eb9441cb282aa16fa5e4f964
    state: active
  - id: p00110
    type: blockquote
    text: “Great difficulty would be caused by preventing boys under 18 from working at night. The chief would be the increase of cost from employing men instead of boys. I cannot say what this would be, but probably it would not be enough to enable the manufacturers to raise the price of steel, and consequently it would fall on them, as of course the men (what queer-headed folk!) would refuse to pay it.”
    hash: sha256:aa1b326924eb94c43ab46766e57ecd75e314e3989015be8b91b45b1890e001c1
    state: active
  - id: p00111
    type: paragraph
    text: Mr. Sanderson does not know how much he pays the children, but
    hash: sha256:d017ed41751b6f2fa9b24ae973e279f0a856f4bb9d25264be3d6aa17397954aa
    state: active
  - id: p00112
    type: blockquote
    text: “perhaps the younger boys get from 4s. to 5s. a week.... The boys’ work is of a kind for which the strength of the boys is generally (‘generally,’ of course not always) quite sufficient, and consequently there would be no gain in the greater strength of the men to counterbalance the loss, or it would be only in the few cases in which the metal is heavy. The men would not like so well not to have boys under them, as men would be less obedient. Besides, boys must begin young to learn the trade. Leaving day-work alone open to boys would not answer this purpose.”
    hash: sha256:dac117fe7468b2fb5ee88d976c9bfffbcba7b5fda0a61eb624c3ae10e9d8584d
    state: active
  - id: p00113
    type: paragraph
    text: And why not? Why could not boys learn their handicraft in the day-time? Your reason?
    hash: sha256:f474f60a66237b3657e29e6e03650a5832fcaed5082d12b4d0789c4ad3883496
    state: active
  - id: p00114
    type: blockquote
    text: “Owing to the men working days and nights in alternate weeks, the men would be separated half the time from their boys, and would lose half the profit which they make from them. The training which they give to an apprentice is considered as part of the return for the boys’ labour, and thus enables the man to get it at a cheaper rate. Each man would want half of this profit.”
    hash: sha256:02c73386eacb2ae49d011f0cc8add215cbc9c536689b3cb79f1c0416718c3d79
    state: active
  - id: p00115
    type: paragraph
    text: In other words, Messrs. Sanderson would have to pay part of the wages of the adult men out of their own pockets instead of by the night-work of the boys. Messrs. Sanderson’s profit would thus fall to some extent, and this is the good Sandersonian reason why boys cannot learn their handicraft in the day. <fn ref="70"/> In addition to this, it would throw night-labour on those who worked instead of the boys, which they would not be able to stand. The difficulties in fact would be so great that they would very likely lead to the giving up of night-work altogether, and “as far as the work itself is concerned,” says E. F. Sanderson, “this would suit as well, but —” But Messrs. Sanderson have something else to make besides steel. Steel-making is simply a pretext for surplus-value making. The smelting furnaces, rolling-mills, &amp;c., the buildings, machinery, iron, coal, &amp;c., have something more to do than transform themselves into steel. They are there to absorb surplus-labour, and naturally absorb more in 24 hours than in 12. In fact they give, by grace of God and law, the Sandersons a cheque on the working-time of a certain number of hands for all the 24 hours of the day, and they lose their character as capital, are therefore a pure loss for the Sandersons, as soon as their function of absorbing labour is interrupted.
    hash: sha256:d27fab5a7c043c9ae05506da02d8d7aede9d7575d487717bd96d67b2afbd231e
    state: active
  - id: p00116
    type: blockquote
    text: “But then there would be the loss from so much expensive machinery, lying idle half the time, and to get through the amount of work which we are able to do on the present system, we should have to double our premises and plant, which would double the outlay.”
    hash: sha256:ceb15cba690aa886a953d08c065f34149f8ea1b3a38731f1f456e3460e0a4628
    state: active
  - id: p00117
    type: paragraph
    text: "But why should these Sandersons pretend to a privilege not enjoyed by the other capitalists who only work during the day, and whose buildings, machinery, raw material, therefore lie “idle” during the night? E. F. Sanderson answers in the name of all the Sandersons:"
    hash: sha256:548e1b1fc897b4936405cf222de0e6b14e8e8b8cbb227529435fd4a9044b7716
    state: active
  - id: p00118
    type: blockquote
    text: “It is true that there is this loss from machinery lying idle in those manufactories in which work only goes on by day. But the use of furnaces would involve a further loss in our case. If they were kept up there would be a waste of fuel (instead of, as now, a waste of the living substance of the workers), and if they were not, there would be loss of time in laying the fires and getting the heat up (whilst the loss of sleeping time, even to children of 8 is a gain of working-time for the Sanderson tribe), and the furnaces themselves would suffer from the changes of temperature.” (Whilst those same furnaces suffer nothing from the day and night change of labour.) <fn ref="71"/>
    hash: sha256:08728721f8c85d83addd262d5d5b2a5e348fc8ff76277f4c563d6849d28da0a8
    state: active
  - id: p00119
    type: heading
    level: 3
    text: SECTION 5
    hash: sha256:ac95c0388bf95c65399239e6a70d2dafe4a0ed09144750959a2d3cbe0f14ef67
    state: active
  - id: p00120
    type: heading
    level: 4
    text: THE STRUGGLE FOR A NORMAL WORKING-DAY.<br/>COMPULSORY LAWS FOR THE EXTENSION OF THE WORKING-DAY FROM THE MIDDLE OF THE 14TH TO THE END OF THE 17TH CENTURY
    hash: sha256:690c724843fe73549078c5e1559457adedf59f9d351bb6eafb0b3ca1be3b4057
    state: active
  - id: p00121
    type: paragraph
    text: '“What is a working-day? What is the length of time during which capital may consume the labour-power whose daily value it buys? How far may the working-day be extended beyond the working-time necessary for the reproduction of labour-power itself?” It has been seen that to these questions capital replies: the working-day contains the full 24 hours, with the deduction of the few hours of repose without which labour-power absolutely refuses its services again. Hence it is self-evident that the labourer is nothing else, his whole life through, than labour-power, that therefore all his disposable time is by nature and law labour-time, to be devoted to the self-expansion of capital. Time for education, for intellectual development, for the fulfilling of social functions and for social intercourse, for the free-play of his bodily and mental activity, even the rest time of Sunday (and that in a country of Sabbatarians!) <fn ref="72"/> — moonshine! But in its blind unrestrainable passion, its were-wolf hunger for surplus-labour, capital oversteps not only the moral, but even the merely physical maximum bounds of the working-day. It usurps the time for growth, development, and healthy maintenance of the body. It steals the time required for the consumption of fresh air and sunlight. It higgles over a meal-time, incorporating it where possible with the process of production itself, so that food is given to the labourer as to a mere means of production, as coal is supplied to the boiler, grease and oil to the machinery. It reduces the sound sleep needed for the restoration, reparation, refreshment of the bodily powers to just so many hours of torpor as the revival of an organism, absolutely exhausted, renders essential. It is not the normal maintenance of the labour-power which is to determine the limits of the working-day; it is the greatest possible daily expenditure of labour-power, no matter how diseased, compulsory, and painful it may be, which is to determine the limits of the labourers’ period of repose. Capital cares nothing for the length of life of labour-power. All that concerns it is simply and solely the maximum of labour-power, that can be rendered fluent in a working-day. It attains this end by shortening the extent of the labourer’s life, as a greedy farmer snatches increased produce from the soil by robbing it of its fertility.'
    hash: sha256:0c8ac555b90b8e98c7300231f8e7180be0011cba99f57fec019681ebbc5e4378
    state: active
  - id: p00122
    type: paragraph
    text: The capitalistic mode of production (essentially the production of surplus-value, the absorption of surplus-labour), produces thus, with the extension of the working-day, not only the deterioration of human labour-power by robbing it of its normal, moral and physical, conditions of development and function. It produces also the premature exhaustion and death of this labour-power itself. <fn ref="73"/> It extends the labourer’s time of production during a given period by shortening his actual life-time.
    hash: sha256:231eae9b7d9d2e4430c0c897afcd39fb1f8cc5ac96e2de31493c2928546c7421
    state: active
  - id: p00123
    type: paragraph
    text: But the value of the labour-power includes the value of the commodities necessary for the reproduction of the worker, or for the keeping up of the working-class. If then the unnatural extension of the working-day, that capital necessarily strives after in its unmeasured passion for self-expansion, shortens the length of life of the individual labourer, and therefore the duration of his labour-power, the forces used up have to be replaced at a more rapid rate and the sum of the expenses for the reproduction of labour-power will be greater; just as in a machine the part of its value to be reproduced every day is greater the more rapidly the machine is worn out. It would seem therefore that the interest of capital itself points in the direction of a normal working-day.
    hash: sha256:b75801ce69a538b6795a372838a1789a9bd3be98fda5062dfb140f140f4dd5a5
    state: active
  - id: p00124
    type: paragraph
    text: The slave-owner buys his labourer as he buys his horse. If he loses his slave, he loses capital that can only be restored by new outlay in the slave-mart.
    hash: sha256:e395b62169c3ecd2c6018d772ac106a1dcbcd87f48259cf45845011304280b79
    state: active
  - id: p00125
    type: blockquote
    text: But “the rice-grounds of Georgia, or the swamps of the Mississippi may be fatally injurious to the human constitution; but the waste of human life which the cultivation of these districts necessitates, is not so great that it cannot be repaired from the teeming preserves of Virginia and Kentucky. Considerations of economy, moreover, which, under a natural system, afford some security for humane treatment by identifying the master’s interest with the slave’s preservation, when once trading in slaves is practiced, become reasons for racking to the uttermost the toil of the slave; for, when his place can at once be supplied from foreign preserves, the duration of his life becomes a matter of less moment than its productiveness while it lasts. It is accordingly a maxim of slave management, in slave-importing countries, that the most effective economy is that which takes out of the human chattel in the shortest space of time the utmost amount of exertion it is capable of putting forth. It is in tropical culture, where annual profits often equal the whole capital of plantations, that negro life is most recklessly sacrificed. It is the agriculture of the West Indies, which has been for centuries prolific of fabulous wealth, that has engulfed millions of the African race. It is in Cuba, at this day, whose revenues are reckoned by millions, and whose planters are princes, that we see in the servile class, the coarsest fare, the most exhausting and unremitting toil, and even the absolute destruction of a portion of its numbers every year.” <fn ref="74"/>
    hash: sha256:51e526591485e5a7a19c36d79eac5ccc1041869a0093cc8d57150a6b392a5e12
    state: active
  - id: p00126
    type: paragraph
    text: <i>Mutato nomine de te fabula narratur</i> [It is of you that the story is told – Horace]. For slave-trade read labour-market, for Kentucky and Virginia, Ireland and the agricultural districts of England, Scotland, and Wales, for Africa, Germany. We heard how over-work thinned the ranks of the bakers in London. Nevertheless, the London labour-market is always over-stocked with German and other candidates for death in the bakeries. Pottery, as we saw, is one of the shortest-lived industries. Is there any want therefore of potters? Josiah Wedgwood, the inventor of modern pottery, himself originally a common workman, said in 1785 before the House of Commons that the whole trade employed from 15,000 to 20,000 people. <fn ref="75"/> In the year 1861 the population alone of the town centres of this industry in Great Britain numbered 101,302.
    hash: sha256:d655bc6b8ea5c42e14230a5eac681f4b0737d3752b59d3406bf934e8337f1e1c
    state: active
  - id: p00127
    type: blockquote
    text: “The cotton trade has existed for ninety years.... It has existed for three generations of the English race, and I believe I may safely say that during that period it has destroyed nine generations of factory operatives.” <fn ref="76"/>
    hash: sha256:d14d117bf551d2672caf6341cefd47b5aef9e9a1af773407b7827fb2d3848c78
    state: active
  - id: p00128
    type: paragraph
    text: No doubt in certain epochs of feverish activity the labour-market shows significant gaps. In 1834, <i>e.g</i>. But then the manufacturers proposed to the Poor Law Commissioners that they should send the “surplus-population” of the agricultural districts to the north, with the explanation “that the manufacturers would absorb and use it up.” <fn ref="77"/>
    hash: sha256:138c40ee1f4654eca17e60700d25ca17b2d88c11e822f4ab04ffe41048f59031
    state: active
  - id: p00129
    type: blockquote
    text: Agents were appointed with the consent of the Poor Law Commissioners. ... An office was set up in Manchester, to which lists were sent of those workpeople in the agricultural districts wanting employment, and their names were registered in books. The manufacturers attended at these offices, and selected such persons as they chose; when they had selected such persons as their ‘wants required’, they gave instructions to have them forwarded to Manchester, and they were sent, ticketed like bales of goods, by canals, or with carriers, others tramping on the road, and many of them were found on the way lost and half-starved. This system had grown up unto a regular trade. This House will hardly believe it, but I tell them, that this traffic in human flesh was as well kept up, they were in effect as regularly sold to these [Manchester] manufacturers as slaves are sold to the cotton-grower in the United States.... In 1860, ‘the cotton trade was at its zenith.’ ... The manufacturers again found that they were short of hands.... They applied to the ‘flesh agents, as they are called. Those agents sent to the southern downs of England, to the pastures of Dorsetshire, to the glades of Devonshire, to the people tending kine in Wiltshire, but they sought in vain. The surplus-population was ‘absorbed.’”
    hash: sha256:06518fd301f5f7940a06176b966a55c4831521c8cec53c134d1aa2c290bfde2c
    state: active
  - id: p00130
    type: paragraph
    text: The <i>Bury Guardian</i> said, on the completion of the French treaty, that “10,000 additional hands could be absorbed by Lancashire, and that 30,000 or 40,000 will be needed.” After the “flesh agents and sub-agents” had in vain sought through the agricultural districts,
    hash: sha256:970ddac92967ae6bfbd175efc77f6ef1341ceebdb5d7cd073ac011c4ff1f3854
    state: active
  - id: p00131
    type: blockquote
    text: “a deputation came up to London, and waited on the right hon. gentleman [Mr. Villiers, President of the Poor Law Board] with a view of obtaining poor children from certain union houses for the mills of Lancashire.” <fn ref="78"/>
    hash: sha256:6d4383ac7c7fcb651c4518a29669e7ee9fbfec7c81f095b6591ed628ebfa12ed
    state: active
  - id: p00132
    type: paragraph
    text: 'What experience shows to the capitalist generally is a constant excess of population, i.e., an excess in relation to the momentary requirements of surplus-labour-absorbing capital, although this excess is made up of generations of human beings stunted, short-lived, swiftly replacing each other, plucked, so to say, before maturity. <fn ref="79"/> And, indeed, experience shows to the intelligent observer with what swiftness and grip the capitalist mode of production, dating, historically speaking, only from yesterday, has seized the vital power of the people by the very root — shows how the degeneration of the industrial population is only retarded by the constant absorption of primitive and physically uncorrupted elements from the country — shows how even the country labourers, in spite of fresh air and the principle of natural selection, that works so powerfully amongst them, and only permits the survival of the strongest, are already beginning to die off. <fn ref="80"/> Capital that has such good reasons for denying the sufferings of the legions of workers that surround it, is in practice moved as much and as little by the sight of the coming degradation and final depopulation of the human race, as by the probable fall of the earth into the sun. In every stockjobbing swindle every one knows that some time or other the crash must come, but every one hopes that it may fall on the head of his neighbour, after he himself has caught the shower of gold and placed it in safety. <i>Après moi le déluge! [After me, the flood] is</i> the watchword of every capitalist and of every capitalist nation. Hence Capital is reckless of the health or length of life of the labourer, unless under compulsion from society. <fn ref="81"/> To the out-cry as to the physical and mental degradation, the premature death, the torture of over-work, it answers: Ought these to trouble us since they increase our profits? But looking at things as a whole, all this does not, indeed, depend on the good or ill will of the individual capitalist. Free competition brings out the inherent laws of capitalist production, in the shape of external coercive laws having power over every individual capitalist. <fn ref="82"/>'
    hash: sha256:b0452740d784c60ac83270bac4ef8479a64c16a13ee5a40ca3eb7b034ce22134
    state: active
  - id: p00133
    type: paragraph
    text: The establishment of a normal working-day is the result of centuries of struggle between capitalist and labourer. The history of this struggle shows two opposed tendencies. Compare, e.g., the English factory legislation of our time with the English labour Statutes from the 14th century to well into the middle of the 18th. <fn ref="83"/> Whilst the modern Factory Acts compulsorily shortened the working-day, the earlier statutes tried to lengthen it by compulsion. Of course the pretensions of capital in embryo — when, beginning to grow, it secures the right of absorbing a <i>quantum sufficit</i> [sufficient quantity] of surplus-labour, not merely by the force of economic relations, but by the help of the State — appear very modest when put face to face with the concessions that, growling and struggling, it has to make in its adult condition. It takes centuries ere the “free” labourer, thanks to the development of capitalistic production, agrees, <i>i.e., is</i> compelled by social conditions, to sell the whole of his active life, his very capacity for work, for the price of the necessaries of life, his birth-right for a mess of pottage. Hence it is natural that the lengthening of the working-day, which capital, from the middle of the 14th to the end of the 17th century, tries to impose by State-measures on adult labourers, approximately coincides with the shortening of the working-day which, in the second half of the 19th century, has here and there been effected by the State to prevent the coining of children’s blood into capital. That which to-day, <i>e.g</i>., in the State of Massachusetts, until recently the freest State of the North-American Republic, has been proclaimed as the statutory limit of the labour of children under 12, was in England, even in the middle of the 17th century, the normal working-day of able-bodied artisans, robust labourers, athletic blacksmiths. <fn ref="84"/>
    hash: sha256:d3e72a65dc855f32b84e82fed4d3366137a8d504a338aff390f5da423a7f2e86
    state: active
  - id: p00134
    type: paragraph
    text: 'The first “Statute of Labourers” (23 Edward III., 1349) found its immediate pretext (not its cause, for legislation of this kind lasts centuries after the pretext for it has disappeared) in the great plague that decimated the people, so that, as a Tory writer says, “The difficulty of getting men to work on reasonable terms <i>(i.e</i>., at a price that left their employers a reasonable quantity of surplus-labour) grew to such a height as to be quite intolerable.” <fn ref="85"/> Reasonable wages were, therefore, fixed by law as well as the limits of the working-day. The latter point, the only one that here interests us, is repeated in the Statute of 1496 (Henry VII.). The working-day for all artificers and field labourers from March to September ought, according to this statute (which, however, could not be enforced), to last from 5 in the morning to between 7 and 8 in the evening. But the meal-times consist of 1 hour for breakfast, 1½ hours for dinner, and ½ an hour for “noon-meate,” i.e., exactly twice as much as under the factory acts now in force. <fn ref="86"/> In winter, work was to last from 5 in the morning until dark, with the same intervals. A statute of Elizabeth of 1562 leaves the length of the working-day for all labourers “hired for daily or weekly wage” untouched, but aims at limiting the intervals to 2½ hours in the summer, or to 2 in the winter. Dinner is only to last 1 hour, and the “afternoon-sleep of half an hour” is only allowed between the middle of May and the middle of August. For every hour of absence 1d. is to be subtracted from the wage. In practice, however, the conditions were much more favourable to the labourers than in the statute-book. William Petty, the father of Political Economy, and to some extent the founder of Statistics, says in a work that he published in the last third of the 17th century:'
    hash: sha256:73e4bf9153fc6617d8929772033d1d9b1e28f233df223a35bd310e02d119aebe
    state: active
  - id: p00135
    type: blockquote
    text: “Labouring-men (then meaning field-labourers) work 10 hours per diem, and make 20 meals per week, viz., 3 a day for working-days, and 2 on Sundays; whereby it is plain, that if they could fast on Friday nights, and dine in one hour and an half, whereas they take two, from eleven to one; thereby thus working 1/20 more, and spending 1/20 less, the above-mentioned (tax) might be raised.” <fn ref="87"/>
    hash: sha256:bc30e1ff79f4f1b899f01fe3c480da35d23f550ccf2b2215ff7c1ba8167566a7
    state: active
  - id: p00136
    type: paragraph
    text: "Was not Dr. Andrew Ure right in crying down the 12 hours’ bill of 1833 as a retrogression to the times of the dark ages? It is true these regulations contained in the statute mentioned by Petty, apply also to apprentices. But the condition of child-labour, even at the end of the 17th century, is seen from the following complaint:"
    hash: sha256:0a07d1be96b1e49fc703ed524b585b7d2bbaa8f5958cf9760843592bd8db1542
    state: active
  - id: p00137
    type: blockquote
    text: '“’Tis not their practice (in Germany) as with us in this kingdom, to bind an apprentice for seven years; three or four is their common standard: and the reason is, because they are educated from their cradle to something of employment, which renders them the more apt and docile, and consequently the more capable of attaining to a ripeness and quicker proficiency in business. Whereas our youth, here in England, being bred to nothing before they come to be apprentices, make a very slow progress and require much longer time wherein to reach the perfection of accomplished artists.” <fn ref="88"/>'
    hash: sha256:252b10c9ac3dcae808ee5402ca56eca569cd39ed9396da18ea885e5a68085362
    state: active
  - id: p00138
    type: paragraph
    text: Still, during the greater part of the 18th century, up to the epoch of Modern Industry and machinism, capital in England had not succeeded in seizing for itself, by the payment of the weekly value of labour-power, the whole week of the labourer, with the exception, however, of the agricultural labourers. The fact that they could live for a whole week on the wage of four days, did not appear to the labourers a sufficient reason that they should work the other two days for the capitalist. One party of English economists, in the interest of capital, denounces this obstinacy in the most violent manner, another party defends the labourers. Let us listen, <i>e.g., to</i> the contest between Postlethwayt whose Dictionary of Trade then had the same reputation as the kindred works of MacCulloch and MacGregor to-day, and the author (already quoted) of the “Essay on Trade and Commerce.” <fn ref="89"/>
    hash: sha256:75963720e63be6f772a826fb93fa2e8cabc56e4f0282a0f16f2882224ade1dd6
    state: active
  - id: p00139
    type: paragraph
    text: "Postlethwayt says among other things:"
    hash: sha256:0ff1c25ef0d24af4d7c51bb5e01fcd01956eb298c2a5bdd509e4dd04586a274d
    state: active
  - id: p00140
    type: blockquote
    text: “We cannot put an end to those few observations, without noticing that trite remark in the mouth of too many; that if the industrious poor can obtain enough to maintain themselves in five days, they will not work the whole six. Whence they infer the necessity of even the necessaries of life being made dear by taxes, or any other means, to compel the working artisan and manufacturer to labour the whole six days in the week, without ceasing. I must beg leave to differ in sentiment from those great politicians, who contend for the perpetual slavery of the working people of this kingdom; they forget the vulgar adage, all work and no play. Have not the English boasted of the ingenuity and dexterity of her working artists and manufacturers which have heretofore given credit and reputation to British wares in general? What has this been owing to? To nothing more probably than the relaxation of the working people in their own way. Were they obliged to toil the year round, the whole six days in the week, in a repetition of the same work, might it not blunt their ingenuity, and render them stupid instead of alert and dexterous; and might not our workmen lose their reputation instead of maintaining it by such eternal slavery? ... And what sort of workmanship could we expect from such hard-driven animals? ... Many of them will execute as much work in four days as a Frenchman will in five or six. But if Englishmen are to be eternal drudges, ‘tis to be feared they will degenerate below the Frenchmen. As our people are famed for bravery in war, do we not say that it is owing to good English roast beef and pudding in their bellies, as well as their constitutional spirit of liberty? And why may not the superior ingenuity and dexterity of, our artists and manufacturers, be owing to that freedom and liberty to direct themselves in their own way, and I hope we shall never have them deprived of such privileges and that good living from whence their ingenuity no less than their courage may proceed.”<fn ref="90"/>
    hash: sha256:e92dff09970fc42b75aec2e7a6770925b16bd9f8e06a6fffee8403517281e7b2
    state: active
  - id: p00141
    type: paragraph
    text: "Thereupon the author of the “Essay on Trade and Commerce” replies:"
    hash: sha256:eee424154f88bf9c32cc7f38b8af45e308dbac167114408b636901d624904dfb
    state: active
  - id: p00142
    type: blockquote
    text: “If the making of every seventh day an holiday is supposed to be of divine institution, as it implies the appropriating the other six days to labour” (he means capital as we shall soon see) “surely it will not be thought cruel to enforce it .... That mankind in general, are naturally inclined to ease and indolence, we fatally experience to be true, from the conduct of our manufacturing populace, who do not labour, upon an average, above four days in a week, unless provisions happen to be very dear.... Put all the necessaries of the poor under one denomination; for instance, call them all wheat, or suppose that ... the bushel of wheat shall cost five shillings and that he (a manufacturer) earns a shilling by his labour, he then would be obliged to work five days only in a week. If the bushel of wheat should cost but four shillings, he would be obliged to work but four days; but as wages in this kingdom are much higher in proportion to the price of necessaries ... the manufacturer, who labours four days, has a surplus of money to live idle with the rest of the week . ... I hope I have said enough to make it appear that the moderate labour of six days in a week is no slavery. Our labouring people do this, and to all appearance are the happiest of all our labouring poor, <fn ref="91"/> but the Dutch do this in manufactures, and appear to be a very happy people. The French do so, when holidays do not intervene. <fn ref="92"/> But our populace have adopted a notion, that as Englishmen they enjoy a birthright privilege of being more free and independent than in any country in Europe. Now this idea, as far as it may affect the bravery of our troops, may be of some use; but the less the manufacturing poor have of it, certainly the better for themselves and for the State. The labouring people should never) think themselves independent of their superiors.... It is extremely dangerous to encourage mobs in a commercial state like ours, where, perhaps, seven parts out of eight of the whole, are people with little or no property. The cure will not be perfect, till our manufacturing poor are contented to labour six days for the same sum which they now earn in four days.” <fn ref="93"/>
    hash: sha256:04f29b6a3df1c7d3a903dad0bbd2bb2ac4a20de801d4552f239ddb1ff527f330
    state: active
  - id: p00143
    type: paragraph
    text: 'To this end, and for “extirpating idleness debauchery and excess,” promoting a spirit of industry, “lowering the price of labour in our manufactories, and easing the lands of the heavy burden of poor’s rates,” our “faithful Eckart” of capital proposes this approved device: to shut up such labourers as become dependent on public support, in a word, paupers, in “an <i>ideal workhouse.”</i> Such ideal workhouse must be made a “House of Terror,” and not an asylum for the poor, “where they are to be plentifully fed, warmly and decently clothed, and where they do but little work.” <fn ref="94"/> In this “House of Terror,” this “ideal workhouse, the poor shall work 14 hours in a day, allowing proper time for meals, in such manner that there shall remain 12 hours of neat-labour.” <fn ref="95"/>'
    hash: sha256:3303dffeb5fa4cc58576690eb29ee39c1b0539ed4911cd306fbce7d6eef8d88a
    state: active
  - id: p00144
    type: paragraph
    text: Twelve working-hours daily in the Ideal Workhouse, in the “House of Terror” of 1770! 63 years later, in 1833, when the English Parliament reduced the working-day for children of 13 to 18, in four branches of industry to 12 full hours, the judgment day of English Industry had dawned! In 1852, when Louis Bonaparte sought to secure his position with the bourgeoisie by tampering with the legal working-day, the French working people cried out with one voice “the law that limits the working-day to 12 hours is the one good that has remained to us of the legislation of the Republic!” <fn ref="96"/> At Zürich the work of children over 10, is limited to 12 hours; in Aargau in 1862, the work of children between 13 and 16, was reduced from 12½ to 12 hours; in Austria in 1860, for children between 14 and 16, the same reduction was made. <fn ref="97"/> “What a progress,” since 1770! Macaulay would shout with exultation!
    hash: sha256:d3d24f0c27d5df03d86a736144705d3be937fae3b72a1b9197808eff41c9eaee
    state: active
  - id: p00145
    type: paragraph
    text: The “House of Terror” for paupers of which the capitalistic soul of 1770 only dreamed, was realised a few years later in the shape of a gigantic “Workhouse” for the industrial worker himself. It is called the Factory. And the ideal this time fades before the reality.
    hash: sha256:fa49533b96efe02e2b8076f34bb0eb3bbf9c18b9cc193df9a7a3d7f6bdb257b6
    state: active
  - id: p00146
    type: heading
    level: 3
    text: SECTION 6
    hash: sha256:aa9fc4b24778528878ff2f3a56d97ed99cebf548f80f95fa9537238bce8dd0fd
    state: active
  - id: p00147
    type: heading
    level: 4
    text: THE STRUGGLE FOR THE NORMAL WORKING-DAY.<br/>COMPULSORY LIMITATION BY LAW OF THE WORKING-TIME.<br/>THE ENGLISH FACTORY ACTS, 1833 TO 1864
    hash: sha256:7e996da913e4af5b7ccbb2f722ed64887987e40dd51a0d41e1b7556a9c3cc7c9
    state: active
  - id: p00148
    type: paragraph
    text: After capital had taken centuries in extending the working-day to its normal maximum limit, and then beyond this to the limit of the natural day of 12 hours, <fn ref="98"/> there followed on the birth of machinism and modern industry in the last third of the 18th century, a violent encroachment like that of an avalanche in its intensity and extent. All bounds of morals and nature, age and sex, day and night, were broken down. Even the ideas of day and night, of rustic simplicity in the old statutes, became so confused that an English judge, as late as 1860, needed a quite Talmudic sagacity to explain “judicially” what was day and what was night. <fn ref="99"/> Capital celebrated its orgies.
    hash: sha256:34c5083378a92907fd6c07b739d81b2a43d85d43e2cb04d71b0267f604da82ba
    state: active
  - id: p00149
    type: paragraph
    text: As soon as the working-class, stunned at first by the noise and turmoil of the new system of production, recovered, in some measure, its senses, its resistance began, and first in the native land of machinism, in England. For 30 years, however, the concessions conquered by the workpeople were purely nominal. Parliament passed 5 labour Laws between 1802 and 1833, but was shrewd enough not to vote a penny for their carrying out, for the requisite officials, &amp;c. <fn ref="100"/>
    hash: sha256:58ae3893b35fcc6830fe7d43674239dd63b50229027376175f4a9d0b9e731771
    state: active
  - id: p00150
    type: blockquote
    text: They remained a dead letter. “The fact is, that prior to the Act of 1833, young persons and children were worked all night, all day, or both <i>ad libitum</i>.” <fn ref="101"/>
    hash: sha256:daf7d110dcc365081acaccf30ca143028f758dfcf8b355ba861c112ec06cde90
    state: active
  - id: p00151
    type: paragraph
    text: A normal working-day for modern industry only dates from the Factory Act of 1833, which included cotton, wool, flax, and silk factories. Nothing is more characteristic of the spirit of capital than the history of the English Factory Acts from 1833 to 1864.
    hash: sha256:1d176f1910cee46537456975560f2d8a91ab208f29ba53f8fa2cd19ee469d5a3
    state: active
  - id: p00152
    type: paragraph
    text: The Act of 1833 declares the ordinary factory working-day to be from half-past five in the morning to half-past eight in the evening and within these limits, a period of 15 hours, it is lawful to employ young persons <i>(i.e</i>., persons between 13 and 18 years of age), at any time of the day, provided no one individual young person should work more than 12 hours in any one day, except in certain cases especially provided for. The 6th section of the Act provided. “That there shall be allowed in the course of every day not less than one and a half hours for meals to every such person restricted as hereinbefore provided.” The employment of children under 9, with exceptions mentioned later was forbidden; the work of children between 9 and 13 was limited to 8 hours a day, night-work, <i>i.e</i>., according to this Act, work between 8:30 p.m. and 5:30 a.m., was forbidden for all persons between 9 and 18.
    hash: sha256:407983dc8148ed3e8854464713212f8576a4b32b1beeb0e8ff5670e8ef857ac3
    state: active
  - id: p00153
    type: paragraph
    text: The law-makers were so far from wishing to trench on the freedom of capital to exploit adult labour-power, or, as they called it, “the freedom of labour,” that they created a special system in order to prevent the Factory Acts from having a consequence so outrageous.
    hash: sha256:819f1f1b429a2b37afe119a9012c8501c805c12f4332f6c96c66788e40738975
    state: active
  - id: p00154
    type: blockquote
    text: “The great evil of the factory system as at present conducted,” says the first report of the Central Board of the Commission of June 28th 1833, “has appeared to us to be that it entails the necessity of continuing the labour of children to the utmost length of that of the adults. The only remedy for this evil, short of the limitation of the labour of adults which would, in our opinion, create an evil greater than that which is sought to be remedied, appears to be the plan of working double sets of children.”
    hash: sha256:d3f4ee506d3191e6081dc53f767598cc1b78117ada50b7d17e78905414d75362
    state: active
  - id: p00155
    type: paragraph
    text: ... Under the name of System of Relays, this “plan” was therefore carried out, so that, e.g., from 5.30 a.m. until 1.30 in the afternoon, one set of children between 9 and 13, and from 1.30 p.m. to 8.30 in the evening another set were “put to,” &amp;c.
    hash: sha256:96d73d6350f1bf49a869da34522f5793d5baba0242460b6eaf9da6e1c36baeea
    state: active
  - id: p00156
    type: paragraph
    text: In order to reward the manufacturers for having, in the most barefaced way, ignored all the Acts as to children’s labour passed during the last twenty-two years, the pill was yet further gilded for them. Parliament decreed that after March 1st, 1834, no child under 11, after March 1st 1835, no child under 12, and after March 1st, 1836, no child under 13 was to work more than eight hours in a factory. This “liberalism,” so full of consideration for “capital,” was the more noteworthy as. Dr. Farre, Sir A. Carlisle, Sir B. Brodie, Sir C. Bell, Mr. Guthrie, &amp;c., in a word, the most distinguished physicians and surgeons in London, had declared in their evidence before the House of Commons, that there was danger in delay. Dr. Farre expressed himself still more coarsely.
    hash: sha256:24f5aeb2b26e329bd3236f3089b8872b3d1dc4f41494d1c7bb94428a35bfa82e
    state: active
  - id: p00157
    type: blockquote
    text: “Legislation is necessary for the prevention of death, in any form in which it can be prematurely inflicted, and certainly this (i.e., the factory method) must be viewed as a most cruel mode of inflicting it.”
    hash: sha256:b3bd3f879de29f2e6e700243e7e613d69d2ba2d743c2cdbb2f1d41fd1d2c6a9d
    state: active
  - id: p00158
    type: paragraph
    text: That same “reformed” Parliament, which in its delicate consideration for the manufacturers, condemned children under 13, for years to come, to 72 hours of work per week in the Factory Hell, on the other hand, in the Emancipation Act, which also administered freedom drop by drop, forbade the planters, from the outset, to work any negro slave more than 45 hours a week.
    hash: sha256:c839221e121b691e6163aa10b4e6132e45b477798c21309d047e6f05e9e811ef
    state: active
  - id: p00159
    type: paragraph
    text: But in no wise conciliated, capital now began a noisy agitation that went on for several years. It turned chiefly on the age of those who, under the name of children, were limited to 8 hours’ work, and were subject to a certain amount of compulsory education. According to capitalistic anthropology, the age of childhood ended at 10, or at the outside, at 11. The more nearly the time approached for the coming into full force of the Factory Act, the fatal year 1836, the more wildly raged the mob of manufacturers. They managed, in fact, to intimidate the government to such an extent that in 1835 it proposed to lower the limit of the age of childhood from 13 to 12. In the meantime the pressure from without grew more threatening. Courage failed the House of Commons. It refused to throw children of 13 under the Juggernaut Car of capital for more than 8 hours a day, and the Act of 1833 came into full operation. It remained unaltered until June, 1844.
    hash: sha256:45f9474889c64d23c74185dac4c040083f5cd3479826089e140c6bc5073fa8de
    state: active
  - id: p00160
    type: paragraph
    text: 'In the ten years during which it regulated factory work, first in part, and then entirely, the official reports of the factory inspectors teem with complaints as to the impossibility of putting the Act into force. As the law of 1833 left it optional with the lords of capital during the 15 hours, from 5.30 a.m. to 8.30 p.m., to make every “young person,” and “every child” begin, break off, resume, or end his 12 or 8 hours at any moment they liked, and also permitted them to assign to different persons, different times for meals, these gentlemen soon discovered a new “system of relays,” by which the labour-horses were not changed at fixed stations, but were constantly re-harnessed at changing stations. We do not pause longer on the beauty of this system, as we shall have to return to it later. But this much is clear at the first glance: that this system annulled the whole Factory Act, not only in the spirit, but in the letter. How could factory inspectors, with this complex bookkeeping in respect to each individual child or young person, enforce the legally determined work-time and the granting of the legal mealtimes? In a great many of the factories, the old brutalities soon blossomed out again unpunished. In an interview with the Home Secretary (1844), the factory inspectors demonstrated the impossibility of any control under the newly invented relay system. <fn ref="102"/> In the meantime, however, circumstances had greatly changed. The factory hands, especially since 1838, had made the Ten Hours’ Bill their economic, as they had made the Charter their political, election-cry. Some of the manufacturers, even, who had managed their factories in conformity with the Act of 1833, overwhelmed Parliament with memorials on the immoral competition of their false brethren whom greater impudence, or more fortunate local circumstances, enabled to break the law. Moreover, however much the individual manufacturer might give the rein to his old lust for gain, the spokesmen and political leaders of the manufacturing class ordered a change of front and of speech towards the workpeople. They had entered upon the contest for the repeal of the Corn Laws, and needed the workers to help them to victory. They promised therefore, not only a double-sized loaf of bread, but the enactment of the Ten Hours’ Bill in the Free-trade millennium. <fn ref="103"/> Thus they still less dared to oppose a measure intended only to make the law of 1833 a reality. Threatened in their holiest interest, the rent of land, the Tories thundered with philanthropic indignation against the “nefarious practices” <fn ref="104"/> of their foes.'
    hash: sha256:bc3b3a46c9d465854f28a5680c04c77d9a4a0d73b1ea5aff04f5234672040eca
    state: active
  - id: p00161
    type: paragraph
    text: "This was the origin of the additional Factory Act of June 7th, 1844. It came into effect on September 10th, 1844. It places under protection a new category of workers, viz., the women over 18. They were placed in every respect on the same footing as the young persons, their work time limited to twelve hours, their night-labour forbidden, &amp;c. For the first time, legislation saw itself compelled to control directly and officially the labour of adults. In the Factory Report of 1844-1845, it is said with irony:"
    hash: sha256:38ec1311315c8d6cbd403ba1e1e0d30cbeee1dd9aa473148450b38a4d7cf4aad
    state: active
  - id: p00162
    type: blockquote
    text: “No instances have come to my knowledge of adult women having expressed any regret at their <i>rights</i> being thus far interfered with.” <fn ref="105"/> The working-time of children under 13 was reduced to 6½, and in certain circumstances to 7 hours a-day. <fn ref="106"/>
    hash: sha256:4e7070e01eb98c010df53d2f9f3e965dfdd6f923034598b0ff68fb40506bf2df
    state: active
  - id: p00163
    type: paragraph
    text: "To get rid of the abuses of the “spurious relay system,” the law established besides others the following important regulations: —"
    hash: sha256:7bd2982640959fa7f44e5a9b909cdf0fca5258f65fe4ee43fbc7e93be0529081
    state: active
  - id: p00164
    type: blockquote
    text: “That the hours of work of children and young persons shall be reckoned from the time when any child or young person shall begin to work in the morning.”
    hash: sha256:448918832505e9750e456aca4a2796aa3db36a51cfbc48ed6d8d045a453fbb32
    state: active
  - id: p00165
    type: paragraph
    text: So that if A, <i>e.g.,</i> begins work at 8 in the morning, and B at 10, B’s work-day must nevertheless end at the same hour as A’s. “The time shall be regulated by a public clock,” for example, the nearest railway clock, by which the factory clock is to be set. The occupier is to hang up a “legible” printed notice stating the hours for the beginning and ending of work and the times allowed for the several meals. Children beginning work before 12 noon may not be again employed after I p.m. The afternoon shift must therefore consist of other children than those employed in the morning. Of the hour and a half for meal-times,
    hash: sha256:a326bfb0c056ee3c9ab9baa326a78f17882f4c27ce281bf8d8004cb3376ee7db
    state: active
  - id: p00166
    type: blockquote
    text: “one hour thereof at the least shall be given before three of the clock in the afternoon ... and at the same period of the day. No child or young person shall be employed more than five hours before I p.m. without an interval for meal-time of at least 30 minutes. No child or young person [or female] shall be employed or allowed to remain in any room in which any manufacturing process is then [<i>i.e</i>., at mealtimes] carried on,” &amp;c.
    hash: sha256:984968e9b6a1bbb0773efe87f5483aaa0f883003c483716aa4bef8697704e45a
    state: active
  - id: p00167
    type: paragraph
    text: It has been seen that these minutiae, which, with military uniformity, regulate by stroke of the clock the times, limits, pauses of the work were not at all the products of Parliamentary fancy. They developed gradually out of circumstances as natural laws of the modern mode of production. Their formulation, official recognition, and proclamation by the State, were the result of a long struggle of classes. One of their first consequences was that in practice the working-day of the adult males in factories became subject to the same limitations, since in most processes of production the co-operation of the children. young persons, and women is indispensable. On the whole, therefore, during the period from 1844 to 1847, the 12 hours’ working-day became general and uniform in all branches of industry under the Factory Act.
    hash: sha256:79f49f2405dcf453a24c71821adc2833f704db9f25be9d228af1acac54d05cee
    state: active
  - id: p00168
    type: paragraph
    text: The manufacturers, however, did not allow this “progress” without a compensating “retrogression.” At their instigation the House of Commons reduced the minimum age for exploitable children from 9 to 8, in order to assure that additional supply of factory children which is due to capitalists, according to divine and human law. <fn ref="107"/>
    hash: sha256:89bf6bd22be48e057c865e6b521c8ec3aed2fe7e10862903adb8b8839f0fbc07
    state: active
  - id: p00169
    type: paragraph
    text: The years 1846-47 are epoch-making in the economic history of England. The Repeal of the Corn Laws, and of the duties on cotton and other raw material; Free-trade proclaimed as the guiding star of legislation; in a word, the arrival of the millennium. On the other hand, in the same years, the Chartist movement and the 10 hours’ agitation reached their highest point. They found allies in the Tories panting for revenge. Despite the fanatical opposition of the army of perjured Free-traders, with Bright and Cobden at their head, the Ten Hours’ Bill, struggled for so long, went through Parliament.
    hash: sha256:028edb5b7b1e96da86a0f134ddf1918dfc9f44b58f70cc695a5cbe3ed4672ace
    state: active
  - id: p00170
    type: paragraph
    text: The new Factory Act of June 8th, 1847, enacted that on July 1st, 1847, there should be a preliminary shortening of the working-day for “young persons” (from 13 to 18), and all females to 11 hours, but that on May 1st, 1848, there should be a definite limitation of the working-day to 10 hours. In other respects, the Act only amended and completed the Acts of 1833 and 1844.
    hash: sha256:f307967b65ca3df5cd700d0a99aa168aa02627fbbaa44512b1b88256cd4de6e4
    state: active
  - id: p00171
    type: paragraph
    text: Capital now entered upon a preliminary campaign in order to hinder the Act from coming into full force on May 1st, 1848. And the workers themselves, under the presence that they had been taught by experience, were to help in the destruction of their own work. The moment was cleverly chosen.
    hash: sha256:072c8d1c15524f5cc795ccfe8aa09c019274b4382c9631080d89ea7e062ac7a1
    state: active
  - id: p00172
    type: blockquote
    text: “It must be remembered, too, that there has been more than two years of great suffering (in consequence of the terrible crisis of 1846-47) among the factory operatives, from many mills having worked short time, and many being altogether closed. A considerable number of the operatives must therefore be in very narrow circumstances many, it is to be feared, in debt; so that it might fairly have been presumed that at the present time they would prefer working the longer time, in order to make up for past losses, perhaps to pay off debts, or get their furniture out of pawn, or replace that sold, or to get a new supply of clothes for themselves and their families.” <fn ref="108"/>
    hash: sha256:e8c3a9d7bd9ea3e7c57f1041c2fa06699cc50e75daa227f2950cf0face7e8e7d
    state: active
  - id: p00173
    type: paragraph
    text: The manufacturers tried to aggravate the natural effect of these circumstances by a general reduction of wages by 10%. This was done so to say, to celebrate the inauguration of the new Free-trade era. Then followed a further reduction of 8 1/3% as soon as the working-day was shortened to 11, and a reduction of double that amount as soon as it was finally shortened to 10 hours. Wherever, therefore, circumstances allowed it, a reduction of wages of at least 25% took place. <fn ref="109"/> Under such favourably prepared conditions the agitation among the factory workers for the repeal of the Act of 1847 was begun. Neither lies, bribery, nor threats were spared in this attempt. But all was in vain. Concerning the half-dozen petitions in which workpeople were made to complain of “their oppression by the Act,” the petitioners themselves declared under oral examination, that their signatures had been extorted from them. “They felt themselves oppressed, but not exactly by the Factory Act.” <fn ref="110"/> But if the manufacturers did not succeed in making the workpeople speak as they wished, they themselves shrieked all the louder in press and Parliament in the name of the workpeople. They denounced the Factory Inspectors as a kind of revolutionary commissioners like those of the French National Convention ruthlessly sacrificing the unhappy factory workers to their humanitarian crotchet. This manoeuvre also failed. Factory Inspector Leonard Horner conducted in his own person, and through his sub-inspectors, many examinations of witnesses in the factories of Lancashire. About 70% of the workpeople examined declared in favour of 10 hours, a much smaller percentage in favour of 11, and an altogether insignificant minority for the old 12 hours. <fn ref="111"/>
    hash: sha256:6b9658f54b9464007edfd82426b9e04454a11a1263b5db145f5428c4fe424d39
    state: active
  - id: p00174
    type: paragraph
    text: "Another “friendly” dodge was to make the adult males work 12 to 15 hours, and then to blazon abroad this fact as the best proof of what the proletariat desired in its heart of hearts. But the “ruthless” Factory Inspector Leonard Horner was again to the fore. The majority of the “over-times” declared:"
    hash: sha256:642eff179f4aee18d75424299c562e50ce73583c5a78b03e96e799a0baeb0f39
    state: active
  - id: p00175
    type: blockquote
    text: “They would much prefer working ten hours for less wages, but that they had no choice; that so many were out of employment (so many spinners getting very low wages by having to work as piecers, being unable to do better), that if they refused to work the longer time, others would immediately get their places, so that it was a question with them of agreeing to work the longer time, or of being thrown out of employment altogether.” <fn ref="112"/>
    hash: sha256:3a27cb8757d55a1258acbc89d1564397880ac36b3cc7a6537d8a8163fcef580d
    state: active
  - id: p00176
    type: paragraph
    text: The preliminary campaign of capital thus came to grief, and the Ten Hours’ Act came into force May 1st, 1848. But meanwhile the fiasco of the Chartist party whose leaders were imprisoned, and whose organisation was dismembered, had shaken the confidence of the English working-class in its own strength. Soon after this the June insurrection in Paris and its bloody suppression united, in England as on the Continent, all fractions of the ruling classes, landlords and capitalists, stock-exchange wolves and shop-keepers, Protectionists and Freetraders, government and opposition, priests and freethinkers, young whores and old nuns, under the common cry for the salvation of Property, Religion, the Family and Society. The working-class was everywhere proclaimed, placed under a ban, under a virtual law of suspects. The manufacturers had no need any longer to restrain themselves. They broke out in open revolt not only against the Ten Hours’ Act, but against the whole of the legislation that since 1833 had aimed at restricting in some measure the “free” exploitation of labour-power. It was a pro-slavery rebellion in miniature, carried on for over two years with a cynical recklessness, a terrorist energy all the cheaper because the rebel capitalist risked nothing except the skin of his “hands.”
    hash: sha256:e884fb111b3348dfc284f2403a225ccd6293cee145bd3fad2121c920d1b3af23
    state: active
  - id: p00177
    type: paragraph
    text: "To understand that which follows we must remember that the Factory Acts of 1833, 1844, and 1847 were all three in force so far as the one did not amend the other: that not one of these limited the working-day of the male worker over 18, and that since 1833 the 15 hours from 5.30 a.m. to 8.30 p.m. had remained the legal “day,” within the limits of which at first the 12, and later the 10 hours’ labour of young persons and women had to be performed under the prescribed conditions."
    hash: sha256:00e68711bab2e796a5e0f9bc61742800febb5cd0dc7666fdaaa1a0513e472bab
    state: active
  - id: p00178
    type: paragraph
    text: The manufacturers began by here and there discharging a part of, in many cases half of the young persons and women employed by them, and then, for the adult males, restoring the almost obsolete night-work. The Ten Hours’ Act, they cried, leaves no other alternative. <fn ref="113"/>
    hash: sha256:808e7d09508af62513eb57a7299cee9783fab93d2b3c62875e4cf30decd97e30
    state: active
  - id: p00179
    type: paragraph
    text: Their second step dealt with the legal pauses for meals. Let us hear the Factory Inspectors.
    hash: sha256:7d62eea23508057d6332c9e2868ff1774ee294401412d388db0eb47389788fd3
    state: active
  - id: p00180
    type: blockquote
    text: “Since the restriction of the hours of work to ten, the factory occupiers maintain, although they have not yet practically gone the whole length, that supposing the hours of work to be from 9 a.m. to 7 p.m. they fulfil the provisions of the statutes by allowing an hour before 9 a.m. and half an hour after 7 p.m. [for meals]. In some cases they now allow an hour, or half an hour for dinner, insisting at the same time, that they are not bound to allow any part of the hour and a half in the course of the factory working-day.” <fn ref="114"/> The manufacturers maintained therefore that the scrupulously strict provisions of the Act of 1844 with regard to meal-times only gave the operatives permission to eat and drink before coming into, and after leaving the factory — i.e., at home. And why should not the workpeople eat their dinner before 9 in the morning? The crown lawyers, however, decided that the prescribed meal-times
    hash: sha256:600a48bfe0c209307a05b39561c50d720c19b47f55c101e3638e7a80e8ed3f64
    state: active
  - id: p00181
    type: blockquote
    text: “must be in the interval during the working-hours, and that it will not be lawful to work for 10 hours continuously, from 9 a.m. to 7 p.m., without any interval.” <fn ref="115"/>
    hash: sha256:8508e045396200071962868253335c045dbf9b42c6492d8d343bbe26da8677c1
    state: active
  - id: p00182
    type: paragraph
    text: After these pleasant demonstrations, Capital preluded its revolt by a step which agreed with the letter of the law of 1844, and was therefore legal.
    hash: sha256:e6c15cce5bd2c835dd54bef3ca25c891979b22dc18a955c88b17e56f85c8bd76
    state: active
  - id: p00183
    type: paragraph
    text: The Act of 1844 certainly prohibited the employment after 1 p.m. of such children, from 8 to 13, as had been employed before noon. But it did not regulate in any way the 6½ hours’ work of the children whose work-time began at 12 midday or later. Children of 8 might, if they began work at noon, be employed from 12 to 1, 1 hour; from 2 to 4 in the afternoon, 2 hours; from 5 to 8.30 in the evening, 3½ hours; in all, the legal 6½ hours. Or better still. In order to make their work coincide with that of the adult male labourers up to 8.30 p.m., the manufacturers only had to give them no work till 2 in the afternoon, they could then keep them in the factory without intermission till 8.30 in the evening.
    hash: sha256:916ae0e91bc6f49bdbbe0845ca00d70248615117f590c2116e14a82dcb6e5f5e
    state: active
  - id: p00184
    type: blockquote
    text: “And it is now expressly admitted that the practice exists in England from the desire of mill-owners to have their machinery at work for more than 10 hours a-day, to keep the children at work with male adults after all the young persons and women have left, and until 8.30 p.m. if the factory-owners choose.” <fn ref="116"/>
    hash: sha256:96f89d1d22d08c130ef8b22f8d18a51086c7b3b0e2be9f3b0205a01ec6fc770f
    state: active
  - id: p00185
    type: paragraph
    text: "Workmen and factory inspectors protested on hygienic and moral grounds, but Capital answered:"
    hash: sha256:2c0938c3a9a592d77920d51ce6b71c6e705c36053f016555e7f4e007c3c79bef
    state: active
  - id: p00186
    type: blockquote
    text: “My deeds upon my head! I crave the law,<br/>The penalty and forfeit of my bond.”
    hash: sha256:ddab230984a5e88f531596b0d19e262bef47a20c78f32b50c81fd4ab35027174
    state: active
  - id: p00187
    type: paragraph
    text: In fact, according to statistics laid before the House of Commons on July 26th, 1850, in spite of all protests, on July 15th, 1850, 3,742 children were subjected to this “practice” in 257 factories. <fn ref="117"/> Still, this was not enough. The Lynx eye of Capital discovered that the Act of 1844 did not allow 5 hours’ work before mid-day without a pause of at least 30 minutes for refreshment, but prescribed nothing of the kind for work after mid-day. Therefore, it claimed and obtained the enjoyment not only of making children of 8 drudge without intermission from 2 to 8.30 p.m., but also of making them hunger during that time.
    hash: sha256:df353bb9c1ae502e667bbe4d9837ff0571b868b47c35da9b941fddb32a1dd1ab
    state: active
  - id: p00188
    type: blockquote
    text: “Ay, his heart.<br/>So says the bond.”
    hash: sha256:ea9eec26fcc0867e1b29a98e4644900661bcf7f2478971702814092bef2c0998
    state: active
  - id: p00189
    type: paragraph
    text: This Shylock-clinging <fn ref="118"/> to the letter of the law of 1844, so far as it regulated children’s labour, was but to lead up to an open revolt against the same law, so far as it regulated the labour of “young persons and women.” It will be remembered that the abolition of the “false relay system” was the chief aim and object of that law. The masters began their revolt with the simple declaration that the sections of the Act of 1844 which prohibited the <i>ad libitum</i> use of young persons and women in such short fractions of the day of 15 hours as the employer chose, were “comparatively harmless” so long as the work-time was fixed at 12 hours. But under the Ten Hours’ Act they were a “grievous hardship.” <fn ref="119"/> They informed the inspectors in the coolest manner that they should place themselves above the letter of the law, and re-introduce the old system on their own account. <fn ref="120"/> They were acting in the interests of the ill-advised operatives themselves, “in order to be able to pay them higher wages.”
    hash: sha256:228ca14bb0656bdd15fc2f0a4a24efba94b7f64f9e1bfe5318969360b3e017ee
    state: active
  - id: p00190
    type: blockquote
    text: '"This was the only possible plan by which to maintain, under the Ten Hours’ Act, the industrial supremacy of Great Britain.” “Perhaps it may be a little difficult to detect irregularities under the relay system; but what of that? Is the great manufacturing interest of this country to be treated as a secondary matter in order to save some little trouble to Inspectors and Sub-Inspectors of Factories?” <fn ref="121"/>'
    hash: sha256:62ab54463129b1ab6ad4c3232171a9367e2cb3f32157f1bd2279ab7d93da2392
    state: active
  - id: p00191
    type: paragraph
    text: All these shifts naturally were of no avail. The Factory Inspectors appealed to the Law Courts. But soon such a cloud of dust in the way of petitions from the masters overwhelmed the Home Secretary, Sir George Grey, that in a circular of August 5th, 1848, he recommends the inspectors not
    hash: sha256:79f089bdbd1d087680a5b98568dff8902cb935fda9322db1a767c0718c9fe0ee
    state: active
  - id: p00192
    type: blockquote
    text: “to lay informations against mill-owners for a breach of the letter of the Act, or for employment of young persons by relays in cases in which there is no reason to believe that such young persons have been actually employed for a longer period than that sanctioned by law.” Hereupon, Factory Inspector J. Stuart allowed the so-called relay system during the 15 hours of the factory day throughout Scotland, where it soon flourished again as of old. The English Factory Inspectors, on the other hand, declared that the Home Secretary had no power dictatorially to suspend the law, and continued their legal proceedings against the pro-slavery rebellion.
    hash: sha256:4c2f1f9dc87089f3aa19e914da18f321970d6d344462c49917e986afbbb3c8de
    state: active
  - id: p00193
    type: paragraph
    text: But what was the good of summoning the capitalists when the Courts in this case the county magistrates — Cobbett’s “Great Unpaid” — acquitted them? In these tribunals, the masters sat in judgment on themselves An example. One Eskrigge, cotton-spinner, of the firm of Kershaw, Leese, &amp; Co., had laid before the Factory Inspector of his district the scheme of a relay system intended for his mill. Receiving a refusal, he at first kept quiet. A few months later, an individual named Robinson, also a cotton-spinner, and if not his Man Friday, at all events related to Eskrigge, appeared before the borough magistrates of Stockport on a charge of introducing the identical plan of relays invented by Eskrigge. Four Justices sat, among them three cottonspinners, at their head this same inevitable Eskrigge. Eskrigge acquitted Robinson, and now was of opinion that what was right for Robinson was fair for Eskrigge. Supported by his own legal decision, he introduced the system at once into his own factory. <fn ref="122"/> Of course, the composition of this tribunal was in itself a violation of the law. <fn ref="123"/>
    hash: sha256:6642137e1321038e17b147ed37f838d348b0c49134ab300c96059c456e06a79e
    state: active
  - id: p00194
    type: blockquote
    text: These judicial farces, exclaims Inspector Howell, “urgently call for a remedy — either that the law should be so altered as to be made to conform to these decisions, or that it should be administered by a less fallible tribunal, whose decisions would conform to the law ... when these cases are brought forward. I long for a stipendiary magistrate.” <fn ref="124"/>
    hash: sha256:4b3a2b7b11d20c8f3ab70c3bd7226a72c1a4cced88035b937fbaf862f9074aca
    state: active
  - id: p00195
    type: paragraph
    text: The crown lawyers declared the masters’ interpretation of the Act of 1848 absurd. But the Saviours of Society would not allow themselves to be turned from their purpose. Leonard Horner reports,
    hash: sha256:f159c34707600210d196abb619af1567af7737f6cc79cdd9591740a6ac1f1e0f
    state: active
  - id: p00196
    type: blockquote
    text: “Having endeavoured to enforce the Act ... by ten prosecutions in seven magisterial divisions, and having been supported by the magistrates in one case only ... I considered it useless to prosecute more for this evasion of the law. That part of the Act of 1848 which was framed for securing uniformity in the hours of work, ... is thus no longer in force in my district (Lancashire). Neither have the sub-inspectors or myself any means of satisfying ourselves, when we inspect a mill working by shifts, that the young persons and women are not working more than 10 hours a-day.... In a return of the 30th April, ... of millowners working by shifts, the number amounts to 114, and has been for some time rapidly increasing. In general, the time of working the mill is extended to 13½ hours’ from 6 a.m. to 7½ p.m., .... in some instances it amounts to 15 hours, from 5½ a.m. to 8½ p.m.” <fn ref="125"/>
    hash: sha256:a2350620366f4e6b5f05100154dda4686a5ae21df915453d33a490955dec333e
    state: active
  - id: p00197
    type: paragraph
    text: Already, in December, 1848, Leonard Horner had a list of 65 manufacturers and 29 overlookers who unanimously declared that no system of supervision could, under this relay system, prevent enormous over-work. <fn ref="126"/> Now, the same children and young persons were shifted from the spinning-room to the weaving-room, now, during 15 hours, from one factory to another. <fn ref="127"/> How was it possible to control a system which,
    hash: sha256:b5830a8d3f45a6b1e9a7a85af910a7d69b469e3793e2ea91853fdc34dd964119
    state: active
  - id: p00198
    type: blockquote
    text: “under the guise of relays, is some one of the many plans for shuffling ‘the hands’ about in endless variety, and shifting the hours of work and of rest for different individuals throughout the day, so that you may never have one complete set of hands working together in the same room at the same time.” <fn ref="128"/>
    hash: sha256:0fcd446919ba9020da3707972c08fbb469a26666453e360d949812ec2b28cd3b
    state: active
  - id: p00199
    type: paragraph
    text: But altogether independently of actual over-work, this so-called relay system was an offspring of capitalistic fantasy, such as Fourier, in his humorous sketches of “Courtes Seances,” has never surpassed, except that the “attraction of labour” was changed into the attraction of capital. Look, for example, at those schemes of the masters which the “respectable” press praised as models of “what a reasonable degree of care and method can accomplish.” The <i>personnel</i> of the workpeople was sometimes divided into from 12 to 14 categories, which themselves constantly changed and recharged their constituent parts. During the 15 hours of the factory day, capital dragged in the labourer now for 30 minutes, now for an hour, and then pushed him out again, to drag him into the factory and to thrust him out afresh, hounding him hither and thither, in scattered shreds of time, without ever losing hold of him until the full 10 hours’ work was done. As on the stage, the same persons had to appear in turns in the different scenes of the different acts. But as an actor during the whole course of the play belongs to the stage, so the operatives, during 15 hours, belonged to the factory, without reckoning the time for going and coming. Thus the hours of rest were turned into hours of enforced idleness, which drove the youths to the pot-house, and the girls to the brothel. At every new trick that the capitalist, from day to day, hit upon for keeping his machinery going 12 or 15 hours without increasing the number of his hands, the worker had to swallow his meals now in this fragment of time, now in that. At the time of the 10 hours’ agitation, the masters cried out that the working mob petitioned in the hope of obtaining 12 hours’ wages for 10 hours’ work. Now they reversed the medal. They paid 10 hours’ wages for 12 or 15 hours’ lordship over labour-power. <fn ref="129"/> This was the gist of the matter, this the masters’ interpretation of the 10 hours’ law! These were the same unctuous Free-traders, perspiring with the love of humanity, who for full 10 years, during the Anti-Corn Law agitation, had preached to the operatives, by a reckoning of pounds, shillings, and pence, that with free importation of corn, and with the means possessed by English industry, 10 hours’ labour would be quite enough to enrich the capitalists. <fn ref="130"/> This revolt of capital, after two years was at last crowned with victory by a decision of one of the four highest Courts of Justice in England, the Court of Exchequer, which in a case brought before it on February 8th, 1850, decided that the manufacturers were certainly acting against the sense of the Act of 1844, but that this Act itself contained certain words that rendered it meaningless. “By this decision, the Ten Hours’ Act was abolished.” <fn ref="131"/> A crowd of masters, who until then had been afraid of using the relay system for young persons and women, now took it up heart and soul. <fn ref="132"/>
    hash: sha256:d51f19f59d21e3448023c16af34d77bb025bf3d99d42c875bdf63a2e892e828b
    state: active
  - id: p00200
    type: paragraph
    text: "But on this apparently decisive victory of capital, followed at once a revulsion. The workpeople had hitherto offered a passive, although inflexible and unremitting resistance. They now protested in Lancashire and Yorkshire in threatening meetings. The pretended Ten Hours’ Act was thus simple humbug, parliamentary cheating, had never existed! The Factory Inspectors urgently warned the Government that the antagonism of classes had arrived at an incredible tension. Some of the masters themselves murmured:"
    hash: sha256:8cc00d2140a621809daef14611abce3db596e508d8f52e9f13c9f96b16930b0d
    state: active
  - id: p00201
    type: blockquote
    text: “On account of the contradictory decisions of the magistrates, a condition of things altogether abnormal and anarchical obtains. One law holds in Yorkshire, another in Lancashire, one law in one parish of Lancashire, another in its immediate neighbourhood. The manufacturer in large towns could evade the law, the manufacturer in country districts could not find the people necessary for the relay system, still less for the shifting of hands from one factory to another,” &amp;c.
    hash: sha256:3d697524774b0a3f5ecc56cf87a619350b855002fbf9cbd0d8b4cc056f352d0e
    state: active
  - id: p00202
    type: paragraph
    text: And the first birthright of capital is equal exploitation of labour-power by all capitalists.
    hash: sha256:aec651fb1ff5bd92412ff7671d0c23d57666b12453779cef7cd69c1c8f07d442
    state: active
  - id: p00203
    type: paragraph
    text: Under these circumstances a compromise between masters and men was effected that received the seal of Parliament in the additional Factory Act of August 5th, 1850. The working-day for “young persons and women,” was raised from 10 to 10 — hours for the first five days of the week, and shortened to 7½ on the Saturday. The work was to go on between 6 a.m. and 6 p.m., <fn ref="133"/> with pauses of not less than 1½ hours for meal-times, these meal-times to be allowed at one and the same time for all, and conformably to the conditions of 1844. By this an end was put to the relay system once for all. <fn ref="134"/> For children’s labour, the Act of 1844 remained in force.
    hash: sha256:e7af3e77ecaa2c3f729f01f4961a7b50cc90670fad815e3980f0f02cddf0851c
    state: active
  - id: p00204
    type: paragraph
    text: One set of masters, this time as before, secured to itself special seigneurial rights over the children of the proletariat. These were the silk manufacturers. In 1833 they had howled out in threatening fashion, “if the liberty of working children of any age for 10 hours a day were taken away, it would stop their works.” <fn ref="135"/> It would be impossible for them to buy a sufficient number of children over 13. They extorted the privilege they desired. The pretext was shown on subsequent investigation to be a deliberate lie. <fn ref="136"/> It did not, however, prevent them, during 10 years, from spinning silk 10 hours a day out of the blood of little children who had to be placed upon stools for the performance of their work. <fn ref="137"/> The Act of 1844 certainly “robbed” them of the “liberty” of employing children under 11 longer than 6½ hours a day. But it secured to them, on the other hand, the privilege of working children between 11 and 13, 10 hours a day, and of annulling in their case the education made compulsory for all other factory children. This time the pretext was
    hash: sha256:937fd606d57aa340cef78ed5362e29eb9793318b9f0668cdbb675b1da9c1f959
    state: active
  - id: p00205
    type: blockquote
    text: “the delicate texture of the fabric in which they were employed, requiring a lightness of touch, only to be acquired by their early introduction to these factories.” <fn ref="138"/>
    hash: sha256:0622660c71665e4139c56934d7fb1a2ab67e72b28cc64c7485f1a8d9767b249c
    state: active
  - id: p00206
    type: paragraph
    text: 'The children were slaughtered out-and-out for the sake of their delicate fingers, as in Southern Russia the horned cattle for the sake of their hide and tallow. At length, in 1850, the privilege granted in 1844, was limited to the departments of silk-twisting and silk-winding. But here, to make amends to capital bereft of its “freedom,” the work-time for children from 11 to 13 was raised from 10 to 10½ hours. Pretext: “Labour in silk mills was lighter than in mills for other fabrics, and less likely in other respects also to be prejudicial to health.” <fn ref="139"/> Official medical inquiries proved afterwards that, on the contrary,'
    hash: sha256:424432a113e2c52bf65ab215a6d95511e9a4d5ec978f1e674fccdb25e2c5413f
    state: active
  - id: p00207
    type: blockquote
    text: “the average death-rate is exceedingly high in the silk districts and amongst the female part of the population is higher even than it is in the cotton districts of Lancashire.” <fn ref="140"/>
    hash: sha256:0b33008ba3fef84af813e3b675764e8df23ecfda7c06cd6a8f67c57bfa5eaaec
    state: active
  - id: p00208
    type: paragraph
    text: Despite the protests of the Factory Inspector, renewed every 6 months, the mischief continues to this hour. <fn ref="141"/>
    hash: sha256:f59301f5ef620cd7798b4cc2d254b7940c9fd2d5d4dafdd381e950053a909534
    state: active
  - id: p00209
    type: paragraph
    text: The Act of 1850 changed the 15 hours’ time from 6 a.m. to 8.30 p.m., into the 12 hours from 6 a.m. to 6 p.m. for “young persons and women” only. It did not, therefore, affect children who could always be employed for half an hour before and 2½ hours after this period, provided the whole of their labour did not exceed 6½ hours. Whilst the bill was under discussion, the Factory Inspectors laid before Parliament statistics of the infamous abuses due to this anomaly. To no purpose. In the background lurked the intention of screwing up, during prosperous years, the working-day of adult males to 15 hours by the aid of the children. The experience of the three following years showed that such an attempt must come to grief against the resistance of the adult male operatives. The Act of 1850 was therefore finally completed in 1853 by forbidding the “employment of children in the morning before and in the evening after young persons and women.” Henceforth with a few exceptions the Factory Act of 1850 regulated the working-day of all workers in the branches of industry that come under it. <fn ref="142"/> Since the passing of the first Factory Act half a century had elapsed. <fn ref="143"/>
    hash: sha256:4e067947de5cd26cd866c8491c3bde2e5cb84afdefad509415dc1e2d515ae69f
    state: active
  - id: p00210
    type: paragraph
    text: Factory legislation for the first time went beyond its original sphere in the “Printworks’ Act of 1845.” The displeasure with which capital received this new “extravagance” speaks through every line of the Act. It limits the working-day for children from 8 to 13, and for women to 16 hours, between 6 a.m. and 10 p.m., without any legal pause for meal-times. It allows males over 13 to be worked at will day and night. <fn ref="144"/> It is a Parliamentary abortion. <fn ref="145"/>
    hash: sha256:256a927102a23e9ec7fd0d1c9ce35be3eaeb15045787f7ca3dea0398f84f02ae
    state: active
  - id: p00211
    type: paragraph
    text: However, the principle had triumphed with its victory in those great branches of industry which form the most characteristic creation of the modern mode of production. Their wonderful development from 1853 to 1860, hand-in-hand with the physical and moral regeneration of the factory workers, struck the most purblind. The masters from whom the legal limitation and regulation had been wrung step by step after a civil war of half a century, themselves referred ostentatiously to the contrast with the branches of exploitation still “free.” <fn ref="146"/> The Pharisees of “Political Economy” now proclaimed the discernment of the necessity of a legally fixed working-day as a characteristic new discovery of their “science.” <fn ref="147"/> It will be easily understood that after the factory magnates had resigned themselves and become reconciled to the inevitable, the power of resistance of capital gradually weakened, whilst at the same time the power of attack of the working-class grew with the number of its allies in the classes of society not immediately interested in the question. Hence the comparatively rapid advance since 1860.
    hash: sha256:fe5707403df89a44f431469adbef44ae941242291fda1dd86797e8471a73a3ba
    state: active
  - id: p00212
    type: paragraph
    text: The dye-works and bleach-works all came under the Factory Act of 1850 in 1860; <fn ref="148"/> lace and stocking manufactures in 1861.
    hash: sha256:17797e238249764581ab776692112ea95efb146b4f24a4e882548b14dc319e3c
    state: active
  - id: p00213
    type: paragraph
    text: In consequence of the first report of the Commission on the employment of children (1863) the same fate was shared by the manufacturers of all earthenwares (not merely pottery), Lucifer-matches, percussion caps, cartridges, carpets, fustian-cutting, and many processes included under the name of “finishing.” In the year 1863 bleaching in the open air <fn ref="149"/> and baking were placed under special Acts, by which, in the former, the labour of young persons and women during the night-time (from 8 in the evening to 6 in the morning), and in the latter, the employment of journeymen bakers under 18, between 9 in the evening and 5 in the morning were forbidden. We shall return to the later proposals of the same Commission, which threatened to deprive of their “freedom” all the important branches of English Industry, with the exception of agriculture, mines, and the means of transport. <fn ref="150"/>
    hash: sha256:b5fcaed9f6f288b1d388b2aedd18a6865313a1e02e967d087ec617a6436247d7
    state: active
  - id: p00214
    type: heading
    level: 3
    text: SECTION 7
    hash: sha256:f6277956974bbcec281151e29484a7e88098fba6ac5cb070deb43d02ceeb6412
    state: active
  - id: p00215
    type: heading
    level: 4
    text: THE STRUGGLE FOR THE NORMAL WORKING-DAY.<br/>RE-ACTION OF THE ENGLISH FACTORY ACTS ON OTHER COUNTRIES
    hash: sha256:37da1fa09bf4398465b2d886417faba42bfcff49066c01486248004b23caf797
    state: active
  - id: p00216
    type: paragraph
    text: "The reader will bear in mind that the production of surplus-value, or the extraction of surplus-labour, is the specific end and aim, the sum and substance, of capitalist production, quite apart from any changes in the mode of production, which may arise from the subordination of labour to capital. He will remember that as far as we have at present gone only the independent labourer, and therefore only the labourer legally qualified to act for himself, enters as a vendor of a commodity into a contract with the capitalist. If, therefore, in our historical sketch, on the one hand, modern industry, on the other, the labour of those who are physically and legally minors, play important parts, the former was to us only a special department, and the latter only a specially striking example of labour exploitation. Without, however, anticipating the subsequent development of our inquiry, from the mere connexion of the historic facts before us it follows:"
    hash: sha256:0e69bebc355b5f1dd8703070138753305d43280c85cc830057f755dec927ac00
    state: active
  - id: p00217
    type: paragraph
    text: <i>First</i>. The passion of capital for an unlimited and reckless extension of the working-day, is first gratified in the industries earliest revolutionised by water-power, steam, and machinery, in those first creations of the modern mode of production, cotton, wool, flax, and silk spinning, and weaving. The changes in the material mode of production, and the corresponding changes in the social relations of the producers <fn ref="151"/> gave rise first to an extravagance beyond all bounds, and then in opposition to this, called forth a control on the part of Society which legally limits, regulates, and makes uniform the working-day and its pauses. This control appears, therefore, during the first half of the nineteenth century simply as exceptional legislation. <fn ref="152"/> As soon as this primitive dominion of the new mode of production was conquered, it was found that, in the meantime, not only had many other branches of production been made to adopt the same factory system, but that manufactures with more or less obsolete methods, such as potteries, glass-making, &amp;c., that old-fashioned handicrafts, like baking, and, finally, even that the so-called domestic industries, such as nail-making, <fn ref="153"/> had long since fallen as completely under capitalist exploitation as the factories themselves. Legislation was, therefore, compelled to gradually get rid of its exceptional character, or where, as in England, it proceeds after the manner of the Roman Casuists, to declare any house in which work was done to be a factory. <fn ref="154"/>
    hash: sha256:1b15d6c6018baf9f67042b95b2edcdec9a7f099e9aa5ce3895735fd57124f291
    state: active
  - id: p00218
    type: paragraph
    text: <i>Second</i>. The history of the regulation of the working-day in certain branches of production, and the struggle still going on in others in regard to this regulation, prove conclusively that the isolated labourer, the labourer as “free” vendor of his labour-power, when capitalist production has once attained a certain stage, succumbs without any power of resistance. The creation of a normal working-day is, therefore, the product of a protracted civil war, more or less dissembled, between the capitalist class and the working-class. As the contest takes place in the arena of modern industry, it first breaks out in the home of that industry — England. <fn ref="155"/> The English factory workers were the champions, not only of the English, but of the modern working-class generally, as their theorists were the first to throw down the gauntlet to the theory of capital. <fn ref="156"/> Hence, the philosopher of the Factory, Ure, denounces as an ineffable disgrace to the English working-class that they inscribed “the slavery of the Factory Acts” on the banner which they bore against capital, manfully striving for “perfect freedom of labour.” <fn ref="157"/>
    hash: sha256:b850653303d285618a7b69067a80744f18ceef47892d8d60f6fd67c1a2ad8e2d
    state: active
  - id: p00219
    type: paragraph
    text: France limps slowly behind England. The February revolution was necessary to bring into the world the 12 hours’ law, <fn ref="158"/> which is much more deficient than its English original. For all that, the French revolutionary method has its special advantages. It once for all commands the same limit to the working-day in all shops and factories without distinction, whilst English legislation reluctantly yields to the pressure of circumstances, now on this point, now on that, and is getting lost in a hopelessly bewildering tangle of contradictory enactments. <fn ref="159"/> On the other hand, the French law proclaims as a principle that which in England was only won in the name of children, minors, and women, and has been only recently for the first time claimed as a general right. <fn ref="160"/>
    hash: sha256:bae6b6de9473b02a2aae6d2f89b8ead83640c05f16f3643a23bb0c269bd6627d
    state: active
  - id: p00220
    type: paragraph
    text: "In the United States of North America, every independent movement of the workers was paralysed so long as slavery disfigured a part of the Republic. Labour cannot emancipate itself in the white skin where in the black it is branded. But out of the death of slavery a new life at once arose. The first fruit of the Civil War was the eight hours’ agitation, that ran with the seven-leagued boots of the locomotive from the Atlantic to the Pacific, from New England to California. The General Congress of labour at Baltimore (August 16th, 1866) declared:"
    hash: sha256:3f30a460d3f1f09e5c3acd5d8b96d50bd2ae76b1a7bd82ecc0967e452b7e8b9a
    state: active
  - id: p00221
    type: blockquote
    text: “The first and great necessity of the present, to free the labour of this country from capitalistic slavery, is the passing of a law by which eight hours shall be the normal working-day in all States of the American Union. We are resolved to put forth all our strength until this glorious result is attained.” <fn ref="161"/>
    hash: sha256:982235a00e034811ac0110a14ab8a24beb25fdd60857248b62a7fb8d10c7bcee
    state: active
  - id: p00222
    type: paragraph
    text: At the same time, the Congress of the International Working Men’s Association at Geneva, on the proposition of the London General Council, resolved that “the limitation of the working-day is a preliminary condition without which all further attempts at improvement and emancipation must prove abortive... the Congress proposes eight hours as the legal limit of the working-day.”
    hash: sha256:0f6ec430a28bad9ca1b8aec1d64ffe9a368f627e6c1996349fbe3e6436b1a9c5
    state: active
  - id: p00223
    type: paragraph
    text: Thus the movement of the working-class on both sides of the Atlantic, that had grown instinctively out of the conditions of production themselves, endorsed the words of the English Factory Inspector, R. J. Saunders
    hash: sha256:056a0cde6f766a67d0486196b6f22ec6820c808ba239b4d4b00d99b0e6be3d7f
    state: active
  - id: p00224
    type: blockquote
    text: “Further steps towards a reformation of society can never be carried out with any hope of success, unless the hours of labour be limited, and the prescribed limit strictly enforced.” <fn ref="162"/>
    hash: sha256:ce61335b88d5a82e4fe803e93abd329746b7bb55fcebb9ef34b9c5187850303e
    state: active
  - id: p00225
    type: paragraph
    text: It must be acknowledged that our labourer comes out of the process of production other than he entered. In the market he stood as owner of the commodity “labour-power” face to face with other owners of commodities, dealer against dealer. The contract by which he sold to the capitalist his labour-power proved, so to say, in black and white that he disposed of himself freely. The bargain concluded, it is discovered that he was no “free agent,” that the time for which he is free to sell his labour-power is the time for which he is forced to sell it, <fn ref="163"/> that in fact the vampire will not lose its hold on him “so long as there is a muscle, a nerve, a drop of blood to be exploited.” <fn ref="164"/> For “protection” against “the serpent of their agonies,” the labourers must put their heads together, and, as a class, compel the passing of a law, an all-powerful social barrier that shall prevent the very workers from selling, by voluntary contract with capital, themselves and their families into slavery and death. <fn ref="165"/> In place of the pompous catalogue of the “inalienable rights of man” comes the modest Magna Charta of a legally limited working-day, which shall make clear “when the time which the worker sells is ended, and when his own begins.” Quantum mutatus ab illo! [What a great change from that time! – Virgil] <fn ref="166"/>
    hash: sha256:f27b701ff76477eb41b11ec61719979b58fbfa484429507ea190877dbbff774e
    state: active
  - id: p00226
    type: footnote
    label: "1"
    text: “A day’s labour is vague, it may be long or short.” (“An Essay on Trade and Commerce, Containing Observations on Taxes, &amp;c.” London. 1770, p. 73.)
    hash: sha256:0798ee28ecc5d1203339d8f7d1dc11cd01201a9a73024589e403dcf63b104682
    state: active
  - id: p00227
    type: footnote
    label: "2"
    text: "This question is far more important than the celebrated question of Sir Robert Peel to the Birmingham Chamber of Commerce: What is a pound? A question that could only have been proposed, because Peel was as much in the dark as to the nature of money as the “little shilling men” of Birmingham."
    hash: sha256:687eb9615a5a859ee2e6b39ea6f28d3e2a14dc41a8d42c7cb25d3a84bcda267e
    state: active
  - id: p00228
    type: footnote
    label: "3"
    text: “It is the aim of the capitalist to obtain with his expended capital the greatest possible quantity of labour (d’obtenir du capital dépense la plus forte somme de travail possible).” J. G. Courcelle-Seneuil. “Traité théorique et pratique des entreprises industrielles.” 2nd ed. Paris, 1857, p. 63.
    hash: sha256:d8b00f8bd8a23964f0a61d34ad14cea1e9b4f51d07de3b80f3ef17377a3f6d6e
    state: active
  - id: p00229
    type: footnote
    label: "4"
    text: "“An hour’s labour lost in a day is a prodigious injury to a commercial State.... There is a very great consumption of luxuries among the labouring poor of this kingdom: particularly among the manufacturing populace, by which they also consume their time, the most fatal of consumptions.” “An Essay on Trade and Commerce, &amp;c.,” p. 47, and 15 3."
    hash: sha256:cd5cf9ec212b8a45b9f67f708e90a9cdbd2b9e57aaf09ecb77ed45886f3d03a4
    state: active
  - id: p00230
    type: footnote
    label: "5"
    text: “Si le manouvrier libre prend un instant de repos, l’économie sordide qui le suit des yeux avec inquiétude, prétend qu’il la vole.” [If the free labourer allows himself an instant of rest, the base and petty management, which follows him with wary eyes, claims he is stealing from it.] N. Linguet, “Théorie des Lois Civiles. &amp;c.” London, 1767, t. II., p. 466.
    hash: sha256:7d742e0693dd123b4ae0012255b38439b03617b710818a12ee62bf5ef5a3c7ec
    state: active
  - id: p00231
    type: footnote
    label: "6"
    text: During the great strike of the London builders, 1860-61, for the reduction of the working-day to 9 hours, their Committee published a manifesto that contained, to some extent, the plea of our worker. The manifesto alludes, not without irony, to the fact, that the greatest profit-monger amongst the building masters, a certain Sir M. Peto, was in the odour of sanctity (This same Peto, after 1867, came to an end a la Strousberg.)
    hash: sha256:5703de5107674c71e30fdafd00161db3915863d4f3f7e18346c9af6752dbc504
    state: active
  - id: p00232
    type: footnote
    label: "7"
    text: “Those who labour ... in reality feed both the pensioners ... [called the rich] and themselves.” (Edmund Burke, l.c., p. 2.)
    hash: sha256:646eaba32e1ec3373ca2038675af784e06dfeef207f486cfbf11fd751a0bd189
    state: active
  - id: p00233
    type: footnote
    label: "8"
    text: "Niebuhr in his “Roman History” says very naively: “It is evident that works like the Etruscan, which in their ruins astound us, pre-suppose in little (!) states lords and vassals.” Sismondi says far more to the purpose that “Brussels lace” pre-supposes wage-lords and wage-slaves."
    hash: sha256:51f800e26fb550750aca368da1a674ac1549dd9d6843853deb26f57288f1ef3d
    state: active
  - id: p00234
    type: footnote
    label: "9"
    text: “One cannot see these unfortunates (in the gold mines between Egypt, Ethiopia, and Arabia) who cannot even have their bodies clean, or their nakedness clothed, without pitying their miserable lot. There is no indulgence, no forbearance for the sick, the feeble, the aged, for woman’s weakness. All must, forced by blows, work on until death puts an end to their sufferings and their distress.” (“Diod. Sic. Bibl. Hist.,” lib. 2, c. 13.)
    hash: sha256:d4412b517a371ca75fbf6eb3449aabc638ac95b09eb04bac7336dc25edbf7177
