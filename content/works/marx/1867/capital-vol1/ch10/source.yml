    text: See “Public Health. Sixth Report of the Medical Officer of the Privy Council, 1863.” Published in London 1864. This report deals especially with the agricultural labourers. “Sutherland ... is commonly represented as a highly improved county ... but ... recent inquiry has discovered that even there, in districts once famous for fine men and gallant soldiers, the inhabitants have degenerated into a meagre and stunted race. In the healthiest situations, on hill sides fronting the sea, the faces of their famished children are as pale as they could be in the foul atmosphere of a London alley.” (W. Th. Thornton. “Overpopulation and its Remedy.” l.c., pp. 74, 75.) They resemble in fact the 30,000 “gallant Highlanders” whom Glasgow pigs together in its wynds and closes, with prostitutes and thieves.
