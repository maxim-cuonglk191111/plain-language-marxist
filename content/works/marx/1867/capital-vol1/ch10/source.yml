    text: "l.c.,p. 27. On the whole the working population, subject to the Factory Act, has greatly improved physically. All medical testimony agrees on this point, and personal observation at different times has convinced me of it. Nevertheless, and exclusive of the terrible death-rate of children in the first years of their life, the official reports of Dr. Greenhow show the unfavourable health condition of the manufacturing districts as compared with “agricultural districts of normal health.” As evidence, take the following table from his 1861 report: —"
