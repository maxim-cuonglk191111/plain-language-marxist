  - id: p00380
    type: footnote
    label: "154"
    text: “The Acts of last Session (1864) ... embrace a diversity of occupations, the customs in which differ greatly, and the use of mechanical power to give motion to machinery is no longer one of the elements necessary, as formerly, to constitute, in legal phrase, a ‘Factory.’” (Reports, &amp;c., for 31st Octaber, 1864, p. 8.)
    hash: sha256:c41d8257098c481238b515d293bac15c1457afa716d3c280c7327efe64c87493
    state: active
  - id: p00381
    type: footnote
    label: "155"
    text: Belgium, the paradise of Continental Liberalism, shows no trace of this movement. Even in the coal and metal mines labourers of both sexes, and all ages, are consumed, in perfect “freedom” at any period and through any length of time. Of every 1,000 persons employed there, 733 are men, 88 women, 135 boys, and 44 girls under 16; in the blast furnaces, &amp;c., of every 1,000, 668 are men, 149 women, 98 boys, and 85 girls under 16. Add to this the low wages for the enormous exploitation of mature and immature labour-power. The average daily pay for a man is 2s. 8d., for a woman, 1s. 8d., for a boy, 1s. 2½d. As a result, Belgium had in 1863, as compared with 1850, nearly doubled both the amount and the value of its exports of coal, iron, &amp;c.
    hash: sha256:8cad0a2882ee9cfa046811939ef83425c28b539ef0b488d63bbe7ca0fa94936d
    state: active
  - id: p00382
    type: footnote
    label: "156"
    text: Robert Owen, soon after 1810, not only maintained the necessity of a limitation of the working-day in theory, but actually introduced the 10 hours’ day into his factory at New Lanark. This was laughed at as a communistic Utopia; so were his “Combination of children’s education with productive labour and the Co-operative Societies of workingmen, first called into being by him. To-day, the first Utopia is a Factory Act, the second figures as an official phrase in all Factory Acts, the third is already being used as a cloak for reactionary humbug.
    hash: sha256:f6e2d38a43791912c0f590c1df95f75ac186cd56462d88d0f67d21cd690581b4
    state: active
  - id: p00383
    type: footnote
    label: "157"
    text: "Ure: “French translation, Philosophie des Manufactures.” Paris, 1836, Vol. II, pp. 39, 40, 67, 77, &amp;c."
    hash: sha256:1e436219ad551086a85128719270181893254faae1adcbe1407cdffb28ebced8
    state: active
  - id: p00384
    type: footnote
    label: "158"
    text: "In the Compte Rendu of the International Statistical Congress at Paris, 1855, it is stated: “The French law, which limits the length of daily labour in factories and workshops to 12 hours, does not confine this work to definite fixed hours. For children’s labour only the work-time is prescribed as between 5 a.m. and 9 p.m. Therefore, some of the masters use the right which this fatal silence gives them to keep their works going, without intermission, day in, day out, possibly with the exception of Sunday. For this purpose they use two different sets of workers, of whom neither is in the workshop more than 12 hours at a time, but the work of the establishment lasts day and night. The law is satisfied, but is humanity?” Besides “the destructive influence or night-labour on the human organism,” stress is also laid upon “the fatal influence of the association of the two sexes by night in the same badly-lighted workshops.”"
    hash: sha256:0c09a047e9effec4d1804134251e58cdc520b021a61c6e2a179031a970337b93
    state: active
  - id: p00385
    type: footnote
    label: "159"
    text: "“For instance, there is within my district one occupier who, within the same curtilage, is at the same time a bleacher and dyer under the Bleaching and Dyeing Works Act, a printer under the Print Works Act, and a finisher under the Factory Act.” (Report of Mr. Baker, in Reports, lic., for October 31st, 1861, p. 20.) After enumerating the different provisions of these Acts, and the complications arising from them, Mr. Baker says: “It will hence appear that it must be very difficult to secure the execution of these three Acts of Parliament where the occupier chooses to evade the law.” But what is assured to the lawyers by this is law-suits."
    hash: sha256:3535f3647fb235a987644f92b243c688699b9d59cd2b8fa1bc49699b5302a494
    state: active
  - id: p00386
    type: footnote
    label: "160"
    text: "Thus the Factory Inspectors at last venture to say: “These objections (of capital to the legal limitation of the working-day) must succumb before the broad principle of the rights of labour.... There is a time when the master’s right in his workman’s labour ceases, and his time becomes his own, even if there were no exhaustion in the question.” (Reports, 8cc., for 31 st Oct., 1862, p. 54.)"
    hash: sha256:491fa1adfb9381d9b0211e7a2e1d0cfb77fe160831994a21004aaf1fd75acef2
    state: active
  - id: p00387
    type: footnote
    label: "161"
    text: “We, the workers of Dunkirk, declare that the length of time of labour required under the present system is too great, and that, far from leaving the worker time for rest and education, it plunges him into a condition of servitude but little better than slavery. That is why we decide that 8 hours are enough for a working-day, and ought to be legally recognised as enough; why we call to our help that powerful lever, the press; ... and why we shall consider all those that refuse us this help as enemies of the reform of labour and of the rights of the labourer.” (Resolution of the Working Men of Dunkirk, New York State, 1866.)
    hash: sha256:b07eca477ee16816ebfd9f6055f84339d8e91bd8a6490b0f61169b9f9b9fa91f
    state: active
  - id: p00388
    type: footnote
    label: "162"
    text: Reports, &amp;c., for Oct., 1848, p. 112.
    hash: sha256:ae5b80048447945d4b4dc4c2c913d7f34d2c82d679f48f31fb6c9d7a7286c6a0
    state: active
  - id: p00389
    type: footnote
    label: "163"
    text: “The proceedings (the manoeuvres of capital, e.g., from 1848-50) have afforded, moreover, incontrovertible proof of the fallacy of the assertion so often advanced, that operatives need no protection, but may be considered as free agents in the disposal of the only property which they possess — the labour of their hands and the sweat of their brows.” (Reports, &amp;c., for April 30th, 1850, p. 45.) “Free labour (if so it may be termed) even in a free country, requires the strong arm of the law to protect it.” (Reports, &amp;c., for October 31st, 1864, p. 34.) “To permit, which is tantamount to compelling ... to work 14 hours a day with or without meals,” &amp;c. (Repts., &amp;c., for April 30th, 1863, p. 40.)
    hash: sha256:a7141e769e5fc6e98e09a5d8a0f9fa61c70e3e94d6c0e0d6a8f460790b019600
    state: active
  - id: p00390
    type: footnote
    label: "164"
    text: Friedrich Engels, l.c., p. 5.
    hash: sha256:db863a58484169cab9afd1cbd37e054b9ea5011c7ecac6d99496721df9a36f8c
    state: active
  - id: p00391
    type: footnote
    label: "165"
    text: The 10 Hours’ Act has, in the branches of industry that come under it, “put an end to the premature decrepitude of the former long-hour workers.” (Reports, &amp;c., for 31st Oct., 1859, p. 47.) “Capital (in factories) can never be employed in keeping the machinery in motion beyond a limited time, without certain injury to the health and morals of the labourers employed; and they are not in a position to protect themselves.” l.c., p. 8)
    hash: sha256:2558595fca926d2680a4553ef30eed57d99752dc34e06e13bcfeedf191241d7f
    state: active
  - id: p00392
    type: footnote
    label: "166"
    text: “A still greater boon is the distinction at last made clear between the worker’s own time and his master’s. The worker knows now when that which he sells is ended, and when his own begins; and by possessing a sure foreknowledge of this, is enabled to prearrange his own minutes for his own purposes.” (l.c., p. 52.) “By making them masters of their own time (the Factory Acts) have given them a moral energy which is directing them to the eventual possession of political power” (l.c., p. 47). With suppressed irony, and in very well weighed words, the Factory Inspectors hint that the actual law also frees the capitalist from some of the brutality natural to a man who is a mere embodiment of capital, and that it has given him time for a little “culture.” “Formerly the master had no time for anything but money; the servant had no time for anything but labour” (l.c., p. 48).<br/><br/>Transcribed by Zodiac<br/>Html Markup by Stephen Baird (1999)
