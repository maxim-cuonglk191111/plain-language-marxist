    label: "43"
    text: Soot is a well-known and very energetic form of carbon, and forms a manure that capitalistic chimney-sweeps sell to English farmers. Now in 1862 the British juryman had in a law-suit to decide whether soot, with which, unknown to the buyer, 90% of dust and sand are mixed, is genuine soot in the commercial sense or adulterated soot in the legal sense. The “amis du commerce” [friends of commerce] decided it to be genuine commercial soot, and non-suited the plaintiff farmer, who had in addition to pay the costs of the suit.
