  - id: p00313
    type: footnote
    label: "88"
    text: "“A Discourse on the necessity of encouraging Mechanick Industry,” London, 1690, p. 13. Macaulay, who has falsified English history in the interests of the Whigs and the bourgeoisie, declares as follows: “The practice of setting children prematurely to work ... prevailed in the 17th century to an extent which, when compared with the extent of the manufacturing system, seems almost incredible. At Norwich, the chief seat of the clothing trade, a little creature of six years old was thought fit for labour. Several writers of that time, and among them some who were considered as eminently benevolent, mention with exultation the fact that in that single city, boys and girls of very tender age create wealth exceeding what was necessary for their own subsistence by twelve thousand pounds a year. The more carefully we examine the history of the past, the more reason shall we find to dissent from those who imagine that our age has been fruitful of new social evils.... That which is new is the intelligence and the humanity which remedies them.” (“History of England,” vol. 1., p. 417.) Macaulay might have reported further that “extremely well-disposed” <i>amis du commerce</i> in the 17th century, narrate with “exultation” how in a poorhouse in Holland a child of four was employed, and that this example of “<i>vertu mise en pratique</i>” [applied virtue] passes muster in all the humanitarian works, <i>à la</i> Macaulay, to the time of Adam Smith. It is true that with the substitution of manufacture for handicrafts, traces of the exploitation of children begin to appear. This exploitation existed always to a certain extent among peasants, and was the more developed, the heavier the yoke pressing on the husbandman. The tendency of capital is there unmistakably; but the facts themselves are still as isolated as the phenomena of two-headed children. Hence they were noted “with exultation” as especially worthy of remark and as wonders by the far-seeing “<i>amis du commerce</i>,” and recommended as models for their own time and for posterity. This same Scotch sycophant and fine talker, Macaulay, says: “We hear to-day only of retrogression and see only progress.” What eyes, and especially what ears!"
    hash: sha256:28c82389bbd17a21969b0045365ebf3e6245701df3b518d6f862fe6cc510b616
    state: active
  - id: p00314
    type: footnote
    label: "89"
    text: "Among the accusers of the workpeople, the most angry is the anonymous author quoted in the text of “An Essay on Trade and Commerce, containing Observations on Taxes, &amp;c.,” London, 1770. He had already dealt with this subject in his earlier work: “Considerations on Taxes.” London, 1765. On the same side follows Polonius Arthur Young, the unutterable statistical prattler. Among the defenders of the working-classes the foremost are: Jacob Vanderlint, in: “Money Answers all Things.” London, 1734 the Rev. Nathaniel Forster, D. D., in “An Enquiry into the Causes of the Present High Price of Provisions,” London, 1767; Dr. Price, and especially Postlethwayt, as well in the supplement to his “Universal Dictionary of Trade and Commerce,” as in his “Great Bntain’s Commercial Interest explained and improved.” 2nd Edition, 1755. The facts themselves are confirmed by many other writers of the time, among others by Josiah Tucker."
    hash: sha256:a835f0391e69207f7445827a322b7b2051e553c8d29d5057d01498c70feb7222
    state: active
