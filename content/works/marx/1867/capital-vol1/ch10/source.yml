    label: "146"
    text: Thus, <i>e.g</i>., E. Potter in a letter to the <i>Times</i> of March 24th, 1863. The <i>Times</i> reminded him of the manufacturers’ revolt against the Ten Hours’ Bill.
    hash: sha256:f81f5fd33e7192f6d97c3899b7405800338ed4120b2c714e50bb66e16bc6ef61
    state: active
  - id: p00373
    type: footnote
    label: "147"
    text: Thus, among others, Mr. W. Newmarch, collaborator and editor of Tooke’s “History of Prices.” Is it a scientific advance to make cowardly concessions to public opinion?
    hash: sha256:8bdece3c589e005e23822cc1e0571f7e2440ee67424f04bded418cc5624df319
    state: active
  - id: p00374
    type: footnote
    label: "148"
    text: The Act passed in 1860, determined that, in regard to dye and bleachworks, the working-day should be fixed on August 1st, 1861, provisionally at 12 hours, and definitely on August 1st, 1862, at 10 hours, <i>i.e</i>., at 10½ hours for ordinary days, and 7½ for Saturday. Now, when the fatal year, 1862, came, the old farce was repeated. Besides, the manufacturers petitioned Parliament to allow the employment of young persons and women for 12 hours during one year longer. “In the existing condition of the trade (the time of the cotton famine), it was greatly to the advantage of the operatives to work 12 hours per day, and make wages when they could.” A bill to this effect had been brought in, “and it was mainly due to the action of the operative bleachers in Scotland that the bill was abandoned.” (Reports, &amp;c., for 31st October, 1862, pp. 14-15.) Thus defeated by the very workpeople, in whose name it pretended to speak, Capital discovered, with the help of lawyer spectacles, that the Act of 1860, drawn up, like all the Acts of Parliament for the “protection of labour,” in equivocal phrases, gave them a pretext to exclude from its working the calenderers and finishers. English jurisprudence, ever the faithful servant of capital, sanctioned in the Court of Common Pleas this piece of pettifogging. “The operatives have been greatly disappointed ... they have complained of over-work, and it is greatly to be regretted that the clear intention of the legislature should have failed by reason of a faulty definition.” (l.c., p. 18.)
    hash: sha256:721dc861c04dd743443f3b74ad6f20f1577e08bc24e4f997bd78c971678e0322
    state: active
  - id: p00375
    type: footnote
    label: "149"
    text: "The “open-air bleachers” had evaded the law of 1860, by means of the lie that no women worked at it in the night. The lie was exposed by the Factory Inspectors, and at the same time Parliament was, by petitions from the operatives, bereft of its notions as to the cool meadow-fragrance, in which bleaching in the open-air was reported to take place. In this aerial bleaching, drying-rooms were used at temperatures of from 90° to 100° Fahrenheit, in which the work was done for the most part by girls. “Cooling” is the technical expression for their occasional escape from the drying-rooms into the fresh air. “Fifteen girls in stoves. Heat from 80° to 90° for linens, and 100° and upwards for cambrics. Twelve girls ironing and doing-up in a small room about 10 feet square, in the centre of which is a close stove. The girls stand round the stove, which throws out a terrific heat, and dries the cambrics rapidly for the ironers. The hours of work for these hands are unlimited. If busy, they work till 9 or 12 at night for successive nights.” (Reports, &amp;c., for 31st October, 1862, p. 56.) A medical man states: “No special hours are allowed for cooling, but if the temperature gets too high, or the workers’ hands get soiled from perspiration, they are allowed to go out for a few minutes.... My experience, which is considerable, in treating the diseases of stove workers, compels me to express the opinion that their sanitary condition is by no means so high as that of the operatives in a spinning factory (and Capital, in its memorials to Parliament, had painted them as floridly healthy after the manner of Rubens.) The diseases most observable amongst them are phthisis, bronchitis, irregularity of uterine functions, hysteria in its most aggravated forms, and rheumatism. All of these, I believe, are either directly or indirectly induced by the impure, overheated air of the apartments in which the hands are employed and the want of sufficient comfortable clothing to protect them from the cold, damp atmosphere, in winter, when going to their homes.” (l.c., pp. 56-57.) The Factory Inspectors remarked on the supplementary law of 1860, torn from these open-air bleachers: “The Act has not only failed to afford that protection to the workers which it appears to offer, but contains a clause ... apparently so worded that, unless persons are detected working after 8 o’clock at night they appear to come under no protective provisions at all, and if they do so work the mode of proof is so doubtful that a conviction can scarcely follow.” (l.c., p. 52.) “To all intents and purposes, therefore, as an Act for any benevolent or educational purpose, it is a failure; since it can scarcely be called benevolent to permit, which is tantamount to compelling, women and children to work 14 hours a day with or without meals, as the case may be, and perhaps for longer hours than these, without limit as to age, without reference to sex, and without regard to the social habits of the families of the neighbourhood, in which such works (bleaching and dyeing) are situated.” (Reports, &amp;c., for 30th April, 1863, p. 40.)"
    hash: sha256:7f365a3ffa3b0d98bf0b513226889c97eda00f306a9e64018092046dc6d4c76c
    state: active
  - id: p00376
