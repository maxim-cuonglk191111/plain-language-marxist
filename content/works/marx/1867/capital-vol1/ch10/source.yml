  - id: p00321
    type: footnote
    label: "96"
    text: “They especially objected to work beyond the 12 hours per day, because the law which fixed those hours, is the only good which remains to them of the legislation of the Republic.” (“Rep. of Insp. of Fact.”, 31 st October, 1856, p. 80.) The French Twelve Hours’ Bill of September 5th, 1850, a bourgeois edition of the decree of the Provisional Government of March 2nd, 1848, holds in all workshops without exceptions. Before this law the working-day in France was without definite limit. It lasted in the factories 14, 15, or more hours. See “Des classes ouvrières en France, pendant l’année 1848. Par M. Blanqui.” M. Blanqui the economist, not the Revolutionist, had been entrusted by the Government with an inquiry into the condition of the working-class.
    hash: sha256:21ac3c463458129cff32f0cac738a187bf2ad4784d481a5b7af5378f20322c68
    state: active
  - id: p00322
    type: footnote
    label: "97"
    text: "Belgium is the model bourgeois state in regard to the regulation of the working-day. Lord Howard of Welden, English Plenipotentiary at Brussels, reports to the Foreign Office May 12th, 1862: “M. Rogier, the minister, informed me that children’s labour is limited neither by a general law nor by any local regulations; that the Government, during the last three years, intended in every session to propose a bill on the subject, but always found an insuperable obstacle in the jealous opposition to any legislation in contradiction with the principle of perfect freedom of labour.”"
    hash: sha256:5c08d7fc06a9c5e3e61e529383fe463540eed6de15ebba4d89a89440e5ad3199
    state: active
  - id: p00323
    type: footnote
    label: "98"
    text: “It is certainly much to be regretted that any class of persons should toil 12 hours a day, which, including the time for their meals and for going to and returning from their work, amounts, in fact, to 14 of the 24 hours.... Without entering into the question of health, no one will hesitate, I think, to admit that, <i>in a moral point of view</i>, so entire an absorption of the time of the working-classes, without intermission, from the early age of 13, and in trades not subject to restriction, much younger, must be extremely prejudicial, and is an evil greatly to be deplored.... For the sake, therefore, of public morals, of bringing up an orderly population, and of giving the great body of the people a reasonable enjoyment of life, it is much to be desired that in all trades some portion of every working-day should be reserved for rest and leisure.” (Leonard Horner in “Reports of Insp. of Fact. for 31st Dec., 1841.”)
    hash: sha256:1f4e52b211332f61a97078b2d3e893bb802eeca87027913183f4fb666a54b903
    state: active
  - id: p00324
    type: footnote
    label: "99"
    text: See “Judgment of Mr. J. H. Otway, Belfast. Hilary Sessions, County Antrim, 1860.”
    hash: sha256:2ee9dc083aba01ff726eebcc043d34e8327369b7af599458111e04ec637b684d
    state: active
  - id: p00325
    type: footnote
    label: "100"
    text: It is very characteristic of the regime of Louis Philippe, the bourgeois king, that the one Factory Act passed during his reign, that of March 22nd, 1841, was never put in force. And this law only dealt with child-labour. It fixed 8 hours a day for children between 8 and 12, 12 hours for children between 12 and 16, &amp;c., with many exceptions which allow night-work even for children 8 years old. The supervision and enforcement of this law are, in a country where every mouse is under police administration, left to the good-will of the <i>amis du commerce</i>. Only since 1853, in one single department — the Departement du Nord — has a paid government inspector been appointed. Not less characteristic of the development of French society, generally, is the fact, that Louis Philippe’s law stood solitary among the all-embracing mass of French laws, till the Revolution of 1848.
