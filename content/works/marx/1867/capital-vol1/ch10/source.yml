    type: footnote
    label: "71"
    text: l.c., 85, p. xvii. To similar tender scruples of the glass manufacturers that regular meal-times for the children are impossible because as a consequence a certain quantity of heat, radiated by the furnaces, would be “a pure loss” or “wasted,” Commissioner White makes answer. His answer is unlike that of Ure, Senior, &amp;c., and their puny German plagiarists à la Roscher who are touched by the “abstinence,” “self-denial,” “saving,” of the capitalists in the expenditure of their gold, and by their Timur-Tamerlanish prodigality of human life! “A certain amount of heat beyond what is usual at present might also be going to waste, if meal-times were secured in these cases, but it seems likely not equal in money-value to the waste of animal power now going on in glass-houses throughout the kingdom from growing boys not having enough quiet time to eat their meals at ease, with a little rest afterwards for digestion.” (l.c., p. xiv.) And this in the year of progress 1865! Without considering the expenditure of strength in lifting and carrying, such a child, in the sheds where bottle and flint glass are made, walks during the performance of his work 15-20 miles in every 6 hours! And the work often lasts 14 or 15 hours! In many of these glass works, as in the Moscow spinning mills, the system of 6 hours’ relays is in force. “During the working part of the week six hours is the utmost unbroken period ever attained at any one time for rest, and out of this has to come the time spent in coming and going to and from work, washing, dressing, and meals, leaving a very short period indeed for rest, and none for fresh air and play, unless at the expense of the sleep necessary for young boys, especially at such hot and fatiguing work.... Even the short sleep is obviously liable to be broken by a boy having to wake himself if it is night, or by the noise, if it is day.” Mr. White gives cases where a boy worked 36 consecutive hours; others where boys of 12 drudged on until 2 in the morning, and then slept in the works till 5 a.m. (3 hours!) only to resume their work. “The amount of work,” say Tremenheere and Tufnell, who drafted the general report, “done by boys, youths, girls, and women, in the course of their daily or nightly spell of labour, is certainly extraordinary.” (l.c., xliii. and xliv.) Meanwhile, late by night, self-denying Mr. Glass-Capital, primed with port-wine, reels out of his club homeward droning out idiotically. “Britons never, never shall be slaves!”
    hash: sha256:9d72024f5257caa70ca047df6cb415c4b49e7673a7405f55236e1071bb56d2e8
    state: active
  - id: p00297
    type: footnote
    label: "72"
    text: In England even now occasionally in rural districts a labourer is condemned to imprisonment for desecrating the Sabbath, by working in his front garden. The same labourer is punished for breach of contract if he remains away from his metal, paper, or glass works on the Sunday, even if it be from a religious whim. The orthodox Parliament will hear nothing of Sabbath-breaking if it occurs in the process of expanding capital. A memorial (August 1863), in which the London day-labourers in fish and poultry shops asked for the abolition of Sunday labour, states that their work lasts for the first 6 days of the week on an average 15 hours a-day, and on Sunday 8-10 hours. From this same memorial we learn also that the delicate gourmands among the aristocratic hypocrites of Exeter Hall, especially encourage this “Sunday labour.” These “holy ones,” so zealous <i>in cute curanda</i> [in attending to their bodily pleasures], show their Christianity by the humility with which they bear the overwork, the privations, and the hunger of others. <i>Obsequium ventris istis (the labourers) perniciosius est</i> [Gluttony is more ruinous to their stomachs – paraphrase of Horace].
