    type: footnote
    label: "84"
    text: “No child under 12 years of age shall be employed in any manufacturing establishment more than 10 hours in one day.” General Statutes of Massachusetts, 63, ch. 12. (The various Statutes were passed between 1836 and 1858.) “Labour performed during a period of 10 hours on any day in all cotton, woollen, silk, paper, glass, and flax factories, or in manufactories of iron and brass, shall be considered a legal day’s labour. And be it enacted, that hereafter no minor engaged in any factory shall be holden or required to work more than 10 hours in any day,or 60 hours in any week; and that hereafter no minor shall be admitted as a worker under the age of 10 years in any factory within this State.” State of New Jersey. An Act to limit the hours of labour, &amp;c., § 1 and 2. (Law of 18th March, 1851.) “No minor who has attained the age of 12 years, and is under the age of 15 years, shall be employed in any manufacturing establishment more than 11 hours in any one day, nor before 5 o’clock in the morning, nor after 7.30 in the evening.” (“Revised Statutes of the State of Rhode Island,” &amp;c., ch. 139, § 23, 1st July, 1857.)
