    text: "Reports, &amp;c., October 31st, 1860, p. 23. With what fanaticism, according to the evidence of manufacturers given in courts of law, their hands set themselves against every interruption in factory labour, the following curious circumstance shows. In the beginning of June, 1836, information reached the magistrates of Dewsbury (Yorkshire) that the owners of 8 large mills in the neighbourhood of Batley had violated the Factory Acts. Some of these gentlemen were accused of having kept at work 5 boys between 12 and 15 years of age, from 6 a.m. on Friday to 4 p.m. on the following Saturday, not allowing them any respite except for meals and one hour for sleep at midnight. And these children had to do this ceaseless labour of 30 hours in the “shoddyhole,” as the hole is called, in which the woollen rags are pulled in pieces, and where a dense atmosphere of dust, shreds, &amp;c., forces even the adult workman to cover his mouth continually with handkerchiefs for the protection of his lungs! The accused gentlemen affirm in lieu of taking an oath — as quakers they were too scrupulously religious to take an oath — that they had, in their great compassion for the unhappy children, allowed them four hours for sleep, but the obstinate children absolutely would not go to bed. The quaker gentlemen were mulcted in £20. Dryden anticipated these gentry:"
