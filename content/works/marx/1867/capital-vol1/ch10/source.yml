  - id: p00238
    type: footnote
    label: "13"
    text: "“In general and within certain limits, exceeding the medium size of their kind, is evidence of the prosperity of organic beings. As to man, his bodily height lessens if his due growth is interfered with, either by physical or local conditions. In all European countries in which the conscription holds, since its introduction, the medium height of adult men, and generally their fitness for military service, has diminished. Before the revolution (1789), the minimum for the infantry in France was 165 centimetres; in 1818 (law of March 10th), 157; by the law of March 21, 1832, 156 cm.; on the average in France more than half are rejected on account of deficient height or bodily weakness. The military standard in Saxony was in 1780, 178 cm. It is now 155. In Prussia it is 157. According to the statement of Dr. Meyer in the Bavarian Gazette, May 9th, 1862, the result of an average of 9 years is, that in Prussia out of 1,000 conscripts 716 were unfit for military service, 317 because of deficiency in height, and 399 because of bodily defects.... Berlin in 1858 could not provide its contingent of recruits, it was 156 men short.” J. von Liebig: “Die Chemie in ihrer Anwendung auf Agrikultur und Physiologie. 1862,” 7th Ed., vol. 1, pp. 117, 118."
