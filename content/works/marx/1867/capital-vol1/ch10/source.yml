    text: This is not to be taken in the same sense as our surplus-labour time. These gentlemen consider 10½ hours of labour as the normal working-day, which includes of course the normal surplus-labour. After this begins “overtime” which is paid a little better. It will be seen later that the labour expended during the so-called normal day is paid below its value, so that the overtime is simply a capitalist trick in order to extort more surplus-labour, which it would still be, even if the labour-power expended during the normal working-day were properly paid.
