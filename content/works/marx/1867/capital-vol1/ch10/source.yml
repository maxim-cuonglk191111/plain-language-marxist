  - id: p00282
    type: footnote
    label: "57"
    text: "Dr. Letheby, Consulting Physician of the Board of Health, declared: “The minimum of air for each adult ought to be in a sleeping room 300, and in a dwelling room 500 cubic feet.” Dr. Richardson, Senior Physician to one of the London Hospitals: “With needlewomen of all kinds, including milliners, dressmakers, and ordinary seamstresses, there are three miseries — over-work, deficient air, and either deficient food or deficient digestion.... Needlework, in the main, ... is infinitely better adapted to women than to men. But the mischiefs of the trade, in the metropolis especially, are that it is monopolised by some twenty-six capitalists, who, under the advantages that spring from capital, can bring in capital to force economy out of labour. This power tells throughout the whole class. If a dressmaker can get a little circle of customers, such is the competition that, in her home, she must work to the death to hold together, and this same over-work she must of necessity inflict on any who may assist her. If she fail, or do not try independently, she must join an establishment, where her labour is not less, but where her money is safe. Placed thus, she becomes a mere slave, tossed about with the variations of society. Now at home, in one room, starving, or near to it, then engaged 15, 16, aye, even 18 hours out of the 24, in an air that is scarcely tolerable, and on food which, even if it be good, cannot be digested in the absence of pure air. On these victims, consumption, which is purely a disease of bad air, feeds.” Dr. Richardson: “Work and Over-work,” in “Social Science Review,” 18th July, 1863."
    hash: sha256:75e861f9c72aacb48b8da8d54d31cdaed59c8d9b675117fb9361aa302f14edb5
    state: active
  - id: p00283
    type: footnote
    label: "58"
    text: "<i>Morning Star</i>, 23rd June, 1863. — <i>The Times</i> made use of the circumstance to defend the American slave-owners against Bright, &amp;c. “Very many of us think,” says a leader of July 2nd, 1863, “that, while we work our own young women to death, using the scourge of starvation, instead of the crack of the whip, as the instrument of compulsion, we have scarcely a right to hound on fire and slaughter against families who were born slave-owners, and who, at least, feed their slaves well, and work them lightly.” In the same manner, the <i>Standard,</i> a Tory organ, fell foul of the Rev. Newman Hall: “He excommunicated the slave-owners, but prays with the fine folk who, without remorse, make the omnibus drivers and conductors of London, &amp;c., work 16 hours a-day for the wages of a dog.” Finally, spake the oracle, Thomas Carlyle, of whom I wrote, in 1850, “Zum Teufel ist der Genius, der Kultus ist geblieben.” [“In the cult of genius ... The cult remains,” paraphrasing Schiller] In a short parable, he reduces the one great event of contemporary history, the American Civil War, to this level, that the Peter of the North wants to break the head of the Paul of the South with all his might, because the Peter of the North hires his labour by the day, and the Paul of the South hires his by the life. (<i>Macmillan’s Magazine.</i> Ilias Americana in nuce. August, 1863.) Thus, the bubble of Tory sympathy for the urban workers — by no means for the rural — has burst at last. The sum of all is — slavery!"
    hash: sha256:4364cf98f5263a9b6f0489da6b664a16540cb6b1c6a6e3a48999b3b34d71c486
