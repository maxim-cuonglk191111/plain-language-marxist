    text: The nature of capital remains the same in its developed as in its undeveloped form. In the code which the influence of the slave-owners, shortly before the outbreak of the American Civil War, imposed on the territory of New Mexico, it is said that the labourer, in as much as the capitalist has bought his labour-power, “is his (the capitalist’s) money.” The same view was current among the Roman patricians. The money they had advanced to the plebeian debtor had been transformed via the means of subsistence into the flesh and blood of the debtor. This “flesh and blood” were, therefore, “their money.” Hence, the Shylock-law of the Ten Tables. Linguet’s hypothesis that the patrician creditors from time to time prepared, beyond the Tiber, banquets of debtors’ flesh, may remain as undecided as that of Daumer on the Christian Eucharist.
