  - id: p00303
    type: footnote
    label: "78"
    text: "l.c. Mr. Villiers, despite the best of intentions on his part, was “legally” obliged to refuse the requests of the manufacturers. These gentlemen, however, attained their end through the obliging nature of the local poor law boards. Mr. A. Redgrave, Inspector of Factories, asserts that this time the system under which orphans and pauper children were treated “legally” as apprentices “was not accompanied with the old abuses” (on these “abuses” see Engels, l.c.), although in one case there certainly was “abuse of this system in respect to a number of girls and young women brought from the agricultural districts of Scotland into Lancashire and Cheshire.” Under this system the manufacturer entered into a contract with the workhouse authorities for a certain period. He fed, clothed and lodged the children, and gave them a small allowance of money. A remark of Mr. Redgrave to be quoted directly seems strange, especially if we consider that even among the years of prosperity of the English cotton trade, the year 1860 stands unparalleled, and that, besides, wages were exceptionally high. For this extraordinary demand for work had to contend with the depopulation of Ireland, with unexampled emigration from the English and Scotch agricultural districts to Australia and America, with an actual diminution of the population in some of the English agricultural districts, in consequence partly of an actual breakdown of the vital force of the labourers, partly of the already effected dispersion of the disposable population through the dealers in human flesh. Despite all this Mr. Redgrave says: “This kind of labour, however, would only be sought after when none other could be procured, for it is a high-priced labour. The ordinary wages of a boy of 13 would be about 4s. per week, but to lodge, to clothe, to feed, and to provide medical attendance and proper superintendence for 50 or 100 of these boys, and to set aside some remuneration for them, could not be accomplished for 4s. a-head per week.” (Report of the Inspector of Factories for 30th April, 1860, p. 27.) Mr. Redgrave forgets to tell us how the labourer himself can do all this for his children out of their 4s. a-week wages, when the manufacturer cannot do it for the 50 or 100 children lodged, boarded, superintended all together. To guard against false conclusions from the text, I ought here to remark that the English cotton industry, since it was placed under the Factory Act of 1850 with its regulations of labour-time, &amp;c., must be regarded as the model industry of England. The English cotton operative is in every respect better off than his Continental companion in misery. “The Prussian factory operative labours at least ten hours per week more than his English competitor, and if employed at his own loom in his own house, his labour is not restricted to even those additional hours. (“Rep. of Insp. of Fact.,” 31st October, 1855, p. 103.) Redgrave, the Factory Inspector mentioned above, after the Industrial Exhibition in 1851, travelled on the Continent, especially in France and Germany, for the purpose of inquiring into the conditions of the factories. Of the Prussian operative he says: “He receives a remuneration sufficient to procure the simple fare, and to supply the slender comforts to which he has been accustomed ... he lives upon his coarse fare, and works hard, wherein his position is subordinate to that of the English operative.” (“Rep. of Insp. of Fact.” 31st Oct., 1855, p. 85.)"
