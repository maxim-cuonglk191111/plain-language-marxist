  - id: p00311
    type: footnote
    label: "86"
    text: "In reference to this statute, J. Wade with truth remarks: “From the statement above (i.e., with regard to the statute) it appears that in 1496 the diet was considered equivalent to one-third of the income of an artificer and one-half the income of a labourer, which indicates a greater degree of independence among the working-classes than prevails at present; for the board, both of labourers and artificers, would now be reckoned at a much higher proportion of their wages.” (J. Wade, “History of the Middle and Working Classes,” pp. 24, 25, and 577.) The opinion that this difference is due to the difference in the price-relations between food and clothing then and now is refuted by the most cursory glance at “Chronicon Preciosum, &amp;c.” By Bishop Fleetwood. 1st Ed., London, 1707; 2nd Ed., London, 1745."
