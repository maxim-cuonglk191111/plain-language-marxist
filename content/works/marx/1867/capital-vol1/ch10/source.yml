    type: footnote
    label: "81"
    text: “But though the health of a population is so important a fact of the national capital, we are afraid it must be said that the class of employers of labour have not been the most forward to guard and cherish this treasure.... The consideration of the health of the operatives was forced upon the mill-owners.” (<i>Times</i>, November 5th, 1861.) “The men of the West Riding became the clothiers of mankind ... the health of the workpeople was sacrificed, and the lace in a few generations must have degenerated. But a reaction set in. Lord Shaftesbury’s Bill limited the hours of children’s labour,” &amp;c. (“Report of the Registrar-General,” for October 1861.)
    hash: sha256:f9850ee565b844833b60124dcfff3035e8267c2dd6ac8dc28799013101d60fec
    state: active
  - id: p00307
    type: footnote
    label: "82"
    text: We, therefore, find, e.g., that in the beginning of 1863, 26 firms owning extensive potteries in Staffordshire, amongst others, Josiah Wedgwood, &amp; Sons, petition in a memorial for “some legislative enactment.” Competition with other capitalists permits them no voluntary limitation of working-time for children, &amp;c. “Much as we deplore the evils before mentioned, it would not be possible to prevent them by any scheme of agreement between the manufacturers. ... Taking all these points into consideration, we have come to the conviction that some legislative enactment is wanted.” (“Children’s Employment Comm.” Rep. I, 1863, p. 322.) Most recently a much more striking example offers. The rise in the price of cotton during a period of feverish activity, had induced the manufacturers in Blackburn to shorten, by mutual consent, the working-time in their mills during a certain fixed period. This period terminated about the end of November, 1871. Meanwhile, the wealthier manufacturers, who combined spinning with weaving, used the diminution of production resulting from this agreement, to extend their own business and thus to make great profits at the expense of the small employers. The latter thereupon turned in their extremity to the operatives, urged them earnestly to agitate for the 9 hours’ system, and promised contributions in money to this end.
