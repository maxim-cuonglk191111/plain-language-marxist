    label: "44"
    text: The French chemist, Chevallier, in his treatise on the “sophistications” of commodities, enumerates for many of the 600 or more articles which he passes in review, 10, 20, 30 different methods of adulteration. He adds that he does not know all the methods and does not mention all that he knows. He gives 6 kinds of adulteration of sugar, 9 of olive oil, 10 of butter, 12 of salt, 19 of milk, 20 of bread, 23 of brandy, 24 of meal, 28 of chocolate, 30 of wine, 32 of coffee, etc. Even God Almighty does not escape this fate. See Rouard de Card, “On the Falsifications of the materials of the Sacrament.” (“De la falsification des substances sacramentelles,” Paris, 1856.)
