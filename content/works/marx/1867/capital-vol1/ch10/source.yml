  - id: p00240
    type: footnote
    label: "15"
    text: I only touch here and there on the period from the beginning of modern industry in England to 1845. For this period I refer the reader to “Die Lage der arbeitenden Klasse in England,” [Condition of the Working Class in England] von Friedrich Engels, Leipzig, 1845. How completely Engels understood the nature of the capitalist mode of production is shown by the Factory Reports, Reports on Mines, &amp;c., that have appeared since 1845, and how wonderfully he painted the circumstances in detail is seen on the most superficial comparison of his work with the official reports of the Children’s Employment Commission, published 18 to 20 years later (1863-1867). These deal especially with the branches of industry in which the Factory Acts had not, up to 1862, been introduced, in fact are not yet introduced. Here, then, little or no alteration had been enforced, by authority, in the conditions painted by Engels. I borrow my examples chiefly from the Free-trade period after 1848, that age of paradise, of which the commercial travellers for the great firm of Free-trade, blatant as ignorant, tell such fabulous tales. For the rest England figures here in the foreground because she is the classic representative of capitalist production, and she alone has a continuous set of official statistics of the things we are considering.
