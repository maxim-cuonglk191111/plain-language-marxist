  - id: p00286
    type: footnote
    label: "61"
    text: “Both in Staffordshire and in South Wales young girls and women are employed on the pit banks and on the coke heaps, not only by day but also by night. This practice has been often noticed in Reports presented to Parliament, as being attended with great and notorious evils. These females employed with the men, hardly distinguished from them in their dress, and begrimed with dirt and smoke, are exposed to the deterioration of character, arising from the loss of self-respect, which can hardly fail to follow from their unfeminine occupation.” (l. c., 194, p. xxvi. Cf. Fourth Report (1865), 61, p. xiii.) It is the same in glass-works.
    hash: sha256:b792ae64750a433bdf4045a9026452b1bbce70c0f4708a07b4b8ead21d415904
    state: active
  - id: p00287
    type: footnote
    label: "62"
    text: "A steel manufacturer who employs children in night-labour remarked: “It seems but natural that boys who work at night cannot sleep and get proper rest by day, but will be running about.” (l.c., Fourth Report, 63, p. xiii.) On the importance of sunlight for the maintenance and growth of the body, a physician writes: “Light also acts upon the tissues of the body directly in hardening them and supporting their elasticity. The muscles of animals, when they are deprived of a proper amount of light, become soft and inelastic, the nervous power loses its tone from defective stimulation, and the elaboration of all growth seems to be perverted.... In the case of children, constant access to plenty of light during the day, and to the direct rays of the sun for a part of it, is most essential to health. Light assists in the elaboration of good plastic blood, and hardens the fibre after it has been laid down. It also acts as a stimulus upon the organs of sight, and by this means brings about more activity in the various cerebral functions.” Dr. W. Strange, Senior Physician of the Worcester General Hospital, from whose work on “Health” (1864) this passage is taken, writes in a letter to Mr. White, one of the commissioners: “I have had opportunities formerly, when in Lancashire, of observing the effects of nightwork upon children, and I have no hesitation in saying, contrary to what some employers were fond of asserting, those children who were subjected to it soon suffered in their health.” (l.c., 284., p. 55.) That such a question should furnish the material of serious controversy, shows plainly how capitalist production acts on the brain-functions of capitalists and their retainers."
