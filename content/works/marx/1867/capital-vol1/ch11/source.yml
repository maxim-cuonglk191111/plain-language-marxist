    level: 3
    text: "Chapter Eleven: Rate and Mass of Surplus Value"
    hash: sha256:eae03456afa4e401579797eacd32b82af88e450aa82c6f3d287bf31f0207166e
    state: active
  - id: p00002
    type: paragraph
    text: In this chapter, as hitherto, the value of labour-power, and therefore the part of the working day necessary for the reproduction or maintenance of that labour-power, are supposed to be given, constant magnitudes.
    hash: sha256:1920b00ef012d9648ef13cbde785b1434518c82d4193aacdc70306ce6b273a76
    state: active
  - id: p00003
    type: paragraph
    text: This premised, with the rate, the mass is at the same time given of the surplus-value that the individual labourer furnishes to the capitalist in a definite period of time. If, <i>e.g.</i>, the necessary labour amounts to 6 hours daily, expressed in a quantum of gold = 3 shillings, then 3s. is the daily value of one labour-power or the value of the capital advanced in the buying of one labour-power. If, further, the rate of surplus-value be = 100%, this variable capital of 3s. produces a mass of surplus-value of 3s., or the labourer supplies daily a mass of surplus labour equal to 6 hours.
    hash: sha256:ec0282287cf8fe24a3deaa2790a8fa02964a4562293d5356277bf31dfcd42a3c
    state: active
  - id: p00004
    type: paragraph
    text: But the variable capital of a capitalist is the expression in money of the total value of all the labour-powers that he employs simultaneously. Its value is, therefore, equal to the average value of one labour-power, multiplied by the number of labour-powers employed. With a given value of labour-power, therefore, the magnitude of the variable capital varies directly as the number of labourers employed simultaneously. If the daily value of one labour-power = 3s., then a capital of 300s. must be advanced in order to exploit daily 100 labour-powers, of n times 3s., in order to exploit daily n labour-powers.
    hash: sha256:0b0048247c665589fa190367a8fcec4d0d16794eb0267599c193cfa3fda3c9c2
    state: active
  - id: p00005
    type: paragraph
    text: "In the same way, if a variable capital of 3s., being the daily value of one labour-power, produce a daily surplus-value of 3s., a variable capital of 300s. will produce a daily surplus-value of 300s., and one of n times 3s. a daily surplus-value of n × 3s. The mass of the surplus-value produced is therefore equal to the surplus-value which the working day of one labourer supplies multiplied by the number of labourers employed. But as further the mass of surplus-value which a single labourer produces, the value of labour-power being given, is determined by the rate of the surplus-value, this law follows: the mass of the surplus-value produced is equal to the amount of the variable capital advanced, multiplied by the rate of surplus-value, in other words: it is determined by the compound ratio between the number of labour-powers exploited simultaneously by the same capitalist and the degree of exploitation of each individual labour-power."
    hash: sha256:b3beb1da2dea8d299dbb11de25b03bb3e3113ea9b2561ef87a4a3532aad112a7
    state: active
  - id: p00006
    type: paragraph
    text: "Let the mass of the surplus-value be S, the surplus-value supplied by the individual labourer in the average day s the variable capital daily advanced in the purchase of one individual labour-power v, the sum total of the variable capital V, the value of an average labour-power P, its degree of exploitation (a'/a) (surplus-labour/necessary-labour) and the number of labourers employed n; we have:"
    hash: sha256:57ab2025626aa892e0a52e975a5c3b2c15ddc1afe88b911aea1a0246dce9cac9
    state: active
  - id: p00007
    type: table
    text: <tr><td>S =</td></tr>
    hash: sha256:a7db5d19488b05447a4101881ba139421c83c2a2016ee85563bcad98ed1f57f9
    state: active
  - id: p00008
    type: paragraph
    text: "{"
    hash: sha256:021fb596db81e6d02bf3d2586ee3981fe519f275c0ac9ca76bbcf2ebb4097d96
    state: active
  - id: p00009
    type: table
    text: <tr><td>(s/v) × V</td></tr><tr><td>P × (a'/a) × n</td></tr>
    hash: sha256:bfabe96ac83d50eaf074a440ac031445329180c4ec0431b2f9840142c4723b8e
    state: active
  - id: p00010
    type: paragraph
    text: It is always supposed, not only that the value of an average labour-power is constant, but that the labourers employed by a capitalist are reduced to average labourers. There are exceptional cases in which the surplus-value produced does not increase in proportion to the number of labourers exploited, but then the value of the labour-power does not remain constant.
    hash: sha256:41219f9aa7cc321656e8b650624b18c990482a9759e590e2b16844929a973b72
    state: active
  - id: p00011
    type: paragraph
    text: In the production of a definite mass of surplus-value, therefore the decrease of one factor may be compensated by the increase of the other. If the variable capital diminishes, and at the same time the rate of surplus-value increases in the same ratio, the mass of surplus-value produced remains unaltered. If on our earlier assumption the capitalist must advance 300s., in order to exploit 100 labourers a day, and if the rate of surplus-value amounts to 50%, this variable capital of 300s. yields a surplus-value of 150s. or of 100 × 3 workinghours. If the rate of surplus-value doubles, or the working day, instead of being extended from 6 to 9, is extended from 6 to 12 hours and at the same time variable capital is lessened by half, and reduced to 150s., it yields also a surplus-value of 150s. or 50 × 6 workinghours. Diminution of the variable capital may therefore be compensated by a proportionate rise in the degree of exploitation of labour-power, or the decrease in the number of the labourers employed by a proportionate extension of the working day. Within certain limits therefore the supply of labour exploitable by capital is independent of the supply of labourers. <fn ref="1"/> On the contrary, a fall in the rate of surplus-value leaves unaltered the mass of the surplus-value produced, if the amount of the variable capital, or number of the labourers employed, increases in the same proportion.
    hash: sha256:4faa8c37ed073d91cc3fea088be7fbbd279833f2271a2811e1011bb058c4d07a
    state: active
  - id: p00012
    type: paragraph
    text: Nevertheless, the compensation of a decrease in the number of labourers employed, or of the amount of variable capital advanced by a rise in the rate of surplus-value, or by the lengthening of the working-day, has impassable limits. Whatever the value of labour-power may be, whether the workingtime necessary for the maintenance of the labourer is 2 or 10 hours, the total value that a labourer can produce, day in, day out, is always less than the value in which 24 hours of labour are embodied, less than 12s., if 12s. is the money expression for 24 hours of realised labour. In our former assumption, according to which 6 workinghours are daily necessary in order to reproduce the labour-power itself or to replace the value of the capital advanced in its purchase, a variable capital of 1,500s., that employs 500 labourers at a rate of surplus-value of 100% with a 12 hours’ working day, produces daily a surplus-value of 1,500s. or of 6 × 500 workinghours. A capital of 300s. that employs 100 labourers a day with a rate of surplus-value of 200% or with a working day of 18 hours, produces only a mass of surplus-value of 600s. or 12 × 100 workinghours; and its total value-product, the equivalent of the variable capital advanced plus the surplus-value, can, day in, day out, never reach the sum of 1,200s. or 24 × 100 workinghours. The absolute limit of the average working day — this being by nature always less than 24 hours — sets an absolute limit to the compensation of a reduction of variable capital by a higher rate of surplus-value, or of the decrease of the number of labourers exploited by a higher degree of exploitation of labour-power. This palpable law is of importance for the clearing up of many phenomena, arising from a tendency (to be worked out later on) of capital to reduce as much as possible the number of labourers employed by it, or its variable constituent transformed into labour-power, in contradiction to its other tendency to produce the greatest possible mass of surplus-value. On the other hand, if the mass of labour-power employed, or the amount of variable capital, increases, but not in proportion to the fall in the rate of surplus-value, the mass of the surplus-value produced, falls.
    hash: sha256:855041b8f81792c2b3b53c3f51f37fcf78c8469164189eae72886adaaa92f3d4
    state: active
  - id: p00013
    type: paragraph
    text: "A third law results from the determination, of the mass of the surplus-value produced, by the two factors: rate of surplus-value and amount of variable capital advanced. The rate of surplus-value, or the degree of exploitation of labour-power, and the value of labour-power, or the amount of necessary workingtime being given, it is selfevident that the greater the variable capital, the greater would be the mass of the value produced and of the surplus-value. If the limit of the working-day is given, and also the limit of its necessary constituent, the mass of value and surplus-value that an individual capitalist produces, is clearly exclusively dependent on the mass of labour that he sets in motion. But this, under the conditions supposed above, depends on the mass of labour-power, or the number of labourers whom he exploits, and this number in its turn is determined by the amount of the variable capital advanced. With a given rate of surplus-value, and a given value of labour-power, therefore, the masses of surplus-value produced vary directly as the amounts of the variable capitals advanced. Now we know that the capitalist divides his capital into two parts. One part he lays out in means of production. This is the constant part of his capital. The other part he lays out in living labour-power. This part forms his variable capital. On the basis of the same mode of social production, the division of capital into constant and variable differs in different branches of production, and within the same branch of production, too, this relation changes with changes in the technical conditions and in the social combinations of the processes of production. But in whatever proportion a given capital breaks up into a constant and a variable part, whether the latter is to the former as 1:2 or 1:10 or 1:x, the law just laid down is not affected by this. For, according to our previous analysis, the value of the constant capital reappears in the value of the product, but does not enter into the newly produced value, the newly created value product. To employ 1,000 spinners, more raw material, spindles, &amp;c., are, of course, required, than to employ 100. The value of these additional means of production however may rise, fall, remain unaltered, be large or small; it has no influence on the process of creation of surplus-value by means of the labour-powers that put them in motion. The law demonstrated above now, therefore, takes this form: the masses of value and of surplus-value produced by different capitals — the value of labour-power being given and its degree of exploitation being equal — vary directly as the amounts of the variable constituents of these capitals, <i>i.e.</i>, as their constituents transformed into living labour-power."
    hash: sha256:c1a0895f99aa58bcb9282e9eafe331bde1533e7f05639c26207f20c457702218
    state: active
  - id: p00014
    type: paragraph
    text: This law clearly contradicts all experience based on appearance. Everyone knows that a cotton spinner, who, reckoning the percentage on the whole of his applied capital, employs much constant and little variable capital, does not, on account of this, pocket less profit or surplus-value than a baker, who relatively sets in motion much variable and little constant capital. For the solution of this apparent contradiction, many intermediate terms are as yet wanted, as from the standpoint of elementary algebra many intermediate terms are wanted to understand that 0/0 may represent an actual magnitude. Classical economy, although not formulating the law, holds instinctively to it, because it is a necessary consequence of the general law of value. It tries to rescue the law from collision with contradictory phenomena by a violent abstraction. It will be seen later<fn ref="2"/> how the school of Ricardo has come to grief over this stumbling block. Vulgar economy which, indeed, “has really learnt nothing,” here as everywhere sticks to appearances in opposition to the law which regulates and explains them. In opposition to Spinoza, it believes that “ignorance is a sufficient reason.”
    hash: sha256:2d03ba7363b22d44efbe9f655c08e58d7092d5e01906029be00454ebb7185efe
    state: active
  - id: p00015
    type: paragraph
    text: The labour which is set in motion by the total capital of a society, day in, day out, may be regarded as a single collective working day. If, <i>e.g.</i>, the number of labourers is a million, and the average working-day of a labourer is 10 hours, the social working day consists of ten million hours. With a given length of this working day, whether its limits are fixed physically or socially, the mass of surplus-value can only be increased by increasing the number of labourers, <i>i.e.</i>, of the labouring population. The growth of population here forms the mathematical limit to the production of surplus-value by the total social capital. On the contrary, with a given amount of population, this limit is formed by the possible lengthening of the working day.<fn ref="3"/> It will, however, be seen in the following chapter that this law only holds for the form of surplus-value dealt with up to the present.
    hash: sha256:a4806868f0b2de2532bbc6fb3ed6c7dddba7fc5f49101f7a5eca1c1cbbfc91d9
    state: active
  - id: p00016
    type: paragraph
    text: From the treatment of the production of surplus-value, so far, it follows that not every sum of money, or of value, is at pleasure transformable into capital. To effect this transformation, in fact, a certain minimum of money or of exchange-value must be presupposed in the hands of the individual possessor of money or commodities. The minimum of variable capital is the cost price of a single labour-power, employed the whole year through, day in, day out, for the production of surplus-value. If this labourer were in possession of his own means of production, and were satisfied to live as a labourer, he need not work beyond the time necessary for the reproduction of his means of subsistence, say 8 hours a day. He would, besides, only require the means of production sufficient for 8 working-hours. The capitalist, on the other hand, who makes him do, besides these 8 hours, say 4 hours’ surplus-labour, requires an additional sum of money for furnishing the additional means of production. On our supposition, however, he would have to employ two labourers in order to live, on the surplus-value appropriated daily, as well as, and no better than a labourer, i.e., to be able to satisfy his necessary wants. In this case the mere maintenance of life would be the end of his production, not the increase of wealth; but this latter is implied in capitalist production. That he may live only twice as well as an ordinary labourer, and besides turn half of the surplus-value produced into capital, he would have to raise, with the number of labourers, the minimum of the capital advanced 8 times. Of course he can, like his labourer, take to work himself, participate directly in the process of production, but he is then only a hybrid between capitalist and labourer, a “small master.” A certain stage of capitalist production necessitates that the capitalist be able to devote the whole of the time during which he functions as a capitalist, <i>i.e.</i>, as personified capital, to the appropriation and therefore control of the labour of others, and to the selling of the products of this labour.<fn ref="4"/> The guilds of the middle ages therefore tried to prevent by force the transformation of the master of a trade into a capitalist, by limiting the number of labourers that could be employed by one master within a very small maximum. The possessor of money or commodities actually turns into a capitalist in such cases only where the minimum sum advanced for production greatly exceeds the maximum of the middle ages. Here, as in natural science, is shown the correctness of the law discovered by Hegel (in his “Logic”), that merely quantitative differences beyond a certain point pass into qualitative changes.<fn ref="5"/>
    hash: sha256:f4c1246b3c2323423ebce18350f5208623f3c27cb206ec3814163c7573012719
    state: active
  - id: p00017
    type: paragraph
    text: The minimum of the sum of value that the individual possessor of money or commodities must command, in order to metamorphose himself into a capitalist, changes with the different stages of development of capitalist production, and is at given stages different in different spheres of production, according to their special and technical conditions. Certain spheres of production demand, even at the very outset of capitalist production, a minimum of capital that is not as yet found in the hands of single individuals. This gives rise partly to state subsidies to private persons, as in France in the time of Clobber, and as in many German states up to our own epoch, partly to the formation of societies with legal monopoly for the exploitation of certain branches of industry and commerce, the forerunners of our modern joint stock companies.<fn ref="6"/>
    hash: sha256:8b3fc44a139134e96d444220bafec26a04af31763af8cbb1c6f7b484a83c19bc
    state: active
  - id: p00018
    type: paragraph
    text: Within the process of production, as we have seen, capital acquired the command over labour, <i>i.e.</i>, over functioning labour-power or the labourer himself. Personified capital, the capitalist takes care that the labourer does his work regularly and with the proper degree of intensity.
    hash: sha256:fff9efe5a41ae89c4e977b8895aa187493b5d3ec3352c18200a8c49cc5384c87
    state: active
  - id: p00019
    type: paragraph
    text: Capital further developed into a coercive relation, which compels the working class to do more work than the narrow round of its own life-wants prescribes. As a producer of the activity of others, as a pumper-out of surplus labour and exploiter of labour-power, it surpasses in energy, disregard of bounds, recklessness and efficiency, all earlier systems of production based on directly compulsory labour.
    hash: sha256:e937e8e6c4d7e5541f4a9df1050bfb44982b665bfc8e81cec7846c15f242c165
    state: active
  - id: p00020
    type: paragraph
    text: At first, capital subordinates labour on the basis of the technical conditions in which it historically finds it. It does not, therefore, change immediately the mode of production. The production of surplus-value — in the form hitherto considered by us — by means of simple extension of the working day, proved, therefore, to be independent of any change in the mode of production itself. It was not less active in the old-fashioned bakeries than in the modern cotton factories.
    hash: sha256:fad09d6e72b3d706d24b8a57dc96d96378f3c99f90e1c9c2f920b2b5ddf4d086
    state: active
  - id: p00021
    type: paragraph
    text: 'If we consider the process of production from the point of view of the simple labour process, the labourer stands in relation to the means of production, not in their quality as capital, but as the mere means and material of his own intelligent productive activity. In tanning, <i>e.g.</i>, he deals with the skins as his simple object of labour. It is not the capitalist whose skin he tans. But it is different as soon as we deal with the process of production from the point of view of the process of creation of surplus-value. The means of production are at once changed into means for the absorption of the labour of others. It is now no longer the labourer that employs the means of production, but the means of production that employ the labourer. Instead of being consumed by him as material elements of his productive activity, they consume him as the ferment necessary to their own life-process, and the life-process of capital consists only in its movement as value constantly expanding, constantly multiplying itself. Furnaces and workshops that stand idle by night, and absorb no living labour, are “a mere loss” to the capitalist. Hence, furnaces and workshops constitute lawful claims upon the night-labour of the work-people. The simple transformation of money into the material factors of the process of production, into means of production, transforms the latter into a title and a right to the labour and surpluslabour of others. An example will show, in conclusion, how this sophistication, peculiar to and characteristic of capitalist production, this complete inversion of the relation between dead and living labour, between value and the force that creates value, mirrors itself in the consciousness of capitalists. During the revolt of the English factory lords between 1848 and 1850, “the head of one of the oldest and most respectable houses in the West of Scotland, Messrs. Carlile Sons &amp; Co., of the linen and cotton thread factory at Paisley, a company which has now existed for about a century, which was in operation in 1752, and four generations of the same family have conducted it” ... this “very intelligent gentleman” then wrote a letter<fn ref="7"/> in the <i>Glasgow Daily Mail</i> of April 25th, 1849, with the title, “The relay system,” in which among other things the following grotesquely naïve passage occurs: “Let us now ... see what evils will attend the limiting to 10 hours the working of the factory.... They amount to the most serious damage to the millowner’s prospects and property. If he (i.e., his “hands”) worked 12 hours before, and is limited to 10, then every 12 machines or spindles in his establishment shrink to 10, and should the works be disposed of, they will be valued only as 10, so that a sixth part would thus be deducted from the value of every factory in the country.”<fn ref="8"/>'
    hash: sha256:3b85484f9039f78ce1ebeec081cb857f086705de3817f4321c753be8f406cb8b
    state: active
  - id: p00022
    type: paragraph
    text: To this West of Scotland bourgeois brain, inheriting the accumulated capitalistic qualities of “four generations,” the value of the means of production, spindles, &amp;c., is so inseparably mixed up with their property, as capital, to expand their own value, and to swallow up daily a definite quantity of the unpaid labour of others, that the head of the firm of Carlile &amp; Co. actually imagines that if he sells his factory, not only will the value of the spindles be paid to him, but, in addition, their power of annexing surplus-value, not only the labour which is embodied in them, and is necessary to the production of spindles of this kind, but also the surpluslabour which they help to pump out daily from the brave Scots of Paisley, and for that very reason he thinks that with the shortening of the working day by 2 hours, the selling-price of 12 spinning machines dwindles to that of 10!
    hash: sha256:8060c3bf148ec1860a7ab67d5a92e4d61866e4388d20e4ae9b44b241032c8ea7
    state: active
  - id: p00023
    type: footnote
    label: "1"
    text: This elementary law appears to be unknown to the vulgar economists, who, upside-down Archimedes, in the determination of the market-price of labour by supply and demand, imagine they have found the fulcrum by means of which, not to move the world, but to stop its motion.
    hash: sha256:65de87387431de7ac97f02088c336b986cc20cc7dbdbbc30539e7e5439540827
    state: active
  - id: p00024
    type: footnote
    label: "2"
    text: Further particulars will be given in Book IV.
    hash: sha256:3b99acdd474bee5b0c033af8beda4ea79c2096d959d2ed2faa8e85ef2dcf8075
    state: active
  - id: p00025
    type: footnote
    label: "3"
    text: “The Labour, that is the economic time, of society, is a given portion, say ten hours a day of a million of people, or ten million hours.... Capital has its boundary of increase. This boundary may, at any given period, be attained in the actual extent of economic time employed.” (“An Essay on the Political Economy of Nations.” London, 1821, pp. 47, 49.)
    hash: sha256:ef8934d15d1d5694849106437e9680eb575db8100b7683f5d5ae89259d1e769d
    state: active
  - id: p00026
    type: footnote
    label: "4"
    text: "“The farmer cannot rely on his own labour, and if he does, I will maintain that he is a loser by it. His employment should be a general attention to the whole: his thresher must be watched, or he will soon lose his wages in corn not threshed out, his mowers, reapers, &amp;c., must be looked after; he must constantly go round his fences; he must see there is no neglect; which would be the case if he was confined to any one spot.” (“An Inquiry into the Connexion between the Present Price of Provisions and the Size of Farms, &amp;c. By a Farmer.” London, 1773, p. 12.) This book is very interesting. In it the genesis of the “capitalist farmer” or “merchant farmer,” as he is explicitly called, may be studied, and his self-glorification at the expense of the small farmer who has only to do with bare subsistence, be noted. “The class of capitalists are from the first partially, and they become ultimately completely, discharged from the necessity of the manual labour.” (“Textbook of Lectures on the Political Economy of Nations. By the Rev. Richard Jones.” Hertford 1852. Lecture III., p. 39.)"
    hash: sha256:16ffd119d2a8d136de8ff6e2d94d8cc761c2a3f313dee7182db986691bb1f2b7
    state: active
  - id: p00027
    type: footnote
    label: "5"
    text: "The molecular theory of modern chemistry first scientifically worked out by Laurent and Gerhardt rests on no other law. (Addition to 3rd Edition.) For the explanation of this statement, which is not very clear to non-chemists, we remark that the author speaks here of the homologous series of carbon compounds, first so named by C. Gerhardt in 1843, each series of which has its own general algebraic formula. Thus the series of paraffins: C<sub>n</sub>H<sub>2n+2</sub>, that of the normal alcohols: C<sub>n</sub>H<sub>2n+2</sub>O; of the normal fatty acids: CnH<sub>2n</sub>O<sub>2</sub> and many others. In the above examples, by the simply quantitative addition of CH<sub>2</sub> to the molecular formula, a qualitatively different body is each time formed. On the share (overestimated by Marx) of Laurent and Gerhardt in the determination of this important fact see Kopp, “Entwicklung der Chemie.” Munchen, 1873, pp. 709, 716, and Schorkmmer, “The Rise and Development of Organic Chemistry.” London, 1879, p. 54. — <i>F. E.</i>. See Letter from Marx to Engels, 22 June 1867<br/><br/>For Hegel’s formulation of the idea in the <i>Logic</i>, see Remark: Examples of Such Nodal Lines; the Maxim, ‘Nature Does Not Make Leaps’."
    hash: sha256:3327c15fe27ee7f4e900a243687638a8cf9d3b6dd4c537914ebd1049f091a8c8
    state: active
  - id: p00028
    type: footnote
    label: "6"
    text: "Martin Luther calls these kinds of institutions: “The Company Monopolia.”"
