    text: l.c., p. 60. Factory Inspector Stuart, himself a Scotchman, and in contrast to the English Factory Inspectors, quite taken captive by the capitalistic method of thinking, remarks expressly on this letter which he incorporates in his report that it is “the most useful of the communications which any of the factory-owners working with relays have given to those engaged in the same trade, and which is the most calculated to remove the prejudices of such of them as have scruples respecting any change of the arrangement of the hours of work.”<br/><br/>Transcribed by Zodiac<br/>Html Markup by Stephen Baird (1999)
