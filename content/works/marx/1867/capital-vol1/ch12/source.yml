    label: "8"
    text: "“Ces spéculateurs si économes du travail des ouvriers qu’il faudrait qu’ils payassent.” [These speculators, who are so economical of the labour of workers they would have to pay] (J. N. Bidaut: “Du Monopole qui s’établit dans les arts industriels et le commerce.” Paris, 1828, p. 13.) “The employer will be always on the stretch to economise time and labour.” (Dugald Stewart: Works ed. by Sir W. Hamilton, Edinburgh, v., viii., 1855. “Lectures on Polit. Econ.,” p. 318.) “Their (the capitalists’) interest is that the productive powers of the labourers they employ should be the greatest possible. On promoting that power their attention is fixed and almost exclusively fixed.” (R. Jones: l.c., Lecture III.)<br/><br/>Transcribed by Hinrich Kuhls<br/>Html Markup by Stephen Baird (1999)"
