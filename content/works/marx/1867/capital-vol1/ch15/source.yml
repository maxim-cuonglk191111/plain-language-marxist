    hash: sha256:ec4540dcae95e43619815a4c68591677091c9037668532a2700c93cc17b1f137
    state: active
  - id: p00582
    type: footnote
    label: "240"
    text: The Factory Acts Extension Act was passed on August 12, 1867. It regulates all foundries, smithies, and metal manufactories, including machine shops; furthermore glass-works, paper mills, gutta-percha and India-rubber works, tobacco manufactories, letter-press printing and book-binding works, and, lastly, all workshops in which more than 50 persons are employed. The Hours of Labour Regulation Act, passed on August 17, 1867, regulates the smaller workshops and the so-called domestic industries.<br/><br/>I shall revert to these Acts and to the new Mining Act of 1872 in Volume II.
    hash: sha256:beffc4b6babe20d7f6d7a84e8ebdba98948e2043c97dc40070c25691246c10c8
    state: active
