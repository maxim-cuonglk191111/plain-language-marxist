    type: footnote
    label: "203"
    text: “But it must be borne in mind that those improvements, though carried out fully in some establishments, are by no means general, and are not capable of being brought into use in many of the old manufactories without an expenditure of capital beyond the means of many of the present occupiers.” “I cannot but rejoice,” writes Sub-Insp. May, “that notwithstanding the temporary disorganisation which inevitably follows the introduction of such a measure (as the Factory Act Extension Act), and is, indeed, directly indicative of the evils which it was intended to remedy, &amp;c.” (Rep. of Insp. of Fact., 31st Oct., 1865.)
    hash: sha256:0ef3966ecf83d347afe500b11cdbf5d6ce749d7bafbcf04c838167b0ba34bcc5
    state: active
  - id: p00545
    type: footnote
    label: "204"
    text: With blast furnaces, for instance, “work towards the end of the week being generally much increased in duration in consequence of the habit of the men of idling on Monday and occasionally during a part or the whole of Tuesday also.” (“Child. Empl. Comm., III. Rep.,” p. vi.) “The little masters generally have very irregular hours. They lose two or three days, and then work all night to make it up.... They always employ their own children, if they have any.” (l.c., p. vii.) “The want of regularity in coming to work, encouraged by the possibility and practice of making up for this by working longer hours.” (l.c., p. xviii.) “In Birmingham ... an enormous amount of time is lost ... idling part of the time, slaving the rest.” (l.c., p. xi.)
    hash: sha256:85fa8340fad9c1d22f8b2f03810518c9bf004af2ac09398bc950640b2ec257a1
    state: active
