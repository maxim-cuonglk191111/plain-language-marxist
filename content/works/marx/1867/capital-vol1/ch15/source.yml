  - id: p00528
    type: footnote
    label: "187"
    text: Mr. White, a commissioner, visited a military clothing manufactory that employed 1,000 to 1,200 persons, almost all females, and a shoe manufactory with 1,300 persons; of these nearly one half were children and young persons.
    hash: sha256:72789815dd6d33023406b5f805234a865c1a70a0bcdb824047d5c670134163fc
