  - id: p00445
    type: footnote
    label: "107"
    text: Ure, l.c., p. 15. Whoever knows the life history of Arkwright, will never dub this barber-genius “noble.” Of all the great inventors of the 18th century, he was incontestably the greatest thiever of other people’s inventions and the meanest fellow.
    hash: sha256:504fa718fa794dfb1ae2810d46c0e122e7ef585cdf0067284e2484f5d7f46adf
    state: active
  - id: p00446
    type: footnote
    label: "108"
    text: "“The slavery in which the bourgeoisie has bound the proletariat, comes nowhere more plainly into daylight than in the factory system. In it all freedom comes to an end both at law and in fact. The workman must be in the factory at half past five. If he come a few minutes late, he is punished; if he come 10 minutes late, he is not allowed to enter until after breakfast, and thus loses a quarter of a day’s wage. He must eat, drink and sleep at word of command.... The despotic bell calls him from his bed, calls him from breakfast and dinner. And how does he fare in the mill? There the master is the absolute law-giver. He makes what regulations he pleases; he alters and makes additions to his code at pleasure; and if he insert the veriest nonsense, the courts say to the workman: Since you have entered into this contract voluntarily, you must now carry it out .... These workmen are condemned to live, from their ninth year till their death, under this mental and bodily torture.” (F. Engels, l.c., p. 217, sq.) What, “the courts say,” I will illustrate by two examples. One occurs at Sheffield at the end of 1866. In that town a workman had engaged himself for 2 years in a steelworks. In consequence of a quarrel with his employer he left the works, and declared that under no circumstances would he work for that master any more. He was prosecuted for breach of contract, and condemned to two months’ imprisonment. (If the master break the contract, he can be proceeded against only in a civil action, and risks nothing but money damages.) After the workman has served his two months, the master invites him to return to the works, pursuant to the contract. Workman says: No, he has already been punished for the breach. The master prosecutes again, the court condemns again, although one of the judges, Mr. Shee, publicly denounces this as a legal monstrosity, by which a man can periodically, as long as he lives, be punished over and over again for the same offence or crime. This judgment was given not by the “Great Unpaid,” the provincial Dogberries, but by one of the highest courts of justice in London. — [Added <i>in the 4th German edition. — This</i> has now been done away with. With few exceptions, e.g., when public gas-works are involved, the worker in England is now put on an equal footing with the employer in case of breach of contract and can be sued only civilly. — F. E.] The second case occurs in Wiltshire at the end of November 1863. About 30 power-loom weavers, in the employment of one Harrup, a cloth manufacturer at Leower’s Mill, Westbury Leigh, struck work because master Harrup indulged in the agreeable habit of making deductions from their wages for being late in the morning; 6d. for 2 minutes; 1s. for 3 minutes, and 1s. 6d. for ten minutes. This is at the rate of 9s. per hour, and £4 10s. 0d. per diem; while the wages of the weavers on the average of a year, never exceeded 10s. to 12s. weekly. Harrup also appointed a boy to announce the starting time by a whistle, which he often did before six o’clock in the morning: and if the hands were not all there at the moment the whistle ceased, the doors were closed, and those hands who were outside were fined: and as there was no clock on the premises, the unfortunate hands were at the mercy of the young Harrup-inspired time-keeper. The hands on strike, mothers of families as well as girls, offered to resume work if the timekeeper were replaced by a clock, and a more reasonable scale of fines were introduced. Harrup summoned I9 women and girls before the magistrates for breach of contract. To the utter indignation of all present, they were each mulcted in a fine of 6d. and 2s. 6d. for costs. Harrup was followed from the court by a crowd of people who hissed him. A favourite operation with manufacturers is to punish the workpeople by deductions made from their wages on account of faults in the material worked on. This method gave rise in 1866 to a general strike in the English pottery districts. The reports of the Ch. Empl. Com. (1863-1866), give cases where the worker not only receives no wages, but becomes, by means of his labour, and of the penal regulations, the debtor to boot, of his worthy master. The late cotton crisis also furnished edifying examples of the sagacity shown by the factory autocrats in making deductions from wages. Mr. R. Baker, the Inspector of Factories, says, “I have myself had lately to direct prosecutions against one cotton mill occupier for having in these pinching and painful times deducted 10d. a piece from some of the young workers employed by him, for the surgeon’s certificate (for which he himself had only paid 6d.), when only allowed by the law to deduct 3d., and by custom nothing at all .... And I have been informed of another, who, in order to keep without the law, but to attain the same object, charges the poor children who work for him a shilling each, as a fee for learning them the art and mystery of cotton spinning, so soon as they are declared by the surgeon fit and proper persons for that occupation. There may therefore be undercurrent causes for such extraordinary exhibitions as strikes, not only wherever they arise, but particularly at such times as the present, which without explanation, render them inexplicable to the public understanding.” He alludes here to a strike of power-loom weavers at Darwen, June, 1863. (“Reports of Insp. of Fact. for 30 April, 1863,” pp. 50-51.) The reports always go beyond their official dates."
    hash: sha256:7d941e8bc8d6afe59dd57d7c805478bb8ab0f345590fa312af67b1132eadd26f
    state: active
  - id: p00447
    type: footnote
    label: "109"
    text: The protection afforded by the Factory Acts against dangerous machinery has had a beneficial effect. “But ... there are other sources of accident which did not exist twenty years since; one especially, viz., the increased speed of the machinery. Wheels, rollers, spindles and shuttles are now propelled at increased and increasing rates; fingers must be quicker and defter in their movements to take up the broken thread, for, if placed with hesitation or carelessness, they are sacrificed.... A large number of accidents are caused by the eagerness of the workpeople to get through their work expeditiously. It must be remembered that it is of the highest importance to manufacturers that their machinery should be in motion, i.e., producing yarns and goods. Every minute’s stoppage is not only a loss of power, but of production, and the workpeople are urged by the overlookers, who are interested in the quantity of work turned off, to keep the machinery in motion, and it is no less important to those of the operatives who are paid by the weight or piece, that the machines should be kept in motion. Consequently, although it is strictly forbidden in many, nay in most factories, that machinery should be cleaned while in motion, it is nevertheless the constant practice in most, if not in all, that the workpeople do, unreproved, pick out waste, wipe rollers and wheels, &amp;c., while their frames are in motion. Thus from this cause only, 906 accidents have occurred during the six months.... Although a great deal of cleaning is constantly going on day by day, yet Saturday is generally the day set apart for the thorough cleaning of the machinery, and a great deal of this is done while the machinery is in motion.” Since cleaning is not paid for, the workpeople seek to get done with it as speedily as possible. Hence “the number of accidents which occur on Fridays, and especially on Saturdays, is much larger than on any other day. On the former day the excess is nearly 12 per cent. over the average number of the four first days of the week, and on the latter day the excess is 25 per cent. over the average of the preceding five days; or, if the number of working-hours on Saturday being taken into account — 7½ hours on Saturday as compared with 10½ on other days — there is an excess of 65 per cent. on Saturdays over the average of the other five days.” (“Rep. of Insp. of Fact., 31st Oct., 1866,” pp. 9, 15, 16, 17.)
    hash: sha256:ee382a3a72696dbd6d615d4e8b5534752b6e371aad246436aedecbfe49dff0bb
    state: active
  - id: p00448
    type: footnote
    label: "110"
    text: 'In Part I. of Book III. I shall give an account of a recent campaign by the English manufacturers against the Clauses in the Factory Acts that protect the “hands” against dangerous machinery. For the present, let this one quotation from the official report of Leonard Horner suffice: “I have heard some mill-owners speak with inexcusable levity of some of the accidents; such, for instance, as the loss of a finger being a trifling matter. A working-man’s living and prospects depend so much upon his fingers, that any loss of them is a very serious matter to him. When I have heard such inconsiderate remarks made, I have usually put this question: Suppose you were in want of an additional workman, and two were to apply, both equally well qualified in other respects, but one had lost a thumb or a forefinger, which would you engage? There never was a hesitation as to the answer....” The manufacturers have “mistaken prejudices against what they have heard represented as a pseudo-philanthropic legislation.” (“Rep. of Insp. of Fact., 31st Oct., 1855.") These manufacturers are clever folk, and not without reason were they enthusiastic for the slave-holders’ rebellion.'
    hash: sha256:435ee768a16c3bf8d120b57e1477121a6118d9255b3c4e7b91426184958c3e57
    state: active
  - id: p00449
    type: footnote
    label: "111"
    text: In those factories that have been longest subject to the Factory Acts, with their compulsory limitation of the hours of labour, and other regulations, many of the older abuses have vanished. The very improvement of the machinery demands to a certain extent “improved construction of the buildings,” and this is an advantage to the workpeople. (See “Rep. of Insp. of Fact. for 31st Oct., 1863,” p. 109.)
    hash: sha256:93c7f9e311f66e6817ad486768d348d4bae86aaa96b92424f4d9d6922a290a44
    state: active
  - id: p00450
    type: footnote
    label: "112"
    text: "See amongst others, John Houghton: “Husbandry and Trade Improved.” London, 1727. “The Advantages of the East India Trade, 1720.” John Bellers, l.c. “The masters and their workmen are, unhappily, in a perpetual war with each other. The invariable object of the former is to get their work done as cheaply as possible; and they do not fail to employ every artifice to this purpose, whilst the latter are equally attentive to every occasion of distressing their masters into a compliance with higher demands.” (“An Enquiry into the Causes of the Present High Price of Provisions,” pp. 61-62. Author, the Rev. Nathaniel Forster, quite on the side of the workmen.)"
    hash: sha256:8ac748eb49e381912aee77949f1d291090f389ced2862c25bb543e5f3a621e38
    state: active
  - id: p00451
    type: footnote
    label: "113"
    text: In old-fashioned manufactures the revolts of the workpeople against machinery, even to this day, occasionally assume a savage character, as in the case of the Sheffield file cutters in 1865.
    hash: sha256:5216228cd9fd97f31ab4033bfc8e589e6293655a8f59fd159df817cda4cd60f2
    state: active
  - id: p00452
    type: footnote
    label: "114"
    text: "Sir James Steuart also understands machinery quite in this sense. “Je considère donc les machines comme des moyens d’augmenter (virtuellement) le nombre des gens industrieux qu’on n’est pas obligé de nourrir.... En quoi l’effet d’une machine diffère-t-il de celui de nouveaux habitants?” (French trans. t. I., l. I., ch. XIX.) [I thus consider machines to be a means to (virtually) increase the number of industrious individuals we are not forced to feed. In what way does the effect of a machine differ from that of new inhabitants?] More naïve is Petty, who says, it replaces “Polygamy.” The above point of view is, at the most, admissible only for some parts of the United States. On the other hand, “machinery can seldom be used with success to abridge the labour of an individual; more time would be lost in its construction than could be saved by its application. It is only really useful when it acts on great masses, when a single machine can assist the work of thousands. It is accordingly in the most populous countries, where there are most idle men, that it is most abundant.... It is not called into use by a scarcity of men, but by the facility with which they can be brought to work in masses.” (Piercy Ravenstone: “Thoughts on the Funding System and its Effects.” London, 1824, p. 45.)"
    hash: sha256:0721de462bdf4ca0ef1b58c8e5da03752faff15f757d3add088fbdff20ac2f60
    state: active
  - id: p00453
    type: footnote
    label: "115"
    text: <i>[Note in the 4th German edition.</i> — This applies to Germany too. Where in our country agriculture on a large scale exists, hence particularly in the East, it has become possible only in consequence of the clearing of the estates (“Bauernlegen"), a practice which became widerspread in the 16th century and was particularly so since 1648. — <i>F. E.</i>]
    hash: sha256:395cd0d333e712cf31195ae7c3ff5ee3f4c35f8a9a7d09065a7c55527e50816d
