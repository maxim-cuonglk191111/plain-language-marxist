  - id: p00580
    type: footnote
    label: "237"
    text: "The trades proposed to be brought under the Act were the following: Lace-making, stocking-weaving, straw-plaiting, the manufacture of wearing apparel with its numerous sub-divisions, artificial flower-making, shoemaking, hat-making, glove-making, tailoring, all metal works, from blast furnaces down to needleworks, &amp;c., paper-mills, glassworks, tobacco factories, India-rubber works, braid-making (for weaving), hand-carpetmaking, umbrella and parasol making, the manufacture of spindles and spools, letterpress printing, book-binding, manufacture of stationery (including paper bags, cards, coloured paper, &amp;c.), rope-making, manufacture of jet ornaments, brick-making, silk manufacture by hand, Coventry weaving, salt works, tallow chandlers, cement works, sugar refineries, biscuit-making, various industries connected with timber, and other mixed trades."
    hash: sha256:9b968c25c9e613be128147fd88eaf64307c1263f9cb05c3a52b297c21f80c0ef
    state: active
