    label: "93"
    text: On 2 modern power-looms a weaver now makes in a week of 60 hours 26 pieces of certain quality, length, and breadth; while on the old power-looms he could make no more than 4 such pieces. The cost of weaving a piece of such cloth had already soon after 1850 fallen from 2s. 9d. to 5 1/8d.<br/><br/>“Thirty years ago (1841) one spinner with three placers was not required to attend to more than one pair of mules with 300-324 spindles. At the present time (1871) he has to mind with the help of 5 piecers 2,200 spindles, and produces not less than seven times as much yarn as in 1841.” (Alex. Redgrave, Factory Inspector – in the <i>Journal of Arts</i>, 5th January, 1872.)
