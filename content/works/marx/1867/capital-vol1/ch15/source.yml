  - id: p00459
    type: footnote
    label: "121"
    text: "Ure, l.c., p. 19. “The great advantage of the machinery employed in brick-making consists in this, that the employer is made entirely independent of skilled labourers.” (“Ch. Empl. Comm. V. Report,” Lond., 1866, p. 130, n. 46.) Mr. A. Sturrock, superintendent of the machine department of the Great Northern Railway, says, with regard to the building of locomotives, &amp;c.: “Expensive English workmen are being less used every day. The production of the workshops of England is being increased by the use of improved tools and these tools are again served by a low class of labour.... Formerly their skilled labour necessarily produced all the parts of engines. Now the parts of engines are produced by labour with less skill, but with good tools. By tools, I mean engineer’s machinery, lathes, planing machines, drills, and so on.” (“Royal Com. on Railways,” Lond., 1867, Minutes of Evidence, n. 17, 862 and 17, 863.)"
