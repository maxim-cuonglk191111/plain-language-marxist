  - id: p00370
    type: footnote
    label: "34"
    text: “Employers of labour would not unnecessarily retain two sets of children under thirteen.... In fact one class of manufacturers, the spinners of woollen yarn, now rarely employ children under thirteen years of age, i.e., half-timers. They have introduced improved and new machinery of various kinds, which altogether supersedes the employment of children (i.e., under 13 years); f. i., I will mention one process as an illustration of this diminution in the number of children, wherein by the addition of an apparatus, called a piecing machine, to existing machines, the work of six or four half-timers, according to the peculiarity of each machine, can be performed by one young person (over 13 years)... the half-time system ‘stimulated’ the invention of the piecing machine.” (Reports of Insp. of Fact. for 31st Oct., 1858.)
