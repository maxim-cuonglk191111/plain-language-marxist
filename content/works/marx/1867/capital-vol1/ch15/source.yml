  - id: p00432
    type: footnote
    label: "96"
    text: The following few figures indicate the increase in the “factories” of the United Kingdom since 1848:<br/><br/>See the Blue books “Statistical Abstract of the United Kingdom,” Nos. 8 and 13. Lond., 1861 and 1866. In Lancashire the number of mills increased only 4 per cent. between 1839 and 1850; 19 per cent. between 1850 and 1856; and 33 per cent. between 1856 and 1862; while the persons employed in them during each of the above periods of It years increased absolutely, but diminished relatively. (See “Rep. of Insp. of Fact., for 31st Oct., 1862,” p. 63.) The cotton trade preponderates in Lancashire. We may form an idea of the stupendous nature of the cotton trade in that district when we consider that, of the gross number of textile factories in the United Kingdom, it absorbs 45.2 per cent., of the spindles 83.3 per cent., of the power-looms 81.4 per cent., of the mechanical horse-power 72.6 per cent., and of the total number of persons employed 58.2 per cent. (l.c., pp. 62-63.)
