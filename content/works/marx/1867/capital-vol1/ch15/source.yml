  - id: p00410
    type: footnote
    label: "74"
    text: I give below the translation of this poem by Stolberg, because it brings into relief, quite in the spirit of former quotations referring to division of labour, the antithesis between the views of the ancients and the moderns. “Spare the hand that grinds the corn, Oh, miller girls, and softly sleep. Let Chanticleer announce the morn in vain! Deo has commanded the work of the girls to be done by the Nymphs, and now they skip lightly over the wheels, so that the shaken axles revolve with their spokes and pull round the load of the revolving stones. Let us live the life of our fathers, and let us rest from work and enjoy the gifts that the Goddess sends us.”<br/><br/>“Schonet der mahlenden Hand, o Müllerinnen, und schlafet<br/>Sanft! es verkünde der Hahn euch den Morgen umsonst!<br/>Däo hat die Arbeit der Mädchen den Nymphen befohlen,<br/>Und itzt hüpfen sie leicht über die Räder dahin,<br/>Daß die erschütterten Achsen mit ihren Speichen sich wälzen,<br/>Und im Kreise die Last drehen des wälzenden Steins.<br/>Laßt uns leben das Leben der Väter, und laßt uns der Gaben<br/>Arbeitslos uns freun, welche die Göttin uns schenkt.”<br/><br/>(Gedichte aus dem Griechischen übersetzt von Christian Graf zu Stolberg, Hamburg, 1782.)
    hash: sha256:60675c9c20fcf0fe2453e426995d233cabb1954d483620f233c0bcf48b579a37
    state: active
  - id: p00411
    type: footnote
    label: "75"
    text: There are, of course, always differences, in the intensities of the labour in various industries. But these differences are, as Adam Smith has shown, compensated to a partial extent by minor circumstances, peculiar to each sort of labour. Labour-time, as a measure of value, is not, however, affected in this case, except in so far as the duration of labour, and the degree of its intensity, are two antithetical and mutually exclusive expressions for one and the same quantity of labour.
