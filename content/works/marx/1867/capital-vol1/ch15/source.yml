  - id: p00387
    type: footnote
    label: "51"
    text: In the agricultural as well as in the factory districts the consumption of opium among the grown-up labourers, both male and female, is extending daily. “To push the sale of opiate... is the great aim of some enterprising wholesale merchants. By druggists it is considered the leading article.” (l.c., p. 459.) Infants that take opiates “shrank up into little old men,” or “wizened like little monkeys.” (l.c., p. 460.) We here see how India and China avenged themselves on England.
