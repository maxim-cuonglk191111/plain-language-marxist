    text: “The Master Spinners’ and Manufacturers’ Defence Fund. Report of the Committee.” Manchester, 1854, p. 17. We shall see hereafter, that the “master” can sing quite another song, when he is threatened with the loss of his “living” automaton.
    hash: sha256:4a1ba66aca36f8856b08249224113324e9ced3bad7976312646a7540d835a982
