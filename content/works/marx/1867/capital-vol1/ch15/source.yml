  - id: p00465
    type: footnote
    label: "127"
    text: “The relation of master and man in the blown-flint bottle trades amounts to a chronic strike.” Hence the impetus given to the manufacture of pressed glass, in which the chief operations are done by machinery. One firm in Newcastle, who formerly produced 350,000 lbs. of blown-flint glass, now produces in its place 3,000,500 lbs. of pressed glass. (“Ch. Empl. Comm., Fourth Rep.,” 1865, pp. 262-263.)
