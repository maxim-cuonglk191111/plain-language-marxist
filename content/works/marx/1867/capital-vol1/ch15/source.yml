    state: active
  - id: p00395
    type: footnote
    label: "59"
    text: "A. Redgrave in “Rep. of Insp. of Fact., 31st. Oct., 1857,” pp. 41-42. In those industries where the Factory Act proper (not the Print Works Act referred to in the text) has been in force for some time, the obstacles in the way of the education clauses have, in recent years, been overcome. In industries not under the Act, the views of Mr. J. Geddes, a glass manufacturer, still extensively prevail. He informed Mr. White, one of the Inquiry Commissioners: “As far as I can see, the greater amount of education which a part of the working-class has enjoyed for some years past is an evil. It is dangerous, because it makes them independent.” (“Children’s Empl. Comm., Fourth Report,” Lond., 1865, p. 253.)"
    hash: sha256:4810fbdd972cf18d0b7b63415d234e37902a4ec6cea4bd7edcb8e737605edbc3
    state: active
  - id: p00396
    type: footnote
    label: "60"
    text: “Mr. E., a manufacturer ... informed me that he employed females exclusively at his power-looms ... gives a decided preference to married females, especially those who have families at home dependent on them for support; they are attentive, docile, more so than unmarried females, and are compelled to use their utmost exertions to procure the necessaries of life. Thus are the virtues, the peculiar virtues of the female character to be perverted to her injury – thus all that is most dutiful and tender in her nature is made a means of her bondage and suffering.” (Ten Hours’ Factory Bill. The Speech of Lord Ashley, March 15th, Lond., 1844, p. 20.)
    hash: sha256:b896bc81a3feedacb316161daf09adac419ce81633f77f19a77759f1aa789687
    state: active
  - id: p00397
    type: footnote
    label: "61"
    text: "“Since the general introduction of machinery, human nature has been forced far beyond its average strength.” (Rob. Owen: “Observations on the Effects of the Manufacturing System,” 2nd Ed., London, 1817.)"
    hash: sha256:d757f00a14755619eb20e5f2e20cca67dadba10813f46e9b0b25201fec58a27f
    state: active
  - id: p00398
    type: footnote
    label: "62"
    text: "The English, who have a tendency to look upon the earliest form of appearance of a thing as the cause of its existence, are in the habit of attributing the long hours of work in factories to the extensive kidnapping of children, practised by capitalists in the infancy of the factory system, on workhouses and orphanages, by means of which robbery, unresisting material for exploitation was procured. Thus, for instance, Fielden, himself a manufacturer, says: “It is evident that the long hours of work were brought about by the circumstance of so great a number of destitute children being supplied from different parts of the country, that the masters were independent of the hands, and that having once established the custom by means of the miserable materials they had procured in this way, they could impose it on their neighbours with the greater facility.” (J. Fielden: “The Curse of the Factory System,” Lond., 1836, p. 11.) With reference to the labour of women, Saunders, the factory inspector, says in his report of 1844: “Amongst the female operatives there are some women who, for many weeks in succession, except for a few days, are employed from 6 a.m. till midnight, with less than 2 hours for meals, so that on 5 days of the week they have only 6 hours left out of the 24, for going to and from their homes and resting in bed.”"
    hash: sha256:d2962ff6dea193ec9b1e9654d8939996c9e0d5a9fe35ff289f4587cbc92977d8
    state: active
  - id: p00399
    type: footnote
    label: "63"
    text: “Occasion... injury to the delicate moving parts of metallic mechanism by inaction.” (Ure, l.c., p. 281.)
    hash: sha256:95dd0a41bcec03824c0a33c68740da49a5556b8d4641b07c94f9817466f5cf2c
    state: active
  - id: p00400
    type: footnote
    label: "64"
    text: 'The Manchester Spinner (<i>Times</i>, 26th Nov., 1862) before referred to says in relation to this subject: “It (namely, the “allowance for deterioration of machinery") is also intended to cover the loss which is constantly arising from the superseding of machines before they are worn out, by others of a new and better construction.”'
    hash: sha256:dc12ddbe3acfde3090ace1e1b32fa5d554f5dac43caa0238b59d8e6586371c26
    state: active
  - id: p00401
    type: footnote
    label: "65"
    text: “It has been estimated, roughly, that the first individual of a newly-invented machine will cost about five times as much as the construction of the second.” Babbage, l.c., p. 349.
    hash: sha256:a9763fc5bc32536df368e7379fdf4b888ff91cb1b8e31d4fd4489c2b6b9fbe0c
    state: active
  - id: p00402
    type: footnote
    label: "66"
    text: “The improvements which took place not long ago in frames for making patent net were so great that a machine in good repair which had cost £1,200, sold a few years after for £60 ... improvements succeeded each other so rapidly, that machines which had never been finished were abandoned in the hands of their makers, because new improvements had superseded their utility.” (Babbage, l.c., p. 233.) In these stormy, go-ahead times, therefore, the tulle manufacturers soon extended the working-day, by means of double sets of hands, from the original 8 hours to 24.
    hash: sha256:b56cc41775bc6c4e27d5ec2ffb511dcb3752283b459c46d088817c2e5c57286f
    state: active
  - id: p00403
    type: footnote
    label: "67"
    text: "“It is self-evident, that, amid the ebbings and flowings of the markets and the alternate expansions and contractions of demand, occasions will constantly recur, in which the manufacturer may employ additional floating capital without employing additional fixed capital... if additional quantities of raw material can be worked up without incurring an additional expense for buildings and machinery.” (R. Torrens: “On Wages and Combination.” London, 1834, p. 64.)"
    hash: sha256:02b184a2ad7b3b68d5b53f110b918bfb632ebed80e8f9ab6d0f00bd63fa4daf8
    state: active
  - id: p00404
    type: footnote
    label: "68"
    text: This circumstance is mentioned only for the sake of completeness, for I shall not consider the rate of profit, i.e., the ratio of the surplus-value to the total capital advanced, until I come to the third book.
    hash: sha256:c2af4e8c3886f0698d16034d083df0e44b6614b861b6e6ee12dd739abce73e7b
    state: active
  - id: p00405
    type: footnote
    label: "69"
    text: Senior, “Letters on the Factory Act.” London, 1837, pp. 13, 14.
    hash: sha256:92ea18478f024ba26c1891e4d491c5c3689bde21c2ad95d97c919a9e174be2aa
    state: active
  - id: p00406
    type: footnote
    label: "70"
    text: “The great proportion of fixed to circulating capital ... makes long hours of work desirable.” With the increased use of machinery, &amp;c., “the motives to long hours of work will become greater, as the only means by which a large proportion of fixed capital can be made profitable.” (l.c., pp. 11-13.) “There are certain expenses upon a mill which go on in the same proportion whether the mill be running short or full time, as, for instance, rent rates, and taxes, insurance against fire, wages of several permanent servants, deterioration of machinery, with various other charges upon a manufacturing establishment, the proportion of which to profits increases as the production decreases.” (“Rep. of Insp. of Fact. for 31st Oct., 1862,” p. 19.)
    hash: sha256:5cdd87482d6db9e6a93320a673141014a4d3039dd870a1c50f40910f1eee87c8
    state: active
  - id: p00407
    type: footnote
    label: "71"
    text: Why it is, that the capitalist, and also the political economists who are imbued with his views, are unconscious of this immanent contradiction, will appear from the first part of the third book.
    hash: sha256:0584b61115cb1b24f95819adf9275f7ef6f43cd2c0c95d9354cd93b85960728c
    state: active
  - id: p00408
    type: footnote
    label: "72"
    text: It is one of the greatest merits of Ricardo to have seen in machinery not only the means of producing commodities, but of creating a “redundant population.”
    hash: sha256:7dbe82b090059c0da8a27b76a52fb49c4c5efc35ef796708dd654fd0776342d9
