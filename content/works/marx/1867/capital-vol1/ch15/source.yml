  - id: p00454
    type: footnote
    label: "116"
    text: “Machinery and labour are in constant competition.” Ricardo, l.c., p. 479.
    hash: sha256:095d2d8b6ee0c35a6a51f035bf431c81e0d9a8af5b0af0bd50b43f33d3908a83
    state: active
  - id: p00455
    type: footnote
    label: "117"
    text: "The competition between hand-weaving and power-weaving in England, before the passing of the Poor Law of 1833, was prolonged by supplementing the wages, which had fallen considerably below the minimum, with parish relief. “The Rev. Mr. Turner was, in 1827, rector of Wilmslow in Cheshire, a manufacturing district. The questions of the Committee of Emigration, and Mr. Turner’s answers, show how the competition of human labour is maintained against machinery. ‘Question: Has not the use of the power-loom superseded the use of the hand-loom? Answer: Undoubtedly; it would have superseded them much more than it has done, if the hand-loom weavers were not enabled to submit to a reduction of wages.’ ‘Question: But in submitting he has accepted wages which are insufficient to support him, and looks to parochial contribution as the remainder of his support? Answer: Yes, and in fact the competition between the hand-loom and the power-loom is maintained out of the poor-rates.’ Thus degrading pauperism or expatriation, is the benefit which the industrious receive from the introduction of machinery, to be reduced from the respectable and in some degree independent mechanic, to the cringing wretch who lives on the debasing bread of charity. This they call a temporary inconvenience.” (“A Prize Essay on the Comparative Merits of Competition and Co-operation.” Lond., 1834, p. 29.)"
    hash: sha256:32578adc8151a6c7a1fda5214335bde0e0d3b54c8f1bbbac6bd3652fcb288f2a
    state: active
  - id: p00456
    type: footnote
    label: "118"
    text: “The same cause which may increase the revenue of the country” (i.e., as Ricardo explains in the same passage, the revenues of landlords and capitalists, whose wealth, from the economic point of view, forms the Wealth of the Nation), “may at the same time render the population redundant and deteriorate the condition of the labourer.” (Ricardo, l.c., p. 469.) “The constant aim and the tendency of every improvement in machinery is, in fact, to do away entirely with the labour of man, or to lessen its price by substituting the labour of women and children for that of grown-up men, or of unskilled for that of skilled workmen.” (Ure, l.c., t. I., p. 35.)
    hash: sha256:33a3cad469d6102d467884cf7c13e916d980c64f6ed557e749f6f966046cbd07
    state: active
