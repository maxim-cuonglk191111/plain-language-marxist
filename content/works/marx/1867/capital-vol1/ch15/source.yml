    state: active
  - id: p00469
    type: footnote
    label: "131"
    text: Ure, l.c., pp. 368, 7, 370, 280, 281, 321, 370, 475.
    hash: sha256:ecaf0d6541eadde37a5dffe210f58f2302bafd4c19a7f13a84b884d929be2c10
    state: active
  - id: p00470
    type: footnote
    label: "132"
    text: Ricardo originally was also of this opinion, but afterwards expressly disclaimed it with the scientific impartiality and love of truth characteristic of him. See l.c., ch. xxxi. “On Machinery.”
    hash: sha256:15bdb739c47464a914513dfe4e42a78151701a7217731d816eb37f2b5e407929
    state: active
  - id: p00471
    type: footnote
    label: "133"
    text: <i>Nota bene</i>. My illustration is entirely on the lines of those given by the above named economists.
    hash: sha256:ddcdf26d4536e00f5d23726c60fbcfb90ec9766c28197ca86013eb159dc71d1d
    state: active
  - id: p00472
    type: footnote
    label: "134"
    text: "A disciple of Ricardo, in answer to the insipidities of J. B. Say, remarks on this point: “Where division of labour is well developed, the skill of the labourer is available only in that particular branch in which it has been acquired; he himself is a sort of machine. It does not therefore help matters one jot, to repeat in parrot fashion, that things have a tendency to find their level. On looking around us we cannot but see, that they are unable to find their level for a long time; and that when they do find it, the level is always lower than at the commencement of the process.” (“An Inquiry into those Principles Respecting the Nature of Demand,” &amp;c., Lond. 1821, p. 72.)"
    hash: sha256:b31e78bfa3b7671167280398eb42b872cbcbe6f3a33ee21f0d0720ef4a4c49d9
    state: active
  - id: p00473
    type: footnote
    label: "135"
    text: "MacCulloch, amongst others, is a past master in this pretentious cretinism. “If,” he says, with the affected naïveté of a child of 8 years, “if it be advantageous, to develop the skill of the workman more and more, so that he is capable of producing, with the same or with a less quantity of labour, a constantly increasing quantity of commodities, it must also be advantageous, that he should avail himself of the help of such machinery as will assist him most effectively in the attainment of this result.” (MacCulloch: “Princ. of Pol. Econ.,” Lond. 1830, p. 166.)"
    hash: sha256:bc0908fa04bc4eb6ee3129e3b54ae7d95a64cebdbc17807643de9283e345964d
    state: active
  - id: p00474
    type: footnote
    label: "136"
    text: "“The inventor of the spinning machine has ruined India, a fact, however, that touches us but little.” A. Thiers: De la propriété. — M. Thiers here confounds the spinning machine with the power-loom, “a fact, however, that touches us but little.”"
    hash: sha256:6a82f8d1bf98cbb1be7756f3d494cd0bfed0542c567309674f46ce9f744ef6f9
    state: active
  - id: p00475
    type: footnote
    label: "137"
    text: According to the census of 1861 (Vol. II., Lond., 1863), the number of people employed in coal mines in England and Wales, amounted to 246,613 of which 73,545 were under, and 173,067 were over 20 years. Of those under 20, 835 were between 5 and 10 years, 30,701 between 10 and 15 years, 42,010 between 15 and 19 years. The number employed in iron, copper, lead, tin, and other mines of every description, was 319, 222.
    hash: sha256:cb5cd6f9861ca8fc697a2732a4d5735f7859256e7d3a7b2476fb91630fd5281e
    state: active
  - id: p00476
    type: footnote
    label: "138"
    text: In England and Wales, in 1861, there were employed in making machinery, 60,807 persons, including the masters and their clerks, &amp;c., also all agents and business people connected with this industry, but excluding the makers of small machines, such as sewing-machines, &amp;c., as also the makers of the operative parts of machines, such as spindles. The total number of civil engineers amounted to 3,329.
    hash: sha256:8f094cf182af2de7741aaca5fceca74a6fcb66542ba8ac14a3aa628d05ad5325
    state: active
  - id: p00477
    type: footnote
    label: "139"
    text: Since iron is one of the most important raw materials; let me here state that, in 1861, there were in England and Wales 125,771 operative iron founders, of whom 123,430 were males, 2,341 females. Of the former 30,810 were under, and 92,620 over 20 years.
    hash: sha256:5f5e3e0baf59f35ac950d87368c9459e2b546d190eac87bfabd0ea07de184c3a
    state: active
  - id: p00478
    type: footnote
    label: "140"
    text: “A family of four grown-up persons, with two children as winders, earned at the end of the last, and the beginning of the present century, by ten hours’ daily labour, £4 a week. If the work was very pressing, they could earn more.... Before that, they had always suffered from a deficient supply of yarn.” (Gaskell, l.c., pp. 25-27.)
    hash: sha256:ba0de8fe065a1caf7c22fb8a4537e8abdb78487bcd11836df7bc5fcdc678b090
    state: active
  - id: p00479
    type: footnote
    label: "141"
    text: F. Engels, in “Lage, &amp;c.,” points out the miserable condition of a large number of those who work on these very articles of luxury. See also numerous instances in the “Reports of the Children’s Employment Commission.”
    hash: sha256:b1f14634880cd511ba8a23ba15e52238c241aca77d00e672d78f9f46cd951b43
    state: active
  - id: p00480
    type: footnote
    label: "142"
    text: In 1861, in England and Wales, there were 94,665 sailors in the merchant service.
    hash: sha256:26196fc8acbbfca368b127365cf5224b1306b4e879f89353bcaab10241351560
    state: active
  - id: p00481
    type: footnote
    label: "143"
    text: Of these only 177,596 are males above 13 years of age.
    hash: sha256:12e41cdcf2e8f99aafb65b485840ed1c16408206ae4c52fcb709eb3b407eb9b2
    state: active
  - id: p00482
    type: footnote
    label: "144"
    text: Of these, 30,501 are females.
    hash: sha256:20fd8bea219696ce94e1cbe543fd9712a9e4771df0237313b1e598970f507c56
    state: active
  - id: p00483
    type: footnote
    label: "145"
    text: Of these, 137,447 males. None are included in the 1,208,648 who do not serve in private houses. Between 1861 and 1870 the number of male servants nearly doubled itself. It increased to 267,671. In the year 1847 there were 2,694 gamekeepers (for the landlords’ preserves), in 1869 there were 4,921. The young servant girls in the houses of the London lower middle class are in common parlance called “slaveys.”
    hash: sha256:4caf5f49dea4a38d94a4ebe61a2ca4d747e97543075437627ef89025a0d34ca9
    state: active
  - id: p00484
    type: footnote
    label: "146"
    text: "Ganilh, on the contrary, considers the final result of the factory system to be an absolutely less number of operatives, at whose expense an increased number of “gens honnêtes” live and develop their well-known “perfectibilité perfectible.” Little as he understands the movement of production, at least he feels, that machinery must needs be a very fatal institution, if its introduction converts busy workmen into paupers, and its development calls more slaves of labour into existence than it has suppressed. It is not possible to bring out the cretinism of his standpoint, except by his own words: “Les classes condamnées à produire et à consommer diminuent, et les classes qui dirigent le travail, qui soulagent, consolent, et éclairent toute la population, se multiplient ... et s’approprient tous les bienfaits qui résultent de la diminution des frais du travail, de l’abondance des productions, et du bon marché des consommations. Dans cette direction, l’espéce humaine s’élève aux plus hautes conceptions du génie, pénètre dans les profoundeurs mystérieuses de la religion, établit les principes salutaires de la morale (which consists in ‘s’approprier tous les beinfaits,’ &amp;c.), les lois tutélaires de la liberté (liberty of ‘les classes condamnées à produire?’) et du pouvoir, de l’obéissance et de la justice, du devoir et de la l’humanité.” [The classes condemned to produce and to consume diminish, and the classes which direct labour, which relieve, console and enlighten the whole population, multiply ... and appropriate all the benefits which result from the diminution of the costs of labour, from the abundance of products and the cheapness of consumer goods. In this way, the human species rises to the highest creations of genius, penetrates the mysterious depths of religion, and establishes the salutory principles of morality, the laws for the protection of liberty, and power, of obedience and justice, of obligation and humanity] For this twaddle, see “Des Systèmes d’Economie Politique, &amp;c., Par M. Ch. Ganilh,” 2ème ed., Paris, 1821, t. I, p. 224, and see p. 212."
    hash: sha256:5dd07796177eeb00fb47b6f51e13cfe1df7a02d0f730901ab7ea2b6ee346133d
    state: active
  - id: p00485
    type: footnote
    label: "147"
    text: “Reports of Insp. of Fact., 31 Oct., 1865,” p. 58, sq. At the same time, however, means of employment for an increased number of hands was ready in 110 new mills with 11,625 looms, 628,576 spindles and 2,695 total horse-power of steam and water (l.c.).
    hash: sha256:d3366df63ed8f27e132425aab996419e02b69db612abd51705ef1d94d47685b4
    state: active
  - id: p00486
    type: footnote
    label: "148"
    text: "“Reports, &amp;c., for 31 Oct., 1862,” p. 79. At the end of 1871, Mr. A. Redgrave, the factory inspector, in a lecture given at Bradford, in the New Mechanics’ Institution, said: “What has struck me for some time past is the altered appearance of the woollen factories. Formerly they were filled with women and children, now machinery seems to do all the work. At my asking for an explanation of this from a manufacturer, he gave me the following: ‘Under the old system I employed 63 persons; after the introduction of improved machinery I reduced my hands to 33, and lately, in consequence of new and extensive alterations, I have been in a position to reduce those 33 to 13’.”"
    hash: sha256:2e41cc2662cc2b0a61cc6cfd4c16fbe4d7cb9c164f4a97ee2db0093c8fa3471c
    state: active
  - id: p00487
    type: footnote
    label: "149"
    text: See “Reports, &amp;c., 31 Oct., 1856,” p. 16.
    hash: sha256:080aba90bd5fe432cd51e7717439c58f98f9ec2c305f1cc793aca0dce1e0fb7a
    state: active
  - id: p00488
    type: footnote
    label: "150"
    text: “The sufferings of the hand-loom weavers were the subject of an inquiry by a Royal Commission, but although their distress was acknowledged and lamented, the amelioration of their condition was left, and probably necessarily so, to the chances and changes of time, which it may now be hoped” [20 years later!] “have nearly obliterated those miseries, and not improbably by the present great extention of the power-loom.” (“Rep. Insp. of Fact., 31 Oct., 1856,” p. 15.)
    hash: sha256:436078b5da8e93c8f917b528b3efa725fcc2f2e02b0edc69f3cdcb6b038663f5
