    label: "165"
    text: From a letter of Mr. Harris, Chief Constable of Bolton, in “Rep. of Insp. of Fact., 31st October, 1865,” pp. 61-62.
    hash: sha256:e885f75e3bca9929eeafaf83c38d944858e2cdefec80533539263a13c9985a01
    state: active
  - id: p00507
    type: footnote
    label: "166"
    text: "In an appeal, dated 1863, of the factory operatives of Lancashire, &amp;c., for the purpose of forming a society for organised emigration, we find the following: “That a large emigration of factory workers is now absolutely essential to raise them from their present prostrate condition, few will deny; but to show that a continuous stream of emigration is at all times demanded, and, without which it is impossible for than to maintain their position in ordinary times, we beg to call attention to the subjoined facts: — In 1814 the official value of cotton goods exported was £17,665,378, whilst the real marketable value was £20,070,824. In 1858 the official value of cotton goods exported, was £182,221,681; but the real or marketable value was only £43,001,322, being a ten-fold quantity sold for little more than double the former price. To produce results so disadvantageous to the country generally, and to the factory workers in particular, several causes have cooperated, which, had circumstances permitted, we should have brought more prominently under your notice; suffice it for the present to say that the most obvious one is the constant redundancy of labour, without which a trade so ruinous in its effects never could have been carried on, and which requires a constantly extending market to save it from annihilation. Our cotton mills may be brought to a stand by the periodical stagnations of trade, which, under present arrangements, are as inevitable as death itself; but the human mind is constantly at work, and although we believe we are under the mark in stating that six millions of persons have left these shores during the last 25 years, yet, from the natural increase of population, and the displacement of labour to cheapen production, a large percentage of the male adults in the most prosperous times find it impossible to obtain work in factories on any conditions whatever.” (“Reports of Insp. of Fact., 30th April 1863,” pp. 51-52.) We shall, in a later chapter, see how our friends, the manufacturers, endeavoured, during the catastrophe in the cotton trade, to prevent by every means, including State interference, the emigration of the operatives."
    hash: sha256:9847df0e1419dd00ec14abde69d7d41370f3a728e31be70edec73c5a13c4fa4c
    state: active
  - id: p00508
    type: footnote
    label: "167"
    text: “Ch. Empt. Comm. III. Report, 1864,” p. 108, n. 447.
    hash: sha256:bde7039dd41b271d492ebb24776467f139d446af5a0e3955118bba42a4dc2e21
