    type: footnote
    label: "188"
    text: An instance. The weekly report of deaths by the Registrar-General dated 26th Feb., 1864, contains 5 cases of death from starvation. On the same day <i>The Times</i> reports another case. Six victims of starvation in one week!
    hash: sha256:2499292e79d944af6bee8985652a7047e4c43c75d7fb5986750cd88369b15818
