    text: "See, for instance, Hutton: “Course of Mathematics.”"
    hash: sha256:065a4771afae38a7cdbd76b1edce7a6be354353b94a6041ff85ec51bc522cffc
    state: active
  - id: p00339
    type: footnote
    label: "3"
    text: "“From this point of view we may draw a sharp line of distinction between a tool and a machine: spades, hammers, chisels, &amp;c., combinations of levers and of screws, in all of which, no matter how complicated they may be in other respects, man is the motive power, ... all this falls under the idea of a tool; but the plough, which is drawn by animal power, and wind-mills, &amp;c., must be classed among machines.” (Wilhelm Schulz: “Die Bewegung der Produktion.” Zürich, 1843, p. 38.) In many respects a book to be recommended."
    hash: sha256:1bf1e6345ec0b190a743bdaa932d69046fa6ff0a5a59368c5291cb645f7e48c7
    state: active
  - id: p00340
    type: footnote
    label: "4"
    text: Before his time, spinning machines, although very imperfect ones, had already been used, and Italy was probably the country of their first appearance. A critical history of technology would show how little any of the inventions of the 18th century are the work of a single individual. Hitherto there is no such book. Darwin has interested us in the history of Nature’s Technology, i.e., in the formation of the organs of plants and animals, which organs serve as instruments of production for sustaining life. Does not the history of the productive organs of man, of organs that are the material basis of all social organisation, deserve equal attention? And would not such a history be easier to compile, since, as Vico says, human history differs from natural history in this, that we have made the former, but not the latter? Technology discloses man’s mode of dealing with Nature, the process of production by which he sustains his life, and thereby also lays bare the mode of formation of his social relations, and of the mental conceptions that flow from them. Every history of religion, even, that fails to take account of this material basis, is uncritical. It is, in reality, much easier to discover by analysis the earthly core of the misty creations of religion, than, conversely, it is, to develop from the actual relations of life the corresponding celestialised forms of those relations. The latter method is the only materialistic, and therefore the only scientific one. The weak points in the abstract materialism of natural science, a materialism that excludes history and its process, are at once evident from the abstract and ideological conceptions of its spokesmen, whenever they venture beyond the bounds of their own speciality.
    hash: sha256:0b6c24c8d0d98364e7cb1a3f968278d850d686c97ee574738d4a994c95fc7e67
    state: active
  - id: p00341
    type: footnote
    label: "5"
    text: Especially in the original form of the power-loom, we recognise, at the first glance, the ancient loom. In its modern form, the power-loom has undergone essential alterations.
    hash: sha256:ed041fc0e1c5c51c258eca46abff4f44bb273981c3c74fb4075fd85b0bb057ca
    state: active
  - id: p00342
    type: footnote
    label: "6"
    text: It is only during the last 15 years (i.e., since about 1850), that a constantly increasing portion of these machine tools have been made in England by machinery, and that not by the same manufacturers who make the machines. Instances of machines for the fabrication of these mechanical tools are, the automatic bobbin-making engine, the cardsetting engine, shuttle-making machines, and machines for forging mule and throstle spindles.
    hash: sha256:fa5b3c55823aae6fcce51e55af1ef1a94e1aa698a623fa714d3803f17cb0ddbb
    state: active
  - id: p00343
    type: footnote
    label: "7"
    text: "Moses says: “Thou shalt not muzzle the ox that treads the corn.” The Christian philanthropists of Germany, on the contrary, fastened a wooden board round the necks of the serfs, whom they used as a motive power for grinding, in order to prevent them from putting flour into their mouths with their hands."
    hash: sha256:582a4b1445b46dbbe45911a74ddccb03ca867bc08ad4862cd30df7c6bee099ed
    state: active
  - id: p00344
    type: footnote
    label: "8"
    text: It was partly the want of streams with a good fall on them, and partly their battles with superabundance of water in other respects, that compelled the Dutch to resort to wind as a motive power. The wind-mill itself they got from Germany, where its invention was the origin of a pretty squabble between the nobles, the priests, and the emperor, as to which of those three the wind “belonged.” The air makes bondage, was the cry in Germany, at the same time that the wind was making Holland free. What it reduced to bondage in this case, was not the Dutchman, but the land for the Dutchman. In 1836, 12,000 windmills of 6,000 horse-power were still employed in Holland, to prevent two-thirds of the land from being reconverted into morasses.
    hash: sha256:cb434d21dce45ed90e403e90d3b3294a5c07bb9ed52138052828c60ed277ecfd
    state: active
  - id: p00345
    type: footnote
    label: "9"
    text: It was, indeed, very much improved by Watt’s first so-called single acting engine; but, in this form, it continued to be a mere machine for raising water, and the liquor from salt mines.
    hash: sha256:d6687a8dcb86aeb96e27b986e47dc108eee046dddc083886f766b0fe2b4542c4
    state: active
  - id: p00346
    type: footnote
    label: "10"
    text: “The union of all these simple instruments, set in motion by a single motor, constitutes a machine.” (Babbage, l.c.)
    hash: sha256:305d32b577f6836eca3ff3ba856f7e5c4b0eac941c05307ee55f17503b71c3d2
    state: active
  - id: p00347
    type: footnote
    label: "11"
    text: "In January, 1861, John C. Morton read before the Society of Arts a paper on “The forces employed in agriculture.” He there states: “Every improvement that furthers the uniformity of the land makes the steam-engine more and more applicable to the production of pure mechanical force.... Horse-power is requisite wherever crooked fences and other obstructions prevent uniform action. These obstructions are vanishing day by day. For operations that demand more exercise of will than actual force, the only power applicable is that controlled every instant by the human mind-in other words, man-power.” Mr. Morton then reduces steam-power, horse-power, and man-power, to the unit in general use for steam-engines, namely, the force required to raise 33,000 lbs. one foot in one minute, and reckons the cost of one horse-power from a steam-engine to be 3d., and from a horse to be 5½d. per hour. Further, if a horse must fully maintain its health, it can work no more than 8 hours a day. Three at the least out of every seven horses used on tillage land during the year can be dispensed with by using steam-power, at an expense not greater than that which, the horses dispensed with, would cost during the 3 or 4 months in which alone they can be used effectively. Lastly, steam-power, in those agricultural operations in which it can be employed, improves, in comparison with horse-power, the quality of the work. To do the work of a steam-engine would require 66 men, at a total cost of 15s. an hour, and to do the work of a horse, 32 men, at a total cost of 8s. an hour."
    hash: sha256:dd5a3095d0a87eaa907fb3c256871a2068a4297c526ca3e93ad94a1853420e0a
    state: active
  - id: p00348
    type: footnote
    label: "12"
    text: Faulhaber, 1625; De Caus, 1688.
    hash: sha256:32aa8b2234a4c3e8969d50a1db78a7b930a564dc1331625d1524fdfab331c9b8
    state: active
  - id: p00349
    type: footnote
    label: "13"
    text: The modern turbine frees the industrial exploitation of water-power from many of its former fetters.
    hash: sha256:8e2b98228c826d39c0349eca88879381a9f0f1bbe455588a31c942a30a3dbad8
    state: active
  - id: p00350
    type: footnote
    label: "14"
    text: “In the early days of textile manufactures, the locality of the factory depended upon the existence of a stream having a sufficient fall to turn a water-wheel; and, although the establishment of the water-mills was the commencement of the breaking up of the domestic system of manufacture, yet the mills necessarily situated upon streams, and frequently at considerable distances the one from the other, formed part of a rural, rather than an urban system; and it was not until the introduction of the steam-power as a substitute for the stream that factories were congregated in towns, and localities where the coal and water required for the production of steam were found in sufficient quantities. The steam-engine is the parent of manufacturing towns.” (A. Redgrave in “Reports of the Insp. of Fact., 30th April, 1860,” p. 36.)
    hash: sha256:89333948a3cf3423be397897d6db699ecd3dea3c9caeab4fb76a587122b1c749
    state: active
  - id: p00351
    type: footnote
    label: "15"
    text: From the standpoint of division of labour in Manufacture, weaving was not simple, but, on the contrary, complicated manual labour; and consequently the power-loom is a machine that does very complicated work. It is altogether erroneous to suppose that modern machinery originally appropriated those operations alone, which division of labour had simplified. Spinning and weaving were, during the manufacturing period, split up into new species, and the implements were modified and improved; but the labour itself was in no way divided, and it retained its handicraft character. It is not the labour, but the instrument of labour, that serves as the starting-point of the machine.
    hash: sha256:ed92bb91adf4280716a0c7b149804c052e3c8899b2668c717ccd1662f6b1eb79
    state: active
  - id: p00352
    type: footnote
    label: "16"
    text: Before the epoch of Mechanical Industry, the wool manufacture was the predominating manufacture in England. Hence it was in this industry that, in the first half of the 18th century, the most experiments were made. Cotton, which required less careful preparation for its treatment by machinery, derived the benefit of the experience gained on wool, just as afterwards the manipulation of wool by machinery was developed on the lines of cotton-spinning and weaving by machinery. It was only during the 10 years immediately preceding 1866, that isolated details of the wool manufacture, such as woolcombing, were incorporated in the factory system. “The application of power to the process of combing wool ... extensively in operation since the introduction of the combingmachine, especially Lister’s ... undoubtedly had the effect of throwing a very large number of men out of work. Wool was formerly combed by hand, most frequently in the cottage of the comber. It is now very generally combed in the factory, and hand-labour is superseded, except in some particular kinds of work, in which hand-combed wool is still preferred. Many of the hand-combers found employment in the factories, but the produce of the hand-combers bears so small a proportion to that of the machine, that the employment of a very large number of combers has passed away.” (“Rep. of lnsp. of Fact. for 31st Oct., 1856,” p. 16.)
    hash: sha256:c08db76a41c5d40b7aea6d78a8fb51af397ed2b2e3d36d7d049fec0973d17cfa
    state: active
  - id: p00353
    type: footnote
    label: "17"
    text: "“The principle of the factory system, then, is to substitute ... the partition of a process into its essential constituents, for the division or graduation of labour among artisans.” (Andrew Ure: “The Philosophy of Manufactures,” Lond., 1835, p. 20.)"
    hash: sha256:5982d05a9c2d69db16daa44be848171fe48c42d3f0b74581b49de1fe32b8718d
    state: active
  - id: p00354
    type: footnote
    label: "18"
    text: The power-loom was at first made chiefly of wood; in its improved modern form it is made of iron. To what an extent the old forms of the instruments of production influenced their new forms at first starting, is shown by, amongst other things, the most superficial comparison of the present power-loom with the old one, of the modern blowing apparatus of a blast-furnace with the first inefficient mechanical reproduction of the ordinary bellows, and perhaps more strikingly than in any other way, by the attempts before the invention of the present locomotive, to construct a locomotive that actually had two feet, which after the fashion of a horse, it raised alternately from the ground. It is only after considerable development of the science of mechanics, and accumulated practical experience, that the form of a machine becomes settled entirely in accordance with mechanical principles, and emancipated from the traditional form of the tool that gave rise to it.
    hash: sha256:07800b319fdd87b4dcb2c42e9b5b234fdab9f645173c739fd97f595f7e68cb62
    state: active
  - id: p00355
    type: footnote
    label: "19"
    text: Eli Whitney’s cotton gin had until very recent times undergone less essential changes than any other machine of the 18th century. It is only during the last decade (i.e., since 1856) that another American, Mr. Emery, of Albany, New York, has rendered Whitney’s gin antiquated by an improvement as simple as it is effective.
    hash: sha256:195e19e6c9920aacaac2a3f12e4bfb6036acf4536c41f175dfece907b91b2a97
    state: active
  - id: p00356
    type: footnote
    label: "20"
    text: "“The Industry of Nations,” Lond., 1855, Part II., p. 239. This work also remarks: ‘Simple and outwardly unimportant as this appendage to lathes may appear, it is not, we believe, averring too much to state, that its influence in improving and extending the use of machinery has been as great as that produced by Watt’s improvements of the steam-engine itself. Its introduction went at once to perfect all machinery, to cheapen it, and to stimulate invention and improvement.”"
    hash: sha256:b25e66bb98562fef76fb79d2273f730a5430ac51c650c3feaa1d5d0a6ae0f2b9
    state: active
  - id: p00357
    type: footnote
    label: "21"
    text: One of these machines, used for forging paddle-wheel shafts in London, is called “Thor.” It forges a shaft of 16½ tons with as much ease as a blacksmith forges a horseshoe.
    hash: sha256:87872053e184ec333f35f43cdfc90a9f794121c90ca0902a4e756e3a24cb8d62
    state: active
  - id: p00358
    type: footnote
    label: "22"
    text: Wood-working machines that are also capable of being employed on a small scale are mostly American inventions.
    hash: sha256:278041ed6575877179130f56a42ea80a7ff0752c1226fb1931989007759297d1
    state: active
  - id: p00359
    type: footnote
    label: "23"
    text: Science, generally speaking, costs the capitalist nothing, a fact that by no means hinders him from exploiting it. The science of others is as much annexed by capital as the labour of others. Capitalistic appropriation and personal appropriation, whether of science or of material wealth, are, however, totally different things. Dr. Ure himself deplores the gross ignorance of mechanical science existing among his dear machinery-exploiting manufacturers, and Liebig can a tale unfold about the astounding ignorance of chemistry displayed by English chemical manufacturers.
    hash: sha256:5189959486765f8c9ac61bbf3fe258d531952ce5b6d4564259e399de18e9635e
    state: active
  - id: p00360
    type: footnote
    label: "24"
    text: Ricardo lays such stress on this effect of machinery (of which, in other connexions, he takes no more notice than he does of the general distinction between the labour process and the process of creating surplus-value), that he occasionally loses sight of the value given up by machines to the product, and puts machines on the same footing as natural forces. Thus “Adam Smith nowhere undervalues the services which the natural agents and machinery perform for us, but he very justly distinguishes the nature of the value which they add to commodities... as they perform their work gratuitously, the assistance which they afford us, adds nothing to value in exchange.” (Ric., l.c., pp. 336, 337.) This observation of Ricardo is of course correct in so far as it is directed against J. B. Say, who imagines that machines render the “service” of creating value which forms a part of “profits.”
    hash: sha256:3713889711c4409692c448db0975f2bb65c9413830dd98df58f28cc26372ed39
    state: active
  - id: p00361
    type: footnote
    label: "25"
    text: "A horse-power is equal to a force of 33,000 foot-pounds per minute, i.e., to a force that raises 33,000 pounds one foot in a minute, or one pound 33,000 feet. This is the horse power meant in the text. In ordinary language, and also here and there in quotations in this work, a distinction is drawn between the “nominal” and the “commercial” or “indicated” horse-power of the same engine. The old or nominal horse-power is calculated exclusively from the length of piston-stroke, and the diameter of the cylinder, and leaves pressure of steam and piston speed out of consideration. It expresses practically this: This engine would be one of 50 horse-power, if it were driven with the same low pressure of steam, and the same slow piston speed, as in the days of Boulton and Watt. But the two latter factors have increased enormously since those days. In order to measure the mechanical force exerted today by an engine, an indicator has been invented which shows the pressure of the steam in the cylinder. The piston speed is easily ascertained. Thus the “indicated” or “commercial” horse-power of an engine is expressed by a mathematical formula, involving diameter of cylinder, length of stroke, piston speed, and steam pressure, simultaneously, and showing what multiple of 33,000 pounds is really raised by the engine in a minute. Hence, one “nominal” horse-power may exert three, four, or even five “indicated” or “real” horse-powers. This observation is made for the purpose of explaining various citations in the subsequent pages. — <i>F. E</i>."
    hash: sha256:0a0d3423e93e5827e993d0eed7ea62666648c1ea37a1ca1014f3706f40096211
    state: active
  - id: p00362
    type: footnote
    label: "26"
    text: The reader who is imbued with capitalist notions will naturally miss here the “interest” that the machine, in proportion to its capital value, adds to the product. It is, however, easily seen that since a machine no more creates new value than any other part of constant capital, it cannot add any value under the name of “interest.” It is also evident that here, where we are treating of the production of surplus-value, we cannot assume <i>a priori</i> the existence of any part of that value under the name of interest. The capitalist mode of calculating, which appears, <i>primâ facie</i>, absurd, and repugnant to the laws of the creation of value, will be explained in the third book of this work.
    hash: sha256:5d43331b528ec2c1c20d5abad70a583c7f37e45af2daab16013d2152cf70b293
    state: active
  - id: p00363
    type: footnote
    label: "27"
    text: "This portion of value which is added by the machinery, decreases both absolutely and relatively, when the machinery does away with horses and other animals that are employed as mere moving forces, and not as machines for changing the form of matter. It may here be incidentally observed, that Descartes, in defining animals as mere machines, saw with eyes of the manufacturing period, while to eyes of the middle ages, animals were assistants to man, as they were later to Von Haller in his “Restauration der Staatswissenschaften.” That Descartes, like Bacon, anticipated an alteration in the form of production, and the practical subjugation of Nature by Man, as a result of the altered methods of thought, is plain from his “Discours de la Méthode.” He there says: “Il est possible (by the methods he introduced in philosophy) de parvenir à des connaissances fort utiles à la vie, et qu’au lieu de cette philosophie spéculative qu’on enseigne dans les écoles, on en peut trouver une pratique, par laquelle, connaissant la force et les actions du feu, de l’eau, de l’air, des astres, et de tous les autres corps qui nous environnent, aussi distinctement que nous connaissons les divers métiers de nos artisans, nous les pourrions employer en même façon à tous les usages auxquels ils sont propres, et ainsi nous rendre comme maîtres et possesseurs de la nature” and thus “contribuer au perfectionnement de la vie humaine.” [It is possible to attain knowledge very useful in life and, in place of the speculative philosophy taught in the schools, one can find a practical philosophy by which, given that we know the powers and the effectiveness of fire, water, air, the stars, and all the other bodies that surround us, as well and as accurately as we know the various trades of our craftsmen, we shall be able to employ them in the same manner as the latter to all uses to which they are adapted, and thus as it were make ourselves the masters and possessors of nature, and thus contributing to the perfection of human life.] In the preface to Sir Dudley North’s “Discourses upon Trade” (1691) it is stated, that Descartes’ method had begun to free Political Economy from the old fables and superstitious notions of gold, trade, &amp;c. On the whole, however, the early English economists sided with Bacon and Hobbes as their philosophers; while, at a later period, the philosopher kat' exochín [dominant] of Political Economy in England, France, and Italy, was Locke."
    hash: sha256:7652541e5ee312c0134cd3e1bf60e4285636875e6ae4b022e27473ac54a22df9
    state: active
  - id: p00364
    type: footnote
    label: "28"
    text: According to the annual report (1863) of the Essen chamber of commerce, there was produced in 1862, at the cast-steel works of Krupp, with its 161 furnaces, thirty-two steam-engines (in the year 1800 this was about the number of all the steam-engines working in Manchester), and fourteen steam-hammers (representing in all 1,236 horse-power) forty-nine forges, 203 tool-machines, and about 2,400 workmen – thirteen million pounds of cast steel. Here there are not two workmen to each horse-power.
