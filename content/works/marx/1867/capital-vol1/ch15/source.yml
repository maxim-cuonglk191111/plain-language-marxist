    text: Mill should have said, “of any human being not fed by other people’s labour,” for, without doubt, machinery has greatly increased the number of well-to-do idlers.
    hash: sha256:aae250d53cfbc28f526952ddf54c98cbdc5235820fd73f9767fdb50bf839e71d
