  - id: p00497
    type: footnote
    label: "156"
    text: "In an appeal made in July, 1866, to the Trade Societies of England, by the shoemakers of Leicester, who had been thrown on the streets by a lock-out, it is stated: “Twenty years ago the Leicester shoe trade was revolutionised by the introduction of riveting in the place of stitching. At that time good wages could be earned. Great competition was shown between the different firms as to which could turn out the neatest article. Shortly afterwards, however a worse kind of competition sprang up, namely, that of underselling one another in the market. The injurious consequences soon manifested themselves in reductions of wages, and so sweepingly quick was the fall in the price of labour, that many firms now pay only one half of the original wages. And yet, though wages sink lower and lower, profits appear, with each alteration in the scale of wages, to increase.” Even bad times are utilised by the manufacturers, for making exceptional profits by excessive lowering of wages, i.e., by a direct robbery of the labourer’s means of subsistence. One example (it has reference to the crisis in the Coventry silk weaving): “From information I have received from manufacturers as well as workmen, there seems to be no doubt that wages have been reduced to a greater extent than either the competition of the foreign producers, or other circumstances have rendered necessary ... the majority of weavers are working at a reduction of 30 to 40 per cent. in their wages. A piece of ribbon for making which the weaver got 6s. or 7s. five years back, now only brings them 3s. 3d. or 3s. 6d.; other work is now priced at 2s. and 2s. 3d. which was formerly priced at 4s. and 4s. 3d. The reduction in wage seems to have been carried to a greater extent than is necessary for increasing demand. Indeed, the reduction in the cost of weaving, in the case of many descriptions of ribbons, has not been accompanied by any corresponding reduction in the selling price of the manufactured article.” (Mr. F. D. Longe’s Report. “Ch. Emp. Com., V. Rep., 1866,” p. 114, 1.)"
    hash: sha256:7c86f6ad1e852fdef8b2d1607271427bbe93979315e73b9cd7d26273be8b9d32
