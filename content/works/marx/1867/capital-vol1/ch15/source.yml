  - id: p00584
    type: footnote
    label: "242"
    text: The “personnel” of this staff consisted of 2 inspectors, 2 assistant inspectors and 41 sub-inspectors. Eight additional sub-inspectors were appointed in 1871. The total cost of administering the Acts in England, Scotland, and Ireland amounted for the year 1871-72 to no more than £25,347, inclusive of the law expenses incurred by prosecutions of offending masters.
    hash: sha256:654dc8b4afa07c6b84a02cfb0c0ab8eed8466439f0c023e025118b595e6590ac
    state: active
  - id: p00585
    type: footnote
    label: "243"
    text: "Robert Owen, the father of Co-operative Factories and Stores, but who, as before remarked, in no way shared the illusions of his followers with regard to the bearing of these isolated elements of transformation, not only practically made the factory system the sole foundation of his experiments, but also declared that system to be theoretically the starting-point of the social revolution. Herr Vissering, Professor of Political Economy in the University of Leyden, appears to have a suspicion of this when, in his “Handboek van Practische Staatshuishoudkunde, 1860-62,” which reproduces all the platitudes of vulgar economy, he strongly supports handicrafts against the factory system.<br/><br/><b>[<i>Added in the 4th German edition</i></b> — The “hopelessly bewildering tangle of contradictory enactments” (S. 314) (present volume, p. 284) which English legislation called into life by means of the mutually conflicting Factory Acts, the Factory Acts Extension Act and the Workshops’ Act, finally became intolerable, and thus all legislative enactments on this subject were codified in the Factory and Workshop Act of 1878. Of course no detailed critique of this English industrial code now in effect can be presented here. The following remarks will have to suffice. The Act comprises:<br/><br/>1) <b>Textile Mills</b>. Here everything remains about as it was: children more than 10 years of age may work 5½ hours a day; or 6 hours and Saturday off; young persons and women, 10 hours on 5 days, and at most 6½ on Saturday.<br/><br/>2) <b>Non-Textile Factories</b>. Here the regulations are brought closer than before to those of No. 1, but there are still several exceptions which favour the capitalists and which in certain cases may be expanded by special permission of the Home Secretary.<br/><br/>3) <b>Workshops</b>, defined approximately as in the former Act; as for the children, young workers and women employed there, the workshops are about on a par with the non-textile factories, but again conditions are easier in details.<br/><br/>4) <b>Workshops</b> in which no children or young workers are employed, but only persons of both sexes above the age of 18; this category enjoy still easier conditions.<br/><br/>5) <b>Domestic Workshops</b>, where only members of the family are employed, in the family dwelling: still more elastic regulations and simultaneously the restriction that the inspector may, without special permission of the ministry or a court, enter only rooms not used also for dwelling purposes; and lastly unrestricted freedom for straw-plaiting and lace and glove-making by members of the family. With all its defects this Act, together with the Swiss Federal Factory Law of March 23, 1877, is still by far the best piece of legislation in this field. A comparison of it with the said Swiss federal law is of particular interest because it clearly demonstrates the merits and demerits of the two legislative methods — the English, “historical” method, which intervenes when occasion requires, and the continental method, which is built up on the traditions of the French Revolution and generalises more. Unfortunately, due to insufficient inspection personnel, the English code is still largely a dead letter with regard to its application to workshops. <i>— F. E.</i>]"
    hash: sha256:897ca704dead0fbfce625b776ff76b2663507b97df40f820d842923c7e9e0516
    state: active
  - id: p00586
    type: footnote
    label: "244"
    text: “You divide the people into two hostile camps of clownish boors and emasculated dwarfs. Good heavens! a nation divided into agricultural and commercial interests, calling itself sane; nay, styling itself enlightened and civilised, not only in spite of, but in consequence of this monstrous and unnatural division.” (David Urquhart, l.c., p. 119.) This passage shows, at one and the same time, the strength and the weakness of that kind of criticism which knows how to judge and condemn the present, but not how to comprehend it.
    hash: sha256:27338ce5017fa2ab2800bb610765ab3d3388c8be7becb7dce264fce0062060a2
    state: active
  - id: p00587
    type: footnote
    label: "245"
    text: "See Liebig: “Die Chemie in ihrer Anwendung auf Agricultur und Physiologie,” 7. Auflage, 1862, and especially the “Einleitung in die Naturgesetze des Feldbaus,” in the 1st Volume. To have developed from the point of view of natural science, the negative, i.e., destructive side of modern agriculture, is one of Liebig’s immortal merits. His summary, too, of the history of agriculture, although not free from gross errors, contains flashes of light. It is, however, to be regretted that he ventures on such haphazard assertions as the following: “By greater pulverising and more frequent ploughing, the circulation of air in the interior of porous soil is aided, and the surface exposed to the action of the atmosphere is increased and renewed; but it is easily seen that the increased yield of the land cannot be proportional to the labour spent on that land, but increases in a much smaller proportion. This law,” adds Liebig, “was first enunciated by John Stuart Mill in his ‘Principles of Pol. Econ.,’ Vol. 1, p. 17, as follows: ‘That the produce of land increases, <i>caeteris paribus</i>, in a diminishing ratio to the increase of the labourers employed’ (Mill here introduces in an erroneous form the law enunciated by Ricardo’s school, for since the ‘decrease of the labourers employed,’ kept even pace in England with the advance of agriculture, the law discovered in, and applied to, England, could have no application to that country, at all events), ‘is the universal law of agricultural industry.’ This is very remarkable, since Mill was ignorant of the reason for this law.” (Liebig, l.c., Bd. I., p. 143 and Note.) Apart from Liebig’s wrong interpretation of the word “labour,” by which word he understands something quite different from what Political Economy does, it is, in any case, “very remarkable” that he should make Mr. John Stuart Mill the first propounder of a theory which was first published by James Anderson in A. Smith’s days, and was repeated in various works down to the beginning of the 19th century; a theory which Malthus, that master in plagiarism (the whole of his population theory is a shameless plagiarism), appropriated to himself in 1815; which West developed at the same time as, and independently of, Anderson; which in the year 1817 was connected by Ricardo with the general theory of value, then made the round of the world as Ricardo’s theory, and in 1820 was vulgarised by James Mill, the father of John Stuart Mill; and which, finally, was reproduced by John Stuart Mill and others, as a dogma already quite commonplace, and known to every schoolboy. It cannot be denied that John Stuart Mill owes his, at all events, “remarkable” authority almost entirely to such <i>quid-pro-quos</i>.<br/><br/>Transcribed by Zodiac<br/>Html Markup by Stephen Baird (1999)"
