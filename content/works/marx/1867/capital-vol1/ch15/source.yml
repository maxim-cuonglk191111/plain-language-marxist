  - id: p00511
    type: footnote
    label: "170"
    text: Mr. Gillott erected in Birmingham the first steel-pen factory on a large scale. It produced, so early as 1851, over 180,000,000 of pens yearly, and consumed 120 tons of steel. Birmingham has the monopoly of this industry in the United Kingdom, and at present produces thousands of millions of steel-pens. According to the Census of 1861, the number of persons employed was 1,428, of whom 1,268 females from 5 years of age upwards.
