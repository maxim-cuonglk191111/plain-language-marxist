    text: “Ch. Empl. Comm. IV. Rep.,” p. 127, n. 56.
    hash: sha256:622ca157c490378dc28d95e281bfdaace5786b322ba758db63122e26dd064c3c
    state: active
  - id: p00549
    type: footnote
    label: "208"
    text: “With respect to the loss of trade by non-completion of shipping orders in time, I remember that this was the pet argument of the factory masters in 1832 and 1833. Nothing that can be advanced now on this subject, could have the force that it had then, before steam had halved all distances and established new regulations for transit. It quite failed at that time of proof when put to the test, and again it will certainly fail should it have to be tried.” (“Reports of Insp. of Fact., 31 Oct., 1862,” pp. 54, 55.)
    hash: sha256:de81c0297cba269187dc639a78f3a367f64ab7ee6483a21832be6b0fbb78f142
    state: active
  - id: p00550
    type: footnote
    label: 208a
    text: “Ch. Empl. Comm. IV. Rep.,” p. xviii, n. 118.
    hash: sha256:8efeacd692a3feba15c9c0288e386216dbc31cb0085ae494b251272f04915121
    state: active
  - id: p00551
    type: footnote
    label: 208b
    text: "John Bellers remarked as far back as 1699: “The uncertainty of fashions does increase necessitous poor. It has two great mischiefs in it. 1st, The journeymen are miserable in winter for want of work, the mercers and master-weavers not daring to lay out their stocks to keep the journeymen employed before the spring comes, and they know what the fashion will then be; 2ndly, In the spring the journeymen are not sufficient, but the master-weavers must draw in many prentices, that they may supply the trade of the kingdom in a quarter or half a year, which robs the plough of hands, drains the country of labourers, and in a great part stocks the city with beggars, and starves some in winter that are ashamed to beg.” (“Essays about the Poor, Manufactures, &amp;c.,” p. 9.)"
    hash: sha256:e949830d246744adff034fa9a86f2f63345311bf8f66a1c73b8765553ac48bdb
    state: active
  - id: p00552
    type: footnote
    label: "209"
    text: “Ch. Empl. Comm. V. Rep.,” p. 171, n. 34.
    hash: sha256:c3180788e2e6a489d616785ce032c490779c2600eda6e0bcb5b64f07c72d114d
    state: active
  - id: p00553
    type: footnote
    label: "210"
    text: "The evidence of some Bradford export-houses is as follows: “Under these circumstances, it seems clear that no boys need be worked longer than from 8 a.m. to 7 or 7.30 p.m., in making up. It is merely a question of extra hands and extra outlay. If some masters were not so greedy, the boys would not work late; an extra machine costs only £16 or £18; much of such over-time as does occur is to be referred to an insufficiency of appliances, and a want of space.” “Ch. Empl, Comm. V. Rep.,” p. 171, n. 35, 36, 38."
    hash: sha256:34f9d1931d73d5717c7e0b66e18a0bc3d00afbfdc82ef8e63c26bf67e60b60d5
    state: active
  - id: p00554
    type: footnote
    label: "211"
    text: "l.c. A London manufacturer, who in other respects looks upon the compulsory regulation of the hours of labour as a protection for the workpeople against the manufacturers, and for the manufacturers themselves against the wholesale trade, states: “The pressure in our business is caused by the shippers, who want, e.g., to send the goods by sailing vessel so as to reach their destination at a given season, and at the same time want to pocket the difference in freight between a sailing vessel and a steamship, or who select the earlier of two steamships in order to be in the foreign market before their competitors.”"
    hash: sha256:421c1ca39e655f80ca236451f46cff62b52c852f4af1994314fd906621324f26
    state: active
  - id: p00555
    type: footnote
    label: "212"
    text: “This could be obviated,” says a manufacturer, “at the expense of an enlargement of the works under the pressure of a General Act of Parliament.” l.c., p. x., n. 38.
    hash: sha256:90bf361fdf51c4f3e97d3de87243c744a04abe2e6280e6087b1b08049bda3ce3
    state: active
  - id: p00556
    type: footnote
    label: "213"
    text: l.c., p. xv., n. 72. sqq.
    hash: sha256:1205b59f9730383841603b4c1f0a8bb440bd4037b28b93bba1ad23f7823c4ac5
    state: active
  - id: p00557
    type: footnote
    label: "214"
    text: “Rep. Insp. Fact., 31st October, 1865,” p. 127.
    hash: sha256:64050f88118755fc25d180554b3cb9f074369c4e19772e253a3c2aa6f0e847bd
    state: active
  - id: p00558
    type: footnote
    label: "215"
    text: It has been found out by experiment, that with each respiration of average intensity made by a healthy average individual, about 25 cubic inches of air are consumed, and that about 20 respirations are made in each minute. Hence the air inhaled in 24 hours by each individual is about 720,000 cubic inches, or 416 cubic feet. It is clear, however, that air which has been once breathed, can no longer serve for the same process until it has been purified in the great workshop of Nature. According to the experiments of Valentin and Brunner, it appears that a healthy man gives off about 1,300 cubic inches of carbonic acid per hour; this would give about 8 ounces of solid carbon thrown off from the lungs in 24 hours. “Every man should have at least 800 cubic feet.” (Huxley.)
    hash: sha256:47cec58b617d07ee0411ea124b16d81c0c36a927b048cd160cf5dca8abc45665
    state: active
  - id: p00559
    type: footnote
    label: "216"
    text: According to the English Factory Act, parents cannot send their children under 14 years of age into Factories under the control of the Act, unless at the same time they allow them to receive elementary education. The manufacturer is responsible for compliance with the Act. “Factory education is compulsory, and it is a condition of labour.” (“Rep. Insp. Fact., 31st Oct., 1865,” p. 111.)
    hash: sha256:5f782e514389ffa9a391931e6df31a77158a852a81fd52761968231926157135
    state: active
  - id: p00560
    type: footnote
    label: "217"
    text: On the very advantageous results of combining gymnastics (and drilling in the case of boys) with compulsory education for factory children and pauper scholars, see the speech of N. W. Senior at the seventh annual congress of “The National Association for the Promotion of Social Science,” in “Report of Proceedings, &amp;c.,” Lond. 1863, pp. 63, 64, also the “Rep. Insp. Fact., 31st Oct., 1865,” pp. 118, 119, 120, 126, sqq.
    hash: sha256:93195159d0d25ad89ab7175099a35a62c7df526e33ddd255a7a9b1704957243b
    state: active
  - id: p00561
    type: footnote
    label: "218"
    text: "“Rep. Insp. Fact., 31st Oct., 1865,” p. 118. A silk manufacturer naively states to the Children’s Employment Commissioners: “I am quite sure that the true secret of producing efficient workpeople is to be found in uniting education and labour from a period of childhood. Of course the occupation must not be too severe, nor irksome, or unhealthy. But of the advantage of the union I have no doubt. I wish my own children could have some work as well as play to give variety to their schooling.” (“Ch. Empl. Comm. V. Rep.,” p. 82, n. 36.)"
    hash: sha256:e5929d2cfb56ca7fb12d8d81236d11a58eb390dcc0f29f8af1419b02f1a73044
    state: active
  - id: p00562
    type: footnote
    label: "219"
    text: Senior, l.c., p. 66. How modern industry, when it has attained to a certain pitch, is capable, by the revolution it effects in the mode of production and in the social conditions of production, of also revolutionising people’s minds, is strikingly shown by a comparison of Senior’s speech in 1863, with his philippic against the Factory Act of 1833; or by a comparison, of the views of the congress above referred to, with the fact that in certain country districts of England poor parents are forbidden, on pain of death by starvation, to educate their children. Thus, e.g., Mr. Snell reports it to be a common occurrence in Somersetshire that, when a poor person claims parish relief, he is compelled to take his children from school. Mr. Wollarton, the clergyman at Feltham, also tells of cases where all relief was denied to certain families “because they were sending their children to school!”
    hash: sha256:338ee5e15a761fadb5fb1fdef1f377bad34e104308ac562b5e11a5fac4adfdf1
    state: active
  - id: p00563
    type: footnote
    label: "220"
    text: Wherever handicraft-machines, driven by men, compete directly or indirectly with more developed machines driven by mechanical power, a great change takes place with regard to the labourer who drives the machine. At first the steam-engine replaces this labourer, afterwards he must replace the steam-engine. Consequently the tension and the amount of labour-power expended become monstrous, and especially so in the case of the children who are condemned to this torture. Thus Mr. Longe; one of the commissioners, found in Coventry and the neighbourhood boys of from 10 to 15 years employed in driving the ribbon-looms, not to mention younger children who had to drive smaller machines. “It is extraordinarily fatiguing work. The boy is a mere substitute for steam power.” (“Ch. Empl. Comm. V, Rep. 1866;” p. 114, n. 6.) As to the fatal consequences of “this system of slavery,” as the official report styles it, see l.c., p. 114 sqq.
    hash: sha256:0419777ce3c7e70d50119bea85b62629d8bac3c96a1e681e099a67ffea47d589
    state: active
  - id: p00564
    type: footnote
    label: "221"
    text: l.c., p. 3, n. 24.
    hash: sha256:7cd28cb94b7f11325b5b54ce702cf174a171d72d880f880e1a221406d089c74a
    state: active
  - id: p00565
    type: footnote
    label: "222"
    text: l.c., P. 7, n. 60.
    hash: sha256:e108cdb4b130c6b55797a2792e5d0365cdf78d4e6333fd2d79deeec45cdd69d7
    state: active
  - id: p00566
    type: footnote
    label: "223"
    text: “In some parts of the Highlands of Scotland, not many years ago, every peasant, according to the Statistical Account, made his own shoes of leather tanned by himself. Many a shepherd and cottar too, with his wife and children, appeared at Church in clothes which had been touched by no hands but their own, since they were shorn from the sheep and sown in the flaxfield. In the preparation of these. it is added, scarcely a single article had been purchased, except the awl, needle, thimble, and a very few parts of the iron-work employed in the weaving. The dyes, toci, were chiefly extracted by the women from trees, shrubs and herbs.” (Dugald Stewart’s “Works,” Hamilton’s Ed., Vol. viii., pp. 327-328.)
    hash: sha256:d9bd38fbd6392499d666f8c144f253542cac96f96276b554f67dc706e4ca82e0
    state: active
  - id: p00567
    type: footnote
    label: "224"
    text: In the celebrated “Livre des métiers” of Etienne Boileau, we find it prescribed that a journeyman on being admitted among the masters had to swear “to love his brethren with brotherly love, to support them in their respective trades, not wilfully to betray the secrets of the trade, and besides, in the interests of all, not to recommend his own wares by calling the attention of the buyer to defects in the articles made by others.”
    hash: sha256:c08b71bfe6e7bfea3e6d3f95c39e1e571c6aebaf370f9fdade5d15a2ddac1edc
    state: active
  - id: p00568
    type: footnote
    label: "225"
    text: "“The bourgeoisie cannot exist without continually revolutionising the instruments of production, and thereby the relations of production and all the social relations. Conservation, in an unaltered form, of the old modes of production was on the contrary the first condition of existence for all earlier industrial classes. Constant revolution in production, uninterrupted disturbance of all social conditions, everlasting uncertainty and agitation, distinguish the bourgeois epoch from all earlier ones. All fixed, fast-frozen relations, with their train of ancient and venerable prejudices and opinions, are swept away, all new formed ones become antiquated before they can ossify. All that is solid melts into air, all that is holy is profaned, and man is at last compelled to face with sober senses his real conditions of life, and his relations with his kind.” (F. Engels und Karl Marx: “Manifest der Kommunistischen Partei.” Lond. 1848, p. 5.)"
    hash: sha256:464c6cb9df56c83ec66ac1fbc54ab74dd002b31752e563080268a544743e6815
    state: active
  - id: p00569
    type: footnote
    label: "226"
    text: <indent level="1"/>“You take my life<br/>When you do take the means whereby I live.”<br/>Shakespeare.
    hash: sha256:4372f2ae41904e37123f4e7763a0ffa6ef0fb1d4a7d4c0f46973477f4ab463b4
    state: active
  - id: p00570
    type: footnote
    label: "227"
    text: "A French workman, on his return from San-Francisco, writes as follows: “I never could have believed, that I was capable of working at the various occupations I was employed on in California. I was firmly convinced that I was fit for nothing but letter-press printing.... Once in the midst of this world of adventurers, who change their occupation as often as they do their shirt, egad, I did as the others. As mining did not turn out remunerative enough, I left it for the town, where in succession I became typographer, slater, plumber, &amp;c. In consequence of thus finding out that I am fit to any sort of work, I feel less of a mollusk and more of a man.” (A. Corbon, “De l’enseignement professionnel,” 2ème ed., p. 50.)"
    hash: sha256:8d4c58bfc0b3e0cb951a465f2adfac1e4bf6893bdff2e3db84f2d62321d6ae75
    state: active
  - id: p00571
    type: footnote
    label: "228"
    text: "John Bellers, a very phenomenon in the history of Political Economy, saw most clearly at the end of the 17th century, the necessity for abolishing the present system of education and division of labour, which beget hypertrophy and atrophy at the two opposite extremities of society. Amongst other things he says this: “An idle learning being little better than the learning of idleness.... Bodily labour, it’s a primitive institution of God.... Labour being as proper for the bodies’ health as eating is for its living; for what pains a man saves by ease, he will find in disease.... Labour adds oil to the lamp of life, when thinking inflames it.... A childish silly employ” (a warning this, by presentiment, against the Basedows and their modern imitators) “leaves the children’s minds silly,” (“Proposals for Raising a Colledge of Industry of all Useful Trades and Husbandry.” Lond., 1696, pp. 12, 14, 18.)"
    hash: sha256:064a3bf733e44bd4247429a06c29e881dff2fdd5b5185a0dd71c5585cc75bf10
    state: active
  - id: p00572
    type: footnote
    label: "229"
    text: This sort of labour goes on mostly in small workshops, as we have seen in the lacemaking and straw-plaiting trades, and as could be shown more in detail from the metal trades of Sheffield, Birmingham, &amp;c.
