  - id: p00437
    type: footnote
    label: "99"
    text: It looks very like intentional misleading by statistics (which misleading it would be possible to prove in detail in other cases too), when the English factory legislation excludes from its operation the class of labourers last mentioned in the text, while the parliamentary returns expressly include in the category of factory operatives, not only engineers, mechanics, &amp;c., but also managers, salesmen, messengers, warehousemen, packers, &amp;c., in short everybody, except the owner of the factory himself.
    hash: sha256:c593dad521e15ce38f69827b89fe65738178ebc78e3402f2a3e18a25ed536ee2
    state: active
  - id: p00438
    type: footnote
    label: "100"
    text: "Ure grants this. He says, “in case of need,” the workmen can be moved at the will of the manager from one machine to another, and he triumphantly exclaims: “Such a change is in flat contradiction with the old routine, that divides the labour, and to one workman assigns the task of fashioning the head of a needle, to another the sharpening of the point.” He had much better have asked himself, why this “old routine” is departed from in the automatic factory, only “in case of need. “"
    hash: sha256:ee7f85b82dd23a843f35ce97103a0411d70bedb556f4ef69408ba83c1e54e331
    state: active
  - id: p00439
    type: footnote
    label: "101"
    text: When distress is very great, as, for instance, during the American Civil War, the factory operative is now and then set by the Bourgeois to do the roughest of work, such as road-making, &amp;c.. The English “ateliers nationaux” [national workshops] of 1862 and the following years, established for the benefit of the destitute cotton operatives, differ from the French of 1848 in this, that in the latter the workmen had to do unproductive work at the expense of the state, in the former they had to do productive municipal work to the advantage of the bourgeois, and that, too, cheaper than the regular workmen, with whom they were thus thrown into competition. “The physical appearance of the cotton operatives is unquestionably improved. This I attribute ... as to the men, to outdoor labour on public works.” (“Rep. of Insp. of Fact., 31st Oct., 1863,” p. 59.) The writer here alludes to the Preston factory operatives, who were employed on Preston Moor.
    hash: sha256:1ae8e9b16524858ffc0a7ffdbff3454e0f4686567627b4b44318b351baaa0436
    state: active
  - id: p00440
    type: footnote
    label: "102"
    text: "An example: The various mechanical apparatus introduced since the Act of 1844 into woollen mills, for replacing the labour of children. So soon as it shall happen that the children of the manufacturers themselves have to go through a course of schooling as helpers in the mill, this almost unexplored territory of mechanics will soon make remarkable progress. “Of machinery, perhaps self-acting mules are as dangerous as any other kind. Most of the accidents from them happen to little children, from their creeping under the mules to sweep the floor whilst the mules are in motion. Several ‘minders’ have been fined for this offence, but without much general benefit. If machine makers would only invent a self-sweeper, by whose use the necessity for these little children to creep under the machinery might be prevented, it would be a happy addition to our protective measures.” (“Reports of Insp. of Fact. for 31st. Oct., 1866,” p. 63.)"
    hash: sha256:2675ff1040a7ef8e4ab3c29b71f84c9342028c265361e6cca575f006264453b2
    state: active
  - id: p00441
    type: footnote
    label: "103"
    text: "So much then for Proudhon’s wonderful idea: he “construes” machinery not as a synthesis of instruments of labour, but as a synthesis of detail operations for the benefit of the labourer himself."
    hash: sha256:4d302d00f5fef7af5d6d452dc42c93ad1ab0b719881f676cb13482c1242db2d9
    state: active
  - id: p00442
    type: footnote
    label: "104"
    text: "F. Engels, l.c., p. 217. Even an ordinary and optimist Free-trader, like Mr. Molinari, goes so far as to say, “Un homme s’use plus vite en surveillant, quinze heures par jour, l’évolution uniforme d’un mécanisme, qu’en exercant, dans le même espace de temps, sa force physique. Ce travail de surveillance qui servirait peut-être d’utile gymnastique à l’intelligence, s’il n’était pas trop prolongé, détruit à la longue, par son excès, et l’intelligence, et le corps même.” [A man becomes exhausted more quickly when he watches over the uniform motion of mechanism for fifteen hours a day, than when he applies his physical strength over the same period of time. This labour of surveillance, which might perhaps serve as a useful exercise for the mind, if it did not go on too long, destroys both the mind and the body in the long run, through excessive application] (G. de Molinari: “Études Économiques.” Paris, 1846.)"
    hash: sha256:69b1c4417b818d50f48c39d61dd529111ca57a751dd3776ed66be872d8d6d08f
    state: active
