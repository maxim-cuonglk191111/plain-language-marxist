    type: footnote
    label: "205"
    text: “Child. Empl. Comm., IV., Rep.,” p. xxxii., “The extension of the railway system is said to have contributed greatly to this custom of giving sudden orders, and the consequent hurry, neglect of meal-times, and late hours of the workpeople.” (l.c., p. xxxi.)
    hash: sha256:1a4e5538141468da561363a18679af765c4b0bc7231595f7c2490d09764713d7
    state: active
