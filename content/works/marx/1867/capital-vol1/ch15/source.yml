  - id: p00537
    type: footnote
    label: "196"
    text: “Tendency to Factory System” (l.c., p. lxvii). “The whole employment is at this time in a state of transition, and is undergoing the same Change as that effected in the lace trade, weaving, &amp;c.” (l.c., n. 405.) “A complete revolution” (l.c., p. xlvi., n. 318). At the date of the Child. Empl. Comm. of 1840 stocking making was still done by manual labour. Since 1846 various sorts of machines have been introduced, which are now driven by steam. The total number of persons of both sexes and of all ages from 3 years upwards, employed in stocking making in England, was in 1862 about 129,000. Of these only 4,063 were, according to the Parliamentary Return of the 11th February, 1862, working under the Factory Acts.
    hash: sha256:5995603449f89a18d696b0b75d0f40befeb0c4eabac03b431ecaf1f0ebe297db
    state: active
  - id: p00538
    type: footnote
    label: "197"
    text: "Thus, e.g., in the earthenware trade, Messrs. Cochrane, of the Britain Pottery, Glasgow, report: “To keep up our quantity we have gone extensively into machines wrought by unskilled labour, and every day convinces us that we can produce a greater quantity than by the old method.” (“Rep. of Insp. of Fact., 31st Oct., 1865,” p. 13.) “The effect of the Fact. Acts is to force on the further introduction of machinery” (l.c., pp. 13-14)."
    hash: sha256:e1163b5e1112d2448c1267a53b232e0d2bf16cdac83852b0d185ee1fad62efa5
    state: active
  - id: p00539
    type: footnote
    label: "198"
    text: Thus, after the extension of the Factory Act to the potteries, great increase of powerjiggers in place of hand-moved jiggers.
    hash: sha256:91c7764e7fefe4e4b662c32b53ac5fa01d7ddc82319a78a01018fbc88b9c17b0
    state: active
  - id: p00540
    type: footnote
    label: "199"
    text: “Report of lnsp. of Fact., 31st Oct., 1865,” pp. 96 and 127.
    hash: sha256:2c08324b4c56864391cc741d571015508f5d77e4bf6fb8e07e3804553d3210e6
    state: active
  - id: p00541
    type: footnote
    label: "200"
    text: The introduction of this and other machinery into match-making caused in one department alone 230 young persons to be replaced by 32 boys and girls of 14 to 17 years of age. This saving in labour was carried still further in 1865, by the employment of steam power.
    hash: sha256:384cbd97eb0a00cfe0b9b523290b2f6aa4a3234fa2f67a7b33d42963d6a95bd8
