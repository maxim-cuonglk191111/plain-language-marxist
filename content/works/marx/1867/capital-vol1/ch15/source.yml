  - id: p00374
    type: footnote
    label: "38"
    text: Dr. Edward Smith, during the cotton crisis caused by the American Civil War, was sent by the English Government to Lancashire, Cheshire, and other places, to report on the sanitary condition of the cotton operatives. He reported, that from a hygienic point of view, and apart from the banishment of the operatives from the factory atmosphere, the crisis had several advantages. The women now had sufficient leisure to give their infants the breast, instead of poisoning them with “Godfrey’s cordial.” They had time to learn to cook. Unfortunately the acquisition of this art occurred at a time when they had nothing to cook. But from this we see how capital, for the purposes of its self-expansion, has usurped the labour necessary in the home of the family. This crisis was also utilised to teach sewing to the daughters of the workmen in sewing schools. An American revolution and a universal crisis, in order that the working girls, who spin for the whole world, might learn to sew!
    hash: sha256:8c4a1afe3c5d86ef90e91f4818e26a1dc890927a8e6fc3b5441e63fe2fcebc27
    state: active
  - id: p00375
    type: footnote
    label: "39"
    text: "“The numerical increase of labourers has been great, through the growing substitution of female for male, and above all, of childish for adult labour. Three girls of 13, at wages of from 6 shillings to 8 shillings a week, have replaced the one man of mature age, of wages varying from 18 shillings to 45 shillings.” (Th. de Quincey: “The Logic of Political Econ.,” London, 1844. Note to p. 147.) Since certain family functions, such as nursing and suckling children, cannot be entirely suppressed, the mothers confiscated by capital, must try substitutes of some sort. Domestic work, such as sewing and mending, must be replaced by the purchase of ready-made articles. Hence, the diminished expenditure of labour in the house is accompanied by an increased expenditure of money. The cost of keeping the family increases, and balances the greater income. In addition to this, economy and judgment in the consumption and preparation of the means of subsistence becomes impossible. Abundant material relating to these facts, which are concealed by official Political Economy, is to be found in the Reports of the Inspectors of Factories, of the Children’s Employment Commission, and more especially in the Reports on Public Health."
    hash: sha256:c51a44a4a09553ee99c3e41b810ba0ad84d0cb7be72a13e3c91de94cd96f0441
    state: active
  - id: p00376
    type: footnote
    label: "40"
    text: In striking contrast with the great fact, that the shortening of the hours of labour of women and children in English factories was exacted from capital by the male operatives, we find in the latest reports of the Children’s Employment Commission traits of the operative parents in relation to the traffic in children, that are truly revolting and thoroughly like slave-dealing. But the Pharisee of a capitalist, as may be seen from the same reports, denounces this brutality which he himself creates, perpetuates, and exploits, and which he moreover baptises “freedom of labour.” “Infant labour has been called into aid ... even to work for their own daily bread. Without strength to endure such disproportionate toil, without instruction to guide their future life, they have been thrown into a situation physically and morally polluted. The Jewish historian has remarked upon the overthrow of Jerusalem by Titus that it was no wonder it should have been destroyed, with such a signal destruction, when an inhuman mother sacrificed her own offspring to satisfy the cravings of absolute hunger.” (“Public Economy Concentrated.” Carlisle, 1833, p. 66.)
    hash: sha256:b85a2ff9acd6e8f94fef4d7a0cd55fcef198475680ee6d81e9c14377a5487493
