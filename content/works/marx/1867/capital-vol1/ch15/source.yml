  - id: p00536
    type: footnote
    label: "195"
    text: "Instances: The Army Clothing Depot at Pimlico, London, the Shirt factory of Tillie and Henderson at Londonderry, and the clothes factory of Messrs. Tait at Limerick which employs about 1,200 hands."
