  - id: p00464
    type: footnote
    label: "126"
    text: l.c., p. 109. The rapid improvement of machinery, during the crisis, allowed the English manufacturers, immediately after the termination of the American Civil War, and almost in no time, to glut the markets of the world again. Cloth, during the last six months of 1866, was almost unsaleable. Thereupon began the consignment of goods to India and China, thus naturally making the glut more intense. At the beginning of 1867 the manufacturers resorted to their usual way out of the difficulty, viz., reducing wages 5 per cent. The workpeople resisted, and said that the only remedy was to work short time, 4 days a-week; and their theory was the correct one. After holding out for some time, the self-elected captains of industry had to make up their minds to short time, with reduced wages in some places, and in others without.
    hash: sha256:71dc87436704ce7e87e1ded39e5ec3d90e4dfde6a64317c92ea67e8ca5a78c40
