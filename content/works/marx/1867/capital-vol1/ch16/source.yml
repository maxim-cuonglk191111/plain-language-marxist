    level: 4
    text: "Part V: The Production of Absolute and of Relative Surplus-Value"
    hash: sha256:905aa52de40b672ca34e3ecb5fe0f3f2064b9e08339097a5f0303597834bc5ed
    state: active
  - id: p00002
    type: heading
    level: 3
    text: "Chapter Sixteen: Absolute and Relative Surplus-Value"
    hash: sha256:952e2bacef31657bd9686091442c0a4eab7f01946de3599d6ebe6adb09c1e8dd
    state: active
  - id: p00003
    type: paragraph
    text: "In considering the labour-process, we began (see Chapter VII.) by treating it in the abstract, apart from its historical forms, as a process between man and Nature. We there stated, “If we examine the whole labour-process, from the point of view of its result, it is plain that both the instruments and the subject of labour are means of production, and that the labour itself is productive labour.” And in Note 2, same page, we further added: “This method of determining, from the standpoint of the labour-process alone, what is productive labour, is by no means directly applicable to the case of the capitalist process of production.” We now proceed to the further development of this subject."
    hash: sha256:13fb6a023821d509b09e649ee56b4d4748d68cdca30b567e36f998fc8ab56be9
    state: active
  - id: p00004
    type: paragraph
    text: So far as the labour-process is purely individual, one and the same labourer unites in himself all the functions, that later on become separated. When an individual appropriates natural objects for his livelihood, no one controls him but himself. Afterwards he is controlled by others. A single man cannot operate upon Nature without calling his own muscles into play under the control of his own brain. As in the natural body head and hand wait upon each other, so the labour-process unites the labour of the hand with that of the head. Later on they part company and even become deadly foes. The product ceases to be the direct product of the individual, and becomes a social product, produced in common by a collective labourer, <i>i.e.</i>, by a combination of workmen, each of whom takes only a part, greater or less, in the manipulation of the subject of their labour. As the co-operative character of the labour-process becomes more and more marked, so, as a necessary consequence, does our notion of productive labour, and of its agent the productive labourer, become extended. In order to labour productively, it is no longer necessary for you to do manual work yourself; enough, if you are an organ of the collective labourer, and perform one of its subordinate functions. The first definition given above of productive labour, a definition deduced from the very nature of the production of material objects, still remains correct for the collective labourer, considered as a whole. But it no longer holds good for each member taken individually.
    hash: sha256:ad7439a11a6ae45ffc673d07df0109b9856814d5d5a73e865058285332b38560
    state: active
  - id: p00005
    type: paragraph
    text: On the other hand, however, our notion of productive labour becomes narrowed. Capitalist production is not merely the production of commodities, it is essentially the production of surplus-value. The labourer produces, not for himself, but for capital. It no longer suffices, therefore, that he should simply produce. He must produce surplus-value. That labourer alone is productive, who produces surplus-value for the capitalist, and thus works for the self-expansion of capital. If we may take an example from outside the sphere of production of material objects, a schoolmaster is a productive labourer when, in addition to belabouring the heads of his scholars, he works like a horse to enrich the school proprietor. That the latter has laid out his capital in a teaching factory, instead of in a sausage factory, does not alter the relation. Hence the notion of a productive labourer implies not merely a relation between work and useful effect, between labourer and product of labour, but also a specific, social relation of production, a relation that has sprung up historically and stamps the labourer as the direct means of creating surplus-value. To be a productive labourer is, therefore, not a piece of luck, but a misfortune. In Book IV, which treats of the history of the theory, it will be more clearly seen, that the production of surplus-value has at all times been made, by classical political economists, the distinguishing characteristic of the productive labourer. Hence their definition of a productive labourer changes with their comprehension of the nature of surplus-value. Thus the Physiocrats insist that only agricultural labour is productive, since that alone, they say, yields a surplus-value. And they say so because, with them, surplus-value has no existence except in the form of rent.
    hash: sha256:77969e8aa42d16fec05b9b61c4d2f87a619321f63d1bb79f70dcb1c081d3d5c3
    state: active
  - id: p00006
    type: paragraph
    text: The prolongation of the working-day beyond the point at which the labourer would have produced just an equivalent for the value of his labour-power, and the appropriation of that surplus-labour by capital, this is production of absolute surplus-value. It forms the general groundwork of the capitalist system, and the starting-point for the production of relative surplus-value. The latter presupposes that the working-day is already divided into two parts, necessary labour, and surplus-labour. In order to prolong the surplus-labour, the necessary labour is shortened by methods whereby the equivalent for the wages is produced in less time. The production of absolute surplus-value turns exclusively upon the length of the working-day; the production of relative surplus-value, revolutionises out and out the technical processes of labour, and the composition of society. It therefore presupposes a specific mode, the capitalist mode of production, a mode which, along with its methods, means, and conditions, arises and develops itself spontaneously on the foundation afforded by the formal subjection of labour to capital. In the course of this development, the formal subjection is replaced by the real subjection of labour to capital.
    hash: sha256:f4e1dbcdd33424690848074fe8119a6aaf1d83a5004ecbbf78942a798ce70211
    state: active
  - id: p00007
    type: paragraph
    text: It will suffice merely to refer to certain intermediate forms, in which surplus-labour is not extorted by direct compulsion from the producer, nor the producer himself yet formally subjected to capital. In such forms capital has not yet acquired the direct control of the labour-process. By the side of independent producers who carry on their handicrafts and agriculture in the traditional old-fashioned way, there stands the usurer or the merchant, with his usurer’s capital or merchant’s capital, feeding on them like a parasite. The predominance, in a society, of this form of exploitation excludes the capitalist mode of production; to which mode, however, this form may serve as a transition, as it did towards the close of the Middle Ages. Finally, as is shown by modern “domestic industry,” some intermediate forms are here and there reproduced in the background of Modern Industry, though their physiognomy is totally changed.
    hash: sha256:fce1a8df72559164eeb7ad7b5b4b2e614da065cd6a5bd34012bc7039a9ec12ff
    state: active
  - id: p00008
    type: paragraph
    text: If, on the one hand, the mere formal subjection of labour to capital suffices for the production of absolute surplus-value, if, <i>e.g.</i>, it is sufficient that handicraftsmen who previously worked on their own account, or as apprentices of a master, should become wage labourers under the direct control of a capitalist; so, on the other hand, we have seen, how the methods of producing relative surplus-value, are, at the same time, methods of producing absolute surplus-value. Nay, more, the excessive prolongation of the working-day turned out to be the peculiar product of Modern Industry. Generally speaking, the specifically capitalist mode of production ceases to be a mere means of producing relative surplus-value, so soon as that mode has conquered an entire branch of production; and still more so, so soon as it has conquered all the important branches. It then becomes the general, socially predominant form of production. As a special method of producing relative surplus-value, it remains effective only, first, in so far as it seizes upon industries that previously were only formally subject to capital, that is, so far as it is propagandist; secondly, in so far as the industries that have been taken over by it, continue to be revolutionised by changes in the methods of production.
    hash: sha256:3f240f43d52d04ff143b93bd2a1cc7f9f180006040d01aed8bd62c26c47b423c
    state: active
  - id: p00009
    type: paragraph
    text: "From one standpoint, any distinction between absolute and relative surplus-value appears illusory. Relative surplus-value is absolute, since it compels the absolute prolongation of the working-day beyond the labour-time necessary to the existence of the labourer himself. Absolute surplus-value is relative, since it makes necessary such a development of the productiveness of labour, as will allow of the necessary labour-time being confined to a portion of the working-day. But if we keep in mind the behaviour of surplus-value, this appearance of identity vanishes. Once the capitalist mode of production is established and become general, the difference between absolute and relative surplus-value makes itself felt, whenever there is a question of raising the rate of surplus-value. Assuming that labour-power is paid for at its value, we are confronted by this alternative: given the productiveness of labour and its normal intensity, the rate of surplus-value can be raised only by the actual prolongation of the working-day; on the other hand, given the length of the working-day, that rise can be effected only by a change in the relative magnitudes of the components of the working-day, viz., necessary labour and surplus-labour; a change which, if the wages are not to fall below the value of labour-power, presupposes a change either in the productiveness or in the intensity of the labour."
    hash: sha256:2254b03508ec4a74b4645175997542c9d3fedf24b4e0ba8f2cc964d9c7cd95c9
    state: active
  - id: p00010
    type: paragraph
    text: If the labourer wants all his time to produce the necessary means of subsistence for himself and his race, he has no time left in which to work gratis for others. Without a certain degree of productiveness in his labour, he has no such superfluous time at his disposal; without such superfluous time, no surplus-labour, and therefore no capitalists, no slave-owners, no feudal lords, in one word, no class of large proprietors. <fn ref="1"/>
    hash: sha256:bf131ad26178f54deabece98fac24710d049996a43258778926705ff8b8765d8
    state: active
  - id: p00011
    type: paragraph
    text: Thus we may say that surplus-value rests on a natural basis; but this is permissible only in the very general sense, that there is no natural obstacle absolutely preventing one man from disburdening himself of the labour requisite for his own existence, and burdening another with it, any more, for instance, than unconquerable natural obstacle prevent one man from eating the flesh of another. <fn ref="2"/> No mystical ideas must in any way be connected, as sometimes happens, with this historically developed productiveness of labour. It is only after men have raised themselves above the rank of animals, when therefore their labour has been to some extent socialised, that a state of things arises in which the surplus-labour of the one becomes a condition of existence for the other. At the dawn of civilisation the productiveness acquired by labour is small, but so too are the wants which develop with and by the means of satisfying them. Further, at that early period, the portion of society that lives on the labour of others is infinitely small compared with the mass of direct producers. Along with the progress in the productiveness of labour, that small portion of society increases both absolutely and relatively. <fn ref="3"/> Besides, capital with its accompanying relations springs up from an economic soil that is the product of a long process of development. The productiveness of labour that serves as its foundation and starting-point, is a gift, not of nature, but of a history embracing thousands of centuries.
    hash: sha256:241850cdf0d30a86e3d9d81678c1d9bc4631c65057e64cfd48e385d1af87c2fc
    state: active
  - id: p00012
    type: paragraph
    text: Apart from the degree of development, greater or less, in the form of social production, the productiveness of labour is fettered by physical conditions. These are all referable to the constitution of man himself (race, &amp;c.), and to surrounding nature. The external physical conditions fall into two great economic classes, (1) Natural wealth in means of subsistence, <i>i.e.</i>, a fruitful soil, waters teeming with fish, &amp;c., and (2), natural wealth in the instruments of labour, such as waterfalls, navigable rivers, wood, metal, coal, &amp;c. At the dawn of civilisation, it is the first class that turns the scale; at a higher stage of development, it is the second. Compare, for example, England with India, or in ancient times, Athens and Corinth with the shores of the Black Sea.
    hash: sha256:bd1574d6892a8ca90306bf59c25e1e71d402f279423f41da8ddecece0dbffe7f
    state: active
  - id: p00013
    type: paragraph
    text: The fewer the number of natural wants imperatively calling for satisfaction, and the greater the natural fertility of the soil and the favourableness of the climate, so much less is the labour-time necessary for the maintenance and reproduction of the producer. So much greater therefore can be the excess of his labours for others over his labour for himself. Diodorus long ago remarked this in relation to the ancient Egyptians.
    hash: sha256:b5648ebecfe6ef2f6468b3d6e5dba7c0551d08989992d99319cfacd5a8e21587
    state: active
  - id: p00014
    type: blockquote
    text: “It is altogether incredible how little trouble and expense the bringing up of their children causes them. They cook for them the first simple food at hand; they also give them the lower part of the papyrus stem to eat, so far as it can be roasted in the fire, and the roots and stalks of marsh plants, some raw, some boiled and roasted. Most of the children go without shoes and unclothed, for the air is so mild. Hence a child, until he is grown up, costs his parents not more, on the whole, than twenty drachmas. It is this, chiefly, which explains why the population of Egypt is so numerous, and, therefore, why so many great works can be undertaken.” <fn ref="4"/>
    hash: sha256:f18f92ad70b6b58dc4bf9a57e794ff8a59b4c3f23b64bc32c52855632c59de1c
    state: active
  - id: p00015
    type: paragraph
    text: Nevertheless the grand structures of ancient Egypt are less due to the extent of its population than to the large proportion of it that was freely disposable. Just as the individual labourer can do more surplus-labour in proportion as his necessary labour-time is less, so with regard to the working population. The smaller the part of it which is required for the production of the necessary means of subsistence, so much the greater is the part that can be set to do other work.
    hash: sha256:c49c6632137cd4f41f34f428171e9d5eee5a38adb4018cbddf3360e248eed55a
    state: active
  - id: p00016
    type: paragraph
    text: Capitalist production once assumed, then, all other circumstances remaining the same, and given the length of the working day, the quantity of surplus-labour will vary with the physical conditions of labour, especially with the fertility of the soil. But it by no means follows from this that the most fruitful soil is the most fitted for the growth of the capitalist mode of production. This mode is based on the dominion of man over nature. Where nature is too lavish, she “keeps him in hand, like a child in leading-strings.” She does not impose upon him any necessity to develop himself. <fn ref="5"/> It is not the tropics with their luxuriant vegetation, but the temperate zone, that is the mother-country of capital. It is not the mere fertility of the soil, but the differentiation of the soil, the variety of its natural products, the changes of the seasons, which form the physical basis for the social division of labour, and which, by changes in the natural surroundings, spur man on to the multiplication of his wants, his capabilities, his means and modes of labour. It is the necessity of bringing a natural force under the control of society, of economising, of appropriating or subduing it on a large scale by the work of man’s hand, that first plays the decisive part in the history of industry. Examples are, the irrigation works in Egypt, <fn ref="6"/> Lombardy, Holland, or in India and Persia where irrigation by means of artificial canals, not only supplies the soil with the water indispensable to it, but also carries down to it, in the shape of sediment from the hills, mineral fertilisers. The secret of the flourishing state of industry in Spain and Sicily under the dominion of the Arabs lay in their irrigation works. <fn ref="7"/>
    hash: sha256:9659d0d1dd5f6e44d8ce9dd8d3839dc2887d3e418db9916fbbcbd2d62713f401
    state: active
  - id: p00017
    type: paragraph
    text: Favourable natural conditions alone, give us only the possibility, never the reality, of surplus-labour, nor, consequently, of surplus-value and a surplus-product. The result of difference in the natural conditions of labour is this, that the same quantity of labour satisfies, in different countries, a different mass of requirements, <fn ref="8"/> consequently, that under circumstances in other respects analogous, the necessary labour-time is different. These conditions affect surplus-labour only as natural limits, <i>i.e.</i>, by fixing the points at which labour for others can begin. In proportion as industry advances, these natural limits recede. In the midst of our West European society, where the labourer purchases the right to work for his own livelihood only by paying for it in surplus-labour, the idea easily takes root that it is an inherent quality of human labour to furnish a surplus-product. <fn ref="9"/> But consider, for example, an inhabitant of the eastern islands of the Asiatic Archipelago, where sago grows wild in the forests.
    hash: sha256:3d656e456f8bb94b98561b287a2e5101f41969dbeaa5b04bc089b4fb7bd3342a
    state: active
  - id: p00018
    type: blockquote
    text: '“When the inhabitants have convinced themselves, by boring a hole in the tree, that the pith is ripe, the trunk is cut down and divided into several pieces, the pith is extracted, mixed with water and filtered: it is then quite fit for use as sago. One tree commonly yields 300 lbs., and occasionally 500 to 600 lbs. There, then, people go into the forests, and cut bread for themselves, just as with us they cut fire-wood.” <fn ref="10"/>'
    hash: sha256:2a08040b83ce03d088cc810b02befba72749392bfced819a2c6929ce37f308c7
    state: active
  - id: p00019
    type: paragraph
    text: Suppose now such an eastern bread-cutter requires 12 working hours a week for the satisfaction of all his wants. Nature’s direct gift to him is plenty of leisure time. Before he can apply this leisure time productively for himself, a whole series of historical events is required; before he spends it in surplus-labour for strangers, compulsion is necessary. If capitalist production were introduced, the honest fellow would perhaps have to work six days a week, in order to appropriate to himself the product of one working day. The bounty of Nature does not explain why he would then have to work 6 days a week, or why he must furnish 5 days of surplus-labour. It explains only why his necessary labour-time would be limited to one day a week. But in no case would his surplus-product arise from some occult quality inherent in human labour.
    hash: sha256:18fc5368a6f7b56aa12bcf2805698f4d12468908d7aff81b1927bc0179ca8b66
    state: active
  - id: p00020
    type: paragraph
    text: Thus, not only does the historically developed social productiveness of labour, but also its natural productiveness, appear to be productiveness of the capital with which that labour is incorporated.
    hash: sha256:7886c1b0a971a8444b1caea82ae4a89bf0e3475d4998b5a38151ab2ae5ef5af4
    state: active
  - id: p00021
    type: paragraph
    text: "Ricardo never concerns himself about the origin of surplus-value. He treats it as a thing inherent in the capitalist mode of production, which mode, in his eyes, is the natural form of social production. Whenever he discusses the productiveness of labour, he seeks in it, not the cause of surplus-value, but the cause that determines the magnitude of that value. On the other hand, his school has openly proclaimed the productiveness of labour to be the originating cause of profit (read: Surplus-value). This at all events is a progress as against the mercantilists who, on their side, derived the excess of the price over the cost of production of the product, from the act of exchange, from the product being sold above its value. Nevertheless, Ricardo’s school simply shirked the problem, they did not solve it. In fact these bourgeois economists instinctively saw, and rightly so, that it is very dangerous to stir too deeply the burning question of the origin of surplus-value. But what are we to think of John Stuart Mill, who, half a century after Ricardo, solemnly claims superiority over the mercantilists, by clumsily repeating the wretched evasions of Ricardo’s earliest vulgarisers?"
    hash: sha256:de18997eb3cb37cd115a88da88d3a32d1d63a572bce6cbf04fdf5d4a0d464c69
    state: active
  - id: p00022
    type: paragraph
    text: "Mill says:"
    hash: sha256:b19d71f90761aad541be01c527d67ca74be485f0b92afd28b438fee1e5fade1b
    state: active
  - id: p00023
    type: blockquote
    text: “The cause of profit is that labour produces more than is required for its support.”
    hash: sha256:cf81d2751cd5b878363b75a164786b244c6e34c8ee276abbeae3e94f70ec9d87
    state: active
  - id: p00024
    type: paragraph
    text: "So far, nothing but the old story; but Mill wishing to add something of his own, proceeds:"
    hash: sha256:530f2215922986367a5f11a882772637b06ffad48c97f235d340ce4d4a06d134
    state: active
  - id: p00025
    type: blockquote
    text: “To vary the form of the theorem; the reason why capital yields a profit, is because food, clothing, materials and tools, last longer than the time which was required to produce them.”
    hash: sha256:4a0fec5feefdecc878e73403bf053d81cac7373ca44b1b2b1e3df8588f9a8fa2
    state: active
  - id: p00026
    type: paragraph
    text: He here confounds the duration of labour-time with the duration of its products. According to this view, a baker whose product lasts only a day, could never extract from his workpeople the same profit, as a machine maker whose products endure for 20 years and more. Of course it is very true, that if a bird’s nest did not last longer than the time it takes in building, birds would have to do without nests.
    hash: sha256:72d319b2ff4f4f1e21c7bd287ea9784af99fa13da3b3126d34bea3b61ed59308
    state: active
  - id: p00027
    type: paragraph
    text: This fundamental truth once established, Mill establishes his own superiority over the mercantilists.
    hash: sha256:349d43e615f06e0febe7b1da3883eeabf7e7d39360972a3100c1a838651c5378
    state: active
  - id: p00028
    type: blockquote
    text: “We thus see,” he proceeds, “that profit arises, not from the incident of exchange, but from the productive power of labour; and the general profit of the country is always what the productive power of labour makes it, whether any exchange takes place or not. If there were no division of employments, there would be no buying or selling, but there would still be profit.”
    hash: sha256:0f81e2f891f7797573ac0dfab2417fc56f1df99f1be1c2103d00d5bb2e567288
    state: active
  - id: p00029
    type: paragraph
    text: For Mill then, exchange, buying and selling, those general conditions of capitalist production, are but an incident, and there would always be profits even without the purchase and sale of labour-power!
    hash: sha256:9079bdf030cfdac3162a4962c666f6e2bf63ed2ebbceae070e04ef4e2ef020c0
    state: active
  - id: p00030
    type: blockquote
    text: “If,” he continues, “the labourers of the country collectively produce twenty per cent more than their wages, profits will be twenty per cent, whatever prices may or may not be.” This is, on the one hand, a rare bit of tautology; for if labourers produce a surplus-value of 20% for the capitalist, his profit will be to the total wages of the labourers as 20:100. On the other hand, it is absolutely false to say that “profits will be 20%.” They will always be less, because they are calculated upon the <i>sum total</i> of the capital advanced. If, for example, the capitalist have advanced £500, of which £4OO is laid out in means of production and £100 in wages, and if the rate of surplus-value be 20%, the rate of profit will be 20:500, <i>i.e.</i>, 4% and not 20%.
    hash: sha256:d5d48216f02812751b7ebf4b4955e7b3bef81b363ea58d4aceb0df8478fd9bbd
    state: active
  - id: p00031
    type: paragraph
    text: Then follows a splendid example of Mill’s method of handling the different historical forms of social production.
    hash: sha256:f6bfb033fd01ec8e1a86ccbe386afd83215eb110dbdc00215262ecbf8d4f2a6a
    state: active
  - id: p00032
    type: blockquote
    text: “I assume, throughout, the state of things which, where the labourers and capitalists are separate classes, prevails, with few exceptions, universally; namely, that the capitalist advances the whole expenses, including the entire remuneration of the labourer.”
    hash: sha256:c4c635f4546d7b7001aba53603543da1895e97e5b9c436ff6f581d4c31433de9
    state: active
  - id: p00033
    type: paragraph
    text: Strange optical illusion to see everywhere a state of things which as yet exists only exceptionally on our earth. <fn ref="11"/> But let us finish — Mill is willing to concede,
    hash: sha256:92d85b00415ee4badfa0ad6a14b85bc39dea3745003b134d73b6b3434d86d80a
    state: active
  - id: p00034
    type: blockquote
    text: "“that he should do so is not a matter of inherent necessity.” On the contrary: “the labourer might wait, until the production is complete, for all that part of his wages which exceeds mere necessaries: and even for the whole, if he has funds in hand sufficient for his temporary support. But in the latter case, the labourer is to that extent really a capitalist in the concern, by supplying a portion of the funds necessary for carrying it on.”"
    hash: sha256:9b974087d975e37ef5667375658ca259fdfd7f9689ce9eb60225e42009a288cb
    state: active
  - id: p00035
    type: paragraph
    text: Mill might have gone further and have added, that the labourer who advances to himself not only the necessaries of life but also the means of production, is in reality nothing but his own wage-labourer. He might also have said that the American peasant proprietor is but a serf who does enforced labour for himself instead of for his lord.
    hash: sha256:729ec676f385e3f65a4bf59c8f2ce698a7cd4f261a0f6d75897886c530fb35c2
    state: active
  - id: p00036
    type: paragraph
    text: After thus proving clearly, that even if capitalist production had no existence, still it would always exist, Mill is consistent enough to show, on the contrary, that it has no existence, even when it does exist.
    hash: sha256:5fc0517be05f1da0d44aeb7dbdc6296ffb396c9e8217ac1371a562ac21a0c200
    state: active
  - id: p00037
    type: blockquote
    text: “And even in the former case” (when the workman is a wage labourer to whom the capitalist advances all the necessaries of life, he the labourer), “may be looked upon in the same light,” (i.e., as a capitalist), “since, contributing his labour at less than the market-price, (!) he may be regarded as lending the difference (?) to his employer and receiving it back with interest, &amp;c.” <fn ref="12"/>
    hash: sha256:bbfc9185ab59a174468a2202c04be9463a6739738686f9231522afe20e4c1384
    state: active
  - id: p00038
    type: paragraph
    text: In reality, the labourer advances his labour gratuitously to the capitalist during, say one week, in order to receive the market price at the end of the week, &amp;c., and it is this which, according to Mill, transforms him into a capitalist. On the level plain, simple mounds look like hills; and the imbecile flatness of the present bourgeoisie is to be measured by the altitude of its great intellects.
    hash: sha256:131ca9f3ffef9584adf8de4ba33b13f8cd4d61bd7d475d8c7473213410541823
    state: active
  - id: p00039
    type: footnote
    label: "1"
    text: “The very existence of the master-capitalists, as a distinct class, is dependent on the productiveness of industry.” (Ramsay, l.c., p. 206.) “If each man’s labour were but enough to produce his own food, there could be no property.” (Ravenstone, l.c. p. 14, 15.)
    hash: sha256:dabbec834e2446aee9387b404c70c29dbae68ccaf59dc5de63fc37e282291a08
    state: active
  - id: p00040
    type: footnote
    label: "2"
    text: According to a recent calculation, there are yet at least 4,000,000 cannibals in those parts of the earth which have already been explored.
    hash: sha256:c76c48882de0083657308a42ef54a1c5397a0be2405b89b2b532901c1a9df5a6
    state: active
  - id: p00041
    type: footnote
    label: "3"
    text: “Among the wild Indians in America, almost everything is the labourer’s, 99 parts of a hundred are to be put upon the account of labour. In England, perhaps, the labourer has not 2/3.” (The Advantages of the East India Trade, &amp;c., p. 73.)
    hash: sha256:ec31b4baecc8fb162832b368bcf5008d3e377866ab20acc8d39609809e78258f
    state: active
  - id: p00042
    type: footnote
    label: "4"
    text: Diodorus, l.c., l. I., c. 80.
    hash: sha256:783ce4af3c219c210da821804f980c5230f64c1cf1baab61bdde8e9b3d43422f
    state: active
  - id: p00043
    type: footnote
    label: "5"
    text: “The first (natural wealth) as it is most noble and advantageous, so doth it make the people careless, proud, and given to all excesses; whereas the second enforceth vigilancy, literature, arts and policy.” (England’s Treasure by Foreign Trade. Or the Balance of our Foreign Trade is the Rule of our Treasure. Written by Thomas Mun of London, merchant, and now published for the common good by his son John Mun. London, 1669, p. 181, 182.) “Nor can I conceive a greater curse upon a body of people, than to be thrown upon a spot of land, where the productions for subsistence and food were, in great measure, spontaneous, and the climate required or admitted little care for raiment and covering... there may be an extreme on the other side. A soil incapable of produce by labour is quite as bad as a soil that produces plentifully without any labour.” (An Inquiry into the Present High Price of Provisions. Lond. 1767, p. 10.)
    hash: sha256:9501ebed1ceadaf63c664f24345289d5aa1ac801672730140dc3a939e5477976
    state: active
  - id: p00044
    type: footnote
    label: "6"
    text: "The necessity for predicting the rise and fall of the Nile created Egyptian astronomy, and with it the dominion of the priests, as directors of agriculture. “Le solstice est le moment de l’année ou commence la crue du Nil, et celui que les Egyptiens ont du observer avec le plus d’attention.... C’était cette année tropique qu’il leur importait de marquer pour se diriger dans leurs opérations agricoles. Ils durent donc chercher dans le ciel un signe apparent de son retour.” [The solstice is the moment of the year when the Nile begins to rise, and it is the moment the Egyptians have had to watch for with the greatest attention ... It was the evolution of the tropical year which they had to establish firmly so as to conduct their agricultural operations in accordance with it. They therefore had to search the heavens for a visible sign of the solstice’s return.] (Cuvier: Discours sur les révolutions du globe, ed. Hoefer, Paris, 1863, p. 141.)"
    hash: sha256:a09c6b571fef2aa7aa29ea58fe3695cc80a25eb37ae3dd746225174b3480fd11
    state: active
  - id: p00045
    type: footnote
    label: "7"
    text: One of the material bases of the power of the state over the small disconnected producing organisms in India, was the regulation of the water supply. The Mahometan rulers of India understood this better than their English successors. It is enough to recall to mind the famine of 1866, which cost the lives of more than a million Hindus in the district of Orissa, in the Bengal presidency.
    hash: sha256:4939104c24c5a3654f0ea3546301ab3324e58b9a9f3db018ef26b64fbbc20089
    state: active
  - id: p00046
    type: footnote
    label: "8"
    text: “There are no two countries which furnish an equal number of the necessaries of life in equal plenty, and with the same quantity of labour. Men’s wants increase or diminish with the severity or temperateness of the climate they live in; consequently, the proportion of trade which the inhabitants of different countries are obliged to carry on through necessity cannot be the same, nor is it practicable to ascertain the degree of variation farther than by the degrees of Heat and Cold; from whence one may make this general conclusion, that the quantity of labour required for a certain number of people is greatest in cold climates, and least in hot ones; for in the former men not only want more clothes, but the earth more cultivating than in the latter.” (An Essay on the Governing Causes of the Natural Rate of Interest. Lond. 1750. p. 60.) The author of this epoch-making anonymous work is J. Massy. Hume took his theory of interest from it.
    hash: sha256:e0db04f4fee9f8a79d5af77aa5319f452446a2297cc291ebe054c6785813b0d3
    state: active
  - id: p00047
    type: footnote
    label: "9"
    text: “Chaque travail doit (this appears also to be part of the <i>droits et devoirs du citoyen</i> [rights and duties of the citizen]) laisser un excédent.” [All labour must leave a surplus] Proudhon.
    hash: sha256:c53a0ba8ab9167a0261ccb3d03a8a6fbc8dc965a881bf2584f6e85348127feb8
