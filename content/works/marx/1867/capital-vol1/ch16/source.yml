    hash: sha256:3dbb5f127ece4b3aadacc0934dcb4cf0e3ec9d7a26d51639602f27918face5dd
    state: active
  - id: p00049
    type: footnote
    label: "11"
    text: In earlier editions of <i>Capital</i> the quotation from John Stuart Mill, “I assume throughout...of the labourer,” had been given incorrectly, the words “where the labourers and capitalists are separate classes” having been left out. Marx, in a letter dated November 28, 1878, pointed this out to Danielson, the Russian translator of <i>Capital</i>, adding:<br/><br/>“The next two sentences, viz. ‘Strange optical illusion to see everywhere a state of things which as yet exists only exceptionally on our earth. But let us finish’ - should be deleted and the following sentence substituted:<br/><br/>“Mr. Mill is good enough to believe that this state of things is not an absolute necessity, even in that economic system in which ‘labourers and capitalists are separate classes.’”<br/><br/>The substance of this note has been taken from the <i>Volksausgabe</i>. The quotation from Mill is from his <i>Principles of Political Economy</i>, Book II, Chap XV, 5.
    hash: sha256:9a7bd4060e10f6aab80c724ba54f4499950d219cbfafb557993d4d637cf85630
    state: active
