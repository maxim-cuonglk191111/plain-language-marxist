    text: "Chapter Eighteen: Various Formula for the Rate of Surplus-Value"
    hash: sha256:42a843a36c7939182c86989e7d6bcb2954f2dbb58a2033135c755e1298b426c0
    state: active
  - id: p00002
    type: paragraph
    text: "We have seen that the rate of surplus-value is represented by the following formulae:"
    hash: sha256:2f748d9b3aac0d36e2c447867f9367e7c8420714c665922766222f816911ff5b
    state: active
  - id: p00003
    type: table
    text: <tr><td rowspan="2"><b>I.</b></td><td>Surplus-value</td><td rowspan="2">(</td><td>s</td><td rowspan="2">)</td><td rowspan="2">=</td><td>Surplus-value</td><td rowspan="2">=</td><td>Surplus-labour</td></tr><tr><td>Variable Capital</td><td>v</td><td>Value of labour-power</td><td>Necessary labour</td></tr>
    hash: sha256:236ab5d50a0a8cc3b0e1cacd2dc1cafc42b9805a05164e9c6e1cd7da0f79a7c3
    state: active
  - id: p00004
    type: paragraph
    text: The two first of these formulae represent, as a ratio of values, that which, in the third, is represented as a ratio of the times during which those values are produced. These formulae, supplementary the one to the other, are rigorously definite and correct. We therefore find them substantially, but not consciously, worked out in classical Political Economy. There we meet with the following derivative formulae.
    hash: sha256:5162a0f01169683d672d7e6720425076b360a49f7cac830e4307f1ec42e23701
    state: active
  - id: p00005
    type: table
    text: <tr><td rowspan="2"><b>II.</b></td><td>Surplus-labour</td><td rowspan="2"></td><td></td><td rowspan="2"></td><td rowspan="2">=</td><td>Surplus-value</td><td rowspan="2">=</td><td>Surplus-product</td></tr><tr><td>Working-day</td><td></td><td>Value of the Product</td><td>Total Product</td></tr>
    hash: sha256:5558b92343827f524363efb729bf2aa1ec5b00947a3f439649838f87d1c35000
    state: active
  - id: p00006
    type: paragraph
    text: One and the same ratio is here expressed as a ratio of labour-times, of the values in which those labour-times are embodied, and of the products in which those values exist. It is of course understood that, by “Value of the Product,” is meant only the value newly created in a working-day, the constant part of the value of the product being excluded.
    hash: sha256:106335c6cab9c45c89fa6875c23fb79758ac2f3cc7a8f226602a0431e70efe97
    state: active
  - id: p00007
    type: paragraph
    text: In all of these formulae (II.), the actual degree of exploitation of labour, or the rate of surplus-value, is falsely expressed. Let the working-day be 12 hours. Then, making the same assumptions as in former instances, the real degree of exploitation of labour will be represented in the following proportions.
    hash: sha256:c62b4d7cbd0a6bdecc961f1e77642fa28e2da55fcdb1654a163bfe55c13d08fc
    state: active
  - id: p00008
    type: table
    text: <tr><td>6 hours surplus-labour</td><td rowspan="2">=</td><td>Surplus-value of 3 sh.</td><td rowspan="2">= 100%</td></tr><tr><td>6 hours necessary labour</td><td>Variable Capital of 3 sh.</td></tr>
    hash: sha256:676ae2f539615de9925b94fc4110758ee97be6f11ba00f5af6aba82cf57edd99
    state: active
  - id: p00009
    type: paragraph
    text: From formulae II. we get very differently,
    hash: sha256:b4911f371cd7b02eccb48be81c51f16079193f704e1495b5b692aa2aff4aaaca
    state: active
  - id: p00010
    type: table
    text: <tr><td>6 hours surplus-labour</td><td rowspan="2">=</td><td>Surplus-value of 3 sh.</td><td rowspan="2">= 50%</td></tr><tr><td>Working-day of 12 hours</td><td>Value created of 6 sh.</td></tr>
    hash: sha256:e42a12aa747ad74c67717905183d45268b6237ba3c8f2a8b10248b59900984b1
    state: active
  - id: p00011
    type: paragraph
    text: 'These derivative formulae express, in reality, only the proportion in which the working-day, or the value produced by it, is divided between capitalist and labourer. If they are to be treated as direct expressions of the degree of self-expansion of capital, the following erroneous law would hold good: Surplus-labour or surplus-value can never reach 100%. <fn ref="1"/> Since the surplus-labour is only an aliquot part of the working-day, or since surplus-value is only an aliquot part of the value created, the surplus-labour must necessarily be always less than the working-day, or the surplus-value always less than the total value created. In order, however, to attain the ratio of 100:100 they must be equal. In order that the surplus-labour may absorb the whole day (i.e., an average day of any week or year), the necessary labour must sink to zero. But if the necessary labour vanish, so too does the surplus-labour, since it is only a function of the former. The ratio'
    hash: sha256:5ee53620c546ffdf012e4f69d4a3aa5eb239671a011460bea423ad021fa81b12
    state: active
  - id: p00012
    type: table
    text: <tr><td>Surplus-labour</td><td rowspan="2">or</td><td>Surplus-value</td></tr><tr><td>Working-day</td><td>Value created</td></tr>
    hash: sha256:0bc3a121141134f1b170a8080e319e47ffd2dea0e6bc2cbfecb97b599b1c7d3e
    state: active
  - id: p00013
    type: paragraph
    text: can therefore never reach the limit 100/100, still less rise to 100 + x/100. But not so the rate of surplus-value, the real degree of exploitation of labour. Take, e.g., the estimate of L. de Lavergne, according to which the English agricultural labourer gets only 1/4, the capitalist (farmer) on the other hand 3/4 of the product <fn ref="2"/> or its value, apart from the question of how the booty is subsequently divided between the capitalist, the landlord, and others. According to this, this surplus-labour of the English agricultural labourer is to his necessary labour as 3:1, which gives a rate of exploitation of 300%.
    hash: sha256:aeda6f0c784e7a37230849e335dc6d488d9e7cb9128368e04893bd5686bcd90c
    state: active
  - id: p00014
    type: paragraph
    text: The favorite method of treating the working-day as constant in magnitude became, through the use of formulae II., a fixed usage, because in them surplus-labour is always compared with a working-day of given length. The same holds good when the repartition of the value produced is exclusively kept in sight. The working-day that has already been realized in given value, must necessarily be a day of given length.
    hash: sha256:f994fbbbfaed2e752afc2ed9daecc35d3154196cef908b480aee8228ec170896
    state: active
  - id: p00015
    type: paragraph
    text: The habit of representing surplus-value and value of labour-power as fractions of the value created — a habit that originates in the capitalist mode of production itself, and whose import will hereafter be disclosed — conceals the very transaction that characterizes capital, namely the exchange of variable capital for living labour-power, and the consequent exclusion of the labourer from the product. Instead of the real fact, we have false semblance of an association, in which labourer and capitalist divide the product in proportion to the different elements which they respectively contribute towards its formation. <fn ref="3"/>
    hash: sha256:d563f199b37f068ed79e7caa59da3b477c12e21ec8c3944ed2f3e99a2a71722f
    state: active
  - id: p00016
    type: paragraph
    text: Moreover, the formulae II. can at any time be reconverted into formulae I. If, for instance, we have
    hash: sha256:e0d0abd20fdf02c6ba38a552a6fa1823a6bd9d0a9383f97c44baa6a886071f1d
    state: active
  - id: p00017
    type: table
    text: <tr><td>Surplus-labour of 6 hours</td></tr><tr><td>Working-day of 12 hours</td></tr>
    hash: sha256:ce26d0bc428cbbfcb0248f38080d83d4efa50988407e4fab0f44a1e774153e61
    state: active
  - id: p00018
    type: paragraph
    text: then the necessary labour-time being 12 hours less the surplus-labour of 6 hours, we get the following result,
    hash: sha256:939196c53ae7c738654794fcf7e058e535725db51271a0b972b4c74171aa5889
    state: active
  - id: p00019
    type: table
    text: <tr><td>Surplus-labour of 6 hours</td><td rowspan="2">=</td><td>100</td></tr><tr><td>Necessary labour of 6 hours</td><td>100</td></tr>
    hash: sha256:4cc52c9bf3e17501f5986caa0de226a1c8fce229e8eab9069cf1c31ccf7bb565
    state: active
  - id: p00020
    type: paragraph
    text: There is a third formula which I have occasionally already anticipated; it is
    hash: sha256:d9503b0e6fb78d41e86172a5863c1d7efaa362624b9e77406808f8f3f580a5e6
    state: active
  - id: p00021
    type: table
    text: <tr><td rowspan="2"><b>III.</b></td><td>Surplus-value</td><td rowspan="2">=</td><td>Surplus-labour</td><td rowspan="2">=</td><td>Unpaid labour</td></tr><tr><td>Value of labour-power</td><td>Necessary labour</td><td>Paid labour</td></tr>
    hash: sha256:a892c786221387f8c271820963ec0e3dfd16a3ab390075fe325269a281dfc9f9
    state: active
  - id: p00022
    type: paragraph
    text: After the investigations we have given above, it is no longer possible to be misled, by the formula
    hash: sha256:0c4fac3cfa30336dc484442c9467bae33b1389ea2154d9fc8c6602db7f33ab8a
    state: active
  - id: p00023
    type: table
    text: <tr><td>Unpaid labour,</td></tr><tr><td>Paid labour</td></tr>
    hash: sha256:3ac66c4d05a3a75e5da4d34bb5d7b0e5b2674aabbfadcbc62661013186a74564
    state: active
  - id: p00024
    type: paragraph
    text: into concluding, that the capitalist pays for labour and not for labour-power. This formula is only a popular expression for
    hash: sha256:f6640ddf72476c1765e5476d2df0dbaa26ecab1338ccbfe8d45af73408ab8636
    state: active
  - id: p00025
    type: table
    text: <tr><td>Surplus-labour,</td></tr><tr><td>Necessary labour</td></tr>
    hash: sha256:c9d98d202b7bda18f13f00ca5aff9b91f23c0efe1f893ff089330fdeb617e97b
    state: active
  - id: p00026
    type: paragraph
    text: The capitalist pays the value, so far as price coincides with value, of the labour-power, and receives in exchange the disposal of the living labour-power itself. His usufruct is spread over two periods. During one the labourer produces a value that is only equal to the value of his labour-power; he produces its equivalent. Thus the capitalist receives in return for his advance of the price of the labour-power, a product ready made in the market. During the other period, the period of surplus-labour, the usufruct of the labour-power creates a value for the capitalist, that costs him no equivalent. <fn ref="4"/> This expenditure of labour-power comes to him gratis. In this sense it is that surplus-labour can be called unpaid labour.
    hash: sha256:1ed956991a5129ad6eb1374ccd492fe6a1fa54c48573c215f2c2c08ba2345634
    state: active
  - id: p00027
    type: paragraph
    text: Capital, therefore, is not only, as Adam Smith says, the command over labour. It is essentially the command over unpaid labour. All surplus-value, whatever particular form (profit, interest, or rent), it may subsequently crystallize into, is in substance the materialization of unpaid labour. The secret of the self-expansion of capital resolves itself into having the disposal of a definite quantity of other people’s unpaid labour.
    hash: sha256:35063b11f527514e48f27df12030bfd5e509ca0467c4d25dc49cab8406dc816f
    state: active
  - id: p00028
    type: footnote
    label: "1"
    text: 'Thus, e.g., in “Dritter Brief an v. Kirchmann von Rodbertus. Widerlegung der Ricardo’schen Lehre von der Grundrente und Begrundung einer neuen Rententheorie". Berlin, 1851. I shall return to this letter later on; in spite of its erroneous theory of rent, it sees through the nature of capitalist production.<br/><br/>NOTE ADDED IN THE 3RD GERMAN EDITION: It may be seen from this how favorably Marx judged his predecessors, whenever he found in them real progress, or new and sound ideas. The subsequent publications of Robertus’ letters to Rud. Meyer has shown that the above acknowledgement by Marx wants restricting to some extent. In those letters this passage occurs:<br/><br/>“Capital must be rescued not only from labour, but from itself, and that will be best effected, by treating the acts of the industrial capitalist as economic and political functions, that have been delegated to him with his capital, and by treating his profit as a form of salary, because we still know no other social organization. But salaries may be regulated, and may also be reduced if they take too much from wages. The irruption of Marx into Society, as I may call his book, must be warded off.... Altogether, Marx’s book is not so much an investigation into capital, as a polemic against the present form of capital, a form which he confounds with the concept itself of capital.”<br/>("Briefe, &amp;c., von Dr. Robertus-Jagetzow, herausgg. von Dr. Rud. Meyer,” Berlin, 1881, I, Bd. P.111, 46. Brief von Rodbertus.) To such ideological commonplaces did the bold attack by Robertus in his “social letters” finally dwindle down. — <i>F.E.</i>'
    hash: sha256:6ed106b6366ae7371bb2a960d426bc9de1f4dd013b8d3b240a54c34c7e8c7367
    state: active
  - id: p00029
    type: footnote
    label: "2"
    text: That part of the product which merely replaces the constant capital advanced is of course left out in this calculation. Mr. L. de Lavergne, a blind admirer of England, is inclined to estimate the share of the capitalist too low, rather than too high.
    hash: sha256:d356b74a8a08a2ec8266be83bd0f3713539fd26460df1d84395b7042506fbbbd
    state: active
  - id: p00030
    type: footnote
    label: "3"
    text: All well-developed forms of capitalist production being forms of cooperation, nothing is, of course, easier, than to make abstraction from their antagonistic character, and to transform them by a word into some form of free association, as is done by A. de labourde in “De l’Esprit d’Association dans tous les intérêts de la communauté". Paris 1818. H. Carey, the Yankee, occasionally performs this conjuring trick with like success, even with the relations resulting from slavery.
    hash: sha256:7554741d7afb481bf58f697687124172678e3caa0c8e3f085eebebac7e1f6855
    state: active
  - id: p00031
    type: footnote
    label: "4"
    text: "Although the Physiocrats could not penetrate the mystery of surplus-value, yet this much was clear to them, viz., that it is “une richesse indépendante et disponible qu’il (the possessor) n’a point achetée et qu’il vend.” [a wealth which is independent and disposable, which he ... has not bought and which he sells] (Turgot: “Réflexions sur la Formation et la Distribution des Richesses,” p.11.)<br/><br/>Transcribed by Zodiac<br/>Html Markup by Stephen Baird (1999)"
    hash: sha256:479d2bdaf8727e94df3da4008b54aae91bfadd2f5faea075ef0c78ec1d2c5df6
    state: active
