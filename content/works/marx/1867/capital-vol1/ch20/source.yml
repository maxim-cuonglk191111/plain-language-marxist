    text: “Report, &amp;c., Relative to the Grievances Complained of by the Journeymen Bakers.” London, 1862, p. 411, and ib. Evidence, notes 479, 359, 27. Anyhow the full-priced bakers, as was mentioned above, and as their spokesman, Bennett, himself admits, make their men “generally begin work at 11 p.m. ... up to 8 o’clock the next morning.... They are then engaged all day long ... as late as 7 o’clock in the evening.” (l.c., p. 22.)<br/><br/>Transcribed by Bill McDorman<br/>Html Markup by Stephen Baird (1999)
