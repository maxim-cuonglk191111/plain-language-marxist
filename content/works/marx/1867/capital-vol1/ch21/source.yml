  - id: p00045
    type: footnote
    label: "19"
    text: In the “London Standard” of October 26, 1861, there is a report of proceedings of the firm of John Bright &amp; Co., before the Rochdale magistrates “to prosecute for intimidation the agents of the Carpet Weavers Trades’ Union. Bright’s partners had introduced new machinery which would turn out 240 yards of carpet in the time and with the labour (!) previously required to produce 160 yards. The workmen had no claim whatever to share in the profits made by the investment of their employer’s capital in mechanical improvements. Accordingly, Messrs. Bright proposed to lower the rate of pay from 1½d. per yard to 1d., leaving the earnings of the men exactly the same as before for the same labour. But there was a nominal reduction, of which the operatives, it is asserted, had not fair warning beforehand.”
    hash: sha256:e6e4cc6a0c552bfa3981e177d61bd3b8c892aca2af086f885911ba929ea10795
    state: active
  - id: p00046
    type: footnote
    label: "20"
    text: “Trades’ Unions, in their desire to maintain wages, endeavor to share in the benefits of improved machinery.” (Quelle horreur!) “... the demanding higher wages, because labour is abbreviated, is in other words the endeavor to establish a duty on mechanical improvements.” (“On Combination of Trades,” new ed., London, 1834, p. 42.)<br/><br/>Transcribed by Bill McDorman<br/>Html Markup by Stephen Baird (1999)
