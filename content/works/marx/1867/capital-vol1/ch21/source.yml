  - id: p00042
    type: footnote
    label: "16"
    text: “Those who are paid by piece-work ... constitute probably four-fifths of the workers in the factories.” “Report of Insp. of Fact.,” 30th April, 1858.
    hash: sha256:f02e079d83bcbe6e6b9f5d45df9bf6370dc4666bf42c01ca708ac60507f3958d
    state: active
  - id: p00043
    type: footnote
    label: "17"
    text: "“The productive power of his spinning-machine is accurately measured, and the rate of pay for work done with it decreases with, though not as, the increase of its productive power.” (Ure, l.c., p. 317.) This last apologetic phrase Ure himself again cancels. The lengthening of the mule causes some increase of labour, he admits. The labour does therefore not diminish in the same ratio as its productivity increases. Further: “By this increase the productive power of the machine will be augmented one-fifth. When this event happens the spinner will not be paid at the same rate for work done as he was before, but as that rate will not be diminished in the ratio of one-fifth, the improvement will augment his money earnings for any given number of hours’ work,” but “the foregoing statement requires a certain modification.... The spinner has to pay something additional for juvenile aid out of his additional sixpence, accompanied by displacing a portion of adults” (l.c., p. 321), which has in no way a tendency to raise wages."
    hash: sha256:644f304f7b2dc32ae077ee15fc100cfc39776809e0b83f90e3cdee1129526256
    state: active
