    label: "37"
    text: "“An Essay on Trade and Commerce,” Lond., 1770, P. 44. <i>The Times</i> of December, 1866, and January, 1867, in like manner published certain outpourings of the heart of the English mine-owner, in which the happy lot of the Belgian miners was pictured, who asked and received no more than was strictly necessary for them to live for their “masters.” The Belgian labourers have to suffer much, but to figure in <i>The Times</i> as model labourers! In the beginning of February, 1867, came the answer: strike of the Belgian miners at Marchienne, put down by powder and lead."
