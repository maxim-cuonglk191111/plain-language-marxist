  - id: p00160
    type: footnote
    label: "41"
    text: "Benjamin Thompson: “Essays, Political, Economical, and Philosophical, &amp;c.,” 3 vols., Lond, 1796-1802, vol. i., p. 294. In his “The State of the Poor, or an History of the Labouring Classes in England, &amp;c.,” Sir F. M. Eden strongly recommends the Rumfordian beggar-soup to workhouse overseers, and reproachfully warns the English labourers that “many poor people, particularly in Scotland, live, and that very comfortably, for months together, upon oat-meal and barley-meal, mixed with only water and salt.” (l. c., vol. i, book i., ch. 2, p. 503.) The same sort of hints in the 19th century. “The most wholesome mixtures of flour having been refused (by the English agricultural labourer)... in Scotland, where education is better, this prejudice is, probably, unknown.” (Charles H. Parry, M. D., “The Question of the Necessity of the Existing Corn Laws Considered.” London, 1816, p. 69.) This same Parry, however, complains that the English labourer is now (1815) in a much worse condition than in Eden’s time (1797.)"
    hash: sha256:92e15ef55c1349e19c3e01c737b9c19281a8f21bc3663f0afaef5e1494374f7d
