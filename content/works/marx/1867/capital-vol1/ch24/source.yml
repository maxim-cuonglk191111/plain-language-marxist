    type: footnote
    label: "28"
    text: "(Senior, “Principes fondamentaux del’Écon. Pol.” trad. Arrivabene. Paris, 1836, p. 308.) This was rather too much for the adherents of the old classical school. “Mr. Senior has substituted for it” (the expression, labour and profit) “the expression labour and Abstinence. He who converts his revenue abstains from the enjoyment which its expenditure would afford him. It is not the capital, but the use of the capital productively, which is the cause of profits.” (John Cazenove, l. c., p. 130, Note.) John St. Mill, on the contrary, accepts on the one hand Ricardo’s theory of profit, and annexes on the other hand Senior’s “remuneration of abstinence.” He is as much at home in absurd contradictions, as he feels at sea in the Hegelian contradiction, the source of all dialectic. It has never occurred to the vulgar economist to make the simple reflexion, that every human action may be viewed, as “abstinence” from its opposite. Eating is abstinence from fasting, walking, abstinence from standing still, working, abstinence from idling, idling, abstinence from working, &amp;c. These gentlemen would do well, to ponder, once in a while, over Spinoza’s: “Determinatio est Negatio.”"
