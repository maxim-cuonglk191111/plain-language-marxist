  - id: p00173
    type: footnote
    label: "54"
    text: I must here remind the reader that the categories, “variable and constant capital,” were first used by me. Political Economy since the time of Adam Smith has confusedly mixed up the essential distinctions involved in these categories, with the mere formal differences, arising out of the process of circulation, of fixed and circulating capital. For further details on this point, see Book II., Part II.
