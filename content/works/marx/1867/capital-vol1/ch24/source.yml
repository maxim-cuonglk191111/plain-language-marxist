  - id: p00166
    type: footnote
    label: "47"
    text: "Classic economy has, on account of a deficient analysis of the labour process, and of the process of creating value, never properly grasped this weighty element of reproduction, as may be seen in Ricardo; he says, <i>e.g.</i>, whatever the change in productive power, “a million men always produce in manufactures the same value.” This is accurate, if the extension and degree of intensity of their labour are given. But it does not prevent (this Ricardo overlooks in certain conclusions he draws) a million men with different powers of productivity in their labour, turning into products very different masses of the means of production, and therefore preserving in their products very different masses of value; in consequence of which the values of the products yielded may vary considerably. Ricardo has, it may be noted in passing, tried in vain to make clear to J. B. Say, by that very example, the difference between use value (which he here calls wealth or material riches) and exchange-value. Say answers: “Quant à la difficulté qu’élève Mr. Ricardo en disant que, par des procédés mieux entendus un million de personnes peuvent produire deux fois, trois fois autant de richesses, sans produire plus de valeurs, cette difficulté n’est pas une lorsque l’on considére, ainsi qu’on le doit, la production comme un échange dans lequel on donne les services productifs de son travail, de sa terre, et de ses capitaux, pour obtenir des produits. C’est par le moyen de ces services productifs, que nous acquérons tous les produits qui sont au monde. Or... nous sommes d’autant plus riches, nos services productifs ont d’autant plus de valeur qu’ils obtiennent dans l’échange appelé production une plus grande quantité de choses utiles.” [As for the difficulty raised by Ricardo when he says that, by using better methods of production, a million people can produce two or three times as much wealth, without producing any more value, this difficulty disappears when one bears in mind, as one should, that production is like an exchange in which a man contributes the productive services of his labour, his land, and his capital, in order to obtain products. It is by means of these productive services that we acquire all the products existing in the world. Therefore ... we are richer, our productive services have the more value, the greater the quantity of useful things they bring in through the exchange which is called production] (J. B. Say, “Lettres à M. Malthus,” Paris, 1820, pp. 168, 169.) The “difficulté” — it exists for him, not for Ricardo — that Say means to clear up is this: Why does not the exchange-value of the use values increase, when their quantity increases in consequence of increased productive power of labour? Answer: the difficulty is met by calling use value, exchange-value, if you please. Exchange-value is a thing that is connected one way or another with exchange. If therefore production is called an exchange of labour and means of production against the product, it is clear as day that you obtain more exchange-value in proportion as the production yields more use value. In other words, the more use values, e.g., stockings, a working-day yields to the stocking-manufacturer, the richer is he in stockings. Suddenly, however, Say recollects that “with a greater quantity” of stockings their “price” (which of course has nothing to do with their exchange-value!) falls “parce que la concurrence les (les producteurs) oblige à donner les produits pour ce qu’ils leur coûtent... [because competition obliges them (the producers) to sell their products for what they cost to make] But whence does the profit come, if the capitalist sells the commodities at cost-price? Never mind! Say declares that, in consequence of increased productivity, every one now receives in return for a given equivalent two pairs of stockings instead of one as before. The result he arrives at, is precisely that proposition of Ricardo that he aimed at disproving. After this mighty effort of thought, he triumphantly apostrophises Malthus in the words: “Telle est, monsieur, la doctrine bien liée, sans laquelle il est impossible, je le déclare, d’expliquer les plus grandes difficultés de l’économie politique, et notamment, comment il se peut qu’une nation soit plus riche lorsque ses produits diminuent de valeur, quoique la richesse soit de la valeur.” [This, Sir, is the well-founded doctrine without which it is impossible, I say, to explain the greatest difficulties in political economy, and, in particular, to explain why it is that a nation can be richer when its products fall in value, even though wealth is value] (l. c., p. 170.) An English economist remarks upon the conjuring tricks of the same nature that appear in Say’s “Lettres”: “Those affected ways of talking make up in general that which M. Say is pleased to call his doctrine and which he earnestly urges Malthus to teach at Hertford, as it is already taught ‘dans plusieurs parties de l’Europe.’ He says, ‘Si vous trouvez une physionomie de paradoxe à toutes ces propositions, voyez les choses qu’elles expriment, et j’ose croire qu’elles vous paraîtront fort simples et fort raisonnables.’ [in numerous parts of Europe ... If all those propositions appear paradoxical to you, look at the things they express, and I venture to believe that they will then appear very simple and very rational] Doubtless, and in consequence of the same process, they will appear everything else, except original.” (“An Inquiry into those Principles Respecting the Nature of Demand, &amp;c.,” pp. 116, 110.)"
    hash: sha256:52a70828f0034b84e446cd66d0d2102caab1455f468517353dbc40ec547e35ab
