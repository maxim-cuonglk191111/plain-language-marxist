    hash: sha256:cda5b9467024ce35aedf49a2a09ea13b733ccb37792b0d12da51bae2290bee50
    state: active
  - id: p00154
    type: footnote
    label: "35"
    text: "“Ricardo says: ‘In different stages of society the accumulation of capital or of the means of employing’ (i.e., exploiting) ‘labour is more or less rapid, and must in all cases depend on the productive powers of labour. The productive powers of labour are generally greatest where there is an abundance of fertile land.’ If, in the first sentence, the productive powers of labour mean the smallness of that aliquot part of any produce that goes to those whose manual labour produced it, the sentence is nearly identical, because the remaining aliquot part is the fund whence capital can, if the <i>owner pleases,</i> be accumulated. But then this does not generally happen, where there is most fertile land.” (“Observations on Certain Verbal Disputes, &amp;c.” pp. 74, 75.)"
