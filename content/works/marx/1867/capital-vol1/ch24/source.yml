  - id: p00136
    type: footnote
    label: "17"
    text: "In spite of his “Logic,” John St. Mill never detects even such faulty analysis as this when made by his predecessors, an analysis which, even from the bourgeois standpoint of the science, cries out for rectification. In every case he registers with the dogmatism of a disciple, the confusion of his master’s thoughts. So here: “The capital itself in the long run becomes entirely wages, and when replaced by the sale of produce becomes wages again.”"
    hash: sha256:fc26ec5302436c8c0c9cd4387622a8e42e387971fce30db6f2ac45c52d3a1158
    state: active
  - id: p00137
    type: footnote
    label: "18"
    text: In his description of the process of reproduction, and of accumulation, Adam Smith, in many ways, not only made no advance, but even lost considerable ground, compared with his predecessors, especially by the Physiocrats. Connected with the illusion mentioned in the text, is the really wonderful dogma, left by him as an inheritance to Political Economy, the dogma, that the price of commodities is made up of wages, profit (interest) and rent, <i>i.e.,</i> of wages and surplus-value. Starting from this basis, Storch naively confesses, “Il est impossible de résoudre le prix nécessaire dans ses éléments les plus simples.” [... it is impossible to resolve the necessary price into its simplest elements] (Storch, l. c., Petersb. Edit., 1815, t. ii., p. 141, note.) A fine science of economy this, which declares it impossible to resolve the price of a commodity into its simplest elements! This point will be further investigated in the seventh part of Book iii.
    hash: sha256:f9545dca423bf11e22f9bea5c6ae69383c571e80f1f67b0f44f133170db80a6d
    state: active
  - id: p00138
    type: footnote
    label: "19"
    text: "The reader will notice, that the word revenue is used in a double sense: first, to designate surplus-value so far as it is the fruit periodically yielded by capital; secondly, to designate the part of that fruit which is periodically consumed by the capitalist, or added to the fund that supplies his private consumption. I have retained this double meaning because it harmonises with the language of the English and French economists."
    hash: sha256:273490db4aa5a6e62b36c2386921336451511e38310fb4586ac5c040009a281e
    state: active
  - id: p00139
    type: footnote
    label: "20"
    text: Taking the usurer, that old-fashioned but ever renewed specimen of the capitalist for his text, Luther shows very aptly that the love of power is an element in the desire to get rich. “The heathen were able, by the light of reason, to conclude that a usurer is a double-dyed thief and murderer. We Christians, however, hold them in such honour, that we fairly worship them for the sake of their money.... Whoever eats up, robs, and steals the nourishment of another, that man commits as great a murder (so far as in him lies) as he who starves a man or utterly undoes him. Such does a usurer, and sits the while safe on his stool, when he ought rather to be hanging on the gallows, and be eaten by as many ravens as he has stolen guilders, if only there were so much flesh on him, that so many ravens could stick their beaks in and share it. Meanwhile, we hang the small thieves.... Little thieves are put in the stocks, great thieves go flaunting in gold and silk.... Therefore is there, on this earth, no greater enemy of man (after the devil) than a gripe-money, and usurer, for he wants to be God over all men. Turks, soldiers, and tyrants are also bad men, yet must they let the people live, and Confess that they are bad, and enemies, and do, nay, must, now and then show pity to some. But a usurer and money-glutton, such a one would have the whole world perish of hunger and thirst, misery and want, so far as in him lies, so that he may have all to himself, and every one may receive from him as from a God, and be his serf for ever. To wear fine cloaks, golden chains, rings, to wipe his mouth, to be deemed and taken for a worthy, pious man .... Usury is a great huge monster, like a werewolf, who lays waste all, more than any Cacus, Gerion or Antus. And yet decks himself out, and would be thought pious, so that people may not see where the oxen have gone, that he drags backwards into his den. But Hercules shall hear the cry of the oxen and of his prisoners, and shall seek Cacus even in cliffs and among rocks, and shall set the oxen loose again from the villain. For Cacus means the villain that is a pious usurer, and steals, robs, eats everything. And will not own that he has done it, and thinks no one will find him out, because the oxen, drawn backwards into his den, make it seem, from their foot-prints, that they have been let out. So the usurer would deceive the world, as though he were of use and gave the world oxen, which he, however, rends, and eats all alone... And since we break on the wheel, and behead highwaymen, murderers and housebreakers, how much more ought we to break on the wheel and kill.... hunt down, curse and behead all usurers.” (Martin Luther, l. c.)
    hash: sha256:6ea570107a2a0435be76935d5532bd672f911739c84b4f6d04b2c378354b9aa9
