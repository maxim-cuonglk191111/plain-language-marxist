  - id: p00175
    type: footnote
    label: "56"
    text: It might be said that not only capital, but also labourers, in the shape of emigrants, are annually exported from England. In the text, however, there is no question of the peculium of the emigrants, who are in great part not labourers. The sons of farmers make up a great part of them. The additional capital annually transported abroad to be put out at interest is in much greater proportion to the annual accumulation than the yearly emigration is to the yearly increase of population.<br/><br/>Transcribed by Zodiac<br/>Html Markup by Stephen Baird (1999)
