    text: "Chapter Twenty-Four: Conversion of Surplus-Value into Capital"
    hash: sha256:1d28cdbda06e029f15f5f0ecc8ae4fa4ada0ee37049f52585c73f9de97021993
    state: active
  - id: p00002
    type: heading
    level: 3
    text: SECTION 1.
    hash: sha256:c1002f77ebde6c40e33d112f193154f94b0f8eb430092cafc15ed1f2d2a38a9f
    state: active
  - id: p00003
    type: heading
    level: 4
    text: CAPITALIST PRODUCTION ON A PROGRESSIVELY INCREASING SCALE. TRANSITION OF THE LAWS OF PROPERTY THAT CHARACTERISE PRODUCTION OF COMMODITIES INTO LAWS OF CAPITALIST APPROPRIATION
    hash: sha256:3fbf85d468992cf8da28e79718daf46cca500b18cbaf1e90470ddb7bb6308456
    state: active
  - id: p00004
    type: paragraph
    text: Hitherto we have investigated how surplus-value emanates from capital; we have now to see how capital arises from surplus-value. Employing surplus-value as capital, reconverting it into capital, is called accumulation of capital. <fn ref="1"/>
    hash: sha256:4888cf8926b42d1bb5368950811c3290120d81fbb4c9c8d8cfb5224737d6e704
    state: active
  - id: p00005
    type: paragraph
    text: First let us consider this transaction from the standpoint of the individual capitalist. Suppose a spinner to have advanced a capital of £10,000, of which four-fifths (£8,000) are laid out in cotton, machinery, &amp;c., and one-fifth (£2,000) in wages. Let him produce 240,000 lbs. of yarn annually, having a value of £12,000. The rate of surplus-value being 100%, the surplus-value lies in the surplus or net product of 40,000 lbs. of yarn, one-sixth of the gross product, with a value of £2,000 which will be realised by a sale. £2,000 is £2,000. We can neither see nor smell in this sum of money a trace of surplus-value. When we know that a given value is surplus-value, we know how its owner came by it; but that does not alter the nature either of value or of money.
    hash: sha256:8679e0790bdeae0970836ab947f47a7a253a6226266e760e834c409f34f78eb9
    state: active
  - id: p00006
    type: paragraph
    text: In order to convert this additional sum of £2,000 into capital, the master-spinner will, all circumstances remaining as before, advance four-fifths of it (£1,600) in the purchase of cotton, &amp;c., and one-fifth (£400) in the purchase of additional spinners, who will find in the market the necessaries of life whose value the master has advanced to them.
    hash: sha256:0604412eb853eacc4b1c5fafb1ce1ac79ea62327405ddad98e9202b1916e3d91
    state: active
  - id: p00007
    type: paragraph
    text: Then the new capital of £2,000 functions in the spinning mill, and brings in, in its turn, a surplus-value of £400.
    hash: sha256:fae18de769da994f03387b3abdc9246b73e128670f0401a4d27674f602e21124
    state: active
  - id: p00008
    type: paragraph
    text: The capital value was originally advanced in the money form. The surplus-value on the contrary is, originally, the value of a definite portion of the gross product. If this gross product be sold, converted into money, the capital value regains its original form. From this moment the capital value and the surplus-value are both of them sums of money, and their reconversion into capital takes place in precisely the same way. The one, as well as the other, is laid out by the capitalist in the purchase of commodities that place him in a position to begin afresh the fabrication of his goods, and this time, on an extended scale. But in order to be able to buy those commodities, he must find them ready in the market.
    hash: sha256:6a606e2b2777e4d9b58a8c7684b0b56c5057aa20c58d602eb710db8a18fc5ceb
    state: active
  - id: p00009
    type: paragraph
    text: His own yarns circulate, only because he brings his annual product to market, as all other capitalists likewise do with their commodities. But these commodities, before coming to market, were part of the general annual product, part of the total mass of objects of every kind, into which the sum of the individual capitals, <i>i.e</i>., the total capital of society, had been converted in the course of the year, and of which each capitalist had in hand only an aliquot part. The transactions in the market effectuate only the interchange of the individual components of this annual product, transfer them from one hand to another, but can neither augment the total annual production, nor alter the nature of the objects produced. Hence the use that can be made of the total annual product, depends entirely upon its own composition, but in no way upon circulation.
    hash: sha256:547d3eb9eaa9881b402f84cb67026182b0c0bf259d5483a7b65ad57c53566bac
    state: active
  - id: p00010
    type: paragraph
    text: The annual production must in the first place furnish all those objects (use values) from which the material components of capital, used up in the course of the year, have to be replaced. Deducting these there remains the net or surplus-product, in which the surplus-value lies. And of what does this surplus-product consist? Only of things destined to satisfy the wants and desires of the capitalist class, things which, consequently, enter into the consumption fund of the capitalists? Were that the case, the cup of surplus-value would be drained to the very dregs, and nothing but simple reproduction would ever take place.
    hash: sha256:ef849b72879c87f96d3910f12c4ad36a4b07eb44db1348676464920d8c978ff9
    state: active
  - id: p00011
    type: paragraph
    text: To accumulate it is necessary to convert a portion of the surplus-product into capital. But we cannot, except by a miracle, convert into capital anything but such articles as can be employed in the labour process (<i>i.e</i>., means of production), and such further articles as are suitable for the sustenance of the labourer (<i>i.e</i>., means of subsistence). Consequently, a part of the annual surplus-labour must have been applied to the production of additional means of production and subsistence, over and above the quantity of these things required to replace the capital advanced. In one word, surplus-value is convertible into capital solely because the surplus-product, whose value it is, already comprises the material elements of new capital. <fn ref="2"/>
    hash: sha256:da2fc57f09b47f119a1ddb6b525263de27d0c59a4a8c6ecaa30f25691d17b18c
    state: active
  - id: p00012
    type: paragraph
    text: Now in order to allow of these elements actually functioning as capital, the capitalist class requires additional labour. If the exploitation of the labourers already employed do not increase, either extensively or intensively, then additional labour-power must be found. For this the mechanism of capitalist production provides beforehand, by converting the working class into a class dependent on wages, a class whose ordinary wages suffice, not only for its maintenance, but for its increase. It is only necessary for capital to incorporate this additional labour-power, annually supplied by the working class in the shape of labourers of all ages, with the surplus means of production comprised in the annual produce, and the conversion of surplus-value into capital is complete. From a concrete point of view, accumulation resolves itself into the reproduction of capital on a progressively increasing scale. The circle in which simple reproduction moves, alters its form, and, to use Sismondi’s expression, changes into a spiral. <fn ref="3"/>
    hash: sha256:3586e1b4e45885ba623be6d76a66f44409ae6e93c1e8421cdde2ee192a511309
    state: active
  - id: p00013
    type: paragraph
    text: "Let us now return to our illustration. It is the old story: Abraham begat Isaac, Isaac begat Jacob, and so on. The original capital of £10,000 brings in a surplus-value of £2,000, which is capitalised. The new capital of £2,000 brings in a surplus-value of £400, and this, too, is capitalised, converted into a second additional capital, which, in its turn, produces a further surplus-value of £80. And so the ball rolls on."
    hash: sha256:8090ecbb0b3b34f335f7a009b69acda47dd1512a2e69cae41719dc35fec441ab
    state: active
  - id: p00014
    type: paragraph
    text: We here leave out of consideration the portion of the surplus-value consumed by the capitalist. Just as little does it concern us, for the moment, whether the additional capital is joined on to the original capital, or is separated from it to function independently; whether the same capitalist, who accumulated it, employs it, or whether he hands it over to another. This only we must not forget, that by the side of the newly-formed capital, the original capital continues to reproduce itself, and to produce surplus-value, and that this is also true of all accumulated capital, and the additional capital engendered by it.
    hash: sha256:ca4c0fc71166b26d1da798b560e37923837343ad3919d299c274be9090e35a72
    state: active
  - id: p00015
    type: paragraph
    text: The original capital was formed by the advance of £10,000. How did the owner become possessed of it? “By his own labour and that of his forefathers,” answer unanimously the spokesmen of Political Economy. <fn ref="4"/> And, in fact, their supposition appears the only one consonant with the laws of the production of commodities.
    hash: sha256:936c3be717b30e7665adb97c25edd8f034b517bf30224d407a114273c5cf8788
    state: active
  - id: p00016
    type: paragraph
    text: But it is quite otherwise with regard to the additional capital of £2,000. How that originated we know perfectly well. There is not one single atom of its value that does not owe its existence to unpaid labour. The means of production, with which the additional labour-power is incorporated, as well as the necessaries with which the labourers are sustained, are nothing but component parts of the surplus-product, of the tribute annually exacted from the working class by the capitalist class. Though the latter with a portion of that tribute purchases the additional labour-power even at its full price, so that equivalent is exchanged for equivalent, yet the transaction is for all that only the old dodge of every conqueror who buys commodities from the conquered with the money he has robbed them of.
    hash: sha256:fb6d395c9a6677d68580ee5b65d2b750ac27a56ac85a12a15a4a907335f6c338
    state: active
  - id: p00017
    type: paragraph
    text: 'If the additional capital employs the person who produced it, this producer must not only continue to augment the value of the original capital, but must buy back the fruits of his previous labour with more labour than they cost. When viewed as a transaction between the capitalist class and the working class, it makes no difference that additional labourers are employed by means of the unpaid labour of the previously employed labourers. The capitalist may even convert the additional capital into a machine that throws the producers of that capital out of work, and that replaces them by a few children. In every case the working class creates by the surplus-labour of one year the capital destined to employ additional labour in the following year. <fn ref="5"/> And this is what is called: creating capital out of capital.'
    hash: sha256:8ea4e368479af1e5693af04040d0845dbb0cf57733dfdde98ffb46170bf96d01
    state: active
  - id: p00018
    type: paragraph
    text: The accumulation of the first additional capital of £2,000 presupposes a value of £10,000 belonging to the capitalist by virtue of his “primitive labour,” and advanced by him. The second additional capital of £400 presupposes, on the contrary, only the previous accumulation of the £2,000, of which the £400 is the surplus-value capitalised. The ownership of past unpaid labour is thenceforth the sole condition for the appropriation of living unpaid labour on a constantly increasing scale. The more the capitalist has accumulated, the more is he able to accumulate.
    hash: sha256:fc598637c5f4642233d1c7ad81cac640674bf352f259de9fef4445340bcd4b6e
    state: active
  - id: p00019
    type: paragraph
    text: In so far as the surplus-value, of which the additional capital, No. 1, consists, is the result of the purchase of labour-power with part of the original capital, a purchase that conformed to the laws of the exchange of commodities, and that, from a legal standpoint, presupposes nothing beyond the free disposal, on the part of the labourer, of his own capacities, and on the part of the owner of money or commodities, of the values that belong to him; in so far as the additional capital, No. 2, &amp;c., is the mere result of No. 1, and, therefore, a consequence of the above conditions; in so far as each single transaction invariably conforms to the laws of the exchange of commodities, the capitalist buying labour-power, the labourer selling it, and we will assume at its real value; in so far as all this is true, it is evident that the laws of appropriation or of private property, laws that are based on the production and circulation of commodities, become by their own inner and inexorable dialectic changed into their very opposite. The exchange of equivalents, the original operation with which we started, has now become turned round in such a way that there is only an apparent exchange. This is owing to the fact, first, that the capital which is exchanged for labour-power is itself but a portion of the product of others’ labour appropriated without an equivalent; and, secondly, that this capital must not only be replaced by its producer, but replaced together with an added surplus. The relation of exchange subsisting between capitalist and labourer becomes a mere semblance appertaining to the process of circulation, a mere form, foreign to the real nature of the transaction, and only mystifying it. The ever repeated purchase and sale of labour-power is now the mere form; what really takes place is this — the capitalist again and again appropriates, without equivalent, a portion of the previously materialised labour of others, and exchanges it for a greater quantity of living labour. At first the rights of property seemed to us to be based on a man’s own labour. At least, some such assumption was necessary since only commodity-owners with equal rights confronted each other, and the sole means by which a man could become possessed of the commodities of others, was by alienating his own commodities; and these could be replaced by labour alone. Now, however, property turns out to be the right, on the part of the capitalist, to appropriate the unpaid labour of others or its product, and to be the impossibility, on the part of the labourer, of appropriating his own product. The separation of property from labour has become the necessary consequence of a law that apparently originated in their identity. <fn ref="6"/>
    hash: sha256:e81869abb12a9d990c6a30c37e55f3d0d272e95915dcd5cb3f59c65d3b06ed3f
    state: active
  - id: p00020
    type: paragraph
    text: Therefore, <fn ref="7"/> however much the capitalist mode of appropriation may seem to fly in the face of the original laws of commodity production, it nevertheless arises, not from a violation, but, on the contrary, from the application of these laws. Let us make this clear once more by briefly reviewing the consecutive phases of motion whose culminating point is capitalist accumulation.
    hash: sha256:cf9fefa7ef58179518528a7204125044f780566673d0b6d3fb2f4bec3ea6e268
    state: active
  - id: p00021
    type: paragraph
    text: We saw, in the first place, that the original conversion of a sum of values into capital was achieved in complete accordance with the laws of exchange. One party to the contract sells his labour-power, the other buys it. The former receives the value of his commodity, whose use value — labour — is thereby alienated to the buyer. Means of production which already belong to the latter are then transformed by him, with the aid of labour equally belonging to him, into a new product which is likewise lawfully his.
    hash: sha256:b7eda7db0e210c242c0448bb075eca351d95846dcc91afef17d7b4c4bd3748a5
    state: active
  - id: p00022
    type: paragraph
    text: "The value of this product includes: first, the value of the used-up means of production. Useful labour cannot consume these means of production without transferring their value to the new product, but, to be saleable, labour-power must be capable of supplying useful labour in the branch of industry in which it is to be employed."
    hash: sha256:8f92512429877d8970d0421e9750b0bc6867d9e5ba6e83edfe79a2c60924c06a
    state: active
  - id: p00023
    type: paragraph
    text: "The value of the new product further includes: the equivalent of the value of the labour-power together with a surplus-value. This is so because the value of the labour-power — sold for a definite length of time, say a day, a week, etc. — is less than the value created by its use during that time. But the worker has received payment for the exchange-value of his labour-power and by so doing has alienated its use value — this being the case in every sale and purchase."
    hash: sha256:a8710e180cf6cd68ab1db2051b60188c1c0d28c5da4fa0c20abc49a4fdc3a95c
    state: active
  - id: p00024
    type: paragraph
    text: The fact that this particular commodity, labour-power, possesses the peculiar use value of supplying labour, and therefore of creating value, cannot affect the general law of commodity production. If, therefore, the magnitude of value advanced in wages is not merely found again in the product, but is found there augmented by a surplus-value, this is not because the seller has been defrauded, for he has really received the value of his commodity; it is due solely to the fact that this commodity has been used up by the buyer.
    hash: sha256:4d6e9da69d743467c7af288877909d7122f26a970e585ae95ea9f7d617654d4b
    state: active
  - id: p00025
    type: paragraph
    text: The law of exchange requires equality only between the exchange-values of the commodities given in exchange for one another. From the very outset it presupposes even a difference between their use values and it has nothing whatever to do with their consumption, which only begins after the deal is closed and executed.
    hash: sha256:95831d6b42b94dbbf990943beaa22984beb79fb061d2252bd7136e2597adbbe7
    state: active
  - id: p00026
    type: paragraph
    text: "Thus the original conversion of money into capital is achieved in the most exact accordance with the economic laws of commodity production and with the right of property derived from them. Nevertheless, its result is:"
    hash: sha256:152397612d4c514c2b55ed807623e30798688e4c7f137b356428b6e1a690ca8d
    state: active
  - id: p00027
    type: paragraph
    text: <indent level="1"/>(1) that the product belongs to the capitalist and not to the worker;
    hash: sha256:2127cf5bd41e35b47c6329c315df1857e69e8072c72ff6719bb9be0a54dead16
    state: active
  - id: p00028
    type: paragraph
    text: <indent level="1"/>(2) that the value of this product includes, besides the value of the capital advanced, a surplus-value which costs the worker labour but the capitalist nothing, and which none the less becomes the legitimate property of the capitalist;
    hash: sha256:fb390caf855f8fcbab65054a2b646f301828195e8bc750242d79e62bb175679b
    state: active
  - id: p00029
    type: paragraph
    text: <indent level="1"/>(3) that the worker has retained his labour-power and can sell it anew if he can find a buyer.
    hash: sha256:c7d39a6f975a4ca50bb808bc16fde84fb8eb92f83255870875f94cb31db7b3a4
    state: active
  - id: p00030
    type: paragraph
    text: Simple reproduction is only the periodical repetition of this first operation; each time money is converted afresh into capital. Thus the law is not broken; on the contrary, it is merely enabled to operate continuously. “Several successive acts of exchange have only made the last represent the first” (Sismondi, “Nouveaux Principes, etc.,” p. 70).
    hash: sha256:dce01bdb38bb5f3638231880632463a638b4ee46d38513fb6b21836449fb9894
    state: active
  - id: p00031
    type: paragraph
    text: And yet we have seen that simple reproduction suffices to stamp this first operation, in so far as it is conceived as an isolated process, with a totally changed character. “Of those who share the national income among themselves, the one side (the workers) acquire every year a fresh right to their share by fresh work; the others (the capitalists) have already acquired, by work done originally, a permanent right to their share” (Sismondi, l. c., pp. 110, 111). It is indeed notorious that the sphere of labour is not the only one in which primogeniture works miracles.
    hash: sha256:c865a2e027c22519d1027ed443511ee2a45bfe557c68eaeb3323b31de26c104c
    state: active
  - id: p00032
    type: paragraph
    text: Nor does it matter if simple reproduction is replaced by reproduction on an extended scale, by accumulation. In the former case the capitalist squanders the whole surplus-value in dissipation, in the latter he demonstrates his bourgeois virtue by consuming only a portion of it and converting the rest into money.
    hash: sha256:e7b926c29264bb3cbac30ed41d74f27e59c4b5e3b27b25c1cfc697b2cc5efe91
    state: active
  - id: p00033
    type: paragraph
    text: "The surplus-value is his property; it has never belonged to anyone else. If he advances it for the purposes of production, the advances made come from his own funds, exactly as on the day when he first entered the market. The fact that on this occasion the funds are derived from the unpaid labour of his workers makes absolutely no difference. If worker B is paid out of the surplus-value which worker A produced, then, in the first place, A furnished that surplus-value without having the just price of his commodity cut by a half-penny, and, in the second place, the transaction is no concern of B’s whatever. What B claims, and has a right to claim, is that the capitalist should pay him the value of his labour-power. “Both were still gainers: the worker because he was advanced the fruits of his labour” (should read: of the unpaid labour of other workers) “before the work was done” (should read: before his own labour had borne fruit); “the employer <i>(le maître),</i> because the labour of this worker was worth more than his wages” (should read: produced more value than the value of his wages). (Sismondi, l. c., p. 135.)"
    hash: sha256:afeab994cd967b2a552d16c29e9783e836663dbce13d2c8510027d672a5b9ae7
    state: active
  - id: p00034
    type: paragraph
    text: To be sure, the matter looks quite different if we consider capitalist production in the uninterrupted flow of its renewal, and if, in place of the individual capitalist and the individual worker, we view in their totality, the capitalist class and the working class confronting each other. But in so doing we should be applying standards entirely foreign to commodity production.
    hash: sha256:560b57821df21d722f8d2d2e772c2c748bd1b7d6d266588c322ab7f82e702a5a
    state: active
  - id: p00035
    type: paragraph
    text: Only buyer and seller, mutually independent, face each other in commodity production. The relations between them cease on the day when the term stipulated in the contract they concluded expires. If the transaction is repeated, it is repeated as the result of a new agreement which has nothing to do with the previous one and which only by chance brings the same seller together again with the same buyer.
    hash: sha256:5af006057254025bc712152313dfc6f2666f66793c0494f6d3f2f081eb6edfe4
    state: active
  - id: p00036
    type: paragraph
    text: If, therefore, commodity production, or one of its associated processes, is to be judged according to its own economic laws, we must consider each act of exchange by itself, apart from any connexion with the act of exchange preceding it and that following it. And since sales and purchases are negotiated solely between particular individuals, it is not admissible to seek here for relations between whole social classes.
    hash: sha256:a2298359a923d30b93ff411407e4b424e7e81fdecbba92c1ac6aab1978628501
    state: active
  - id: p00037
    type: paragraph
    text: However long a series of periodical reproductions and preceding accumulations the capital functioning today may have passed through, it always preserves its original virginity. So long as the laws of exchange are observed in every single act of exchange the mode of appropriation can be completely revolutionised without in any way affecting the property rights which correspond to commodity production. These same rights remain in force both at the outset, when the product belongs to its producer, who, exchanging equivalent for equivalent, can enrich himself only by his own labour, and also in the period of capitalism, when social wealth becomes to an ever-increasing degree the property of those who are in a position to appropriate continually and ever afresh the unpaid labour of others.
    hash: sha256:37af265c41117da886ee68fd69635b9189457b3ae9656fc4b5869866507cc8e5
    state: active
  - id: p00038
    type: paragraph
    text: This result becomes inevitable from the moment there is a free sale, by the labourer himself, of labour-power as a commodity. But it is also only from then onwards that commodity production is generalised and becomes the typical form of production; it is only from then onwards that, from the first, every product is produced for sale and all wealth produced goes through the sphere of circulation. Only when and where wage labour is its basis does commodity production impose itself upon society as a whole; but only then and there also does it unfold all its hidden potentialities. To say that the supervention of wage labour adulterates commodity production is to say that commodity production must not develop if it is to remain unadulterated. To the extent that commodity production, in accordance with its own inherent laws, develops further, into capitalist production, the property laws of commodity production change into the laws of capitalist appropriation. <fn ref="8"/>
    hash: sha256:697ae08623bb6e0d27b640e659909165bc9ed83804577b4872f8d733b3dfbc81
    state: active
  - id: p00039
    type: paragraph
    text: We have seen that even in the case of simple reproduction, all capital, whatever its original source, becomes converted into accumulated capital, capitalised surplus-value. But in the flood of production all the capital originally advanced becomes a vanishing quantity <i>(magnitudo evanescens,</i> in the mathematical sense), compared with the directly accumulated capital, <i>i.e</i>., with the surplus-value or surplus-product that is reconverted into capital, whether it functions in the hands of its accumulator, or in those of others. Hence, Political Economy describes capital in general as “accumulated wealth” (converted surplus-value or revenue), “that is employed over again in the production of surplus-value,” <fn ref="9"/> and the capitalist as “the owner of surplus-value.” <fn ref="10"/> It is merely another way of expressing the same thing to say that all existing capital is accumulated or capitalised interest, for interest is a mere fragment of surplus-value. <fn ref="11"/>
    hash: sha256:bc2568b5cc9349603ca47388b38469b2435989b118be06577159682ebb80fb6e
    state: active
  - id: p00040
    type: heading
    level: 3
    text: SECTION 2.
    hash: sha256:2e368037d943971b588278db2908357ef3ff54fa00e5d1f52c9dcacb65ed3a92
    state: active
  - id: p00041
    type: heading
    level: 4
    text: ERRONEOUS CONCEPTION, BY POLITICAL ECONOMY, OF REPRODUCTION ON A PROGRESSIVELY INCREASING SCALE
    hash: sha256:2f97968a2a11a00c142a12408b93cd0695bf53aadae29bb967c1640eb5d0549e
    state: active
  - id: p00042
    type: paragraph
    text: Before we further investigate accumulation or the reconversion of surplus-value into capital, we must brush on one side an ambiguity introduced by the classical economists.
    hash: sha256:4cd6a1912ad5a7c75c655d9af157a52e0c3427e036a4abd8e6a802f1c0620c00
    state: active
  - id: p00043
    type: paragraph
    text: Just as little as the commodities that the capitalist buys with a part of the surplus-value for his own consumption, serve the purpose of production and of creation of value, so little is the labour that he buys for the satisfaction of his natural and social requirements, productive labour. Instead of converting surplus-value into capital, he, on the contrary, by the purchase of those commodities and that labour, consumes or expends it as revenue. In the face of the habitual mode of life of the old feudal nobility, which, as Hegel rightly says, “consists in consuming what is in hand,” and more especially displays itself in the luxury of personal retainers, it was extremely important for bourgeois economy to promulgate the doctrine that accumulation of capital is the first duty of every citizen, and to preach without ceasing, that a man cannot accumulate, if he eats up all his revenue, instead of spending a good part of it in the acquisition of additional productive labourers, who bring in more than they cost. On the other hand the economists had to contend against the popular prejudice, that confuses capitalist production with hoarding, <fn ref="12"/>and fancies that accumulated wealth is either wealth that is rescued from being destroyed in its existing form, <i>i.e</i>., from being consumed, or wealth that is withdrawn from circulation. Exclusion of money from circulation would also exclude absolutely its self-expansion as capital, while accumulation of a hoard in the shape of commodities would be sheer tomfoolery. <fn ref="13"/> The accumulation of commodities in great masses is the result either of over-production or of a stoppage of circulation. <fn ref="14"/>It is true that the popular mind is impressed by the sight, on the one hand, of the mass of goods that are stored up for gradual consumption by the rich, <fn ref="15"/> and on the other hand, by the formation of reserve stocks; the latter, a phenomenon that is common to all modes of production, and on which we shall dwell for a moment, when we come to analyse circulation. Classical economy is therefore quite right, when it maintains that the consumption of surplus-products by productive, instead of by unproductive labourers, is a characteristic feature of the process of accumulation. But at this point the mistakes also begin. Adam Smith has made it the fashion, to represent accumulation as nothing more than consumption of surplus products by productive labourers, which amounts to saying, that the capitalising of surplus-value consists in merely turning surplus-value into labour-power.
    hash: sha256:f29557fdab888c586f97cd0c03d631d23b0f482248a088ee63e31ddad612ea5d
    state: active
  - id: p00044
    type: paragraph
    text: "Let us see what Ricardo, <i>e.g</i>., says:"
    hash: sha256:648c9d2b594d8e6488551ac05fa04f671b059c337b6b42475ba71952bc5d1131
    state: active
  - id: p00045
    type: blockquote
    text: “It must be understood that all the productions of a country are consumed; but it makes the greatest difference imaginable whether they are consumed by those who reproduce, or by those who do not reproduce another value. When we say that revenue is saved, and added to capital, what we mean is, that the portion of revenue, so said to be added to capital, is consumed by productive instead of unproductive labourers. There can be no greater error than in supposing that capital is increased by non-consumption.” <fn ref="16"/>
    hash: sha256:4063720bf80dd6d6065ade4a3724ed879116864e8f1e5a46bd911cdd8342d3fb
    state: active
  - id: p00046
    type: paragraph
    text: There can be no greater error than that which Ricardo and all subsequent economists repeat after A. Smith, viz., that
    hash: sha256:1b4899b8525c0c00548e1310a8ff410b6a692eb6ad1d4cd6a8a6c91f1fe60ff9
    state: active
  - id: p00047
    type: blockquote
    text: “the part of revenue, of which it is said, it has been added to capital, is consumed by productive labourers.”
    hash: sha256:0bf8084599fd4f168a68b4517a35a5a63881f9e3cb06d5a2be34d67e3c980566
    state: active
  - id: p00048
    type: paragraph
    text: According to this, all surplus-value that is changed into capital becomes variable capital. So far from this being the case, the surplus-value, like the original capital, divides itself into constant capital and variable capital, into means of production and labour-power. Labour-power is the form under which variable capital exists during the process of production. In this process the labour-power is itself consumed by the capitalist while the means of production are consumed by the labour-power in the exercise of its function, labour. At the same time, the money paid for the purchase of the labour-power, is converted into necessaries, that are consumed, not by “productive labour,” but by the “productive labourer.” Adam Smith, by a fundamentally perverted analysis, arrives at the absurd conclusion, that even though each individual capital is divided into a constant and a variable part, the capital of society resolves itself only into variable capital, <i>i.e.</i>, is laid out exclusively in payment of wages. For instance, suppose a cloth manufacturer converts £2,000 into capital. One portion he lays out in buying weavers, the other in woollen yarn, machinery, &amp;c. But the people, from whom he buys the yarn and the machinery, pay for labour with a part of the purchase money, and so on until the whole £2,000 are spent in the payment of wages, <i>i.e.</i>, until the entire product represented by the £2,000 has been consumed by productive labourers. It is evident that the whole gist of this argument lies in the words “and so on,” which send us from pillar to post. In truth, Adam Smith breaks his investigation off, just where its difficulties begin. <fn ref="17"/>
    hash: sha256:92bac488f2739a473cb1f4cbf6a41fb586c36e0ab21f18886245bbdd1d38b864
    state: active
  - id: p00049
    type: paragraph
    text: The annual process of reproduction is easily understood, so long as we keep in view merely the sum total of the year’s production. But every single component of this product must be brought into the market as a commodity, and there the difficulty begins. The movements of the individual capitals, and of the personal revenues, cross and intermingle and are lost in the general change of places, in the circulation of the wealth of society; this dazes the sight, and propounds very complicated problems for solution. In the third part of Book II. I shall give the analysis of the real bearings of the facts. It is one of the great merits of the Physiocrats, that in their <i>Tableau économique</i> they were the first to attempt to depict the annual production in the shape in which it is presented to us after passing through the process of circulation. <fn ref="18"/>
    hash: sha256:ce41b165728896b26a9a7b0901c16d2e87aae662915ed5e3519299c0039961e8
    state: active
  - id: p00050
    type: paragraph
    text: For the rest, it is a matter of course, that Political Economy, acting in the interests of the capitalist class, has not failed to exploit the doctrine of Adam Smith, viz., that the whole of that part of the surplus-product which is converted into capital, is consumed by the working class.
    hash: sha256:60ad8ba68d8228137552cbd3244a12576599024797a8bef545ab8cc1599fb2c1
    state: active
  - id: p00051
    type: heading
    level: 3
    text: SECTION 3.
    hash: sha256:a4db4a1eb6854680d910371a8f0af6ce84464a71a6bc10eef3789d7901288357
    state: active
  - id: p00052
    type: heading
    level: 4
    text: SEPARATION OF SURPLUS-VALUE INTO CAPITAL AND REVENUE. THE ABSTINENCE THEORY
    hash: sha256:2a5a17bb629e865674242cc5e70d04eca55ff067c2a4ff72e43f72a293e6a95b
    state: active
  - id: p00053
    type: paragraph
    text: In the last preceding chapter, we treated surplus-value (or the surplus-product) solely as a fund for supplying the individual consumption of the capitalist. In this chapter we have, so far, treated it solely as a fund for accumulation. It is, however, neither the one nor the other, but is both together. One portion is consumed by the capitalist as revenue, <fn ref="19"/> the other is employed as capital, is accumulated.
    hash: sha256:37a4c4183ea3b4a38335adb9abf6c6ccfc93d38b661fd70f1c1967185f124c50
    state: active
  - id: p00054
    type: paragraph
    text: Given the mass of surplus-value, then, the larger the one of these parts, the smaller is the other. <i>Caeteris paribus</i>, the ratio of these parts determines the magnitude of the accumulation. But it is by the owner of the surplus-value, by the capitalist alone, that the division is made. It is his deliberate act. That part of the tribute exacted by him which he accumulates, is said to be saved by him, because he does not eat it, <i>i.e.</i>, because he performs the function of a capitalist, and enriches himself.
    hash: sha256:3b1ffe62551cff7d96c5c4cca5be4ac65a8481663688b40cade53c1444b72e27
    state: active
  - id: p00055
    type: paragraph
    text: Except as personified capital, the capitalist has no historical value, and no right to that historical existence, which, to use an expression of the witty Lichnowsky, “hasn’t got no date.” And so far only is the necessity for his own transitory existence implied in the transitory necessity for the capitalist mode of production. But, so far as he is personified capital, it is not values in use and the enjoyment of them, but exchange-value and its augmentation, that spur him into action. Fanatically bent on making value expand itself, he ruthlessly forces the human race to produce for production’s sake; he thus forces the development of the productive powers of society, and creates those material conditions, which alone can form the real basis of a higher form of society, a society in which the full and free development of every individual forms the ruling principle. Only as personified capital is the capitalist respectable. As such, he shares with the miser the passion for wealth as wealth. But that which in the miser is a mere idiosyncrasy, is, in the capitalist, the effect of the social mechanism, of which he is but one of the wheels. Moreover, the development of capitalist production makes it constantly necessary to keep increasing the amount of the capital laid out in a given industrial undertaking, and competition makes the immanent laws of capitalist production to be felt by each individual capitalist, as external coercive laws. It compels him to keep constantly extending his capital, in order to preserve it, but extend it he cannot, except by means of progressive accumulation.
    hash: sha256:9c95a24992dfb39fb5be09523655a226ceae556f15fd534c9683c44d7705e129
    state: active
  - id: p00056
    type: paragraph
    text: So far, therefore, as his actions are a mere function of capital — endowed as capital is, in his person, with consciousness and a will — his own private consumption is a robbery perpetrated on accumulation, just as in book-keeping by double entry, the private expenditure of the capitalist is placed on the debtor side of his account against his capital. To accumulate, is to conquer the world of social wealth, to increase the mass of human beings exploited by him, and thus to extend both the direct and the indirect sway of the capitalist. <fn ref="20"/>
    hash: sha256:8cf6ed93edb11b35eb52b7cc2fcce7dbcfc65c81c0581a052f8da434a51214e9
    state: active
  - id: p00057
    type: paragraph
    text: But original sin is at work everywhere. As capitalist production, accumulation, and wealth, become developed, the capitalist ceases to be the mere incarnation of capital. He has a fellow-feeling for his own Adam, and his education gradually enables him to smile at the rage for asceticism, as a mere prejudice of the old-fashioned miser. While the capitalist of the classical type brands individual consumption as a sin against his function, and as “abstinence” from accumulating, the modernised capitalist is capable of looking upon accumulation as “abstinence” from pleasure.
    hash: sha256:e0c2c38c635191a9ec60cbdfd43dbc9c9fb87135aa16a1969c33ada443fe26f0
    state: active
  - id: p00058
    type: blockquote
    text: “Two souls, alas, do dwell with in his breast;<br/>The one is ever parting from the other.” <fn ref="21"/>
    hash: sha256:d63395d18a2b9fda1751e35e95f3130c939cae4a29b23343a13d667491acf9a0
    state: active
  - id: p00059
    type: paragraph
    text: At the historical dawn of capitalist production, — and every capitalist upstart has personally to go through this historical stage — avarice, and desire to get rich, are the ruling passions. But the progress of capitalist production not only creates a world of delights; it lays open, in speculation and the credit system, a thousand sources of sudden enrichment. When a certain stage of development has been reached, a conventional degree of prodigality, which is also an exhibition of wealth, and consequently a source of credit, becomes a business necessity to the “unfortunate” capitalist. Luxury enters into capital’s expenses of representation. Moreover, the capitalist gets rich, not like the miser, in proportion to his personal labour and restricted consumption, but at the same rate as he squeezes out the labour-power of others, and enforces on the labourer abstinence from all life’s enjoyments. Although, therefore, the prodigality of the capitalist never possesses the bona fide character of the open-handed feudal lord’s prodigality, but, on the contrary, has always lurking behind it the most sordid avarice and the most anxious calculation, yet his expenditure grows with his accumulation, without the one necessarily restricting the other. But along with this growth, there is at the same time developed in his breast, a Faustian conflict between the passion for accumulation, and the desire for enjoyment.
    hash: sha256:dbb7de1f3bfbe5387d66e84f88d1e30e71cfbf0f1f35769e34cca5fa12deb59f
    state: active
  - id: p00060
    type: paragraph
    text: "Dr. Aikin says in a work published in 1795:"
    hash: sha256:6a9dae03a009541f4bb0f3eaef7fc3af49501ff8ba250fe5d3eafa0778017327
    state: active
  - id: p00061
    type: blockquote
    text: “The trade of Manchester may be divided into four periods. First, when manufacturers were obliged to work hard for their livelihood.”
    hash: sha256:1bd954e613421cc77c95babd2d4d120c8409a3363d3df99f653a8f06d342ed6c
    state: active
  - id: p00062
    type: paragraph
    text: They enriched themselves chiefly by robbing the parents, whose children were bound as apprentices to them; the parents paid a high premium, while the apprentices were starved. On the other hand, the average profits were low, and to accumulate, extreme parsimony was requisite. They lived like misers and were far from consuming even the interest on their capital.
    hash: sha256:b4b718b31d719c8db167c519965c5b3bb357fe1cb2f8364eb0fa6dce05a79bbb
    state: active
  - id: p00063
    type: blockquote
    text: “The second period, when they had begun to acquire little fortunes, but worked as hard as before,” — for direct exploitation of labour costs labour, as every slave-driver knows — “and lived in as plain a manner as before.... The third, when luxury began, and the trade was pushed by sending out riders for orders into every market town in the Kingdom.... It is probable that few or no capitals of £3,000 to £4,000 acquired by trade existed here before 1690. However, about that time, or a little later, the traders had got money beforehand, and began to build modern brick houses, instead of those of wood and plaster.”
    hash: sha256:b1d7a09796a8ffd52987f1a30729895f230163516651ec83ec73704b95392199
    state: active
  - id: p00064
    type: paragraph
    text: Even in the early part of the 18th century, a Manchester manufacturer, who placed a pint of foreign wine before his guests, exposed himself to the remarks and headshakings of all his neighbours. Before the rise of machinery, a manufacturer’s evening expenditure at the public house where they all met, never exceeded sixpence for a glass of punch, and a penny for a screw of tobacco. It was not till 1758, and this marks an epoch, that a person actually engaged in business was seen with an equipage of his own.
    hash: sha256:af6f24e13942a7e3564169822f48e21e9bd4aa309d626cc94a5040520f65b764
    state: active
  - id: p00065
    type: blockquote
    text: “The fourth period,” the last 30 years of the 18th century, “is that in which expense and luxury have made great progress, and was supported by a trade extended by means of riders and factors through every part of Europe.” <fn ref="22"/>
    hash: sha256:3a8086af27423cf406b36bfdfe1939820e47dcb4efba6f8b3742dd2883a8fe8e
    state: active
  - id: p00066
    type: paragraph
    text: What would the good Dr. Aikin say if he could rise from his grave and see the Manchester of today?
    hash: sha256:8fb9dc8d337fa719515a5ad6c1ae7fd28d2dccafc25f2638957f7c14bdb93df7
    state: active
  - id: p00067
    type: paragraph
    text: 'Accumulate, accumulate! That is Moses and the prophets! “Industry furnishes the material which saving accumulates.” <fn ref="23"/> Therefore, save, save, <i>i.e.</i>, reconvert the greatest possible portion of surplus-value, or surplus-product into capital! Accumulation for accumulation’s sake, production for production’s sake: by this formula classical economy expressed the historical mission of the bourgeoisie, and did not for a single instant deceive itself over the birth-throes of wealth. <fn ref="24"/> But what avails lamentation in the face of historical necessity? If to classical economy, the proletarian is but a machine for the production of surplus-value; on the other hand, the capitalist is in its eyes only a machine for the conversion of this surplus-value into additional capital. Political Economy takes the historical function of the capitalist in bitter earnest. In order to charm out of his bosom the awful conflict between the desire for enjoyment and the chase after riches, Malthus, about the year 1820, advocated a division of labour, which assigns to the capitalist actually engaged in production, the business of accumulating, and to the other sharers in surplus-value, to the landlords, the place-men, the beneficed clergy, &amp;c., the business of spending. It is of the highest importance, he says,'
    hash: sha256:41b2ed2e2fe2afa63eb2dbfc37313f06873bc6120d125ead68053d0518df2f93
    state: active
  - id: p00068
    type: blockquote
    text: “to keep separate the passion for expenditure and the passion for accumulation.” <fn ref="25"/>
    hash: sha256:8dbcf4333bc7755b505e9c1a10e2236c3e1cbf11f7d504a34795449837185450
    state: active
  - id: p00069
    type: paragraph
    text: The capitalists having long been good livers and men of the world, uttered loud cries. What, exclaimed one of their spokesmen, a disciple of Ricardo, Mr. Malthus preaches high rents, heavy taxes, &amp;c., so that the pressure of the spur may constantly be kept on the industrious by unproductive consumers! By all means, production, production on a constantly increasing scale, runs the shibboleth; but
    hash: sha256:ec69610cae5065efbfbbaa4cbe0f273c3e3195f988aa24bb988d46e3e624bd29
    state: active
  - id: p00070
    type: blockquote
    text: “production will, by such a process, be far more curbed in than spurred on. Nor is it quite fair thus to maintain in idleness a number of persons, only to pinch others, who are likely, from their characters, if you can force them to work, to work with success.” <fn ref="26"/>
    hash: sha256:608d754e52e176b96fe50d4daf8b1ff8046c5108ef923fed48f10f15e9d2adbf
    state: active
  - id: p00071
    type: paragraph
    text: Unfair as he finds it to spur on the industrial capitalist, by depriving his bread of its butter, yet he thinks it necessary to reduce the labourer’s wages to a minimum "to keep him industrious.” Nor does he for a moment conceal the fact, that the appropriation of unpaid labour is the secret of surplus-value.
    hash: sha256:698006283ff7afe5f87aff9e4055a7794ac5432eb66ebec664a7ba8c3236ac0f
    state: active
  - id: p00072
    type: blockquote
    text: “Increased demand on the part of the labourers means nothing more than their willingness to take less of their own product for themselves, and leave a greater part of it to their employers; and if it be said, that this begets glut, by lessening consumption” (on the part of the labourers), “I can only reply that glut is synonymous with large profits.” <fn ref="27"/>
    hash: sha256:59942d96d59df9f050ff71793bde677ecf791121c88274a867de5beff5ed29b6
    state: active
  - id: p00073
    type: paragraph
    text: The learned disputation, how the booty pumped out of the labourer may be divided, with most advantage to accumulation, between the industrial capitalist and the rich idler, was hushed in face of the revolution of July. Shortly afterwards, the town proletariat at Lyons sounded the tocsin of revolution, and the country proletariat in England began to set fire to farm-yards and corn-stacks. On this side of the Channel Owenism began to spread; on the other side, St. Simonism and Fourierism. The hour of vulgar economy had struck. Exactly a year before Nassau W. Senior discovered at Manchester, that the profit (including interest) of capital is the product of the last hour of the twelve, he had announced to the world another discovery.
    hash: sha256:7dc4b8e1e8228fbfc7ece8ddcf6a7afe12aaed74601c25d299dc4535f2330b92
    state: active
  - id: p00074
    type: blockquote
    text: “I substitute,” he proudly says, “for the word capital, considered as an instrument of production, the word abstinence.”
    hash: sha256:18d0a410864f9a516b018928a65243a8b4e156bdd3518c9d99cef688a6393671
    state: active
  - id: p00075
    type: paragraph
    text: An unparalleled sample this, of the discoveries of vulgar economy! It substitutes for an economic category, a sycophantic phrase — <i>voilà tout.</i> [that’s all]
    hash: sha256:52f3df7081d3f3679b02f953f3c22039151f779123a14e5be38b1434da59548c
    state: active
  - id: p00076
    type: blockquote
    text: “When the savage,” says Senior, “makes bows, he exercises an industry, but he does not practise abstinence.” <fn ref="28"/>
    hash: sha256:bdd228e8857e421fcde6d95b366cf5796c41330052726bccfb320e43e61fb650
    state: active
  - id: p00077
    type: paragraph
    text: This explains how and why, in the earlier states of society, the implements of labour were fabricated without abstinence on the part of the capitalist.
    hash: sha256:bf7296ec59ae11d680d2ce52e66901a9fd791992e41a659f8ffe1092ed1b7ffa
    state: active
  - id: p00078
    type: blockquote
    text: “The more society progresses, the more abstinence is demanded,” <fn ref="29"/>
    hash: sha256:94eebd3c1b7456cb30c9e59861a2ad1f5cfa12b70465cd53930ac0acfcacf74d
    state: active
  - id: p00079
    type: paragraph
    text: Namely, from those who ply the industry of appropriating the fruits of others’ industry. All the conditions for carrying on the labour process are suddenly converted into so many acts of abstinence on the part of the capitalist. If the corn is not all eaten, but part of it also sown — abstinence of the capitalist. If the wine gets time to mature — abstinence of the capitalist. <fn ref="30"/> The capitalist robs his own self, whenever he “lends (!) the instruments of production to the labourer,” that is, whenever by incorporating labour-power with them, he uses them to extract surplus-value out of that labour-power, instead of eating them up, steam-engines, cotton, railways, manure, horses, and all; or as the vulgar economist childishly puts it, instead of dissipating “their value” in luxuries and other articles of consumption. <fn ref="31"/> How the capitalists as a class are to perform that feat, is a secret that vulgar economy has hitherto obstinately refused to divulge. Enough, that the world still jogs on, solely through the self-chastisement of this modern penitent of Vishnu, the capitalist. Not only accumulation, but the simple “conservation of a capital requires a constant effort to resist the temptation of consuming it.” <fn ref="32"/> The simple dictates of humanity therefore plainly enjoin the release of the capitalist from this martyrdom and temptation, in the same way that the Georgian slave-owner was lately delivered, by the abolition of slavery, from the painful dilemma, whether to squander the surplus-product, lashed out of his niggers, entirely in champagne, or whether to reconvert a part of it into more niggers and more land.
    hash: sha256:a13307a0897a5b052264f8e30b7f2245e8e3b7506b12621de1770d35d1427214
    state: active
  - id: p00080
    type: paragraph
    text: In economic forms of society of the most different kinds, there occurs, not only simple reproduction, but, in varying degrees, reproduction on a progressively increasing scale. By degrees more is produced and more consumed, and consequently more products have to be converted into means of production. This process, however, does not present itself as accumulation of capital, nor as the function of a capitalist, so long as the labourer’s means of production, and with them, his product and means of subsistence, do not confront him in the shape of capital. <fn ref="33"/> Richard Jones, who died a few years ago, and was the successor of Malthus in the chair of Political Economy at Haileybury College, discusses this point well in the light of two important facts. Since the great mass of the Hindu population are peasants cultivating their land themselves, their products, their instruments of labour and means of subsistence never take “the shape of a fund saved from revenue, which fund has, therefore, gone through a previous process of accumulation.” <fn ref="34"/> On the other hand, the non-agricultural labourers in those provinces where the English rule has least disturbed the old system, are directly employed by the magnates, to whom a portion of the agricultural surplus-product is rendered in the shape of tribute or rent. One portion of this product is consumed by the magnates in kind, another is converted, for their use, by the labourers, into articles of luxury and such like things, while the rest forms the wages of the labourers, who own their implements of labour. Here, production and reproduction on a progressively increasing scale, go on their way without any intervention from that queer saint, that knight of the woeful countenance, the capitalist “abstainer.”
    hash: sha256:82c088f770d35438b7676b691a11a75bd65ebd7f762a0b49a468ab2763c0048d
    state: active
  - id: p00081
    type: heading
    level: 3
    text: SECTION 4.
    hash: sha256:9e7d033d510a148345d0de41abf930fdfabcc11dedb1f5798252b5870997f5bb
    state: active
  - id: p00082
    type: heading
    level: 4
    text: CIRCUMSTANCES THAT, INDEPENDENTLY OF THE PROPORTIONAL DIVISION OF SURPLUS-VALUE INTO CAPITAL AND REVENUE, DETERMINE THE AMOUNT OF ACCUMULATION. DEGREE OF EXPLOITATION OF LABOUR-POWER. PRODUCTIVITY OF LABOUR. GROWING DIFFERENCE IN AMOUNT BETWEEN CAPITAL EMPLOYED AND CAPITAL CONSUMED. MAGNITUDE OF CAPITAL ADVANCED
    hash: sha256:9098c6bb2bc90219e9148ecfb860aaf52ef085195d69cc6aaff2f4015d832bd3
    state: active
  - id: p00083
    type: paragraph
    text: The proportion in which surplus-value breaks up into capital and revenue being given, the magnitude of the capital accumulated clearly depends on the absolute magnitude of the surplus-value. Suppose that 80 per cent. were capitalised and 20 per cent. eaten up, the accumulated capital will be £2,400 or £1,200, according as the total surplus-value has amounted to £3,000 or £1,500. Hence all the circumstances that determine the mass of surplus-value operate to determine the magnitude of the accumulation. We sum them up once again, but only in so far as they afford new points of view in regard to accumulation.
    hash: sha256:302aa618c1ea3aa969fdbaec4072ca8b029750cfa1a6f730f60de92655d55b0e
    state: active
  - id: p00084
    type: paragraph
    text: It will be remembered that the rate of surplus-value depends, in the first place, on the degree of exploitation of labour-power. Political Economy values this fact so highly, that it occasionally identifies the acceleration of accumulation due to increased productiveness of labour, with its acceleration due to increased exploitation of the labourer. <fn ref="35"/> In the chapters on the production of surplus-value it was constantly presupposed that wages are at least equal to the value of labour-power. Forcible reduction of wages below this value plays, however, in practice too important a part, for us not to pause upon it for a moment. It, in fact, transforms, within certain limits, the labourer’s necessary consumption fund into a fund for the accumulation of capital.
    hash: sha256:b99b981e72dc537ca3c79e132e8a6e485c42b7d488a0a987eaa9903ae2d35a73
    state: active
  - id: p00085
    type: blockquote
    text: “Wages,” says John Stuart Mill, “have no productive power; they are the price of a productive power. Wages do not contribute, along with labour, to the production of commodities, no more than the price of tools contributes along with the tools themselves. If labour could be had without purchase, wages might be dispensed with.” <fn ref="36"/>
    hash: sha256:03d1f3888f3d3bcb8d142396974e228428f293b55bda87cdb1dbdfbd789288b6
    state: active
  - id: p00086
    type: paragraph
    text: 'But if the labourers could live on air they could not be bought at any price. The zero of their cost is therefore a limit in a mathematical sense, always beyond reach, although we can always approximate more and more nearly to it. The constant tendency of capital is to force the cost of labour back towards this zero. A writer of the 18th century, often quoted already, the author of the “Essay on Trade and Commerce,” only betrays the innermost secret soul of English capitalism, when he declares the historic mission of England to be the forcing down of English wages to the level of the French and the Dutch. <fn ref="37"/> With other things he says naively:'
    hash: sha256:6e78977cea276df73d72b4f51458bc6a49e2dfbf7faa84c5d31c772b076a58fc
    state: active
  - id: p00087
    type: blockquote
    text: “But if our poor” (technical term for labourers) “will live luxuriously ... then labour must, of course, be dear ... When it is considered what luxuries the manufacturing populace consume, such as brandy, gin, tea, sugar, foreign fruit, strong beer, printed linens, snuff, tobacco, &amp;C.” <fn ref="38"/>
    hash: sha256:e01b0601bab0532ce57f51664fc314c2f750e736f3092670f31434aa0a8e8d1c
    state: active
  - id: p00088
    type: paragraph
    text: "He quotes the work of a Northamptonshire manufacturer, who, with eyes squinting heavenward moans:"
    hash: sha256:2a133da362773d64f9002a7323ecddedc2b77514c1c6456b873ae2e279814315
    state: active
  - id: p00089
    type: blockquote
    text: “Labour is one-third cheaper in France than in England; for their poor work hard, and fare hard, as to their food and clothing. Their chief diet is bread, fruit, herbs, roots, and dried fish; for they very seldom eat flesh; and when wheat is dear, they eat very little bread.” <fn ref="39"/> “To which may be added,” our essayist goes on, “that their drink is either water or other small liquors, so that they spend very little money.... These things are very difficult to be brought about; but they are not impracticable, since they have been effected both in France and in Holland.” <fn ref="40"/>
    hash: sha256:94c5b589f97817793aeeef52b950deda1ef83ddac21cafc9b4f2be8c83770caa
    state: active
  - id: p00090
    type: paragraph
    text: "Twenty years later, an American humbug, the baronised Yankee, Benjamin Thompson (<i>alias</i> Count Rumford) followed the same line of philanthropy to the great satisfaction of God and man. His “Essays” are a cookery book with receipts of all kinds for replacing by some succedaneum the ordinary dear food of the labourer. The following is a particularly successful receipt of this wonderful philosopher:"
    hash: sha256:af5ac9bb15c26975f0d2fc04736a3e4b94e8d8f6c9bf8d70fe69a7c467ee8fda
    state: active
  - id: p00091
    type: blockquote
    text: “5 lbs. of barleymeal, 7½d.; 5 lbs. of Indian corn, 6¼d.; 3d. worth of red herring, 1d. salt, 1d. vinegar, 2d. pepper and sweet herbs, in all 20¾.; make a soup for 64 men, and at the medium price of barley and of Indian corn ... this soup may be provided at ¼d., the portion of 20 ounces. <fn ref="41"/>
    hash: sha256:c61b45c99d65d6943adf7a1631b456b5109ddacfe00fe5517a527cd89ea1960c
    state: active
  - id: p00092
    type: paragraph
    text: 'With the advance of capitalistic production, the adulteration of food rendered Thompson’s ideal superfluous. <fn ref="42"/> At the end of the 18th and during the first ten years of the 19th century, the English farmers and landlords enforced the absolute minimum of wage, by paying the agricultural labourers less than the minimum in the form of wages, and the remainder in the shape of parochial relief. An example of the waggish way in which the English Dogberries acted in their “legal” fixing of a wages tariff:'
    hash: sha256:e3a2555d7272bd3b72980ee33ed2a3761d521c52e4433c93c552fae25a784d09
    state: active
  - id: p00093
    type: blockquote
    text: “The squires of Norfolk had dined, says Mr. Burke, when they fixed the rate of wages; the squires of Berks evidently thought the labourers ought not to do so, when they fixed the rate of wages at Speenhamland, 1795.... There they decide that ‘income (weekly) should be 3s. for a man,’ when the gallon or half-peck loaf of 8 lbs. 11 oz. is at 1s., and increase regularly till bread is 1s. 5d.; when it is above that sum decrease regularly till it be at 2s., and then his food <i>should be</i> 1/5 th less.” <fn ref="43"/>
    hash: sha256:4118636c1713ca452c6bf3aa0cd6644db8242fbc5f7b7bd5de5ec2e296eb087b
    state: active
  - id: p00094
    type: paragraph
    text: "Before the Committee of Inquiry of the House of Lords, 1814, a certain A. Bennett, a large farmer, magistrate, poor-law guardian, and wage-regulator, was asked:"
    hash: sha256:2b58c2d509d61d5d3c2beba676fe560981b27e51957abaac0b0a78cf3552cb33
    state: active
  - id: p00095
    type: blockquote
    text: '“Has any proportion of the value of daily labour been made up to the labourers out of the poors’ rate?” Answer: “Yes, it has; the weekly income of every family is made up to the gallon loaf (8 lbs. 11 oz.), and 3d. per head!... The gallon loaf per week is what we suppose sufficient for the maintenance of every person in the family for the week; and the 3d. is for clothes, and if the parish think proper to find clothes; the 3d. is deducted. This practice goes through all the western part of Wiltshire, and, I believe, throughout the country.” <fn ref="44"/> “For years,” exclaims a bourgeois author of that time, “they (the farmers) have degraded a respectable class of their countrymen, by forcing them to have recourse to the workhouse ... the farmer, while increasing his own gains, has prevented any accumulation on the part of his labouring dependents.” <fn ref="45"/>'
    hash: sha256:371801afde9b37b49d1e3de47b7a1e1a327e22d12b99c017f23b60164b69a13e
    state: active
  - id: p00096
    type: paragraph
    text: The part played in our days by the direct robbery from the labourer’s necessary consumption fund in the formation of surplus-value, and, therefore, of the accumulation fund of capital, the so-called domestic industry has served to show. (Ch. xv., sect. 8, c.) Further facts on this subject will be given later.
    hash: sha256:b064060edf48d6601db0b15a8418ac1eff1b5d289e1590ab49f08316d6942861
    state: active
  - id: p00097
    type: paragraph
    text: Although in all branches of industry that part of the constant capital consisting of instruments of labour must be sufficient for a certain number of labourers (determined by the magnitude of the undertaking), it by no means always necessarily increases in the same proportion as the quantity of labour employed. In a factory, suppose that 100 labourers working 8 hours a day yield 800 working-hours. If the capitalist wishes to raise this sum by one half, he can employ 50 more workers; but then he must also advance more capital, not merely for wages, but for instruments of labour. But he might also let the 100 labourers work 12 hours instead of 8, and then the instruments of labour already to hand would be enough. These would then simply be more rapidly consumed. Thus additional labour, begotten of the greater tension of labour-power, can augment surplus-product and surplus-value (i.e., the subject-matter of accumulation), without corresponding augmentation in the constant part of capital.
    hash: sha256:75e76d5bff347c090035bf320420168e2f288e246700417fc5e6eeea0ec7799a
    state: active
  - id: p00098
    type: paragraph
    text: In the extractive industries, mines, &amp;c., the raw materials form no part of the capital advanced. The subject of labour is in this case not a product of previous labour, but is furnished by Nature gratis, as in the case of metals, minerals, coal, stone, &amp;c. In these cases the constant capital consists almost exclusively of instruments of labour, which can very well absorb an increased quantity of labour (day and night shifts of labourers, <i>e.g</i>.). All other things being equal, the mass and value of the product will rise in direct proportion to the labour expended. As on the first day of production, the original produce-formers, now turned into the creators of the material elements of capital — man and Nature — still work together. Thanks to the elasticity of labour-power, the domain of accumulation has extended without any previous enlargement of constant capital.
    hash: sha256:0e7f76c5b3359c6c4675162dd2ba93b9a36e91f10c67bd8e4cdb51842de96857
    state: active
  - id: p00099
    type: paragraph
    text: In agriculture the land under cultivation cannot be increased without the advance of more seed and manure. But this advance once made, the purely mechanical working of the soil itself produces a marvellous effect on the amount of the product. A greater quantity of labour, done by the same number of labourers as before, thus increases the fertility, without requiring any new advance in the instruments of labour. It is once again the direct action of man on Nature which becomes an immediate source of greater accumulation, without the intervention of any new capital.
    hash: sha256:319b6cb5766285d74625045bf456a35a7b8541e74d934c263d96e0aefdc9595a
    state: active
  - id: p00100
    type: paragraph
    text: Finally, in what is called manufacturing industry, every additional expenditure of labour presupposes a corresponding additional expenditure of raw materials, but not necessarily of instruments of labour. And as extractive industry and agriculture supply manufacturing industry with its raw materials and those of its instruments of labour, the additional product the former have created without additional advance of capital, tells also in favour of the latter.
    hash: sha256:8f151fe4b6790ab3a80845df491dacec73dfb6e5263586f188b8db68c80188f1
    state: active
  - id: p00101
    type: paragraph
    text: "General result: by incorporating with itself the two primary creators of wealth, labour-power and the land, capital acquires a power of expansion that permits it to augment the elements of its accumulation beyond the limits apparently fixed by its own magnitude, or by the value and the mass of the means of production, already produced, in which it has its being."
    hash: sha256:f1986460b045ad6665cbcb4177c512b59f980976eaa5a1af2fe095b97c2854b5
    state: active
  - id: p00102
    type: paragraph
    text: Another important factor in the accumulation of capital is the degree of productivity of social labour.
    hash: sha256:a8017b281998aea0253b11e7369dc1237f18631c583a4bf944cf993a0f5baf32
    state: active
  - id: p00103
    type: paragraph
    text: With the productive power of labour increases the mass of the products, in which a certain value, and, therefore, a surplus-value of a given magnitude, is embodied. The rate of surplus-value remaining the same or even falling, so long as it only falls more slowly, than the productive power of labour rises, the mass of the surplus-product increases. The division of this product into revenue and additional capital remaining the same, the consumption of the capitalist may, therefore, increase without any decrease in the fund of accumulation. The relative magnitude of the accumulation fund may even increase at the expense of the consumption fund, whilst the cheapening of commodities places at the disposal of the capitalist as many means of enjoyment as formerly, or even more than formerly. But hand-in-hand with the increasing productivity of labour, goes, as we have seen, the cheapening of the labourer, therefore a higher rate of surplus-value, even when the real wages are rising. The latter never rise proportionally to the productive power of labour. The same value in variable capital therefore sets in movement more labour-power, and, therefore, more labour. The same value in constant capital is embodied in more means of production, <i>i.e</i>., in more instruments of labour, materials of labour and auxiliary materials; it therefore also supplies more elements for the production both of use value and of value, and with these more absorbers of labour. The value of the additional capital, therefore, remaining the same or even diminishing, accelerated accumulation still takes place. Not only does the scale of reproduction materially extend, but the production of surplus-value increases more rapidly than the value of the additional capital.
    hash: sha256:968229aa73c4498b87662c819d084be7e60be0f45b3703523c18ca214d545aa8
    state: active
  - id: p00104
    type: paragraph
    text: The development of the productive power of labour reacts also on the original capital already engaged in the process of production. A part of the functioning constant capital consists of instruments of labour, such as machinery, &amp;c., which are not consumed, and therefore not reproduced, or replaced by new ones of the same kind, until after long periods of time. But every year a part of these instruments of labour perishes or reaches the limit of its productive function. It reaches, therefore, in that year, the time for its periodical reproduction, for its replacement by new ones of the same kind. If the productiveness of labour has, during the using up of these instruments of labour, increased (and it develops continually with the uninterrupted advance of science and technology), more efficient and (considering their increased efficiency), cheaper machines, tools, apparatus, &amp;c., replace the old. The old capital is reproduced in a more productive form, apart from the constant detail improvements in the instruments of labour already in use. The other part of the constant capital, raw material and auxiliary substances, is constantly reproduced in less than a year; those produced by agriculture, for the most part annually. Every introduction of improved methods, therefore, works almost simultaneously on the new capital and on that already in action. Every advance in Chemistry not only multiplies the number of useful materials and the useful applications of those already known, thus extending with the growth of capital its sphere of investment. It teaches at the same time how to throw the excrements of the processes of production and consumption back again into the circle of the process of reproduction, and thus, without any previous outlay of capital, creates new matter for capital. Like the increased exploitation of natural wealth by the mere increase in the tension of labour-power, science and technology give capital a power of expansion independent of the given magnitude of the capital actually functioning. They react at the same time on that part of the original capital which has entered upon its stage of renewal. This, in passing into its new shape, incorporates gratis the social advance made while its old shape was being used up. Of course, this development of productive power is accompanied by a partial depreciation of functioning capital. So far as this depreciation makes itself acutely felt in competition, the burden falls on the labourer, in the increased exploitation of whom the capitalist looks for his indemnification.
    hash: sha256:b330c28162324a8d577f298cdf1c47f692c9fa88b89a0c14bf73507c8d839b81
    state: active
  - id: p00105
    type: paragraph
    text: Labour transmits to its product the value of the means of production consumed by it. On the other hand, the value and mass of the means of production set in motion by a given quantity of labour increase as the labour becomes more productive. Though the same quantity of labour adds always to its products only the same sum of new value, still the old capital value, transmitted by the labour to the products, increases with the growing productivity of labour.
    hash: sha256:812b93eb2f355eb2d359a521ca0c06ca3aa8b4af2b3cd150455035d896305794
    state: active
  - id: p00106
    type: paragraph
    text: An English and a Chinese spinner, e.g., may work the same number of hours with the same intensity; then they will both in a week create equal values. But in spite of this equality, an immense difference will obtain between the value of the week’s product of the Englishman, who works with a mighty automaton, and that of the Chinaman, who has but a spinning-wheel. In the same time as the Chinaman spins one pound of cotton, the Englishman spins several hundreds of pounds. A sum, many hundred times as great, of old values swells the value of his product, in which those re-appear in a new, useful form, and can thus function anew as capital.
    hash: sha256:ca661c9663a297486071b0650ea3f51fd839c8f9243e96e7a99e02781c348a9a
    state: active
  - id: p00107
    type: blockquote
    text: “In 1782,” as Frederick Engels teaches us, “all the wool crop in England of the three preceding years, lay untouched for want of labourers, and so it must have lain, if newly invented machinery had not come to its aid and spun it.” <fn ref="46"/>
    hash: sha256:0f59b236059c23216486ada7981b901578f42d46fb956f229ba243e31c559fce
    state: active
  - id: p00108
    type: paragraph
    text: Labour embodied in the form of machinery of course did not directly force into life a single man, but it made it possible for a smaller number of labourers, with the addition of relatively less living labour, not only to consume the wool productively, and put into it new value, but to preserve in the form of yarn, &amp;c., its old value. At the same time, it caused and stimulated increased reproduction of wool. It is the natural property of living labour, to transmit old value, whilst it creates new. Hence, with the increase in efficacy, extent and value of its means of production, consequently with the accumulation that accompanies the development of its productive power, labour keeps up and eternises an always increasing capital value in a form ever new.” <fn ref="47"/> This natural power of labour takes the appearance of an intrinsic property of capital, in which it is incorporated, just as the productive forces of social labour take the appearance of inherent properties of capital, and as the constant appropriation of surplus-labour by the capitalists, takes that of a constant self-expansion of capital.
    hash: sha256:f53bde265d362e3764f77f8383014db3eadb6b232ca517eaec99e8c64d799037
    state: active
  - id: p00109
    type: paragraph
    text: With the increase of capital, the difference between the capital employed and the capital consumed increases. In other words, there is increase in the value and the material mass of the instruments of labour, such as buildings, machinery, drain-pipes, working-cattle, apparatus of every kind that function for a longer or shorter time in processes of production constantly repeated, or that serve for the attainment of particular useful effects, whilst they themselves only gradually wear out, therefore only lose their value piecemeal, therefore transfer that value to the product only bit by bit. In the same proportion as these instruments of labour serve as product-formers without adding value to the product, <i>i.e.,</i> in the same proportion as they are wholly employed but only partly consumed, they perform, as we saw earlier, the same gratuitous service as the natural forces, water, steam, air, electricity, etc. This gratuitous service of past labour, when seized and filled with a soul by living labour, increases with the advancing stages of accumulation.
    hash: sha256:c6403d3b18b86a69fb827701836db4ae2b45be8758b1ab547f348a52a33ab492
    state: active
  - id: p00110
    type: paragraph
    text: Since past labour always disguises itself as capital, <i>i.e.</i>, since the passive of the labour of A, B, C, etc., takes the form of the active of the non-labourer X, bourgeois and political economists are full of praises of the services of dead and gone labour, which, according to the Scotch genius MacCulloch, ought to receive a special remuneration in the shape of interest, profit, etc. <fn ref="48"/> The powerful and ever-increasing assistance given by past labour to the living labour process under the form of means of production is, therefore, attributed to that form of past labour in which it is alienated, as unpaid labour, from the worker himself, <i>i.e.</i>, to its capitalistic form. The practical agents of capitalistic production and their pettifogging ideologists are as unable to think of the means of production as separate from the antagonistic social mask they wear today, as a slave-owner to think of the worker himself as distinct from his character as a slave.
    hash: sha256:995e0513800a57541327b0be00f8a61f59065dd0ad0030a35f3234f6c25c748d
    state: active
  - id: p00111
    type: paragraph
    text: With a given degree of exploitation of labour-power, the mass of the surplus-value produced is determined by the number of workers simultaneously exploited; and this corresponds, although in varying proportions, with the magnitude of the capital. The more, therefore, capital increases by means of successive accumulations, the more does the sum of the value increase that is divided into consumption fund and accumulation fund. The capitalist can, therefore, live a more jolly life, and at the same time show more “abstinence.” And, finally, all the springs of production act with greater elasticity, the more its scale extends with the mass of the capital advanced.
    hash: sha256:c7caa38c787424d32cdb4b8426ecb3397607344b3171b9f5b5469538027a4500
    state: active
  - id: p00112
    type: heading
    level: 3
    text: SECTION 5.
    hash: sha256:58c53599b56cdf2c0a99dc44695a5d9c3d698f2fcf9e323606b47de991e743e7
    state: active
  - id: p00113
    type: heading
    level: 4
    text: THE SO-CALLED LABOUR FUND
    hash: sha256:c8fbd0848274fe792201bc3f287af8707acb4c3936de0e23dffd44794443ce0b
    state: active
  - id: p00114
    type: paragraph
    text: 'It has been shown in the course of this inquiry that capital is not a fixed magnitude, but is a part of social wealth, elastic and constantly fluctuating with the division of fresh surplus-value into revenue and additional capital. It has been seen further that, even with a given magnitude of functioning capital, the labour-power, the science, and the land (by which are to be understood, economically, all conditions of labour furnished by Nature independently of man), embodied in it, form elastic powers of capital, allowing it, within certain limits, a field of action independent of its own magnitude. In this inquiry we have neglected all effects of the process of circulation, effects which may produce very different degrees of efficiency in the same mass of capital. And as we presupposed the limits set by capitalist production, that is to say, presupposed the process of social production in a form developed by purely spontaneous growth, we neglected any more rational combination, directly and systematically practicable with the means of production, and the mass of labour-power at present disposable. Classical economy always loved to conceive social capital as a fixed magnitude of a fixed degree of efficiency. But this prejudice was first established as a dogma by the arch-Philistine, Jeremy Bentham, that insipid, pedantic, leather-tongued oracle of the ordinary bourgeois intelligence of the 19th century. <fn ref="49"/> Bentham is among philosophers what Martin Tupper is among poets. Both could only have been manufactured in England. <fn ref="50"/> In the light of his dogma the commonest phenomena of the process of production, as, <i>e.g.,</i> its sudden expansions and contractions, nay, even accumulation itself, become perfectly inconceivable. <fn ref="51"/> The dogma was used by Bentham himself, as well as by Malthus, James Mill, MacCulloch, etc., for an apologetic purpose, and especially in order to represent one part of capital, namely, variable capital, or that part convertible into labour-power, as a fixed magnitude. The material of variable capital, <i>i.e.</i>, the mass of the means of subsistence it represents for the labourer, or the so-called labour fund, was fabled as a separate part of social wealth, fixed by natural laws and unchangeable. To set in motion the part of social wealth which is to function as constant capital, or, to express it in a material form, as means of production, a definite mass of living labour is required. This mass is given technologically. But neither is the number of labourers required to render fluid this mass of labour-power given (it changes with the degree of exploitation of the individual labour-power), nor is the price of this labour-power given, but only its minimum limit, which is moreover very variable. The facts that lie at the bottom of this dogma are these: on the one hand, the labourer has no right to interfere in the division of social wealth into means of enjoyment for the non-labourer and means of production. <fn ref="52"/> On the other hand, only in favourable and exceptional cases, has he the power to enlarge the so-called labour fund at the expense of the “revenue” of the wealthy.'
    hash: sha256:b172764b33513c68c8aadb564f961900c76356b0055d340d98bbd5b8c58a757a
    state: active
  - id: p00115
    type: paragraph
    text: What silly tautology results from the attempt to represent the capitalistic limits of the labour fund as its natural and social limits may be seen, e.g., in Professor Fawcett. <fn ref="53"/>
    hash: sha256:0e07562fec16fd88d8ff97e1eb5942797e598378204c19a1b5d5343cfd2d1890
    state: active
  - id: p00116
    type: blockquote
    text: “The circulating capital of a country,” he says, “is its wage-fund. Hence, if we desire to calculate the average money wages received by each labourer, we have simply to divide the amount of this capital by the number of the labouring population.” <fn ref="54"/>
    hash: sha256:19e837270affa6b0c2fcbf1fc0ae63c881fd770739a520f02163888a9d460dd7
    state: active
  - id: p00117
    type: paragraph
    text: "That is to say, we first add together the individual wages actually paid, and then we affirm that the sum thus obtained, forms the total value of the “labour fund” determined and vouchsafed to us by God and Nature. Lastly, we divide the sum thus obtained by the number of labourers to find out again how much may come to each on the average. An uncommonly knowing dodge this. It did not prevent Mr. Fawcett saying in the same breath:"
    hash: sha256:a29c4f367565384294f7ed3616fd470e3ae757b31b4d6ea964f595fcc864ac99
    state: active
  - id: p00118
    type: blockquote
    text: “The aggregate wealth which is annually saved in England, is divided into two portions; one portion is employed as capital to maintain our industry, and the other portion is exported to foreign countries... Only a portion, and perhaps, not a large portion of the wealth which is annually saved in this country, is invested in our own industry. <fn ref="55"/>
    hash: sha256:9135030e602ccaf8cf560208ee69293f4f7fbedf28b12b83848fff039e4e3211
    state: active
  - id: p00119
    type: paragraph
    text: The greater part of the yearly accruing surplus-product, embezzled, because abstracted without return of an equivalent, from the English labourer, is thus used as capital, not in England, but in foreign countries. But with the additional capital thus exported, a part of the “labour fund” invented by God and Bentham is also exported. <fn ref="56"/>
    hash: sha256:9ba8fcbdd9fd7ce2a97d02f5a1a8a14483b7c7185c86aa33270ee1ad061a92e9
    state: active
  - id: p00120
    type: footnote
    label: "1"
    text: "“Accumulation of capital; the employment of a portion of revenue as capital.” (Malthus: “Definitions, &amp;c.,” ed. Cazenove, p. 11.) “Conversion of revenue into capital,” (Malthus: “Princ. of Pol. Econ “ 2nd Ed., Lond.. 1836, p. 320.)"
    hash: sha256:14e5a18440552c0df80a85464894b2127166f46686d37b7ce9b1b63fdb1997f6
    state: active
  - id: p00121
    type: footnote
    label: "2"
    text: We here take no account of export trade, by means of which a nation can change articles of luxury either into means of production or means of subsistence, and <i>vice versà.</i> In order to examine the object of our investigation in its integrity, free from all disturbing subsidiary circumstances, we must treat the whole world as one nation, and assume that capitalist production is everywhere established and has possessed itself of every branch of industry.
    hash: sha256:c882fa595daf7a072b5d92cf901fc22c7275cb10f49c95176e4af7124c1755c3
    state: active
  - id: p00122
    type: footnote
    label: "3"
    text: Sismondi’s analysis of accumulation suffers from the great defect, that he contents himself, to too great an extent, with the phrase “conversion of revenue into capital,” without fathoming the material conditions of this operation.
    hash: sha256:79a1f57f3e68d5d1c2b5239a8901c574e31b4f6ede87b4384419ac3d5915acd9
    state: active
  - id: p00123
    type: footnote
    label: "4"
    text: “Le travail primitif auquel son capital a dû sa naissance.” [the original labour, to which his capital owed its origin] Sismondi, l. c., ed. Paris, t. I., p. 109.
    hash: sha256:f73f4998efe5c9297876532e81fcc607c6dc352fcc74d6db8f4f3541f8a0447d
    state: active
  - id: p00124
    type: footnote
    label: "5"
    text: “Labour creates capital before capital employs labour.” E. G. Wakefield, “England and America,” Lond., 1833, Vol. II, p. 110.
    hash: sha256:6a58a8acfff18caae1b101f4c2823f2145e6948e698ca254b457eeb04b8cc886
    state: active
  - id: p00125
    type: footnote
    label: "6"
    text: The property of the capitalist in the product of the labour of others “is a strict consequence of the law of appropriation, the fundamental principle of which was, on the contrary, the exclusive title of every labourer to the product of his own labour.” (Cherbuliez, “Richesse ou Pauvreté,” Paris, 1841, p. 58, where, however, the dialectical reversal is not properly developed.)
