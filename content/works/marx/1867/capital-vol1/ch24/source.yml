    text: l. c., pp. 70, 71. <i>Note in the 3rd German edition:</i> today, thanks to the competition on the world-market, established since then, we have advanced much further. “If China,” says Mr. Stapleton, M.P., to his constituents, “should become a great manufacturing country, I do not see how the manufacturing population of Europe could sustain the contest without descending to the level of their competitors.” (<i>Times,</i> Sept. 3, 1873, p. 8.) The wished-for goal of English capital is no longer Continental wages but Chinese.
    hash: sha256:f8a3d73484e86543a5c7daffaac8659db4312ea624341149bdd0c0ad75d2ae47
