  - id: p00169
    type: footnote
    label: "50"
    text: Bentham is a purely English phenomenon. Not even excepting our philosopher, Christian Wolff, in no time and in no country has the most homespun commonplace ever strutted about in so self-satisfied a way. The principle of utility was no discovery of Bentham. He simply reproduced in his dull way what Helvétius and other Frenchmen had said with esprit in the 18th century. To know what is useful for a dog, one must study dog-nature. This nature itself is not to be deduced from the principle of utility. Applying this to man, he that would criticise all human acts, movements, relations, etc., by the principle of utility, must first deal with human nature in general, and then with human nature as modified in each historical epoch. Bentham makes short work of it. With the driest naiveté he takes the modern shopkeeper, especially the English shopkeeper, as the normal man. Whatever is useful to this queer normal man, and to his world, is absolutely useful. This yard-measure, then, he applies to past, present, and future. The Christian religion, e.g., is “useful,” “because it forbids in the name of religion the same faults that the penal code condemns in the name of the law.” Artistic criticism is “harmful,” because it disturbs worthy people in their enjoyment of Martin Tupper, etc. With such rubbish has the brave fellow, with his motto, “nulla dies sine linea!,” piled up mountains of books. Had I the courage of my friend, Heinrich Heine, I should call Mr. Jeremy a genius in the way of bourgeois stupidity.
    hash: sha256:2de9d988ae969d255e3efbb6b78250ccb257723c736625f2a1ce7e1df5a41b0f
    state: active
  - id: p00170
    type: footnote
    label: "51"
    text: "“Political economists are too apt to consider a certain quantity of capital and a certain number of labourers as productive instruments of uniform power, or operating with a certain uniform intensity.... Those... who maintain ... that commodities are the sole agents of production ... prove that production could never be enlarged, for it requires as an indispensable condition to such an enlargement that food, raw materials, and tools should be previously augmented; which is in fact maintaining that no increase of production can take place without a previous increase, or, in other words, that an increase is impossible.” (S. Bailey: “Money and its Vicissitudes,” pp. 58 and 70.) Bailey criticises the dogma mainly from the point of view of the process of circulation."
    hash: sha256:4ab5f42a385535f35f6424267707aa92836d04a30f5ed60cab97168bdec28063
    state: active
  - id: p00171
    type: footnote
    label: "52"
    text: "John Stuart Mill, in his “Principles of Political Economy,” says: “The really exhausting and the really repulsive labours instead of being better paid than others, are almost invariably paid the worst of all.... The more revolting the occupation, the more certain it is to receive the minimum of remuneration.... The hardships and the earnings, instead of being directly proportional, as in any just arrangements of society they would be, are generally in an inverse ratio to one another.” To avoid misunderstanding, let me say that although men like John Stuart Mill are to blame for the contradiction between their traditional economic dogmas and their modern tendencies, it would be very wrong to class them with the herd of vulgar economic apologists."
    hash: sha256:a306b763858d9e231cfba1b0c09f65ea21b7effe7e8d187596022b71f3ff3fbe
    state: active
