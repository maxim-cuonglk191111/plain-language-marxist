    label: "122"
    text: The total yearly income under Schedule D. is different in this table from that which appears in the preceding ones, because of certain deductions allowed by law.
    hash: sha256:8d1d7cef21242d6f662b720573fd6fcbb920bc074d9285639f94f5e8fe0c36ae
    state: active
  - id: p00432
    type: footnote
    label: "123"
    text: If the product also diminishes relatively per acre, it must not be forgotten that for a century and a half England has indirectly exported the soil of Ireland, without as much as allowing its cultivators the means for making up the constituents of the soil that had been exhausted.
    hash: sha256:1c9df93cb4ac4d41261bd304fd03b165e5bd9fcaa01d0c8440b9d22d0ac8fbd0
    state: active
  - id: p00433
    type: footnote
    label: "124"
    text: As Ireland is regarded as the promised land of the “principle of population,” Th. Sadler, before the publication of his work on population, issued his famous book, “Ireland, its Evils and their Remedies.” 2nd edition, London, 1829. Here, by comparison of the statistics of the individual provinces, and of the individual counties in each province, he proves that the misery there is not, as Malthus would have it, in proportion to the number of the population, but in inverse ratio to this.
    hash: sha256:fde8b726ed8255edcf7a5919cfdede25d3ad93270d1d87bd2657360a4f41fac9
