    text: “The limit, however, to the employment of both the operative and the labourer is the same; namely, the possibility of the employer realising a <i>profit</i> on the produce of their industry. If the rate of wages is such as to reduce the master’s gains below the average profit of capital, he will cease to employ them, or he will only employ them on condition of submission to a reduction of wages.” (John Wade, l. c., p. 241.)
