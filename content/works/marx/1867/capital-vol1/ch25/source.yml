    label: "115"
    text: To one of these gentlemen the taste of his rent was so grateful that he indignantly declared to the Commission of Inquiry that the whole hubbub was only due to the name of the system. If instead of “gang” it were called “the Agricultural Juvenile Industrial Self-supporting Association,” everything would be all right.
    hash: sha256:8b827c66c4862b6d64389a55d27313ec32037e1d94dcc93593b114784efa1faf
    state: active
  - id: p00425
    type: footnote
    label: "116"
    text: “Gang work is cheaper than other work; that is why they are employed,” says a former gang-master (l. c., p. 17, § 14 )."The gang-system is decidedly the cheapest for the farmer, and decidedly the worst for the children,” says a farmer (l. c., p. 16, § 3.)
    hash: sha256:542d1d54093be39eca23724143004a17a653afa8af589cf8eefb672d05a84d84
    state: active
  - id: p00426
    type: footnote
    label: "117"
    text: “Undoubtedly much of the work now done by children in gangs used to be done by men and women. More men are out of work now where children and women are employed than formerly.” (l. c., p. 43, n. 202.) On the other hand, “the labour question in some agricultural districts, particularly the arable, is becoming so serious in consequence of emigration, and the facility afforded by railways for getting to large towns that I (the “I” is the steward of a great lord) think the services of children are most indispensable,” (l. c., p. 80, n. 180.) For the “labour question” in English agricultural districts, differently from the rest of the civilised world, means the landlords’ and farmers’ question, <i>viz</i>., how is it possible, despite an always increasing exodus of the agricultural folk, to keep up a sufficient relative surplus population in the country, and by means of it keep the wages of the agricultural labourer at a minimum?
    hash: sha256:5a90e80f49ef473a58fac5ba61340f469c9be50899e7d835d132445ccd10c6a1
    state: active
  - id: p00427
    type: footnote
    label: "118"
    text: The “Public Health Report,” where in dealing with the subject of children’s mortality, the gang-system is treated in passing, remains unknown to the press, and, therefore, to the English public. On the other hand, the last report of the “Child. Empl. Comm.” afforded the press sensational copy always welcome. Whilst the Liberal press asked how the fine gentlemen and ladies, and the well-paid clergy of the State Church, with whom Lincolnshire swarms, could allow such a system to arise on their estates, under their very eyes, they who send out expressly missions to the Antipodes, “for the improvement of the morals of South Sea Islanders” — the more refined press confined itself to reflections on the coarse degradation of the agricultural population who are capable of selling their children into such slavery! Under the accursed conditions to which these “delicate” people condemn the agricultural labourer, it would not be surprising if he ate his own children. What is really wonderful is the healthy integrity of character, he has, in great part, retained. The official reports prove that the parents, even in the gang districts, loathe the gang-system. “There is much in the evidence that shows that the parents of the children would, in many instances, be glad to be aided by the requirements of a legal obligation, to resist the pressure and the temptations to which they are often subject. They are liable to be urged, at times by the parish officers, at times by employers, under threats of being themselves discharged, to be taken to work at an age when ... school attendance ... would be manifestly to their greater advantage.... All that time and strength wasted; all the suffering from extra and unprofitable fatigue produced to the labourer and to his children; every instance in which the parent may have traced the moral ruin of his child to the undermining of delicacy by the over-crowding of cottages, or to the contaminating influences of the public gang, must have been so many incentives to feelings in the minds of the labouring poor which can be well understood, and which it would be needless to particularise. They must be conscious that much bodily and mental pain has thus been inflicted upon them from causes for which they were in no way answerable; to which, had it been in their power, they would have in no way consented; and against which they were powerless to struggle.” (l. c., p. xx., § 82, and xxiii., n. 96.)
    hash: sha256:f0a186b75f87c640a2b3a2e5a38c36b1fe22847e965894ddc97a5731f92bc28f
    state: active
  - id: p00428
