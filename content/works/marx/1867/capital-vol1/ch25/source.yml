  - id: p00429
    type: footnote
    label: "120"
    text: "The result would be found yet more unfavourable if we went further back. Thus: Sheep in 1865, 3,688,742, but in 1856, 3,694,294. Pigs in 1865, 1,299,893, but in 1858, 1,409,883."
    hash: sha256:2aebc487ca57a8435095af95cb56915ad3cdde2e5668d4b0c9a0d97e90a173fe
    state: active
  - id: p00430
    type: footnote
    label: "121"
    text: "The data of the text are put together from the materials of the “Agricultural Statistics, Ireland, General Abstracts, Dublin,” for the years 1860, <i>et seq.,</i> and “Agricultural Statistics, Ireland. Tables showing the estimated average produce, &amp;c., Dublin, 1866.” These statistics are official, and laid before Parliament annually.<br/><br/><i>Note to 2nd edition</i>. The official statistics for the year 1872 show, as compared with 1871, a decrease in area under cultivation of 134,915 acres. An increase occurred in the cultivation of green crops, turnips, mangold-wurzel, and the like; a decrease in the area under cultivation for wheat of 16,000 acres; oats, 14,000; barley and rye, 4,000; potatoes, 66,632; flax, 34,667; grass, clover, vetches, rape-seed, 30,000. The soil under cultivation for wheat shows for the last 5 years the following stages of decrease: — 1868, 285,000 acres; 1869, 280,000; 1870, 259,000; 1871, 244,000; 1872, 228,000. For 1872 we find, in round numbers, an increase of 2,600 horses, 80,000 horned cattle, 68,609 sheep, and a decrease of 236,000 pigs."
    hash: sha256:a936306289a4951d869ef32ac17962ecb32423aab07876983a8e3494ddd9854c
    state: active
  - id: p00431
