    text: These figures are sufficient for comparison, but, taken absolutely, are false, since, perhaps, £100,000,000 of income are annually not declared. The complaints of the Inland Revenue Commissioners of systematic fraud, especially on the part of the commercial and industrial classes, are repeated in each of their reports. So <i>e.g.,</i> “A Joint-stock company returns £6,000 as assessable profits, the surveyor raises the amount to £88,000, and upon that sum duty is ultimately paid. Another company which returns £190,000 is finally compelled to admit that the true return should be £250,000.” (Ibid., p, 42.)
