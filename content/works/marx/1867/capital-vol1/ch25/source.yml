  - id: p00325
    type: footnote
    label: "17"
    text: "Malthus, “Principles of Political Economy,” pp. 215, 319, 320. In this work, Malthus finally discovers, with the help of Sismondi, the beautiful Trinity of capitalistic production: over-production, over-population, over-consumption — three very delicate monsters, indeed. Cf. F. Engels, “Umrisse zu einer Kritik der Nationalökonomie,” l. c., p, 107, et seq."
    hash: sha256:6a74837db242a3ded09626fc23c94fd10b6efc820a6e170e8896372652c44e49
