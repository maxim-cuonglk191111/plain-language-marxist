    hash: sha256:cbc240fb306764c354068419c5982264a02f3a0964ad5c371ee54cc0be5b99c4
    state: active
  - id: p00306
    type: paragraph
    text: Centralisation has from 1851 to 1861 destroyed principally farms of the first three categories, under 1 and not over 15 acres. These above all must disappear. This gives 307,058 “supernumerary” farmers, and reckoning the families the low average of 4 persons, 1,228,232 persons. On the extravagant supposition that, after the agricultural revolution is complete one-fourth of these are again absorbable, there remain for emigration 921,174 persons. Categories 4, 5, 6, of over 15 and not over 100 acres, are, as was known long since in England, too small for capitalistic cultivation of corn, and for sheep-breeding are almost vanishing quantities. On the same supposition as before, therefore, there are further 788,761 persons to emigrate; total, 1,709,532. And as l’appétit vient en mangeant, Rentroll’s eyes will soon discover that Ireland, with 3½ millions, is still always miserable, and miserable because she is overpopulated. Therefore her depopulation must go yet further, that thus she may fulfil her true destiny, that of an English sheep-walk and cattle-pasture.” <fn ref="141"/>
    hash: sha256:981aa9b56c6195af6cd6b0c813787a471a1b6163b9cc384e98f5fcc9e2e0424c
    state: active
  - id: p00307
    type: paragraph
    text: "Like all good things in this bad world, this profitable method has its drawbacks. With the accumulation of rents in Ireland, the accumulation of the Irish in America keeps pace. The Irishman, banished by sheep and ox, re-appears on the other side of the ocean as a Fenian, and face to face with the old queen of the seas rises, threatening and more threatening, the young giant Republic:"
    hash: sha256:dfafabc09d3918c1742d834ae2d4550ca9fe28b2483b0d2fac0fcb62b5399c8d
    state: active
