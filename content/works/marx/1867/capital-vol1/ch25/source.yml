  - id: p00309
    type: footnote
    label: "1"
    text: Karl Marx, l. c., “A égalité d’oppression des masses, plus un pays a de prolétaires et plus il est riche.” (Colins, “L’Economie Politique. Source des Révolutions et des Utopies, prétendues Socialistes.” Paris, 1857, t. III., p. 331.) Our “prolétarian” is economically none other than the wage labourer, who produces and increases capital, and is thrown out on the streets, as soon as he is superfluous for the needs of aggrandisement of “Monsieur capital,” as Pecqueur calls this person. “The sickly proletarian of the primitive forest,” is a pretty Roscherian fancy. The primitive forester is owner of the primitive forest, and uses the primitive forest as his property with the freedom of an orang-outang. He is not, therefore, a proletarian. This would only be the case, if the primitive forest exploited him, instead of being exploited by him. As far as his health is concerned, such a man would well bear comparison, not only with the modern proletarian, but also with the syphilitic and scrofulous upper classes. But, no doubt, Herr Wilhelm Roscher, by “primitive forest” means his native heath of Lüneburg.
    hash: sha256:3db0948b4dc48c057ddc79395ce8fe0e5938589d808dd49d6046858515b351e6
    state: active
