  - id: p00450
    type: footnote
    label: "141"
    text: How the famine and its consequences have been deliberately made the most of, both by the individual landlords and by the English legislature, to forcibly carry out the agricultural revolution and to thin the population of Ireland down to the proportion satisfactory to the landlords, I shall show more fully in Vol. III. of this work, in the section on landed property. There also I return to the condition of the small farmers and the agricultural labourers. At present, only one quotation. Nassau W. Senior says, with other things, in his posthumous work, “Journals, Conversations and Essays relating to Ireland.” 2 vols. London, 1868; Vol. II., p. 282. “Well,” said Dr. G., “we have got our Poor Law and it is a great instrument for giving the victory to the landlords. Another, and a still more powerful instrument is emigration.... No friend to Ireland can wish the war to be prolonged [between the landlords and the small Celtic farmers] — still less, that it should end by the victory of the tenants. The sooner it is over — the sooner Ireland becomes a grazing country, with the comparatively thin population which a grazing country requires, the better for all classes.” The English Corn Laws of 1815 secured Ireland the monopoly of the free importation of corn into Great Britain. They favoured artificially, therefore, the cultivation of corn. With the abolition of the Corn Laws in 1846, this monopoly was suddenly removed. Apart from all other circumstances, this event alone was sufficient to give a great impulse to the turning of Irish arable into pasture land, to the concentration of farms, and to the eviction of small cultivators. After the fruitfulness of the Irish soil had been praised from 1815 to 1846, and proclaimed loudly as by Nature herself destined for the cultivation of wheat, English agronomists, economists, politicians, discover suddenly that it is good for nothing but to produce forage. M. Léonce de Lavergne has hastened to repeat this on the other side of the Channel. It takes a “serious” man, à la Lavergne, to be caught by such childishness.<br/><br/>Transcribed by Zodiac<br/>Html Markup by Stephen Baird (1999)
