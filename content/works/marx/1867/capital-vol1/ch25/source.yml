  - id: p00350
    type: footnote
    label: "42"
    text: "Gladstone, House of Commons, 7th April, 1864. — “The Hansard version runs: ‘Again, and yet more at large — what is human life, but, in the majority of cases, a struggle for existence.’ The continual crying contradictions in Gladstone’s Budget speeches of 1863 and 1864 were characterised by an English writer by the following quotation from Boileau:<br/><br/>“Voilà l’homme en effet. Il va du blanc au noir,<br/>Il condamne au matin ses sentiments du soir.<br/>Importun à tout autre, à soi-même incommode,<br/>Il change à tout moment d’esprit comme de mode.”<br/>[Such is the man: he goes from black to white. / He condemns in the morning what he felt in the evening. / A nuisance to everyone else, and an inconvenience to himself, / he changes his way of thinking as easily as he changes his way of dressing]<br/>(“The Theory of Exchanges, &amp;c.,” London, 1864, p. 135.)"
