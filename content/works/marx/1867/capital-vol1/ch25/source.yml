    label: "18"
    text: Harriet Martineau, “A Manchester Strike,” 1832, p. 101.
    hash: sha256:cad1d2dc974e51c9a01bf2d24ab168c00828a0bac08f88e469afbca58ea83a67
    state: active
  - id: p00327
    type: footnote
    label: "19"
    text: Even in the cotton famine of 1863 we find, in a pamphlet of the operative cotton-spinners of Blackburn, fierce denunciations of overwork, which, in consequence of the Factory Acts, of course only affected adult male labourers. “The adult operatives at this mill have been asked to work from 12 to 13 hours per day, while there are hundreds who are compelled to be idle who would willingly work partial time, in order to maintain their families and save their brethren from a premature grave through being overworked.... We,” it goes on to say, “would ask if the practice of working overtime by a number of hands, is likely to create a good feeling between masters and servants. Those who are worked overtime feel the injustice equally with those who are condemned to forced idleness. There is in the district almost sufficient work to give to all partial employment if fairly distributed. We are only asking what is right in requesting the masters generally to pursue a system of short hours, particularly until a better state of things begins to dawn upon us, rather than to work a portion of the hands overtime, while others, for want of work, are compelled to exist upon charity.” (“Reports of Insp. of Fact., Oct. 31, 1863,” p. 8.) The author of the “Essay on Trade and Commerce” grasps the effect of a relative surplus population on the employed labourers with his usual unerring bourgeois instinct. “Another cause of idleness in this kingdom is the want of a sufficient number of labouring hands .... Whenever from an extraordinary demand for manufactures, labour grows scarce, the labourers feel their own consequence, and will make their masters feel it likewise — it is amazing; but so depraved are the dispositions of these people, that in such cases a set of workmen have combined to distress the employer by idling a whole day together.” (“Essay, &amp;c.,” pp. 27, 28.) The fellows in fact were hankering after a rise in wages.
    hash: sha256:d9e101dcaf195f8f2330a0903fecd616ddab2da4f05d12a43c99f46c491e8d18
    state: active
  - id: p00328
    type: footnote
    label: "20"
    text: <i>Economist,</i> Jan. 21. 1860.
    hash: sha256:edab2214e66813c6747d1eb4350e091624885abe1e24785f77cad210417a0b70
    state: active
  - id: p00329
    type: footnote
    label: "21"
    text: "Whilst during the last six months of 1866, 80-90,000 working people in London were thrown out of work, the Factory Report for that same half year says: “It does not appear absolutely true to say that demand will always produce supply just at the moment when it is needed. It has not done so with labour, for much machinery has been idle last year for want of hands.” (“Rep. of Insp. of Fact., 31st Oct., 1866,” p. 81.)"
    hash: sha256:e05f891c2fd9a41f6a4c457793aaa7aa8e09df26f0570f3a443ae02a8b751e2f
    state: active
  - id: p00330
    type: footnote
    label: "22"
    text: Opening address to the Sanitary Conference, Birmingham, January 15th, 1875, by J. Chamberlain, Mayor of the town, now (1883) President of the Board of Trade.
    hash: sha256:74c53ff0d2f9de0508f4ecbc988c89b6004f45545aab9efe834eb41cd53baeac
    state: active
  - id: p00331
    type: footnote
    label: "23"
    text: 781 towns given in the census for 1861 for England and Wales “contained 10,960,998 inhabitants, while the villages and country parishes contained 9,105,226. In 1851, 580 towns were distinguished, and the population in them and in the surrounding country was nearly equal. But while in the subsequent ten years the population in the villages and the country increased half a million, the population in the 580 towns increased by a million and a half (1,554,067). The increase of the population of the country parishes is 6.5 per cent., and of the towns 17.3 per cent. The difference in the rates of increase is due to the migration from country to town. Three-fourths of the total increase of population has taken place in the towns.” (“Census, &amp;c.,” pp. 11 and 12.)
    hash: sha256:fe43946decc04a23cfd811851160d092f2acb8b91df494f5efbdbb57deaa0748
    state: active
  - id: p00332
    type: footnote
    label: "24"
    text: "“Poverty seems favourable to generation.” (A. Smith.) This is even a specially wise arrangement of God, according to the gallant and witty Abbé Galiani “Iddio af che gli uomini che esercitano mestieri di prima utilità nascono abbondantemente.” (Galiani, l. c., p. 78.) [God ordains that men who carry on trades of primary utility are born in abundance] “Misery up to the extreme point of famine and pestilence, instead of checking, tends to increase population.” (S. Laing, “National Distress,” 1844, p. 69.) After Laing has illustrated this by statistics, he continues: “If the people were all in easy circumstances, the world would soon be depopulated.”"
    hash: sha256:d50636900c167361d7e2d49887366f9358f39327e341e27ef7a8d2e9cc849d61
    state: active
  - id: p00333
    type: footnote
    label: "25"
    text: "“De jour en jour il devient donc plus clair que les rapports de production dans lesquels se meut la bourgeoisie n’ont pas un caractère un, un caractère simple, mais un caractère de duplicité; que dans les mêmes rapports dans lesquels se produit la richesse, la misère se produit aussi; que dans les mêmes rapports dans lesquels il y a développement des forces productives, il y a une force productive de répression; que ces rapports ne produisent la richesse bourgeoise, c’est-à-dire la richesse de la classe bourgeoise, qu’en anéantissant continuellement la richesse des membres intégrants de cette classe et en produisant un prolétariat toujours croissant.” [From day to day it thus becomes clearer that the production relations in which the bourgeoisie moves have not a simple, uniform character, but a dual character; that in the selfsame relations in which wealth is produced, poverty is produced also; that in the selfsame relations in which there is a development of productive forces, there is also a force producing repression; that there relations produce bourgeois wealth, i.e., the wealth of the bourgeois class, only by continually annihilating the wealth of the individual members of this class and by producing an evergrowing proletariat] (Karl Marx: “Misère de la Philosophie,” p. 116.)"
    hash: sha256:cbc05f02547530dde8d594385825380cd50b97c64a20cb3cdd1ca51d171bf94e
    state: active
  - id: p00334
    type: footnote
    label: "26"
    text: "G. Ortes: “Delia Economia Nazionale libri sei, 1777,” in Custodi, Parte Moderna, t. xxi, pp. 6, 9, 22, 25, etc. Ortes says, l. c., p. 32: “In luoco di progettar sistemi inutili per la felicità de’popoli, mi limiterò a investigare la regione della loro infelicità.” [Instead of projecting useless systems for achieving the happiness of people, I shall limit myself to investigating the reasons for their unhappiness]"
    hash: sha256:6afe7cdf777951268b81d93d5fa7ac7dd85e8e43bb976b5e98bcddb9a7b56ad6
    state: active
  - id: p00335
    type: footnote
    label: "27"
    text: "“A Dissertation on the Poor Laws. By a Well-wisher of Mankind. (The Rev. J. Townsend) 1786,” republished Lond. 1817, pp. 15, 39, 41. This “delicate” parson, from whose work just quoted, as well as from his “Journey through Spain,” Malthus often copies whole pages, himself borrowed the greater part of his doctrine from Sir James Steuart, whom he however alters in the borrowing. <i>E.g</i>., when Steuart says: “Here, in slavery, was a forcible method of making mankind diligent,” [for the non-workers] ... “Men were then forced to work” [<i>i.e</i>.,to work gratis for others], “because they were slaves of others; men are now forced to work” [<i>i.e</i>., to work gratis for non-workers] “because they are the slaves of their necessities,” he does not thence conclude, like the fat holder of benefices, that the wage labourer must always go fasting. He wishes, on the contrary, to increase their wants and to make the increasing number of their wants a stimulus to their labour for the “more delicate.”"
    hash: sha256:f14d5695444dd16b86807bf005a8bbab0bbcccf43c563f8b3667c04d93550345
