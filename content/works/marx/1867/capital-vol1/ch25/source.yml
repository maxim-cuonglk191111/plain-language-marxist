    text: <i>Acerba fata Romanos agunt</i><br/><i>Scelusque fraternae necis.</i><br/>[A cruel fate torments the Romans,<br/>and the crime of fratricide]
    hash: sha256:cc848c127265f9ebea2032048135e3ec3acea997730d8613b6e409aab3cc0e72
