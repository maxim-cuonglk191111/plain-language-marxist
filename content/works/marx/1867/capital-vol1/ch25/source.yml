    type: footnote
    label: "99"
    text: l. c., p. 17. The English agricultural labourer receives only 1/4 as much milk, and 1/2 as much bread as the Irish. Arthur Young in his “Tour in Ireland,” at the beginning of this century, already noticed the better nourishment of the latter. The reason is simply this, that the poor Irish farmer is incomparably more humane than the rich English. As regards Wales, that which is said in the text holds only for the southwest. All the doctors there agree that the increase of the death-rate through tuberculosis, scrofula, etc., increases in intensity with the deterioration of the physical condition of the population, and all ascribe this deterioration to poverty. “His (the farm labourer’s) keep is reckoned at about five pence a day, but in many districts it was said to be of much less cost to the farmer” [himself very poor].... “A morsel of the salt meat or bacon, ... salted and dried to the texture of mahogany, and hardly worth the difficult process of assimilation ... is used to flavour a large quantity of broth or gruel, of meal and leeks, and day after day this is the labourer’s dinner.” The advance of industry resulted for him, in this harsh and damp climate, in “the abandonment of the solid homespun clothing in favour of the cheap and so-called cotton goods,” and of stronger drinks for so-called tea. “The agriculturist, after several hours’ exposure to wind and rain, pins his cottage to sit by a fire of peat or of balls of clay and small coal kneaded together, from which volumes of carbonic and sulphurous acids are poured forth. His walls are of mud and stones, his floor the bare earth which was there before the hut was built, his roof a mass of loose and sodden thatch. Every crevice is topped to maintain warmth, and in an atmosphere of diabolic odour, with a mud floor, with his only clothes drying on his back, he often sups and sleeps with his wife and children. Obstetricians who have passed parts of the night in such cabins have described how they found their feet sinking in the mud of the floor, and they were forced (easy task) to drill a hole through the wall to effect a little private respiration. It was attested by numerous witnesses in various grades of life, that to these insanitary influences, and many more, the underfed peasant was nightly exposed, and of the result, a debilitated and scrofulous people, there was no want of evidence.... The statements of the relieving officers of Carmarthenshire and Cardiganshire show in a striking way the same state of things. There is besides “a plague more horrible still, the great number of idiots.” Now a word on the climatic conditions. “A strong south-west wind blows over the whole country for 8 or 9 months in the year, bringing with it torrents of rain, which discharge principally upon the western slopes of the hills. Trees are rare, except in sheltered places, and where not protected, are blown out of all shape. The cottages generally crouch under some bank, or often in a ravine or quarry, and none but the smallest sheep and native cattle can live on the pastures.... The young people migrate to the eastern mining districts of Glamorgan and Monmouth. Carmarthenshire is the breeding ground of the mining population and their hospital. The population can therefore barely maintain its numbers.” Thus in Cardiganshire:<br/><br/>Dr. Hunter’s Report in “Public Health, Seventh Report. 1865,” pp. 498-502, passim.
