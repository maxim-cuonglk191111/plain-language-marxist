  - id: p00410
    type: footnote
    label: "101"
    text: In order to understand that which follows, we must remember that “Close Villages” are those whose owners are one or two large landlords. “Open villages,” those whose soil belongs to many smaller landlords. It is in the latter that building speculators can build cottages and lodging-houses.
    hash: sha256:b45f8f60d555fdae0fe0dbf3c1ddece9782777ea28e5d82bffe6790bb3066ac6
    state: active
  - id: p00411
    type: footnote
    label: "102"
    text: A show-village of this kind looks very nice, but is as unreal as the villages that Catherine II. saw on her journey to the Crimea. In recent times the shepherd also has often been banished from these show-villages; <i>e.g</i>., near Market Harboro is sheep-farm of about 500 acres, which only employs the labour of one man. To reduce the long trudges over these wide plains, the beautiful pastures of Leicester and Northampton, the shepherd used to get a cottage on the farm. Now they give him a thirteenth shilling a week for lodging, that he must find far away in an open village.
    hash: sha256:541f416f10486cc3a27eb4cc5718b1c1f9649c0f57d879aa0dbd679ea9958301
    state: active
  - id: p00412
    type: footnote
    label: "103"
    text: “The labourers’ houses (in the open villages, which, of course, are always overcrowded) are usually in rows, built with their backs against the extreme edge of the plot of land which the builder could call his, and on this account are not allowed light and air, except from the front.” (Dr. Hunter’s Report, l. c., p. 135.) Very often the beerseller or grocer of the village is at the same time the letter of its houses. In this case the agricultural labourer finds in him a second master, besides the farmer. He must be his customer as well as his tenant. “The hind with his 10s. a week, minus a rent of £4 a year ... is obliged to buy at the seller’s own terms, his modicum of tea, sugar, flour, soap, candles, and beer.” (l. c., p. 132.) These open villages form, in fact, the “penal settlements” of the English agricultural proletariat. Many of the cottages are simply lodging-houses, through which all the rabble of the neighbourhood passes. The country labourer and his family who had often, in a way truly wonderful, preserved, under the foulest conditions, a thoroughness and purity of character, go, in these, utterly to the devil. It is, of course, the fashion amongst the aristocratic shylocks to shrug their shoulders pharisaically at the building speculators, the small landlords, and the open villages. They know well enough that their “close villages” and “show-villages” are the birth-places of the open villages, and could not exist without them. “The labourers ... were it not for the small owners, would, for by far the most part, have to sleep under the trees of the farms on which they work.” (l. c., p. 135.) The system of “open” and “closed” villages obtains in all the Midland counties and throughout the East of England.
    hash: sha256:687c8c16cc910fe4e0eda4a5f55bb03d184f8da560f4c15f492fbc5e4db6568b
    state: active
  - id: p00413
    type: footnote
    label: "104"
    text: “The employer ... is ... directly or indirectly securing to himself the profit on a man employed at 10s. a week, and receiving from this poor hind £4 or £5 annual rent for houses not worth £20 in a really free market, but maintained at their artificial value by the power of the owner to say ‘Use my house, or go seek a hiring elsewhere without a character from me....’ Does a man wish to better himself, to go as a plate-layer on the railway, or to begin quarry-work, the same power is ready with ‘Work for me at this low rate of wages or begone at a week’s notice; take your pig with you, and get what you can for the potatoes growing in your garden.’ Should his interest appear to be better served by it, an enhanced rent is sometimes preferred in these cases by the owner (<i>i.e</i>., the farmer) as the penalty for leaving his service.” (Dr. Hunter, l. c., p. 132.)
    hash: sha256:2860a5afdcf2a34f608ecdf1991a8b3d30796f6862b653a978d58c9aaf86eafe
    state: active
  - id: p00414
    type: footnote
    label: "105"
    text: "“New married couples are no edifying study for grown-up brothers and sisters: and though instances must not be recorded, sufficient data are remembered to warrant the remark, that great depression and sometimes death are the lot of the female participator in the offence of incest.” (Dr. Hunter, l. c., p. 137.) A member of the rural police who had for many years been a detective in the worst quarters of London, says of the girls of his village: “their boldness and shamelessness I never saw equalled during some years of police life and detective duty in the worst parts of London .... They live like pigs, great boys and girls, mothers and fathers, all sleeping in one room, in many instances.” (“Child. Empl. Com. Sixth Report, 1867,” p. 77 sq. 155.)"
    hash: sha256:4b49018b698e94aaaa9d103371378ad6c51ca7ab8e5014535779d1a1e110614c
    state: active
  - id: p00415
    type: footnote
    label: "106"
    text: “Public Health. Seventh Report, 1865,” pp. 9, 14 passim.
    hash: sha256:7395cc10d0ad2488693d8dee677c3c842e5bcef6945aa6f04c4d0d2703c3cf02
    state: active
  - id: p00416
    type: footnote
    label: "107"
    text: “The heaven-born employment of the hind gives dignity even to his position. He is not a slave, but a soldier of peace, and deserves his place in married men’s quarters to be provided by the landlord, who has claimed a power of enforced labour similar to that the country demands of the soldier. He no more receives market-price for his work than does the soldier. Like the soldier he is caught young, ignorant, knowing only his own trade, and his own locality. Early marriage and the operation of the various laws of settlement affect the one as enlistment and the Mutiny Act affect the other.” (Dr. Hunter, l. c., p. 132.) Sometimes an exceptionally soft-hearted landlord relents as the solitude he has created. “It is a melancholy thing to stand alone in one’s country,” said Lord Leicester, when complimented on the completion of Hookham. “I look around and not a house is to be seen but mine. I am the giant of Giant Castle, and have eat up all my neighbours.”
    hash: sha256:21647854b17e08e0f4dbc95bb4f65037eb19fb3638d691beb4d0cc1f729bc399
    state: active
  - id: p00417
    type: footnote
    label: "108"
    text: A similar movement is seen during the last ten years in France; in proportion as capitalist production there takes possession of agriculture, it drives the “surplus” agricultural population into the towns. Here also we find deterioration in the housing and other conditions at the source of the surplus population. On the special “prolétariat foncier,” to which this system of parcelling out the land has given rise, see, among others, the work of Colins, already quoted, and Karl Marx “Der Achtzehnte Brumaire des Louis Bonaparte.” 2nd edition. Hamburg, 1869, pp. 56, &amp;c. In 1846, the town population in France was represented by 24.42, the agricultural by 75.58; in 1861, the town by 28.86, the agricultural by 71.14 per cent. During the last 5 years, the diminution of the agricultural percentage of the population has been yet more marked. As early as 1846, Pierre Dupont in his “Ouvriers” sang:<br/><br/>Mal vêtus, logés dans des trous,<br/>Sous les combles, dans les décombres,<br/>Nous vivons avec les hiboux<br/>Et les larrons, amis des ombres.<br/>[Badly clothed, living in holes, under the eaves, in the ruins, with the owls and the thieves, companions of the shadows]
    hash: sha256:02f550bbdb096a68c715680a86a05db11263af1844e73c5e9deb62bd51cede69
    state: active
  - id: p00418
