  - id: p00318
    type: footnote
    label: "10"
    text: "“If we now return to our first inquiry, wherein it was shown that capital itself is only the result of human labour... it seems quite incomprehensible that man can have fallen under the domination of capital, his own product; can be subordinated to it; and as in reality this is beyond dispute the case, involuntarily the question arises: How has the labourer been able to pass from being master of capital — as its creator — to being its slave?” (Von Thünen, “Der isolierte Staat” Part ii., Section ii., Rostock, 1863, pp. 5, 6.) It is Thünen’s merit to have asked this question. His answer is simply childish."
