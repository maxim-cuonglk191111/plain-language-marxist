  - id: p00393
    type: footnote
    label: "85"
    text: 'The decrease of the middle-class farmers can be seen especially in the census category: “Farmer’s son, grandson, brother, nephew, daughter, granddaughter, sister, niece"; in a word, the members of his own family, employed by the farmer. This category numbered, in 1851, 216,851 persons; in 1861, only 176,151. From 1851 to 1871, the farms under 20 acres fell by more than 900 in number; those between 50 and 75 acres fell from 8,253 to 6,370; the same thing occurred with all other farms under 100 acres. On the other hand, during the same twenty years, the number of large farms increased; those of 300-500 acres rose from 7,771 to 8,410, those of more than 500 acres from 2,755 to 3,914, those of more than 1,000 acres from 492 to 582.'
