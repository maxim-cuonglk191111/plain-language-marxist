    text: "l. c., p. 18, Note. — The Relieving Officer of the Chapel-en-le-Frith Union reported to the Registar-General as follows: — “At Doveholes, a number of small excavations have been made into a large hillock of lime ashes (the refuse of lime-kilns), and which are used as dwellings, and occupied by labourers and others employed in the construction of a railway now in course of construction through that neighbourhood. The excavations are small and damp, and have no drains or privies about them, and not the slightest means of ventilation except up a hole pulled through the top, and used for a chimney. In consequence of this defect, small-pox has been raging for some time, and some deaths [amongst the troglodytes] have been caused by it.” (l. c., note 2.)"
