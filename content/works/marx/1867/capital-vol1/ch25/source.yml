    text: "See the official accounts in the Blue book: “Miscellaneous Statistics of the United Kingdom,” Part vi., London, 1866, pp. 260-273, passim. Instead of the statistics of orphan asylums, &amp;c., the declamations of the ministerial journals in recommending dowries for the Royal children might also serve. The greater dearness of the means of subsistence is never forgotten there."
