  - id: p00265
    type: paragraph
    text: "In the year 1865, 127,470 additional acres came under the heading “grass land,” chiefly because the area under the heading of “bog and waste unoccupied,” decreased by 101,543 acres. If we compare 1865 with 1864, there is a decrease in cereals of 246,667 qrs., of which 48,999 were wheat, 160,605 oats, 29,892 barley, &amp;c.: the decrease in potatoes was 446,398 tons, although the area of their cultivation increased in 1865."
    hash: sha256:1dcbc953107ef370305d53ac568ccf8e4d2b564bf080f9c4ce58b02836a7fb24
    state: active
  - id: p00266
    type: paragraph
    text: From the movement of population and the agricultural produce of Ireland, we pass to the movement in the purse of its landlords, larger farmers, and industrial capitalists. It is reflected in the rise and fall of the Income-tax. It may be remembered that Schedule D. (profits with the exception of those of farmers), includes also the so-called, “professional” profits — <i>i.e</i>., the incomes of lawyers, doctors, &amp;c.; and the Schedules C. and E., in which no special details are given, include the incomes of employees, officers, State sinecurists, State fundholders, &amp;c.
    hash: sha256:2d7a99ddbc221ef83b51adcbaf427716db4eee636f8b27545e9be3269ed6d84f
    state: active
