  - id: p00382
    type: footnote
    label: "74"
    text: "“Wholesale starvation of the London Poor.... Within the last few days the walls of London have been placarded with large posters, bearing the following remarkable announcement: — ‘Fat oxen! Starving men! The fat oxen from their palace of glass have gone to feed the rich in their luxurious abode, while the starving men are left to rot and die in their wretched dens.’ The placards bearing these ominous words are put up at certain intervals. No sooner has one set been defaced or covered over, than a fresh set is placarded in the former, or some equally public place.... This ... reminds one of the secret revolutionary associations which prepared the French people for the events of 1789.... At this moment, while English workmen with their wives and children are dying of cold and hunger, there are millions of English gold — the produce of English labour — being invested in Russian, Spanish, Italian, and other foreign enterprises.” —<i>Reynolds’ Newspaper,</i> January 20th, 1867."
