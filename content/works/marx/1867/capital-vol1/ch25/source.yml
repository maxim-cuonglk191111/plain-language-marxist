    text: "Chapter Twenty-Five: The General Law of Capitalist Accumulation"
    hash: sha256:ad1763080474dda7027dda2068210d894fbdeafb5c5b4eb070fd8be22f920238
    state: active
  - id: p00002
    type: heading
    level: 3
    text: Section 1.
    hash: sha256:e7e6300e14dec7497d79859438e92a0a5f2e4a8ab0c7f4d9cebcf51bae732d75
    state: active
  - id: p00003
    type: heading
    level: 4
    text: The Increased Demand for labour power that Accompanies Accumulation, the Composition of Capital Remaining the Same
    hash: sha256:bf745e16ce446c4b5a9192536b9c3133e4b5f74c30314c0d58dc8c275a4c1cbd
    state: active
  - id: p00004
    type: paragraph
    text: In this chapter we consider the influence of the growth of capital on the lot of the labouring class. The most important factor in this inquiry is the composition of capital and the changes it undergoes in the course of the process of accumulation.
    hash: sha256:41fc796c7e277d164103c20a3cdfa7ab7054542039abece22885b6202d4f000e
    state: active
  - id: p00005
    type: paragraph
    text: The composition of capital is to be understood in a two-fold sense. On the side of value, it is determined by the proportion in which it is divided into constant capital or value of the means of production, and variable capital or value of labour power, the sum total of wages. On the side of material, as it functions in the process of production, all capital is divided into means of production and living labour power. This latter composition is determined by the relation between the mass of the means of production employed, on the one hand, and the mass of labour necessary for their employment on the other. I call the former the <i>value-composition</i>, the latter the <i>technical composition</i> of capital.
    hash: sha256:33bd974e2d1dc4999fa09b933e9bb00bb7de689207767d98fe701a4b5ab3995e
    state: active
  - id: p00006
    type: paragraph
    text: Between the two there is a strict correlation. To express this, I call the value composition of capital, in so far as it is determined by its technical composition and mirrors the changes of the latter, the <i>organic composition</i> of capital. Wherever I refer to the composition of capital, without further qualification, its organic composition is always understood.
    hash: sha256:8703d19352c17b5491fed1cf2b619c370dd494a9ed787b583f12ef78d1ea8cc2
    state: active
  - id: p00007
    type: paragraph
    text: The many individual capitals invested in a particular branch of production have, one with another, more or less different compositions. The average of their individual compositions gives us the composition of the total capital in this branch of production. Lastly, the average of these averages, in all branches of production, gives us the composition of the total social capital of a country, and with this alone are we, in the last resort, concerned in the following investigation.
    hash: sha256:3e72695bf2d359f9c5697cf56121c813ac7f274c7739d8b40a8690babcb93c1c
    state: active
  - id: p00008
    type: paragraph
    text: Growth of capital involves growth of its variable constituent or of the part invested in labour power. A part of the surplus-value turned into additional capital must always be re-transformed into variable capital, or additional labour fund. If we suppose that, all other circumstances remaining the same, the composition of capital also remains constant (<i>i.e</i>., that a definite mass of means of production constantly needs the same mass of labour power to set it in motion), then the demand for labour and the subsistence-fund of the labourers clearly increase in the same proportion as the capital, and the more rapidly, the more rapidly the capital increases. Since the capital produces yearly a surplus-value, of which one part is yearly added to the original capital; since this increment itself grows yearly along with the augmentation of the capital already functioning; since lastly, under special stimulus to enrichment, such as the opening of new markets, or of new spheres for the outlay of capital in consequence of newly developed social wants, &amp;c., the scale of accumulation may be suddenly extended, merely by a change in the division of the surplus-value or surplus-product into capital and revenue, the requirements of accumulating capital may exceed the increase of labour power or of the number of labourers; the demand for labourers may exceed the supply, and, therefore, wages may rise. This must, indeed, ultimately be the case if the conditions supposed above continue. For since in each year more labourers are employed than in its predecessor, sooner or later a point must be reached, at which the requirements of accumulation begin to surpass the customary supply of labour, and, therefore, a rise of wages takes place. A lamentation on this score was heard in England during the whole of the fifteenth, and the first half of the eighteenth centuries. The more or less favourable circumstances in which the wage working class supports and multiplies itself, in no way alter the fundamental character of capitalist production. As simple reproduction constantly reproduces the capital relation itself, <i>i.e</i>., the relation of capitalists on the one hand, and wage workers on the other, so reproduction on a progressive scale, <i>i.e</i>., accumulation, reproduces the capital relation on a progressive scale, more capitalists or larger capitalists at this pole, more wage workers at that. The reproduction of a mass of labour power, which must incessantly re-incorporate itself with capital for that capital’s self-expansion; which cannot get free from capital, and whose enslavement to capital is only concealed by the variety of individual capitalists to whom it sells itself, this reproduction of labour power forms, in fact, an essential of the reproduction of capital itself. Accumulation of capital is, therefore, increase of the proletariat. <fn ref="1"/>
    hash: sha256:448eb9e25d9c975a830d4c159386df5780abdd51b08073c2c14cbc9d23143abb
    state: active
  - id: p00009
    type: paragraph
    text: "Classical economy grasped this fact so thoroughly that Adam Smith, Ricardo, &amp;c., as mentioned earlier, inaccurately identified accumulation with the consumption, by the productive labourers, of all the capitalised part of the surplus-product, or with its transformation into additional wage labourers. As early as 1696 John Bellers says:"
    hash: sha256:5da2b713f2a518869daaa4dae7e32989f5b57eacd8fe270f729bdd15548b4a06
    state: active
  - id: p00010
    type: blockquote
    text: “For if one had a hundred thousand acres of land and as many pounds in money, and as many cattle, without a labourer, what would the rich man be, but a labourer? And as the labourers make men rich, so the more labourers there will be, the more rich men ... the labour of the poor being the mines of the rich.” <fn ref="2"/>
    hash: sha256:eef52caa54fddf743ab759c7975d5bf0c1fe63daf319adb50e3c91844a7dbc17
    state: active
  - id: p00011
    type: paragraph
    text: "So also Bernard de Mandeville at the beginning of the eighteenth century:"
    hash: sha256:f6c42ff52f3e4361aca7bcbb44b38918c561ed66291e7abb694e7b7e031d92de
    state: active
  - id: p00012
    type: blockquote
    text: “It would be easier, where property is well secured, to live without money than without poor; for who would do the work? ... As they [the poor] ought to be kept from starving, so they should receive nothing worth saving. If here and there one of the lowest class by uncommon industry, and pinching his belly, lifts himself above the condition he was brought up in, nobody ought to hinder him; nay, it is undeniably the wisest course for every person in the society, and for every private family to be frugal; but it is the interest of all rich nations, that the greatest part of the poor should almost never be idle, and yet continually spend what they get.... Those that get their living by their daily labour ... have nothing to stir them up to be serviceable but their wants which it is prudence to relieve, but folly to cure. The only thing then that can render the labouring man industrious, is a moderate quantity of money, for as too little will, according as his temper is, either dispirit or make him desperate, so too much will make him insolent and lazy.... From what has been said, it is manifest, that, in a free nation, where slaves are not allowed of, the surest wealth consists in a multitude of laborious poor; for besides, that they are the never-failing nursery of fleets and armies, without them there could be no enjoyment, and no product of any country could be valuable. “To make the society” [which of course consists of non-workers] “happy and people easier under the meanest circumstances, it is requisite that great numbers of them should be ignorant as well as poor; knowledge both enlarges and multiplies our desires, and the fewer things a man wishes for, the more easily his necessities may be supplied.” <fn ref="3"/>
    hash: sha256:624ddab560f4bb08832410f2935952622e588a2f11a7a1e8e2848e23ea86473f
    state: active
  - id: p00013
    type: paragraph
    text: What Mandeville, an honest, clear-headed man, had not yet seen, is that the mechanism of the process of accumulation itself increases, along with the capital, the mass of “labouring poor,” <i>i.e</i>., the wage labourers, who turn their labour power into an increasing power of self-expansion of the growing capital, and even by doing so must eternise their dependent relation on their own product, as personified in the capitalists. In reference to this relation of dependence, Sir F. M. Eden in his “The State of the Poor, an History of the Labouring Classes in England,” says,
    hash: sha256:a2371d9fdb4dee0dffa212be5ff96e2d3aa656b6e15eaaa411c11d9eb5e38bcb
    state: active
  - id: p00014
    type: blockquote
    text: “the natural produce of our soil is certainly not fully adequate to our subsistence; we can neither be clothed, lodged nor fed but in consequence of some previous labour. A portion at least of the society must be indefatigably employed .... There are others who, though they ‘neither toil nor spin,’ can yet command the produce of industry, but who owe their exemption from labour solely to civilisation and order .... They are peculiarly the creatures of civil institutions, <fn ref="4"/> which have recognised that individuals may acquire property by various other means besides the exertion of labour.... Persons of independent fortune ... owe their superior advantages by no means to any superior abilities of their own, but almost entirely ... to the industry of others. It is not the possession of land, or of money, but the command of labour which distinguishes the opulent from the labouring part of the community .... This [scheme approved by Eden] would give the people of property sufficient (but by no means too much) influence and authority over those who ... work for them; and it would place such labourers, not in an abject or servile condition, but in such a state of easy and liberal dependence as all who know human nature, and its history, will allow to be necessary for their own comfort.” <fn ref="5"/>
    hash: sha256:bb816c1e1a4b6942bac91a59e7e10b96d0560b8349deafcd01d48df727132820
    state: active
  - id: p00015
    type: paragraph
    text: Sir F. M. Eden, it may be remarked in passing, is the only disciple of Adam Smith during the eighteenth century that produced any work of importance. <fn ref="6"/>
    hash: sha256:66ba0486328672d58aad4d55f6f98b82c63a56a86af0d2545330cb4ec1c30360
    state: active
  - id: p00016
    type: paragraph
    text: 'Under the conditions of accumulation supposed thus far, which conditions are those most favourable to the labourers, their relation of dependence upon capital takes on a form endurable or, as Eden says: “easy and liberal.” Instead of becoming more intensive with the growth of capital, this relation of dependence only becomes more extensive, <i>i.e</i>., the sphere of capital’s exploitation and rule merely extends with its own dimensions and the number of its subjects. A larger part of their own surplus-product, always increasing and continually transformed into additional capital, comes back to them in the shape of means of payment, so that they can extend the circle of their enjoyments; can make some additions to their consumption-fund of clothes, furniture, &amp;c., and can lay by small reserve funds of money. But just as little as better clothing, food, and treatment, and a larger peculium, do away with the exploitation of the slave, so little do they set aside that of the wage worker. A rise in the price of labour, as a consequence of accumulation of capital, only means, in fact, that the length and weight of the golden chain the wage worker has already forged for himself, allow of a relaxation of the tension of it. In the controversies on this subject the chief fact has generally been overlooked, viz., the <i>differentia specifica</i> {defining characteristic} of capitalistic production. Labour power is sold today, not with a view of satisfying, by its service or by its product, the personal needs of the buyer. His aim is augmentation of his capital, production of commodities containing more labour than he pays for, containing therefore a portion of value that costs him nothing, and that is nevertheless realised when the commodities are sold. Production of surplus-value is the absolute law of this mode of production. Labour power is only saleable so far as it preserves the means of production in their capacity of capital, reproduces its own value as capital, and yields in unpaid labour a source of additional capital. <fn ref="7"/> The conditions of its sale, whether more or less favourable to the labourer, include therefore the necessity of its constant re-selling, and the constantly extended reproduction of all wealth in the shape of capital. Wages, as we have seen, by their very nature, always imply the performance of a certain quantity of unpaid labour on the part of the labourer. Altogether, irrespective of the case of a rise of wages with a falling price of labour, &amp;c., such an increase only means at best a quantitative diminution of the unpaid labour that the worker has to supply. This diminution can never reach the point at which it would threaten the system itself. Apart from violent conflicts as to the rate of wages (and Adam Smith has already shown that in such a conflict, taken on the whole, the master is always master), a rise in the price of labour resulting from accumulation of capital implies the following alternative:'
    hash: sha256:bd1f52af465e72d75de0c7b068d990fa67bf24e83a28984cb51a399bbc5f66db
    state: active
  - id: p00017
    type: paragraph
    text: 'Either the price of labour keeps on rising, because its rise does not interfere with the progress of accumulation. In this there is nothing wonderful, for, says Adam Smith, “after these (profits) are diminished, stock may not only continue to increase, but to increase much faster than before.... A great stock, though with small profits, generally increases faster than a small stock with great profits.” (l. c., ii, p. 189.) In this case it is evident that a diminution in the unpaid labour in no way interferes with the extension of the domain of capital. — Or, on the other hand, accumulation slackens in consequence of the rise in the price of labour, because the stimulus of gain is blunted. The rate of accumulation lessens; but with its lessening, the primary cause of that lessening vanishes, <i>i.e</i>., the disproportion between capital and exploitable labour power. The mechanism of the process of capitalist production removes the very obstacles that it temporarily creates. The price of labour falls again to a level corresponding with the needs of the self-expansion of capital, whether the level be below, the same as, or above the one which was normal before the rise of wages took place. We see thus: In the first case, it is not the diminished rate either of the absolute, or of the proportional, increase in labour power, or labouring population, which causes capital to be in excess, but conversely the excess of capital that makes exploitable labour power insufficient. In the second case, it is not the increased rate either of the absolute, or of the proportional, increase in labour power, or labouring population, that makes capital insufficient; but, conversely, the relative diminution of capital that causes the exploitable labour power, or rather its price, to be in excess. It is these absolute movements of the accumulation of capital which are reflected as relative movements of the mass of exploitable labour power, and therefore seem produced by the latter’s own independent movement. To put it mathematically: the rate of accumulation is the independent, not the dependent, variable; the rate of wages, the dependent, not the independent, variable. Thus, when the industrial cycle is in the phase of crisis, a general fall in the price of commodities is expressed as a rise in the value of money, and, in the phase of prosperity, a general rise in the price of commodities, as a fall in the value of money. The so-called currency school concludes from this that with high prices too much, with low prices too little <fn ref="8"/> money is in circulation. Their ignorance and complete misunderstanding of facts <fn ref="9"/> are worthily paralleled by the economists, who interpret the above phenomena of accumulation by saying that there are now too few, now too many wage labourers.'
    hash: sha256:fec3e48e9e7bd0d241c63227bce288ec228cfb2445bd28dad5043bc89a620f45
    state: active
  - id: p00018
    type: paragraph
    text: 'The law of capitalist production, that is at the bottom of the pretended “natural law of population,” reduces itself simply to this: The correlation between accumulation of capital and rate of wages is nothing else than the correlation between the unpaid labour transformed into capital, and the additional paid labour necessary for the setting in motion of this additional capital. It is therefore in no way a relation between two magnitudes, independent one of the other: on the one hand, the magnitude of the capital; on the other, the number of the labouring population; it is rather, at bottom, only the relation between the unpaid and the paid labour of the same labouring population. If the quantity of unpaid labour supplied by the working class, and accumulated by the capitalist class, increases so rapidly that its conversion into capital requires an extraordinary addition of paid labour, then wages rise, and, all other circumstances remaining equal, the unpaid labour diminishes in proportion. But as soon as this diminution touches the point at which the surplus labour that nourishes capital is no longer supplied in normal quantity, a reaction sets in: a smaller part of revenue is capitalised, accumulation lags, and the movement of rise in wages receives a check. The rise of wages therefore is confined within limits that not only leave intact the foundations of the capitalistic system, but also secure its reproduction on a progressive scale. The law of capitalistic accumulation, metamorphosed by economists into pretended law of Nature, in reality merely states that the very nature of accumulation excludes every diminution in the degree of exploitation of labour, and every rise in the price of labour, which could seriously imperil the continual reproduction, on an ever-enlarging scale, of the capitalistic relation. It cannot be otherwise in a mode of production in which the labourer exists to satisfy the needs of self-expansion of existing values, instead of, on the contrary, material wealth existing to satisfy the needs of development on the part of the labourer. As, in religion, man is governed by the products of his own brain, so in capitalistic production, he is governed by the products of his own hand. <fn ref="10"/>'
    hash: sha256:0f759131719c64ec54e1bfc39b5544ea14d110a92135844f72c138e59b58a10b
    state: active
  - id: p00019
    type: heading
    level: 3
    text: Section 2.
    hash: sha256:9b7602645a912135ecd3d451c798cce3aaff931afb22ba7d9caf3489e3d89bb1
    state: active
  - id: p00020
    type: heading
    level: 4
    text: Relative Diminution of the Variable Part of Capital Simultaneously with the Progress of Accumulation and of the Concentration that Accompanies it
    hash: sha256:85625098ae5eca19c68b37e42998cfea56f680bbfb4e1a7c746a6b27cad8e39b
    state: active
  - id: p00021
    type: paragraph
    text: According to the economists themselves, it is neither the actual extent of social wealth, nor the magnitude of the capital already functioning, that lead to a rise of wages, but only the constant growth of accumulation and the degree of rapidity of that growth. (Adam Smith, Book I., chapter 8.) So far, we have only considered one special phase of this process, that in which the increase of capital occurs along with a constant technical composition of capital. But the process goes beyond this phase.
    hash: sha256:c5e7a1819b09097309a5af1a37768e7a123b834a320459521ceb21199feac556
    state: active
  - id: p00022
    type: paragraph
    text: Once given the general basis of the capitalistic system, then, in the course of accumulation, a point is reached at which the development of the productivity of social labour becomes the most powerful lever of accumulation.
    hash: sha256:ba1aad749b5cb33941e99e94d1d2ffe1602da2dc4290adab9dbe0f0e51c65893
    state: active
  - id: p00023
    type: blockquote
    text: “The same cause,” says Adam Smith, “which raises the wages of labour, the increase of stock, tends to increase its productive powers, and to make a smaller quantity of labour produce a greater quantity of work.” <fn ref="11"/>
    hash: sha256:f20737c53e379ce99579bb7043c9923d69536f50df4131fb9e87a8d031f97fab
    state: active
  - id: p00024
    type: paragraph
    text: Apart from natural conditions, such as fertility of the soil, &amp;c., and from the skill of independent and isolated producers (shown rather qualitatively in the goodness than quantitatively in the mass of their products), the degree of productivity of labour, in a given society, is expressed in the relative extent of the means of production that one labourer, during a given time, with the same tension of labour power, turns into products. The mass of the means of production which he thus transforms, increases with the productiveness of his labour. But those means of production play a double part. The increase of some is a consequence, that of the others a condition of the increasing productivity of labour. <i>E.g.,</i> with the division of labour in manufacture, and with the use of machinery, more raw material is worked up in the same time, and, therefore, a greater mass of raw material and auxiliary substances enter into the labour process. That is the consequence of the increasing productivity of labour. On the other hand, the mass of machinery, beasts of burden, mineral manures, drain-pipes, &amp;c., is a condition of the increasing productivity of labour. So also is it with the means of production concentrated in buildings, furnaces, means of transport, &amp;c. But whether condition or consequence, the growing extent of the means of production, as compared with the labour power incorporated with them, is an expression of the growing productiveness of labour. The increase of the latter appears, therefore, in the diminution of the mass of labour in proportion to the mass of means of production moved by it, or in the diminution of the subjective factor of the labour process as compared with the objective factor.
    hash: sha256:bb7243fa84ed43c543304d8cd791d01df1f9500f28af5c75e4b0862918356182
    state: active
  - id: p00025
    type: paragraph
    text: This change in the technical composition of capital, this growth in the mass of means of production, as compared with the mass of the labour power that vivifies them, is reflected again in its value composition, by the increase of the constant constituent of capital at the expense of its variable constituent. There may be, <i>e.g.,</i> originally 50 per cent. of a capital laid out in means of production, and 50 per cent. in labour power; later on, with the development of the productivity of labour, 80 per cent. in means of production, 20 per cent. in labour power, and so on. This law of the progressive increase in constant capital, in proportion to the variable, is confirmed at every step (as already shown) by the comparative analysis of the prices of commodities, whether we compare different economic epochs or different nations in the same epoch. The relative magnitude of the element of price, which represents the value of the means of production only, or the constant part of capital consumed, is in direct, the relative magnitude of the other element of price that pays labour (the variable part of capital) is in inverse proportion to the advance of accumulation.
    hash: sha256:a6eb5f5c8075c723d8412554a1766c214c00d90f8b550dfb5f5583243c8f8131
    state: active
  - id: p00026
    type: paragraph
    text: This diminution in the variable part of capital as compared with the constant, or the altered value-composition of the capital, however, only shows approximately the change in the composition of its material constituents. If, <i>e.g.,</i> the capital-value employed today in spinning is 7/8 constant and 1/8 variable, whilst at the beginning of the 18th century it was ½ constant and ½ variable, on the other hand, the mass of raw material, instruments of labour, &amp;c., that a certain quantity of spinning labour consumes productively today, is many hundred times greater than at the beginning of the 18th century. The reason is simply that, with the increasing productivity of labour, not only does the mass of the means of production consumed by it increase, but their value compared with their mass diminishes. Their value therefore rises absolutely, but not in proportion to their mass. The increase of the difference between constant and variable capital, is, therefore, much less than that of the difference between the mass of the means of production into which the constant, and the mass of the labour power into which the variable, capital is converted. The former difference increases with the latter, but in a smaller degree.
    hash: sha256:c6d116809203b977dc2c1b78ae5fb0baade878aad0916e955f41cc6b5ab0a7ca
    state: active
  - id: p00027
    type: paragraph
    text: But, if the progress of accumulation lessens the relative magnitude of the variable part of capital, it by no means, in doing this, excludes the possibility of a rise in its absolute magnitude. Suppose that a capital-value at first is divided into 50 per cent. of constant and 50 per cent. of variable capital; later into 80 per cent. of constant and 20 per cent. of variable. If in the meantime the original capital, say £6,000, has increased to £18,000, its variable constituent has also increased. It was £3,000, it is now £3,600. But where as formerly an increase of capital by 20 per cent. would have sufficed to raise the demand for labour 20 per cent., now this latter rise requires a tripling of the original capital.
    hash: sha256:44017cf29e13d97e6fdd9141f329e8476094d22ae7e066b1f2bc6b889bd1c544
    state: active
  - id: p00028
    type: paragraph
    text: In Part IV, it was shown, how the development of the productiveness of social labour presupposes co-operation on a large scale; how it is only upon this supposition that division and combination of labour can be organised, and the means of production economised by concentration on a vast scale; how instruments of labour which, from their very nature, are only fit for use in common, such as a system of machinery, can be called into being; how huge natural forces can be pressed into the service of production; and how the transformation can be effected of the process of production into a technological application of science. On the basis of the production of commodities, where the means of production are the property of private persons, and where the artisan therefore either produces commodities, isolated from and independent of others, or sells his labour power as a commodity, because he lacks the means for independent industry, co-operation on a large scale can realise itself only in the increase of individual capitals, only in proportion as the means of social production and the means of subsistence are transformed into the private property of capitalists. The basis of the production of commodities can admit of production on a large scale in the capitalistic form alone. A certain accumulation of capital, in the hands of individual producers of commodities, forms therefore the necessary preliminary of the specifically capitalistic mode of production. We had, therefore, to assume that this occurs during the transition from handicraft to capitalistic industry. It may be called primitive accumulation, because it is the historic basis, instead of the historic result of specifically capitalist production. How it itself originates, we need not here inquire as yet. It is enough that it forms the starting point. But all methods for raising the social productive power of labour that are developed on this basis, are at the same time methods for the increased production of surplus-value or surplus-product, which in its turn is the formative element of accumulation. They are, therefore, at the same time methods of the production of capital by capital, or methods of its accelerated accumulation. The continual re-transformation of surplus-value into capital now appears in the shape of the increasing magnitude of the capital that enters into the process of production. This in turn is the basis of an extended scale of production, of the methods for raising the productive power of labour that accompany it, and of accelerated production of surplus-value. If, therefore, a certain degree of accumulation of capital appears as a condition of the specifically capitalist mode of production, the latter causes conversely an accelerated accumulation of capital. With the accumulation of capital, therefore, the specifically capitalistic mode of production develops, and with the capitalist mode of production the accumulation of capital. Both these economic factors bring about, in the compound ratio of the impulses they reciprocally give one another, that change in the technical composition of capital by which the variable constituent becomes always smaller and smaller as compared with the constant.
    hash: sha256:5495c51500aa9eb945a1ebcfc9378f7231c659abb934d4ec841f27f83ca23886
    state: active
  - id: p00029
    type: paragraph
    text: "Every individual capital is a larger or smaller concentration of means of production, with a corresponding command over a larger or smaller labour-army. Every accumulation becomes the means of new accumulation. With the increasing mass of wealth which functions as capital, accumulation increases the concentration of that wealth in the hands of individual capitalists, and thereby widens the basis of production on a large scale and of the specific methods of capitalist production. The growth of social capital is effected by the growth of many individual capitals. All other circumstances remaining the same, individual capitals, and with them the concentration of the means of production, increase in such proportion as they form aliquot parts of the total social capital. At the same time portions of the original capitals disengage themselves and function as new independent capitals. Besides other causes, the division of property, within capitalist families, plays a great part in this. With the accumulation of capital, therefore, the number of capitalists grows to a greater or less extent. Two points characterise this kind of concentration which grows directly out of, or rather is identical with, accumulation. First: The increasing concentration of the social means of production in the hands of individual capitalists is, other things remaining equal, limited by the degree of increase of social wealth. Second: The part of social capital domiciled in each particular sphere of production is divided among many capitalists who face one another as independent commodity-producers competing with each other. Accumulation and the concentration accompanying it are, therefore, not only scattered over many points, but the increase of each functioning capital is thwarted by the formation of new and the sub-division of old capitals. Accumulation, therefore, presents itself on the one hand as increasing concentration of the means of production, and of the command over labour; on the other, as repulsion of many individual capitals one from another."
    hash: sha256:d9e1f1c0bc50c7237c2fecd838b8bfec3ce932c068f6a7075e8648c13cdc5621
    state: active
  - id: p00030
    type: paragraph
    text: This splitting-up of the total social capital into many individual capitals or the repulsion of its fractions one from another, is counteracted by their attraction. This last does not mean that simple concentration of the means of production and of the command over labour, which is identical with accumulation. It is concentration of capitals already formed, destruction of their individual independence, expropriation of capitalist by capitalist, transformation of many small into few large capitals. This process differs from the former in this, that it only presupposes a change in the distribution of capital already to hand, and functioning; its field of action is therefore not limited by the absolute growth of social wealth, by the absolute limits of accumulation. Capital grows in one place to a huge mass in a single hand, because it has in another place been lost by many. This is centralisation proper, as distinct from accumulation and concentration.
    hash: sha256:4c9de7b160825a70a7949def88e7018d9a32c33493bcab4298334156752712d0
    state: active
  - id: p00031
    type: paragraph
    text: The laws of this centralisation of capitals, or of the attraction of capital by capital, cannot be developed here. A brief hint at a few facts must suffice. The battle of competition is fought by cheapening of commodities. The cheapness of commodities demands, <i>caeteris paribus,</i> on the productiveness of labour, and this again on the scale of production. Therefore, the larger capitals beat the smaller. It will further be remembered that, with the development of the capitalist mode of production, there is an increase in the minimum amount of individual capital necessary to carry on a business under its normal conditions. The smaller capitals, therefore, crowd into spheres of production which Modern Industry has only sporadically or incompletely got hold of. Here competition rages in direct proportion to the number, and in inverse proportion to the magnitudes, of the antagonistic capitals. It always ends in the ruin of many small capitalists, whose capitals partly pass into the hands of their conquerors, partly vanish. Apart from this, with capitalist production an altogether new force comes into play — the credit system, which in its first stages furtively creeps in as the humble assistant of accumulation, drawing into the hands of individual or associated capitalists, by invisible threads, the money resources which lie scattered, over the surface of society, in larger or smaller amounts; but it soon becomes a new and terrible weapon in the battle of competition and is finally transformed into an enormous social mechanism for the centralisation of capitals.
    hash: sha256:32bacd61b8cf66009299f397de521a45e9fa5f15e2a18b9d71810e682c9aaaff
    state: active
  - id: p00032
    type: paragraph
    text: Commensurately with the development of capitalist production and accumulation there develop the two most powerful levers of centralisation — competition and credit. At the same time the progress of accumulation increases the material amenable to centralisation, <i>i.e</i>., the individual capitals, whilst the expansion of capitalist production creates, on the one hand, the social want, and, on the other, the technical means necessary for those immense industrial undertakings which require a previous centralisation of capital for their accomplishment. Today, therefore, the force of attraction, drawing together individual capitals, and the tendency to centralisation are stronger than ever before. But if the relative extension and energy of the movement towards centralisation is determined, in a certain degree, by the magnitude of capitalist wealth and superiority of economic mechanism already attained, progress in centralisation does not in any way depend upon a positive growth in the magnitude of social capital. And this is the specific difference between centralisation and concentration, the latter being only another name for reproduction on an extended scale. Centralisation may result from a mere change in the distribution of capitals already existing, from a simple alteration in the quantitative grouping of the component parts of social capital. Here capital can grow into powerful masses in a single hand because there it has been withdrawn from many individual hands. In any given branch of industry centralisation would reach its extreme limit if all the individual capitals invested in it were fused into a single capital. <fn ref="12"/> In a given society the limit would be reached only when the entire social capital was united in the hands of either a single capitalist or a single capitalist company.
    hash: sha256:8016bf851b749f149f987f758eb637baf4fa1599bd1ee83d0dfd83b33fa070b8
    state: active
  - id: p00033
    type: paragraph
    text: Centralisation completes the work of accumulation by enabling industrial capitalists to extend the scale of their operations. Whether this latter result is the consequence of accumulation or centralisation, whether centralisation is accomplished by the violent method of annexation — when certain capitals become such preponderant centres of attraction for others that they shatter the individual cohesion of the latter and then draw the separate fragments to themselves — or whether the fusion of a number of capitals already formed or in process of formation takes place by the smoother process of organising joint-stock companies — the economic effect remains the same. Everywhere the increased scale of industrial establishments is the starting point for a more comprehensive organisation of the collective work of many, for a wider development of their material motive forces — in other words, for the progressive transformation of isolated processes of production, carried on by customary methods, into processes of production socially combined and scientifically arranged.
    hash: sha256:5e62b04f638df47a10566a82157b5c24df2ed450c1e41442c67882ba6675511a
    state: active
  - id: p00034
    type: paragraph
    text: But accumulation, the gradual increase of capital by reproduction as it passes from the circular to the spiral form, is clearly a very slow procedure compared with centralisation, which has only to change the quantitative groupings of the constituent parts of social capital. The world would still be without railways if it had had to wait until accumulation had got a few individual capitals far enough to be adequate for the construction of a railway. Centralisation, on the contrary, accomplished this in the twinkling of an eye, by means of joint-stock companies. And whilst centralisation thus intensifies and accelerates the effects of accumulation, it simultaneously extends and speeds those revolutions in the technical composition of capital which raise its constant portion at the expense of its variable portion, thus diminishing the relative demand for labour.
    hash: sha256:d0c446393751ba114baf6d732f92ccdc10abde481ae935df8cb256dd0880cb42
    state: active
  - id: p00035
    type: paragraph
    text: The masses of capital fused together overnight by centralisation reproduce and multiply as the others do, only more rapidly, thereby becoming new and powerful levers in social accumulation. Therefore, when we speak of the progress of social accumulation we tacitly include — today — the effects of centralisation.
    hash: sha256:ce971d84b5bde2f85e681fe0e2495f77e1f1af0b6c244eff923fa7881e858958
    state: active
  - id: p00036
    type: paragraph
    text: The additional capitals formed in the normal course of accumulation (see Chapter XXIV, Section 1) serve particularly as vehicles for the exploitation of new inventions and discoveries, and industrial improvements in general. But in time the old capital also reaches the moment of renewal from top to toe, when it sheds its skin and is reborn like the others in a perfected technical form, in which a smaller quantity of labour will suffice to set in motion a larger quantity of machinery and raw materials. The absolute reduction in the demand for labour which necessarily follows from this is obviously so much the greater the higher the degree in which the capitals undergoing this process of renewal are already massed together by virtue of the centralisation movement.
    hash: sha256:45d616d5985a17fd05519a436b858599ebb6fc4470d94cd4cae9f77c6a42a709
    state: active
  - id: p00037
    type: paragraph
    text: On the one hand, therefore, the additional capital formed in the course of accumulation attracts fewer and fewer labourers in proportion to its magnitude. On the other hand, the old capital periodically reproduced with change of composition, repels more and more of the labourers formerly employed by it.
    hash: sha256:84695213ff00332baac1956aa8e8ee798a3b2224a35fb2b3d97f7f59bc334bc8
    state: active
  - id: p00038
    type: heading
    level: 3
    text: Section 3.
    hash: sha256:b3c491cd9c7fec9493d1a83d63f4f25c1544f1bf66e5a98d5b1420575b721cf3
    state: active
  - id: p00039
    type: heading
    level: 4
    text: Progressive Production of a Relative surplus population or Industrial Reserve Army
    hash: sha256:8ebebf85665f8c4585bb994f11b02eb070c0291de7ce745b5d33b598df44c485
    state: active
  - id: p00040
    type: paragraph
    text: The accumulation of capital, though originally appearing as its quantitative extension only, is effected, as we have seen, under a progressive qualitative change in its composition, under a constant increase of its constant, at the expense of its variable constituent. <fn ref="13"/>
    hash: sha256:89c35702125aa697cde6899fafac9a1d6afe68118741b110240240fd1ce297d0
    state: active
  - id: p00041
    type: paragraph
    text: The specifically capitalist mode of production, the development of the productive power of labour corresponding to it, and the change thence resulting in the organic composition of capital, do not merely keep pace with the advance of accumulation, or with the growth of social wealth. They develop at a much quicker rate, because mere accumulation, the absolute increase of the total social capital, is accompanied by the centralisation of the individual capitals of which that total is made up; and because the change in the technological composition of the additional capital goes hand in hand with a similar change in the technological composition of the original capital. With the advance of accumulation, therefore, the proportion of constant to variable capital changes. If it was originally say 1:1, it now becomes successively 2:1, 3:1, 4:1, 5:1, 7:1, &amp;c., so that, as the capital increases, instead of ½ of its total value, only 1/3, 1/4, 1/5, 1/6, 1/8, &amp;c., is transformed into labour-power, and, on the other hand, 2/3, 3/4, 4/5, 5/6, 7/8 into means of production. Since the demand for labour is determined not by the amount of capital as a whole, but by its variable constituent alone, that demand falls progressively with the increase of the total capital, instead of, as previously assumed, rising in proportion to it. It falls relatively to the magnitude of the total capital, and at an accelerated rate, as this magnitude increases. With the growth of the total capital, its variable constituent or the labour incorporated in it, also does increase, but in a constantly diminishing proportion. The intermediate pauses are shortened, in which accumulation works as simple extension of production, on a given technical basis. It is not merely that an accelerated accumulation of total capital, accelerated in a constantly growing progression, is needed to absorb an additional number of labourers, or even, on account of the constant metamorphosis of old capital, to keep employed those already functioning. In its turn, this increasing accumulation and centralisation becomes a source of new changes in the composition of capital, of a more accelerated diminution of its variable, as compared with its constant constituent. This accelerated relative diminution of the variable constituent, that goes along with the accelerated increase of the total capital, and moves more rapidly than this increase, takes the inverse form, at the other pole, of an apparently absolute increase of the labouring population, an increase always moving more rapidly than that of the variable capital or the means of employment. But in fact, it is capitalistic accumulation itself that constantly produces, and produces in the direct ratio of its own energy and extent, a relatively redundant population of labourers, <i>i.e</i>., a population of greater extent than suffices for the average needs of the self-expansion of capital, and therefore a surplus population.
    hash: sha256:309d71ef39e2e9b63e7b947d42a752f76dcdf0cbdcde965bde978eb0514ef923
    state: active
  - id: p00042
    type: paragraph
    text: Considering the social capital in its totality, the movement of its accumulation now causes periodical changes, affecting it more or less as a whole, now distributes its various phases simultaneously over the different spheres of production. In some spheres a change in the composition of capital occurs without increase of its absolute magnitude, as a consequence of simple centralisation; in others the absolute growth of capital is connected with absolute diminution of its variable constituent, or of the labour power absorbed by it; in others again, capital continues growing for a time on its given technical basis, and attracts additional labour power in proportion to its increase, while at other times it undergoes organic change, and lessens its variable constituent; in all spheres, the increase of the variable part of capital, and therefore of the number of labourers employed by it, is always connected with violent fluctuations and transitory production of surplus population, whether this takes the more striking form of the repulsion of labourers already employed, or the less evident but not less real form of the more difficult absorption of the additional labouring population through the usual channels. <fn ref="14"/> With the magnitude of social capital already functioning, and the degree of its increase, with the extension of the scale of production, and the mass of the labourers set in motion, with the development of the productiveness of their labour, with the greater breadth and fulness of all sources of wealth, there is also an extension of the scale on which greater attraction of labourers by capital is accompanied by their greater repulsion; the rapidity of the change in the organic composition of capital, and in its technical form increases, and an increasing number of spheres of production becomes involved in this change, now simultaneously, now alternately. The labouring population therefore produces, along with the accumulation of capital produced by it, the means by which it itself is made relatively superfluous, is turned into a relative surplus population; and it does this to an always increasing extent. <fn ref="15"/> This is a law of population peculiar to the capitalist mode of production; and in fact every special historic mode of production has its own special laws of population, historically valid within its limits and only in so far as man has not interfered with them.
    hash: sha256:da9b88479024a6250248a87389a93fbf905dc5e1b68ee702efcf4adc11762306
    state: active
  - id: p00043
    type: paragraph
    text: But if a surplus labouring population is a necessary product of accumulation or of the development of wealth on a capitalist basis, this surplus population becomes, conversely, the lever of capitalistic accumulation, nay, a condition of existence of the capitalist mode of production. It forms a disposable industrial reserve army, that belongs to capital quite as absolutely as if the latter had bred it at its own cost. Independently of the limits of the actual increase of population, it creates, for the changing needs of the self-expansion of capital, a mass of human material always ready for exploitation. With accumulation, and the development of the productiveness of labour that accompanies it, the power of sudden expansion of capital grows also; it grows, not merely because the elasticity of the capital already functioning increases, not merely because the absolute wealth of society expands, of which capital only forms an elastic part, not merely because credit, under every special stimulus, at once places an unusual part of this wealth at the disposal of production in the form of additional capital; it grows, also, because the technical conditions of the process of production themselves — machinery, means of transport, &amp;c. — now admit of the rapidest transformation of masses of surplus-product into additional means of production. The mass of social wealth, overflowing with the advance of accumulation, and transformable into additional capital, thrusts itself frantically into old branches of production, whose market suddenly expands, or into newly formed branches, such as railways, &amp;c., the need for which grows out of the development of the old ones. In all such cases, there must be the possibility of throwing great masses of men suddenly on the decisive points without injury to the scale of production in other spheres. Overpopulation supplies these masses. The course characteristic of modern industry, <i>viz</i>., a decennial cycle (interrupted by smaller oscillations), of periods of average activity, production at high pressure, crisis and stagnation, depends on the constant formation, the greater or less absorption, and the re-formation of the industrial reserve army or surplus population. In their turn, the varying phases of the industrial cycle recruit the surplus population, and become one of the most energetic agents of its reproduction. This peculiar course of modern industry, which occurs in no earlier period of human history, was also impossible in the childhood of capitalist production. The composition of capital changed but very slowly. With its accumulation, therefore, there kept pace, on the whole, a corresponding growth in the demand for labour. Slow as was the advance of accumulation compared with that of more modern times, it found a check in the natural limits of the exploitable labouring population, limits which could only be got rid of by forcible means to be mentioned later. The expansion by fits and starts of the scale of production is the preliminary to its equally sudden contraction; the latter again evokes the former, but the former is impossible without disposable human material, without an increase, in the number of labourers independently of the absolute growth of the population. This increase is effected by the simple process that constantly “sets free” a part of the labourers; by methods which lessen the number of labourers employed in proportion to the increased production. The whole form of the movement of modern industry depends, therefore, upon the constant transformation of a part of the labouring population into unemployed or half-employed hands. The superficiality of Political Economy shows itself in the fact that it looks upon the expansion and contraction of credit, which is a mere symptom of the periodic changes of the industrial cycle, as their cause. As the heavenly bodies, once thrown into a certain definite motion, always repeat this, so is it with social production as soon as it is once thrown into this movement of alternate expansion and contraction. Effects, in their turn, become causes, and the varying accidents of the whole process, which always reproduces its own conditions, take on the form of periodicity. When this periodicity is once consolidated, even Political Economy then sees that the production of a relative surplus population — <i>i.e</i>., surplus with regard to the average needs of the self-expansion of capital — is a necessary condition of modern industry.
    hash: sha256:4699e7b9cef043df5a4c5e33c945fc1a37385550f8d45ce5487280d72fe9f8f5
    state: active
  - id: p00044
    type: blockquote
    text: “Suppose,” says H. Merivale, formerly Professor of Political Economy at Oxford, subsequently employed in the English Colonial Office, “suppose that, on the occasion of some of these crises, the nation were to rouse itself to the effort of getting rid by emigration of some hundreds of thousands of superfluous arms, what would be the consequence? That, at the first returning demand for labour, there would be a deficiency. However rapid reproduction may be, it takes, at all events, the space of a generation to replace the loss of adult labour. Now, the profits of our manufacturers depend mainly on the power of making use of the prosperous moment when demand is brisk, and thus compensating themselves for the interval during which it is slack. This power is secured to them only by the command of machinery and of manual labour. They must have hands ready by them, they must be able to increase the activity of their operations when required, and to slacken it again, according to the state of the market, or they cannot possibly maintain that pre-eminence in the race of competition on which the wealth of the country is founded.” <fn ref="16"/>
    hash: sha256:36a6d6bae08e29235f4815891588b4f18d346acce8fe92fe680d8ca0ae262e66
    state: active
  - id: p00045
    type: paragraph
    text: "Even Malthus recognises overpopulation as a necessity of modern industry, though, after his narrow fashion, he explains it by the absolute over-growth of the labouring population, not by their becoming relatively supernumerary. He says:"
    hash: sha256:f9772f3542e2114940a7fda3da937c3d60dc5459ab2006a6ccaf991524ed7441
    state: active
  - id: p00046
    type: blockquote
    text: '“Prudential habits with regard to marriage, carried to a considerable extent among the labouring class of a country mainly depending upon manufactures and commerce, might injure it.... From the nature of a population, an increase of labourers cannot be brought into market in consequence of a particular demand till after the lapse of 16 or 18 years, and the conversion of revenue into capital, by saving, may take place much more rapidly: a country is always liable to an increase in the quantity of the funds for the maintenance of labour faster than the increase of population.” <fn ref="17"/>'
    hash: sha256:b5357af457b474833087c1fee79d0bcabf60ea840e78c598e46b5c315cf04c53
    state: active
  - id: p00047
    type: paragraph
    text: "After Political Economy has thus demonstrated the constant production of a relative surplus population of labourers to be a necessity of capitalistic accumulation, she very aptly, in the guise of an old maid, puts in the mouth of her “beau ideal” of a capitalist the following words addressed to those supernumeraries thrown on the streets by their own creation of additional capital: —"
    hash: sha256:4b49fc09402c84fce4d574245e35333de1cc791c3306a5882b6c1ddc1f9919bf
    state: active
  - id: p00048
    type: blockquote
    text: “We manufacturers do what we can for you, whilst we are increasing that capital on which you must subsist, and you must do the rest by accommodating your numbers to the means of subsistence.” <fn ref="18"/>
    hash: sha256:41d3f81ac737789a16705aac40cfe6d6e8808d3853c64f94e38f665be96a5355
    state: active
  - id: p00049
    type: paragraph
    text: Capitalist production can by no means content itself with the quantity of disposable labour power which the natural increase of population yields. It requires for its free play an industrial reserve army independent of these natural limits.
    hash: sha256:401401b156f28aeb1fab9d0d7469e4f50ae59ed9900c7e0417e030dc9d38bd8f
    state: active
  - id: p00050
    type: paragraph
    text: Up to this point it has been assumed that the increase or diminution of the variable capital corresponds rigidly with the increase or diminution of the number of labourers employed.
    hash: sha256:907f3a2fb4ffc2fc7676c882c62782c420f82ce3a0b7934bd5194bfee34f312a
    state: active
  - id: p00051
    type: paragraph
    text: The number of labourers commanded by capital may remain the same, or even fall, while the variable capital increases. This is the case if the individual labourer yields more labour, and therefore his wages increase, and this although the price of labour remains the same or even falls, only more slowly than the mass of labour rises. Increase of variable capital, in this case, becomes an index of more labour, but not of more labourers employed. It is the absolute interest of every capitalist to press a given quantity of labour out of a smaller, rather than a greater number of labourers, if the cost is about the same. In the latter case, the outlay of constant capital increases in proportion to the mass of labour set in action; in the former that increase is much smaller. The more extended the scale of production, the stronger this motive. Its force increases with the accumulation of capital.
    hash: sha256:12fa9b294f8c24f2168f776b82fb5bdc447556900e9e15bd3439f058f12db66d
    state: active
  - id: p00052
    type: paragraph
    text: We have seen that the development of the capitalist mode of production and of the productive power of labour — at once the cause and effect of accumulation — enables the capitalist, with the same outlay of variable capital, to set in action more labour by greater exploitation (extensive or intensive) of each individual labour power. We have further seen that the capitalist buys with the same capital a greater mass of labour power, as he progressively replaces skilled labourers by less skilled, mature labour power by immature, male by female, that of adults by that of young persons or children.
    hash: sha256:2648977132640f1991b9a514a6bf9c9c8e2121a3d0d428edb71c969126e8fa80
    state: active
  - id: p00053
    type: paragraph
    text: On the one hand, therefore, with the progress of accumulation, a larger variable capital sets more labour in action without enlisting more labourers; on the other, a variable capital of the same magnitude sets in action more labour with the same mass of labour power; and, finally, a greater number of inferior labour powers by displacement of higher.
    hash: sha256:c7c342b8775edbb157640dcf97001590c10dae8833448f86198e833a08054dfe
    state: active
  - id: p00054
    type: paragraph
    text: The production of a relative surplus population, or the setting free of labourers, goes on therefore yet more rapidly than the technical revolution of the process of production that accompanies, and is accelerated by, the advance of accumulation; and more rapidly than the corresponding diminution of the variable part of capital as compared with the constant. If the means of production, as they increase in extent and effective power, become to a less extent means of employment of labourers, this state of things is again modified by the fact that in proportion as the productiveness of labour increases, capital increases its supply of labour more quickly than its demand for labourers. The overwork of the employed part of the working class swells the ranks of the reserve, whilst conversely the greater pressure that the latter by its competition exerts on the former, forces these to submit to overwork and to subjugation under the dictates of capital. The condemnation of one part of the working class to enforced idleness by the overwork of the other part, and the converse, becomes a means of enriching the individual capitalists, <fn ref="19"/> and accelerates at the same time the production of the industrial reserve army on a scale corresponding with the advance of social accumulation. How important is this element in the formation of the relative surplus population, is shown by the example of England. Her technical means for saving labour are colossal. Nevertheless, if to-morrow morning labour generally were reduced to a rational amount, and proportioned to the different sections of the working class according to age and sex, the working population to hand would be absolutely insufficient for the carrying on of national production on its present scale. The great majority of the labourers now “unproductive” would have to be turned into “productive” ones.
    hash: sha256:898b82eab98a9f57327fd7878131dd9382b5dbd16c1ab65d819928855f7f7390
    state: active
  - id: p00055
    type: paragraph
    text: Taking them as a whole, the general movements of wages are exclusively regulated by the expansion and contraction of the industrial reserve army, and these again correspond to the periodic changes of the industrial cycle. They are, therefore, not determined by the variations of the absolute number of the working population, but by the varying proportions in which the working class is divided into active and reserve army, by the increase or diminution in the relative amount of the surplus population, by the extent to which it is now absorbed, now set free. For Modern Industry with its decennial cycles and periodic phases, which, moreover, as accumulation advances, are complicated by irregular oscillations following each other more and more quickly, that would indeed be a beautiful law, which pretends to make the action of capital dependent on the absolute variation of the population, instead of regulating the demand and supply of labour by the alternate expansion and contraction of capital, the labour-market now appearing relatively under-full, because capital is expanding, now again over-full, because it is contracting. Yet this is the dogma of the economists. According to them, wages rise in consequence of accumulation of capital. The higher wages stimulate the working population to more rapid multiplication, and this goes on until the labour-market becomes too full, and therefore capital, relatively to the supply of labour, becomes insufficient. Wages fall, and now we have the reverse of the medal. The working population is little by little decimated as the result of the fall in wages, so that capital is again in excess relatively to them, or, as others explain it, falling wages and the corresponding increase in the exploitation of the labourer again accelerates accumulation, whilst, at the same time, the lower wages hold the increase of the working class in check. Then comes again the time, when the supply of labour is less than the demand, wages rise, and so on. A beautiful mode of motion this for developed capitalist production! Before, in consequence of the rise of wages, any positive increase of the population really fit for work could occur, the time would have been passed again and again, during which the industrial campaign must have been carried through, the battle fought and won.
    hash: sha256:4a36178905430a22d432e2f5ec20e6d454b32a4cac40b4422ad3f1452fb7143d
    state: active
  - id: p00056
    type: paragraph
    text: Between 1849 and 1859, a rise of wages practically insignificant, though accompanied by falling prices of corn, took place in the English agricultural districts. In Wiltshire, <i>e.g</i>., the weekly wages rose from 7s. to 8s.; in Dorsetshire from 7s. or 8s., to 9s., &amp;c. This was the result of an unusual exodus of the agricultural surplus population caused by the demands of war, the vast extension of railroads, factories, mines, &amp;c. The lower the wages, the higher is the proportion in which ever so insignificant a rise of them expresses itself. If the weekly wage, <i>e.g</i>., is 20s. and it rises to 22s., that is a rise of 10 per cent.; but if it is only 7s. and it rises to 9s., that is a rise of 28 4/7 per cent., which sounds very fine. Everywhere the farmers were howling, and the London <i>Economist,</i> with reference to these starvation-wages, prattled quite seriously of “a general and substantial advance.” <fn ref="20"/> What did the farmers do now? Did they wait until, in consequence of this brilliant remuneration, the agricultural labourers had so increased and multiplied that their wages must fall again, as prescribed by the dogmatic economic brain? They introduced more machinery, and in a moment the labourers were redundant again in a proportion satisfactory even to the farmers. There was now “more capital” laid out in agriculture than before, and in a more productive form. With this the demand for labour fell, not only relatively, but absolutely.
    hash: sha256:f4a65adde4958f94df6e311bc643bc40fe925ad3364e2ca6948ca96a0e0a8ac2
    state: active
  - id: p00057
    type: paragraph
    text: The above economic fiction confuses the laws that regulate the general movement of wages, or the ratio between the working class — <i>i.e</i>., the total labour power — and the total social capital, with the laws that distribute the working population over the different spheres of production. If, <i>e.g.,</i> in consequence of favourable circumstances, accumulation in a particular sphere of production becomes especially active, and profits in it, being greater than the average profits, attract additional capital, of course the demand for labour rises and wages also rise. The higher wages draw a larger part of the working population into the more favoured sphere, until it is glutted with labour power, and wages at length fall again to their average level or below it, if the pressure is too great. Then, not only does the immigration of labourers into the branch of industry in question cease; it gives place to their emigration. Here the political economist thinks he sees the why and wherefore of an absolute increase of workers accompanying an increase of wages, and of a diminution of wages accompanying an absolute increase of labourers. But he sees really only the local oscillation of the labour-market in a particular sphere of production — he sees only the phenomena accompanying the distribution of the working population into the different spheres of outlay of capital, according to its varying needs.
    hash: sha256:f8685e0895ec2c9d7781a9b674aca61bd7be6e96e64d4b76ec6bd9f70c886655
    state: active
  - id: p00058
    type: paragraph
    text: The industrial reserve army, during the periods of stagnation and average prosperity, weighs down the active labour-army; during the periods of over-production and paroxysm, it holds its pretensions in check. Relative surplus population is therefore the pivot upon which the law of demand and supply of labour works. It confines the field of action of this law within the limits absolutely convenient to the activity of exploitation and to the domination of capital.
    hash: sha256:8a89bf4823c91a6602b2b67b17a32be7139d22e4dd1ca8a34a250a390092b418
    state: active
  - id: p00059
    type: paragraph
    text: This is the place to return to one of the grand exploits of economic apologetics. It will be remembered that if through the introduction of new, or the extension of old, machinery, a portion of variable capital is transformed into constant, the economic apologist interprets this operation which “fixes” capital and by that very act sets labourers “free,” in exactly the opposite way, pretending that it sets free capital for the labourers. Only now can one fully understand the effrontery of these apologists. What are set free are not only the labourers immediately turned out by the machines, but also their future substitutes in the rising generation, and the additional contingent, that with the usual extension of trade on the old basis would be regularly absorbed. They are now all “set free,” and every new bit of capital looking out for employment can dispose of them. Whether it attracts them or others, the effect on the general labour demand will be nil, if this capital is just sufficient to take out of the market as many labourers as the machines threw upon it. If it employs a smaller number, that of the supernumeraries increases; if it employs a greater, the general demand for labour only increases to the extent of the excess of the employed over those “set free.” The impulse that additional capital, seeking an outlet, would otherwise have given to the general demand for labour, is therefore in every case neutralised to the extent of the labourers thrown out of employment by the machine. That is to say, the mechanism of capitalistic production so manages matters that the absolute increase of capital is accompanied by no corresponding rise in the general demand for labour. And this the apologist calls a compensation for the misery, the sufferings, the possible death of the displaced labourers during the transition period that banishes them into the industrial reserve army! The demand for labour is not identical with increase of capital, nor supply of labour with increase of the working class. It is not a case of two independent forces working on one another. Les dés sont pipés.
    hash: sha256:d3f6879ed7094c75ec0e11b24d2cd062f2b7f1dc9c6707d61153dda79bc4a6f3
    state: active
  - id: p00060
    type: paragraph
    text: Capital works on both sides at the same time. If its accumulation, on the one hand, increases the demand for labour, it increases on the other the supply of labourers by the “setting free” of them, whilst at the same time the pressure of the unemployed compels those that are employed to furnish more labour, and therefore makes the supply of labour, to a certain extent, independent of the supply of labourers. The action of the law of supply and demand of labour on this basis completes the despotism of capital. As soon, therefore, as the labourers learn the secret, how it comes to pass that in the same measure as they work more, as they produce more wealth for others, and as the productive power of their labour increases, so in the same measure even their function as a means of the self-expansion of capital becomes more and more precarious for them; as soon as they discover that the degree of intensity of the competition among themselves depends wholly on the pressure of the relative surplus population; as soon as, by Trades’ Unions, &amp;c., they try to organise a regular co-operation between employed and unemployed in order to destroy or to weaken the ruinous effects of this natural law of capitalistic production on their class, so soon capital and its sycophant, Political Economy, cry out at the infringement of the “eternal” and so to say “sacred” law of supply and demand. Every combination of employed and unemployed disturbs the “harmonious” action of this law. But, on the other hand, as soon as (in the colonies, <i>e.g</i>.) adverse circumstances prevent the creation of an industrial reserve army and, with it, the absolute dependence of the working class upon the capitalist class, capital, along with its commonplace Sancho Panza, rebels against the “sacred” law of supply and demand, and tries to check its inconvenient action by forcible means and State interference.
    hash: sha256:b0614925cd8869dd21fa849232d83118cf955d505969dee4d81d3234427d6115
    state: active
  - id: p00061
    type: heading
    level: 3
    text: Section 4.
    hash: sha256:7da56a371f0f6708722ec048b921b88245910b99d3a7bdc05ae17fba84cfe19c
    state: active
  - id: p00062
    type: heading
    level: 4
    text: Different Forms of the Relative surplus population. The General Law of Capitalistic Accumulation
    hash: sha256:a7f67e2359c26f290ce946a921e07dcd0eeb16c519d40b829490bbca096d83cf
    state: active
  - id: p00063
    type: paragraph
    text: The relative surplus population exists in every possible form. Every labourer belongs to it during the time when he is only partially employed or wholly unemployed. Not taking into account the great periodically recurring forms that the changing phases of the industrial cycle impress on it, now an acute form during the crisis, then again a chronic form during dull times — it has always three forms, the floating, the latent, the stagnant.
    hash: sha256:e01d894345f0bc40876c32a67be1b19a894aa84ea9adcfff492b946927063815
    state: active
  - id: p00064
    type: paragraph
    text: In the centres of modern industry — factories, manufactures, ironworks, mines, &amp;c. — the labourers are sometimes repelled, sometimes attracted again in greater masses, the number of those employed increasing on the whole, although in a constantly decreasing proportion to the scale of production. Here the surplus population exists in the floating form.
    hash: sha256:52f99c6f5cb8b88878b0224dc9594057207401c41d7cd8810712c32554a485d7
    state: active
  - id: p00065
    type: paragraph
    text: In the automatic factories, as in all the great workshops, where machinery enters as a factor, or where only the modern division of labour is carried out, large numbers of boys are employed up to the age of maturity. When this term is once reached, only a very small number continue to find employment in the same branches of industry, whilst the majority are regularly discharged. This majority forms an element of the floating surplus population, growing with the extension of those branches of industry. Part of them emigrates, following in fact capital that has emigrated. One consequence is that the female population grows more rapidly than the male, <i>teste</i> England. That the natural increase of the number of labourers does not satisfy the requirements of the accumulation of capital, and yet all the time is in excess of them, is a contradiction inherent to the movement of capital itself. It wants larger numbers of youthful labourers, a smaller number of adults. The contradiction is not more glaring than that other one that there is a complaint of the want of hands, while at the same time many thousands are out of work, because the division of labour chains them to a particular branch of industry. <fn ref="21"/>
    hash: sha256:b657d65069fc037f3e015d31a67330360118f23896a8046595a6a682f3c9c790
    state: active
  - id: p00066
    type: paragraph
    text: The consumption of labour power by capital is, besides, so rapid that the labourer, half-way through his life, has already more or less completely lived himself out. He falls into the ranks of the supernumeraries, or is thrust down from a higher to a lower step in the scale. It is precisely among the work-people of modern industry that we meet with the shortest duration of life. Dr. Lee, Medical Officer of Health for Manchester, stated
    hash: sha256:00c30fcb9efbcddf494b270c0bf2820da87f5e661877f1d3a94d06caad513443
    state: active
  - id: p00067
    type: blockquote
    text: “that the average age at death of the Manchester ... upper middle class was 38 years, while the average age at death of the labouring class was 17; while at Liverpool those figures were represented as 35 against 15. It thus appeared that the well-to-do classes had a lease of life which was more than double the value of that which fell to the lot of the less favoured citizens.” <fn ref="22"/>
    hash: sha256:11d76fa803a04ef9c42bd4c7c5be3fcc0a0afd9969b2cdd6d9d828ba3e58f2e8
    state: active
  - id: p00068
    type: paragraph
    text: In order to conform to these circumstances, the absolute increase of this section of the proletariat must take place under conditions that shall swell their numbers, although the individual elements are used up rapidly. Hence, rapid renewal of the generations of labourers (this law does not hold for the other classes of the population). This social need is met by early marriages, a necessary consequence of the conditions in which the labourers of modern industry live, and by the premium that the exploitation of children sets on their production.
    hash: sha256:d0ee8ac8b4eaf3f28309999d92dacd196c72730f25701129398811ab38a9b297
    state: active
  - id: p00069
    type: paragraph
    text: As soon as capitalist production takes possession of agriculture, and in proportion to the extent to which it does so, the demand for an agricultural labouring population falls absolutely, while the accumulation of the capital employed in agriculture advances, without this repulsion being, as in non-agricultural industries, compensated by a greater attraction. Part of the agricultural population is therefore constantly on the point of passing over into an urban or manufacturing proletariat, and on the look-out for circumstances favourable to this transformation. (Manufacture is used here in the sense of all non-agricultural industries.) <fn ref="23"/> This source of relative surplus population is thus constantly flowing. But the constant flow towards the towns pre-supposes, in the country itself, a constant latent surplus population, the extent of which becomes evident only when its channels of outlet open to exceptional width. The agricultural labourer is therefore reduced to the minimum of wages, and always stands with one foot already in the swamp of pauperism.
    hash: sha256:d9bb5a4a9442836751d1d90a73a7a03d4fbf16497d04e0111c02d223682f9a7d
    state: active
  - id: p00070
    type: paragraph
    text: The third category of the relative surplus population, the stagnant, forms a part of the active labour army, but with extremely irregular employment. Hence it furnishes to capital an inexhaustible reservoir of disposable labour power. Its conditions of life sink below the average normal level of the working class; this makes it at once the broad basis of special branches of capitalist exploitation. It is characterised by maximum of working-time, and minimum of wages. We have learnt to know its chief form under the rubric of “domestic industry.” It recruits itself constantly from the supernumerary forces of modern industry and agriculture, and specially from those decaying branches of industry where handicraft is yielding to manufacture, manufacture to machinery. Its extent grows, as with the extent and energy of accumulation, the creation of a surplus population advances. But it forms at the same time a self-reproducing and self-perpetuating element of the working class, taking a proportionally greater part in the general increase of that class than the other elements. In fact, not only the number of births and deaths, but the absolute size of the families stand in inverse proportion to the height of wages, and therefore to the amount of means of subsistence of which the different categories of labourers dispose. This law of capitalistic society would sound absurd to savages, or even civilised colonists. It calls to mind the boundless reproduction of animals individually weak and constantly hunted down. <fn ref="24"/>
    hash: sha256:633e0e1be12581e6373dc358ca38a293a408c2936853fdedbf309676c20782e1
    state: active
  - id: p00071
    type: paragraph
    text: The lowest sediment of the relative surplus population finally dwells in the sphere of pauperism. Exclusive of vagabonds, criminals, prostitutes, in a word, the “dangerous” classes, this layer of society consists of three categories. First, those able to work. One need only glance superficially at the statistics of English pauperism to find that the quantity of paupers increases with every crisis, and diminishes with every revival of trade. Second, orphans and pauper children. These are candidates for the industrial reserve army, and are, in times of great prosperity, as 1860, <i>e.g</i>., speedily and in large numbers enrolled in the active army of labourers. Third, the demoralised and ragged, and those unable to work, chiefly people who succumb to their incapacity for adaptation, due to the division of labour; people who have passed the normal age of the labourer; the victims of industry, whose number increases with the increase of dangerous machinery, of mines, chemical works, &amp;c., the mutilated, the sickly, the widows, &amp;c. Pauperism is the hospital of the active labour-army and the dead weight of the industrial reserve army. Its production is included in that of the relative surplus population, its necessity in theirs; along with the surplus population, pauperism forms a condition of capitalist production, and of the capitalist development of wealth. It enters into the <i>faux frais</i> of capitalist production; but capital knows how to throw these, for the most part, from its own shoulders on to those of the working class and the lower middle class.
    hash: sha256:7e3f9eef32d65e0b2e9d61e76c09234b7db57298d765ac52ba86edf9e8fe49f1
    state: active
  - id: p00072
    type: paragraph
    text: The greater the social wealth, the functioning capital, the extent and energy of its growth, and, therefore, also the absolute mass of the proletariat and the productiveness of its labour, the greater is the industrial reserve army. The same causes which develop the expansive power of capital, develop also the labour power at its disposal. The relative mass of the industrial reserve army increases therefore with the potential energy of wealth. But the greater this reserve army in proportion to the active labour army, the greater is the mass of a consolidated surplus population, whose misery is in inverse ratio to its torment of labour. The more extensive, finally, the lazarus layers of the working class, and the industrial reserve army, the greater is official pauperism. <i>This is the absolute general law of capitalist accumulation.</i> Like all other laws it is modified in its working by many circumstances, the analysis of which does not concern us here.
    hash: sha256:53d4bc377c016f79d242ce6be5676caf524a10b6575ee7fde38bb302cc34d664
    state: active
  - id: p00073
    type: paragraph
    text: The folly is now patent of the economic wisdom that preaches to the labourers the accommodation of their number to the requirements of capital. The mechanism of capitalist production and accumulation constantly effects this adjustment. The first word of this adaptation is the creation of a relative surplus population, or industrial reserve army. Its last word is the misery of constantly extending strata of the active army of labour, and the dead weight of pauperism.
    hash: sha256:70fdbdad65ec2007a3d91532417b331980689613520847d42a03683ea8d4ac8c
    state: active
  - id: p00074
    type: paragraph
    text: "The law by which a constantly increasing quantity of means of production, thanks to the advance in the productiveness of social labour, may be set in movement by a progressively diminishing expenditure of human power, this law, in a capitalist society — where the labourer does not employ the means of production, but the means of production employ the labourer — undergoes a complete inversion and is expressed thus: the higher the productiveness of labour, the greater is the pressure of the labourers on the means of employment, the more precarious, therefore, becomes their condition of existence, <i>viz</i>., the sale of their own labour power for the increasing of another’s wealth, or for the self-expansion of capital. The fact that the means of production, and the productiveness of labour, increase more rapidly than the productive population, expresses itself, therefore, capitalistically in the inverse form that the labouring population always increases more rapidly than the conditions under which capital can employ this increase for its own self-expansion."
    hash: sha256:d1d0b274ecf299682b4cbbf28f4ee388edf83b41f98008c80b4af9aebaa4d453
    state: active
  - id: p00075
    type: paragraph
    text: 'We saw in Part IV., when analysing the production of relative surplus-value: within the capitalist system all methods for raising the social productiveness of labour are brought about at the cost of the individual labourer; all means for the development of production transform themselves into means of domination over, and exploitation of, the producers; they mutilate the labourer into a fragment of a man, degrade him to the level of an appendage of a machine, destroy every remnant of charm in his work and turn it into a hated toil; they estrange from him the intellectual potentialities of the labour process in the same proportion as science is incorporated in it as an independent power; they distort the conditions under which he works, subject him during the labour process to a despotism the more hateful for its meanness; they transform his life-time into working-time, and drag his wife and child beneath the wheels of the Juggernaut of capital. But all methods for the production of surplus-value are at the same time methods of accumulation; and every extension of accumulation becomes again a means for the development of those methods. It follows therefore that in proportion as capital accumulates, the lot of the labourer, be his payment high or low, must grow worse. The law, finally, that always equilibrates the relative surplus population, or industrial reserve army, to the extent and energy of accumulation, this law rivets the labourer to capital more firmly than the wedges of Vulcan did Prometheus to the rock. It establishes an accumulation of misery, corresponding with accumulation of capital. Accumulation of wealth at one pole is, therefore, at the same time accumulation of misery, agony of toil slavery, ignorance, brutality, mental degradation, at the opposite pole, <i>i.e.,</i> on the side of the class that produces its own product in the form of capital. <fn ref="25"/> This antagonistic character of capitalistic accumulation is enunciated in various forms by political economists, although by them it is confounded with phenomena, certainly to some extent analogous, but nevertheless essentially distinct, and belonging to pre-capitalistic modes of production.'
    hash: sha256:208c9c59188b08dc8e905af373a075d20accdba15841a5d331e92cb3d72751ff
    state: active
  - id: p00076
    type: paragraph
    text: The Venetian monk Ortes, one of the great economic writers of the 18th century, regards the antagonism of capitalist production as a general natural law of social wealth.
    hash: sha256:3eee986b1912226f580369ff7fd60d7757541f3132b8d0eee574d3a9d6648269
    state: active
  - id: p00077
    type: blockquote
    text: '“In the economy of a nation, advantages and evils always balance one another (il bene ed il male economico in una nazione sempre all, istessa misura): the abundance of wealth with some people, is always equal to the want of it with others (la copia dei beni in alcuni sempre eguale alia mancanza di essi in altri): the great riches of a small number are always accompanied by the absolute privation of the first necessaries of life for many others. The wealth of a nation corresponds with its population, and its misery corresponds with its wealth. Diligence in some compels idleness in others. The poor and idle are a necessary consequence of the rich and active,” &amp;c. <fn ref="26"/>'
    hash: sha256:55ff5ec3bf4469012ce80670240b44a2382f92fe787b25a205def40e3ef904f2
    state: active
  - id: p00078
    type: paragraph
    text: In a thoroughly brutal way about 10 years after Ortes, the Church of England parson, Townsend, glorified misery as a necessary condition of wealth.
    hash: sha256:c83c1e153c32e3a5b496a8994d88ffb09c386e14cfac48a9c3282b613365a2e2
    state: active
  - id: p00079
    type: blockquote
    text: “Legal constraint (to labour) is attended with too much trouble, violence, and noise, whereas hunger is not only a peaceable, silent, unremitted pressure, but as the most natural motive to industry and labour, it calls forth the most powerful exertions.”
    hash: sha256:a33ebf955b10749cc2778c4a48ffc63b7adccd68eb289102710ccf25954839e1
    state: active
  - id: p00080
    type: paragraph
    text: Everything therefore depends upon making hunger permanent among the working class, and for this, according to Townsend, the principle of population, especially active among the poor, provides.
    hash: sha256:da28d2b47968dd19c7340ce20c4163d44b3c0d8c0d1f038fd7355c90290b3c4e
    state: active
  - id: p00081
    type: blockquote
    text: “It seems to be a law of Nature that the poor should be to a certain degree improvident” [<i>i.e</i>., so improvident as to be born <i>without</i> a silver spoon in the mouth], “that there may always be some to fulfil the most servile, the most sordid, and the most ignoble offices in the community. The stock of human happiness is thereby much increased, whilst the more delicate are not only relieved from drudgery ... but are left at liberty without interruption to pursue those callings which are suited to their various dispositions ... it” [the Poor Law] “tends to destroy the harmony and beauty, the symmetry and order of that system which God and Nature have established in the world.” <fn ref="27"/> If the Venetian monk found in the fatal destiny that makes misery eternal, the <i>raison d’être</i> of Christian charity, celibacy, monasteries and holy houses, the Protestant prebendary finds in it a pretext for condemning the laws in virtue of which the poor possessed a right to a miserable public relief.
    hash: sha256:7a6676b9edb57aa18e6dcfdb6ec07f279954e70564ecc278939d3ba4e09952fa
    state: active
  - id: p00082
    type: blockquote
    text: “The progress of social wealth,” says Storch, “begets this useful class of society ... which performs the most wearisome, the vilest, the most disgusting functions, which takes, in a word, on its shoulders all that is disagreeable and servile in life, and procures thus for other classes leisure, serenity of mind and conventional” [c’est bon!] “dignity of character.” <fn ref="28"/>
    hash: sha256:8f874c4974178077c9c13ecbefb3136e799b10bb3a10e0a72f6eb4631eccdd7e
    state: active
  - id: p00083
    type: paragraph
    text: "Storch asks himself in what then really consists the progress of this capitalistic civilisation with its misery and its degradation of the masses, as compared with barbarism. He finds but one answer: security!"
    hash: sha256:39b2174db01e09052fdf58c0eb8c7fc4fc0c326a6dc3784df51699fd9bf46c91
    state: active
  - id: p00084
    type: blockquote
    text: “Thanks to the advance of industry and science,” says Sismondi, “every labourer can produce every day much more than his consumption requires. But at the same time, whilst his labour produces wealth, that wealth would, were he called on to consume it himself, make him less fit for labour.” According to him, “men” [<i>i.e</i>., non-workers] “would probably prefer to do without all artistic perfection, and all the enjoyments that manufacturers procure for us, if it were necessary that all should buy them by constant toil like that of the labourer.... Exertion today is separated from its recompense; it is not the same man that first works, and then reposes; but it is because the one works that the other rests.... The indefinite multiplication of the productive powers of labour can then only have for result the increase of luxury and enjoyment of the idle rich.” <fn ref="29"/>
    hash: sha256:40486d35c9bfa7dd74d6d79d57098d6fb739bf39251784d99364fd62bd581611
    state: active
  - id: p00085
    type: paragraph
    text: "Finally Destutt de Tracy, the fish-blooded bourgeois doctrinaire, blurts out brutally:"
    hash: sha256:887ef8c72973c049cd2a05fe90da9cdfe4d7fc970862c14155dbb4e8b7df7e53
    state: active
  - id: p00086
    type: blockquote
    text: “In poor nations the people are comfortable, in rich nations they are generally poor.” <fn ref="30"/>
    hash: sha256:c53aa0ffd2e6f775bebdcb49ff8f0329b34d70b84010121f26ba184e97ad207b
    state: active
  - id: p00087
    type: heading
    level: 3
    text: Section 5.
    hash: sha256:c43a41fed18b170f7d51d8d1f5b5df922c918f8777a1d666586202c777e21f03
    state: active
  - id: p00088
    type: heading
    level: 4
    text: Illustrations of the General Law of Capitalist Accumulation
    hash: sha256:558932b2374dbfc4a31308146e9f311ec78cd8e7b21d5fdf043f0b8ba474e98f
    state: active
  - id: p00089
    type: heading
    level: 5
    text: A. England from 1846-1866
    hash: sha256:3348b29b8553dd41f500361ebd4c09a2dde85c1369d8aca57217c9feca7767fe
    state: active
  - id: p00090
    type: paragraph
    text: No period of modern society is so favourable for the study of capitalist accumulation as the period of the last 20 years. It is as if this period had found Fortunatus’ purse. But of all countries England again furnishes the classical example, because it holds the foremost place in the world-market, because capitalist production is here alone completely developed, and lastly, because the introduction of the Free-trade millennium since 1846 has cut off the last retreat of vulgar economy. The titanic advance of production — the latter half of the 20 years’ period again far surpassing the former — has been already pointed out sufficiently in Part IV.
    hash: sha256:52915c202ac57f8d81cf07be7dbc5c44e4d213a49102b353975c22ab1b3368a5
    state: active
  - id: p00091
    type: paragraph
    text: Although the absolute increase of the English population in the last half century was very great, the relative increase or rate of growth fell constantly, as the following table borrowed from the census shows.
    hash: sha256:28ff2590a0051082b15a4429a5bac4f69b72a27ce2586842fd8a2ed7850d08db
    state: active
  - id: p00092
    type: paragraph
    text: "Annual increase per cent. of the population of England and Wales in decimal numbers:"
    hash: sha256:d0766075a5ebe1b8fc55e77fa437e64b1fdf08c893d60a6df37a549de554bd36
    state: active
  - id: p00093
    type: table
    text: <tr><td>1811-1821</td><td>1.533 <i>per cent.</i></td></tr><tr><td>1821-1831</td><td>1.446 <i>per cent.</i></td></tr><tr><td>1831-1841</td><td>1.326 <i>per cent.</i></td></tr><tr><td>1841-1851</td><td>1.216 <i>per cent.</i></td></tr><tr><td>1851-1861</td><td>1.141 <i>per cent.</i></td></tr>
    hash: sha256:8eae7f97df33d83ce4d46f2449cf51ec7d721c1b6475bcda1e9603d2295b5058
    state: active
  - id: p00094
    type: paragraph
    text: 'Let us now, on the other hand, consider the increase of wealth. Here the movement of profit, rent of land, &amp;c., that come under the income tax, furnishes the surest basis. The increase of profits liable to income tax (farmers and some other categories not included) in Great Britain from 1853 to 1864 amounted to 50.47% or 4.58% as the annual average, <fn ref="31"/> that of the population during the same period to about 12%. The augmentation of the rent of land subject to taxation (including houses, railways, mines, fisheries, &amp;c.), amounted for 1853 to 1864 to 38% or 3 5/12% annually. Under this head the following categories show the greatest increase:'
    hash: sha256:f7f55b42660648bd3d45bf54c68d7a3cdb7d9f6af249b4a917141bf1aa5df833
    state: active
  - id: p00095
    type: table
    text: <tr><td colspan="2"><b>Excess of annual income<br/>of 1864 over that of 1853</b></td><td><b>Increase<br/>per year</b></td></tr><tr><td><b>Houses</b></td><td>38.60%</td><td>3.50%</td></tr><tr><td><b>Quarries</b></td><td>84.76%</td><td>7.70%</td></tr><tr><td><b>Mines</b></td><td>68.85%</td><td>6.26%</td></tr><tr><td><b>Ironworks</b></td><td>39.92%</td><td>3.63%</td></tr><tr><td><b>Fisheries</b></td><td>57.37%</td><td>5.21%</td></tr><tr><td><b>Gasworks</b></td><td>126.02%</td><td>11.45%</td></tr><tr><td><b>Railways</b></td><td>83.29%</td><td>7.57%</td></tr>
    hash: sha256:6d73dc2ea732fcb7c35bdf4184c935bcd9faa2b302966fc57fb30ebb7a831431
    state: active
  - id: p00096
    type: paragraph
    text: If we compare the years from 1853 to 1864 in three sets of four consecutive years each, the rate of augmentation of the income increases constantly. <fn ref="32"/> It is, <i>e.g.,</i> for that arising from profits between 1853 to 1857, 1.73% yearly; 1857-1861, 2.74%, and for 1861-64, 9.30% yearly. The sum of the incomes of the United Kingdom that come under the income tax was in 1856, £307,068,898; in 1859, £328,127,416; in 1862, £351,745,241; in 1863, £359,142,897; in 1864, £362,462,279; in 1865, £385,530,020. <fn ref="33"/>
    hash: sha256:3a1a4f0e8129f88047ad2964adea90487a82bdb502d3a64e65baeedd096c5696
    state: active
  - id: p00097
    type: paragraph
    text: 'The accumulation of capital was attended at the same time by its concentration and centralisation. Although no official statistics of agriculture existed for England (they did for Ireland), they were voluntarily given in 10 counties. These statistics gave the result that from 1851 to 1861 the number of farms of less than 100 acres had fallen from 31,583 to 26,597, so that 5,016 had been thrown together into larger farms. <fn ref="34"/> From 1815 to 1825 no personal estate of more than £1,000,000 came under the succession duty; from 1825 to 1855, however, 8 did; and 4 from 1856 to June, 1859, <i>i.e.,</i> in 4½ years. <fn ref="35"/> The centralisation will, however, be best seen from a short analysis of the Income Tax Schedule D (profits, exclusive of farms, &amp;c.), in the years 1864 and 1865. I note beforehand that incomes from this source pay income tax on everything over £60. These incomes liable to taxation in England, Wales and Scotland, amounted in 1864 to £95,844,222, in 1865 to £105,435,579. <fn ref="36"/> The number of persons taxed were in 1864, 308,416, out of a population of 23,891,009; in 1865, 332,431 out of a population of 24,127,003. The following table shows the distribution of these incomes in the two years:'
    hash: sha256:9abe226b98d716c0310c8f8acb9235404c508fc5f82394710f20e7b16e7185c3
    state: active
  - id: p00098
    type: table
    text: <tr><td rowspan="2"></td><td colspan="2"><b>Year ending<br/>April 5th, 1864.</b></td><td colspan="2"><b>Year ending<br/>April 5th, 1865.</b></td></tr><tr><td><b>Income from<br/>Profits</b></td><td><b>Income from<br/>People</b></td><td><b>Income from<br/>Profits</b></td><td><b>Income from<br/>People</b></td></tr><tr><td><b>Total Income</b></td><td>£95,844,222</td><td>308,416</td><td>105,435,738</td><td>332,431</td></tr><tr><td><b>of these</b></td><td>57,028,289</td><td>23,334</td><td>64,554,297</td><td>24,265</td></tr><tr><td><b>of these</b></td><td>36,415,225</td><td>3,619</td><td>42,535,576</td><td>4,021</td></tr><tr><td><b>of these</b></td><td>22,809,781</td><td>832</td><td>27,555,313</td><td>973</td></tr><tr><td><b>of these</b></td><td>8,744,762</td><td>91</td><td>11,077,238</td><td>107</td></tr>
    hash: sha256:b68ffd1447a2795e0b5a72462d85891923c93c57d00f80febd5420ce9e8218bf
    state: active
  - id: p00099
    type: paragraph
    text: "In 1855 there were produced in the United Kingdom 61,453,079 tons of coal, of value £16,113,167; in 1864, 92,787,873 tons, of value £23,197,968; in 1855, 3,218,154 tons of pig-iron, of value £8,045,385; 1864, 4,767,951 tons, of value £11,919,877. In 1854 the length of the railroads worked in the United Kingdom was 8,054 miles, with a paid-up capital of £286,068,794; in 1864 the length was 12,789 miles, with capital paid up of £425,719,613. In 1854 the total sum of the exports and imports of the United Kingdom was £268,210,145; in 1865, £489,923,285. The following table shows the movement of the exports:"
    hash: sha256:885371d3791a3b707ef0a29590502288a374ebe01028547ff5b6a38ea77f6f28
    state: active
  - id: p00100
    type: table
    text: <tr><td>1846</td><td>£58,842,377</td></tr><tr><td>1849</td><td>63,596,052</td></tr><tr><td>1856</td><td>115,826,948</td></tr><tr><td>1860</td><td>135,842,817</td></tr><tr><td>1865</td><td>165,862,402</td></tr><tr><td>1866<fn ref="37"/></td><td>188,917,563</td></tr>
    hash: sha256:55ae2dcf23ccbd3405bedf74014bac858254a3a20a274fa2d15743df3d5f7595
    state: active
  - id: p00101
    type: paragraph
    text: "After these few examples one understands the cry of triumph of the Registrar-General of the British people:"
    hash: sha256:5895e03a732f7a178f996a7328f7e142a58e769098e03db21ccc40741054ec9f
    state: active
  - id: p00102
    type: blockquote
    text: “Rapidly as the population has increased, it has not kept pace with the progress of industry and wealth.” <fn ref="38"/>
    hash: sha256:f55bdfbf6698c5aaa2907aef8772463cb587ac7f968ae52eae13f1bc1f113207
    state: active
  - id: p00103
    type: paragraph
    text: Let us turn now to the direct agents of this industry, or the producers of this wealth, to the working class.
    hash: sha256:c6233f371595f3c6bcdc213abf9a3bfd58ef174bb4b77a30ce883be58375a23f
    state: active
  - id: p00104
    type: blockquote
    text: “It is one of the most melancholy features in the social state of this country,” says Gladstone, “that while there was a decrease in the consuming powers of the people, and while there was an increase in the privations and distress of the labouring class and operatives, there was at the same time a constant accumulation of wealth in the upper classes, and a constant increase of capital.” <fn ref="39"/>
    hash: sha256:2c53ca64565d55c5373ab677a3909c1a3c6c4be0bb8ae79db90a2e3972516f85
    state: active
  - id: p00105
    type: paragraph
    text: "Thus spake this unctuous minister in the House of Commons of February 13th, 1843. On April 16th, 1863, 20 years later, in the speech in which he introduced his Budget:"
    hash: sha256:33f0d1a20265b91696e39c8d429db68fd7ab99c6b560ac8863cf8b05733a9224
    state: active
  - id: p00106
    type: blockquote
    text: “From 1842 to 1852 the taxable income of the country increased by 6 per cent.... In the 8 years from 1853 to 1861 it had increased from the basis taken in 1853 by 20 per cent.! The fact is so astonishing as to be almost incredible ... this intoxicating augmentation of wealth and power ... entirely confined to classes of property ... must be of indirect benefit to the labouring population, because it cheapens the commodities of general consumption. While the rich have been growing richer, the poor have been growing less poor. At any rate, whether the extremes of poverty are less, I do not presume to say.” <fn ref="40"/>
    hash: sha256:7e61afa9ce1b88286d3ab106f92460aae17d37b0ae1bcd0253f6df6295f78050
    state: active
  - id: p00107
    type: paragraph
    text: 'How lame an anti-climax! If the working class has remained “poor,” only “less poor” in proportion as it produces for the wealthy class “an intoxicating augmentation of wealth and power,” then it has remained relatively just as poor. If the extremes of poverty have not lessened, they have increased, because the extremes of wealth have. As to the cheapening of the means of subsistence, the official statistics, <i>e.g.,</i> the accounts of the London Orphan Asylum, show an increase in price of 20% for the average of the three years 1860-1862, compared with 1851-1853. In the following three years, 1863-1865, there was a progressive rise in the price of meat, butter, milk, sugar, salt, coals, and a number of other necessary means of subsistence. <fn ref="41"/> Gladstone’s next Budget speech of April 7th, 1864, is a Pindaric dithyrambus on the advance of surplus-value-making and the happiness of the people “tempered by poverty.” He speaks of masses “on the border” of pauperism, of branches of trade in which “wages have not increased,” and finally sums up the happiness of the working class in the words:'
    hash: sha256:63af31c49c89aa6d467c1d8187f7dcbb499d419b27be00d9086d82821b47a6bd
    state: active
  - id: p00108
    type: blockquote
    text: “human life is but, in nine cases out of ten, a struggle for existence.” <fn ref="42"/>
    hash: sha256:9b2b5c1a4ecef7bdb284bd7770c3de8fb92ec53688d7ab725789fef5fa285810
    state: active
  - id: p00109
    type: paragraph
    text: "Professor Fawcett, not bound like Gladstone by official considerations, declares roundly:"
    hash: sha256:bd7918e0c787f4e8cf7bfaa968e1c7c5c4672cb43137d32764d1bab6b2df54ad
    state: active
  - id: p00110
    type: blockquote
    text: “I do not, of course, deny that money wages have been augmented by this increase of capital (in the last ten years), but this apparent advantage is to a great extent lost, because many of the necessaries of life are becoming dearer” (he believes because of the fall in value of the precious metals)..."the rich grow rapidly richer, whilst there is no perceptible advance in the comfort enjoyed by the industrial classes.... They (the labourers) become almost the slaves of the tradesman, to whom they owe money.” <fn ref="43"/>
    hash: sha256:d8c0ebb54f00d30df6cd15c9ae1d56c5bf66c5d74138e1b84db9a057b87bdb57
    state: active
  - id: p00111
    type: paragraph
    text: In the chapters on the “working-day” and “machinery,” the reader has seen under what circumstances the British working class created an “intoxicating augmentation of wealth and power” for the propertied classes. There we were chiefly concerned with the social functioning of the labourer. But for a full elucidation of the law of accumulation, his condition outside the workshop must also be looked at, his condition as to food and dwelling. The limits of this book compel us to concern ourselves chiefly with the worst paid part of the industrial proletariat, and with the agricultural labourers, who together form the majority of the working class.
    hash: sha256:e8ed85ced3349d3f3d4e72bc513ba2b3a2ccb72d0a784ec45f2040b1e4439a47
    state: active
  - id: p00112
    type: paragraph
    text: But first, one word on official pauperism, or on that part of the working class which has forfeited its condition of existence (the sale of labour power), and vegetates upon public alms. The official list of paupers numbered in England <fn ref="44"/> 851,369 persons; in 1856, 877,767; in 1865, 971,433. In consequence of the cotton famine, it grew in the years 1863 and 1864 to 1,079,382 and 1,014,978. The crisis of 1866, which fell most heavily on London, created in this centre of the world market, more populous than the kingdom of Scotland, an increase of pauperism for the year 1866 of 19.5% compared with 1865, and of 24.4% compared with 1864, and a still greater increase for the first months of 1867 as compared with 1866. From the analysis of the statistics of pauperism, two points are to be taken. On the one hand, the fluctuation up and down of the number of paupers, reflects the periodic changes of the industrial cycle. On the other, the official statistics become more and more misleading as to the actual extent of pauperism in proportion as, with the accumulation of capital, the class-struggle, and, therefore, the class consciousness of the working men, develop. <i>E.g</i>., the barbarity in the treatment of the paupers, at which the English Press (<i>The Times, Pall Mall Gazette,</i> etc.) have cried out so loudly during the last two years, is of ancient date. F. Engels showed in 1844 exactly the same horrors, exactly the same transient canting outcries of “sensational literature.” But frightful increase of “deaths by starvation” in London during the last ten years proves beyond doubt the growing horror in which the working-people hold the slavery of the workhouse, that place of punishment for misery. <fn ref="45"/>
    hash: sha256:155d988d109676272fe4fdf0947ba997ace7a066febeff84cc77e5fea59ccc6c
    state: active
  - id: p00113
    type: heading
    level: 5
    text: B. The Badly Paid Strata of the British Industrial Class
    hash: sha256:c23f856bc78b6884acd8d66e92cd8824a0dcd57512989751f5b8b09873bcd6ee
    state: active
  - id: p00114
    type: paragraph
    text: During the cotton famine of 1862, Dr. Smith was charged by the Privy Council with an inquiry into the conditions of nourishment of the distressed operatives in Lancashire and Cheshire. His observations during many preceding years had led him to the conclusion that “to avert starvation diseases,” the daily food of an average woman ought to contain at least 3,900 grains of carbon with 180 grains of nitrogen; the daily food of an average man, at least 4,300 grains of carbon with 200 grains of nitrogen; for women, about the same quantity of nutritive elements as are contained in 2 lbs. of good wheaten bread, for men 1/9 more; for the weekly average of adult men and women, at least 28,600 grains of carbon and 1,330 grains of nitrogen. His calculation was practically confirmed in a surprising manner by its agreement with the miserable quantity of nourishment to which want had forced down the consumption of the cotton operatives. This was, in December, 1862, 29,211 grains of carbon, and 1,295 grains of nitrogen weekly.
    hash: sha256:3610a8945c7bfdcc42702dd9ae82e6db3301419a18a2a72b8da7b9b6d5122d1c
    state: active
  - id: p00115
    type: paragraph
    text: In the year 1863, the Privy Council ordered an inquiry into the state of distress of the worst-nourished part of the English working class. Dr. Simon, medical officer to the Privy Council, chose for this work the above-mentioned Dr. Smith. His inquiry ranges on the one hand over the agricultural labourers, on the other, over silk-weavers, needlewomen, kid-glovers, stocking-weavers, glove-weavers, and shoemakers. The latter categories are, with the exception of the stocking-weavers, exclusively town-dwellers. It was made a rule in the inquiry to select in each category the most healthy families, and those comparatively in the best circumstances.
    hash: sha256:d0f282058b88dd73331a0d01f1baedf4b300e59c78ae070dfd550c93730bf273
    state: active
  - id: p00116
    type: paragraph
    text: As a general result it was found that
    hash: sha256:9b38a377de1c3a0fd712d88fc04a35dc31bf6118f4e48f05b0c209515ac6362c
    state: active
  - id: p00117
    type: blockquote
    text: “in only one of the examined classes of in-door operatives did the average nitrogen supply just exceed, while in another it nearly reached, the estimated standard of bare sufficiency [<i>i.e</i>., sufficient to avert starvation diseases], and that in two classes there was defect — in one, a very large defect — of both nitrogen and carbon. Moreover, as regards the examined families of the agricultural population, it appeared that more than a fifth were with less than the estimated sufficiency of carbonaceous food, that more than one-third were with less than the estimated sufficiency of nitrogenous food, and that in three counties (Berkshire, Oxfordshire, and Somersetshire), insufficiency of nitrogenous food was the average local diet.” <fn ref="46"/>
    hash: sha256:ae305c679a8286658b3d91a9c45d7a066f3a8bc25dd1a64a908537d964ffcfe4
    state: active
  - id: p00118
    type: paragraph
    text: Among the agricultural labourers, those of England, the wealthiest part of the United Kingdom, were the worst fed. <fn ref="47"/> The insufficiency of food among the agricultural labourers, fell, as a rule, chiefly on the women and children, for “the man must eat to do his work.” Still greater penury ravaged the town-workers examined.
    hash: sha256:a7f639d6b2f75d094f96cdf652b20cde36e091cea6f5437d64ece0dbfbbc8307
    state: active
  - id: p00119
    type: blockquote
    text: “They are so ill fed that assuredly among them there must be many cases of severe and injurious privation.” <fn ref="48"/>
    hash: sha256:75b801628b62080e3eac6a4bc66a37475a9368746efc9e3d7ddfe8b8c9b96b65
    state: active
  - id: p00120
    type: paragraph
    text: (“Privation” of the capitalist all this! <i>i.e</i>., “abstinence” from paying for the means of subsistence absolutely necessary for the mere vegetation of his “hands.”) [49]
    hash: sha256:d205e39eb54e0f2994b18bf0c2ee7f3a860c802faafeef1a4927c1901617db6b
    state: active
  - id: p00121
    type: paragraph
    text: "The following table shows the conditions of nourishment of the above-named categories of purely town-dwelling work-people, as compared with the minimum assumed by Dr. Smith, and with the food-allowance of the cotton operatives during the time of their greatest distress:"
    hash: sha256:49db1d5740ff995e6a1152429db6a4753fe49eefdc4ae4003592e013b7f02da6
    state: active
  - id: p00122
    type: table
    text: <tr><td><b>Both Sexes</b></td><td><b>Average weekly<br/>carbon</b></td><td><b>Average weekly<br/>nitrogen</b></td></tr><tr><td>Five in-door<br/>occupations</td><td>28,876 grains</td><td>1,192 grains</td></tr><tr><td>Unemployed Lancashire<br/>Operatives</td><td>28,211 grains</td><td>1,295 grains</td></tr><tr><td>Minimum quantity to be<br/>allowed to the Lancashire<br/>Operatives, equal number<br/>of males and females</td><td>28,600 grains</td><td>1,330 grains</td></tr>
    hash: sha256:c42cbe7cdd33c8aa61619c54dc073defcdf8215abb10d0db6053d756f7b776be
    state: active
  - id: p00123
    type: paragraph
    text: 'One half, or 60/125, of the industrial labour categories investigated, had absolutely no beer, 28% no milk. The weekly average of the liquid means of nourishment in the families varied from seven ounces in the needle-women to 24¾ ounces in the stocking-makers. The majority of those who did not obtain milk were needle-women in London. The quantity of bread-stuffs consumed weekly varied from 7¾ lbs. for the needle-women to 11½ lbs. for the shoemakers, and gave a total average of 9.9 lbs. per adult weekly. Sugar (treacle, etc.) varied from 4 ounces weekly for the kid-glovers to 11 ounces for the stocking-makers; and the total average per week for all categories was 8 ounces per adult weekly. Total weekly average of butter (fat, etc.) 5 ounces per adult. The weekly average of meat (bacon, etc.) varied from 7¼ ounces for the silk-weavers, to 18¼ ounces for the kid-glovers; total average for the different categories 13.6 ounces. The weekly cost of food per adult, gave the following average figures; silk-weavers 2s. 2½d., needle-women 2s. 7d., kid-glovers 2s. 9½d., shoemakers 2s 7¾d., stocking-weavers 2s. 6¼d. For the silk-weavers of Macclesfield the average was only 1s. 8½d. The worst categories were the needle-women, silk-weavers and kid-glovers. <fn ref="50"/> Of these facts, Dr. Simon in his General Health Report says:'
    hash: sha256:bbbf450059aaea2534e736238135a24de25f6057db990fdf969d3d576313652f
    state: active
  - id: p00124
    type: blockquote
    text: “That cases are innumerable in which defective diet is the cause or the aggravator of disease, can be affirmed by any one who is conversant with poor law medical practice, or with the wards and out-patient rooms of hospitals.... Yet in this point of view, there is, in my opinion, a very important sanitary context to be added. It must be remembered that privation of food is very reluctantly borne, and that as a rule great poorness of diet will only come when other privations have preceded it. Long before insufficiency of diet is a matter of hygienic concern, long before the physiologist would think of counting the grains of nitrogen and carbon which intervene between life and starvation, the household will have been utterly destitute of material comfort; clothing and fuel will have been even scantier than food — against inclemencies of weather there will have been no adequate protection — dwelling space will have been stinted to the degree in which overcrowding produces or increases disease; of household utensils and furniture there will have been scarcely any — even cleanliness will have been found costly or difficult, and if there still be self-respectful endeavours to maintain it, every such endeavour will represent additional pangs of hunger. The home, too, will be where shelter can be cheapest bought; in quarters where commonly there is least fruit of sanitary supervision, least drainage, least scavenging, least suppression of public nuisances, least or worst water supply, and, if in town, least light and air. Such are the sanitary dangers to which poverty is almost certainly exposed, when it is poverty enough to imply scantiness of food. And while the sum of them is of terrible magnitude against life, the mere scantiness of food is in itself of very serious moment.... These are painful reflections, especially when it is remembered that the poverty to which they advert is not the deserved poverty of idleness. In all cases it is the poverty of working populations. Indeed, as regards the in-door operatives, the work which obtains the scanty pittance of food, is for the most part excessively prolonged. Yet evidently it is only in a qualified sense that the work can be deemed self-supporting.... And on a very large scale the nominal self-support can be only a circuit, longer or shorter, to pauperism.” <fn ref="51"/>
    hash: sha256:a04b73cd23d1bc46c1d9d4db838ccbf66b0dec36d91de9ce7f18ecf2411c8355
    state: active
  - id: p00125
    type: paragraph
    text: 'The intimate connexion between the pangs of hunger of the most industrious layers of the working class, and the extravagant consumption, coarse or refined, of the rich, for which capitalist accumulation is the basis, reveals itself only when the economic laws are known. It is otherwise with the “housing of the poor.” Every unprejudiced observer sees that the greater the centralisation of the means of production, the greater is the corresponding heaping together of the labourers, within a given space; that therefore the swifter capitalistic accumulation, the more miserable are the dwellings of the working-people. “Improvements” of towns, accompanying the increase of wealth, by the demolition of badly built quarters, the erection of palaces for banks, warehouses, &amp;c., the widening of streets for business traffic, for the carriages of luxury, and for the introduction of tramways, &amp;c., drive away the poor into even worse and more crowded hiding places. On the other hand, every one knows that the dearness of dwellings is in inverse ratio to their excellence, and that the mines of misery are exploited by house speculators with more profit or less cost than ever were the mines of Potosi. The antagonistic character of capitalist accumulation, and therefore of the capitalistic relations of property generally, <fn ref="52"/> is here so evident, that even the official English reports on this subject teem with heterodox onslaughts on “property and its rights.” With the development of industry, with the accumulation of capital, with the growth and “improvement” of towns, the evil makes such progress that the mere fear of contagious diseases which do not spare even “respectability,” brought into existence from 1847 to 1864 no less than 10 Acts of Parliament on sanitation, and that the frightened bourgeois in some towns, as Liverpool, Glasgow, &amp;c., took strenuous measures through their municipalities. Nevertheless Dr. Simon, in his report of 1865, says:'
    hash: sha256:0fa0547a6233512a63de597cabe5c0fb1450d993552535dc529b42d2a6e6a542
    state: active
  - id: p00126
    type: blockquote
    text: “Speaking generally, it may be said that the evils are uncontrolled in England.”
    hash: sha256:33f9a2c817f3c8575522682efa840f054976889e1997ebce8e364f5b6238ccac
    state: active
  - id: p00127
    type: paragraph
    text: By order of the Privy Council, in 1864, an inquiry was made into the conditions of the housing of the agricultural labourers, in 1865 of the poorer classes in the towns. The results of the admirable work of Dr. Julian Hunter are to be found in the seventh (1865) and eighth (1866) reports on “Public Health.” To the agricultural labourers, I shall come later. On the condition of town dwellings, I quote, as preliminary, a general remark of Dr. Simon.
    hash: sha256:7c1b4a2630a2a34553e03af2623c01e796fe25b67bb362f0b0c4b6c6c8989328
    state: active
  - id: p00128
    type: blockquote
    text: “Although my official point of view,” he says, “is one exclusively physical, common humanity requires that the other aspect of this evil should not be ignored .... In its higher degrees it [<i>i.e</i>., over-crowding] almost necessarily involves such negation of all delicacy, such unclean confusion of bodies and bodily functions, such exposure of animal and sexual nakedness, as is rather bestial than human. To be subject to these influences is a degradation which must become deeper and deeper for those on whom it continues to work. To children who are born under its curse, it must often be a very baptism into infamy. And beyond all measure hopeless is the wish that persons thus circumstanced should ever in other respects aspire to that atmosphere of civilisation which has its essence in physical and moral cleanliness.” <fn ref="53"/>
    hash: sha256:7617b4ff361397d15d05c244e27533d1bf74a4bb0bbdee1f31fb06a4e233405c
    state: active
  - id: p00129
    type: paragraph
    text: London takes the first place in over-crowded habitations, absolutely unfit for human beings.
    hash: sha256:4d187fab16ac287f8c87588251e9bb57f1746c7e6729d8fe50189d0496d7442c
    state: active
  - id: p00130
    type: blockquote
    text: “He feels clear,” says Dr. Hunter, “on two points; first, that there are about 20 large colonies in London, of about 10,000 persons each, whose miserable condition exceeds almost anything he has seen elsewhere in England, and is almost entirely the result of their bad house accommodation; and second, that the crowded and dilapidated condition of the houses of these colonies is much worse than was the case 20 years ago.” <fn ref="54"/> “It is not too much to say that life in parts of London and Newcastle is infernal.” <fn ref="55"/>
    hash: sha256:1f3be7b5418180d5579f304e3bc2803787e254c11de75d4853ee3367b700c51a
    state: active
  - id: p00131
    type: paragraph
    text: Further, the better-off part of the working class, together with the small shopkeepers and other elements of the lower middle class, falls in London more and more under the curse of these vile conditions of dwelling, in proportion as “improvements,” and with them the demolition of old streets and houses, advance, as factories and the afflux of human beings grow in the metropolis, and finally as house rents rise with the ground-rents.
    hash: sha256:c2163e2d2bf352dbaec8f49b190e6174f2d1560f1001ef240336ebcd73a2e373
    state: active
  - id: p00132
    type: blockquote
    text: “Rents have become so heavy that few labouring men can afford more than one room.” <fn ref="56"/>
    hash: sha256:123b529787754f6005a46bea2d34c4bb2f6b076e46df3038b9da4be615060db5
    state: active
  - id: p00133
    type: paragraph
    text: There is almost no house-property in London that is not overburdened with a number of middlemen. For the price of land in London is always very high in comparison with its yearly revenue, and therefore every buyer speculates on getting rid of it again at a jury price (the expropriation valuation fixed by jurymen), or on pocketing an extraordinary increase of value arising from the neighbourhood of some large establishment. As a consequence of this there is a regular trade in the purchase of “fag-ends of leases.”
    hash: sha256:a4c1d3188e129a0ddfeab39befb4e6c16f3a787bbe32b2d3f553c4717d3da6dc
    state: active
  - id: p00134
    type: blockquote
    text: “Gentlemen in this business may be fairly expected to do as they do — get all they can from the tenants while they have them, and leave as little as they can for their successors.” <fn ref="57"/>
    hash: sha256:cf04a2491f6203c54fc9078d0edbc5f5b36ed551a66b9c7cf5de85dbee21897a
    state: active
  - id: p00135
    type: paragraph
    text: The rents are weekly, and these gentlemen run no risk. In consequence of the making of railroads in the City,
    hash: sha256:a43abf11d3d628102200d77b572e46ad3f4e2ad1d95b5d8044a124978f39f682
    state: active
  - id: p00136
    type: blockquote
    text: “the spectacle has lately been seen in the East of London of a number of families wandering about some Saturday night with their scanty worldly goods on their backs, without any resting place but the workhouse.” <fn ref="58"/>
    hash: sha256:8eb36ceff93ee18f77a35d8f83077592ffc5e19493468ef3afeee5c805934e1f
    state: active
  - id: p00137
    type: paragraph
    text: The workhouses are already over-crowded, and the “improvements” already sanctioned by Parliament are only just begun. If labourers are driven away by the demolition of their old houses, they do not leave their old parish, or at most they settle down on its borders, as near as they can get to it.
    hash: sha256:8df9f374f46df2b18006d0d048af9f8922213ee2556436bef6fba184378acfc0
    state: active
  - id: p00138
    type: blockquote
    text: “They try, of course, to remain as near as possible to their workshops. The inhabitants do not go beyond the same or the next parish, parting their two-room tenements into single rooms, and crowding even those.... Even at an advanced rent, the people who are displaced will hardly be able to get an accommodation so good as the meagre one they have left.... Half the workmen ... of the Strand ... walked two miles to their work.” <fn ref="59"/>
    hash: sha256:95ad3c4d7786f19bc82379d4f495f1b3eb112338289cbb78c9c3b5b349b8c728
    state: active
  - id: p00139
    type: paragraph
    text: This same Strand, a main thoroughfare which gives strangers an imposing idea of the wealth of London, may serve as an example of the packing together of human beings in that town. In one of its parishes, the Officer of Health reckoned 581 persons per acre, although half the width of the Thames was reckoned in. It will be self-understood that every sanitary measure, which, as has been the case hitherto in London, hunts the labourers from one quarter, by demolishing uninhabitable houses, serves only to crowd them together yet more closely in another.
    hash: sha256:f9aece6dd29dc01e8e9bb5bc9a9f70a525f4c5540e0dde00b733d18b659e189b
    state: active
  - id: p00140
    type: blockquote
    text: “Either,” says Dr. Hunter, “the whole proceeding will of necessity stop as an absurdity, or the public compassion (!) be effectually aroused to the obligation which may now be without exaggeration called national, of supplying cover to those who by reason of their having no capital, cannot provide it for themselves, though they can by periodical payments reward those who will provide it for them.” <fn ref="60"/>
    hash: sha256:797aea704fa495ec180fa060a85fff6269c1a659779c479a13cedda38098bf7c
    state: active
  - id: p00141
    type: paragraph
    text: Admire this capitalistic justice! The owner of land, of houses, the businessman, when expropriated by “improvements” such as railroads, the building of new streets, &amp;c., not only receives full indemnity. He must, according to law, human and divine, be comforted for his enforced “abstinence” over and above this by a thumping profit. The labourer, with his wife and child and chattels, is thrown out into the street, and — if he crowds in too large numbers towards quarters of the town where the vestries insist on decency, he is prosecuted in the name of sanitation!
    hash: sha256:3a4680a4d61b131fd4097bc7b350734e6453f9926970a9f6d69ae803f3510b24
    state: active
  - id: p00142
    type: paragraph
    text: Except London, there was at the beginning of the 19th century no single town in England of 100,000 inhabitants. Only five had more than 50,000. Now there are 28 towns with more than 50,000 inhabitants.
    hash: sha256:1fdae736a69796927d3bda0305ca3d698143c449989d2266583e04a8d4c775a2
    state: active
  - id: p00143
    type: blockquote
    text: “The result of this change is not only that the class of town people is enormously increased, but the old close-packed little towns are now centres, built round on every side, open nowhere to air, and being no longer agreeable to the rich are abandoned by them for the pleasanter outskirts. The successors of these rich are occupying the larger houses at the rate of a family to each room [... and find accommodation for two or three lodgers ...] and a population, for which the houses were not intended and quite unfit, has been created, whose surroundings are truly degrading to the adults and ruinous to the children.” <fn ref="61"/>
    hash: sha256:1318ea0647938ae4ca561e7849fb04f83206d746d443e99a9ded1ee8056b9c49
    state: active
  - id: p00144
    type: paragraph
    text: The more rapidly capital accumulates in an industrial or commercial town, the more rapidly flows the stream of exploitable human material, the more miserable are the improvised dwellings of the labourers.
    hash: sha256:cbacaf7e76630577ddcc2a0d4531c9582ac8cef7342bf32e1542fe2d1f9530fc
    state: active
  - id: p00145
    type: paragraph
    text: "Newcastle-on-Tyne, as the centre of a coal and iron district of growing productiveness, takes the next place after London in the housing inferno. Not less than 34,000 persons live there in single rooms. Because of their absolute danger to the community, houses in great numbers have lately been destroyed by the authorities in Newcastle and Gateshead. The building of new houses progresses very slowly, business very quickly. The town was, therefore, in 1865, more full than ever. Scarcely a room was to let. Dr. Embleton, of the Newcastle Fever Hospital, says:"
    hash: sha256:f29b1ef3c2247d6c213adef7a8846fa12ae4591be8d72304acd059e1d81dc663
    state: active
  - id: p00146
    type: blockquote
    text: '“There can be little doubt that the great cause of the continuance and spread of the typhus has been the over-crowding of human beings, and the uncleanliness of their dwellings. The rooms, in which labourers in many cases live, are situated in confined and unwholesome yards or courts, and for space, light, air, and cleanliness, are models of insufficiency and insalubrity, and a disgrace to any civilised community; in them men, women, and children lie at night huddled together: and as regards the men, the night-shift succeed the day-shift, and the day-shift the night-shift in unbroken series for some time together, the beds having scarcely time to cool; the whole house badly supplied with water and worse with privies; dirty, unventilated, and pestiferous.” <fn ref="62"/>'
    hash: sha256:20bea7ca85694e6e2fd034af3de84b21418680edbcfeee07bcd767b3355730ab
    state: active
  - id: p00147
    type: paragraph
    text: The price per week of such lodgings ranges from 8d. to 3s.
    hash: sha256:666783e5d38f91940da7aa0c2b57f8bcfe42ea63236fee599ae7253bb2a587e3
    state: active
  - id: p00148
    type: blockquote
    text: “The town of Newcastle-on-Tyne,” says Dr. Hunter, “contains a sample of the finest tribe of our countrymen, often sunk by external circumstances of house and street into an almost savage degradation.” <fn ref="63"/>
    hash: sha256:1a2899571dcdcb6da1ce1163ea7829242f0aa63a5808b6b9bfa8e0b244d2f1bc
    state: active
  - id: p00149
    type: paragraph
    text: 'As a result of the ebbing and flowing of capital and labour, the state of the dwellings of an industrial town may today be bearable, tomorrow hideous. Or the aedileship of the town may have pulled itself together for the removal of the most shocking abuses. Tomorrow, like a swarm of locusts, come crowding in masses of ragged Irishmen or decayed English agricultural labourers. They are stowed away in cellars and lofts, or the hitherto respectable labourer’s dwelling is transformed into a lodging house whose <i>personnel</i> changes as quickly as the billets in the 30 years’ war. Example: Bradford (Yorkshire). There the municipal philistine was just busied with urban improvements. Besides, there were still in Bradford, in 1861, 1,751 uninhabited houses. But now comes that revival of trade which the mildly liberal Mr. Forster, the negro’s friend, recently crowed over with so much grace. With the revival of trade came of course an overflow from the waves of the ever fluctuating “reserve army” or “relative surplus population.” The frightful cellar habitations and rooms registered in the list, <fn ref="64"/> which Dr. Hunter obtained from the agent of an Insurance Company, were for the most part inhabited by well-paid labourers. They declared that they would willingly pay for better dwellings if they were to be had. Meanwhile, they become degraded, they fall ill, one and all, whilst the mildly liberal Forster, M. P., sheds tears over the blessings of Free Trade, and the profits of the eminent men of Bradford who deal in worsted. In the Report of September, 1865, Dr. Bell, one of the poor law doctors of Bradford, ascribes the frightful mortality of fever-patients in his district to the nature of their dwellings.'
    hash: sha256:398b4aef1f7d9e09ea60488fec99ad37a6e6c389774f822da836345fb140b616
    state: active
  - id: p00150
    type: blockquote
    text: “In one small cellar measuring 1,500 cubic feet ... there are ten persons .... Vincent Street, Green Aire Place, and the Leys include 223 houses having 1,450 inhabitants, 435 beds, and 36 privies.... The beds — and in that term I include any roll of dirty old rags, or an armful of shavings — have an average of 3.3 persons to each, many have 5 and 6 persons to each, and some people, I am told, are absolutely without beds; they sleep in their ordinary clothes, on the bare boards — young men and women, married and unmarried, all together. I need scarcely add that many of these dwellings are dark, damp, dirty, stinking holes, utterly unfit for human habitations; they are the centres from which disease and death are distributed amongst those in better circumstances, who have allowed them thus to fester in our midst.” <fn ref="65"/>
    hash: sha256:d1f43d73838698b42241a96e5c01bf9dd0f98d42ce113d55d07af7f498d04553
    state: active
  - id: p00151
    type: paragraph
    text: Bristol takes the third place after London in the misery of its dwellings.
    hash: sha256:588282f417b5facbf727c7e5f05fd2f2bbfb237aee3e0fc5cf2693e8ef8e6592
    state: active
  - id: p00152
    type: blockquote
    text: “Bristol, where the blankest poverty and domestic misery abound in the wealthiest town of Europe.” <fn ref="66"/>
    hash: sha256:1dc1c32e754672f220e37137fc7bb720c064b1f4ce390b5aaf2685470aff3500
    state: active
  - id: p00153
    type: heading
    level: 5
    text: C. The Nomad Population
    hash: sha256:b807da9bbccc789a732c12763307114a04665a50d4ea80fe5d1a368482dd05cc
    state: active
  - id: p00154
    type: paragraph
    text: 'We turn now to a class of people whose origin is agricultural, but whose occupation is in great part industrial. They are the light infantry of capital, thrown by it, according to its needs, now to this point, now to that. When they are not on the march, they “camp.” Nomad labour is used for various operations of building and draining, brick-making, lime-burning, railway-making, &amp;c. A flying column of pestilence, it carries into the places in whose neighbourhood it pitches its camp, small-pox, typhus, cholera, scarlet fever, &amp;c. <fn ref="67"/> In undertakings that involve much capital outlay, such as railways, &amp;c., the contractor himself generally provides his army with wooden huts and the like, thus improvising villages without any sanitary provisions, outside the control of the local boards, very profitable to the contractor, who exploits the labourers in two-fold fashion — as soldiers of industry and as tenants. According as the wooden hut contains 1, 2, or 3 holes, its inhabitant, navvy, or whatever he may be, has to pay 1, 3, or 4 shillings weekly. <fn ref="68"/> One example will suffice. In September, 1864, Dr. Simon reports that the Chairman of the Nuisances Removal Committee of the parish of Sevenoaks sent the following denunciation to Sir George Grey, Home Secretary: —'
    hash: sha256:b2f0b8e30f876b7f33a80f086d9b55d46428f2e6a0d493829f853e9ea3a9cd1b
    state: active
  - id: p00155
    type: blockquote
    text: “Small-pox cases were rarely heard of in this parish until about twelve months ago. Shortly before that time, the works for a railway from Lewisham to Tunbridge were commenced here, and, in addition to the principal works being in the immediate neighbourhood of this town, here was also established the depôt for the whole of the works, so that a large number of persons was of necessity employed here. As cottage accommodation could not be obtained for them all, huts were built in several places along the line of the works by the contractor, Mr. Jay, for their especial occupation. These huts possessed no ventilation nor drainage, and, besides, were necessarily over-crowded, because each occupant had to accommodate lodgers, whatever the number in his own family might be, although there were only two rooms to each tenement. The consequences were, according to the medical report we received, that in the night-time these poor people were compelled to endure all the horror of suffocation to avoid the pestiferous smells arising from the filthy, stagnant water, and the privies close under their windows. Complaints were at length made to the Nuisances Removal Committee by a medical gentleman who had occasion to visit these huts, and he spoke of their condition as dwellings in the most severe terms, and he expressed his fears that some very serious consequences might ensue, unless some sanitary measures were adopted. About a year ago, Mr. Jay promised to appropriate a hut, to which persons in his employ, who were suffering from contagious diseases, might at once be removed. He repeated that promise on the 23rd July last, but although since the date of the last Promise there have been several cases of small-pox in his huts, and two deaths from the same disease, yet he has taken no steps whatever to carry out his promise. On the 9th September instant, Mr. Kelson, surgeon, reported to me further cases of small-pox in the same huts, and he described their condition as most disgraceful. I should add, for your (the Home Secretary’s) information that an isolated house, called the Pest-house, which is set apart for parishioners who might be suffering from infectious diseases, has been continually occupied by such patients for many months past, and is also now occupied; that in one family five children died from small-pox and fever; that from the 1st April to the 1st September this year, a period of five months, there have been no fewer than ten deaths from small-pox in the parish, four of them being in the huts already referred to; that it is impossible to ascertain the exact number of persons who have suffered from that disease although they are known to be many, from the fact of the families keeping it as private as possible.” <fn ref="69"/>
    hash: sha256:47cfb1a34c50bf79f616c8f8f09237a594c1f7347ef6a4cf072e8bcb416fb058
    state: active
  - id: p00156
    type: paragraph
    text: The labourers in coal and other mines belong to the best paid categories of the British proletariat. The price at which they buy their wages was shown on an earlier page. <fn ref="70"/> Here I merely cast a hurried glance over the conditions of their dwellings. As a rule, the exploiter of a mine, whether its owner or his tenant, builds a number of cottages for his hands. They receive cottages and coal for firing “for nothing” — <i>i.e</i>., these form part of their wages, paid in kind. Those who are not lodged in this way receive in compensation £4 per annum. The mining districts attract with rapidity a large population, made up of the miners themselves, and the artisans, shopkeepers, &amp;c., that group themselves around them. The ground-rents are high, as they are generally where population is dense. The master tries, therefore, to run up, within the smallest space possible at the mouth of the pit, just so many cottages as are necessary to pack together his hands and their families. If new mines are opened in the neighbourhood, or old ones are again set working, the pressure increases. In the construction of the cottages, only one point of view is of moment, the “abstinence” of the capitalist from all expenditure that is not absolutely unavoidable.
    hash: sha256:342c2cf5e07861a4bb2dd1f350517c50f799d89e9c42877f218ff9b4e00c4f58
    state: active
  - id: p00157
    type: blockquote
    text: “The lodging which is obtained by the pitman and other labourers connected with the collieries of Northumberland and Durham,” says Dr. Julian Hunter, “is perhaps, on the whole, the worst and the dearest of which any large specimens can be found in England, the similar parishes of Monmouthshire excepted.... The extreme badness is in the high number of men found in one room, in the smallness of the ground-plot on which a great number of houses are thrust, the want of water, the absence of privies, and the frequent placing of one house on the top of another, or distribution into flats, ... the lessee acts as if the whole colony were encamped, not resident.” <fn ref="71"/>
    hash: sha256:1a7182dbbb9da48422f959fbda120421ee52ad748070a5ccd9d3bffa5ef839c1
    state: active
  - id: p00158
    type: blockquote
    text: “In pursuance of my instructions,” says Dr. Stevens, “I visited most of the large colliery villages in the Durham Union.... With very few exceptions, the general statement that no means are taken to secure the health of the inhabitants would be true of all of them.... All colliers are bound ['bound,’ an expression which, like bondage, dates from the age of serfdom] to the colliery lessee or owner for twelve months.... If the colliers express discontent, or in any way annoy the ‘viewer,’ a mark of memorandum is made against their names, and, at the annual ‘binding,’ such men are turned off... It appears to me that no part of the ‘truck system’ could be worse than what obtains in these densely-populated districts. The collier is bound to take as part of his hiring a house surrounded with pestiferous influences; he cannot help himself, and it appears doubtful whether anyone else can help him except his proprietor (he is, to all intents and purposes, a serf), and his proprietor first consults his balance-sheet, and the result is tolerably certain. The collier is also often supplied with water by the proprietor, which, whether it be good or bad, he has to pay for, or rather he suffers a deduction for from his wages.” <fn ref="72"/>
    hash: sha256:7dca9fe185ba7f53cfc66c923cb125fc477975706e5d2ad2409b755229a06a25
    state: active
  - id: p00159
    type: paragraph
    text: "In conflict with “public opinion,” or even with the Officers of Health, capital makes no difficulty about “justifying” the conditions partly dangerous, partly degrading, to which it confines the working and domestic life of the labourer, on the ground that they are necessary for profit. It is the same thing when capital “abstains” from protective measures against dangerous machinery in the factory, from appliances for ventilation and for safety in mines, &amp;c. It is the same here with the housing of the miners. Dr. Simon, medical officer of the Privy Council, in his official Report says:"
    hash: sha256:7204e75460043d031117c5ceb979b268ce82e8140ebcc644b302ecd1e4e24743
    state: active
  - id: p00160
    type: blockquote
    text: “In apology for the wretched household accommodation ... it is alleged that miners are commonly worked on lease; that the duration of the lessee’s interest (which in collieries is commonly for 21 years), is not so long that he should deem it worth his while to create good accommodation for his labourers, and for the tradespeople and others whom the work attracts; that even if he were disposed to act liberally in the matter, this disposition would commonly be defeated by his landlord’s tendency to fix on him, as ground-rent, an exorbitant additional charge for the privilege of having on the surface of the ground the decent and comfortable village which the labourers of the subterranean property ought to inhabit, and that prohibitory price (if not actual prohibition) equally excludes others who might desire to build. It would be foreign to the purpose of this report to enter upon any discussion of the merits of the above apology. Nor here is it even needful to consider where it would be that, if decent accommodation were provided, the cost ... would eventually fall — whether on landlord, or lessee, or labourer, or public. But in presence of such shameful facts as are vouched for in the annexed reports [those of Dr. Hunter, Dr. Stevens, &amp;c.] a remedy may well be claimed.... Claims of landlordship are being so used as to do great public wrong. The landlord in his capacity of mine-owner invites an industrial colony to labour on his estate, and then in his capacity of surface-owner makes it impossible that the labourers whom he collects, should find proper lodging where they must live. The lessee [the capitalist exploiter] meanwhile has no pecuniary motive for resisting that division of the bargain; well knowing that if its latter conditions be exorbitant, the consequences fall, not on him, that his labourers on whom they fall have not education enough to know the value of their sanitary rights, that neither obscenest lodging nor foulest drinking water will be appreciable inducements towards a ‘strike.’” <fn ref="73"/>
    hash: sha256:32be033b7998902827f5b533271460755750018fee3b02258fe7917be9abebac
    state: active
  - id: p00161
    type: heading
    level: 5
    text: D. Effect of Crises on the Best Paid Part of the working class
    hash: sha256:781c7ec491172f966ec572321c748c2bb7e0f363127933a14076511aabcf3f3a
    state: active
  - id: p00162
    type: paragraph
    text: 'Before I turn to the regular agricultural labourers, I may be allowed to show, by one example, how industrial revulsions affect even the best-paid, the aristocracy, of the working class. It will be remembered that the year 1857 brought one of the great crises with which the industrial cycle periodically ends. The next termination of the cycle was due in 1866. Already discounted in the regular factory districts by the cotton famine, which threw much capital from its wonted sphere into the great centres of the money-market, the crisis assumed, at this time, an especially financial character. Its outbreak in 1866 was signalised by the failure of a gigantic London Bank, immediately followed by the collapse of countless swindling companies. One of the great London branches of industry involved in the catastrophe was iron shipbuilding. The magnates of this trade had not only over-produced beyond all measure during the overtrading time, but they had, besides, engaged in enormous contracts on the speculation that credit would be forthcoming to an equivalent extent. Now, a terrible reaction set in, that even at this hour (the end of March, 1867) continues in this and other London industries. <fn ref="74"/> To show the condition of the labourers, I quote the following from the circumstantial report of a correspondent of the <i>Morning Star,</i> who, at the end of 1866, and beginning of 1867, visited the chief centres of distress:'
    hash: sha256:44c9fe70b14997d3908d0a04eb813644bb13c6e69e8a1508526ce2c92404987e
    state: active
  - id: p00163
    type: blockquote
    text: “In the East End districts of Poplar, Millwall, Greenwich, Deptford, Limehouse and Canning Town, at least 15,000 workmen and their families were in a state of utter destitution, and 3,000 skilled mechanics were breaking stones in the workhouse yard (after distress of over half a year’s duration).... I had great difficulty in reaching the workhouse door, for a hungry crowd besieged it.... They were waiting for their tickets, but the time had not yet arrived for the distribution. The yard was a great square place with an open shed running all round it, and several large heaps of snow covered the paving-stones in the middle. In the middle, also, were little wicker-fenced spaces, like sheep pens, where in finer weather the men worked; but on the day of my visit the pens were so snowed up that nobody could sit in them. Men were busy, however, in the open shed breaking paving-stones into macadam. Each man had a big paving-stone for a seat, and he chipped away at the rime-covered granite with a big hammer until he had broken up, and think! five bushels of it, and then he had done his day’s work, and got his day’s pay — threepence and an allowance of food. In another part of the yard was a rickety little wooden house, and when we opened the door of it, we found it filled with men who were huddled together shoulder to shoulder for the warmth of one another’s bodies and breath. They were picking oakum and disputing the while as to which could work the longest on a given quantity of food — for endurance was the point of honour. Seven thousand ... in this one workhouse ... were recipients of relief ... many hundreds of them ... it appeared, were, six or eight months ago, earning the highest wages paid to artisans.... Their number would be more than doubled by the count of those who, having exhausted all their savings, still refuse to apply to the parish, because they have a little left to pawn. Leaving the workhouse, I took a walk through the streets, mostly of little one-storey houses, that abound in the neighbourhood of Poplar. My guide was a member of the Committee of the Unemployed.... My first call was on an ironworker who had been seven and twenty weeks out of employment. I found the man with his family sitting in a little back room. The room was not bare of furniture, and there was a fire in it. This was necessary to keep the naked feet of the young children from getting frost bitten, for it was a bitterly cold day. On a tray in front of the fire lay a quantity of oakum, which the wife and children were picking in return for their allowance from the parish. The man worked in the stone yard of the workhouse for a certain ration of food, and threepence per day. He had now come home to dinner quite hungry, as he told us with a melancholy smile, and his dinner consisted of a couple of slices of bread and dripping, and a cup of milkless tea.... The next door at which we knocked was opened by a middle-aged woman, who, without saying a word, led us into a little back parlour, in which sat all her family, silent and fixedly staring at a rapidly dying fire. Such desolation, such hopelessness wasabout these people and their little room, as I should not care to witness again. ‘Nothing have they done, sir,’ said the woman, pointing to her boys, ‘for six and twenty weeks; and all our money gone — all the twenty pounds that me and father saved when times were better, thinking it would yield a little to keep us when we got past work. Look at it,’ she said, almost fiercely, bringing out a bank-book with all its well kept entries of money paid in, and money taken out, so that we could see how the little fortune had begun with the first five shilling deposit, and had grown by little and little to be twenty pounds, and how it had melted down again till the sum in hand got from pounds to shillings, and the last entry made the book as worthless as a blank sheet. This family received relief from the workhouse, and it furnished them with just one scanty meal per day.... Our next visit was to an iron labourer’s wife, whose husband had worked in the yards. We found her ill from want of food, lying on a mattress in her clothes, and just covered with a strip of carpet, for all the bedding had been pawned. Two wretched children were tending her, themselves looking as much in need of nursing as their mother. Nineteen weeks of enforced idleness had brought them to this pass, and while the mother told the history of that bitter past, she moaned as if all her faith in a future that should atone for it were dead.... On getting outside a young fellow came running after us, and asked us to step inside his house and see if anything could be done for him. A young wife, two pretty children, a cluster of pawn-tickets, and a bare room were all he had to show.”
    hash: sha256:d0a1d12b540ec49fff90a391fd958acb51aa09ff2a14e380a93d8863e84d58a5
    state: active
  - id: p00164
    type: paragraph
    text: On the after pains of the crisis of 1866, the following extract from a Tory newspaper. It must not be forgotten that the East-end of London, which is here dealt with, is not only the seat of the iron shipbuilding mentioned above, but also of a so-called “home-industry” always underpaid.
    hash: sha256:78a6b7e005214ca2c9a46ca345679d56f09cc578870c0f3a35357b54ccb6ca3d
    state: active
  - id: p00165
    type: blockquote
    text: “A frightful spectacle was to be seen yesterday in one part of the metropolis. Although the unemployed thousands of the East-end did not parade with their black flags <i>en masse,</i> the human torrent was imposing enough. Let us remember what these people suffer. They are dying of hunger. That is the simple and terrible fact. There are 40,000 of them.... In our presence, in one quarter of this wonderful metropolis, are packed — next door to the most enormous accumulation of wealth the world ever saw — cheek by jowl with this are 40,000 helpless, starving people. These thousands are now breaking in upon the other quarters; always half-starving, they cry their misery in our ears, they cry to Heaven, they tell us from their miserable dwellings, that it is impossible for them to find work, and useless for them to beg. The local ratepayers themselves are driven by the parochial charges to the verge of pauperism.” — (<i>Standard,</i> 5th April, 1867.)
    hash: sha256:0a3431b1e0189dc11e960c9cf1e98b14a6bb688c5ef46379ca141ced8d022108
    state: active
  - id: p00166
    type: paragraph
    text: "As it is the fashion amongst English capitalists to quote Belgium as the Paradise of the labourer because “freedom of labour,” or what is the same thing, “freedom of capital,” is there limited neither by the despotism of Trades’ Unions, nor by Factory Acts, a word or two on the “happiness” of the Belgian labourer. Assuredly no one was more thoroughly initiated in the mysteries of this happiness than the late M. Ducpétiaux, inspector-general of Belgian prisons and charitable institutions, and member of the central commission of Belgian statistics. Let us take his work: “Budgets économiques des classes ouvrières de la Belgique,” Bruxelles, 1855. Here we find among other matters, a normal Belgian labourer’s family, whose yearly income and expenditure he calculates on very exact data, and whose conditions of nourishment are then compared with those of the soldier, sailor, and prisoner. The family “consists of father, mother, and four children.” Of these 6 persons “four may be usefully employed the whole year through.” It is assumed that “there is no sick person nor one incapable of work, among them,” nor are there “expenses for religious, moral, and intellectual purposes, except a very small sum for church sittings,” nor “contributions to savings banks or benefit societies,” nor “expenses due to luxury or the result of improvidence.” The father and eldest son, however, allow themselves “the use of tobacco,” and on Sundays “go to the <i>cabaret</i>,” for which a whole 86 centimes a week are reckoned."
    hash: sha256:f9938ce5d34aaa732fd24d6b4d72438cf7a08d1a285978d5b08fdf1c40b6dcad
    state: active
  - id: p00167
    type: blockquote
    text: “From a general compilation of wages allowed to the labourers in different trades, it follows that the highest average of daily wage is 1 franc 56c., for men, 89 centimes for women, 56 centimes for boys, and 55 centimes for girls. Calculated at this rate, the resources of the family would amount, at the maximum, to 1,068 francs a-year.... In the family ... taken as typical we have calculated all possible resources. But in ascribing wages to the mother of the family we <i>raise the question of the direction of the household.</i> How will its internal economy be cared for? Who will look after the young children? Who will get ready the meals, do the washing and mending? This is the dilemma incessantly presented to the labourers.”
    hash: sha256:fa81d947fddccd6db48dec457383cee5e07ec05fa8fabc2185380c967cfe34c6
    state: active
  - id: p00168
    type: paragraph
    text: "According to this the budget of the family is:"
    hash: sha256:eedc57a1355727eb03c4fd0268b57cd55f875bbbdc7b1c39c8e3c9d6d2b088c0
    state: active
  - id: p00169
    type: table
    text: <tr><td><b>The father</b></td><td>300 working-days at fr. 1.56</td><td>fr. 468</td></tr><tr><td><b>mother</b></td><td>300 working-days at fr. 0.89</td><td>fr. 267</td></tr><tr><td><b>boy</b></td><td>300 working-days at fr. 0.56</td><td>fr. 168</td></tr><tr><td><b>girl</b></td><td>300 working-days at fr. 0.55</td><td>fr. 165</td></tr><tr><td></td><td></td><td><b>Total</b> fr. 1,068</td></tr>
    hash: sha256:5b4119cafb3c36a7f20a9caffbcc2f9a3057866092a04f0e4a3bc7155e8c4d77
    state: active
  - id: p00170
    type: paragraph
    text: "The annual expenditure of the family would cause a deficit upon the hypothesis that the labourer has the food of:"
    hash: sha256:9cff1c193ce83d280f9e2220a28179a31c5fd48783c31665b9db82a1db794ea4
    state: active
  - id: p00171
    type: table
    text: <tr><td><b>The man-of-war’s man</b></td><td>fr. 1,828</td><td>Deficit fr. 760</td></tr><tr><td><b>The soldier</b></td><td>fr. 1,473</td><td>Deficit fr. 405</td></tr><tr><td><b>The prisoner</b></td><td>fr. 1,112</td><td>Deficit fr. 44</td></tr>
    hash: sha256:1f7c509977f36ba31e7802a74d4bc25aad5377871232e6b3c4f86427c6a4a383
    state: active
  - id: p00172
    type: blockquote
    text: “We see that few labouring families can reach, we will not say the average of the sailor or soldier, but even that of the prisoner. The general average (of the cost of each prisoner in the different prisons during the period 1847-1849), has been 63 centimes for all prisons. This figure, compared with that of the daily maintenance of the labourer, shows a difference of 13 centimes. It must be remarked further, that if in the prisons it is necessary to set down in the account the expenses of administration and surveillance, on the other hand, the prisoners have not to pay for their lodging; that the purchases they make at the canteens are not included in the expenses of maintenance, and that these expenses are greatly lowered in consequence of the large number of persons that make up the establishments, and of contracting for or buying wholesale, the food and other things that enter into their consumption.... How comes it, however, that a great number, we might say, a great majority, of labourers, live in a more economical way? It is ... by adopting expedients, the secret of which only the labourer knows; by reducing his daily rations; by substituting rye-bread for wheat; by eating less meat, or even none at all, and the same with butter and condiments; by contenting themselves with one or two rooms where the family is crammed together, where boys and girls sleep side by side, often on the same pallet; by economy of clothing, washing, decency; by giving up the Sunday diversions; by, in short, resigning themselves to the most painful privations. Once arrived at this extreme limit, the least rise in the price of food, stoppage of work, illness, increases the labourer’s distress and determines his complete ruin; debts accumulate, credit fails, the most necessary clothes and furniture are pawned, and finally, the family asks to be enrolled on the list of paupers.” (Ducpétiaux, l. c., pp. 151, 154, 155.)
    hash: sha256:659c622b2bc2b809f5d4cdc3d5e621a7a4b4b9c9219499f5ab3aa647fc74003a
    state: active
  - id: p00173
    type: paragraph
    text: "In fact, in this “Paradise of capitalists” there follows, on the smallest change in the price of the most essential means of subsistence, a change in the number of deaths and crimes! (See Manifesto of the Maatschappij: “De Vlamingen Vooruit!” Brussels, 1860, pp. 15, 16.) In all Belgium are 930,000 families, of whom, according to the official statistics, 90,000 are wealthy and on the list of voters = 450,000 persons; 390,000 families of the lower middle-class in towns and villages, the greater part of them constantly sinking into the proletariat, = 1,950,000 persons. Finally, 450,000 working class families = 2,250,000 persons, of whom the model ones enjoy the happiness depicted by Ducpétiaux. Of the 450,000 working class families, over 200,000 are on the pauper list."
    hash: sha256:87f7d885d3351703c17d3e934062d359360bc1ae92c601064cfa5be46128eddf
    state: active
  - id: p00174
    type: heading
    level: 5
    text: E. The British Agricultural Proletariat
    hash: sha256:1896b68b8cbc375d894b2dd10441018368e17530a5057844eb8a49c09ac726fe
    state: active
  - id: p00175
    type: paragraph
    text: Nowhere does the antagonistic character of capitalistic production and accumulation assert itself more brutally than in the progress of English agriculture (including cattle-breeding) and the retrogression of the English agricultural labourer. Before I turn to his present situation, a rapid retrospect. Modern agriculture dates in England from the middle of the 18th century, although the revolution in landed property, from which the changed mode of production starts as a basis, has a much earlier date.
    hash: sha256:e8e0e3b1d8b2457de1eccd3e3f4b1c558e8e449dd29b20fdd3f008e764f42741
    state: active
  - id: p00176
    type: paragraph
    text: If we take the statements of Arthur Young, a careful observer, though a superficial thinker, as to the agricultural labourer of 1771, the latter plays a very pitiable part compared with his predecessor of the end of the 14th century,
    hash: sha256:9ea8c3bb77391ce10ae770c2a4d889707f634028b5663d517445833b2a17d28d
    state: active
  - id: p00177
    type: blockquote
    text: “when the labourer ... could live in plenty, and accumulate wealth,” <fn ref="75"/>
    hash: sha256:4fcf2e96468e8cce97bce19dbffac2bf85a9f8c787f7a8526bc40ce84df61350
    state: active
  - id: p00178
    type: paragraph
    text: "not to speak of the 15th century, “the golden age of the English labourer in town and country.” We need not, however, go back so far. In a very instructive work of the year 1777 we read:"
    hash: sha256:396b651c1446fbbecf2da217afedbf40943349f5b3b106103f059baaeca59e76
    state: active
  - id: p00179
    type: blockquote
    text: “The great farmer is nearly mounted to a level with him [the gentleman]; while the poor labourer is depressed almost to the earth. His unfortunate situation will fully appear, by taking a comparative view of it, only forty years ago, and at present.... Landlord and tenant ... have both gone hand in hand in keeping the labourer down.” <fn ref="76"/>
    hash: sha256:3f01bc1a794e67f32b9a80f687a297ce743ad23db2cbc7701df1b4a5ab3afad4
    state: active
  - id: p00180
    type: paragraph
    text: It is then proved in detail that the real agricultural wages between 1737 and 1777 fell nearly ¼ or 25 per cent.
    hash: sha256:61710fcb6d145d212d21c20d3ad3d7228c5069438f6f11512c31a2e6f6abee35
    state: active
  - id: p00181
    type: blockquote
    text: “Modern policy,” says Dr. Richard Price also, “is, indeed, more favourable to the higher classes of people; and the consequences may in time prove that the whole kingdom will consist of only gentry and beggars, or of grandees and slaves.” <fn ref="77"/>
    hash: sha256:40238642183abc5a5bc9711f2c2ce088ab8559d67c5e9559bf42e42d5acf1a7c
    state: active
  - id: p00182
    type: paragraph
    text: Nevertheless, the position of the English agricultural labourer from 1770 to 1780, with regard to his food and dwelling, as well as to his self-respect, amusements, &amp;c., is an ideal never attained again since that time. His average wage expressed in pints of wheat was from 1770 to 1771, 90 pints, in Eden’s time (1797) only 65, in 1808 but 60. <fn ref="78"/>
    hash: sha256:15938500f961e994f30cb8c1c6d8e88184363a6eb9bca4799ae8f37ee14790b0
    state: active
  - id: p00183
    type: paragraph
    text: 'The state of the agricultural labourer at the end of the Anti-Jacobin War, during which landed proprietors, farmers, manufacturers, merchants, bankers, stockbrokers, army-contractors, &amp;c., enriched themselves so extraordinarily, has been already indicated above. The nominal wages rose in consequence partly of the bank-note depreciation, partly of a rise in the price of the primary means of subsistence independent of this depreciation. But the actual wage-variation can be evidenced in a very simple way, without entering into details that are here unnecessary. The Poor Law and its administration were in 1795 and 1814 the same. It will be remembered how this law was carried out in the country districts: in the form of alms the parish made up the nominal wage to the nominal sum required for the simple vegetation of the labourer. The ratio between the wages paid by the farmer, and the wage-deficit made good by the parish, shows us two things. First, the falling of wages below their minimum; second, the degree in which the agricultural labourer was a compound of wage labourer and pauper, or the degree in which he had been turned into a serf of his parish. Let us take one county that represents the average condition of things in all counties. In Northamptonshire, in 1795, the average weekly wage was 7s. 6d.; the total yearly expenditure of a family of 6 persons, £36 12s. 5d.; their total income, £29 18s.; deficit made good by the parish, £6 14s. 5d. In 1814, in the same county, the weekly wage was 12s. 2d.; the total yearly expenditure of a family of 5 persons, £54 18s. 4d.; their total income, £36, 2s.; deficit made good by the parish, £18 6s. 4d. <fn ref="79"/> In 1795 the deficit was less than 1/4 the wage, in 1814, more than half. It is self-evident that, under these circumstances, the meagre comforts that Eden still found in the cottage of the agricultural labourer, had vanished by 1814. <fn ref="80"/> Of all the animals kept by the farmer, the labourer, the <i>instrumentum vocale</i>, was, thenceforth, the most oppressed, the worst nourished, the most brutally treated.'
    hash: sha256:bf2398707d2a2146e7a1796ef75af2aea06397ea9165204f2bc8f5c49dda8818
    state: active
  - id: p00184
    type: paragraph
    text: The same state of things went on quietly until
    hash: sha256:657f2e477ec959f93d379fb142194439d7d99afc443895ded307a3b7310eba36
    state: active
  - id: p00185
    type: blockquote
    text: “the Swing riots, in 1830, revealed to us (<i>i.e</i>., the ruling classes) by the light of blazing corn-stacks, that misery and black mutinous discontent smouldered quite as fiercely under the surface of agricultural as of manufacturing England.” <fn ref="81"/>
    hash: sha256:6cba865c9fdbc6a774017359d0d1a60897a3f5918d6192755511fe2182cf39ae
    state: active
  - id: p00186
    type: paragraph
    text: "At this time, Sadler, in the House of Commons, christened the agricultural labourers “white slaves,” and a Bishop echoed the epithet in the Upper House. The most notable political economist of that period — E. G. Wakefield — says:"
    hash: sha256:20e612341d48c84dc3c0c229232cf22259cf7342ce9bf389f2b7530bb4a23af2
    state: active
  - id: p00187
    type: blockquote
    text: “The peasant of the South of England ... is not a freeman, nor is he a slave; he is a pauper.” <fn ref="82"/>
    hash: sha256:9b97336e9ee75fc3cb33be41ffadac82dc9f019d670b9b810375248e7895cc92
    state: active
  - id: p00188
    type: paragraph
    text: "The time just before the repeal of the Corn Laws threw new light on the condition of the agricultural labourers. On the one hand, it was to the interest of the middle-class agitators to prove how little the Corn Laws protected the actual producers of the corn. On the other hand, the industrial bourgeoisie foamed with sullen rage at the denunciations of the factory system by the landed aristocracy, at the pretended sympathy with the woes of the factory operatives, of those utterly corrupt, heartless, and genteel loafers, and at their “diplomatic zeal” for factory legislation. It is an old English proverb that “when thieves fall out, honest men come by their own,” and, in fact, the noisy, passionate quarrel between the two fractions of the ruling class about the question, which of the two exploited the labourers the more shamefully, was on each hand the midwife of the truth. Earl Shaftesbury, then Lord Ashley, was commander-in-chief in the aristocratic, philanthropic, anti-factory campaign. He was, therefore, in 1845, a favourite subject in the revelations of the <i>Morning Chronicle</i> on the condition of the agricultural labourers. This journal, then the most important Liberal organ, sent special commissioners into the agricultural districts, who did not content themselves with mere general descriptions and statistics, but published the names both of the labouring families examined and of their landlords. The following list gives the wages paid in three villages in the neighbourhood of Blanford, Wimbourne, and Poole. The villages are the property of Mr. G. Bankes and of the Earl of Shaftesbury. It will be noted that, just like Bankes, this “low church pope,” this head of English pietists, pockets a great part of the miserable wages of the labourers under the pretext of house-rent: —"
    hash: sha256:dd814b69b41dd803c76897e4e30183ed5d294af485efe5a48198f777fa7fe9d4
    state: active
  - id: p00189
    type: table
    text: <tr><td colspan="7"><b>FIRST VILLAGE</b></td></tr><tr><td><i>(a)</i> Children.</td><td>2</td><td>3</td><td>2</td><td>2</td><td>6</td><td>3</td></tr><tr><td><i>(b)</i> Number of Members in Family.</td><td>4</td><td>5</td><td>4</td><td>4</td><td>8</td><td>5</td></tr><tr><td><i>(c)</i> Weekly Wage of the Men.</td><td>8s. 0d.</td><td>8s. 0d.</td><td>8s. 0d.</td><td>8s. 0d.</td><td>7s. 0d.</td><td>7s. 0d.</td></tr><tr><td><i>(d)</i> Weekly Wage of the Children.</td><td>—</td><td>—</td><td>—</td><td>—</td><td>1/-, 1/6</td><td>1/-, 2/-</td></tr><tr><td><i>(e)</i> Weekly Income of the whole Family.</td><td>8s. 0d.</td><td>8s. 0d.</td><td>8s. 0d.</td><td>8s. 0d.</td><td>10s. 6d.</td><td>7s. 0d.</td></tr><tr><td><i>(f)</i> Weekly Rent.</td><td>2s. 0d.</td><td>1s. 6d.</td><td>1s. 0d.</td><td>1s. 0d.</td><td>2s. 0d.</td><td>1s. 4d.</td></tr><tr><td><i>(g)</i> Total Weekly wage after deduction of Rent.</td><td>6s. 0d.</td><td>6s. 6d.</td><td>7s. 0d.</td><td>7s. 0d.</td><td>8s. 6d.</td><td>5s. 8d.</td></tr><tr><td><i>(h)</i> Weekly income per head.</td><td>1s. 6d.</td><td>1s. 3½d.</td><td>1s. 9d.</td><td>1s. 9d.</td><td>1s. 0 3/4d.</td><td>1s. 1½d.</td></tr>
    hash: sha256:a990729f2d94036dacf2a1a1c7971d7afb906e98aba39f993049ff78719ce093
    state: active
  - id: p00190
    type: table
    text: <tr><td colspan="6"><b>SECOND VILLAGE</b></td></tr><tr><td><i>(a)</i> Children.</td><td>6</td><td>6</td><td>8</td><td>4</td><td>3</td></tr><tr><td><i>(b)</i> Number of Members in Family.</td><td>8</td><td>8</td><td>10</td><td>6</td><td>5</td></tr><tr><td><i>(c)</i> Weekly Wage of the Men.</td><td>7s. 0d.</td><td>7s. 0d.</td><td>7s. 0d.</td><td>7s. 0d.</td><td>7s. 0d.</td></tr><tr><td><i>(d)</i> Weekly Wage of the Children.</td><td>1/-, 1/6</td><td>1/-, 1/6</td><td>—</td><td>—</td><td>—</td></tr><tr><td><i>(e)</i> Weekly Income of the whole Family.</td><td>10s. 0d.</td><td>7s. 0d.</td><td>7s. 0d.</td><td>7s. 0d.</td><td>7s. 0d.</td></tr><tr><td><i>(f)</i> Weekly Rent.</td><td>1s. 6d.</td><td>1s. 3½d.</td><td>1s. 3½d.</td><td>1s. 6½d.</td><td>1s. 6½d.</td></tr><tr><td><i>(g)</i> Total Weekly wage after deduction of Rent.</td><td>8s. 6d.</td><td>5s. 8½d.</td><td>5s. 8½d.</td><td>5s. 5½d.</td><td>5s. 5½d.</td></tr><tr><td><i>(h)</i> Weekly income per head.</td><td>1s. 0 3/4d.</td><td>0s. 8½d.</td><td>0s. 7d.</td><td>0s. 11d.</td><td>1s. 1d.</td></tr>
    hash: sha256:591c8b73665c185a9fb0bac3681ec1779a2edcec61925356c9e129c76463b20c
    state: active
  - id: p00191
    type: table
    text: <tr><td colspan="4"><b>THIRD VILLAGE</b></td></tr><tr><td><i>(a)</i> Children.</td><td>4</td><td>3</td><td>0</td></tr><tr><td><i>(b)</i> Number of Members in Family.</td><td>6</td><td>5</td><td>2</td></tr><tr><td><i>(c)</i> Weekly Wage of the Men.</td><td>7s. 0d.</td><td>7s. 0d.</td><td>5s. 0d.</td></tr><tr><td><i>(d)</i> Weekly Wage of the Children.</td><td>-</td><td>1/- 2/-</td><td>1/- 2/6</td></tr><tr><td><i>(e)</i> Weekly Income of the whole Family.</td><td>7s. 0d.</td><td>11s. 6d.</td><td>5s. 0d.</td></tr><tr><td><i>(f)</i> Weekly Rent.</td><td>1s. 0d.</td><td>0s. 10d.</td><td>1s. 0d.</td></tr><tr><td><i>(g)</i> Total Weekly wage after deduction of Rent.</td><td>6s. 0d.</td><td>10s. 8d.</td><td>4s. 0d.</td></tr><tr><td><i>(h)</i> Weekly income per head.<fn ref="83"/></td><td>1s. 0d.</td><td>2s. 1 3/5d.</td><td>2s. 0d.</td></tr>
    hash: sha256:752d84e5c2c1080d3bb3ce40d6ae8e4e7560198151aa6c59ea0f3d57bf8f68f5
    state: active
  - id: p00192
    type: paragraph
    text: 'The repeal of the Corn Laws gave a marvellous impulse to English agriculture. <fn ref="84"/> Drainage on the most extensive scale, new methods of stall-feeding, and of the artificial cultivation of green crops, introduction of mechanical manuring apparatus, new treatment of clay soils, increased use of mineral manures, employment of the steam-engine, and of all kinds of new machinery, more intensive cultivation generally, characterised this epoch. Mr. Pusey, Chairman of the Royal Agricultural Society, declares that the (relative) expenses of farming have been reduced nearly one half by the introduction of new machinery. On the other hand, the actual return of the soil rose rapidly. Greater outlay of capital per acre, and, as a consequence, more rapid concentration of farms, were essential conditions of the new method. <fn ref="85"/> At the same time, the area under cultivation increased, from 1846 to 1856, by 464,119 acres, without reckoning the great area in the Eastern Counties which was transformed from rabbit warrens and poor pastures into magnificent corn-fields. It has already been seen that, at the same time, the total number of persons employed in agriculture fell. As far as the actual agricultural labourers of both sexes and of all ages are concerned, their number fell from 1,241,396, in 1851, to 1,163, 217 in 1861. <fn ref="86"/> If the English Registrar-General, therefore, rightly remarks:'
    hash: sha256:b24db0fa4b37f4c41aa33df61207299fcfbfebdd1d66d33bc23421b8c8240ef0
    state: active
  - id: p00193
    type: blockquote
    text: “The increase of farmers and farm-labourers, since 1801, bears no kind of proportion ... to the increase of agricultural produce,” <fn ref="87"/>
    hash: sha256:541875278dd5a6824a72da3726166ba1ee95058dc40a4c1ebbc9048c4accdfd2
    state: active
  - id: p00194
    type: paragraph
    text: this disproportion obtains much more for the last period, when a positive decrease of the agricultural population went hand in hand with increase of the area under cultivation, with more intensive cultivation, unheard-of accumulation of the capital incorporated with the soil, and devoted to its working, an augmentation in the products of the soil without parallel in the history of English agriculture, plethoric rent-rolls of landlords, and growing wealth of the capitalist farmers. If we take this, together with the swift, unbroken extension of the markets, <i>viz</i>., the towns, and the reign of Free Trade, then the agricultural labourer was at last, <i>post tot discrimina rerum,</i> placed in circumstances that ought, <i>secundum artem,</i> to have made him drunk with happiness.
    hash: sha256:00500b736d553a4b60ec3486033d04515d5a2cec6b92f37abb6fd4cd2f6c4ae5
    state: active
  - id: p00195
    type: paragraph
    text: 'But Professor Rogers comes to the conclusion that the lot of the English agricultural labourer of today, not to speak of his predecessor in the last half of the 14th and in the 15th century, but only compared with his predecessor from 1770 to 1780, has changed for the worse to an extraordinary extent, that “the peasant has again become a serf,” and a serf worse fed and worse clothed. <fn ref="88"/> Dr. Julian Hunter, in his epochmaking report on the dwellings of the agricultural labourers, says:'
    hash: sha256:ee76287694f3190569341cfb0badb09b72486d779b4ef4b663a642f150186cd7
    state: active
  - id: p00196
    type: blockquote
    text: “The cost of the hind” (a name for the agricultural labourer, inherited from the time of serfdom) “is fixed at the lowest possible amount on which he can live ... the supplies of wages and shelter are not calculated on the profit to be derived from him. He is a zero in farming calculations ... <fn ref="89"/> The means [of subsistence] being always supposed to be a fixed quantity. <fn ref="90"/> As to any further reduction of his income, he may say, <i>nihil habeo nihil curo.</i> He has no fears for the future, because he has now only the spare supply necessary to keep him. He has reached the zero from which are dated the calculations of the farmer. Come what will, he has no share either in prosperity or adversity.” <fn ref="91"/>
    hash: sha256:4750822505008ab6a9dd6f6c1de75c0036fa745c3c7f7d500e583b98c3823038
    state: active
  - id: p00197
    type: paragraph
    text: "In the year 1863, an official inquiry took place into the conditions of nourishment and labour of the criminals condemned to transportation and penal servitude. The results are recorded in two voluminous Blue books. Among other things it is said:"
    hash: sha256:4dccce6886f0c958f5c3218db4fdd0ddd4ff1cf469fdb7809d26108663243cb3
    state: active
  - id: p00198
    type: blockquote
    text: “From an elaborate comparison between the diet of convicts in the convict prisons in England, and that of paupers in workhouses and of free labourers in the same country ... it certainly appears that the former are much better fed than either of the two other classes,” <fn ref="92"/> whilst “the amount of labour required from an ordinary convict under penal servitude is about one half of what would be done by an ordinary day-labourer.” <fn ref="93"/>
    hash: sha256:73bd302255c87fd1171090a7631805d76377f0a29c957045159ec86956500b22
    state: active
  - id: p00199
    type: paragraph
    text: "A few characteristic depositions of witnesses: John Smith, governor of the Edinburgh prison, deposes:"
    hash: sha256:d4ad7ef0c939f0b4e6f869e534d5bde1878aed2a0df8e9b084d4330b9b139a02
    state: active
  - id: p00200
    type: blockquote
    text: 'No. 5056. “The diet of the English prisons [is] superior to that of ordinary labourers in England.” No 50. “It is the fact ... that the ordinary agricultural labourers in Scotland very seldom get any meat at all.” Answer No. 3047. “Is there anything that you are aware of to account for the necessity of feeding them very much better than ordinary labourers? — Certainly not.” No. 3048. “Do you think that further experiments ought to be made in order to ascertain whether a dietary might not be hit upon for prisoners employed on public works nearly approaching to the dietary of free labourers? ...” <fn ref="94"/> “He [the agricultural labourer] might say: ‘I work hard, and have not enough to eat, and when in prison I did not work harder where I had plenty to eat, and therefore it is better for me to be in prison again than here.’” <fn ref="95"/>'
    hash: sha256:c7ce596e6195306183d56580d66a256bf35d86d3ec496396a69ebc62722c4d11
    state: active
  - id: p00201
    type: paragraph
    text: From the tables appended to the first volume of the Report I have compiled the annexed comparative summary.
    hash: sha256:1a21da96e9d25d87b96c64bc043ea4c1c1cad1f3e7206b9acb74aeb984d80728
    state: active
  - id: p00202
    type: table
    text: <tr><td colspan="5"><b>WEEKLY AMOUNT OF NUTRIENTS</b></td></tr><tr><td></td><td><b>Quantity Of<br/>Nitrogenous<br/>Ingredients</b></td><td><b>Quantity Of<br/>Non-Nitro-<br/>genous In-<br/>gredients</b></td><td><b>Quantity Of<br/>Mineral<br/>Matter</b></td><td><b>TOTAL</b></td></tr><tr><td></td><td>Ounces</td><td>Ounces</td><td>Ounces</td><td>Ounces</td></tr><tr><td>Portland (convict)</td><td>28.95</td><td>150.06</td><td>4.68</td><td>183.69</td></tr><tr><td>Sailor in the Navy</td><td>29.63</td><td>152.91</td><td>4.52</td><td>187.06</td></tr><tr><td>Soldier</td><td>25.55</td><td>114.49</td><td>3.94</td><td>143.98</td></tr><tr><td>Working Coachmaker</td><td>24.53</td><td>162.06</td><td>4.23</td><td>190.82</td></tr><tr><td>Compositor</td><td>21.24</td><td>100.83</td><td>3.12</td><td>125.19</td></tr><tr><td>Agricultural labourer<fn ref="96"/></td><td>17.73</td><td>118.06</td><td>3.29</td><td>139.08</td></tr>
    hash: sha256:c5c90d8ec4a2b2fd56a2682ed253cd04121e7ac2c493c6fff662b748c4f89576
    state: active
  - id: p00203
    type: paragraph
    text: The general result of the inquiry by the medical commission of 1863 on the food of the lowest fed classes, is already known to the reader. He will remember that the diet of a great part of the agricultural labourers’ families is below the minimum necessary “to arrest starvation diseases.” This is especially the case in all the purely rural districts of Cornwall, Devon, Somerset, Wilts, Stafford, Oxford, Berks, and Herts.
    hash: sha256:2cf0a27e2b31edd29b0c169f358af46718ea096fb5fbe524953f372c0ce3e746
    state: active
  - id: p00204
    type: blockquote
    text: “The nourishment obtained by the labourer himself,” says Dr. E. Smith, “is larger than the average quantity indicates, since he eats a larger share ... necessary to enable him to perform his labour ... of food than the other members of the family, including in the poorer districts nearly all the meat and bacon.... The quantity of food obtained by the wife and also by the children at the period of rapid growth, is in many cases, in almost every county, deficient, and particularly in nitrogen.” <fn ref="97"/>
    hash: sha256:b801c2041f8a0340f7560bf96afd9b3d837babb5bd7a8297265ee3586e0295d0
    state: active
  - id: p00205
    type: paragraph
    text: The male and female servants living with the farmers themselves are sufficiently nourished. Their number fell from 288,277 in 1851, to 204,962 in 1861.
    hash: sha256:7c2ab28b4efeab8fea6f669f2ce82054e476c530c7332b20585a288f6b891091
    state: active
  - id: p00206
    type: blockquote
    text: “The labour of women in the fields,” says Dr. Smith, “whatever may be its disadvantages, ... is under present circumstances of great advantage to the family, since it adds that amount of income which ... provides shoes and clothing and pays the rent, and thus enables the family to be better fed.” <fn ref="98"/>
    hash: sha256:b0295cf08982fdabfc300126da365c9aa106124c5e0140537f63c6c0f5cd2bd2
    state: active
  - id: p00207
    type: paragraph
    text: "One of the most remarkable results of the inquiry was that the agricultural labourer of England, as compared with other parts of the United Kingdom, “is considerably the worst fed,” as the appended table shows:"
    hash: sha256:b2e842c251b8f32cb8b5d62da2adcf4757d2dc4a72d86a830c56e8f778935fa6
    state: active
  - id: p00208
    type: paragraph
    text: "Quantities of Carbon and Nitrogen weekly consumed by an average agricultural adult:"
    hash: sha256:1ec92ab270263e74dfa2405b923da6e46e9d012b6ad0235e07680b24cfca980d
    state: active
  - id: p00209
    type: table
    text: <tr><td></td><td><b>Carbon,<br/>grains</b></td><td><b>Nitrogen,<br/>grains</b></td></tr><tr><td>England</td><td>46,673</td><td>1,594</td></tr><tr><td>Wales</td><td>48,354</td><td>2,031</td></tr><tr><td>Scotland</td><td>48,980</td><td>2,348</td></tr><tr><td>Ireland<fn ref="99"/></td><td>43,366</td><td>2,434</td></tr>
    hash: sha256:0c98cdf4eb52188a4888429d12211ba40c8584c5263da4269f136833940a0628
    state: active
  - id: p00210
    type: blockquote
    text: '“To the insufficient quantity and miserable quality of the house accommodation generally had,” says Dr. Simon, in his official Health Report, “by our agricultural labourers, almost every page of Dr. Hunter’s report bears testimony. And gradually, for many years past, the state of the labourer in these respects has been deteriorating, house-room being now greatly more difficult for him to find, and, when found, greatly less suitable to his needs than, perhaps, for centuries had been the case. Especially within the last twenty or thirty years, the evil has been in very rapid increase, and the household circumstances of the labourer are now in the highest degree deplorable. Except in so far as they whom his labour enriches, see fit to treat him with a kind of pitiful indulgence, he is quite peculiarly helpless in the matter. Whether he shall find house-room on the land which he contributes to till, whether the house-room which he gets shall be human or swinish, whether he shall have the little space of garden that so vastly lessens the pressure of his poverty — all this does not depend on his willingness and ability to pay reasonable rent for the decent accommodation he requires, but depends on the use which others may see fit to make of their ‘right to do as they will with their own.’ However large may be a farm, there is no law that a certain proportion of labourers’ dwellings (much less of decent dwellings) shall be upon it; nor does any law reserve for the labourer ever so little right in that soil to which his industry is as needful as sun and rain.... An extraneous element weighs the balance heavily against him ... the influence of the Poor Law in its provisions concerning settlement and chargeability. <fn ref="100"/> Under this influence, each parish has a pecuniary interest in reducing to a minimum the number of its resident labourers: — for, unhappily, agricultural labour instead of implying a safe and permanent independence for the hardworking labourer and his family, implies for the most part only a longer or shorter circuit to eventual pauperism — a pauperism which, during the whole circuit, is so near, that any illness or temporary failure of occupation necessitates immediate recourse to parochial relief — and thus all residence of agricultural population in a parish is glaringly an addition to its poor-rates .... Large proprietors <fn ref="101"/> ... have but to resolve that there shall be no labourers’ dwellings on their estates, and their estates will thenceforth be virtually free from half their responsibility for the poor. How far it has been intended, in the English constitution and law, that this kind of unconditional property in land should be acquirable, and that a landlord ‘doing as he wills with his own,’ should be able to treat the cultivators of the soil as aliens, whom he may expel from his territory, is a question which I do not pretend to discuss.... For that (power) of eviction ... does not exist only in theory. On a very large scale it prevails in practice — prevails ... as a main governing condition in the household circumstances of agricultural labour.... As regards the extent of the evil, it may suffice to refer to the evidence which Dr. Hunter has compiled from the last census, that destruction of houses, notwithstanding increased local demands for them, had, during the last ten years, been in progress in 821 separate parishes or townships of England, so that irrespectively of persons who had been forced to become non-resident (that is in the parishes in which they work), these parishes and townships were receiving in 1861, as compared with 1851, a population 5 1/3 per cent. greater, into houseroom 4½ per cent. less... When the process of depopulation has completed itself, the result, says Dr. Hunter, is a show-village where the cottages have been reduced to a few, and where none but persons who are needed as shepherds, gardeners, or game-keepers, are allowed to live; regular servants who receive the good treatment usual to their class. <fn ref="102"/> But the land requires cultivation, and it will be found that the labourers employed upon it are not the tenants of the owner, but that they come from a neighbouring open village, perhaps three miles off, where a numerous small proprietary had received them when their cottages were destroyed in the close villages around. Where things are tending to the above result, often the cottages which stand, testify, in their unrepaired and wretched condition, to the extinction to which they are doomed. They are seen standing in the various stages of natural decay. While the shelter holds together, the labourer is permitted to rent it, and glad enough he will often be to do so, even at the price of decent lodging. But no repair, no improvement shall it receive, except such as its penniless occupants can supply. And when at last it becomes quite uninhabitable — uninhabitable even to the humblest standard of serfdom — it will be but one more destroyed cottage, and future poor-rates will be somewhat lightened. While great owners are thus escaping from poor-rates through the depopulation of lands over which they have control, the nearest town or open village receive the evicted labourers: the nearest, I say, but this “nearest” may mean three or four miles distant from the farm where the labourer has his daily toil. To that daily toil there will then have to be added, as though it were nothing, the daily need of walking six or eight miles for power of earning his bread. And whatever farmwork is done by his wife and children, is done at the same disadvantage. Nor is this nearly all the toil which the distance occasions him. In the open village, cottage-speculators buy scraps of land, which they throng as densely as they can with the cheapest of all possible hovels. And into those wretched habitations (which, even if they adjoin the open country, have some of the worst features of the worst town residences) crowd the agricultural labourers of England. <fn ref="103"/> .... Nor on the other hand must it be supposed that even when the labourer is housed upon the lands which he cultivates, his household circumstances are generally such as his life of productive industry would seem to deserve. Even on princely estates ... his cottage ... may be of the meanest description. There are landlords who deem any stye good enough for their labourer and his family, and who yet do not disdain to drive with him the hardest possible bargain for rent. <fn ref="104"/> It may be but a ruinous one-bedroomed hut, having no fire-grate, no privy, no opening window, no water supply but the ditch, no garden — but the labourer is helpless against the wrong.... And the Nuisances Removal Acts ... are ... a mere dead letter ... in great part dependent for their working on such cottage-owners as the one from whom his (the labourer’s) hovel is rented.... From brighter, but exceptional scenes, it is requisite in the interests of justice, that attention should again be drawn to the overwhelming preponderance of facts which are a reproach to the civilisation of England. Lamentable indeed, must be the case, when, notwithstanding all that is evident with regard to the quality of the present accommodation, it is the common conclusion of competent observers that even the general badness of dwellings is an evil infinitely less urgent than their mere numerical insufficiency. For years the over-crowding of rural labourers’ dwellings has been a matter of deep concern, not only to persons who care for sanitary good, but to persons who care for decent and moral life. For, again and again in phrases so uniform that they seem stereotyped, reporters on the spread of epidemic disease in rural districts, have insisted on the extreme importance of that over-crowding, as an influence which renders it a quite hopeless task, to attempt the limiting of any infection which is introduced. And again and again it has been pointed out that, notwithstanding the many salubrious influences which there are in country life, the crowding which so favours the extension of contagious disease, also favours the origination of disease which is not contagious. And those who have denounced the over-crowded state of our rural population have not been silent as to a further mischief. Even where their primary concern has been only with the injury to health, often almost perforce they have referred to other relations on the subject. In showing how frequently it happens that adult persons of both sexes, married and unmarried, are huddled together in single small sleeping rooms, their reports have carried the conviction that, under the circumstances they describe, decency must always be outraged, and morality almost of necessity must suffer. <fn ref="105"/> Thus, for instance, in the appendix of my last annual report, Dr. Ord, reporting on an outbreak of fever at Wing, in Buckinghamshire, mentions how a young man who had come thither from Wingrave with fever, “in the first days of his illness slept in a room with nine other persons. Within a fortnight several of these persons were attacked, and in the course of a few weeks five out of the nine had fever, and one died...” From Dr. Harvey, of St. George’s Hospital, who, on private professional business, visited Wing during the time of the epidemic, I received information exactly in the sense of the above report.... “A young woman having fever, lay at night in a room occupied by her father and mother, her bastard child, two young men (her brothers), and her two sisters, each with a bastard child — 10 persons in all. A few weeks ago 13 persons slept in it.” <fn ref="106"/>'
    hash: sha256:e4920add98b2528363c9577b85446941323bcafd0fe6b86ea77bbe7be516b3a4
    state: active
  - id: p00211
    type: paragraph
    text: Dr. Hunter investigated 5,375 cottages of agricultural labourers, not only in the purely agricultural districts, but in all counties of England. Of these, 2,195 had only one bedroom (often at the same time used as living-room), 2,930 only two, and 250, more than two. I will give a few specimens culled from a dozen counties.
    hash: sha256:dab4f347c3fc538ca5261dc374ed6a9d6f40a1a5732504d4f80665c1c02de475
    state: active
  - id: p00212
    type: heading
    level: 5
    text: (1.) Bedfordshire
    hash: sha256:9d5379f493a92b3131054e9ba504e22d63d99c72ee6f35f8dae3dde0e0611ced
    state: active
  - id: p00213
    type: paragraph
    text: <i>Wrestlingworth.</i> Bedrooms about 12 feet long and 10 broad, although many are smaller than this. The small, one-storied cots are often divided by partitions into two bedrooms, one bed frequently in a kitchen, 5 feet 6 inches in height. Rent, £3 a year. The tenants have to make their own privies, the landlord only supplies a hole. As soon as one has made a privy, it is made use of by the whole neighbourhood. One house, belonging to a family called Richardson, was of quite unapproachable beauty. “Its plaster walls bulged very like a lady’s dress in a curtsey. One gable end was convex, the other concave, and on this last, unfortunately, stood the chimney, a curved tube of clay and wood like an elephant’s trunk. A long stick served as prop to prevent the chimney from falling. The doorway and window were rhomboidal.” Of 17 houses visited, only 4 had more than one bedroom, and those four overcrowded. The cots with one bedroom sheltered 3 adults and 3 children, a married couple with 6 children, &amp;c.
    hash: sha256:999c0523b7c15b3ad8fe9100ebd9ad8f3b5ffb8bc4828af5b2194ad1bf7854ff
    state: active
  - id: p00214
    type: paragraph
    text: <i>Dunton.</i> High rents, from £4 to £5; weekly wages of the man, 10s. They hope to pay the rent by the straw-plaiting of the family. The higher the rent, the greater the number that must work together to pay it. Six adults, living with 4 children in one sleeping apartment, pay £3 10s. for it. The cheapest house in Dunton, 15 feet long externally, 10 broad, let for £3. Only one of the houses investigated had 2 bedrooms. A little outside the village, a house whose “tenants dunged against the house-side,” the lower 9 inches of the door eaten away through sheer rottenness; the doorway, a single opening closed at night by a few bricks, ingeniously pushed up after shutting and covered with some matting. Half a window, with glass and frame, had gone the way of all flesh. Here, without furniture, huddled together were 3 adults and 5 children. Dunton is not worse than the rest of Biggleswade Union.
    hash: sha256:799e50235686546eaa5fa3aa549b071f71b3d5ad965b5ebba8bac4573eebc789
    state: active
  - id: p00215
    type: heading
    level: 5
    text: (2.) Berkshire
    hash: sha256:7d0bdc55feae08ffac549f9552c77e9a7dae9e3893ba41d547444f59b0eb9d5b
    state: active
  - id: p00216
    type: paragraph
    text: <i>Beenham.</i> In June, 1864, a man, his wife and 4 children lived in a cot (one-storied cottage). A daughter came home from service with scarlet fever. She died. One child sickened and died. The mother and one child were down with typhus when Dr. Hunter was called in. The father and one child slept outside, but the difficulty of securing isolation was seen here, for in the crowded market of the miserable village lay the linen of the fever-stricken household, waiting for the wash. The rent of H.’s house, 1s. a-week; one bedroom for man, wife, and 6 children. One house let for 8d. a-week, 14 feet 6 inches long, 7 feet broad, kitchen, 6 feet high; the bedroom without window, fire-place, door, or opening, except into the lobby; no garden. A man lived here for a little while, with two grown-up daughters and one grown-up son; father and son slept on the bed, the girls in the passage. Each of the latter had a child while the family was living here, but one went to the workhouse for her confinement and then came home.
    hash: sha256:3ed8340695bfecc2c6ad644cc324fe9102a9334a5cdec5692dbdaa210f800014
    state: active
  - id: p00217
    type: heading
    level: 5
    text: (3.) Buckinghamshire
    hash: sha256:436faeeb61678d50e89cf0cd9877fd770f833e7504539b12be39477f864ba144
    state: active
  - id: p00218
    type: paragraph
    text: 30 cottages — on 1,000 acres of land — contained here about 130-140 persons. The parish of <i>Bradenham</i> comprises 1,000 acres; it numbered, in 1851, 36 houses and a population of 84 males and 54 females. This inequality of the sexes was partly remedied in 1861, when they numbered 98 males and 87 females; increase in 10 years of 14 men and 33 women. Meanwhile, the number of houses was one less.
    hash: sha256:5fb406a7379a45a43c1187828997827a16233383c80d4ee1c98f6a25ae70bc02
    state: active
  - id: p00219
    type: paragraph
    text: <i>Winslow.</i> Great part of this newly built in good style; demand for houses appears very marked, since very miserable cots let at 1s. to 1s. 3d. per week.
    hash: sha256:535d86f19494575d47496011c69a49e152303c1aeee30297e48e371c8d262392
    state: active
  - id: p00220
    type: paragraph
    text: "<i>Water Eaton.</i> Here the landlords, in view of the increasing population, have destroyed about 20 per cent. of the existing houses. A poor labourer, who had to go about 4 miles to his work, answered the question, whether he could not find a cot nearer: “No; they know better than to take a man in with my large family.”"
    hash: sha256:d661575fade8180b6d259b43dd23d066d436c42109131139e0a0fab0cf229cf5
    state: active
  - id: p00221
    type: paragraph
    text: <i>Tinker’s End,</i> near Winslow. A bedroom in which were 4 adults and 4 children; 11 feet long, 9 feet broad, 6 feet 5 inches high at its highest part; another 11 feet 3 inches by 9 feet, 5 feet 10 inches high, sheltered 6 persons. Each of these families had less space than is considered necessary for a convict. No house had more than one bedroom, not one of them a back-door; water very scarce; weekly rent from 1s. 4d. to 2s. In 16 of the houses visited, only 1 man that earned 10s. a-week. The quantity of air for each person under the circumstances just described corresponds to that which he would have if he were shut up in a box of 4 feet measuring each way, the whole night. But then, the ancient dens afforded a certain amount of unintentional ventilation.
    hash: sha256:d512668d5f1a1b608965abc009c3bd61709a22bbba1779d6cdbecbb4ab1072c2
    state: active
  - id: p00222
    type: heading
    level: 5
    text: (4.) Cambridgeshire
    hash: sha256:5165cf4862d2a58fd9741969f9c61e715eebdd780a8af8a7f1fefd7b41bdaa87
    state: active
  - id: p00223
    type: paragraph
    text: <i>Gamblingay</i> belongs to several landlords. It contains the wretchedest cots to be found anywhere. Much straw-plaiting. “A deadly lassitude, a hopeless surrendering up to filth,” reigns in Gamblingay. The neglect in its centre, becomes mortification at its extremities, north and south, where the houses are rotting to pieces. The absentee landlords bleed this poor rookery too freely. The rents are very high; 8 or 9 persons packed in one sleeping apartment, in 2 cases 6 adults, each with 1 or 2 children in one small bedroom.
    hash: sha256:921024fd89d701f3d24c6e8569d198a20105e6d2b2385bbbee17f0e52682470e
    state: active
  - id: p00224
    type: heading
    level: 5
    text: (5.) Essex
    hash: sha256:02171fbe91811360370e91388a89447b26f492deace37fc6ec78d1035e5c7909
    state: active
  - id: p00225
    type: paragraph
    text: In this county, diminutions in the number of persons and of cottages go, in many parishes, hand in hand. In not less than 22 parishes, however, the destruction of houses has not prevented increase of population, or has not brought about that expulsion which, under the name “migration to towns,” generally occurs. In Fingringhoe, a parish of 3,443 acres, were in 1851, 145 houses; in 1861, only 110. But the people did not wish to go away, and managed even to increase under these circumstances. In 1851, 252 persons inhabited 61 houses, but in 1861, 262 persons were squeezed into 49 houses. In Basilden, in 1851, 157 persons lived on 1,827 acres, in 35 houses; at the end of ten years, 180 persons in 27 houses. In the parishes of Fingringhoe, South Fambridge, Widford, Basilden, and Ramsden Crags, in 1851, 1,392 persons were living on 8,449 acres in 316 houses; in 1861, on the same area, 1,473 persons in 249 houses.
    hash: sha256:ae2a50d89d9153dc417b566d317465a55cf27d29fd597b305cbe758252027fe5
    state: active
  - id: p00226
    type: heading
    level: 5
    text: (6.) Herefordshire
    hash: sha256:83580ea2b093dcd59c9b2b23dc10e19ba9519a2f06e97ae6cb4c61af11f3bd22
    state: active
  - id: p00227
    type: paragraph
    text: This little county has suffered more from the “eviction-spirit” than any other in England. At Nadby, overcrowded cottages generally, with only 2 bedrooms, belonging for the most part to the farmers. They easily let them for £3 or £4 a-year, and paid a weekly wage of 9s.
    hash: sha256:ee21538be6823cc621847f1cce39132f827980c10b0e0fff6cc495006e071bc3
    state: active
  - id: p00228
    type: heading
    level: 5
    text: (7.) Huntingdon
    hash: sha256:91a6b45afd1d6c367940fe5e81befdb3fd8d383385665f6e56c3a1a828bf6eae
    state: active
  - id: p00229
    type: paragraph
    text: "<i>Hartford</i> had, in 1851, 87 houses; shortly after this, 19 cottages were destroyed in this small parish of 1,720 acres; population in 1831, 452; in 1852, 382; and in 1861, 341. 14 cottages, each with 1 bedroom, were visited. In one, a married couple, 3 grown-up sons, 1 grown-up daughter, 4 children — in all 10 in another, 3 adults, 6 children. One of these rooms, in which 8 people slept, was 12 feet 10 inches long, 12 feet 2 inches broad, 6 feet 9 inches high: the average, without making any deduction for projections into the apartment, gave about 130 cubic feet per head. In the 14 sleeping rooms, 34 adults and 33 children. These cottages are seldom provided with gardens, but many of the inmates are able to farm small allotments at 10s. or 12s. per rood. These allotments are at a distance from the houses, which are without privies. The family “must either go to the allotment to deposit their ordures,” or, as happens in this place, saving your presence, “use a closet with a trough set like a drawer in a chest of drawers, and drawn out weekly and conveyed to the allotment to be emptied where its contents were wanted.” In Japan, the circle of life-conditions moves more decently than this."
    hash: sha256:5ada7a4b88d3be4bc36fb57212d80e4e24b883b97cfd1dbcb084e37095e1eb10
    state: active
  - id: p00230
    type: heading
    level: 5
    text: (8.) Lincolnshire
    hash: sha256:5154ab99bfbe9d722d7d49a28301c717592587e9c028b476a22f353acd9ef655
    state: active
  - id: p00231
    type: paragraph
    text: "<i>Langtoft.</i> A man lives here, in Wright’s house, with his wife, her mother, and 5 children; the house has a front kitchen, scullery, bedroom over the front kitchen; front kitchen and bedroom, 12 feet 2 inches by 9 feet 5 inches; the whole ground floor, 21 feet 2 inches by 9 feet 5 inches. The bedroom is a garret: the walls run together into the roof like a sugar-loaf, a dormer-window opening in front. “Why did he live here? On account of the garden? No; it is very small. Rent? High, 1s. 3d. per week. Near his work? No; 6 miles away, so that he walks daily, to and fro, 12 miles. He lived there, because it was a tenantable cot,” and because he wanted to have a cot for himself alone, anywhere, at any price, and in any conditions. The following are the statistics of 12 houses in Langtoft, with 12 bedrooms, 38 adults, and 36 children."
    hash: sha256:a1fed3aca8ba0e3096592a9542415b874aa9c8462596b7cdcd20f4c0028e18e4
    state: active
  - id: p00232
    type: table
    text: <tr><td colspan="13"><b>TWELVE HOUSES IN LANGTOFT</b></td></tr><tr><td><b>House</b></td><td><b>No. 1.</b></td><td><b>No. 2.</b></td><td><b>No. 3.</b></td><td><b>No. 4.</b></td><td><b>No. 5.</b></td><td><b>No. 6.</b></td><td><b>No. 7.</b></td><td><b>No. 8.</b></td><td><b>No. 9.</b></td><td><b>No. 10.</b></td><td><b>No. 11.</b></td><td><b>No. 12.</b></td></tr><tr><td><b>Bedrooms.</b></td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1</td></tr><tr><td><b>Adults.</b></td><td>3</td><td>4</td><td>4</td><td>5</td><td>2</td><td>5</td><td>3</td><td>3</td><td>2</td><td>2</td><td>3</td><td>2</td></tr><tr><td><b>Children.</b></td><td>5</td><td>3</td><td>4</td><td>4</td><td>2</td><td>3</td><td>3</td><td>2</td><td>0</td><td>3</td><td>3</td><td>4</td></tr><tr><td><b>Number of Persons.</b></td><td>8</td><td>7</td><td>8</td><td>9</td><td>4</td><td>8</td><td>6</td><td>5</td><td>2</td><td>.5</td><td>6</td><td>6</td></tr>
    hash: sha256:81854b856f86f65faf7f271f0418053e464cc828dacb7f2e2d517b60757ad004
    state: active
  - id: p00233
    type: heading
    level: 5
    text: (9.) Kent
    hash: sha256:afe9cff61dda0ed6ee4b30091d5b70dfd7c1dcfb802f44749e745bb8dea75f60
    state: active
  - id: p00234
    type: paragraph
    text: "<i>Kennington,</i> very seriously over-populated in 1859, when diphtheria appeared, and the parish doctor instituted a medical inquiry into the condition of the poorer classes. He found that in this locality, where much labour is employed, various cots had been destroyed and no new ones built. In one district stood four houses, named birdcages; each had 4 rooms of the following dimensions in feet and inches:"
    hash: sha256:85b949b5e21252c849851bf46d7b1964e090ec6b422511d36c684811d7ef4ecc
    state: active
  - id: p00235
    type: table
    text: <tr><td>Kitchen:</td><td>9 ft. 5 by 8 ft. 11 by 6 ft. 6</td></tr><tr><td>Scullery:</td><td>8 ft. 6 by 4 ft. 6 by 6 ft. 6</td></tr><tr><td>Bedroom:</td><td>8 ft. 5 by 5 ft. 10 by 6 ft. 3</td></tr><tr><td>Bedroom:</td><td>8 ft. 3 by 8 ft. 4 by 6 ft. 3</td></tr>
    hash: sha256:013da3e9a0dd2214f3641625f20ef803c28dbeeb585a10375ab280bfd95a75b9
    state: active
  - id: p00236
    type: heading
    level: 5
    text: (10.) Northamptonshire
    hash: sha256:ed32fa518e2d60abfb00d3924220da20d1955fdffffe8a26b637f56352ea6b74
    state: active
  - id: p00237
    type: paragraph
    text: <i>Brinworth, Pickford and Floore:</i> in these villages in the winter 20-30 men were lounging about the streets from want of work. The farmers do not always till sufficiently the corn and turnip lands, and the landlord has found it best to throw all his farms together into 2 or 3. Hence want of employment. Whilst on one side of the wall, the land calls for labour, on the other side the defrauded labourers are casting at it longing glances. Feverishly overworked in summer, and half-starved in winter, it is no wonder if they say in their peculiar dialect, “the parson and gentlefolk seem frit to death at them.”
    hash: sha256:7d60bcb16ddb751ee6bfa2c4df358a33d6a97720f2462523bc3b52e33135ec9b
    state: active
  - id: p00238
    type: paragraph
    text: At Floore, instances, in one bedroom of the smallest size, of couples with 4, 5, 6 children; 3 adults with 5 children; a couple with grandfather and 6 children down with scarlet fever, &amp;c.; in two houses with two bedrooms, two families of 8 and 9 adults respectively.
    hash: sha256:afe3efdf3dd4193570ee1d5e00b3a6fbecec294d8cca52bd303045f7d4194498
    state: active
  - id: p00239
    type: heading
    level: 5
    text: (11.) Wiltshire
    hash: sha256:1fb631933c1e04762bc0f990bcb2f1a08fff51d9eb6e859657f8f60885ec1e7f
    state: active
  - id: p00240
    type: paragraph
    text: "<i>Stratton.</i> 31 houses visited, 8 with only one bedroom. Pentill, in the same parish: a cot let at Is. 3d. weekly with 4 adults and 4 children, had nothing good about it, except the walls, from the floor of rough-hewn pieces of stones to the roof of worn-out thatch."
    hash: sha256:2d34b3293a49db8c088e0e909fdc687495ed44cb5d24f1164362c96879df7cb4
    state: active
  - id: p00241
    type: heading
    level: 5
    text: (12.) Worcestershire
    hash: sha256:88bdecd472b585b1e516f5191f33713b479bd296e1038e13ffb3f95091237ffb
    state: active
  - id: p00242
    type: paragraph
    text: House-destruction here not quite so excessive; yet from 1851 to 1861, the number of inhabitants to each house on the average, has risen from 4.2 to 4.6.
    hash: sha256:a7326b67518b3881e402de56dc2f41d7576b6bf2740faceeb547c396410733f1
    state: active
  - id: p00243
    type: paragraph
    text: "<i>Badsey.</i> Many cots and little gardens here. Some of the farmers declare that the cots are “a great nuisance here, because they bring the poor.” On the statement of one gentleman:"
    hash: sha256:c521d9c8043e4f5ae27e11c8b499c58d6b5e6154ba50859a4842a51c9d6629dc
    state: active
  - id: p00244
    type: blockquote
    text: “The poor are none the better for them; if you build 500 they will let fast enough, in fact, the more you build, the more they want”
    hash: sha256:e38b7bbcb7ce1c77029fdba42964e3152ea07791156c47b447c78b8661e02435
    state: active
  - id: p00245
    type: paragraph
    text: "(according to him the houses give birth to the inhabitants, who then by a law of Nature press on “the means of housing”). Dr. Hunter remarks:"
    hash: sha256:6c4f576086d05563227fe12008b72c17d23cd5a3d297db4c53c9efa5da01b809
    state: active
  - id: p00246
    type: blockquote
    text: “Now these poor must come from somewhere, and as there is no particular attraction, such as doles, at Badsey, it must be repulsion from some other unfit place, which will send them here. If each could find an allotment near his work, he would not prefer Badsey, where he pays for his scrap of ground twice as much as the farmer pays for his.”
    hash: sha256:46b3b1b74598764d61782ce2563268f99833865af30f7cff85a343401f59e357
    state: active
  - id: p00247
    type: paragraph
    text: The continual emigration to the towns, the continual formation of surplus population in the country through the concentration of farms, conversion of arable land into pasture, machinery, &amp;c., and the continual eviction of the agricultural population by the destruction of their cottages, go hand in hand. The more empty the district is of men, the greater is its “relative surplus population,” the greater is their pressure on the means of employment, the greater is the absolute excess of the agricultural population over the means for housing it, the greater, therefore, in the villages is the local surplus population and the most pestilential packing together of human beings. The packing together of knots of men in scattered little villages and small country towns corresponds to the forcible draining of men from the surface of the land. The continuous superseding of the agricultural labourers, in spite of their diminishing number and the increasing mass of their products, gives birth to their pauperism. Their pauperism is ultimately a motive to their eviction and the chief source of their miserable housing which breaks down their last power of resistance, and makes them more slaves of the landed proprietors and the farmers. <fn ref="107"/> Thus the minimum of wages becomes a law of Nature to them. On the other hand, the land, in spite of its constant “relative surplus population,” is at the same time underpopulated. This is seen, not only locally at the points where the efflux of men to towns, mines, railroad-making, &amp;c., is most marked. It is to be seen everywhere, in harvest-time as well as in spring and summer, at those frequently recurring times when English agriculture, so careful and intensive, wants extra hands. There are always too many agricultural labourers for the ordinary, and always too few for the exceptional or temporary needs of the cultivation of the soil. <fn ref="108"/> Hence we find in the official documents contradictory complaints from the same places of deficiency and excess of labour simultaneously. The temporary or local want of labour brings about no rise in wages, but a forcing of the women and children into the fields, and exploitation at an age constantly lowered. As soon as the exploitation of the women and children takes place on a larger scale, it becomes in turn a new means of making a surplus population of the male agricultural labourer and of keeping down his wage. In the east of England thrives a beautiful fruit of this vicious circle — the so-called gang-system, to which I must briefly return here. <fn ref="109"/>
    hash: sha256:99099be7688724b9a1cd2c5a74d7dddac7313a44d41bb8496a3aec00e77f3ca8
    state: active
  - id: p00248
    type: paragraph
    text: "The gang-system obtains almost exclusively in the counties of Lincoln, Huntingdon, Cambridge, Norfolk, Suffolk, and Nottingham, here and there in the neighbouring counties of Northampton, Bedford, and Rutland. Lincolnshire will serve us as an example. A large part of this county is new land, marsh formerly, or even, as in others of the eastern counties just named, won lately from the sea. The steam-engine has worked wonders in the way of drainage. What were once fens and sandbanks, bear now a luxuriant sea of corn and the highest of rents. The same thing holds of the alluvial lands won by human endeavour, as in the island of Axholme and other parishes on the banks of the Trent. In proportion as the new farms arose, not only were no new cottages built: old ones were demolished, and the supply of labour had to come from open villages, miles away, by long roads that wound along the sides of the hills. There alone had the population formerly found shelter from the incessant floods of the winter-time. The labourers that dwell on the farms of 400-1,000 acres (they are called “confined labourers”) are solely employed on such kinds of agricultural work as is permanent, difficult, and carried on by aid of horses. For every 100 acres there is, on an average, scarcely one cottage. A fen farmer, e.g., gave evidence before the Commission of Inquiry:"
    hash: sha256:2f8107af381cc8591774755cc3b07a72044a651b8eec6c45ad847b34d695598c
    state: active
  - id: p00249
    type: blockquote
    text: “I farm 320 acres, all arable land. I have not one cottage on my farm. I have only one labourer on my farm now. I have four horsemen lodging about. We get light work done by gangs.” <fn ref="110"/>
    hash: sha256:2fb5d9d0c13a3fb9b03b102be14791ff658cfd05f708e7d2ca059a3a48d81e4b
    state: active
  - id: p00250
    type: paragraph
    text: The soil requires much light field labour, such as weeding, hoeing, certain processes of manuring, removing of stones, &amp;c. This is done by the gangs, or organised bands that dwell in the open villages.
    hash: sha256:0d7ed883fc900a75907a2cfa1306a25cd68c7ea6c5d092485ba37c1480e78733
    state: active
  - id: p00251
    type: paragraph
    text: The gang consists of 10 to 40 or 50 persons, women, young persons of both sexes (13-18 years of age, although the boys are for the most part eliminated at the age of 13), and children of both sexes (6-13 years of age). At the head is the gang-master, always an ordinary agricultural labourer, generally what is called a bad lot, a scapegrace, unsteady, drunken, but with a dash of enterprise and <i>savoir-faire</i>. He is the recruiting-sergeant for the gang, which works under him, not under the farmer. He generally arranges with the latter for piece-work, and his income, which on the average is not very much above that of an ordinary agricultural labourer, <fn ref="111"/> depends almost entirely upon the dexterity with which he manages to extract within the shortest time the greatest possible amount of labour from his gang. The farmers have discovered that women work steadily only under the direction of men, but that women and children, once set going, impetuously spend their life-force — as Fourier knew — while the adult male labourer is shrewd enough to economise his as much as he can. The gang-master goes from one farm to another, and thus employs his gang from 6 to 8 months in the year. Employment by him is, therefore, much more lucrative and more certain for the labouring families, than employment by the individual farmer, who only employs children occasionally. This circumstance so completely rivets his influence in the open villages that children are generally only to be hired through his instrumentality. The lending out of these individually, independently of the gang, is his second trade.
    hash: sha256:6cd3f24a1ac8f4f614a7f73e4772b21c50eebe8b2e9502d2b98312cc7fd7964b
    state: active
  - id: p00252
    type: paragraph
    text: The “drawbacks” of the system are the overwork of the children and young persons, the enormous marches that they make daily to and from the farms, 5, 6, and sometimes 7 miles distant, finally, the demoralisation of the gang. Although the gang-master, who, in some districts is called “the driver,” is armed with a long stick, he uses it but seldom, and complaints of brutal treatment are exceptional. He is a democratic emperor, or a kind of Pied Piper of Hamelin. He must therefore be popular with his subjects, and he binds them to himself by the charms of the gipsy life under his direction. Coarse freedom, a noisy jollity, and obscenest impudence give attractions to the gang. Generally the gangmaster pays up in a public house; then he returns home at the head of the procession reeling drunk, propped up right and left by a stalwart virago, while children and young persons bring up the rear, boisterous, and singing chaffing and bawdy songs. On the return journey what Fourier calls “phanerogamie,” is the order of the day. The getting with child of girls of 13 and 14 by their male companions of the same age, is common. The open villages which supply the contingent of the gang, become Sodoms and Gomorrahs, <fn ref="112"/> and have twice as high a rate of illegitimate births as the rest of the kingdom. The moral character of girls bred in these schools, when married women, was shown above. Their children, when opium does not give them the finishing stroke, are born recruits of the gang.
    hash: sha256:e0e3ba3dedc1d840fceff3919f8b2ba9d54c13386f3a02c1dde3109e2eaf63d8
    state: active
  - id: p00253
    type: paragraph
    text: The gang in its classical form just described, is called the public, common, or tramping gang. For there are also private gangs. These are made up in the same way as the common gang, but count fewer members, and work, not under a gang-master, but under some old farm servant, whom the farmer does not know how to employ in any better way. The gipsy fun has vanished here, but according to all witnesses, the payment and treatment of the children is worse.
    hash: sha256:b8814c9ab9c834ba55014205bf4120ccad9ddf28146a2410525a0be44e0800e0
    state: active
  - id: p00254
    type: paragraph
    text: The gang-system, which during the last years has steadily increased, <fn ref="113"/> clearly does not exist for the sake of the gang-master. It exists for the enrichment of the large farmers, <fn ref="114"/> and indirectly of the landlords. <fn ref="115"/> For the farmer there is no more ingenious method of keeping his labourers well below the normal level, and yet of always having an extra hand ready for extra work, of extracting the greatest possible amount of labour with the least possible amount of money <fn ref="116"/> and of making adult male labour “redundant.” From the exposition already made, it will be understood why, on the one hand, a greater or less lack of employment for the agricultural labourer is admitted, while on the other, the gang-system is at the same time declared “necessary” on account of the want of adult male labour and its migration to the towns. <fn ref="117"/> The cleanly weeded land, and the uncleanly human weeds, of Lincolnshire, are pole and counterpole of capitalistic production. <fn ref="118"/>
    hash: sha256:a9fa4951eac6960861d033a1ead62a94856a90a2e6f304ba3d55147fe216c0ec
    state: active
  - id: p00255
    type: heading
    level: 5
    text: F. Ireland
    hash: sha256:2a4529f6af29c05aa49df0939832d1ccc8e45255c8026b83e198a69009e2b00d
    state: active
  - id: p00256
    type: paragraph
    text: In concluding this section, we must travel for a moment to Ireland. First, the main facts of the case.
    hash: sha256:9295a31f3c989e3c34aa3c2286eddd08173802e15aaf6445cc65f732adef22da
    state: active
  - id: p00257
    type: paragraph
    text: 'The population of Ireland had, in 1841, reached 8,222,664; in 1851, it had dwindled to 6,623,985; in 1861, to 5,850,309; in 1866, to 5½ millions, nearly to its level in 1801. The diminution began with the famine year, 1846, so that Ireland, in less than twenty years, lost more than 5/16 ths of its people. <fn ref="119"/> Its total emigration from May, 1851, to July, 1865, numbered 1,591,487: the emigration during the years 1861-1865 was more than half-a-million. The number of inhabited houses fell, from 1851-1861, by 52,990. From 1851-1861, the number of holdings of 15 to 30 acres increased 61,000, that of holdings over 30 acres, 109,000, whilst the total number of all farms fell 120,000, a fall, therefore, solely due to the suppression of farms under 15 acres — <i>i.e</i>., to their centralisation.'
    hash: sha256:2449d33641fa91f08ad9285d9c47ad87bb6a805eaaed3a868f1ea52fdf094771
    state: active
