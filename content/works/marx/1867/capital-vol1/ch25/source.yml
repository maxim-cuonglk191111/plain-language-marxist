  - id: p00260
    type: paragraph
    text: "The decrease of the population was naturally accompanied by a decrease in the mass of products. For our purpose, it suffices to consider the 5 years from 1861-1865 during which over half-a-million emigrated, and the absolute number of people sank by more than 1/3 of a million. From the above table it results: —"
    hash: sha256:be55e7cab97cf7494baa9bfdf888afe310e6522af5e7df67da391a78a2c34871
    state: active
