  - id: p00322
    type: footnote
    label: "14"
    text: "The census of England and Wales shows: all persons employed in agriculture (landlords, farmers, gardeners, shepherds, &amp;c., included): 1851, 2,011,447; 1861, 1,924,110. Fall, 87,337. Worsted manufacture: 1851, 102,714 persons; 1861, 79,242. Silk weaving: 1851, 111,940; 1861, 101,678. Calico-printing: 1851, 12,098; 1861, 12,556. A small rise that, in the face of the enormous extension of this industry and implying a great fall proportionally in the number of labourers employed. Hat-making: 1851, 15,957; 1861, 13,814. Straw-hat and bonnet-making: 1851, 20,393; 1861, 18,176. Malting: 1851, 10,566; 1861, 10,677. Chandlery, 1851, 4,949; 1861, 4,686. This fall is due, besides other causes, to the increase in lighting by gas. Comb-making: 1851, 2,038; 1861, 1,478. Sawyers: 1851, 30,552; 1861, 31,647 — a small rise in consequence of the increase of sawing-machines. Nail-making: 1851, 26,940; 1861, 26,130 — fall in consequence of the competition of machinery. Tin and copper-mining: 1851, 31,360; 1861, 32,041. On the other hand: Cotton-spinning and weaving: 1851, 371,777; 1861, 456,646. Coal-mining: 1851, 183,389, 1861, 246,613, “The increase of labourers is generally greatest, since 1851, in such branches of industry in which machinery has not up to the present been employed with success.” (Census of England and Wales for 1861. Vol. III. London, 1863, p. 36.)"
    hash: sha256:d5d443cf0a08351e914c5d1cee229991365cd26697943a1aa8edfff06943aa4b
    state: active
  - id: p00323
    type: footnote
    label: "15"
    text: <i>Added in the 4th German edition.</i> — The law of progressive diminution of the relative magnitude of variable capital and its effect on the condition of the class of wage workers is conjectured rather than understood by some of the prominent economists of the classical school. The greatest service was rendered here by John Barton, although he, like all the rest, lumps together constant and fixed capital, variable and circulating capital. He says:<br/><br/>“The demand for labour depends on the increase of circulating, and not of fixed capital. Were it true that the proportion between these two sorts of capital is the same at all times, and in all circumstances, then, indeed, it follows that the number of labourers employed is in proportion to the wealth of the state. But such a proposition has not the semblance of probability. As arts are cultivated, and civilisation is extended, fixed capital bears a larger and larger proportion to circulating capital. The amount of fixed capital employed in the production of a piece of British muslin is at least a hundred, probably a thousand times greater than that employed in a similar piece of Indian muslin. And the proportion of circulating capital is a hundred or thousand times less ... the whole of the annual savings, added to the fixed capital, would have no effect in increasing the demand for labour.” (John Barton, “Observations on the Circumstances which Influence the Condition of the Labouring Classes of Society.” London, 1817, pp. 16, 17.) “The same cause which may increase the net revenue of the country may at the same time render the population redundant, and deteriorate the condition of the labourer.” (Ricardo, l. c., p. 469.) With increase of capital, “the demand [for labour] will be in a diminishing ratio.” (Ibid., p. 480, Note.) “The amount of capital devoted to the maintenance of labour may vary, independently of any changes in the whole amount of capital.... Great fluctuations in the amount of employment, and great suffering may become more frequent as capital itself becomes more plentiful.” (Richard Jones, “An Introductory Lecture on Pol. Econ.,” Lond. 1833, p. 13) “Demand [for labour] will rise ... not in proportion to the accumulation of the general capital. ... Every augmentation, therefore, in the national stock destined for reproduction, comes, in the progress of society, to have less and less influence upon the condition of the labourer.” (Ramsay, l. c., pp. 90, 91.)
    hash: sha256:aad6a12d6ac21e5287d9afec329040d5e569d75eeded3cc58434c63fa2be9bec
    state: active
  - id: p00324
    type: footnote
    label: "16"
    text: H. Merivale. “Lectures on Colonisation and Colonies,” 1841, Vol. I , p. 146.
    hash: sha256:e333223f27c25fb617e4f00d17d644c14bec75c00f9d1c8eaeb6a5984d1aa69f
