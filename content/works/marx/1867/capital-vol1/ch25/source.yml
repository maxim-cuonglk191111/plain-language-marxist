  - id: p00271
    type: paragraph
    text: "Under Schedule D., the average annual increase of income from 1853-1864 was only 0.93; whilst, in the same period, in Great Britain, it was 4.58. The following table shows the distribution of the profits (with the exception of those of farmers) for the years 1864 and 1865: —"
    hash: sha256:d19e678adf3ee34933c243634a182b77e8845b4cfaaf516bbaf3578d49078fda
    state: active
  - id: p00272
    type: caption
    text: <i>Table E</i> <fn ref="122"/>
    hash: sha256:fa48637334cf1093b9257307e238c1bbe9d387795273a7f7c913c268c5f83e3c
    state: active
  - id: p00273
    type: table
    text: <tr><td colspan="3"><b>SCHEDULE D.</b><br/>INCOME FROM PROFITS (OVER £6O) IN IRELAND</td></tr><tr><td></td><td><b>1864<br/>£</b></td><td><b>1865<br/>£</b></td></tr><tr><td>Total yearly<br/>income of</td><td>4,368,610 divided<br/>among 17,467 persons.</td><td>4,669,979 divided<br/>among 18,081 persons.</td></tr><tr><td>Yearly income<br/>over £60<br/>and under £100</td><td>238,726 divided<br/>among 5,015 persons.</td><td>222,575 divided<br/>among 4,703 persons.</td></tr><tr><td>Of the yearly<br/>total income</td><td>1,979,066 divided<br/>among 11,321 persons.</td><td>2,028,571 divided<br/>among 12,184 persons.</td></tr><tr><td>Remainder of the<br/>total yearly income</td><td>2,150,818 divided<br/>among 1,131 persons.</td><td>2,418,833 divided<br/>among 1,194 persons.</td></tr><tr><td rowspan="6">Of these</td><td></td><td></td></tr><tr><td>1,073,906 divided<br/>among 1,010 persons.</td><td>1,097,927 divided<br/>among 1,044 persons.</td></tr><tr><td>1,076,912 divided<br/>among 121 persons.</td><td>1,320,906 divided<br/>among 150 persons.</td></tr><tr><td>430,535 divided<br/>among 95 persons.</td><td>584,458 divided<br/>among 2 persons.</td></tr><tr><td>646,377 divided<br/>among 26</td><td>736,448 divided<br/>among 28</td></tr><tr><td>262,819 divided<br/>among 3</td><td>274,528 divided<br/>among 3</td></tr>
    hash: sha256:9da736f3e326cdb3cd749ec064bf5a18cdef5e26376481156a16083502699b80
    state: active
  - id: p00274
    type: paragraph
    text: England, a country with fully developed capitalist production, and pre-eminently industrial, would have bled to death with such a drain of population as Ireland has suffered. But Ireland is at present only an agricultural district of England, marked off by a wide channel from the country to which it yields corn, wool, cattle, industrial and military recruits.
    hash: sha256:8e1454bc8a6120e401b170520da3a22f7941e555d29503a91d4ac3790c1c6791
    state: active
  - id: p00275
    type: paragraph
    text: The depopulation of Ireland has thrown much of the land out of cultivation, has greatly diminished the produce of the soil, <fn ref="123"/> and, in spite of the greater area devoted to cattle breeding, has brought about, in some of its branches, an absolute diminution, in others, an advance scarcely worthy of mention, and constantly interrupted by retrogressions. Nevertheless, with the fall in numbers of the population, rents and farmers’ profits rose, although the latter not as steadily as the former. The reason of this is easily comprehensible. On the one hand, with the throwing of small holdings into large ones, and the change of arable into pasture land, a larger part of the whole produce was transformed into surplus-produce. The surplus-produce increased, although the total produce, of which it formed a fraction, decreased. On the other hand, the money value of this surplus-produce increased yet more rapidly than its mass, in consequence of the rise in the English market price of meat, wool, &amp;c., during the last 20, and especially during the last 10, years.
    hash: sha256:c3bea75b2d7f7269d9ed5d40aaf818e8587f9c41585632205c75c025541391ca
    state: active
  - id: p00276
    type: paragraph
    text: The scattered means of production that serve the producers themselves as means of employment and of subsistence, without expanding their own value by the incorporation of the labour of others, are no more capital than a product consumed by its own producer is a commodity. If, with the mass of the population, that of the means of production employed in agriculture also diminished, the mass of the capital employed in agriculture increased, because a part of the means of production that were formerly scattered, was concentrated and turned into capital.
    hash: sha256:d067bffcbc0119fa8b82d5cf517fd82ae5fe4559244fbcdcda874b6cfa522ced
    state: active
  - id: p00277
    type: paragraph
    text: The total capital of Ireland outside agriculture, employed in industry and trade, accumulated during the last two decades slowly, and with great and constantly recurring fluctuations; so much the more rapidly did the concentration of its individual constituents develop. And, however small its absolute increase, in proportion to the dwindling population it had increased largely.
    hash: sha256:f33745ed92160556a116ca41d5dc2d971d0411659fc76ffe0d96176787c6543c
    state: active
  - id: p00278
    type: paragraph
    text: 'Here, then, under our own eyes and on a large scale, a process is revealed, than which nothing more excellent could be wished for by orthodox economy for the support of its dogma: that misery springs from absolute surplus population, and that equilibrium is re-established by depopulation. This is a far more important experiment than was the plague in the middle of the 14th century so belauded of Malthusians. Note further: If only the naïveté of the schoolmaster could apply, to the conditions of production and population of the nineteenth century, the standard of the 14th, this naïveté, into the bargain, overlooked the fact that whilst, after the plague and the decimation that accompanied it, followed on this side of the Channel, in England, enfranchisement and enrichment of the agricultural population, on that side, in France, followed greater servitude and more misery. <fn ref="124"/>'
    hash: sha256:25763cea98b19581bf07e168f9819728b8fd3e9e7d4fc48cfe908fd036c3b6b5
    state: active
  - id: p00279
    type: paragraph
    text: The Irish famine of 1846 killed more than 1,000,000 people, but it killed poor devils only. To the wealth of the country it did not the slightest damage. The exodus of the next 20 years, an exodus still constantly increasing, did not, as, <i>e.g.,</i> the Thirty Years’ War, decimate, along with the human beings, their means of production. Irish genius discovered an altogether new way of spiriting a poor people thousands of miles away from the scene of its misery. The exiles transplanted to the United States, send home sums of money every year as travelling expenses for those left behind. Every troop that emigrates one year, draws another after it the next. Thus, instead of costing Ireland anything, emigration forms one of the most lucrative branches of its export trade. Finally, it is a systematic process, which does not simply make a passing gap in the population, but sucks out of it every year more people than are replaced by the births, so that the absolute level of the population falls year by year. <fn ref="125"/>
    hash: sha256:6d8e738ca472c7a6acb17d72f703ac87ed66edf978a9386d03b0872c77c6cc83
    state: active
  - id: p00280
    type: paragraph
    text: What were the consequences for the Irish labourers left behind and freed from the surplus population? That the relative surplus population is today as great as before 1846; that wages are just as low, that the oppression of the labourers has increased, that misery is forcing the country towards a new crisis. The facts are simple. The revolution in agriculture has kept pace with emigration. The production of relative surplus population has more than kept pace with the absolute depopulation. A glance at table C. shows that the change of arable to pasture land must work yet more acutely in Ireland than in England. In England the cultivation of green crops increases with the breeding of cattle; in Ireland, it decreases. Whilst a large number of acres, that were formerly tilled, lie idle or are turned permanently into grass-land, a great part of the waste land and peat bogs that were unused formerly, become of service for the extension of cattle-breeding. The smaller and medium farmers — I reckon among these all who do not cultivate more than 100 acres — still make up about 8/10ths of the whole number. <fn ref="126"/> They are one after the other, and with a degree of force unknown before, crushed by the competition of an agriculture managed by capital, and therefore they continually furnish new recruits to the class of wage labourers. The one great industry of Ireland, linen-manufacture, requires relatively few adult men and only employs altogether, in spite of its expansion since the price of cotton rose in 1861-1866, a comparatively insignificant part of the population. Like all other great modern industries, it constantly produces, by incessant fluctuations, a relative surplus population within its own sphere, even with an absolute increase in the mass of human beings absorbed by it. The misery of the agricultural population forms the pedestal for gigantic shirt-factories, whose armies of labourers are, for the most part, scattered over the country. Here, we encounter again the system described above of domestic industry, which in underpayment and overwork, possesses its own systematic means for creating supernumerary labourers. Finally, although the depopulation has not such destructive consequences as would result in a country with fully developed capitalistic production, it does not go on without constant reaction upon the home-market. The gap which emigration causes here, limits not only the local demand for labour, but also the incomes of small shopkeepers, artisans, tradespeople generally. Hence the diminution in incomes between £60 and £100 in Table E.
    hash: sha256:5be30edbe85e7135af211076a6e4da31c153299e6f0535eff32420a7c1c574ec
    state: active
  - id: p00281
    type: paragraph
    text: A clear statement of the condition of the agricultural labourers in Ireland is to be found in the Reports of the Irish Poor Law Inspectors (1870). <fn ref="127"/> Officials of a government which is maintained only by bayonets and by a state of siege, now open, now disguised, they have to observe all the precautions of language that their colleagues in England disdain. In spite of this, however, they do not let their government cradle itself in illusions. According to them the rate of wages in the country, still very low, has within the last 20 years risen 50-60 per cent., and stands now, on the average, at 6s. to 9s. per week. But behind this apparent rise, is hidden an actual fall in wages, for it does not correspond at all to the rise in price of the necessary means of subsistence that has taken place in the meantime. For proof, the following extract from the official accounts of an Irish workhouse.
    hash: sha256:8687e5963f4c0150e6e8bf3cd93949e9c424e9105e5f70618eb709d549353b08
    state: active
  - id: p00282
    type: table
    text: <tr><td colspan="4"><b>AVERAGE WEEKLY COST PER HEAD</b></td></tr><tr><td><b>Year ended</b></td><td><b>Provisions and<br/>Necessaries.</b></td><td><b>Clothing.</b></td><td><b>TOTAL.</b></td></tr><tr><td>29th Sept., 1849.</td><td>1s. 3 1/4d.</td><td>3d.</td><td>1s. 6 1/4d.</td></tr><tr><td>29th Sept., 1869.</td><td>2s. 7 1/4d.</td><td>6d.</td><td>3s. 1 1/4d.</td></tr>
    hash: sha256:8d847188287f2d1b29270e49ce77af7b3e35fdc4d413728302435c9853f091a3
    state: active
  - id: p00283
    type: paragraph
    text: The price of the necessary means of subsistence is therefore fully twice, and that of clothing exactly twice, as much as they were 20 years before.
    hash: sha256:808f6576c7ae86ea99db0332f6491aafcfccc70f877d7f980606c90635e86c16
    state: active
  - id: p00284
    type: paragraph
    text: Even apart from this disproportion, the mere comparison of the rate of wages expressed in gold would give a result far from accurate. Before the famine, the great mass of agricultural wages were paid in kind, only the smallest part in money; today, payment in money is the rule. From this it follows that, whatever the amount of the real wage, its money rate must rise.
    hash: sha256:9e4be14d8dfb017d264d77995b95fdc41f7e1ed3efcf273703bc53114bed6df7
    state: active
  - id: p00285
    type: blockquote
    text: “Previous to the famine, the labourer enjoyed his cabin ... with a rood, or half-acre or acre of land, and facilities for ... a crop of potatoes. He was able to rear his pig and keep fowl.... But they now have to buy bread, and they have no refuse upon which they can feed a pig or fowl, and they have consequently no benefit from the sale of a pig, fowl, or eggs.” <fn ref="128"/>
    hash: sha256:37a2d56bb31c73f8c53c1e989428ee7955daf548db4368988516978c5849a617
    state: active
  - id: p00286
    type: paragraph
    text: In fact, formerly, the agricultural labourers were but the smallest of the small farmers, and formed for the most part a kind of rear-guard of the medium and large farms on which they found employment. Only since the catastrophe of 1846 have they begun to form a fraction of the class of purely wage labourers, a special class, connected with its wage-masters only by monetary relations.
    hash: sha256:f54e696c2a8248497ae67db6a0c3a88785199fafa3127c0d5efa3ffcda464441
    state: active
  - id: p00287
    type: paragraph
    text: We know what were the conditions of their dwellings in 1846. Since then they have grown yet worse. A part of the agricultural labourers, which, however, grows less day by day, dwells still on the holdings of the farmers in over-crowded huts, whose hideousness far surpasses the worst that the English agricultural labourers offered us in this way. And this holds generally with the exception of certain tracts of Ulster; in the south, in the counties of Cork, Limerick, Kilkenny, &amp;c.; in the east, in Wicklow, Wexford, &amp;c.; in the centre of Ireland, in King’s and Queen’s County, Dublin, &amp;c.; in the west, in Sligo, Roscommon, Mayo, Galway, &amp;c.
    hash: sha256:9d3a0a70076c47dec71b5be6bec5326e811454d5c619df3f07c507ea1c3b65a6
    state: active
  - id: p00288
    type: blockquote
    text: “The agricultural labourers’ huts,” an inspector cries out, “are a disgrace to the Christianity and to the civilisation of this country.” <fn ref="129"/>
    hash: sha256:b0a99127b1e64b4231262b5f2b1827bc7ffa5846861a3927680f7fd8a7763ec2
    state: active
  - id: p00289
    type: paragraph
    text: In order to increase the attractions of these holes for the labourers, the pieces of land belonging thereto from time immemorial, are systematically confiscated.
    hash: sha256:107915e83a324ade2b363d00e6552ff1a217e4419b2fe44f12b445f7f974c21f
    state: active
  - id: p00290
    type: blockquote
    text: “The mere sense that they exist subject to this species of ban, on the part of the landlords and their agents, has ... given birth in the minds of the labourers to corresponding sentiments of antagonism and dissatisfaction towards those by whom they are thus led to regard themselves as being treated as ... a proscribed race.” <fn ref="130"/>
    hash: sha256:822e5e4190da90af364710e7d0ed25d538a902caa2866fb791d5c3a16a6e8f34
    state: active
  - id: p00291
    type: paragraph
    text: The first act of the agricultural revolution was to sweep away the huts situated on the field of labour. This was done on the largest scale, and as if in obedience to a command from on high. Thus many labourers were compelled to seek shelter in villages and towns. There they were thrown like refuse into garrets, holes, cellars and corners, in the worst back slums. Thousands of Irish families, who according to the testimony of the English, eaten up as these are with national prejudice, are notable for their rare attachment to the domestic hearth, for their gaiety and the purity of their home-life, found themselves suddenly transplanted into hotbeds of vice. The men are now obliged to seek work of the neighbouring farmers and are only hired by the day, and therefore under the most precarious form of wage. Hence
    hash: sha256:3560c6d4b0024c6a6ea4a646a2d215a7ca41fc3aa5954e32dc59539814a5abb7
    state: active
  - id: p00292
    type: blockquote
    text: “they sometimes have long distances to go to and from work, often get wet, and suffer much hardship, not unfrequently ending in sickness, disease and want.” <fn ref="131"/>
    hash: sha256:ba45442723500482f15ddc03945e77f68da2dfa1deb9a3b93b2ea36399448d9a
    state: active
  - id: p00293
    type: blockquote
    text: “ The towns have had to receive from year to year what was deemed to be the surplus-labour of the rural division;” <fn ref="132"/> and then people still wonder “there is still a surplus of labour in the towns and villages, and either a scarcity or a threatened scarcity in some of the country divisions.” <fn ref="133"/> The truth is that this want only becomes perceptible “in harvest-time, or during spring, or at such times as agricultural operations are carried on with activity; at other periods of the year many hands are idle;” <fn ref="134"/> that “from the digging out of the main crop of potatoes in October until the early spring following ... there is no employment for them;” <fn ref="135"/> and further, that during the active times they “are subject to broken days and to all kinds of interruptions.” <fn ref="136"/>
    hash: sha256:78a981d0ecb4a13dda0110d2fdbcec96bece03ef13b71007c2cf9cfa5239cdad
    state: active
  - id: p00294
    type: paragraph
    text: These results of the agricultural revolution — <i>i.e.,</i> the change of arable into pasture land, the use of machinery, the most rigorous economy of labour, &amp;c., are still further aggravated by the model landlords, who, instead of spending their rents in other countries, condescend to live in Ireland on their demesnes. In order that the law of supply and demand may not be broken, these gentlemen draw their
    hash: sha256:ff25c888a90dc5e25d1629249356e0eeb5e510e9f400c587a700eb6205a97245
    state: active
  - id: p00295
    type: blockquote
    text: “labour-supply ... chiefly from their small tenants, who are obliged to attend when required to do the landlord’s work, at rates of wages, in many instances, considerably under the current rates paid to ordinary labourers, and without regard to the inconvenience or loss to the tenant of being obliged to neglect his own business at critical periods of sowing or reaping.” <fn ref="137"/>
    hash: sha256:a9e95cedd8f10aea2145e454e55c2533cae3ae9a5c5a41455447f36fc9efc954
    state: active
  - id: p00296
    type: paragraph
    text: The uncertainty and irregularity of employment, the constant return and long duration of gluts of labour, all these symptoms of a relative surplus population, figure therefore in the reports of the Poor Law administration, as so many hardships of the agricultural proletariat. It will be remembered that we met, in the English agricultural proletariat, with a similar spectacle. But the difference is that in England, an industrial country, the industrial reserve recruits itself from the country districts, whilst in Ireland, an agricultural country, the agricultural reserve recruits itself from the towns, the cities of refuge of the expelled agricultural labourers. In the former, the supernumeraries of agriculture are transformed into factory operatives; in the latter, those forced into the towns, whilst at the same time they press on the wages in towns, remain agricultural labourers, and are constantly sent back to the country districts in search of work.
    hash: sha256:c68e727f8f072d28b89e2b5ee15e24bb00d3fcfc8b41310eb422c316fc14daf0
    state: active
  - id: p00297
    type: paragraph
    text: "The official inspectors sum up the material condition of the agricultural labourer as follows:"
    hash: sha256:13557f62e98c950ac1eef30af5bc3f4848be5bd28f943cb36935e8a8588711d8
    state: active
  - id: p00298
    type: blockquote
    text: “Though living with the strictest frugality, his own wages are barely sufficient to provide food for an ordinary family and pay his rent” and he depends upon other sources for the means of clothing himself, his wife, and children.... The atmosphere of these cabins, combined with the other privations they are subjected to, has made this class particularly susceptible to low fever and pulmonary consumption.” <fn ref="138"/>
    hash: sha256:cf850efcbea879725368140d8b9392126e56e7cf0018f611b2ced644f0acc72f
    state: active
  - id: p00299
    type: paragraph
    text: After this, it is no wonder that, according to the unanimous testimony of the inspectors, a sombre discontent runs through the ranks of this class, that they long for the return of the past, loathe the present, despair of the future, give themselves up “to the evil influence of agitators,” and have only one fixed idea, to emigrate to America. This is the land of Cockaigne, into which the great Malthusian panacea, depopulation, has transformed green Erin.
    hash: sha256:433b61a8f02772ed41064b8ba8bdc2945cf54ba8c15d431cb2f50864eb0866ee
    state: active
  - id: p00300
    type: paragraph
    text: "What a happy life the Irish factory operative leads one example will show:"
    hash: sha256:f469730726d281ae8cf24249cc675de057ad700a4efdc991940dfeafee48f37f
    state: active
  - id: p00301
    type: blockquote
    text: “On my recent visit to the North of Ireland,” says the English Factory Inspector, Robert Baker, “I met with the following evidence of effort in an Irish skilled workman to afford education to his children; and I give his evidence verbatim, as I took it from his mouth. That he was a skilled factory hand, may be understood when I say that he was employed on goods for the Manchester market. ‘Johnson. — I am a beetler and work from 6 in the morning till 11 at night, from Monday to Friday. Saturday we leave off at 6 p. m., and get three hours of it (for meals and rest). I have five children in all. For this work I get 10s. 6d. a week; my wife works here also, and gets 5s. a week. The oldest girl who is 12, minds the house. She is also cook, and all the servant we have. She gets the young ones ready for school. A girl going past the house wakes me at half past five in the morning. My wife gets up and goes along with me. We get nothing (to eat) before we come to work. The child of 12 takes care of the little children all the day, and we get nothing till breakfast at eight. At eight we go home. We get tea once a week; at other times we get stirabout, sometimes of oat-meal, sometimes of Indian meal, as we are able to get it. In the winter we get a little sugar and water to our Indian meal. In the summer we get a few potatoes, planting a small patch ourselves; and when they are done we get back to stirabout. Sometimes we get a little milk as it may be. So we go on from day to day, Sunday and week day, always the same the year round. I am always very much tired when I have done at night. We may see a bit of flesh meat sometimes, but very seldom. Three of our children attend school, for whom we pay 1d. a week a head. Our rent is 9d. a week. Peat for firing costs 1s. 6d. a fortnight at the very lowest.’” <fn ref="139"/>
    hash: sha256:3d7e64c1be6115db329513fe03803100ebc92dbe369a2d924c1d67663c5d92e2
    state: active
  - id: p00302
    type: paragraph
    text: Such are Irish wages, such is Irish life!
    hash: sha256:426af468e4b31bd63edd3fdb5db09071d3de5a0789c0363745a4f2870d3e7bb3
    state: active
  - id: p00303
    type: paragraph
    text: In fact the misery of Ireland is again the topic of the day in England. At the end of 1866 and the beginning of 1867, one of the Irish land magnates, Lord Dufferin, set about its solution in <i>The Times.</i> “Wie menschlich von solch grossem Herrn!”
    hash: sha256:721fad0a11b5c3c58ba7cb13cf0fadeff03cfa545d4596a2830d94591cf65571
    state: active
  - id: p00304
    type: paragraph
    text: From Table E. we saw that, during 1864, of £4,368,610 of total profits, three surplus-value makers pocketed only £262,819; that in 1865, however, out of £4,669,979 total profits, the same three virtuosi of “abstinence” pocketed £274,528; in 1864, 26 surplus-value makers reached to £646,377; in 1865, 28 surplus-value makers reached to £736,448; in 1864, 121 surplus-value makers, £1,076,912; in 1865, 150 surplus-value makers, £1,320,906; in 1864, 1,131 surplus-value makers £2,150,818, nearly half of the total annual profit; in 1865, 1,194 surplus-value makers, £2,418,833, more than half of the total annual profit. But the lion’s share, which an inconceivably small number of land magnates in England, Scotland and Ireland swallow up of the yearly national rental, is so monstrous that the wisdom of the English State does not think fit to afford the same statistical materials about the distribution of rents as about the distribution of profits. Lord Dufferin is one of those land magnates. That rent-rolls and profits can ever be “excessive,” or that their plethora is in any way connected with plethora of the people’s misery is, of course, an idea as “disreputable” as “unsound.” He keeps to facts. The fact is that, as the Irish population diminishes, the Irish rent-rolls swell; that depopulation benefits the landlords, therefore also benefits the soil, and, therefore, the people, that mere accessory of the soil. He declares, therefore, that Ireland is still over-populated, and the stream of emigration still flows too lazily. To be perfectly happy, Ireland must get rid of at least one-third of a million of labouring men. Let no man imagine that this lord, poetic into the bargain, is a physician of the school of Sangrado, who as often as he did not find his patient better, ordered phlebotomy and again phlebotomy, until the patient lost his sickness at the same time as his blood. Lord Dufferin demands a new blood-letting of one-third of a million only, instead of about two millions; in fact, without the getting rid of these, the millennium in Erin is not to be. The proof is easily given.
    hash: sha256:c2fdb5a01ccab56f90f9f1d25b7fcaa5e695ef2cb18dec9e2d7c57ec04ba989d
    state: active
  - id: p00305
    type: table
