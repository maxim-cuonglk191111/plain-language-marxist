  - id: p00042
    type: footnote
    label: "23"
    text: "Price, l. c., p. 159. We are reminded of ancient Rome. “The rich had got possession of the greater part of the undivided land. They trusted in the conditions of the time, that these possessions would not be again taken from them, and bought, therefore, some of the pieces of land lying near theirs, and belonging to the poor, with the acquiescence of their owners, and took some by force, so that they now were cultivating widely extended domains, instead of isolated fields. Then they employed slaves in agriculture and cattle-breeding, because freemen would have been taken from labour for military service. The possession of slaves brought them great gain, inasmuch as these, on account of their immunity from military service, could freely multiply and have a multitude of children. Thus the powerful men drew all wealth to themselves, and all the land swarmed with slaves. The Italians, on the other hand, were always decreasing in number, destroyed as they were by poverty, taxes, and military service. Even when times of peace came, they were doomed to complete inactivity, because the rich were in possession of the soil, and used slaves instead of freemen in the tilling of it.” (Appian: “Civil Wars,” I.7.) This passage refers to the time before the Licinian rogations. Military service, which hastened to so great an extent the ruin of the Roman plebeians, was also the chief means by which, as in a forcing-house, Charlemagne brought about the transformation of free German peasants into serfs and bondsmen."
