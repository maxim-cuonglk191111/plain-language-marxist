  - id: p00049
    type: footnote
    label: "30"
    text: When the present Duchess of Sutherland entertained Mrs. Beecher Stowe, authoress of “Uncle Tom’s Cabin,” with great magnificence in London to show her sympathy for the Negro slaves of the American republic — a sympathy that she prudently forgot, with her fellow-aristocrats, during the civil war, in which every “noble” English heart beat for the slave-owner — I gave in the <i>New York Tribune</i> the facts about the Sutherland slaves. (Epitomised in part by Carey in “The Slave Trade.” Philadelphia, 1853, pp. 203, 204.) My article was reprinted in a Scotch newspaper, and led to a pretty polemic between the latter and the sycophants of the Sutherlands.
