  - id: p00048
    type: footnote
    label: "29"
    text: "“In the Highlands of Scotland,” says Buchanan, the commentator on Adam Smith, 1814, “the ancient state of property is daily subverted.... The landlord, without regard to the hereditary tenant (a category used in error here), now offers his land to the highest bidder, who, if he is an improver, instantly adopts a new system of cultivation. The land, formerly overspread with small tenants or labourers, was peopled in proportion to its produce, but under the new system of improved cultivation and increased rents, the largest possible produce is obtained at the least possible expense: and the useless hands being, with this view, removed, the population is reduced, not to what the land will maintain, but to what it will employ. “The dispossessed tenants either seek a subsistence in the neighbouring towns,” &amp;c. (David Buchanan: “Observations on, &amp;c., A. Smith’s Wealth of Nations.” Edinburgh, 1814, vol. iv., p. 144.) “The Scotch grandees dispossessed families as they would grub up coppice-wood, and they treated villages and their people as Indians harassed with wild beasts do, in their vengeance, a jungle with tigers.... Man is bartered for a fleece or a carcase of mutton, nay, held cheaper.... Why, how much worse is it than the intention of the Moguls, who, when they had broken into the northern provinces of China, proposed in council to exterminate the inhabitants, and convert the land into pasture. This proposal many Highland proprietors have effected in their own country against their own countrymen.” (George Ensor: “An Inquiry Concerning the Population of Nations.” Lond,. 1818, pp. 215, 216.)"
    hash: sha256:9d2413b47da3b8badf8e2fd22f51e2d044f755c2097e2248044a9ffa8ab89f5c
