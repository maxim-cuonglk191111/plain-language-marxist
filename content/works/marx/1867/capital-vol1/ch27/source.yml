  - id: p00028
    type: footnote
    label: "9"
    text: "The “spirit” of Protestantism may be seen from the following, among other things. In the south of England certain landed proprietors and well-to-do farmers put their heads together and propounded ten questions as to the right interpretation of the poor-law of Elizabeth. These they laid before a celebrated jurist of that time, Sergeant Snigge (later a judge under James I.) for his opinion. “Question 9 — Some of the more wealthy farmers in the parish have devised a skilful mode by which all the trouble of executing this Act (the 43rd of Elizabeth) might be avoided. They have proposed that we shall erect a prison in the parish, and then give notice to the neighbourhood, that if any persons are disposed to farm the poor of this parish, they do give in sealed proposals, on a certain day, of the lowest price at which they will take them off our hands; and that they will be authorised to refuse to any one unless he be shut up in the aforesaid prison. The proposers of this plan conceive that there will be found in the adjoining counties, persons, who, being unwilling to labour and not possessing substance or credit to take a farm or ship, so as to live without labour, may be induced to make a very advantageous offer to the parish. If any of the poor perish under the contractor’s care, the sin will lie at his door, as the parish will have done its duty by them. We are, however, apprehensive that the present Act (43rd of Elizabeth) will not warrant a prudential measure of this kind; but you are to learn that the rest of the freeholders of the county, and of the adjoining county of B, will very readily join in instructing their members to propose an Act to enable the parish to contract with a person to lock up and work the poor; and to declare that if any person shall refuse to be so locked up and worked, he shall be entitled to no relief. This, it is hoped, will prevent persons in distress from wanting relief, and be the means of keeping down parishes.” (R. Blakey: “The History of Political Literature from the Earliest Times.” Lond., 1855, Vol. II., pp. 84-85.) In Scotland, the abolition of serfdom took place some centuries later than in England. Even in 1698, Fletcher of Saltoun, declared in the Scotch parliament, “The number of beggars in Scotland is reckoned at not less than 200,000. The only remedy that I, a republican on principle, can suggest, is to restore the old state of serfdom, to make slaves of all those who are unable to provide for their own subsistence.” Eden, l. c., Book I., ch. 1, pp. 60-61, says, “The decrease of villenage seems necessarily to have been the era of the origin of the poor. Manufactures and commerce are the two parents of our national poor.” Eden, like our Scotch republican on principle, errs only in this: not the abolition of villenage, but the abolition of the property of the agricultural labourer in the soil made him a proletarian, and eventually a pauper. In France, where the expropriation was effected in another way, the ordonnance of Moulins, 1571, and the Edict of 1656, correspond to the English poor-laws."
