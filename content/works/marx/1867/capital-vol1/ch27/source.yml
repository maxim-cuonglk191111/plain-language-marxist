    label: "4"
    text: In his “Utopia,” Thomas More says, that in England “your shepe that were wont to be so meke and tame, and so smal eaters, now, as I heare saye, be become so great devourers and so wylde that they eate up, and swallow downe, the very men themselfes.” “Utopia,” transl. by Robinson, ed. Arber, Lond., 1869, p. 41.
