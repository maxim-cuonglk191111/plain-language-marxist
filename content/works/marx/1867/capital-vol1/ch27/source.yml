  - id: p00024
    type: footnote
    label: "5"
    text: Bacon shows the connexion between a free, well-to-do peasantry and good infantry. “This did wonderfully concern the might and mannerhood of the kingdom to have farms as it were of a standard sufficient to maintain an able body out of penury, and did in effect amortise a great part of the lands of the kingdom unto the hold and occupation of the yeomanry or middle people, of a condition between gentlemen, and cottagers and peasants.... For it hath been held by the general opinion of men of best judgment in the wars.... that the principal strength of an army consisteth in the infantry or foot. And to make good infantry it requireth men bred, not in a servile or indigent fashion, but in some free and plentiful manner. Therefore, if a state run most to noblemen and gentlemen, and that the husbandman and ploughmen be but as their workfolk and labourers, or else mere cottagers (which are but hous’d beggars), you may have a good cavalry, but never good stable bands of foot.... And this is to be seen in France, and Italy, and some other parts abroad, where in effect all is noblesse or peasantry.... insomuch that they are inforced to employ mercenary bands of Switzers and the like, for their battalions of foot; whereby also it comes to pass that those nations have much people and few soldiers.” (“The Reign of Henry VII.” Verbatim reprint from Kennet’s England. Ed. 1719. Lond., 1870, p. 308.)
