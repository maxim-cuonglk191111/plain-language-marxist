    text: In 1860 the people expropriated by force were exported to Canada under false pretences. Some fled to the mountains and neighbouring islands. They were followed by the police, came to blows with them and escaped.
    hash: sha256:d4782e5b105cec59a74f44bc8b0c13600a610b3964b833c1af1157fbdec4ad0c
