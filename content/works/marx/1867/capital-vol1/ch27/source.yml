    text: The deer-forests of Scotland contain not a single tree. The sheep are driven from, and then the deer driven to, the naked hills, and then it is called a deer-forest. Not even timber-planting and real forest culture.
    hash: sha256:38edfc600598b5fb9cd5c45e1818828ed1179957ec84e8d501903adf0640baed
