  - id: p00007
    type: footnote
    label: "3"
    text: "“Je permettrai,” says the capitalist, “que vous ayez l’honneur de me servir, à condition que vous me donnez le peu qui vous reste pour la peine que je prends de vous commander.” [I will allow you ... to have the honour of serving me, on condition that, in return for the pains I take in commanding you, you give me the little that remains to you] (J. J. Rousseau: “Discours sur l’Economie Politique.”)"
    hash: sha256:7d8d044f8387e288bc4ddf6016d7bf1cd6cacc6073ec1e8ea812c461a96245a9
    state: active
  - id: p00008
    type: footnote
    label: "4"
    text: Mirabeau, l.c., t.III, pp.20-109 passim. That Mirabeau considers the separate workshops more economical and productive than the “combined,” and sees in the latter merely artificial exotics under government cultivation, is explained by the position at that time of a great part of the continental manufactures.
    hash: sha256:81759cdc3f107fcd6166231cf0c1ddb6840712ff89222abc0c4a816a92b5b41f
    state: active
  - id: p00009
    type: footnote
    label: "5"
    text: “Twenty pounds of wool converted unobtrusively into yearly clothing of a labourer’s family by its own industry in the intervals of other works — this makes no show; but bring it to market, send it to the factory, thence to the broker, thence to the dealer, and you will have great commercial operations, and nominal capital engaged to the amount of twenty times its value.... The working-class is thus emersed to support a wretched factory population, a parastical shop-keeping class, and a fictitious commercial, monetary, and financial system.” (David Urquhart, l.c., p.120.)
    hash: sha256:cce09f28829b58010a0a35ccc9854c3556092e9197e30fa9b05f20a3ab87cc2c
    state: active
  - id: p00010
    type: footnote
    label: "6"
    text: Cromwell’s time forms an exception. So long as the Republic lasted, the mass of the English people of all grades rose from the degradation into which they had sunk under the Tudors.
    hash: sha256:f2213f1c0a5b32c84d4a166a4ad4b3de8933b79c25bfa8da19d4a3353f75c1fb
    state: active
  - id: p00011
    type: footnote
    label: "7"
    text: Tuckett is aware that the modern woollen industry has sprung, with the introduction of machinery, from manufacture proper and from the destruction of rural and domestic industries.<br/><br/>“The plough, the yoke, were ‘the invention of gods, and the occupation of heroes’; are the loom, the spindle, the distaff, of less noble parentage. You sever the distaff and the plough, the spindle and the yoke, and you get factories and poor-houses, credit and panics, two hostile nations, agriculture and commercial.” (David Urquhart, l.c., p.122.)<br/><br/>But now comes Carey, and cries out upon England, surely not with unreason, that it is trying to turn every other country into a mere agricultural nation, whose manufacturer is to be England. He pretends that in this way Turkey has been ruined, because “the owners and occupants of land have never been permitted by England to strengthen themselves by the formation of that natural alliance between the plough and the loom, the hammer and the harrow.” (“The Slave Trade,” p.125.) According to him, Urquhart himself is one of the chief agents in the ruin of Turkey, where he had made Free-trade propaganda in the English interest. The best of it is that Carey, a great Russophile by the way, wants to prevent the process of separation by that very system of protection which accelerates it.
    hash: sha256:0503bcc0edc4eb35e9857fb9388cd4a6538ad31bbe284423cca3965c0c9471d1
    state: active
  - id: p00012
    type: footnote
    label: "8"
    text: Philanthropic English economists, like Mill, Rogers, Goldwin Smith, Fawcett, &amp;c., and liberal manufacturers like John Bright &amp; Co., ask the English landed proprietors, as God asked Cain after Abel, Where are our thousands of freeholders gone? But where do <i>you</i> come from, then? From the destruction of those freeholders. Why don’t you ask further, where are the independent weavers, spinners, and artisans gone?<br/><br/>Transcribed by Zodiac<br/>Html Markup by Stephen Baird (1999)
    hash: sha256:510a979b5eafd47bea47a7fc97fdb9d0709210fdf6cbe9d8aaaaa2b0f49bed38
    state: active
