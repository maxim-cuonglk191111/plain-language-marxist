  - id: p00043
    type: footnote
    label: "11"
    text: 'John Fielden, l. c., pp. 5, 6. On the earlier infamies of the factory system, cf. Dr. Aikin (1795), l. c., p. 219. and Gisborne: “Enquiry into the Duties of Men,” 1795 Vol. II. When the steam-engine transplanted the factories from the country waterfalls to the middle of towns, the “abstemious” surplus-value maker found the child-material ready to his hand, without being forced to seek slaves from the workhouses. When Sir R. Peel (father of the “minister of plausibility"), brought in his bill for the protection of children, in 1815, Francis Horner, lumen of the Billion Committee and intimate friend of Ricardo, said in the House of Commons: “It is notorious, that with a bankrupt’s effects, a gang, if he might use the word, of these children had been put up to sale, and were advertised publicly as part of the property. A most atrocious instance had been brought before the Court of King’s Bench two years before, in which a number of these boys, apprenticed by a parish in London to one manufacturer, had been transferred to another, and had been found by some benevolent persons in a state of absolute famine. Another case more horrible had come to his knowledge while on a [Parliamentary] Committee ... that not many years ago, an agreement had been made between a London parish and a Lancashire manufacturer, by which it was stipulated, that with every 20 sound children one idiot should be taken.”'
    hash: sha256:17b03e8f7180fe07ccd2028e641b638c714bdb6071307869c1b167887dd2a5bc
