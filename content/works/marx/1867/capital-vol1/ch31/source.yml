  - id: p00047
    type: footnote
    label: "15"
    text: “Capital is said by a Quarterly Reviewer to fly turbulence and strife, and to be timid, which is very true; but this is very incompletely stating the question. Capital eschews no profit, or very small profit, just as Nature was formerly said to abhor a vacuum. With adequate profit, capital is very bold. A certain 10 per cent. will ensure its employment anywhere; 20 per cent. certain will produce eagerness; 50 per cent., positive audacity; 100 per cent. will make it ready to trample on all human laws; 300 per cent., and there is not a crime at which it will scruple, nor a risk it will not run, even to the chance of its owner being hanged. If turbulence and strife will bring a profit, it will freely encourage both. Smuggling and the slave-trade have amply proved all that is here stated.” (T. J. Dunning, l. c., pp. 35, 36.)<br/><br/>Transcribed by Zodiac<br/>Html Markup by Stephen Baird (1999)
