    type: footnote
    label: "12"
    text: "In 1790, there were in the English West Indies ten slaves for one free man, in the French fourteen for one, in the Dutch twenty-three for one. (Henry Brougham: “An Inquiry into the Colonial Policy of the European Powers.” Edin. 1803, vol. II., p. 74.)"
    hash: sha256:2316bc05c231ca5c0b682fabc732edc4b3cbe4dcbfd7778d4eea1b67126d42a6
    state: active
  - id: p00045
    type: footnote
    label: "13"
    text: The phrase, “labouring poor,” is found in English legislation from the moment when the class of wage labourers becomes noticeable. This term is used in opposition, on the one hand, to the “idle poor,” beggars, etc., on the other to those labourers, who, pigeons not yet plucked, are still possessors of their own means of labour. From the Statute Book it passed into Political Economy, and was handed down by Culpeper, J. Child, etc., to Adam Smith and Eden. After this, one can judge of the good faith of the “execrable political cant-monger,” Edmund Burke, when he called the expression, “labouring poor,” — “execrable political cant.” This sycophant who, in the pay of the English oligarchy, played the romantic laudator temporis acti against the French Revolution, just as, in the pay of the North American Colonies, at the beginning of the American troubles, he had played the Liberal against the English oligarchy, was an out and out vulgar bourgeois. “The laws of commerce are the laws of Nature, and therefore the laws of God.” (E. Burke, l. c., pp. 31, 32.) No wonder that, true to the laws of God and of Nature, he always sold himself in the best market. A very good portrait of this Edmund Burke, during his liberal time, is to be found in the writings of the Rev. Mr. Tucker. Tucker was a parson and a Tory, but, for the rest, an honourable man and a competent political economist. In face of the infamous cowardice of character that reigns today, and believes most devoutly in “the laws of commerce,” it is our bounden duty again and again to brand the Burkes, who only differ from their successors in one thing — talent.
    hash: sha256:7706d88ff005758c12beff82f741600d9c75b85ab5ca2c9b3ec9d6e184e344d9
    state: active
