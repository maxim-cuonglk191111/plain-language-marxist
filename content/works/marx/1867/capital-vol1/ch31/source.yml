  - id: p00036
    type: footnote
    label: "4"
    text: "William Howitt: “Colonisation and Christianity: A Popular History of the Treatment of the Natives by the Europeans in all their Colonies.” London, 1838, p. 9. On the treatment of the slaves there is a good compilation in Charles Comte, “Traité de la Législation.” 3me éd. Bruxelles, 1837. This subject one must study in detail, to see what the bourgeoisie makes of itself and of the labourer, wherever it can, without restraint, model the world after its own image."
