term: class-antagonism
original:
  sg: class antagonism
  pl: class antagonisms
definition:
  short: Opposed and conflicting interests between social classes, open or hidden.
renderings:
  class-conflict:
    forms:
      sg: class conflict
      pl: class conflicts
    reason: Common modern wording for the same idea.
    limitation: '"Antagonism" stresses a built-in opposition of interests, not only open conflict.'
