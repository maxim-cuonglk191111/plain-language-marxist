schema_version: 5
term: manufacture
original:
  sg: manufacture
definition:
  short: Production by hand in workshops, with the work divided among many workers. It came before machines took over.
  long: |-
    Manufacture was a stage between the guild workshop and the modern factory. Many workers came together under one owner. Each did one small part of the job, but still by hand.

    This division of labour inside each workshop made production faster. Then steam and machinery replaced manufacture with Modern Industry.
example:
  document: document:marx:1848:communist-manifesto:ch01
  passage: p00016
  text: The manufacturing system took its place.
not_to_confuse: Today “manufacture” means making anything, often with machines. Here it means the older stage of hand production in divided workshops.
related: [modern-industry, division-of-labour, guild-master]
renderings:
  keep:
    forms:
      sg: manufacture
    reason: Kept as written, because the historical meaning differs from today's general sense; the term card explains it.
default: keep
