schema_version: 2
term: vassal
original:
  sg: vassal
  pl: vassals
definition:
  short: In feudal Europe, a person who held land from a lord and owed him loyalty and military service.
  long: |-
    A vassal was not a serf. He was often a knight or a lesser noble. He received land, called a fief, and in return had to fight for his lord.

    Vassals could have their own vassals and serfs below them. This chain of loyalty held feudal society together.
example:
