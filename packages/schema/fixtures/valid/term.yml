schema_version: 5
term: bourgeoisie
aliases: [bourgeois class]
original:
  sg: bourgeoisie
  adj: bourgeois
definition:
  short: The class that owns the means of production and employs wage labour.
senses:
  - scope: work:marx:1848:communist-manifesto
    short: The modern capitalist class that owns the social means of production.
    sources:
      - title: Manifesto of the Communist Party
        author: Karl Marx & Frederick Engels
        year: 1848
renderings:
  capitalist-class:
    forms:
      sg: capitalist class
      adj: capitalist
    reason: Immediately understandable to contemporary readers.
    limitation: Foregrounds the economic sense more than the historical term.
  bourgeoisie:
    forms:
      sg: bourgeoisie
      adj: bourgeois
    reason: Keeps the original term.
default: capitalist-class
scoped_defaults:
  - scope: work:engels:1880:socialism-utopian-scientific
    rendering: bourgeoisie
